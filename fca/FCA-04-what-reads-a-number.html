.thread{position:absolute;top:34px;right:96px;font-family:var(--mono);font-size:14px;letter-spacing:.14em;

.bits.b .one{background:var(--good);border-color:var(--good)}
.bits.op .one{background:var(--gold);border-color:var(--gold)}
.bits.res b{cursor:default}
.bits.res b.one{background:var(--ink);border-color:var(--ink);color:#fff}
.bits.res b:hover{transform:none;border-color:var(--rule2)}
.blab{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}

.units{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:14px 0}

  transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}

.unit.sel .nm{color:var(--accent)} .unit.sel .vl{color:var(--accent)}
.flags{display:flex;gap:9px;margin-top:8px}

  border:1px solid var(--rule2);color:var(--rule2);transition:.18s}
.flag.on{background:var(--fail);border-color:var(--fail);color:#fff}

.rip{display:flex;gap:8px;justify-content:center;margin:8px 0}
.rip .st{flex:1;border:1px solid var(--rule2);border-radius:8px;padding:11px 8px;text-align:center;background:#f6f4ef;transition:.22s}
.rip .st.live{background:var(--mark);border-color:var(--gold);transform:translateY(-6px)}
.rip .st.done{background:var(--good-soft);border-color:var(--good)}
.rip .st .h{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--soft)}
.rip .st .v{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--ink);margin-top:4px}

/* the data flow */
.flowbox{transition:fill .25s ease,stroke .25s ease,stroke-width .25s ease}

.frag.shown{opacity:1}
.cue{position:absolute;left:96px;right:96px;bottom:92px;display:none;padding:13px 17px;
  border-left:4px solid var(--fail);background:var(--fail-soft);color:#8a2420;font-size:19px;line-height:1.42;font-style:italic;z-index:6}
body.cues .cue{display:block}
.cue b{font-style:normal}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:66px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:22px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:21px;color:var(--body);display:flex;gap:18px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}

@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag,.bits b,.unit,.rip .st,.flowbox,.flowwire{transition:none}}

<body>

<div id="stage">
  <div class="eyebrow">Fundamentals of Computer Architecture &nbsp;·&nbsp; <b>Class 04</b></div>
  <div class="thread" id="thread"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 4 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-th="">
  <div>
    <div class="kicker">Class 04 · last hour of week one</div>
    <h1>What reads<br>a number?</h1>
    <p class="big" style="margin-top:40px;max-width:38ch">Three hours on what a number is. Not one minute on anything that does something with one.</p>
  </div>
  <div class="cue"><b>Read this before you start.</b> This hour is also your measurement. Six questions are scattered through it, marked gold on the rail. Nothing is badged as a test and the room should never feel examined. Note who answers, who hesitates, and where the silence is. The closing cue tells you what each one meant.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="The gap" data-th="a circuit">
  <div>
    <div class="kicker grey">where week one got to</div>
    <h2 style="margin-bottom:24px">You own representation<br>completely.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>Whole numbers on a wheel. Fractions with a fixed point. Floats with a scale that runs out at both ends.</p>
        <p class="frag">And a machine that can hold all of them and do nothing to any of them.</p>
      </div>
      <div class="stack frag">
        <p class="big">Representation without operation is a filing cabinet.</p>
        <p class="small">Today we build the thing that reads what is in the cabinet. By the end there is one diagram on the screen, and it is the shape of every processor ever made.</p>
      </div>
    </div>
  </div>
  <div class="cue">Name the destination now. One diagram, assembled in front of them, and it will be on the last slide complete. People follow a build better when they know a build is happening.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="A gate" data-th="a circuit">
  <div>
    <div class="kicker">the smallest thing that reads a pattern</div>
    <h2 style="margin-bottom:22px">A gate does not pass<br>its input through.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>It looks at the voltage on its inputs, makes a decision, and then <strong>re-drives its output</strong> to a clean full rail using its own power supply.</p>
        <p class="frag">So a slightly degraded input produces a perfectly clean output.</p>
      </div>
      <div class="stack frag">
        <p class="big">That is why you can wire fifty billion of them together and the last one is as crisp as the first.</p>
        <p class="small">An analog chain degrades a little at every stage. A digital chain does not degrade at all, and that single property is the reason everything is digital.</p>
      </div>
    </div>
  </div>
  <div class="cue">Restoration is skipped in almost every course and it is the real answer to "why digital". Ninety seconds, no more.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Specify it" data-th="a circuit" data-q="1">
  <div>
    <div class="kicker gold">so how do you tell one what to decide</div>
    <div class="ask"><p>A microwave runs when the door is shut <em>and</em> start is pressed. Write that so a machine could check it.</p></div>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p class="small">Ninety seconds on paper, then somebody puts it up.</p>
        <p class="frag">A truth table is not a technique you apply to problems. It is what a specification looks like once every ambiguity has been squeezed out of it.</p>
      </div>
      <div class="frag">
        <table class="tt">
          <tr><th>door shut</th><th>start</th><th>run</th></tr>
          <tr><td>0</td><td>0</td><td class="out">0</td></tr>
          <tr><td>0</td><td>1</td><td class="out">0</td></tr>
          <tr><td>1</td><td>0</td><td class="out">0</td></tr>
          <tr><td>1</td><td>1</td><td class="out">1</td></tr>
        </table>
      </div>
    </div>
  </div>
  <div class="cue"><b>Question one.</b> A confident room draws four rows in half a minute. A shaky one writes an English sentence or two rows. If somebody asks what happens when the door opens mid-cycle, that is the best answer in the room and you should say so.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Any table at all" data-th="a circuit" data-q="1">
  <div>
    <div class="kicker gold">and the part that makes tables worth anything</div>
    <div class="ask"><p>This output column came from a coin. Can you still build a circuit for it?</p></div>
    <div class="split" style="gap:50px">
      <div>
        <table class="tt">
          <tr><th>a</th><th>b</th><th>c</th><th>out</th></tr>
          <tr><td>0</td><td>0</td><td>0</td><td class="q">1</td></tr>
          <tr><td>0</td><td>1</td><td>1</td><td class="q">1</td></tr>
          <tr><td>1</td><td>0</td><td>0</td><td class="q">1</td></tr>
          <tr><td>1</td><td>0</td><td>1</td><td class="q">1</td></tr>
        </table>
        <p class="small" style="margin-top:10px">the four rows that matter · the others are zero</p>
      </div>
      <div class="stack">
        <p class="frag">Read a row. Use the variable where the bit is one, its inverse where the bit is zero, and AND them. That circuit fires on exactly that row and nothing else.</p>
        <p class="frag">Do that for every row you want, then OR the lot together.</p>
        <p class="big frag">No insight anywhere. It is a procedure, and it works on <span class="mark">any table you can write.</span></p>
      </div>
    </div>
  </div>
  <div class="cue"><b>Question two.</b> Demonstrating on nonsense is deliberate. On a meaningful function students quietly conclude the meaning helped. If the room has this, they say "sum of products" in one breath. If they do not, the logic layer is missing and the next arc needs two extra hours.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Arithmetic falls out" data-th="arithmetic" data-q="1">
  <div>
    <div class="kicker gold">so point it at something worth having</div>
    <div class="ask"><p>What does adding two single bits require? Write the table.</p></div>
    <div class="split" style="gap:50px">
      <div class="frag">
        <table class="tt">
          <tr><th>a</th><th>b</th><th>sum</th><th>carry</th></tr>
          <tr><td>0</td><td>0</td><td class="out">0</td><td class="out">0</td></tr>
          <tr><td>0</td><td>1</td><td class="out">1</td><td class="out">0</td></tr>
          <tr><td>1</td><td>0</td><td class="out">1</td><td class="out">0</td></tr>
          <tr><td>1</td><td>1</td><td class="out">0</td><td class="out">1</td></tr>
        </table>
      </div>
      <div class="stack">
        <p class="frag">Four rows, two output columns. You have owned the machinery to turn that into a circuit since the last slide.</p>
        <p class="big frag">Sum is <span class="num">XOR</span>. Carry is <span class="num">AND</span>.</p>
        <p class="small frag">Notice what happened. Nobody reasoned about arithmetic. Four sums you learned as a child, one mechanical procedure, and <strong>arithmetic came out the other end.</strong></p>
      </div>
    </div>
  </div>
  <div class="cue"><b>Question three, and the sharpest instrument in the hour.</b> The tell is whether they produce <em>two</em> output columns unprompted. One column means they have not internalised that one plus one does not fit in one bit.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="★ Four bits" data-th="arithmetic">
  <div>
    <div class="kicker">chain four and step the carry through</div>
    <div class="panel">
      <span class="lab">4-bit ripple carry · 0111 + 0011</span>
      <div class="rip" id="ripRow"></div>
      <table class="readout" style="margin-top:4px">
        <tr><td>result so far</td><td id="ripOut">····</td></tr>
        <tr><td>carry travelling</td><td class="bad" id="ripC">—</td></tr>
      </table>
      <div class="btnrow">
        <button class="btn hot" id="ripNext">next stage</button>
        <button class="btn" id="ripAuto">run it</button>
        <button class="btn" id="ripR">reset</button>
      </div>
    </div>
    <p class="big frag" style="margin-top:20px;max-width:72ch">Bit three cannot decide until bit two has decided. <span class="mark">The carry is the only slow thing in here</span>, and every fast adder ever designed is an attack on that one signal.</p>
  </div>
  <div class="cue">Run it and let the gold block travel left. Ask what happens at sixty four bits. The answer is that the adder alone would set the clock speed of the machine, which is a thread we pick up much later.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Subtract for free" data-th="arithmetic" data-q="1">
  <div>
    <div class="kicker gold">you have an adder and nothing else</div>
    <div class="ask"><p>How much extra hardware do you need to subtract?</p></div>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p class="small">Think about the wheel from last hour before you answer.</p>
      </div>
      <div class="stack frag">
        <p class="big">One row of inverters and a one on the carry in.</p>
        <p><span class="num">a − b</span> is <span class="num">a + (−b)</span>, and minus b on the wheel is b inverted, plus one. The inverters invert. The carry in is the plus one.</p>
        <p class="small">Not one gate of the adder changes. This is the same fact you met last hour when an unsigned adder produced correct signed answers.</p>
      </div>
    </div>
  </div>
  <div class="cue"><b>Question four, and it audits Class 3.</b> "Invert and add one" means two's complement is a mechanism to them. Reaching for a separate subtractor means it is vocabulary, and you should re-run the wheel before Class 5.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Four circuits, two wires" data-th="selection" data-q="1">
  <div>
    <div class="kicker">so count what is on the bench now</div>
    <div class="grid4" style="margin-bottom:24px">
      <div class="panel"><span class="n">CIRCUIT</span><h3>ADD</h3><p class="cap">the chain from two slides ago</p></div>
      <div class="panel"><span class="n">CIRCUIT</span><h3>SUB</h3><p class="cap">the same chain with inverters</p></div>
      <div class="panel"><span class="n">CIRCUIT</span><h3>AND</h3><p class="cap">four gates, one per bit</p></div>
      <div class="panel"><span class="n">CIRCUIT</span><h3>OR</h3><p class="cap">four gates, one per bit</p></div>
    </div>
    <div class="ask"><p>All four want the same two inputs and the same output wires. Do you route the operands to the one you want, or send them to all four and pick which answer escapes?</p></div>
  </div>
  <div class="cue"><b>Question five.</b> Most rooms say route, because it sounds efficient. The moment worth waiting for is somebody objecting that routing is itself a selection problem, one step earlier. If that comes from the room, this cohort runs at full speed.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Send them everywhere" data-th="selection">
  <div>
    <div class="kicker grey">and the answer is the wasteful-sounding one</div>
    <h2 style="margin-bottom:22px">Every unit computes,<br>every time.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>Routing needs a circuit that decides where to send things, which is the same problem one step earlier and no easier.</p>
        <p class="frag">Choosing what to keep needs one multiplexer, and a multiplexer is four AND gates and an OR.</p>
      </div>
      <div class="stack frag">
        <p class="big">So all four run, and three answers are thrown away.</p>
        <p class="small">The objection deserves a real reply. Those units are on the silicon whether they run or not, so idling one recovers no area. They do burn power, which is why real processors gate the clock to unused units. Parallelism in hardware is free in time. Routing is not.</p>
      </div>
    </div>
  </div>
  <div class="cue">This is the sentence that transfers furthest in the whole course, and it is exactly backwards in software. Say that out loud. It comes back when we measure anything.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="Nobody invented the opcode" data-th="selection">

          <tr><td>11</td><td class="out">OR</td></tr>

        <p class="frag">Four circuits needs two select lines. Eight needs three. Sixteen needs four.</p>
        <p class="big frag">That width was never a convention somebody chose. It is forced by how many circuits the machine contains.</p>
        <p class="small frag">Those select lines are an opcode, and <strong>nobody had to invent it.</strong> It fell out of needing a multiplexer.</p>
      </div>

<!-- 13 -->
<section class="slide" data-t="Where do they come from?" data-th="storage" data-q="1">
  <div>
    <div class="kicker gold">use it for something</div>
    <div class="ask"><p>Compute the sum of one to five on that machine. What stops you?</p></div>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p class="small">Try it on the widget behind you. Set one and two, take the answer, then add three to it.</p>
      </div>
      <div class="stack frag">
        <p class="big">The answer is a voltage on the output wires that exists only while the inputs are held.</p>
        <p>Change the inputs and it is gone. There is nowhere to put anything.</p>
        <p class="small">And there is a second problem, quieter than the first. Somebody is setting those two gold bits by hand at every step. <em>Add, add, add, add</em> is information, and it is not in the machine.</p>
      </div>
    </div>
  </div>
  <div class="cue"><b>Question six.</b> Nearly every room finds the storage problem. Far fewer find the second one. If somebody says "you are choosing the operation each time", they have independently found the stored program idea and you should name them for it.</div>

<!-- 14 -->
<section class="slide" data-t="Registers" data-th="storage">
  <div>
    <div class="kicker grey">so add the two things that are missing</div>
    <h2 style="margin-bottom:22px">Somewhere to keep values,<br>and somewhere to keep<br>the choice.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>A register holds a value without the inputs staying put, takes a new one only when told, and presents it continuously.</p>
        <p class="frag">Several of them, individually addressable, is a register file. Two read ports feed the two operands. One write port catches the result.</p>
      </div>
      <div class="stack frag">
        <p class="big">And the select lines come from a register too.</p>
        <p class="small">Because they are a binary number, and a register is where binary numbers live. Nothing in the hardware marks one register as holding a choice and another as holding a value.</p>
      </div>
    </div>
  </div>
  <div class="cue">Do not build a latch today. Note whether the word "register" needed explaining, because that decides how much of the storage arc you rebuild later.</div>
</section>

  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag, .fragsvg').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'){ if(k==='Escape') e.target.blur(); return; }
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||
       e.target.closest('.bits')||e.target.closest('input')||e.target.closest('svg')) return;
    if(e.clientX<innerWidth*0.26) prev(); else next();
  });

  function strip(host,n,get,set){
    var cells=[],last=null;
    for(var k=0;k<n;k++){
      var b=document.createElement('b'); b.textContent='0'; b.tabIndex=0;
      host.appendChild(b); cells.push(b);
      (function(kk){
        function go(){ set(get()^(1<<(n-1-kk))); }
        b.onclick=go;
        b.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} };
      })(k);
    }
    return function(v){
      for(var k=0;k<n;k++){
        var bit=(v>>(n-1-k))&1;
        if(last!==null && ((last>>(n-1-k))&1)!==bit){
          (function(c){ c.classList.add('flip'); setTimeout(function(){c.classList.remove('flip');},200); })(cells[k]);
        }
        cells[k].textContent=bit; cells[k].className=bit?'one':'';
      }
      last=v;
    };
  }

  /* ===== 07 · ripple carry ===== */
  var ripNext=document.getElementById('ripNext');
  if(ripNext){
    var A=[1,1,1,0], B=[1,1,0,0];
    var sum=[0,0,0,0], cy=[0,0,0,0,0];
    (function(){ var c=0; for(var k=0;k<4;k++){ var s=A[k]+B[k]+c; sum[k]=s&1; c=s>>1; cy[k+1]=c; } })();
    var host=document.getElementById('ripRow'), step=0, tm=null;
    for(var k=3;k>=0;k--){
      var d=document.createElement('div'); d.className='st'; d.dataset.k=k;
      d.innerHTML='<div class="h">BIT '+k+'</div><div class="v">\u00b7</div><div class="cin"></div>';
      host.appendChild(d);
    }
    function rip(){
      [].forEach.call(host.children,function(d){
        var k=+d.dataset.k;
        d.className='st'+(step===k+1?' live':(step>k+1?' done':''));
        d.querySelector('.v').textContent = step>k ? sum[k] : '\u00b7';
        d.querySelector('.cin').textContent = (step>k && cy[k]) ? 'carry in 1' : '';
      });
      document.getElementById('ripOut').textContent=[3,2,1,0].map(function(k){ return step>k?sum[k]:'\u00b7'; }).join('');
      var c=document.getElementById('ripC');
      if(step===0) c.textContent='\u2014';
      else if(step<4) c.textContent=cy[step]?'yes, into bit '+step:'none';
      else c.textContent=cy[4]?'fell off the top':'none';
    }
    ripNext.onclick=function(){ if(step<5){step++;rip();} };
    document.getElementById('ripAuto').onclick=function(){
      if(tm){clearInterval(tm);tm=null;return;}
      tm=setInterval(function(){ if(step>=5){clearInterval(tm);tm=null;return;} step++; rip(); },600);
    };
    document.getElementById('ripR').onclick=function(){ if(tm){clearInterval(tm);tm=null;} step=0; rip(); };
    rip();
  }

  /* ===== 11 · the tiny ALU ===== */
  function units4(a,b,op){
    var raw=[(a+b),(a+((~b)&15)+1),(a&b),(a|b)];
    return { res:raw.map(function(v){return v&15;}), carry:(op<2)?((raw[op]>>4)&1):0 };
  }
  var aH=document.getElementById('aBits');
  if(aH){
    var A4=7,B4=3,OP=0;
    var setA=strip(aH,4,function(){return A4;},function(v){A4=v&15;alu();});
    var setB=strip(document.getElementById('bBits'),4,function(){return B4;},function(v){B4=v&15;alu();});
    var setO=strip(document.getElementById('opBits'),2,function(){return OP;},function(v){OP=v&3;alu();});
    var uHost=document.getElementById('units'), names=['ADD','SUB','AND','OR'], uEls=[];
    names.forEach(function(nm){
      var d=document.createElement('div'); d.className='unit';
      d.innerHTML='<div class="nm">'+nm+'</div><div class="vl">0</div>';
      uHost.appendChild(d); uEls.push(d);
    });
    strip(document.getElementById('rBits'),4,function(){return 0;},function(){});
    var fHost=document.getElementById('flags'), fEls={};
    ['Z','N','C','V'].forEach(function(nm){
      var s=document.createElement('span'); s.className='flag'; s.textContent=nm;
      fHost.appendChild(s); fEls[nm]=s;
    });
    function alu(){
      var u=units4(A4,B4,OP), res=u.res;
      var bx=OP===1?((~B4)&15):B4;
      var v=(OP<2)?((((A4>>3)&1)===((bx>>3)&1)) && (((res[OP]>>3)&1)!==((A4>>3)&1))?1:0):0;
      uEls.forEach(function(d,k){ d.className='unit'+(k===OP?' sel':''); d.querySelector('.vl').textContent=res[k]; });
      setA(A4); setB(B4); setO(OP);
      var r=res[OP];
      [].forEach.call(document.getElementById('rBits').children,function(b,k){
        var bit=(r>>(3-k))&1; b.textContent=bit; b.className=bit?'one':'';
      });
      fEls.Z.className='flag'+(r===0?' on':'');
      fEls.N.className='flag'+(((r>>3)&1)?' on':'');
      fEls.C.className='flag'+(u.carry?' on':'');
      fEls.V.className='flag'+(v?' on':'');
      var symb=['+','\u2212','AND','OR'][OP];
      document.getElementById('aluTxt').textContent=A4+' '+symb+' '+B4+' = '+r+((OP<2&&u.carry)?'  (carry out)':'');
    }
    alu();
  }

  /* ===== 16 · the data flow ===== */
  var iH=document.getElementById('iBits');
  if(iH){
    var W=0x00, R=[0,0,0,0], litT=null;
    var setI=strip(iH,8,function(){return W;},function(v){W=v&255;ins();});
    var labs=document.getElementById('iLabs');
    [['op',2],['rd',2],['ra',2],['rb',2]].forEach(function(p){
      var d=document.createElement('div');
      d.style.cssText='flex:0 0 '+(p[1]*50+(p[1]-1)*5)+'px;text-align:center;font-family:var(--mono);'+
        'font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)';
      d.textContent=p[0]; labs.appendChild(d);
    });
    function clearLit(){
      [].forEach.call(document.querySelectorAll('.flowwire,.flowbox'),function(e){
        e.classList.remove('lit'); e.classList.remove('litbox'); e.classList.remove('dim');
      });
    }
    function ins(){
      setI(W);
      var op=(W>>6)&3, rd=(W>>4)&3, ra=(W>>2)&3, rb=W&3;
      var nm=['add','sub','and','or'][op];
      document.getElementById('iNum').textContent=W+'  ('+W.toString(2).padStart(8,'0')+')';
      document.getElementById('iAsm').textContent=nm+' r'+rd+', r'+ra+', r'+rb;
      document.getElementById('iRegs').textContent=R.join(' ');
      document.getElementById('fOp').textContent='op '+op.toString(2).padStart(2,'0');
      document.getElementById('fRd').textContent='rd '+rd;
      document.getElementById('fRa').textContent='ra '+ra;
      document.getElementById('fRb').textContent='rb '+rb;
      document.getElementById('fRegs').textContent=R.map(function(v,k){return 'r'+k+'='+v;}).join('  ');
      var u=units4(R[ra],R[rb],op);
      for(var k=0;k<4;k++){
        var t=document.getElementById('u'+k);
        t.textContent=u.res[k];
        t.setAttribute('fill', k===op ? '#a8231f' : '#8b9096');
      }
      document.getElementById('fBus').textContent='A = r'+ra+' = '+R[ra]+'   \u00b7   B = r'+rb+' = '+R[rb];
      document.getElementById('fResV').textContent=u.res[op];
      clearLit();
      for(var k=0;k<4;k++) if(k!==op) document.getElementById('m'+k).classList.add('dim');
      document.getElementById('m'+op).classList.add('lit');
      document.getElementById('fUnits').children[op].classList.add('litbox');
      document.getElementById('wSel').classList.add('lit');
    }
    document.getElementById('iRun').onclick=function(){
      var op=(W>>6)&3, rd=(W>>4)&3, ra=(W>>2)&3, rb=W&3;
      var u=units4(R[ra],R[rb],op);
      R[rd]=u.res[op];
      ins();
      var wb=document.getElementById('wWb');
      wb.classList.add('lit');
      if(litT) clearTimeout(litT);
      litT=setTimeout(function(){ wb.classList.remove('lit'); },900);
    };
    document.getElementById('iRnd').onclick=function(){ W=Math.floor(Math.random()*256); ins(); };
    document.getElementById('iRst').onclick=function(){ R=[0,1,2,3]; ins(); };
    R=[0,1,2,3];
    ins();
  }

  paint();
})();
</script>
</body>
</html>
