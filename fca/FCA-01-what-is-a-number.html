<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCA Class 1 · What is a number?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de;
  --stage:#faf9f6;
  --card:#ffffff;
  --ink:#15171b;
  --body:#4b5057;
  --soft:#8b9096;
  --rule:#e2e0d9;
  --rule2:#c6c3ba;
  --accent:#23408f;
  --accent-soft:#eaeef7;
  --fail:#a8231f;
  --fail-soft:#fbeeed;
  --good:#1d6b45;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{
  position:absolute;top:50%;left:50%;
  width:1600px;height:900px;
  transform-origin:50% 50%;
  background:var(--stage);
  box-shadow:0 24px 70px rgba(20,22,28,.16);
  overflow:hidden;
}
.slide{position:absolute;inset:0;padding:74px 96px 108px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:34px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
#rail{position:absolute;left:96px;right:96px;bottom:38px;display:flex;gap:4px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:62px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:62px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.kicker.grey{color:var(--soft)}
.kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:104px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:66px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:30px}
h3{font-weight:700;font-size:24px;color:var(--ink);margin-bottom:8px;line-height:1.25}
p{font-size:30px;line-height:1.48;max-width:30ch}
p+p{margin-top:18px}
.big{font-size:40px;line-height:1.3;color:var(--ink);font-weight:300;max-width:24ch}
.small{font-size:22px;line-height:1.5;color:var(--soft);max-width:56ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;color:var(--accent);background:var(--accent-soft);padding:.06em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.l{grid-template-columns:1.06fr .94fr}
.split.r{grid-template-columns:.9fr 1.1fr}
.stack>*+*{margin-top:20px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 32px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid3 .panel,.grid4 .panel{padding:24px 22px}
.grid3 h3,.grid4 h3{font-size:21px}
.grid3 .cap,.grid4 .cap{font-size:19px;line-height:1.4;color:var(--body);margin-top:10px}
.grid3 .n,.grid4 .n{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--soft);display:block;margin-bottom:14px}

input[type=text],input[type=number]{font-family:var(--mono);font-size:26px;background:var(--stage);color:var(--ink);border:2px solid var(--rule2);border-radius:7px;padding:6px 10px;width:9ch}
.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);border:1px solid var(--rule2);border-radius:7px;padding:11px 16px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:19px;padding:7px 14px;border:1px solid var(--rule2);border-radius:6px;background:var(--stage);cursor:pointer;color:var(--body)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:13px 4px;border-bottom:1px solid var(--rule);font-size:26px}
.readout td:first-child{color:var(--soft);font-size:15px;letter-spacing:.12em;text-transform:uppercase;width:13rem;vertical-align:middle}
.readout td:last-child{color:var(--ink);text-align:right;font-weight:700}
.readout tr:last-child td{border-bottom:none}
.readout td.bad{color:var(--fail)}
.readout td.good{color:var(--good)}
.readout td.tiny{font-size:17px;font-weight:400;word-break:break-all;line-height:1.5}

pre{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.65;color:#d9dee6;box-shadow:0 14px 34px rgba(20,22,28,.22);overflow:hidden}
pre .c{color:#7f8896;font-style:italic}
pre .k{color:#ff96a2}
pre .s{color:#ffd47e}
pre .f{color:#84d8ea}
.term{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.8;color:#9fe8b8;box-shadow:0 14px 34px rgba(20,22,28,.22)}
.term .dim{color:#7f8896}
.term .hit{color:#ffd47e;font-weight:700}

figure{width:100%}
figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:14px}
svg text{font-family:'JetBrains Mono',monospace}

table.pv{border-collapse:collapse;font-family:var(--mono);font-size:21px}
table.pv td,table.pv th{border:1px solid var(--rule2);padding:9px 16px;text-align:center}
table.pv th{background:#f1efe9;font-weight:400;color:var(--soft);font-size:16px;letter-spacing:.06em}
table.pv td.hi{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.pv td.no{background:var(--fail-soft);color:var(--fail);font-weight:700}

.steps{font-family:var(--mono);font-size:24px;line-height:1.95}
.steps .row{display:flex;gap:26px;align-items:baseline;opacity:.16;transition:opacity .22s}
.steps .row.show{opacity:1}
.steps .row .bit{color:var(--accent);font-weight:700;min-width:1.4em}
.steps .row.rep{color:var(--fail)}
.steps .row.rep .bit{color:var(--fail)}
.steps .row .rem{color:var(--soft);font-size:19px}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{
  position:absolute;left:96px;right:96px;bottom:92px;display:none;
  padding:14px 18px;border-left:4px solid var(--fail);background:var(--fail-soft);
  color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6;
}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:80px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:28px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:24px;color:var(--body);display:flex;gap:20px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Fundamentals of Computer Architecture &nbsp;·&nbsp; <b>Class 01</b></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 1 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title">
  <div>
    <div class="kicker">Class 01 · hour one of fifty-four</div>
    <h1>What is<br>a number?</h1>
    <p class="big" style="margin-top:44px;max-width:32ch">Three programs. Nine lines between them. All three print something a seven-year-old would tell you is wrong.</p>
  </div>
  <div class="cue">No syllabus. No introductions. First program on screen inside ninety seconds.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Ground rules">
  <div>
    <div class="kicker grey">before we start</div>
    <h2>All three are correct code.</h2>
    <div class="split">
      <div class="stack">
        <p>No trick syntax. No undefined behaviour. Nothing deprecated. Every one compiles clean with every warning switched on.</p>
        <p>So the question is not what the programmer got wrong.</p>
      </div>
      <div class="stack">
        <p class="big frag">The question is what these three have in common.</p>
        <p class="small frag">Write your guess down now. Actually write it. You have about twenty-five minutes.</p>
      </div>
    </div>
  </div>
  <div class="cue">Make them physically write it. People who commit to a wrong answer remember the right one.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="① the program">
  <div>
    <div class="kicker">the first one</div>
    <h2 style="margin-bottom:22px">A sum a child could do.</h2>
    <div class="split l" style="gap:56px">
      <div>
<pre><span class="c">// tenth.c</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    printf(<span class="s">"%.17g\n"</span>, <span class="s">0.1</span> + <span class="s">0.2</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div class="stack">
        <p>One tenth plus two tenths. Every seven-year-old in the world knows this one.</p>
        <p class="big frag" style="margin-top:10px">Before I compile it, write down what it prints.</p>
        <p class="small frag">Not roughly. Exactly. To the last digit.</p>
      </div>
    </div>
  </div>
  <div class="cue">Type it live, don't paste. Take three predictions out loud. Everyone says 0.3.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="① the output">
  <div>
    <div class="kicker red">what comes out</div>
    <div class="split" style="gap:56px">
      <div>
        <div class="term">
<span class="dim">$ gcc tenth.c -o tenth &amp;&amp; ./tenth</span>
<span class="hit">0.30000000000000004</span></div>
        <p class="frag" style="margin-top:26px">That trailing <span class="num">4</span> is not the screen. It is not <code>printf</code> rounding badly.</p>
      </div>
      <div class="stack">
        <p class="big frag">The number sitting in memory really is a hair more than three tenths.</p>
        <p class="frag">So the machine we trust to fly aircraft and price options just fumbled a sum off a primary school worksheet.</p>
      </div>
    </div>
  </div>
  <div class="cue">Have a student run it on their own laptop and read their own number out. It has to be their machine, not yours.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="② adds nothing">
  <div>
    <div class="kicker">the second one</div>
    <h2 style="margin-bottom:22px">Add one to a number.</h2>
    <div class="split" style="gap:56px">
      <div>
<pre><span class="f">float</span> a = <span class="s">16777216.0f</span>;
printf(<span class="s">"%.1f\n"</span>, a + <span class="s">1</span>);</pre>
        <p class="small" style="margin-top:22px">Nowhere near any limit. A <code>float</code> reaches into the tens of trillions.</p>
      </div>
      <div class="stack">
        <div class="term frag">
<span class="dim">$ ./two</span>
<span class="hit">16777216.0</span></div>
        <p class="big frag" style="margin-top:24px">The one <span class="mark">vanished.</span></p>
        <p class="frag">Not rounded. Not warned about. The addition was performed and the value did not move.</p>
      </div>
    </div>
  </div>
  <div class="cue">Ask for a guess before revealing. Most of the room says 16777217. Nobody says "nothing happens".</div>
</section>

<!-- 06 -->
<section class="slide" data-t="③ adds two">
  <div>
    <div class="kicker">the third one</div>
    <h2 style="margin-bottom:22px">Two along. Same operation.</h2>
    <div class="split" style="gap:56px">
      <div>
<pre><span class="f">float</span> a = <span class="s">16777218.0f</span>;
printf(<span class="s">"%.1f\n"</span>, a + <span class="s">1</span>);</pre>
        <p class="small" style="margin-top:22px">Two greater than the last one. Same type, same machine, same line of code.</p>
      </div>
      <div class="stack">
        <div class="term frag">
<span class="dim">$ ./three</span>
<span class="hit">16777220.0</span></div>
        <p class="big frag" style="margin-top:24px">You added one and the number went up by <span class="mark">two.</span></p>
      </div>
    </div>
  </div>
  <div class="cue">Put 05 and 06 side by side verbally: "same instruction, one adds nothing, one adds double." Let it sit.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Pause">
  <div class="center">
    <h1 style="font-size:82px">So what do these three<br>have in common?</h1>
    <p class="big" style="margin-top:52px;color:var(--soft)">Two minutes. Talk to the person next to you.</p>
  </div>
  <div class="cue">Actually take the two minutes. Walk around, listen, then collect three answers before you advance.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Reveal · one problem">
  <div>
    <div class="kicker">here is the shape of the answer</div>
    <h2 style="margin-bottom:26px">They are not three problems.</h2>
    <div class="grid3">
      <div class="panel"><span class="n">01 · THE SUM</span><h3>one tenth</h3><p class="cap">is not a number this machine owns</p></div>
      <div class="panel frag"><span class="n">02 · ADDS NOTHING</span><h3>16777217</h3><p class="cap">is not a number this machine owns</p></div>
      <div class="panel frag"><span class="n">03 · ADDS TWO</span><h3>16777219</h3><p class="cap">is not a number this machine owns</p></div>
    </div>
    <p class="big frag" style="margin-top:34px;max-width:44ch">Every time, the machine was handed a value it does not have, and quietly used <span class="mark">the nearest one it does.</span></p>
  </div>
  <div class="cue">Read the bottom line of all three cards aloud, all three times. The repetition is doing the work.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Today's job">
  <div class="center">
    <div class="kicker grey">and here is today's job</div>
    <h2 style="font-size:58px;margin-bottom:34px">We take the first one apart<br>completely.</h2>
    <p class="big" style="max-width:40ch">Not a rule to memorise. A derivation you can do on paper, with nothing but a pencil, in about four minutes.</p>
    <p class="small frag" style="margin-top:30px">The other two need something we do not have yet. They come back in Class 2.</p>
  </div>
  <div class="cue">Say plainly that two of the three stay unsolved today. Owed questions are what make people come back.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Quantity vs numeral">
  <div>
    <div class="kicker grey">start smaller than you expect</div>
    <h2 style="margin-bottom:26px">Hold up three fingers.<br>Now write that down.</h2>
    <div class="grid3">
      <div class="panel"><span class="n">NUMERAL</span><div style="font-family:var(--display);font-size:54px;color:var(--ink);line-height:1">3</div><p class="cap">arabic</p></div>
      <div class="panel"><span class="n">NUMERAL</span><div style="font-family:var(--display);font-size:54px;color:var(--ink);line-height:1">III</div><p class="cap">roman</p></div>
      <div class="panel"><span class="n">NUMERAL</span><div style="font-family:var(--mono);font-size:44px;color:var(--ink);line-height:1.22">0b11</div><p class="cap">binary</p></div>
    </div>
    <p class="big frag" style="margin-top:32px;max-width:52ch">Three ways of writing. One quantity. The fingers did not change.</p>
    <p class="small frag" style="margin-top:14px">A numeral is notation somebody invented. The quantity existed before anybody wrote anything down. Keep that gap open, because everything today lives inside it.</p>
  </div>
  <div class="cue">Hold up actual fingers. It is silly and it lands, because the physical thing is obviously unchanged by the notation.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="What a base is">
  <div>
    <div class="kicker">what a base actually is</div>
    <h2 style="margin-bottom:26px">A base is a choice of<br>what each column is worth.</h2>
    <div class="split r" style="gap:56px">
      <div>
        <table class="pv">
          <tr><th>10²</th><th>10¹</th><th>10⁰</th></tr>
          <tr><th>hundreds</th><th>tens</th><th>units</th></tr>
          <tr><td class="hi">2</td><td class="hi">4</td><td class="hi">3</td></tr>
          <tr><td>200</td><td>40</td><td>3</td></tr>
        </table>
        <p class="small" style="margin-top:18px">Ten is not in the mathematics anywhere. It is in the column values, and it got there because humans have ten fingers.</p>
      </div>
      <div class="panel">
        <span class="lab">same quantity · pick a base</span>
        <div style="display:flex;align-items:center;gap:18px;margin-bottom:24px">
          <input type="number" id="bIn" value="13">
          <span style="font-family:var(--mono);font-size:30px;color:var(--soft)">→</span>
        </div>
        <table class="readout">
          <tr><td>base ten</td><td id="b10">13</td></tr>
          <tr><td>base five</td><td id="b5">23</td></tr>
          <tr><td>base two</td><td id="b2">1101</td></tr>
          <tr><td>base sixteen</td><td id="b16">D</td></tr>
        </table>
      </div>
    </div>
    <p class="big frag" style="margin-top:26px;max-width:60ch;font-size:34px">Four strings of symbols. Nothing about the quantity moved. <span class="mark">No information has been lost anywhere.</span></p>
  </div>
  <div class="cue">Type a few values. Let somebody call one out. The point is that integers are completely safe, so the trouble is elsewhere.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="Cross the point">
  <div>
    <div class="kicker">now cross the point</div>
    <h2 style="margin-bottom:26px">What are the columns worth<br>on the right-hand side?</h2>
    <div class="split" style="gap:56px">
      <div>
        <table class="pv">
          <tr><th>10⁻¹</th><th>10⁻²</th><th>10⁻³</th></tr>
          <tr><td class="hi">1/10</td><td>1/100</td><td>1/1000</td></tr>
        </table>
        <p class="small" style="margin-top:16px">Base ten has a tenths column. Of course it does. That is what a tenths column is for.</p>
      </div>
      <div>
        <table class="pv">
          <tr><th>2⁻¹</th><th>2⁻²</th><th>2⁻³</th><th>2⁻⁴</th></tr>
          <tr><td>1/2</td><td>1/4</td><td>1/8</td><td>1/16</td></tr>
        </table>
        <p class="small frag" style="margin-top:16px">Halves, quarters, eighths, sixteenths. That is the entire currency. <strong>There is no tenths column and there never will be.</strong></p>
      </div>
    </div>
    <p class="big frag" style="margin-top:32px;max-width:58ch">So a binary fraction is a sum of halves. Which makes the only question that matters: <span class="mark">what can you build by adding halves?</span></p>
  </div>
  <div class="cue">This is where the hour turns. Slow right down. Say the last line twice.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="The easy ones">
  <div>
    <div class="kicker grey">try the comfortable ones first</div>
    <h2 style="margin-bottom:26px">Some land exactly.</h2>
    <div class="grid3">
      <div class="panel"><span class="n">0.5</span><div style="font-family:var(--mono);font-size:40px;color:var(--good);font-weight:700">0.1</div><p class="cap">one half. One column, done.</p></div>
      <div class="panel"><span class="n">0.25</span><div style="font-family:var(--mono);font-size:40px;color:var(--good);font-weight:700">0.01</div><p class="cap">one quarter. Done in two.</p></div>

    </div>
    <p class="big frag" style="margin-top:34px;max-width:52ch">Every one of these is a sum of halves, so every one of these terminates. The machine is behaving.</p>
    <p class="big frag" style="margin-top:16px;max-width:52ch;color:var(--fail)">Now do the same thing to one tenth.</p>

<!-- 15 -->
<section class="slide" data-t="Why it had to happen">
  <div>
    <div class="kicker">why that was never going to work</div>
    <h2 style="margin-bottom:26px">A fraction terminates only if the denominator<br>is built from the base's own primes.</h2>
    <div class="split" style="gap:56px">
      <div class="panel">
        <span class="lab">base ten</span>
        <p style="max-width:none">Ten factorises into <span class="num">2 × 5</span>.</p>
        <p style="max-width:none">So a fraction terminates in decimal when its denominator uses only twos and fives. A half, a quarter, a fifth, a tenth, a twentieth. All fine.</p>
        <p class="small" style="margin-top:14px">One third does not, because three is not on that list. <span class="num">0.3333…</span> and you have never once called that a defect of decimal.</p>
      </div>
      <div class="panel frag" style="border-color:var(--fail)">
        <span class="lab" style="color:var(--fail)">base two</span>
        <p style="max-width:none">Two factorises into <span class="num">2</span>. That is the whole list.</p>
        <p style="max-width:none">One tenth is <span class="num">1/10</span>, and ten is <span class="num">2 × 5</span>.</p>
        <p class="big" style="max-width:none;color:var(--fail);margin-top:12px">The five has nowhere to go.</p>
      </div>
    </div>
    <p class="big frag" style="margin-top:30px;max-width:64ch;font-size:34px">One tenth cannot terminate in binary. <span class="mark">Not on this machine, not on a faster one, not ever.</span></p>
  </div>
  <div class="cue">The one-third mirror is what takes the sting out. They already accept a repeating decimal without calling it a bug.</div>
</section>

  </div>

<!-- 18 -->
<section class="slide" data-t="Why binary at all">
  <div>
    <div class="kicker grey">the other half of the objection</div>
    <h2 style="margin-bottom:26px">Then why binary at all?</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>Take five volts and cut it into ten levels, one per decimal digit. Each level gets half a volt, so a quarter of a volt of margin either side before a digit is read wrong.</p>
        <p class="small">Now list what eats that margin. Component tolerance. Temperature. Supply ripple. Crosstalk from the wire next door. Ageing.</p>
        <p class="frag"><strong>Component tolerance alone can spend the whole budget</strong> before anything else is counted.</p>
      </div>
      <div class="stack frag">
        <p>Cut the same five volts into two levels and the margin becomes more than two volts. A factor of ten in noise immunity, bought with a decision that costs nothing except giving up decimal inside the machine.</p>
        <p class="big" style="max-width:none">Binary is a physics decision, not a mathematical one.</p>
      </div>
    </div>
    <p class="small frag" style="margin-top:26px">We do this properly, with real numbers, next class. Today it only has to be enough to close the objection.</p>
  </div>
  <div class="cue">Ninety seconds maximum. If you let this become the noise-margin lecture you lose the landing.</div>
</section>

<script>
(function(){
  'use strict';

  /* ---------- scale the stage ---------- */
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- build ---------- */
  var deck = document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N = slides.length, i = 0, f = 0;

  var rail = document.getElementById('rail'), jl = document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li = document.createElement('li');
    li.innerHTML = '<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick = function(){ i=k; f=0; paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks = rail.children, count = document.getElementById('count');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag, .fragsvg')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on', k===i); });
    for (var k=0;k<N;k++) ticks[k].className = k<i ? 'done' : (k===i ? 'here' : '');
    count.textContent = String(i+1).padStart(2,'0') + ' / ' + N;
    frags().forEach(function(el,k){
      var on = k < f;
      if (el.classList.contains('fragsvg')) el.style.opacity = on ? 1 : 0;
      else el.classList.toggle('shown', on);
    });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag, .fragsvg').length;paint();} }

  document.addEventListener('keydown', function(e){
    var k=e.key;
    if(e.target.tagName==='INPUT' && (k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('.chip')) return;
    if(e.clientX < window.innerWidth*0.26) prev(); else next();
  });

  /* ---------- base converter ---------- */
  var bIn = document.getElementById('bIn');
  if (bIn){
    function bases(){
      var v = parseInt(bIn.value,10);
      if (isNaN(v)) v = 0;
      if (v < 0) v = 0;
      document.getElementById('b10').textContent = v.toString(10);
      document.getElementById('b5').textContent  = v.toString(5);
      document.getElementById('b2').textContent  = v.toString(2);
      document.getElementById('b16').textContent = v.toString(16).toUpperCase();
    }
    bIn.addEventListener('input', bases); bases();
  }

  /* ---------- stepped derivation of one tenth ---------- */
  var rows = Array.prototype.slice.call(document.querySelectorAll('#steps .row'));
  var sN = document.getElementById('sNext'), sR = document.getElementById('sReset');
  if (sN){
    var si = 0;
    function sPaint(){
      rows.forEach(function(r,k){ r.classList.toggle('show', k < si); });
      sN.disabled = si >= rows.length;
      sN.textContent = si >= rows.length ? 'and on, and on' : 'next step';
    }
    sN.onclick = function(){ if (si < rows.length){ si++; sPaint(); } };
    sR.onclick = function(){ si = 0; sPaint(); };
    sPaint();
  }

  /* ---------- exact stored value ---------- */
  function exact(x, bits){
    var buf = new ArrayBuffer(8), dv = new DataView(buf);
    var mBits, bias, frac, exp, sign;
    if (bits === 32){
      dv.setFloat32(0, x); var u = dv.getUint32(0);
      mBits = 23; bias = 127; frac = BigInt(u & 0x7fffff);
      exp = (u >>> 23) & 0xff; sign = u >>> 31;
    } else {
      dv.setFloat64(0, x); var hi = dv.getUint32(0), lo = dv.getUint32(4);
      mBits = 52; bias = 1023;
      frac = (BigInt(hi & 0xfffff) << 32n) | BigInt(lo);
      exp = (hi >>> 20) & 0x7ff; sign = hi >>> 31;
    }
    if (exp === 0 && frac === 0n) return '0';
    if (exp === (bits === 32 ? 0xff : 0x7ff)) return frac ? 'not a number' : 'infinity';
    var mant, e;
    if (exp === 0){ mant = frac; e = 1 - bias - mBits; }
    else { mant = (1n << BigInt(mBits)) | frac; e = exp - bias - mBits; }
    var num = mant, den = 1n;
    if (e >= 0) num = mant << BigInt(e); else den = 1n << BigInt(-e);
    var digits = e < 0 ? -e : 0;
    var scaled = num * (10n ** BigInt(digits)) / den;
    var s = scaled.toString().padStart(digits + 1, '0');
    var out = digits ? s.slice(0, s.length - digits) + '.' + s.slice(s.length - digits) : s;
    out = out.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    return (sign ? '-' : '') + out;
  }

  var chipBox = document.getElementById('chips');
  if (chipBox){
    var vals = ['0.5','0.25','0.75','0.125','0.1','0.2','0.3','1000000.1'];
    function pick(v){
      Array.prototype.forEach.call(chipBox.children, function(c){
        c.classList.toggle('sel', c.dataset.v === v);
      });
      var x = parseFloat(v);
      document.getElementById('rTyped').textContent = v;
      var d = exact(x, 64), fl = exact(x, 32);
      document.getElementById('rDbl').textContent = d;
      document.getElementById('rFlt').textContent = fl;
      var ok = (d === v);
      var el = document.getElementById('rVerdict');
      el.textContent = ok ? 'yes · it is on the list' : 'no · a neighbour was kept';
      el.className = ok ? 'good' : 'bad';
    }
    vals.forEach(function(v){
      var b = document.createElement('span');
      b.className = 'chip'; b.dataset.v = v; b.textContent = v; b.tabIndex = 0;
      b.onclick = function(){ pick(v); };
      b.onkeydown = function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(v);} };
      chipBox.appendChild(b);
    });
    pick('0.5');
  }

  paint();
})();
</script>
</body>
</html>
