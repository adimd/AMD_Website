<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCA Class 3 · What happens when the scale runs out?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --good:#1d6b45; --good-soft:#e8f2ec;
  --gold:#8a6a12; --gold-soft:#fbf2dc;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:74px 96px 108px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:34px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.thread{position:absolute;top:34px;right:96px;font-family:var(--mono);font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rule2);z-index:5}
.thread b{color:var(--fail);font-weight:400}
#rail{position:absolute;left:96px;right:96px;bottom:38px;display:flex;gap:4px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:62px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:62px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.kicker.grey{color:var(--soft)} .kicker.red{color:var(--fail)} .kicker.gold{color:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:100px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:64px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:28px}
h3{font-weight:700;font-size:24px;color:var(--ink);margin-bottom:8px;line-height:1.25}
p{font-size:29px;line-height:1.48;max-width:31ch}
p+p{margin-top:16px}
.big{font-size:39px;line-height:1.3;color:var(--ink);font-weight:300;max-width:25ch}
.small{font-size:22px;line-height:1.5;color:var(--soft);max-width:56ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;color:var(--accent);background:var(--accent-soft);padding:.06em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.split.l{grid-template-columns:1.08fr .92fr}
.split.r{grid-template-columns:.88fr 1.12fr}
.stack>*+*{margin-top:18px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:28px 30px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid3 .panel{padding:24px 22px}
.grid3 h3{font-size:21px}
.grid3 .cap{font-size:19px;line-height:1.4;color:var(--body);margin-top:10px}
.grid3 .n{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--soft);display:block;margin-bottom:14px}

.ans{display:inline-flex;align-items:center;gap:14px;margin-bottom:22px}
.ans i{font-family:var(--mono);font-style:normal;font-weight:700;font-size:20px;width:46px;height:46px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fail);color:#fff}
.ans span{font-family:var(--mono);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--fail)}

input[type=range]{width:100%;accent-color:var(--accent)}
.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:11px 16px;cursor:pointer;transition:.14s}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.hot:hover{background:#1a3170;color:#fff}
.btn.danger{background:var(--fail);border-color:var(--fail);color:#fff}
.btnrow{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:18px;padding:7px 13px;border:1px solid var(--rule2);border-radius:6px;background:var(--stage);cursor:pointer;color:var(--body)}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:11px 4px;border-bottom:1px solid var(--rule);font-size:25px}
.readout td:first-child{color:var(--soft);font-size:15px;letter-spacing:.12em;text-transform:uppercase;width:13rem;vertical-align:middle}
.readout td:last-child{color:var(--ink);text-align:right;font-weight:700}
.readout tr:last-child td{border-bottom:none}
.readout td.bad{color:var(--fail)} .readout td.good{color:var(--good)} .readout td.gold{color:var(--gold)}
.readout td.tiny{font-size:18px;font-weight:400;word-break:break-all;line-height:1.5}
.readout td.flash{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.09);color:var(--fail)}100%{transform:scale(1)}}

pre{background:#14181f;border-radius:12px;padding:24px 28px;font-family:var(--mono);font-size:22px;line-height:1.62;color:#d9dee6;box-shadow:0 14px 34px rgba(20,22,28,.22);overflow:hidden}
pre .c{color:#7f8896;font-style:italic} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.term{background:#14181f;border-radius:12px;padding:24px 28px;font-family:var(--mono);font-size:22px;line-height:1.75;color:#9fe8b8;box-shadow:0 14px 34px rgba(20,22,28,.22)}
.term .dim{color:#7f8896} .term .hit{color:#ffd47e;font-weight:700} .term .red{color:#ff96a2;font-weight:700}

figure{width:100%}
figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:12px}
svg text{font-family:'JetBrains Mono',monospace}

table.pv{border-collapse:collapse;font-family:var(--mono);font-size:21px;width:100%}
table.pv td,table.pv th{border:1px solid var(--rule2);padding:11px 18px;text-align:right}
table.pv th{background:#f1efe9;font-weight:400;color:var(--soft);font-size:15px;letter-spacing:.08em;text-align:right}
table.pv td.lab{text-align:left;color:var(--soft);font-size:19px}
table.pv td.hi{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.pv td.no{background:var(--fail-soft);color:var(--fail);font-weight:700}

.ebits{display:flex;gap:4px;margin-bottom:14px}
.ebits b{flex:1;height:50px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:17px;font-weight:700;background:#f1efe9;color:#b3b0a7;border:1px solid var(--rule2);border-radius:4px;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s cubic-bezier(.2,1.5,.4,1)}
.ebits b.one{background:var(--gold);border-color:var(--gold);color:#fff}
.ebits b.flip{transform:translateY(-8px) scale(1.14)}
.ebits.res b{background:var(--fail);border-color:var(--fail);color:#fff}

.meter{height:24px;background:#f1efe9;border:1px solid var(--rule2);border-radius:6px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--accent);transition:width .22s ease}
.meter.sub i{background:var(--gold)} .meter.zero i{background:var(--fail)}
.meter.log i{background:var(--good)}
.band{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--soft);margin-top:7px}
.state{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 13px;border-radius:6px;display:inline-block;transition:.2s}
.state.norm{background:var(--accent-soft);color:var(--accent)}
.state.sub{background:var(--gold-soft);color:var(--gold)}
.state.zero{background:var(--fail-soft);color:var(--fail)}
.state.ok{background:var(--good-soft);color:var(--good)}
.state.inf{background:var(--fail-soft);color:var(--fail)}

.add{font-family:var(--mono);font-size:32px;line-height:1.42}
.add .ln{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.add .ln .op{width:32px;color:var(--soft);text-align:center}
.add .c{width:52px;text-align:center;border-radius:5px;transition:background .2s ease,color .2s ease,transform .2s ease}
.add .c.live{background:var(--mark);transform:translateY(-4px)}
.add .c.out{color:var(--good);font-weight:700}
.add .carry{font-size:19px;color:var(--fail);height:26px}
.add hr{border:none;border-top:2px solid var(--ink);margin:7px 0}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:96px;right:96px;bottom:92px;display:none;padding:13px 17px;
  border-left:4px solid var(--fail);background:var(--fail-soft);color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:66px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:22px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:21px;color:var(--body);display:flex;gap:18px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag,.meter i,.ebits b,.add .c{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Fundamentals of Computer Architecture &nbsp;·&nbsp; <b>Class 03</b></div>
  <div class="thread" id="thread"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 3 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-th="">
  <div>
    <div class="kicker">Class 03 · hour three of fifty-five</div>
    <h1>What happens<br>when the scale<br>runs out?</h1>
    <p class="big" style="margin-top:40px;max-width:36ch">One question. Everything in this hour is either the question biting you, or somebody's answer to it.</p>
  </div>
  <div class="cue">Collect the send-off first. Somebody should have watched the counter freeze at 16,777,216 on their own laptop.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="The thread" data-th="the question">
  <div>
    <div class="kicker grey">last week, in one line</div>
    <h2 style="margin-bottom:26px">A float is a fixed amount of detail,<br>multiplied by a scale.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>The detail is twenty-four bits and it never changes.</p>
        <p class="frag">The scale is eight bits, and eight bits is not very many.</p>
      </div>
      <div class="stack frag">
        <p class="big">So the scale has a top and a bottom, and you can walk off either one.</p>
        <p class="small">Today: what is waiting at each end, which end is dangerous, and the three completely different things people do about it.</p>
      </div>
    </div>
  </div>
  <div class="cue">Say the question out loud and write it on the board. It sits in the top right corner of every slide from here and the room should notice.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="★ The exponent budget" data-th="the question">
  <div>
    <div class="kicker">and two of its patterns were taken off the market</div>
    <div class="split r" style="gap:50px">
      <div class="stack">
        <h2 style="font-size:46px;margin-bottom:10px">Eight bits.<br>256 scales.</h2>
        <p class="small">Walk the exponent field from bottom to top. Two hundred and fifty four of these are ordinary. Two are not.</p>
        <p class="small" id="ebNote" style="color:var(--fail);font-weight:600;min-height:4em"></p>
      </div>
      <div class="panel">
        <span class="lab">the exponent field</span>
        <div class="ebits" id="ebStrip"></div>
        <input type="range" id="ebR" min="0" max="255" value="127">
        <table class="readout" style="margin-top:16px">
          <tr><td>stored</td><td id="ebS">127</td></tr>
          <tr><td>real exponent</td><td id="ebE">0</td></tr>
          <tr><td>this scale means</td><td class="tiny" id="ebV">× 2⁰</td></tr>
        </table>
        <div class="btnrow">
          <button class="btn" id="ebBot">go to the bottom</button>
          <button class="btn" id="ebTop">go to the top</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Drag to 0 and to 255 and let the strip go red. Ask what a machine could possibly do with a scale it has deliberately refused to define.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="★★ The cliff walker" data-th="both ends">
  <div>
    <div class="kicker red">so walk to both ends and watch what happens</div>
    <div class="panel" style="padding:24px 28px">
      <span class="lab">one float · double it or halve it and keep going</span>
      <figure>
        <svg viewBox="0 0 1420 142" width="100%" role="img" aria-label="A logarithmic number line from the smallest subnormal to the largest float, with a marker">
          <rect x="30" y="52" width="120" height="34" fill="#fbeeed" stroke="#a8231f" stroke-dasharray="4 4"/>
          <rect x="150" y="52" width="118" height="34" fill="#fbf2dc" stroke="#8a6a12" stroke-dasharray="4 4"/>
          <rect x="1270" y="52" width="120" height="34" fill="#fbeeed" stroke="#a8231f" stroke-dasharray="4 4"/>
          <line x1="30" y1="69" x2="1390" y2="69" stroke="#c6c3ba" stroke-width="2"/>
          <g id="cwTicks"></g>
          <line x1="700" y1="40" x2="700" y2="98" stroke="#a8231f" stroke-width="4" id="cwHand" style="transition:transform .28s cubic-bezier(.3,1.4,.4,1)"/>
          <circle cx="700" cy="69" r="8" fill="#a8231f" id="cwDot" style="transition:transform .28s cubic-bezier(.3,1.4,.4,1)"/>
          <text x="90" y="118" font-size="15" fill="#a8231f" text-anchor="middle">ZERO</text>
          <text x="209" y="118" font-size="15" fill="#8a6a12" text-anchor="middle">SUBNORMAL</text>
          <text x="770" y="118" font-size="15" fill="#8b9096" text-anchor="middle">254 ORDINARY SCALES</text>
          <text x="1330" y="118" font-size="15" fill="#a8231f" text-anchor="middle">INFINITY</text>
        </svg>
      </figure>
      <div class="split" style="gap:40px;margin-top:4px;align-items:end">
        <table class="readout">
          <tr><td>the value</td><td class="tiny" id="cwV">1</td></tr>
          <tr><td>scale</td><td id="cwE">2⁰</td></tr>
        </table>
        <div>
          <div style="margin-bottom:10px"><span class="state norm" id="cwS">normal</span></div>
          <div class="btnrow" style="margin-top:0">
            <button class="btn hot" id="cwHalf">÷ 2</button>
            <button class="btn hot" id="cwDbl">× 2</button>
            <button class="btn danger" id="cwDown">fall off the bottom</button>
            <button class="btn danger" id="cwUp">fall off the top</button>
            <button class="btn" id="cwR">back to 1</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cue"><strong>Run both cliffs before explaining either.</strong> Press "fall off the top", then "back to 1", then "fall off the bottom". Ask which ending looked more alarming. Everyone says the top. They are wrong.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="The top: infinity" data-th="both ends">
  <div>
    <div class="kicker">what the top gives you</div>
    <div class="split" style="gap:56px">
      <div>
<pre><span class="f">float</span> big = <span class="s">3.0e38f</span>;
printf(<span class="s">"%f\n"</span>, big * <span class="s">2</span>);</pre>
        <div class="term frag" style="margin-top:22px">
<span class="dim">$ ./over</span>
<span class="red">inf</span></div>
      </div>
      <div class="stack">
        <p class="frag">No crash. No signal. No error code.</p>
        <p class="big frag">It handed you a <strong>value</strong> called infinity and carried on.</p>
        <p class="small frag">That is what the top reserved pattern is for. Infinity is a legal float. You can add to it, compare it, print it.</p>
      </div>
    </div>
  </div>
  <div class="cue">Ask whether handing back infinity is better than crashing. It is a real argument and both sides are defensible.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Not a number" data-th="both ends">
  <div>
    <div class="kicker red">and its neighbour in the same reserved pattern</div>
    <h2 style="margin-bottom:20px">A value that is not<br>equal to itself.</h2>
    <div class="split" style="gap:56px">
      <div>
<pre><span class="f">float</span> x = <span class="s">0.0f</span> / <span class="s">0.0f</span>;
printf(<span class="s">"%d\n"</span>, x == x);</pre>
        <div class="term frag" style="margin-top:22px">
<span class="dim">$ ./nan</span>
<span class="red">0</span></div>
      </div>
      <div class="stack">
        <p class="frag">Zero over zero has no answer, so the standard refuses to invent one and gives you a pattern that means <em>no answer</em>.</p>
        <p class="big frag">It fails its own equality test, which is the only way to detect it.</p>
        <p class="small frag">Touch it with anything and the result is also not a number. It spreads until somebody checks.</p>
      </div>
    </div>
  </div>
  <div class="cue">Infinity and not-a-number are the loud end. They propagate, they reach the output, somebody notices. Say that before you turn round.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="★ The asymmetry" data-th="the quiet end">
  <div>
    <div class="kicker red">and here is why the rest of this hour is about the other end</div>
    <div class="split" style="gap:56px">
      <div class="panel" style="border-color:var(--accent)">
        <span class="lab" style="color:var(--accent)">the top</span>
        <h3 style="font-size:32px">You get infinity.</h3>
        <p style="max-width:none">Obviously wrong. It spreads. It turns up in your output as <span class="num">inf</span> or <span class="num">nan</span>.</p>
        <p class="big" style="max-width:none;margin-top:14px;color:var(--accent)">Somebody notices.</p>
      </div>
      <div class="panel frag" style="border-color:var(--fail)">
        <span class="lab" style="color:var(--fail)">the bottom</span>
        <h3 style="font-size:32px">You get zero.</h3>
        <p style="max-width:none">Zero is an ordinary number. It prints fine, compares fine, sums fine, plots fine.</p>
        <p class="big" style="max-width:none;margin-top:14px;color:var(--fail)">Nobody notices.</p>
      </div>
    </div>
    <p class="big frag" style="margin-top:30px;max-width:72ch">A wrong answer that looks wrong is a bug. A wrong answer that looks <span class="mark">perfectly reasonable</span> is a far more expensive thing.</p>
  </div>
  <div class="cue">Emotional centre of the hour. Slow down. Same pattern as Class 1's silent container, now at the other end of the format.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Subnormals" data-th="the quiet end">
  <div>
    <div class="kicker gold">before zero there is a ramp, and it was expensive to build</div>
    <h2 style="margin-bottom:22px">Drop the hidden one<br>and keep going down.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>In the bottom reserved pattern the leading one is gone, so the value reads <span class="num">0.mantissa × 2⁻¹²⁶</span>.</p>
        <p class="frag">The numbers continue below the smallest scale, shedding one digit of precision per step, down to <span class="num">2⁻¹⁴⁹</span>. Then zero.</p>
      </div>
      <div class="panel frag">
        <span class="lab">why anybody bothered</span>
        <p style="max-width:none">Without the ramp, two unequal numbers close together subtract to exactly zero.</p>
        <p style="max-width:none;margin-top:12px">Somebody then divides by that difference and gets infinity out of a perfectly sensible calculation.</p>
        <p class="small" style="max-width:none;margin-top:12px">The ramp exists to protect one promise: if <span class="num">a ≠ b</span> then <span class="num">a − b ≠ 0</span>. It costs ten to a hundred times the speed on real hardware, and it was still judged worth it.</p>
      </div>
    </div>
  </div>
  <div class="cue">The speed penalty is why audio and graphics code often flushes subnormals to zero deliberately. Thirty seconds if the room is with you.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="What zero costs" data-th="the quiet end">
  <div>

    </div>

  </div>

</section>

<!-- 12 -->
<section class="slide" data-t="Where it bites" data-th="the quiet end">

<span class="dim">200 words at p = 0.01</span>
product = <span class="red">1e-400</span>
even in a double  <span class="red">→ 0</span></div>

<section class="slide" data-t="Logs in the wild" data-th="answer one">

<section class="slide" data-t="② Remove the scale" data-th="answer two">

<!-- 21 -->
<section class="slide" data-t="③ Fix the scale" data-th="answer three">
  <div>

    </div>
  </div>

    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    var th=slides[i].dataset.th||'';
    thread.innerHTML = th ? 'when the scale runs out &nbsp;·&nbsp; <b>'+th+'</b>' : '';
    frags().forEach(function(el,k){
      var on=k<f;
      if(el.classList.contains('fragsvg')) el.style.opacity=on?1:0;
      else el.classList.toggle('shown',on);
    });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag, .fragsvg').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'){ if(k==='Escape') e.target.blur(); return; }
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||
       e.target.closest('.chip')||e.target.closest('input')||e.target.closest('svg')) return;
    if(e.clientX<innerWidth*0.26) prev(); else next();
  });

  var F=Math.fround;
  function sup(n){ var m={'-':'\u207b','0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
    return String(n).split('').map(function(c){return m[c]||c;}).join(''); }
  function fmt(v){ if(v===0) return '0'; if(!isFinite(v)) return v>0?'infinity':'-infinity';
    if(Math.abs(v)<1e-3||Math.abs(v)>=1e7) return v.toExponential(3); return String(parseFloat(v.toPrecision(9))); }

  /* ===== 03 · exponent budget ===== */
  var ebR=document.getElementById('ebR');
  if(ebR){
    var strip=document.getElementById('ebStrip'), cells=[], lastE=null;
    for(var k=0;k<8;k++){ var b=document.createElement('b'); strip.appendChild(b); cells.push(b); }
    function eb(){
      var e=+ebR.value, res=(e===0||e===255);
      for(var k=0;k<8;k++){
        var v=(e>>(7-k))&1;
        if(lastE!==null && ((lastE>>(7-k))&1)!==v){
          (function(c){ c.classList.add('flip'); setTimeout(function(){c.classList.remove('flip');},220); })(cells[k]);
        }
        cells[k].textContent=v; cells[k].className=v?'one':'';
      }
      lastE=e;
      strip.className='ebits'+(res?' res':'');
      document.getElementById('ebS').textContent=e;
      document.getElementById('ebE').textContent=res?'\u2014':(e-127);
      var v=document.getElementById('ebV'), n=document.getElementById('ebNote');
      if(e===0){ v.textContent='reserved \u00b7 zero and subnormals'; v.className='tiny bad';
        n.textContent='All zeros. This pattern is not a scale. It is how the format writes zero, and how it ramps down below the smallest scale it has.'; }
      else if(e===255){ v.textContent='reserved \u00b7 infinity and not-a-number'; v.className='tiny bad';
        n.textContent='All ones. Also not a scale. This is where infinity lives, and the value that is not equal to itself.'; }
      else { v.textContent='\u00d7 2'+sup(e-127); v.className='tiny'; n.textContent=''; }
    }
    ebR.addEventListener('input',eb);
    document.getElementById('ebBot').onclick=function(){ ebR.value=0; eb(); };
    document.getElementById('ebTop').onclick=function(){ ebR.value=255; eb(); };
    eb();
  }

  /* ===== 04 · cliff walker ===== */
  var cwDbl=document.getElementById('cwDbl');
  if(cwDbl){
    var host=document.getElementById('cwTicks'), ns='http://www.w3.org/2000/svg';
    for(var k=0;k<=25;k++){
      var x=268+k*40.1;
      var l=document.createElementNS(ns,'line');
      l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',62);l.setAttribute('y2',76);
      l.setAttribute('stroke','#c6c3ba');l.setAttribute('stroke-width','1.4');
      host.appendChild(l);
    }
    var E=0, dead=null, timer=null;
    function px(e){ if(e<-149) return 90; if(e<-126) return 150+((e+149)/23)*118; if(e>127) return 1330;
      return 268+((e+126)/253)*1002; }
    function cw(){
      var hand=document.getElementById('cwHand'), dot=document.getElementById('cwDot');
      var tx='translate('+(px(E)-700)+',0)';
      hand.setAttribute('transform',tx); dot.setAttribute('transform',tx);
      var vv=document.getElementById('cwV'), ee=document.getElementById('cwE'), st=document.getElementById('cwS');
      if(dead==='zero'){ vv.textContent='0'; vv.className='tiny bad'; ee.textContent='\u2014';
        st.className='state zero'; st.textContent='underflowed to zero'; }
      else if(dead==='inf'){ vv.textContent='infinity'; vv.className='tiny bad'; ee.textContent='\u2014';
        st.className='state inf'; st.textContent='overflowed to infinity'; }
      else {
        vv.textContent=fmt(Math.pow(2,E)); vv.className='tiny';
        ee.textContent='2'+sup(E);
        if(E<-126){ st.className='state sub'; st.textContent='subnormal'; }
        else { st.className='state norm'; st.textContent='normal'; }
      }
      vv.classList.add('flash'); setTimeout(function(){vv.classList.remove('flash');},400);
    }
    function move(d){
      if(dead) return;
      E+=d;
      if(E>127) dead='inf';
      if(E<-149) dead='zero';
      cw();
    }
    function run(d){
      if(timer) clearInterval(timer);
      timer=setInterval(function(){ if(dead){clearInterval(timer);timer=null;return;} move(d); }, 55);
    }
    cwDbl.onclick=function(){ move(1); };
    document.getElementById('cwHalf').onclick=function(){ move(-1); };
    document.getElementById('cwUp').onclick=function(){ run(1); };
    document.getElementById('cwDown').onclick=function(){ run(-1); };
    document.getElementById('cwR').onclick=function(){ if(timer)clearInterval(timer); timer=null; E=0; dead=null; cw(); };
    cw();
  }

  /* ===== 09 · the coin ===== */
  var c1=document.getElementById('c1');
  if(c1){
    var n=0,p=F(1),auto=null;
    var MINNORM=Math.pow(2,-126);
    function coin(){
      document.getElementById('cN').textContent=n;
      var cp=document.getElementById('cP');
      cp.textContent=p===0?'0':p.toExponential(3);
      cp.classList.add('flash'); setTimeout(function(){cp.classList.remove('flash');},400);
      var m=document.getElementById('cMeter'),bar=m.firstElementChild,
          st=document.getElementById('cState'),note=document.getElementById('coinNote'),frac;
      if(p===0){ frac=0; m.className='meter zero'; st.className='state zero'; st.textContent='zero';
        note.textContent='Exactly zero. Your program has stopped calling this unlikely and started calling it impossible.'; }
      else if(p<MINNORM){ frac=Math.max(2,(Math.log2(p)+149)/23*22); m.className='meter sub'; st.className='state sub'; st.textContent='subnormal';
        note.textContent='Below the smallest ordinary scale, on the ramp. Still a number, and losing a bit of precision with every step down.'; }
      else { frac=22+(1+Math.log2(p)/126)*78; m.className='meter'; st.className='state norm'; st.textContent='normal';
        note.textContent=''; }
      bar.style.width=Math.max(0,Math.min(100,frac))+'%';
    }
    function flip(k){ for(var j=0;j<k;j++){ p=F(p*F(0.5)); n++; } coin(); }
    c1.onclick=function(){ flip(1); };
    document.getElementById('cAuto').onclick=function(){
      if(auto){ clearInterval(auto); auto=null; return; }
      auto=setInterval(function(){ if(p===0){clearInterval(auto);auto=null;return;} flip(1); },90);
    };
    document.getElementById('c150').onclick=function(){ if(auto){clearInterval(auto);auto=null;} n=0;p=F(1); flip(150); };
    document.getElementById('cR').onclick=function(){ if(auto){clearInterval(auto);auto=null;} n=0;p=F(1); coin(); };
    coin();
  }

  /* ===== 15 · the race ===== */
  var rGo=document.getElementById('rGo');
  if(rGo){
    var rn=0, rp=F(1), rl=F(0), rt=null, diedAt=null;
    function race(){
      document.getElementById('rN').textContent=rn.toLocaleString();
      document.getElementById('rP').textContent = rp===0?'0':rp.toExponential(3);
      document.getElementById('rL').textContent = rl.toFixed(1);
      var m1=document.getElementById('rM1'),m2=document.getElementById('rM2'),
          s1=document.getElementById('rS1'),s2=document.getElementById('rS2');
      if(rp===0){ m1.className='meter zero'; m1.firstElementChild.style.width='0%';
        s1.className='state zero'; s1.textContent='dead at '+(diedAt||150); }
      else { m1.className='meter'; m1.firstElementChild.style.width=Math.max(1,100+Math.log2(rp)/150*100)+'%';
        s1.className='state norm'; s1.textContent='normal'; }
      m2.firstElementChild.style.width=Math.min(100,Math.abs(rl)/10000*100+2)+'%';
      s2.className='state ok'; s2.textContent='fine';
    }
    rGo.onclick=function(){
      if(rt){ clearInterval(rt); rt=null; return; }
      rt=setInterval(function(){
        for(var j=0;j<40 && rn<10000;j++){
          var was=rp;
          rp=F(rp*F(0.5)); rl=F(rl-1); rn++;
          if(was!==0 && rp===0) diedAt=rn;
        }
        race();
        if(rn>=10000){ clearInterval(rt); rt=null; }
      },30);
    };
    document.getElementById('rR').onclick=function(){ if(rt){clearInterval(rt);rt=null;} rn=0;rp=F(1);rl=F(0);diedAt=null; race(); };
    race();
  }

  /* ===== 18 · the wheel ===== */
  var wUp=document.getElementById('wUp');
  if(wUp){
    var W=16,pos=0,host2=document.getElementById('wheelTicks'),ns2='http://www.w3.org/2000/svg';
    for(var k=0;k<W;k++){
      var a=(k/W)*Math.PI*2-Math.PI/2;
      var x=165+Math.cos(a)*120,y=165+Math.sin(a)*120;
      var g=document.createElementNS(ns2,'g');
      var c=document.createElementNS(ns2,'circle');
      c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',9);
      c.setAttribute('fill',k<8?'#23408f':'#a8231f');
      c.setAttribute('style','transition:r .2s ease');
      var tx=document.createElementNS(ns2,'text');
      tx.setAttribute('x',165+Math.cos(a)*150);tx.setAttribute('y',165+Math.sin(a)*150+5);
      tx.setAttribute('font-size','14');tx.setAttribute('text-anchor','middle');
      tx.setAttribute('fill',k<8?'#23408f':'#a8231f');
      tx.textContent=k<8?String(k):String(k-16);
      g.appendChild(c);g.appendChild(tx);
      g.style.cursor='pointer';
      (function(kk){ g.onclick=function(){ pos=kk; wheel(); }; })(k);
      host2.appendChild(g);
    }
    function wheel(){
      pos=((pos%W)+W)%W;
      document.getElementById('wHand').setAttribute('transform','rotate('+(pos/W*360)+' 165 165)');
      document.getElementById('wBits').textContent=pos.toString(2).padStart(4,'0');
      document.getElementById('wU').textContent=pos;
      document.getElementById('wS').textContent=(pos<8?pos:pos-16);
      [].forEach.call(host2.children,function(g,k){ g.firstElementChild.setAttribute('r',k===pos?13:9); });
    }
    wUp.onclick=function(){ pos++; wheel(); };
    document.getElementById('wDn').onclick=function(){ pos--; wheel(); };
    [['0',0],['7',7],['8',8],['\u22121',15]].forEach(function(pr){
      var b=document.createElement('span');
      b.className='chip'; b.textContent=pr[0]; b.tabIndex=0;
      b.onclick=function(){ pos=pr[1]; wheel(); };
      document.getElementById('wChips').appendChild(b);
    });
    wheel();
  }

  /* ===== 19 · the adder ===== */
  var adNext=document.getElementById('adNext');
  if(adNext){
    var A=[1,0,1,0], B=[1,0,1,1];   /* index 0 = least significant.  0101 and 1101 */
    var sum=[0,0,0,0], carryAt=[0,0,0,0,0], step=0;
    (function(){ var c=0; for(var k=0;k<4;k++){ var s=A[k]+B[k]+c; sum[k]=s&1; c=s>>1; carryAt[k+1]=c; } })();
    function ad(){
      document.getElementById('adSum').innerHTML='<span class="op"></span>'+[3,2,1,0].map(function(k){
        return '<span class="c'+(step>k?' out':'')+'">'+(step>k?sum[k]:'\u00b7')+'</span>';
      }).join('');
      document.getElementById('adCarry').innerHTML='<span class="op"></span>'+[3,2,1,0].map(function(k){
        return '<span class="c">'+((step>k&&k<3&&carryAt[k+1])?'1':'')+'</span>';
      }).join('');
      [].forEach.call(document.querySelectorAll('.add .c[data-a],.add .c[data-b]'),function(c){
        var idx=+(c.dataset.a!==undefined?c.dataset.a:c.dataset.b);
        c.classList.toggle('live', idx===step && step<4);
      });
      var n=document.getElementById('adNote');
      if(step===0) n.textContent='';
      else if(step<4) n.textContent='Column '+step+' done. Nothing here knows anything about signs. It is adding bits.';
      else if(step===4) n.textContent='A carry came off the top and there is nowhere to put it, so it is discarded. That discard is the wheel from the last slide.';
      else n.textContent='0010 is two. Five minus three, computed by a circuit that has never heard of subtraction.';
    }
    adNext.onclick=function(){ if(step<5){ step++; ad(); } };
    document.getElementById('adR').onclick=function(){ step=0; ad(); };
    ad();
  }

  /* ===== 22 · the trade ===== */
  var tR=document.getElementById('tR');
  if(tR){
    var FIXED=Math.pow(2,-16), FMAX=32768;
    function ulp32(x){ var b=new ArrayBuffer(4),d=new DataView(b); d.setFloat32(0,x);
      var u=d.getUint32(0); d.setUint32(0,u+1); return d.getFloat32(0)-x; }
    function trade(){
      var E=+tR.value, v=Math.pow(2,E), fg=ulp32(v);
      document.getElementById('tVal').textContent=fmt(v);
      document.getElementById('tF').textContent=fg.toExponential(2);
      var out=document.getElementById('tX'), note=document.getElementById('tradeNote'),
          m=document.getElementById('tMeter'), bar=m.firstElementChild;
      if(v>=FMAX){
        out.textContent='out of range'; out.className='tiny bad';
        m.className='meter zero'; bar.style.width='100%';
        note.textContent='Fixed point cannot hold this at all. Sixteen integer bits stop at 32768, and there is no exponent to fall back on.';
      } else {
        out.textContent=FIXED.toExponential(2); out.className='tiny';
        bar.style.width=Math.max(3,Math.min(97,50+Math.log2(fg/FIXED)*4))+'%';
        if(fg<FIXED){ m.className='meter'; note.textContent='Down here the float is far finer, because it spends its whole mantissa on a small number.'; }
        else { m.className='meter sub'; note.textContent='Up here the float has spread its marks out and the fixed point has not. Its step never changed.'; }
      }
    }
    tR.addEventListener('input',trade); trade();
  }

  paint();
})();
</script>
</body>
</html>
