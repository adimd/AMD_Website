<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCA Class 2 · What is a container?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de;
  --stage:#faf9f6;
  --card:#ffffff;
  --ink:#15171b;
  --body:#4b5057;
  --soft:#8b9096;
  --rule:#e2e0d9;
  --rule2:#c6c3ba;
  --accent:#23408f;
  --accent-soft:#eaeef7;
  --fail:#a8231f;
  --fail-soft:#fbeeed;
  --good:#1d6b45;
  --gold:#8a6a12;
  --gold-soft:#fbf2dc;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{
  position:absolute;top:50%;left:50%;
  width:1600px;height:900px;
  transform-origin:50% 50%;
  background:var(--stage);
  box-shadow:0 24px 70px rgba(20,22,28,.16);
  overflow:hidden;
}
.slide{position:absolute;inset:0;padding:74px 96px 108px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:34px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
#rail{position:absolute;left:96px;right:96px;bottom:38px;display:flex;gap:4px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:62px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:62px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.kicker.grey{color:var(--soft)}
.kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:104px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:66px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:30px}
h3{font-weight:700;font-size:24px;color:var(--ink);margin-bottom:8px;line-height:1.25}
p{font-size:30px;line-height:1.48;max-width:30ch}
p+p{margin-top:18px}
.big{font-size:40px;line-height:1.3;color:var(--ink);font-weight:300;max-width:24ch}
.small{font-size:22px;line-height:1.5;color:var(--soft);max-width:56ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;color:var(--accent);background:var(--accent-soft);padding:.06em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.l{grid-template-columns:1.06fr .94fr}
.split.r{grid-template-columns:.9fr 1.1fr}
.stack>*+*{margin-top:20px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 32px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid3 .panel,.grid4 .panel{padding:24px 22px}
.grid3 h3,.grid4 h3{font-size:21px}
.grid3 .cap,.grid4 .cap{font-size:19px;line-height:1.4;color:var(--body);margin-top:10px}
.grid3 .n,.grid4 .n{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--soft);display:block;margin-bottom:14px}

input[type=text],input[type=number]{font-family:var(--mono);font-size:26px;background:var(--stage);color:var(--ink);border:2px solid var(--rule2);border-radius:7px;padding:6px 10px;width:11ch}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);border:1px solid var(--rule2);border-radius:7px;padding:11px 16px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:10px;margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:18px;padding:7px 13px;border:1px solid var(--rule2);border-radius:6px;background:var(--stage);cursor:pointer;color:var(--body)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:12px 4px;border-bottom:1px solid var(--rule);font-size:25px}
.readout td:first-child{color:var(--soft);font-size:15px;letter-spacing:.12em;text-transform:uppercase;width:13rem;vertical-align:middle}
.readout td:last-child{color:var(--ink);text-align:right;font-weight:700}
.readout tr:last-child td{border-bottom:none}
.readout td.bad{color:var(--fail)}
.readout td.good{color:var(--good)}
.readout td.tiny{font-size:17px;font-weight:400;word-break:break-all;line-height:1.5}

/* ---------- animated 32-bit strip ---------- */
.fbits{display:flex;gap:16px;align-items:flex-start}
.fbits .grp{display:flex;flex-direction:column;min-width:0}
.fbits .row{display:flex;gap:3px}
.fbits b{
  height:52px;min-width:0;flex:1 1 0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:16px;font-weight:700;cursor:pointer;user-select:none;
  background:#f1efe9;color:#b3b0a7;border:1px solid var(--rule2);border-radius:4px;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s cubic-bezier(.2,1.5,.4,1);
}
.fbits b:hover{border-color:var(--ink);transform:translateY(-3px)}
.fbits b.flip{transform:translateY(-9px) scale(1.16);z-index:2}
.fbits .sgn{flex:0 0 54px}
.fbits .exp{flex:0 0 336px}
.fbits .man{flex:1 1 auto;min-width:0}
.fbits .sgn b.one{background:var(--fail);border-color:var(--fail);color:#fff}
.fbits .exp b.one{background:var(--gold);border-color:var(--gold);color:#fff}
.fbits .man b.one{background:var(--accent);border-color:var(--accent);color:#fff}
.fbits .cap{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:11px;text-align:center}
.fbits .cap.s{color:var(--fail)}
.fbits .cap.e{color:var(--gold)}
.fbits .cap.m{color:var(--accent)}
.hint{font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:16px}

/* ---------- the machine ---------- */
.mach{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:24px;
  border:1px solid var(--rule2);border-radius:10px;overflow:hidden;background:var(--stage)}
.mach .cell{padding:18px 22px;border-right:1px solid var(--rule2)}
.mach .cell:last-child{border-right:none}
.mach .k{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.mach .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--ink);line-height:1.15;word-break:break-all;
  transition:color .2s ease}
.mach .v.flash{color:var(--fail)}
.mach .cell.step .v{color:var(--fail)}
.mach .cell.scale .v{color:var(--gold)}
.ctl{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:22px}
.ctl .set{display:flex;gap:8px;align-items:center}
.ctl .set .t{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-right:4px}
.step-b{font-family:var(--mono);font-size:20px;font-weight:700;width:46px;height:42px;border-radius:7px;
  border:1px solid var(--rule2);background:var(--card);color:var(--body);cursor:pointer}
.step-b:hover{background:var(--accent);border-color:var(--accent);color:#fff}

pre{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.65;color:#d9dee6;box-shadow:0 14px 34px rgba(20,22,28,.22);overflow:hidden}
pre .c{color:#7f8896;font-style:italic}
pre .k{color:#ff96a2}
pre .s{color:#ffd47e}
pre .f{color:#84d8ea}
.term{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.8;color:#9fe8b8;box-shadow:0 14px 34px rgba(20,22,28,.22)}
.term .dim{color:#7f8896}
.term .hit{color:#ffd47e;font-weight:700}

figure{width:100%}
figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:14px}
svg text{font-family:'JetBrains Mono',monospace}

table.pv{border-collapse:collapse;font-family:var(--mono);font-size:22px}
table.pv td,table.pv th{border:1px solid var(--rule2);padding:10px 20px;text-align:right}
table.pv th{background:#f1efe9;font-weight:400;color:var(--soft);font-size:15px;letter-spacing:.08em;text-align:right}
table.pv td.hi{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.pv td.no{background:var(--fail-soft);color:var(--fail);font-weight:700}
table.pv td.lab{text-align:left;color:var(--soft);font-size:19px}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{
  position:absolute;left:96px;right:96px;bottom:92px;display:none;
  padding:14px 18px;border-left:4px solid var(--fail);background:var(--fail-soft);
  color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6;
}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:80px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:28px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:23px;color:var(--body);display:flex;gap:20px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Fundamentals of Computer Architecture &nbsp;·&nbsp; <b>Class 02</b></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 2 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title">
  <div>
    <div class="kicker">Class 02 · hour two of fifty-four</div>
    <h1>What is<br>a container?</h1>
    <p class="big" style="margin-top:44px;max-width:34ch">Last hour we said the machine keeps a finite list and hands you the nearest entry. We never asked the obvious follow-up.</p>
    <p class="big frag" style="margin-top:22px;max-width:34ch;color:var(--fail)">How far apart are the entries?</p>
  </div>
  <div class="cue">Open by asking what we owe them. Somebody should say "problems two and three". Write both on the board before slide 2.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="The debt">
  <div>
    <div class="kicker red">still owed from last week</div>
    <h2 style="margin-bottom:26px">Two programs, unexplained.</h2>
    <div class="split" style="gap:56px">
      <div>
<pre><span class="f">float</span> a = <span class="s">16777216.0f</span>;
printf(<span class="s">"%.1f\n"</span>, a + <span class="s">1</span>);
<span class="c">// 16777216.0  ← nothing happened</span></pre>
      </div>
      <div>
<pre><span class="f">float</span> a = <span class="s">16777218.0f</span>;
printf(<span class="s">"%.1f\n"</span>, a + <span class="s">1</span>);
<span class="c">// 16777220.0  ← went up by two</span></pre>
      </div>
    </div>
    <p class="big frag" style="margin-top:34px;max-width:56ch">By the end of this hour both of these will be obvious, and they will turn out to be <span class="mark">the same sentence.</span></p>
  </div>
  <div class="cue">Do not hint at the answer. The whole hour is a slow walk toward slide 19.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="What we know">
  <div>
    <div class="kicker grey">where we got to</div>
    <h2 style="margin-bottom:26px">One tenth is not a sum of halves.<br>So the machine kept a neighbour.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>That explained a value being swapped. It did not explain <strong>how far away the neighbour was.</strong></p>
        <p class="small">And that distance is not the same everywhere, which is the entire subject of today.</p>
      </div>
      <div class="stack frag">
        <p>Last class we typed <span class="num">1000000.1</span> into a float and got back <span class="num">1000000.125</span>.</p>
        <p class="big">Wrong by an eighth. For one tenth the error was invisible. Out there it was enormous.</p>
      </div>
    </div>
  </div>
  <div class="cue">The 1000000.1 callback is what makes today feel necessary rather than academic. Say the two error sizes out loud.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Detour · Avogadro">
  <div class="center">
    <div class="kicker grey">a detour that turns out not to be one</div>
    <h2 style="font-size:56px;margin-bottom:34px">How do you write down<br>602214076000000000000000?</h2>
    <p class="big frag" style="font-family:var(--mono);font-size:52px;color:var(--accent)">6.02214076 × 10²³</p>
    <p class="small frag" style="margin-top:32px;max-width:50ch">You have used this since school and never once thought of it as a data format. It is one, and it is the one the machine uses.</p>
  </div>
  <div class="cue">Write the long form on the board by hand first. The physical effort of writing twenty-four digits is the argument.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Anatomy of the notation">
  <div>
    <div class="kicker">what that notation is actually made of</div>
    <h2 style="margin-bottom:30px">Three pieces, and nothing else.</h2>
    <div class="grid3">
      <div class="panel" style="border-color:var(--fail)">
        <span class="n" style="color:var(--fail)">PIECE ONE</span>
        <h3 style="color:var(--fail)">The sign</h3>
        <p class="cap">Which side of zero. One bit of information, and it does not interact with anything else.</p>
      </div>
      <div class="panel frag" style="border-color:var(--accent)">
        <span class="n" style="color:var(--accent)">PIECE TWO</span>
        <h3 style="color:var(--accent)">The digits</h3>
        <p class="cap"><span class="num">6.02214076</span> · the significant figures. How much detail you are carrying.</p>
      </div>
      <div class="panel frag" style="border-color:var(--gold)">
        <span class="n" style="color:var(--gold)">PIECE THREE</span>
        <h3 style="color:var(--gold)">The scale</h3>
        <p class="cap"><span class="num">10²³</span> · where the point sits. How big, without spending any digits on it.</p>
      </div>
    </div>
    <p class="big frag" style="margin-top:34px;max-width:62ch">Detail and size are stored <span class="mark">separately.</span> That separation is the whole invention, and it is centuries older than any computer.</p>
  </div>
  <div class="cue">Name the three colours now. They stay consistent for the rest of the hour and for Class 3.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="The normalisation rule">
  <div>
    <div class="kicker grey">one rule makes it unique</div>
    <h2 style="margin-bottom:26px">Exactly one non-zero digit<br>before the point.</h2>
    <div class="split" style="gap:56px">
      <div>
        <table class="pv">
          <tr><td class="lab">the same quantity</td><td>0.602 × 10²⁴</td></tr>
          <tr><td class="lab">written four ways</td><td>60.2 × 10²²</td></tr>
          <tr><td class="lab"></td><td>602 × 10²¹</td></tr>
          <tr><td class="lab">only this one is legal</td><td class="hi">6.02 × 10²³</td></tr>
        </table>
      </div>
      <div class="stack">
        <p class="frag">Without the rule, every number has infinitely many spellings and no two machines would agree.</p>
        <p class="big frag">With it, every number has exactly one. That is what makes it a <em>format</em> rather than a habit.</p>
      </div>
    </div>
  </div>
  <div class="cue">This slide is quick, but the rule is what buys the free bit two slides from now. Do not skip it.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Same idea in binary">
  <div>
    <div class="kicker">now do it in the base the machine actually has</div>
    <h2 style="margin-bottom:26px">Nothing about the idea changes.<br>Only the base does.</h2>
    <div class="split r" style="gap:56px">
      <div>
        <table class="pv">
          <tr><th>value</th><th>binary</th><th>normalised</th></tr>
          <tr><td class="lab">13</td><td>1101</td><td class="hi">1.101 × 2³</td></tr>
          <tr><td class="lab">2</td><td>10</td><td class="hi">1.0 × 2¹</td></tr>
          <tr><td class="lab">0.5</td><td>0.1</td><td class="hi">1.0 × 2⁻¹</td></tr>
          <tr><td class="lab">0.1</td><td>0.000110011…</td><td class="hi">1.100110011… × 2⁻⁴</td></tr>
        </table>
      </div>
      <div class="stack">
        <p>Slide the point until exactly one digit sits in front of it, and count how far you slid. That count is the exponent.</p>
        <p class="frag">Base ten used powers of ten. Base two uses powers of two. <strong>Same notation, different currency.</strong></p>
        <p class="small frag">And there is that repeating pattern from last class again, sitting in the digits of one tenth.</p>
      </div>
    </div>
  </div>
  <div class="cue">Do 13 on the board by hand. Slide the point three places, exponent is three. It takes twenty seconds and it removes all the mystery.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="★ The free bit">
  <div>
    <div class="kicker">and binary hands you something base ten cannot</div>
    <h2 style="margin-bottom:30px">In base two, the digit<br>in front of the point<br>is always a one.</h2>
    <div class="split" style="gap:56px">
      <div class="stack">
        <p>In base ten it could be anything from 1 to 9, so you have to store it.</p>
        <p class="frag">In base two the rule says non-zero, and the only non-zero binary digit there is, is <span class="num">1</span>.</p>
      </div>
      <div class="stack frag">
        <p class="big">So do not store it. It is always the same.</p>
        <p>Twenty-three bits written down, <strong>twenty-four bits of precision</strong>, and the extra one is free.</p>
        <p class="small">The specification calls it the hidden bit. It is the cheapest thing in the whole format.</p>
      </div>
    </div>
  </div>
  <div class="cue">Students who meet the hidden bit as a stated rule find it arbitrary. Arriving at it from normalisation makes it obvious. Take the extra minute.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="★ The layout">
  <div>
    <div class="kicker">so here is the container, in full</div>
    <div class="panel" style="padding:30px 34px">
      <span class="lab">thirty-two bits · type a number, or click any bit to flip it</span>
      <div class="fbits">
        <div class="grp sgn"><div class="row" id="fS"></div><div class="cap s">sign · 1</div></div>
        <div class="grp exp"><div class="row" id="fE"></div><div class="cap e">exponent · 8</div></div>
        <div class="grp man"><div class="row" id="fM"></div><div class="cap m">mantissa · 23</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:22px;margin-top:24px;flex-wrap:wrap">
        <input type="number" id="fIn" value="13" step="any">
        <div class="chips" id="fChips"></div>
      </div>
      <table class="readout" style="margin-top:18px">
        <tr><td>reads as</td><td id="fSci">1.101 × 2³</td></tr>
        <tr><td>exponent stored</td><td id="fEs">130</td></tr>
        <tr><td>minus the bias of 127</td><td id="fEr">3</td></tr>
      </table>
    </div>

<!-- 28 -->
<section class="slide" data-t="The unclever fix">
  <div class="center">
    <div class="kicker">the first fix, and it is not clever</div>
    <h1 style="font-size:72px;max-width:22ch">A counter is<br>an integer.</h1>
    <p class="big frag" style="margin-top:36px;max-width:52ch">A 64-bit integer counts every whole number up to nine quintillion with no gaps, no rounding and no drift, because it spends none of its bits on a scale it does not need.</p>
    <p class="small frag" style="margin-top:26px;max-width:56ch">Most float bugs in the world are this. Somebody reached for the type that handles fractions when they were never going to need one.</p>
  </div>
  <div class="cue">Do not skip past this to get to Kahan. The clever fix is more fun and the boring fix is right far more often.</div>
</section>

<section class="slide" data-t="When you cannot">

<pre><span class="f">float</span> sum = <span class="s">0.0f</span>;
<span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">10000000</span>; i++)
    sum += <span class="s">0.1f</span>;</pre>
        <div class="term frag" style="margin-top:22px">
<span class="dim">expected</span>  1000000.0
<span class="dim">printed </span>  <span class="hit">1087937.0</span></div>
      </div>

        <p class="big frag" style="color:var(--fail)">Eight point eight percent wrong.</p>
        <p class="frag">Each addition loses the part of the new value that falls off the end of the mantissa. One loss is invisible. Ten million of them are not.</p>
      </div>
    </div>
  </div>

<!-- 30 -->
<section class="slide" data-t="★ Kahan">
  <div>
    <div class="kicker">so keep a second variable, and put the lost bits in it</div>
    <div class="split l" style="gap:56px">
      <div>
<pre><span class="f">float</span> sum = <span class="s">0.0f</span>, c = <span class="s">0.0f</span>;

<span class="k">for</span> (...) {
    <span class="f">float</span> y = x - c;        <span class="c">// add back what was lost</span>
    <span class="f">float</span> t = sum + y;      <span class="c">// this is what rounds</span>
    c = (t - sum) - y;      <span class="c">// exactly what fell off</span>
    sum = t;
}</pre>
      </div>
      <div class="stack">
        <p class="frag"><span class="num">t - sum</span> is the part of <em>y</em> that actually made it in.</p>
        <p class="frag">Subtract <em>y</em> and you are left with the part that <strong>did not</strong>, measured exactly rather than estimated.</p>
        <p class="big frag">Hold it in <span class="num">c</span>, and hand it back on the next pass.</p>
      </div>
    </div>
    <p class="small frag" style="margin-top:24px">Algebraically that third line is zero, which is exactly why it works. It is non-zero only because of rounding, and it is the rounding you are trying to catch.</p>
  </div>
  <div class="cue">Trace one iteration at the freeze point on the board. sum is 2²⁴, y is 1, t stays put, c becomes minus one. Next pass y is 2 and the counter moves. That is the whole trick.</div>
</section>

        <p style="max-width:none">It costs three extra operations per element, and it recovers the lost bits rather than adding precision. Feed it values spread across enormous magnitudes and it will still lose.</p>
      </div>

        <p style="max-width:none">A compiler allowed to reorder float arithmetic will prove that third line is zero and delete it. There is a flag that does this, people switch it on for speed, and it silently removes the fix.</p>

<script>
(function(){
  'use strict';

  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  var deck = document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N = slides.length, i = 0, f = 0;

  var rail = document.getElementById('rail'), jl = document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li = document.createElement('li');
    li.innerHTML = '<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick = function(){ i=k; f=0; paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks = rail.children, count = document.getElementById('count');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag, .fragsvg')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on', k===i); });
    for (var k=0;k<N;k++) ticks[k].className = k<i ? 'done' : (k===i ? 'here' : '');
    count.textContent = String(i+1).padStart(2,'0') + ' / ' + N;
    frags().forEach(function(el,k){
      var on = k < f;
      if (el.classList.contains('fragsvg')) el.style.opacity = on ? 1 : 0;
      else el.classList.toggle('shown', on);
    });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag, .fragsvg').length;paint();} }

  document.addEventListener('keydown', function(e){
    var k=e.key;
    var t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA'){
      if(k==='Escape'){ e.target.blur(); }
      return;
    }
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||
       e.target.closest('.chip')||e.target.closest('input')) return;
    if(e.clientX < window.innerWidth*0.26) prev(); else next();
  });

  /* ---------- float helpers ---------- */
  function bitsOf(x){
    var b=new ArrayBuffer(4), d=new DataView(b);
    d.setFloat32(0,x);
    var u=d.getUint32(0);
    return { s:u>>>31, e:(u>>>23)&0xff, m:u&0x7fffff };
  }
  function nextUp(x){
    var b=new ArrayBuffer(4), d=new DataView(b);
    d.setFloat32(0,x); var u=d.getUint32(0);
    d.setUint32(0,u+1); return d.getFloat32(0);
  }
  function fmt(v){
    if(!isFinite(v)) return String(v);
    if(v!==0 && (Math.abs(v)<1e-4 || Math.abs(v)>=1e9)) return v.toExponential(8);
    return String(parseFloat(v.toPrecision(15)));
  }
  function sup(n){
    var map={'-':'\u207b','0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074',
             '5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
    return String(n).split('').map(function(c){return map[c]||c;}).join('');
  }

  function fromBits(s,e,m){
    var b=new ArrayBuffer(4), d=new DataView(b);
    d.setUint32(0, (((s&1)<<31) | ((e&0xff)<<23) | (m&0x7fffff))>>>0);
    return d.getFloat32(0);
  }

  /* one reusable animated bit strip, driven by a raw 32-bit word */
  function makeStrip(idS,idE,idM,onFlip){
    var cells=[], hosts=[[idS,1],[idE,8],[idM,23]];
    hosts.forEach(function(h){
      var host=document.getElementById(h[0]);
      if(!host) return;
      for(var k=0;k<h[1];k++){
        var b=document.createElement('b');
        b.textContent='0'; b.tabIndex=0;
        b.dataset.i=cells.length;
        host.appendChild(b); cells.push(b);
      }
    });
    if(!cells.length) return null;
    var last=null;
    function render(word,animate){
      var changed=[];
      for(var k=0;k<32;k++){
        var v=(word>>>(31-k))&1;
        if(last===null || ((last>>>(31-k))&1)!==v) changed.push(k);
        cells[k].textContent=v;
        cells[k].className=v?'one':'';
      }
      if(animate && last!==null){
        changed.forEach(function(k){
          cells[k].classList.add('flip');
          setTimeout(function(){ cells[k].classList.remove('flip'); },220);
        });
      }
      last=word;
    }
    cells.forEach(function(c,k){
      function flip(){ if(onFlip) onFlip(k); }
      c.onclick=flip;
      c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
    });
    return { render:render };
  }
  function wordOf(x){
    var b=new ArrayBuffer(4), d=new DataView(b); d.setFloat32(0,x); return d.getUint32(0);
  }
  function floatOf(word){
    var b=new ArrayBuffer(4), d=new DataView(b); d.setUint32(0,word>>>0); return d.getFloat32(0);
  }

  /* ---------- slide 09 · the layout ---------- */
  var fIn = document.getElementById('fIn');
  if (fIn){
    var strip = makeStrip('fS','fE','fM', function(k){
      var w = wordOf(parseFloat(fIn.value)||0) ^ (1<<(31-k));
      fIn.value = fmt(floatOf(w>>>0));
      draw(true);
    });
    function draw(anim){
      var x=parseFloat(fIn.value); if(isNaN(x)) x=0;
      var b=bitsOf(x);
      strip.render(wordOf(x), anim!==false);
      var er=b.e-127;
      var mant = b.m.toString(2).padStart(23,'0').replace(/0+$/,'');
      var mantStr = (b.e===0)
        ? '0.'+(mant||'0')
        : '1.'+(mant||'0');
      document.getElementById('fSci').textContent=(b.s?'-':'')+mantStr+' \u00d7 2'+sup(b.e===0?-126:er);
      document.getElementById('fEs').textContent=b.e;
      document.getElementById('fEr').textContent=er;
    }
    fIn.addEventListener('input',function(){ draw(true); });

    var cbox=document.getElementById('fChips');
    ['13','2','0.5','0.1','1','16777216'].forEach(function(v){
      var c=document.createElement('span');
      c.className='chip'; c.textContent=v; c.tabIndex=0;
      c.onclick=function(){ fIn.value=v; draw(true); };
      c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();fIn.value=v;draw(true);} };
      cbox.appendChild(c);
    });
    draw(false);
  }

  /* ---------- slide 15 · the whole machine ---------- */
  var mVal = document.getElementById('mVal');
  if (mVal){
    var word = wordOf(1);
    var mStrip = makeStrip('mS','mE','mM', function(k){
      word = (word ^ (1<<(31-k)))>>>0; show();
    });
    function flash(el){
      el.classList.add('flash');
      setTimeout(function(){ el.classList.remove('flash'); },260);
    }
    function show(anim){
      var x = floatOf(word);
      var b = bitsOf(x);
      mStrip.render(word, anim!==false);

      var er = b.e-127;
      var gap = (b.e===0) ? Math.pow(2,-149) : Math.pow(2, er-23);
      var prev = x-gap, nxt = x+gap;

      mVal.textContent = fmt(x);
      document.getElementById('mSca').textContent = '2'+sup(b.e===0?-126:er);
      document.getElementById('mGap').textContent = fmt(gap);
      document.getElementById('mPrev').textContent = fmt(prev);
      document.getElementById('mHere').textContent = fmt(x);
      document.getElementById('mNext').textContent = fmt(nxt);
      document.getElementById('mGap2').textContent = 'one step = '+fmt(gap);
      if(anim!==false){ flash(mVal); flash(document.getElementById('mGap')); }
    }
    function bumpExp(d){
      var b=bitsOf(floatOf(word));
      var e=Math.max(1,Math.min(254,b.e+d));
      word = (((b.s&1)<<31)|(e<<23)|b.m)>>>0; show();
    }
    function bumpMan(d){
      var v=floatOf(word);
      if(!isFinite(v)) return;
      word = wordOf(v)+d; word=word>>>0; show();
    }
    document.getElementById('eUp').onclick=function(){ bumpExp(1); };
    document.getElementById('eDn').onclick=function(){ bumpExp(-1); };
    document.getElementById('mUp').onclick=function(){ bumpMan(1); };
    document.getElementById('mDn').onclick=function(){ bumpMan(-1); };

    var mbox=document.getElementById('mChips');
    [['1',1],['0.1',0.1],['2\u00b2\u2074',16777216],['2\u00b2\u00b3',8388608],['max',3.4028234663852886e38]]
      .forEach(function(p){
        var c=document.createElement('span');
        c.className='chip'; c.textContent=p[0]; c.tabIndex=0;
        c.onclick=function(){ word=wordOf(p[1]); show(); };
        c.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();word=wordOf(p[1]);show();} };
        mbox.appendChild(c);
      });
    show(false);
  }

  /* ---------- slide 14 · the stride ---------- */
  var expR = document.getElementById('expR');
  if (expR){
    function stride(){
      var E=parseInt(expR.value,10);
      var v=Math.pow(2,E);
      var nx=nextUp(v), gap=nx-v;
      document.getElementById('sVal').textContent=fmt(v);
      document.getElementById('sNext').textContent=fmt(nx);
      document.getElementById('sGap').textContent=fmt(gap);
      document.getElementById('sPow').textContent='2'+sup(E-23);
      var note='';
      if(E-23===0) note='One step is exactly 1. Every whole number below here exists.';
      else if(E-23===1) note='One step is exactly 2. There are no odd whole numbers past here.';
      else if(E-23>1) note='Whole numbers are being skipped, '+fmt(gap-1)+' of them at a time.';
      else if(E<0) note='Finer than one. This is where fractions live, and it is still not exact.';
      document.getElementById('strideNote').textContent=note;
    }
    expR.addEventListener('input',stride); stride();
  }

  /* ---------- slide 15 · the tick strip ---------- */
  var host=document.getElementById('tickHost');
  if(host){
    var svgns='http://www.w3.org/2000/svg', x=40, gap=1.5;
    while(x<1350){
      var ln=document.createElementNS(svgns,'line');
      ln.setAttribute('x1',x); ln.setAttribute('x2',x);
      ln.setAttribute('y1',104); ln.setAttribute('y2',136);
      host.appendChild(ln);
      gap*=1.055; x+=gap;
    }
  }

  paint();
})();
</script>
