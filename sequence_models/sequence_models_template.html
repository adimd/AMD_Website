<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">

  <!-- Theme colors:
       #f6eaaf (light yellow), #ead3c1 (soft peach), #941236 (deep maroon) -->
  <style>
    :root {
      --bg-main: #f6eaaf;
      --bg-card: #ffffff;
      --bg-soft: #ead3c1;
      --accent:  #941236;
      --text-main: #222222;
      --text-muted: #555555;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #ffffff, var(--bg-main));
      color: var(--text-main);
      line-height: 1.7;
    }

    .page-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3.5rem;
    }

    /* Main layout: article + sidebar */
    .blog-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    .blog-card {
      background: var(--bg-card);
      border-radius: 1.25rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2.75rem;
      border-top: 6px solid var(--accent);
      flex: 3;
    }

    .blog-sidebar {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .blog-layout {
        flex-direction: column;
      }

      .blog-sidebar {
        width: 100%;
      }
    }

    @media (max-width: 768px) {
      .blog-card {
        padding: 1.75rem 1.5rem;
        border-radius: 1rem;
      }
    }

    .blog-meta {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .series-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .series-tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    h1 {
      font-size: 2.1rem;
      margin: 0.4rem 0 0.75rem;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .blog-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
    }

    h2 {
      font-size: 1.7rem;
      margin-top: 2.25rem;
      margin-bottom: 0.6rem;
      color: var(--accent);
    }

    h3 {
      font-size: 1.3rem;
      margin-top: 1.6rem;
      margin-bottom: 0.4rem;
      color: #7a0f29;
    }

    p {
      margin: 0.5rem 0 0.9rem;
      font-size: 1.2rem;
    }

    strong {
      color: #3a111c;
    }

    .emphasis-line {
      padding: 0.7rem 1rem;
      border-left: 4px solid var(--accent);
      background: #fff8e7;
      border-radius: 0.6rem;
      font-size: 1.2rem;
      margin: 1rem 0 1.4rem;
    }

    .timeline-callout {
      background: var(--bg-soft);
      border-radius: 0.9rem;
      padding: 1rem 1.1rem;
      margin: 1.4rem 0;
      font-size: 0.93rem;
    }

    .timeline-callout-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
    }

    ul {
      padding-left: 1.3rem;
      margin: 0.25rem 0 1rem;
    }

    li {
      margin: 0.2rem 0;
      font-size: 1.2rem;
    }

    .muted {
      color: var(--text-muted);
    }

    .inline-question {
      font-style: italic;
      color: #4a222b;
    }

    .section-divider {
      margin: 2.2rem 0 1.8rem;
      height: 1px;
      border: none;
      background: linear-gradient(to right, transparent, #d7b2a3, transparent);
    }

    /* Sidebar cards + links */
    .sidebar-card {
      background: #fffdf7;
      border-radius: 1rem;
      padding: 1.1rem 1.1rem 1.2rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(148, 18, 54, 0.08);
    }

    .sidebar-title {
      font-size: 1.1rem;
      margin: 0 0 0.75rem;
      color: var(--accent);
    }

    .sidebar-title-sm {
      font-size: 0.98rem;
      margin: 0 0 0.6rem;
      color: #7a0f29;
    }

    .sidebar-link {
      display: block;
      padding: 0.5rem 0.4rem;
      border-radius: 0.6rem;
      text-decoration: none;
      background: transparent;
      transition: background 0.18s ease, transform 0.12s ease;
    }

    .sidebar-link + .sidebar-link {
      margin-top: 0.15rem;
    }

    .sidebar-link:hover {
      background: rgba(234, 211, 193, 0.5);
      transform: translateX(2px);
    }

    .sidebar-link-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #3a111c;
    }

    .sidebar-link-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sidebar-link-title-sm {
      font-size: 0.88rem;
      font-weight: 500;
      color: #3a111c;
    }

    .sidebar-empty {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Image blocks inside article */
    .image-block {
      margin: 1.6rem 0 1.3rem;
    }

    .image-frame {
      width: 100%;
      max-width: 780px;
      height: 260px;
      margin: 0 auto;
      border-radius: 0.9rem;
      border: 2px dashed rgba(148, 18, 54, 0.35);
      background: linear-gradient(
        135deg,
        rgba(246, 234, 175, 0.5),
        rgba(234, 211, 193, 0.6)
      );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      cursor: zoom-in; 
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .image-placeholder-text {
      font-size: 0.9rem;
      color: #5c2a33;
      text-align: center;
      padding: 0 1.5rem;
    }

    .image-placeholder-label {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(148, 18, 54, 0.8);
      background: rgba(255, 255, 255, 0.75);
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
    }

    .image-caption {
      max-width: 780px;
      margin: 0.5rem auto 0.2rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Image zoom modal */
    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .image-modal.open {
      display: flex;
    }

    .image-modal-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }

    .image-modal-img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 1rem;
      transform: scale(1.1);   
      transform-origin: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.5);
      background: #ffffff;
    }

    .image-modal-caption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #f6eaaf;
      text-align: center;
    }

    .image-modal-close {
      position: absolute;
      top: -10px;
      right: -10px;
      border: none;
      background: #ffffff;
      color: #941236;
      border-radius: 999px;
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    @media (max-width: 768px) {
      .image-frame {
        height: 210px;
      }
      .image-placeholder-text {
        font-size: 0.85rem;
        padding: 0 1rem;
      }
    }

    /* Comments section */
    .comments-section {
      margin-top: 3rem;
    }

    .comments-section h2 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>

  <!-- Dynamic sidebar data + logic -->
  <script src="/posts.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof BLOG_POSTS === "undefined") return;

      const articleEl = document.querySelector(".blog-card");
      if (!articleEl) return;

      const currentId = articleEl.dataset.postId;
      const currentSeriesId = articleEl.dataset.seriesId;

      const currentPost = BLOG_POSTS.find(p => p.id === currentId);
      if (!currentPost) return;

      const sameSeries = BLOG_POSTS
        .filter(p => p.seriesId === currentSeriesId && p.id !== currentId)
        .sort((a, b) => (a.part || 0) - (b.part || 0));

      const recent = BLOG_POSTS
        .filter(p => p.id !== currentId)
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 4);

      const seriesContainer = document.getElementById("series-posts");
      const recentContainer = document.getElementById("recent-posts");

      if (sameSeries.length === 0) {
        seriesContainer.innerHTML =
          '<p class="sidebar-empty">More parts in this series are on the way.</p>';
      } else {
        seriesContainer.innerHTML = sameSeries.map(p => `
          <a class="sidebar-link" href="${p.url}">
            <div class="sidebar-link-title">
              Part ${p.part}: ${p.title.replace(/^Part\\s*\\d+\\s*[–-]\\s*/, "")}
            </div>
            <div class="sidebar-link-meta">
              ${p.date}
            </div>
          </a>
        `).join("");
      }

      recentContainer.innerHTML = recent.map(p => `
        <a class="sidebar-link" href="${p.url}">
          <div class="sidebar-link-title-sm">${p.title}</div>
          <div class="sidebar-link-meta">${p.date}</div>
        </a>
      `).join("");
    });
  </script>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    // Lightbox / image zoom logic
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("image-modal-img");
    const modalCaption = document.getElementById("image-modal-caption");
    const modalClose = document.querySelector(".image-modal-close");

    if (!modal || !modalImg || !modalCaption || !modalClose) return;

    // Any <img> inside .image-frame becomes zoomable
    document.querySelectorAll(".image-frame img").forEach(function (img) {
      img.style.cursor = "zoom-in";
      img.addEventListener("click", function () {
        modalImg.src = img.src;
        modalImg.alt = img.alt || "";

        // Use the nearest .image-caption if available
        const captionEl = img.closest(".image-block")?.querySelector(".image-caption");
        modalCaption.textContent = captionEl
          ? captionEl.textContent.trim()
          : (img.alt || "");

        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      });
    });

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
      modalCaption.textContent = "";
    }

    modalClose.addEventListener("click", closeModal);

    // Click on dark background closes too
    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        closeModal();
      }
    });

    // ESC key closes
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && modal.classList.contains("open")) {
        closeModal();
      }
    });
  });
  </script>
