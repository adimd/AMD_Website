<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 08</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>

</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 08 · hour eight of fifty</div>
    <h1>Why does the<br>order matter?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Nothing today overflows, nothing is subnormal, no NaN turns up. Every number stays in the well behaved middle of the range, and the answers are still wrong.</p>
  </div>
  <div class="cue">Eleven programs. By the end they will predict an error before measuring it.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="01 · brackets" data-act="program 1">
  <div>
    <h2>Three numbers, added two ways.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 01-brackets.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> a =  <span class="s">1e8f</span>;
    <span class="f">float</span> b = <span class="s">-1e8f</span>;
    <span class="f">float</span> c =  <span class="s">1.0f</span>;

    printf(<span class="s">"a = %g   b = %g   c = %g\n"</span>, a, b, c);
    printf(<span class="s">"(a + b) + c = %g\n"</span>, (a + b) + c);
    printf(<span class="s">"a + (b + c) = %g\n"</span>, a + (b + c));
    printf(<span class="s">"a + b == b + a   %s\n"</span>,
           a + b == b + a ? <span class="s">"true"</span> : <span class="s">"false"</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">a = 1e+08   b = -1e+08   c = 1
(a + b) + c = <span class="ok">1</span>
a + (b + c) = <span class="bad">0</span>
a + b == b + a   <span class="ok">true</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Float addition is still commutative. Swapping two operands never changes anything.</li>
            <li>It is not associative. Moving the brackets changes the answer.</li>
            <li>That single fact is why a compiler is not allowed to rearrange your arithmetic.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Ask which one is right. Neither. Both are the correctly rounded result of the operations as written.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="02 · the gap" data-act="program 2">
  <div>
    <h2>To explain it we need one number: how far apart floats are.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 02-gaps.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;math.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> x[] = { <span class="s">1.0f</span>, <span class="s">100.0f</span>, <span class="s">10000.0f</span>,
                  <span class="s">1000000.0f</span>, <span class="s">100000000.0f</span> };

    printf(<span class="s">"at this size    the next float is this far away\n"</span>);
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">5</span>; i++)
        printf(<span class="s">"%-15g %g\n"</span>, x[i],
               nextafterf(x[i], <span class="s">2</span> * x[i]) - x[i]);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">at this size    the next float is this far away
1               1.19209e-07
100             7.62939e-06
10000           0.000976562
1e+06           0.0625
1e+08           <span class="bad">8</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>The gap is always about the number divided by 8 million. It grows as the number grows.</li>
            <li>Near 100 million, consecutive floats are 8 apart. There is no float between 100000000 and 100000008.</li>
            <li>So <code>1e8 + 1</code> has nowhere to land, and comes straight back to 1e8. That is why the brackets mattered.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Go back to program 1 with this in hand. b + c is 1e8 plus one, which rounds back, so a + that is zero.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="03 · what vanishes" data-act="program 3">
  <div>
    <h2>So how small does an addend have to be before it does nothing?</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 03-swallowed.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> x[] = { <span class="s">1.0f</span>, <span class="s">100.0f</span>, <span class="s">10000.0f</span>,
                  <span class="s">1000000.0f</span>, <span class="s">100000000.0f</span> };

    printf(<span class="s">"running total   "</span>
           <span class="s">"anything smaller than this adds nothing\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">5</span>; i++) {
        <span class="f">float</span> y = <span class="s">1.0f</span>;
        <span class="k">while</span> (x[i] + y != x[i]) y = y / <span class="s">2.0f</span>;
        printf(<span class="s">"%-15g %g\n"</span>, x[i], y * <span class="s">2</span>);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">running total   anything smaller than this adds nothing
1               1.19209e-07
100             7.62939e-06
10000           0.000976562
1e+06           0.0625
1e+08           <span class="bad">2</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>At 1e8 the gap is 8, but anything under 2 disappears. The threshold is a quarter of the gap here, not half, because 1e8 sits on a power of two boundary.</li>
            <li>The loop finds it by halving until the addition stops having an effect. No theory needed.</li>
            <li>Adding a small number to a large one is the operation that loses information. Keep running totals small.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Worth pausing on 1e8. Adding one to a hundred million, a million times, still leaves you at a hundred million.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="04 · a million tenths" data-act="program 4">
  <div>
    <h2>Now something completely ordinary.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 04-million.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> sum = <span class="s">0.0f</span>;

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000000</span>; i++)
        sum += <span class="s">0.1f</span>;

    printf(<span class="s">"added 0.1 a million times\n"</span>);
    printf(<span class="s">"expected  100000\n"</span>);
    printf(<span class="s">"got       %.4f\n"</span>, sum);
    printf(<span class="s">"error     %+.4f   (%.3f%%)\n"</span>,
           sum - <span class="s">100000.0f</span>,
           (sum - <span class="s">100000.0f</span>) / <span class="s">1000.0f</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">added 0.1 a million times
expected  100000
got       <span class="hit">100958.3438</span>
error     <span class="bad">+958.3438</span>   (<span class="bad">0.958%</span>)</div>
        <div class="rem frag">
          <div class="h">the question for this hour</div>
          <ul>
            <li>One rounding is at most half a gap, about one part in sixteen million.</li>
            <li>A million of them produced an error of one part in a hundred. Four orders of magnitude worse.</li>
            <li>Where did 958 come from? By the end of the hour you will work it out on paper before running the program.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Do not explain yet. Let them guess. Most say the errors piled up randomly, which is wrong and worth being wrong about.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="05 · the mechanism" data-act="program 5">
  <div>
    <h2>Look at one addition, in slow motion.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 05-band.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;math.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> s = <span class="s">40000.0f</span>;
    <span class="f">float</span> gap = nextafterf(s, <span class="s">2</span> * s) - s;

    printf(<span class="s">"running total      %g\n"</span>, s);
    printf(<span class="s">"gap here           %g\n"</span>, gap);
    printf(<span class="s">"0.1 is             %.2f gaps\n"</span>, <span class="s">0.1f</span> / gap);
    printf(<span class="s">"so it must move    %.0f gaps\n\n"</span>,
           floorf(<span class="s">0.1f</span> / gap + <span class="s">0.5f</span>));

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">5</span>; i++) {
        <span class="f">float</span> before = s;
        s += <span class="s">0.1f</span>;
        printf(<span class="s">"%.4f + 0.1  -&gt;  %.4f    added %.7f\n"</span>,
               before, s, s - before);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">running total      40000
gap here           0.00390625
0.1 is             <span class="hit">25.60 gaps</span>
so it must move    <span class="hit">26 gaps</span>

40000.0000 + 0.1  ->  40000.1016    added <span class="bad">0.1015625</span>
40000.1016 + 0.1  ->  40000.2031    added <span class="bad">0.1015625</span>
40000.2031 + 0.1  ->  40000.3047    added <span class="bad">0.1015625</span>
40000.3047 + 0.1  ->  40000.4062    added <span class="bad">0.1015625</span>
40000.4062 + 0.1  ->  40000.5078    added <span class="bad">0.1015625</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>A float can only land on the grid. 0.1 is 25.6 gaps, and you cannot move 25.6 gaps, so it moves 26.</li>
            <li>Every addition adds 0.1015625 instead of 0.1. Too much by 0.0015625.</li>
            <li>The situation is identical each time, so the decision is identical each time. This is not a random walk. It is the same mistake, repeated.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">This is the slide the whole class turns on. The five identical numbers in the right column are the evidence.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Why the direction flips" data-act="the model">
  <div>
    <h2>The direction changes as the total grows, in a pattern.</h2>
    <p class="small" style="max-width:none;margin-bottom:4px">Each time the running total passes a power of two, the gap doubles, so 0.1 is worth half as many gaps as before.</p>
    <div class="cyc" id="cycRow"></div>
    <div class="split" style="gap:34px;margin-top:6px">
      <div class="stack">
        <p>When the fraction is <span class="num">.6</span> or <span class="num">.8</span> it rounds up and the total runs fast. When it is <span class="num">.2</span> or <span class="num">.4</span> it rounds down and the total runs slow.</p>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>The fractions cycle with period four: .2, .6, .8, .4, and round again.</li>
          <li>0.1 in binary is 0.0001100110011... with a repeating block of four.</li>
          <li>The repeating block of one tenth turns up as the drift pattern of a loop.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Write 0.1 in binary on the board and circle the repeating 0011. Then point at the four boxes.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="06 · predict it" data-act="program 6">
  <div>
    <h2>That is enough to work out the answer before running it.</h2>
    <div class="prog" style="grid-template-columns:.92fr 1.08fr">
      <div>
<pre class="xs"><span class="c">/* 06-predict.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;math.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">double</span> predicted = <span class="s">0</span>;

    <span class="k">for</span> (<span class="f">int</span> e = <span class="s">10</span>; e &lt;= <span class="s">16</span>; e++) {
        <span class="f">double</span> hi   = pow(<span class="s">2</span>, e + <span class="s">1</span>) &gt; <span class="s">100000</span> ? <span class="s">100000</span> : pow(<span class="s">2</span>, e + <span class="s">1</span>);
        <span class="f">double</span> gap  = pow(<span class="s">2</span>, e - <span class="s">23</span>);
        <span class="f">double</span> got  = floor(<span class="s">0.1</span> / gap + <span class="s">0.5</span>) * gap;
        <span class="f">double</span> err  = got - <span class="s">0.1</span>;
        <span class="f">double</span> adds = (hi - pow(<span class="s">2</span>, e)) / got;

        predicted += err * adds;
        printf(<span class="s">"2^%-2d   %-10.7f %-9.2f %-10.7f %+.7f  %-8.0f %+.1f
"</span>,
               e, gap, <span class="s">0.1</span> / gap, got, err, adds, err * adds);
    }

    <span class="f">float</span> sum = <span class="s">0.0f</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000000</span>; i++) sum += <span class="s">0.1f</span>;

    printf(<span class="s">"
predicted  %+.1f
measured   %+.1f
"</span>,
           predicted, sum - <span class="s">100000.0f</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Each band takes twice as many additions as the one before, so the last two bands do almost all the damage.</li>
            <li>Predicted +943.7 against measured +958.3, which is 1.5% out.</li>
            <li>Floating point error is not luck. Given the magnitudes and the operation count, you can compute it in advance.</li>
          </ul>
        </div>
      </div>
      <div>

  <div class="cue">The residual is real and explainable: the band boundaries are approximate because the sum accelerates. Say so rather than hiding it.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="07 · split the work" data-act="program 7">
  <div>
    <h2>Same million numbers, added in groups.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 07-chunks.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    printf(<span class="s">"chunks   sum          error\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> chunks = <span class="s">1</span>; chunks &lt;= <span class="s">4096</span>; chunks *= <span class="s">8</span>) {
        <span class="f">int</span> per = <span class="s">1000000</span> / chunks;
        <span class="f">float</span> total = <span class="s">0.0f</span>;

        <span class="k">for</span> (<span class="f">int</span> k = <span class="s">0</span>; k &lt; chunks; k++) {
            <span class="f">float</span> part = <span class="s">0.0f</span>;
            <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; per; i++) part += <span class="s">0.1f</span>;
            total += part;
        }
        printf(<span class="s">"%6d   %-12.4f %+.4f\n"</span>,
               chunks, total, total - <span class="s">100000.0f</span>);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">chunks   sum          error
     1   100958.3438  <span class="bad">+958.3438</span>
     8   99910.3203   <span class="bad">-89.6797</span>
    64   99985.0000   <span class="bad">-15.0000</span>
   512   99995.0156   <span class="bad">-4.9844</span>
  4096   99938.4922   <span class="bad">-61.5078</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Five ways of adding the same million numbers. Five different answers.</li>
            <li>Splitting the work keeps every running total small, so the grid stays fine and less is lost per step.</li>
            <li>This is what a parallel reduction does. Change the number of threads and you change the answer, without changing the program.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Note that more chunks is not simply better. 4096 is worse than 512, because combining that many partial sums has its own rounding.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="08 · keep the crumbs" data-act="program 8">
  <div>
    <h2>Or keep track of what you dropped.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 08-kahan.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> naive = <span class="s">0.0f</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000000</span>; i++)
        naive += <span class="s">0.1f</span>;

    <span class="f">float</span> sum = <span class="s">0.0f</span>, lost = <span class="s">0.0f</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000000</span>; i++) {
        <span class="f">float</span> y = <span class="s">0.1f</span> - lost;   <span class="c">/* put back what we dropped */</span>
        <span class="f">float</span> t = sum + y;
        lost = (t - sum) - y;    <span class="c">/* what got dropped now     */</span>
        sum = t;
    }

    printf(<span class="s">"naive        %.4f   error %+.4f\n"</span>,
           naive, naive - <span class="s">100000.0f</span>);
    printf(<span class="s">"compensated  %.4f   error %+.4f\n"</span>,
           sum, sum - <span class="s">100000.0f</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">naive        100958.3438   error <span class="bad">+958.3438</span>
compensated  100000.0000   error <span class="ok">+0.0000</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li><code>(t - sum) - y</code> recovers exactly the part of y that did not fit. It is not an estimate.</li>
            <li>That crumb is small, so it is added to the next small value rather than to the large total, where it would vanish again.</li>
            <li>Six extra lines and four times the additions, and the error goes to zero. This is Kahan summation.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Trace one iteration by hand at 40000. The crumb is exactly the 0.0015625 from program 5.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="09 · cancellation" data-act="program 9">
  <div>
    <h2>A different failure, with the same cause.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 09-cancel.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> x = <span class="s">1e-8f</span>;
    <span class="f">float</span> sum = <span class="s">1.0f</span> + x;

    printf(<span class="s">"x           = %.10e\n"</span>, x);
    printf(<span class="s">"x == 0        %s\n"</span>,
           x == <span class="s">0.0f</span> ? <span class="s">"true"</span> : <span class="s">"false"</span>);
    printf(<span class="s">"1 + x       = %.10e\n"</span>, sum);
    printf(<span class="s">"(1 + x) - 1 = %.10e\n"</span>, sum - <span class="s">1.0f</span>);
    printf(<span class="s">"gap at 1.0  = %.10e\n"</span>, <span class="s">1.1920929e-07f</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">x           = 9.9999999392e-09
x == 0        <span class="ok">false</span>
1 + x       = 1.0000000000e+00
(1 + x) - 1 = <span class="bad">0.0000000000e+00</span>
gap at 1.0  = 1.1920929e-07</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>x is nowhere near zero, but it is smaller than the gap at 1.0, so the addition threw it away.</li>
            <li>The subtraction is exact. It performed no rounding at all.</li>
            <li>The error was already there. Subtracting nearly equal numbers only removes the leading digits that were hiding it.</li>
            <li>When a result looks wrong, suspect the step before the subtraction, not the subtraction.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">This is the one students misdiagnose. They blame the subtraction. The subtraction is the only honest operation on the slide.</div>
</section>

<section class="slide" data-t="10 · Dhahran" data-act="program 10">
  <div>
    <h2>The same arithmetic, on a system that was keeping time.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 10-dhahran.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="c">/* the Patriot clock counted tenths of a second in a
       fixed point register, keeping 23 bits after the point */</span>
    <span class="f">double</span> stored = <span class="s">0.0</span>, bit = <span class="s">0.5</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">23</span>; i++) {
        <span class="k">if</span> (stored + bit &lt;= <span class="s">0.1</span>) stored += bit;
        bit /= <span class="s">2.0</span>;
    }

    <span class="f">double</span> err   = <span class="s">0.1</span> - stored;
    <span class="f">long</span>   ticks = <span class="s">100L</span> * <span class="s">3600L</span> * <span class="s">10L</span>;
    <span class="f">double</span> drift = err * ticks;

    printf(<span class="s">"0.1 kept in 23 bits = %.20f\n"</span>, stored);
    printf(<span class="s">"error per tick      = %.4e seconds\n"</span>, err);
    printf(<span class="s">"ticks in 100 hours  = %ld\n"</span>, ticks);
    printf(<span class="s">"clock is now off by = %.4f seconds\n"</span>, drift);
    printf(<span class="s">"a Scud at Mach 5    = %.0f metres\n"</span>,
           drift * <span class="s">1676.0</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">0.1 kept in 23 bits = 0.09999990463256835938
error per tick      = <span class="hit">9.5367e-08</span> seconds
ticks in 100 hours  = 3600000
clock is now off by = <span class="bad">0.3433</span> seconds
a Scud at Mach 5    = <span class="bad">575</span> metres</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>One tenth has no exact binary form, so a fixed point clock ticking in tenths drifts by a fixed amount every tick.</li>
            <li>Exactly the arithmetic from program 6: one error, multiplied by an operation count.</li>
            <li>Dhahran, 25 February 1991. The battery had been running about 100 hours. The interceptor missed. Twenty eight people were killed.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">The figures match the US government report: 0.000000095 seconds per tick and 0.34 seconds after a hundred hours. This is the same program, not a retelling.</div>
</section>

    <h2>And then the part that has nothing to do with arithmetic.</h2>
    <div class="split" style="margin-top:8px">
      <div class="stack">
        <p>The problem was already known. A modified version of the software, with the drift corrected, had been written and was on its way.</p>
        <p class="frag">It reached Dhahran <strong>the following day</strong>.</p>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>The system was never designed to run for a hundred hours without a restart. Field use changed and the assumption did not.</li>
          <li>Rebooting reset the clock, so a machine that was restarted regularly never showed the fault.</li>
          <li>A numerical bug and a deployment failure are different problems, and this incident is both.</li>
        </ul>
      </div>
    </div>
  </div>

<section class="slide" data-t="11 · the compiler" data-act="program 11">
  <div>
    <h2>One more source of a different answer.</h2>
    <div class="split" style="gap:34px;margin-top:6px">
      <div>
<pre><span class="c">/* 11-reorder.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> sum = <span class="s">0.0f</span>;

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000000</span>; i++)
        sum += <span class="s">0.1f</span>;

    printf(<span class="s">"%.4f\n"</span>, sum);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">$ gcc 11-reorder.c -o r -O0
$ ./r
100958.3438

$ gcc 11-reorder.c -o r -O2
$ ./r
100958.3438

$ gcc 11-reorder.c -o r -O2 <span class="hit">-ffast-math</span>
$ ./r
<span class="bad">99759.8516</span></div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>At -O2 the compiler optimises heavily and still does not touch the order, because it is not allowed to.</li>
        <li>-ffast-math is you telling it that it may pretend float addition is associative. It then splits the loop into parallel accumulators, which is faster and gives a different answer.</li>
        <li>Same source, same machine, same input. The flag is a promise you make, not an optimisation you get for free.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Run all three compiles live. The -O2 line matters: it shows restraint, not incapability.</div>
</section>

<!-- 15 -->
<section class="slide" data-t="Where the hour lands" data-act="close">
  <div>
    <h2>Floats round. Rounding depends on what you are holding.</h2>
    <div class="split" style="margin-top:10px">
      <div class="rem" style="margin-top:0">
        <div class="h">the three questions to ask</div>
        <ul>
          <li>What magnitudes is this running at, and what is the gap there?</li>
          <li>How many operations happen, and does the running total grow through them?</li>
          <li>Does anything subtract two numbers that are nearly equal?</li>
        </ul>
      </div>
      <div class="rem" style="margin-top:0;border-left-color:var(--ok)">
        <div class="h" style="color:var(--ok)">and what to do about it</div>
        <ul>
          <li>Keep running totals small. Split the work, or sort smallest first.</li>
          <li>Keep the crumbs, if the accuracy is worth four times the additions.</li>
          <li>Do not compare floats for equality. Compare against a tolerance you chose deliberately.</li>
        </ul>
      </div>
    </div>
    <p class="big frag" style="margin-top:18px;max-width:none;font-size:26px">None of this is a defect. It is a finite grid behaving exactly as specified, and it is predictable once you know where the grid lines are.</p>
  </div>
  <div class="cue">Send off: take program 4 and make it accurate without using Kahan and without changing the type. Sorting is one answer. There are others.</div>
</section>
