<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 1 · What is a number?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de;
  --stage:#faf9f6;
  --card:#ffffff;
  --ink:#15171b;
  --body:#4b5057;
  --soft:#8b9096;
  --rule:#e2e0d9;
  --rule2:#c6c3ba;
  --accent:#23408f;
  --accent-soft:#eaeef7;
  --fail:#a8231f;
  --fail-soft:#fbeeed;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

/* ---------- the stage: fixed 1600x900, scaled to fit ---------- */
#stage{
  position:absolute;top:50%;left:50%;
  width:1600px;height:900px;
  transform-origin:50% 50%;
  background:var(--stage);
  box-shadow:0 24px 70px rgba(20,22,28,.16);
  overflow:hidden;
}
.slide{position:absolute;inset:0;padding:74px 96px 108px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- chrome (inside stage, so it scales) ---------- */
.eyebrow{position:absolute;top:34px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
#rail{position:absolute;left:96px;right:96px;bottom:38px;display:flex;gap:4px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:62px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:62px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

/* ---------- type ---------- */
.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.kicker.grey{color:var(--soft)}
.kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:104px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:66px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:30px}
h3{font-weight:700;font-size:24px;color:var(--ink);margin-bottom:8px;line-height:1.25}
p{font-size:30px;line-height:1.48;max-width:30ch}
p+p{margin-top:18px}
.big{font-size:40px;line-height:1.3;color:var(--ink);font-weight:300;max-width:24ch}
.small{font-size:22px;line-height:1.5;color:var(--soft);max-width:56ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;color:var(--accent);background:var(--accent-soft);padding:.06em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.l{grid-template-columns:1.06fr .94fr}
.split.r{grid-template-columns:.9fr 1.1fr}
.stack>*+*{margin-top:20px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

/* ---------- video ---------- */
.video{position:relative;width:100%;padding-top:56.25%;background:#0d1013;border-radius:10px;overflow:hidden;box-shadow:0 16px 40px rgba(20,22,28,.2)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcap{font-family:var(--mono);font-size:15px;color:var(--soft);letter-spacing:.12em;margin-top:16px;text-transform:uppercase}
.vhold{width:1000px;margin:0 auto}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 32px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid4 .panel{padding:24px 22px}
.grid4 h3{font-size:21px}
.grid4 .cap{font-size:19px;line-height:1.4;color:var(--body);margin-top:10px}
.grid4 .n{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--soft);display:block;margin-bottom:14px}

/* ---------- bits ---------- */
.bits{display:flex;gap:4px}
.bits.tight{gap:2px}
.bits b{
  width:44px;height:52px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:20px;font-weight:700;
  background:#f1efe9;color:#a9a69d;border:1px solid var(--rule2);border-radius:4px;
}
.bits b.one{background:var(--accent);color:#fff;border-color:var(--accent)}
.bits.tight b{width:100%;flex:1;height:44px;font-size:15px;border-radius:3px}
.bits b.dead{background:repeating-linear-gradient(45deg,#efece5,#efece5 5px,#e5e1d8 5px,#e5e1d8 10px);border-style:dashed;color:#b6b2a8}
.bits b.dead.one{background:repeating-linear-gradient(45deg,#f8e2e0,#f8e2e0 5px,#f2d2cf 5px,#f2d2cf 10px);color:var(--fail)}
.bits b.sign{border-width:2px;border-color:var(--ink)}
.bits b.sign.one{background:var(--fail);border-color:var(--fail)}
.bgroup{display:flex;gap:34px;align-items:flex-start}
.bgroup .cap{font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:12px;text-align:center}
.bgroup .cap.bad{color:var(--fail)}

input[type=number]{font-family:var(--mono);font-size:26px;background:var(--stage);color:var(--ink);border:2px solid var(--rule2);border-radius:7px;padding:6px 10px;width:6.5ch}
.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);border:1px solid var(--rule2);border-radius:7px;padding:11px 16px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:13px 4px;border-bottom:1px solid var(--rule);font-size:26px}
.readout td:first-child{color:var(--soft);font-size:15px;letter-spacing:.12em;text-transform:uppercase;width:14rem}
.readout td:last-child{color:var(--ink);text-align:right;font-weight:700}
.readout tr:last-child td{border-bottom:none}
.readout td.bad{color:var(--fail)}

/* ---------- code / terminal ---------- */
pre{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.65;color:#d9dee6;box-shadow:0 14px 34px rgba(20,22,28,.22);overflow:hidden}
pre .c{color:#7f8896;font-style:italic}
pre .k{color:#ff96a2}
pre .s{color:#ffd47e}
pre .f{color:#84d8ea}
.term{background:#14181f;border-radius:12px;padding:26px 30px;font-family:var(--mono);font-size:23px;line-height:1.8;color:#9fe8b8;box-shadow:0 14px 34px rgba(20,22,28,.22)}
.term .dim{color:#7f8896}
.term .hit{color:#ffd47e;font-weight:700}

/* ---------- svg figures ---------- */
figure{width:100%}
figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:14px}
svg text{font-family:'JetBrains Mono',monospace}

/* ---------- fragments / notes ---------- */
.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{
  position:absolute;left:96px;right:96px;bottom:92px;display:none;
  padding:14px 18px;border-left:4px solid var(--fail);background:var(--fail-soft);
  color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6;
}
body.cues .cue{display:block}

/* ---------- jump ---------- */
#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:80px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:28px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:24px;color:var(--body);display:flex;gap:20px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 01</b></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 1 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title">
  <div>
    <div class="kicker">Class 01 · hour one of fifty</div>
    <h1>What is<br>a number?</h1>
    <p class="big" style="margin-top:44px;max-width:30ch">This hour is four things that went wrong. I am not going to explain any of them until the end.</p>
  </div>
  <div class="cue">Don't introduce the syllabus. Don't say your name. First video within ninety seconds of walking in.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Ground rules">
  <div>
    <div class="kicker grey">before we start</div>
    <h2>All four are real.<br>All four shipped.</h2>
    <div class="split">
      <div class="stack">
        <p>Written by people who were good at their jobs. Reviewed, tested, signed off by somebody.</p>
        <p>So the question is not who was careless.</p>
      </div>
      <div class="stack">
        <p class="big frag">The question is what these four have in common.</p>
        <p class="small frag">Write your guess down now. You have about twenty minutes.</p>
      </div>
    </div>
  </div>
  <div class="cue">Make them physically write the guess. People who commit to a wrong answer remember the right one.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="① the video">
  <div>
    <div class="kicker" style="text-align:center">the first one</div>
    <div class="vhold">
      <div class="video">
        <iframe src="https://www.youtube-nocookie.com/embed/iXKvwPjCGnY?rel=0" title="Failure one" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
      </div>
      <p class="vcap" style="text-align:center">watch · no notes yet</p>
    </div>
  </div>
  <div class="cue">Play it. Say nothing over the top. Let the room react on its own.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="① 271 into 8 bits">
  <div>
    <div class="kicker red">what actually happened</div>
    <h2 style="margin-bottom:24px">A colour value of 271.</h2>
    <div class="split l" style="gap:56px">
      <div class="stack">
        <p>One number gets calculated. It is <span class="num">271</span>.</p>
        <p>It gets written into a box built to hold values up to <span class="num">255</span>. Eight bits. Eight actual wires.</p>
        <p class="big frag" style="margin-top:14px">What came out the other side?</p>
      </div>
      <div class="panel">
        <span class="lab">put a number in · watch the left</span>
        <div class="bgroup">
          <div>
            <div class="bits" id="cDead"></div>
            <div class="cap bad">no wires here</div>
          </div>
          <div style="flex:1">
            <div class="bits" id="cLive"></div>
            <div class="cap">the 8-bit container</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:22px;margin-top:30px">
          <input type="number" id="cIn" value="271">
          <span style="font-family:var(--mono);font-size:34px;color:var(--soft)">→</span>
          <span style="font-family:var(--mono);font-size:48px;font-weight:700;color:var(--fail)" id="cOut">15</span>
        </div>
        <p class="small" style="margin-top:18px;font-size:20px">Nothing was reported. Nothing was logged. <span id="cLost"></span></p>
      </div>
    </div>
  </div>
  <div class="cue">Take two or three guesses out loud before you touch it. Most say 255, or "it errors". Almost nobody says 15.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="② the video">
  <div>
    <div class="kicker" style="text-align:center">the second one</div>
    <div class="vhold">
      <div class="video">
        <iframe src="https://www.youtube-nocookie.com/embed/5tJPXYA0Nec?rel=0" title="Failure two" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
      </div>
      <p class="vcap" style="text-align:center">ariane 5 · flight 501 · 4 june 1996</p>
    </div>
  </div>
  <div class="cue">Play it twice if the room is quiet. Second viewing is when they start hunting for the moment.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="② a value off the end">
  <div>
    <div class="kicker red">what actually happened</div>
    <h2 style="margin-bottom:18px">Thirty-seven seconds.</h2>
    <div class="split r" style="gap:56px">
      <div class="stack">
        <p>The rocket was fine. The engines were fine. The guidance code had flown successfully for fifteen years.</p>
        <p>Ariane 5 just flew faster than Ariane 4.</p>
        <p class="frag">A number holding sideways velocity was copied into a box that holds up to <span class="num">32767</span>.</p>
      </div>
      <div>
        <figure>
          <svg viewBox="0 0 700 260" width="100%" role="img" aria-label="A 16-bit range with the arriving value far outside it">
            <rect x="30" y="96" width="330" height="46" fill="#eaeef7" stroke="#23408f" stroke-width="1.5" rx="3"/>
            <text x="34" y="86" font-size="15" fill="#23408f">0</text>
            <text x="300" y="86" font-size="15" fill="#23408f">32767</text>
            <text x="34" y="170" font-size="15" fill="#8b9096">EVERYTHING THIS BOX CAN HOLD</text>
            <line x1="30" y1="119" x2="640" y2="119" stroke="#c6c3ba" stroke-width="1.5" stroke-dasharray="1 0"/>
            <line x1="386" y1="98" x2="398" y2="140" stroke="#faf9f6" stroke-width="7"/>
            <line x1="398" y1="98" x2="410" y2="140" stroke="#faf9f6" stroke-width="7"/>
            <line x1="384" y1="100" x2="396" y2="138" stroke="#c6c3ba" stroke-width="2"/>
            <line x1="400" y1="100" x2="412" y2="138" stroke="#c6c3ba" stroke-width="2"/>
            <g class="fragsvg">
              <circle cx="596" cy="119" r="11" fill="#a8231f"/>
              <line x1="596" y1="60" x2="596" y2="105" stroke="#a8231f" stroke-width="2"/>
              <text x="596" y="46" font-size="16" fill="#a8231f" text-anchor="middle">the value that arrived</text>
              <text x="596" y="170" font-size="15" fill="#a8231f" text-anchor="middle">DOES NOT FIT</text>
            </g>
          </svg>
          <figcaption>the number line, and the edge of the box</figcaption>
        </figure>
        <p class="frag" style="max-width:none;margin-top:18px">Nothing checked. Forty seconds after lift-off the vehicle destroyed itself, with about <span class="num">$370M</span> aboard.</p>
      </div>
    </div>
  </div>
  <div class="cue">If somebody asks why it didn't fit — good. That is Class 12. Write their name on the board and move on.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="③ the clock">
  <div>
    <div class="kicker">the third one</div>
    <h2 style="margin-bottom:22px">A clock with thirty-two bits.</h2>
    <div class="split r" style="gap:56px">
      <div class="stack">
        <p>Most software keeps time by counting seconds since 1970. One counter. Thirty-two wires.</p>
        <p class="small" style="max-width:32ch">The leftmost wire is the one that decides whether the number is negative.</p>
      </div>
      <div class="panel">
        <span class="lab">seconds since 1 jan 1970</span>
        <div class="bits tight" id="tBits" style="margin-bottom:16px"></div>
        <div style="display:flex;align-items:baseline;gap:20px">
          <span style="font-family:var(--mono);font-size:15px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase">reads as</span>
          <span id="tDate" style="font-family:var(--mono);font-size:36px;font-weight:700;color:var(--ink)">—</span>
        </div>
        <div style="font-family:var(--mono);font-size:20px;color:var(--soft);margin-top:8px">counter = <span id="tVal">2147483645</span></div>
        <div class="btnrow">
          <button class="btn hot" id="tTick">add one second</button>
          <button class="btn" id="tRun">run to the edge</button>
          <button class="btn" id="tReset">back</button>
        </div>
      </div>
    </div>
    <p class="big frag" style="margin-top:26px;max-width:62ch;font-size:34px">Every bit changed at once, the sign bit came on, and the machine now believes it is 1901. It did not stop. It did not warn anybody. It carries on doing its job.</p>
  </div>
  <div class="cue">Use "run to the edge" — it slows down as it approaches. Then wait. The silence at 1901 is the whole demo.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="④ type this in">
  <div>
    <div class="kicker">the fourth one</div>
    <h2 style="margin-bottom:22px">This one is on your laptop.</h2>
    <div class="split l" style="gap:56px">
      <div class="stack">
        <p>Not a rocket, not thirty years ago. Open an editor and type this in.</p>
        <p class="small">Note what it does <em>not</em> do. There is no clever arithmetic here. The first thing it does is store a number and read it straight back.</p>
        <p class="big frag" style="margin-top:10px">Before I run it — what should the first line print?</p>
      </div>
      <div>
<pre><span class="c">// tenth.c</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> a = <span class="s">0.1f</span>;
    printf(<span class="s">"stored 0.1, got back %.20f\n"</span>, a);

    <span class="f">float</span> sum = <span class="s">0.0f</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">10</span>; i++)
        sum += <span class="s">0.1f</span>;

    printf(<span class="s">"ten of them  = %.20f\n"</span>, sum);
    printf(<span class="s">"is that 1.0? %s\n"</span>,
           (sum == <span class="s">1.0f</span>) ? <span class="s">"yes"</span> : <span class="s">"no"</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
    </div>
  </div>
  <div class="cue">Type it live, don't paste. Make them commit to a prediction for line one before you compile.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="④ the output">
  <div>
    <div class="kicker red">what comes out</div>
    <h2 style="margin-bottom:26px">It never held 0.1<br>in the first place.</h2>
    <div class="split" style="gap:56px">
      <div>
        <div class="term">
<span class="dim">$ gcc tenth.c -o tenth &amp;&amp; ./tenth</span>
stored 0.1, got back <span class="hit">0.10000000149011611938</span>
ten of them  = <span class="hit">1.00000011920928955078</span>
is that 1.0? <span class="hit">no</span></div>
      </div>
      <div class="stack">
        <p class="frag">Line one performs no arithmetic at all. It stores a number and reads it back, and the number has already changed.</p>
        <p class="big frag">Then ten of them add up to something that is not one.</p>
      </div>
    </div>
  </div>
  <div class="cue">Get a student to run it and read their own number out. It has to be their machine, not yours.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="④ why">
  <div>
    <div class="kicker grey">why</div>
    <h2 style="margin-bottom:14px">A float cannot land on 0.1.</h2>
    <figure>
      <svg viewBox="0 0 1400 250" width="100%" role="img" aria-label="Representable float values as ticks, with true 0.1 falling between two of them">
        <line x1="60" y1="120" x2="1340" y2="120" stroke="#c6c3ba" stroke-width="2"/>
        <g stroke="#23408f" stroke-width="3">
          <line x1="200" y1="98" x2="200" y2="142"/>
          <line x1="700" y1="98" x2="700" y2="142"/>
          <line x1="1200" y1="98" x2="1200" y2="142"/>
        </g>
        <text x="200" y="180" font-size="17" fill="#23408f" text-anchor="middle">0.0999999940395355</text>
        <text x="700" y="180" font-size="17" fill="#23408f" text-anchor="middle">0.1000000014901161</text>
        <text x="1200" y="180" font-size="17" fill="#23408f" text-anchor="middle">0.1000000089406967</text>
        <text x="700" y="212" font-size="15" fill="#8b9096" text-anchor="middle">THREE VALUES A FLOAT CAN ACTUALLY HOLD · THERE IS NOTHING IN BETWEEN</text>
        <g class="fragsvg">
          <circle cx="653" cy="120" r="10" fill="#a8231f"/>
          <line x1="653" y1="58" x2="653" y2="105" stroke="#a8231f" stroke-width="2"/>
          <text x="653" y="44" font-size="20" fill="#a8231f" text-anchor="middle">0.1 is here</text>
          <path d="M665 82 L692 82" stroke="#a8231f" stroke-width="2.5"/>
          <path d="M692 82 l-9 -5 l0 10 z" fill="#a8231f"/>
          <text x="760" y="88" font-size="17" fill="#a8231f">so it stores the nearest one it has</text>
        </g>
      </svg>
    </figure>
    <p class="big frag" style="margin-top:20px;max-width:66ch;font-size:34px">Off by fifteen billionths, silently, before you have done a single calculation. Add it up ten times and the error adds up too.</p>
  </div>
  <div class="cue">This is the slide that makes the fourth one land. The ticks are real neighbouring float values, drawn to scale relative to each other.</div>

      <div class="panel"><span class="n">01 · THE PHONE</span><h3>271</h3><p class="cap">into a box that stops at 255</p></div>
      <div class="panel frag"><span class="n">02 · ARIANE 5</span><h3>a velocity</h3><p class="cap">into a box that stops at 32767</p></div>
      <div class="panel frag"><span class="n">03 · THE CLOCK</span><h3>seconds</h3><p class="cap">into a box that stops in 2038</p></div>
      <div class="panel frag"><span class="n">04 · THE FLOAT</span><h3>one tenth</h3><p class="cap">into a box with no room for it at all</p></div>

<script>
(function(){
  'use strict';

  /* ---------- scale the stage ---------- */
  var stage = document.getElementById('stage');
  function fit(){
    var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  /* ---------- build ---------- */
  var deck = document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N = slides.length, i = 0, f = 0;

  var rail = document.getElementById('rail'), jl = document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li = document.createElement('li');
    li.innerHTML = '<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick = function(){ i=k; f=0; paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks = rail.children, count = document.getElementById('count');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag, .fragsvg')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on', k===i); });
    for (var k=0;k<N;k++) ticks[k].className = k<i ? 'done' : (k===i ? 'here' : '');
    count.textContent = String(i+1).padStart(2,'0') + ' / ' + N;
    frags().forEach(function(el,k){
      var on = k < f;
      if (el.classList.contains('fragsvg')) el.style.opacity = on ? 1 : 0;
      else el.classList.toggle('shown', on);
    });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag, .fragsvg').length;paint();} }

  document.addEventListener('keydown', function(e){
    var k=e.key;
    if(e.target.tagName==='INPUT' && (k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('.video')) return;
    if(e.clientX < window.innerWidth*0.26) prev(); else next();
  });

  /* ---------- ① 271 into eight bits ---------- */
  var cIn = document.getElementById('cIn');
  if (cIn){
    var dead=[], live=[], dEl=document.getElementById('cDead'), lEl=document.getElementById('cLive');
    for (var k=0;k<4;k++){ var b=document.createElement('b'); b.className='dead'; dEl.appendChild(b); dead.push(b); }
    for (var k=0;k<8;k++){ var b=document.createElement('b'); lEl.appendChild(b); live.push(b); }
    function container(){
      var v=parseInt(cIn.value,10); if(isNaN(v)) v=0;
      var u=v & 0xFFF, stored=v & 0xFF, dropped=u-stored;
      for (var k=0;k<4;k++){
        var bit=(u>>(11-k))&1;
        dead[k].textContent=bit; dead[k].className='dead'+(bit?' one':'');
      }
      for (var k=0;k<8;k++){
        var bit=(u>>(7-k))&1;
        live[k].textContent=bit; live[k].className=bit?'one':'';
      }
      document.getElementById('cOut').textContent=stored;
      document.getElementById('cLost').textContent = dropped
        ? ('The ' + dropped + ' on the left simply had nowhere to go.')
        : 'Everything fitted this time.';
    }
    cIn.addEventListener('input',container); container();
  }

  /* ---------- ③ the clock ---------- */
  var tBits = document.getElementById('tBits');
  if (tBits){
    var tcells=[];
    for (var k=0;k<32;k++){
      var b=document.createElement('b');
      if (k===0) b.className='sign';
      tBits.appendChild(b); tcells.push(b);
    }
    var t0=2147483645, t=t0, running=false;
    function tPaint(){
      var u = t>>>0;
      for (var k=0;k<32;k++){
        var bit=(u>>>(31-k))&1;
        tcells[k].textContent=bit;
        tcells[k].className=(k===0?'sign':'')+(bit?' one':'');
      }
      document.getElementById('tVal').textContent=t;
      var d=document.getElementById('tDate');
      d.textContent=new Date(t*1000).toUTCString().replace(' GMT','');
      d.style.color = t<0 ? 'var(--fail)' : 'var(--ink)';
    }
    function step(){ t=(t+1)|0; tPaint(); }
    document.getElementById('tTick').onclick=step;
    document.getElementById('tReset').onclick=function(){ t=t0; running=false; tPaint(); };
    document.getElementById('tRun').onclick=function(){
      if (running) return; running=true; t=t0-6;
      var delay=90;
      (function go(){
        if (!running) return;
        step();
        if (t===0 || t<0){ running=false; return; }
        delay = Math.min(delay*1.55, 900);
        setTimeout(go, delay);
      })();
    };
    tPaint();
  }

  paint();
})();
</script>
</body>
