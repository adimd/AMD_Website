<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 09 · hour nine of fifty</div>
    <h1>What if the point<br>cannot move?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">There is another way to hold a fraction. It is older than floating point, and it is what every bank in this country runs on.</p>
  </div>
  <div class="cue">Nine programs. The hour ends by explaining, in one sentence, why floating point had to exist at all.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="01 · the till" data-act="program 1">
  <div>
    <h2>A shop sells a thousand items at Rs 49.99.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 01-till.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> till = <span class="s">0.0f</span>;

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000</span>; i++)
        till += <span class="s">49.99f</span>;

    printf(<span class="s">"sales today   1000 items at Rs 49.99\n"</span>);
    printf(<span class="s">"should be     Rs 49990.00\n"</span>);
    printf(<span class="s">"till says     Rs %.4f\n"</span>, till);
    printf(<span class="s">"short by      Rs %.4f\n"</span>, <span class="s">49990.0f</span> - till);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">sales today   1000 items at Rs 49.99
should be     Rs 49990.00
till says     Rs <span class="bad">49989.5430</span>
short by      Rs <span class="bad">0.4570</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Ninety nine paise has no exact binary form, the same way one tenth does not.</li>
            <li>One day of sales and the till is short by forty six paise. Small, but it is real money and it will not reconcile.</li>
            <li>This is why no bank, no UPI app and no accounting system anywhere stores money in a float.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Ask what they would do about it before the next slide. Most of the room already knows the answer without knowing it has a name.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="02 · count paise" data-act="program 2">
  <div>
    <h2>So do not store rupees. Store paise.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 02-paise.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">long</span> till = <span class="s">0</span>;

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">1000</span>; i++)
        till += <span class="s">4999</span>;

    printf(<span class="s">"till says     %ld paise\n"</span>, till);
    printf(<span class="s">"which is      Rs %ld.%02ld\n"</span>,
           till / <span class="s">100</span>, till % <span class="s">100</span>);
    printf(<span class="s">"exact?        %s\n"</span>,
           till == <span class="s">4999000</span> ? <span class="s">"yes"</span> : <span class="s">"no"</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">till says     4999000 paise
which is      Rs <span class="ok">49990.00</span>
exact?        <span class="ok">yes</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Nothing clever happened. We changed the unit and the fraction disappeared.</li>
            <li>The decimal point is not stored anywhere. It lives in the printf, and in your head.</li>
            <li>RBI systems, UPI messages and every ledger in the country carry amounts in paise as integers, for exactly this reason.</li>
            <li>You have just used fixed point arithmetic. It has a name and a general form.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">The point being in the printf rather than the data is the whole idea of this hour. Say it plainly.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="03 · GST" data-act="program 3">
  <div>
    <h2>And it survives the arithmetic you actually do.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 03-gst.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">long</span> paise[] = { <span class="s">89900</span>, <span class="s">24950</span>, <span class="s">149900</span>, <span class="s">99</span> };

    printf(<span class="s">"item      float total    exact, in paise\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">4</span>; i++) {
        <span class="f">long</span> p   = paise[i];
        <span class="f">long</span> gst = (p * <span class="s">18</span> + <span class="s">50</span>) / <span class="s">100</span>;
        <span class="f">float</span> f  = p / <span class="s">100.0f</span>;

        printf(<span class="s">"Rs %-7.2f Rs %-11.4f %ld + %ld = %ld\n"</span>,
               f, f + f * <span class="s">0.18f</span>, p, gst, p + gst);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xxs frag">item     GST 18%    total      as paise, exactly
Rs 899.00  Rs 161.8200  Rs <span class="bad">1060.8201</span>  89900 + 16182 = <span class="ok">106082</span> paise
Rs 249.50  Rs 44.9100   Rs 294.4100  24950 + 4491 = <span class="ok">29441</span> paise
Rs 1499.00 Rs 269.8200  Rs <span class="bad">1768.8201</span>  149900 + 26982 = <span class="ok">176882</span> paise
Rs 0.99    Rs 0.1782    Rs 1.1682    99 + 18 = <span class="ok">117</span> paise</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>The float total is Rs 1060.8201. There is no such amount. Money has two decimal places and that is the end of it.</li>
            <li>In paise the whole calculation is integer arithmetic, and the rounding to the nearest paisa is a decision you make on purpose.</li>
            <li><code>(p * 18 + 50) / 100</code> rounds to nearest. Drop the 50 and it truncates. GST law says which, and your type should not be guessing.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Rs 1060.8201 on an invoice is the point. Nobody can pay that, and nobody can file it.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="The imagined point" data-act="naming it">
  <div>
    <h2>Now the general form. Take an integer and imagine a point inside it.</h2>
    <div class="qbox">
      <div class="half iv">
        <div class="n">TOP 16 BITS</div>
        <div class="v">whole rupees</div>
      </div>
      <div class="pt"><span>IMAGINED HERE</span></div>
      <div class="half fv">
        <div class="n">BOTTOM 16 BITS</div>
        <div class="v">the fraction</div>
      </div>
    </div>
    <div class="split" style="margin-top:16px">
      <div class="stack">
        <p>One <code>int32_t</code>. The hardware sees a plain integer and always will.</p>
        <p>We agree the bottom sixteen bits count fractions, and that agreement exists nowhere in the machine.</p>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>Written Q16.16: sixteen bits before the point, sixteen after.</li>
          <li>To store x, keep x times 65536. To read it back, divide by 65536.</li>
          <li>Paise were the same idea with a friendlier scale of 100 instead of 65536.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Same move as Class 4. The machine's representation and the human's need not match, so long as something translates at the edge.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="04 · Q16.16" data-act="program 4">
  <div>
    <h2>What that looks like in a register.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 04-q16.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;stdint.h&gt;</span>

int32_t to_q(<span class="f">double</span> x)    { <span class="k">return</span> (int32_t)(x * <span class="s">65536.0</span> + (x &lt; <span class="s">0</span> ? <span class="s">-0.5</span> : <span class="s">0.5</span>)); }
<span class="f">double</span>  from_q(int32_t q) { <span class="k">return</span> q / <span class="s">65536.0</span>; }

<span class="f">void</span> show(<span class="f">char</span> *label, int32_t q)
{
    printf(<span class="s">"%-12s raw %-12d = %d + %d/65536 = %.8f\n"</span>,
           label, q, q &gt;&gt; <span class="s">16</span>, q &amp; <span class="s">0xFFFF</span>, from_q(q));
}

<span class="f">int</span> main(<span class="f">void</span>)
{
    show(<span class="s">"Rs 1.00"</span>,  to_q(<span class="s">1.0</span>));
    show(<span class="s">"Rs 0.50"</span>,  to_q(<span class="s">0.5</span>));
    show(<span class="s">"Rs 49.99"</span>, to_q(<span class="s">49.99</span>));
    show(<span class="s">"94.72 /L"</span>, to_q(<span class="s">94.72</span>));

    printf(<span class="s">"\nthe gap is always %.10f, everywhere\n"</span>, <span class="s">1.0</span> / <span class="s">65536.0</span>);
    printf(<span class="s">"largest value      %.5f\n"</span>, from_q(<span class="s">2147483647</span>));
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xxs frag">Rs 1.00      raw 65536        = 1 + 0/65536 = 1.00000000
Rs 0.50      raw 32768        = 0 + 32768/65536 = 0.50000000
Rs 49.99     raw 3276145      = 49 + 64881/65536 = <span class="bad">49.99000549</span>
94.72 /L     raw 6207570      = 94 + 47186/65536 = <span class="bad">94.72000122</span>

the gap is always <span class="hit">0.0000152588</span>, everywhere
largest value      32767.99998</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Rs 49.99 is still not exact. Binary cannot spell ninety nine paise in any scheme, so pick a scale that suits the money.</li>
            <li>But the gap is the same size everywhere in the range. This is a ruler, which a float is not.</li>
            <li>Range is fixed and modest: about plus or minus thirty two thousand, in the same 32 bits a float uses to reach 10<sup>38</sup>.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">The word ruler matters. Class 6 ended on a float not being one. This is what one looks like.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="05 · the petrol pump" data-act="program 5">
  <div>
    <h2>Arithmetic on it, at Rs 94.72 a litre.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 05-arith.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;stdint.h&gt;</span>

<span class="k">#define</span> Q(x)  ((int32_t)((x) * <span class="s">65536.0</span> + <span class="s">0.5</span>))
<span class="k">#define</span> R(q)  ((q) / <span class="s">65536.0</span>)

<span class="f">int</span> main(<span class="f">void</span>)
{
    int32_t price  = Q(<span class="s">94.72</span>);   <span class="c">/* rupees per litre */</span>
    int32_t litres = Q(<span class="s">13.70</span>);

    printf(<span class="s">"add   %.4f\n"</span>, R(price + litres));
    printf(<span class="s">"sub   %.4f\n"</span>, R(price - litres));
    printf(<span class="s">"mul   %.4f\n"</span>, R((int32_t)(((int64_t)price * litres) &gt;&gt; <span class="s">16</span>)));
    printf(<span class="s">"div   %.4f\n"</span>, R((int32_t)((((int64_t)price) &lt;&lt; <span class="s">16</span>) / litres)));

    printf(<span class="s">"\nin double: %.4f %.4f %.4f %.4f\n"</span>,
           <span class="s">94.72</span> + <span class="s">13.70</span>, <span class="s">94.72</span> - <span class="s">13.70</span>,
           <span class="s">94.72</span> * <span class="s">13.70</span>, <span class="s">94.72</span> / <span class="s">13.70</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">price   Rs 94.7200 per litre
filled  13.7000 litres

price + price  plain integer add       <span class="ok">189.4400</span>
price - litres plain integer subtract  <span class="ok">81.0200</span>
price * litres multiply, shift 16      <span class="ok">1297.6637</span>
price / litres shift 16, then divide   6.9139

the same four in double: 189.4400 81.0200 <span class="hit">1297.6640</span> 6.9139</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Addition and subtraction are ordinary integer operations. No new hardware at all.</li>
            <li>Multiplication scales twice, so shift the result back by 16. Division needs the shift first.</li>
            <li>That is the appeal. A microcontroller with no floating point unit runs all of this, which is most embedded chips ever shipped.</li>
            <li>The pump display shows Rs 1297.66 either way. The difference is in the fourth decimal, and it compounds over a day.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">A fuel dispenser is a legal metrology device. Its arithmetic is specified, audited, and almost always fixed point.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="06 · move the point" data-act="program 6">
  <div>
    <h2>The point can sit anywhere. Watch what moving it does.</h2>
    <div class="prog" style="grid-template-columns:.78fr 1.22fr">
      <div>
<pre class="xs"><span class="c">/* 06-trade.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;math.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">char</span> *words[] = { <span class="s">"13.4 crore"</span>, <span class="s">"83.9 lakh"</span>, <span class="s">"5.2 lakh"</span>,
                      <span class="s">"32 thousand"</span>, <span class="s">"2 thousand"</span>, <span class="s">"128"</span>, <span class="s">"8"</span> };

    printf(<span class="s">"format   largest value   gap             roughly\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> f = <span class="s">4</span>, w = <span class="s">0</span>; f &lt;= <span class="s">28</span>; f += <span class="s">4</span>, w++)
        printf(<span class="s">"Q%-2d.%-2d   %-15.0f %-15.10f %s\n"</span>,
               <span class="s">31</span> - f, f, pow(<span class="s">2</span>, <span class="s">31</span> - f), pow(<span class="s">2</span>, -f), words[w]);

    printf(<span class="s">"\nevery row: largest divided by gap = %.0f\n"</span>, pow(<span class="s">2</span>, <span class="s">31</span>));
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Every step right doubles the precision and halves the range. Exactly.</li>
            <li>Largest value divided by gap is the same number in every row.</li>
            <li>You are not choosing how good it is. You are choosing where to spend a fixed budget.</li>
          </ul>
        </div>
      </div>
      <div>
        <div class="term xxs frag">format    fraction   largest value      gap             roughly
--------------------------------------------------------------------
Q27.4     4          13,42,17,728       0.0625000000    13.4 crore
Q23.8     8          83,88,608          0.0039062500    83.9 lakh
Q19.12    12         5,24,288           0.0002441406    5.2 lakh
Q15.16    16         32,768             0.0000152588    32 thousand
Q11.20    20         2,048              0.0000009537    2 thousand
Q7.24     24         128                0.0000000596    128
Q3.28     28         8                  0.0000000037    8
--------------------------------------------------------------------
every row: largest value divided by gap = <span class="hit">2,14,74,83,648</span></div>
        <div class="rem frag" style="border-left-color:var(--amber)">
          <div class="h" style="color:var(--amber)">an aside worth ten seconds</div>
          <ul>
            <li>2,14,74,83,648 and 2,147,483,648 are the same quantity, grouped two different ways.</li>
            <li>Six marks, one number, from Class 1. Even the commas are a representation choice.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Read the last two columns down the page. One shrinks by sixteen as the other grows by sixteen, every time.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Why the trade is exact" data-act="the trade">
  <div>
    <h2>Why that trade is exact, and not merely usually true.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p>Thirty two bits give <span class="num">2<sup>32</sup></span> patterns. That number cannot change.</p>
        <p>Lay them out evenly and the span you cover is the count times the gap between them.</p>
        <p class="frag"><span class="num">span = 2<sup>32</sup> &times; gap</span></p>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>The count is fixed, so halving the gap halves the span. No arrangement avoids this.</li>
          <li>Range and precision are not two dials. They are one dial with a label at each end.</li>
          <li>No configuration wins. Moving the point only decides which end of the problem you would rather be bad at.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Write span equals count times gap on the board. Three slides are consequences of it, and the last slide undoes it.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="07 · running out" data-act="program 7">
  <div>
    <h2>Two UPI transfers, and one type that cannot hold the total.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 07-overflow.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;stdint.h&gt;</span>

<span class="k">#define</span> Q(x)  ((int32_t)((x) * <span class="s">65536.0</span> + <span class="s">0.5</span>))
<span class="k">#define</span> R(q)  ((q) / <span class="s">65536.0</span>)

<span class="f">int</span> main(<span class="f">void</span>)
{
    int32_t a = Q(<span class="s">30000.0</span>);   <span class="c">/* two UPI transfers */</span>
    int32_t b = Q(<span class="s">20000.0</span>);

    printf(<span class="s">"transfer one   Rs %.2f\n"</span>, R(a));
    printf(<span class="s">"transfer two   Rs %.2f\n"</span>, R(b));
    printf(<span class="s">"day total      Rs %.2f\n"</span>, R(a + b));
    printf(<span class="s">"should be      Rs 50000.00\n\n"</span>);

    printf(<span class="s">"the same sum in float = Rs %.2f\n"</span>, <span class="s">30000.0f</span> + <span class="s">20000.0f</span>);
    printf(<span class="s">"Q16.16 stops at         Rs %.2f\n"</span>, R(<span class="s">2147483647</span>));
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">transfer one   Rs 30000.00
transfer two   Rs 20000.00
day total      Rs <span class="bad">-15536.00</span>
should be      Rs 50000.00

the same sum in float = Rs <span class="ok">50000.00</span>

Q16.16 stops at Rs 32768.00</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Fixed point overflow is integer overflow. It wraps, exactly as in Class 5, and says nothing.</li>
            <li>No infinity, no NaN, no flag anybody reads. Two positive transfers and a negative balance.</li>
            <li>Q16.16 tops out at Rs 32,768, which is below one day of ordinary UPI limits. Choosing the format is choosing the ceiling.</li>
            <li>The float handled it because fifty thousand is nowhere near its range. Range is what floats are for.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">This is the wallpaper crash from Class 1, in a payments library rather than a colour value. Same wheel, same silence.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="08 · which is finer" data-act="program 8">
  <div>
    <h2>Inside its range, though, fixed point is often the more precise one.</h2>
    <div class="prog" style="grid-template-columns:.88fr 1.12fr">
      <div>
<pre class="xs"><span class="c">/* 08-crossover.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;math.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">double</span> fixed_gap = <span class="s">1.0</span> / <span class="s">65536.0</span>;
    <span class="f">double</span> v[] = { <span class="s">0.01</span>, <span class="s">1.0</span>, <span class="s">100.0</span>, <span class="s">128.0</span>,
                   <span class="s">256.0</span>, <span class="s">5000.0</span>, <span class="s">20000.0</span> };

    printf(<span class="s">"amount          float gap        Q16.16 gap      finer\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; <span class="s">7</span>; i++) {
        <span class="f">float</span> x = (<span class="f">float</span>)v[i];
        <span class="f">double</span> fg = nextafterf(x, <span class="s">2</span> * x) - x;
        printf(<span class="s">"Rs %-12g %-16.10f %-15.10f %s\n"</span>, v[i], fg, fixed_gap,
               fg &lt; fixed_gap ? <span class="s">"float"</span> : <span class="s">"fixed point"</span>);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Below Rs 128 the float is finer. Above it the fixed point is, all the way to its limit.</li>
            <li>The crossover is exactly 2<sup>7</sup>, where the float's growing gap passes the fixed constant one.</li>
            <li>Neither is better. One is dense near zero, the other is even everywhere.</li>
          </ul>
        </div>
      </div>
      <div>
        <div class="term xs frag">amount          float gap        Q16.16 gap      finer
--------------------------------------------------------------
Rs 0.01         0.0000000009     0.0000152588    float
Rs 1            0.0000001192     0.0000152588    float
Rs 100          0.0000076294     0.0000152588    float
<span class="hit">Rs 128          0.0000152588     0.0000152588    fixed point</span>
Rs 256          0.0000305176     0.0000152588    fixed point
Rs 5000         0.0004882812     0.0000152588    fixed point
Rs 20000        0.0019531250     0.0000152588    fixed point</div>
      </div>
    </div>
  </div>
  <div class="cue">The highlighted row is the crossover, where the two gaps agree to the last digit.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="09 · predictable error" data-act="program 9">
  <div>
    <h2>And its error behaves completely differently from a float's.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 09-drift.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;stdint.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">int</span> N = <span class="s">10000</span>;

    <span class="f">float</span> f = <span class="s">0.0f</span>;
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; N; i++) f += <span class="s">0.1f</span>;

    int64_t q = <span class="s">0</span>, tenth = <span class="s">6554</span>;   <span class="c">/* Rs 0.10 in Q16.16 */</span>
    <span class="k">for</span> (<span class="f">int</span> i = <span class="s">0</span>; i &lt; N; i++) q += tenth;

    printf(<span class="s">"float        Rs %.6f   off by %+.6f\n"</span>, f, f - <span class="s">1000.0</span>);
    printf(<span class="s">"Q16.16       Rs %.6f   off by %+.6f\n"</span>,
           q / <span class="s">65536.0</span>, q / <span class="s">65536.0</span> - <span class="s">1000.0</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">crediting Rs 0.10, ten thousand times

float        Rs 999.902893    off by <span class="bad">-0.097107</span>
Q16.16       Rs 1000.061035   off by <span class="hit">+0.061035</span>

every fixed point addition was exact. the only error is
Rs 0.10 itself: 0.1000061035 instead of 0.10
that error, times 10000, is <span class="hit">+0.061035</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Every fixed point addition is an exact integer addition. No rounding happens at all.</li>
            <li>So the total error is the one representation error multiplied by the count. It matches to the last digit.</li>
            <li>The float's error came from the running total growing. The fixed point error does not care how large the total gets.</li>
            <li>In Class 8 the float error needed a seven band table to predict. Here it is one multiplication.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Predictable error is worth a great deal. It is why control systems, audio and metering equipment still use fixed point.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="Where each one wins" data-act="the reveal">
  <div>
    <h2>So neither one is the good one.</h2>
    <div class="split" style="margin-top:6px">
      <div class="rem" style="margin-top:0;border-left-color:var(--amber)">
        <div class="h" style="color:var(--amber)">fixed point, when</div>
        <ul>
          <li>The range is known in advance. Money, sensors, audio samples, servo positions, energy meters.</li>
          <li>You need the same accuracy at every magnitude, not more of it near zero.</li>
          <li>The error must be predictable, or identical across machines.</li>
          <li>There is no floating point unit, or you cannot spare the power.</li>
        </ul>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">floating point, when</div>
        <ul>
          <li>You do not know the range in advance, or it spans many orders of magnitude.</li>
          <li>You want relative accuracy: three significant figures whether the number is tiny or enormous.</li>
          <li>You would rather lose precision than silently wrap around.</li>
        </ul>
      </div>
    </div>
    <p class="big frag" style="margin-top:16px;max-width:none;font-size:26px">The Patriot clock in the last class was fixed point, counting tenths of a second. Now you know exactly what that sentence means.</p>
  </div>
  <div class="cue">Reopen the Dhahran program if you have it. 23 fractional bits, constant gap, error multiplied by tick count. All of it is on this slide.</div>
</section>

<!-- 14 -->
<section class="slide" data-t="The undoing" data-act="the reveal">
  <div>
    <h2>Now look again at why the trade existed at all.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p>Span is the count times the gap. The count is fixed, so range and precision fight.</p>
        <p class="frag">That argument only works because the gap is <em>the same everywhere</em>.</p>
        <p class="big frag" style="margin-top:8px">And nobody ever required that.</p>
      </div>
      <div class="rem frag" style="margin-top:0;border-left-color:var(--ok)">
        <div class="h" style="color:var(--ok)">remember</div>
        <ul>
          <li>Uniform spacing is what forces range against precision. Give it up and the trade dissolves.</li>
          <li>What you usually want is a fixed number of significant figures, not a fixed gap.</li>
          <li>That is scientific notation, and putting it in 32 bits is a float.</li>
          <li>Floating point is not a better fixed point. It is the answer to a constraint that fixed point never questioned.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">This is the sentence of the hour. We met floats three sessions ago and only now can they say why anyone bothered.</div>
</section>

<section class="slide" data-t="Close" data-act="close">
  <div class="center">
    <h2 style="font-size:44px;margin-bottom:22px">Every scheme in this arc has been<br>an answer to the same question.</h2>
    <p class="big" style="max-width:52ch;color:var(--soft)">Which four billion values should these patterns mean? Unsigned, two's complement, fixed point and IEEE 754 are four different answers, not four different topics.</p>
    <p class="big frag" style="margin-top:22px;max-width:48ch">Next session: what happens when a value has to move from one of them to another.</p>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  paint();
})();
</script>
