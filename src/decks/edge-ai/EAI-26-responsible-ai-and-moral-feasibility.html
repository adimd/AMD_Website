<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 26 · Responsible AI and Moral Feasibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 26 */
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.bias .cb button.sel,.mfsc button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.biasbars .bb{display:grid;grid-template-columns:340px 1fr 90px;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--rule)}
.biasbars .bb span:first-child{font-size:19px}
.biasbars .bt{height:22px;background:var(--rule);border-radius:4px;overflow:hidden}
.biasbars .bf{height:100%;border-radius:4px;transition:width .3s}
.biasbars .bv{font-family:var(--mono);font-size:18px;text-align:right}
.biasbars .bb.avg{border-top:2px solid var(--ink);border-bottom:none;margin-top:4px}
.biasbars .bb.avg span:first-child{font-weight:700}
.privp,.mfw{padding:16px 22px}
.pvtab td{font-size:18px}
.mfcard{margin-top:12px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:18px 22px;background:var(--card);min-height:150px}
.mfcard .mq{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.2}
.mfcard .mx{font-size:19px;color:var(--soft);margin-top:10px}
.mfnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.mfans button{min-width:110px}
.mfans button.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.mfans button.unc{background:var(--amber);border-color:var(--amber);color:#fff}
.mfans button.no{background:var(--fail);border-color:var(--fail);color:#fff}
.mfprog{font-family:var(--mono);font-size:15px;color:var(--soft)}
.mfsum{font-size:21px;margin-top:12px;min-height:56px}
.cklist{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:12px}
.ck{display:grid;grid-template-columns:44px 1fr;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:20px}
.ckn{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent)}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 26</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 26 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 26 · unit III · responsible AI, the need for edge AI, moral feasibility</div>
    <h1>It works.<br>For whom?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">A model can be accurate, fast and tiny, and still fail the people it was built for. Today: what "responsible" means at each step of the workflow, and the first feasibility question of all: should this be built?</p>
  </div>
  <div class="cue">No board lab today. Theory runs to slide 14; the exercise is one block at the end (slides 15 and 16): each team reviews its own course-project option. Print one checklist card per team (slide 15).</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>A tool at three stages of your project, with one reason each.</h2>
    <table class="dt txt" style="width:100%;max-width:1250px">
      <tr><th style="width:22%">stage</th><th style="width:30%">a typical choice</th><th>the reason</th></tr>
      <tr class="frag"><td>collecting data</td><td>the board itself, streaming to a laptop</td><td>record with the same microphone the product will use</td></tr>
      <tr class="frag"><td>training</td><td>Colab or Edge Impulse</td><td>free GPUs; the features match what the board computes</td></tr>
      <tr class="frag"><td>deploying</td><td>Arduino IDE or ESP-IDF</td><td>the int8 model and the DSP front end run on the S3</td></tr>
    </table>
    <p class="frag" style="margin-top:18px;max-width:74ch">Every stage also has a responsibility attached. Who did you record? Who checked the labels? What does the board send, and to whom? That is today.</p>
  </div>
  <div class="cue">Two minutes; take answers from two teams first. The rows are examples, not the only right answers.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="94% for whom?" data-act="the hook">
  <div>
    <div class="kicker">try it live · a voice-command model, tested two ways</div>
    <h2>"94% accurate." Now split the test by who is speaking.</h2>
    <div class="panel calc bias">
      <div class="crow" style="grid-template-columns:230px 1fr"><span class="cl">training data from</span><span class="cb" data-g="t"><button data-v="0" class="sel">our class, in the lab</button><button data-v="1">a balanced set of speakers</button></span></div>
      <div class="crow" style="grid-template-columns:230px 1fr"><span class="cl">test the average on</span><span class="cb" data-g="u"><button data-v="0" class="sel">people like our class</button><button data-v="1">patients on a hospital ward</button></span></div>
      <div class="biasbars"></div>
      <div class="cverdict"></div>
    </div>
  </div>
  <div class="cue">Illustrative numbers, invented to show the effect, not measured on any real model. The point: an overall average weights each group by how many of them are in the test set. A test set that looks like the developers hides the groups the product will actually serve. Switch both to the right-hand options and watch the average fall even though nothing about the model changed. Then fix the training data and watch the worst group recover.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Responsibility at every stage" data-act="responsible AI">
  <div>
    <h2>Responsible AI is not a step at the end. It is a question at every step.</h2>

<section class="slide" data-t="Where bias comes from" data-act="responsible AI">

      <div class="ntile frag"><div class="nb" style="font-size:28px">who</div><div class="ns">twenty-year-old students, mostly one language: children, elderly, regional accents missing</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">where</div><div class="ns">a quiet lab, not a farm with a motor running or a ward at night</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">how</div><div class="ns">loud, clear, close to the mic: real users mumble, whisper, shout across the room</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">labels</div><div class="ns">one person's idea of the word; borderline clips thrown away</div></div>

      <div class="rem green"><div class="h">what to do</div><ul><li>Report accuracy <strong>per group</strong>, not just the average.</li><li>Record the people and places the product is for.</li><li>Write down who is missing, in the project report.</li></ul></div>
      <div class="rem"><div class="h">the Help project's version</div><ul><li>Weak, breathless or slurred voices of patients are exactly the voices a lab dataset lacks, and exactly the ones that matter most.</li></ul></div>
    </div>

</section>

<!-- 07 -->
<section class="slide" data-t="On-device is not a guarantee" data-act="privacy">
  <div>
    <h2>On-device processing is a privacy tool, not a privacy guarantee.</h2>

      <div class="ntile frag"><div class="nb" style="font-size:26px">updates</div><div class="ns">a later firmware update can quietly change what is sent</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:76ch">Consent too: a smart-home microphone hears guests, children and domestic workers who never agreed to anything. Who tells them?</p>
  </div>
  <div class="cue">Link to Class 20: false alarms per hour is a privacy number as well as a usability number.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Tell people, give them control" data-act="privacy">

    <h2>Transparency and control: four small design choices.</h2>
    <div class="ucards" style="grid-template-columns:repeat(4,1fr)">
      <div class="ucard frag"><div class="un">1</div><div class="ut">a visible signal</div><div class="ud">an LED that shows when it is listening or sending</div></div>
      <div class="ucard frag"><div class="un">2</div><div class="ut">a real off switch</div><div class="ud">a mute that cuts the microphone, not just a setting</div></div>
      <div class="ucard frag"><div class="un">3</div><div class="ut">plain words</div><div class="ud">one sentence: what it records, what it keeps, where it goes</div></div>
      <div class="ucard frag"><div class="un">4</div><div class="ut">it still works offline</div><div class="ud">the project's fallback table: no network, no data leaving, still useful</div></div>
    </div>
    <p class="frag small" style="margin-top:20px;max-width:80ch">In India, the Digital Personal Data Protection Act, 2023 sets duties for anyone processing personal data, including notice and consent. This course does not give legal advice; a real product needs someone to check the current rules.</p>
  </div>
  <div class="cue">Mention the Act by name only; check the current status of its rules before class, as they have been rolling out in stages. The exit ticket asks for exactly the "plain words" sentence in card 3.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Which mistake is worse?" data-act="safety">
  <div>
    <h2>Safety: a false accept and a false reject do not cost the same.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:18%">project</th><th style="width:30%">false accept: acts when it shouldn't</th><th style="width:30%">false reject: ignores a real command</th><th>so, lean towards</th></tr>
      <tr class="frag"><td>Robo · "stop"</td><td>stops for no reason: annoying</td><td>does not stop: someone gets hurt</td><td style="color:var(--fail)">never miss</td></tr>
      <tr class="frag"><td>Help · "emergency"</td><td>a nurse checks needlessly</td><td>a patient's call goes unanswered</td><td style="color:var(--fail)">never miss</td></tr>
      <tr class="frag"><td>Pump · "start"</td><td>a pump runs dry or floods a field</td><td>the farmer repeats the command</td><td style="color:var(--amber)">avoid false starts</td></tr>
      <tr class="frag"><td>Bell · "lights on"</td><td>lights come on; a little private speech sent</td><td>say it again</td><td style="color:var(--ok)">balanced</td></tr>
    </table>
    <p class="frag" style="margin-top:16px;max-width:76ch">The threshold is an ethical decision, not just a tuning knob. And design so a failure is safe: a physical stop button, a timer that switches the pump off.</p>
  </div>
  <div class="cue">Class 20's smoothing and thresholds come back here: the same slider that trades flicker for delay trades one kind of harm for another. Ask the Robo teams what happens if the network or the model crashes: the always-on "stop" must not depend on either.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Security and tampering" data-act="safety">
  <div>
    <h2>Someone will try to fool it on purpose.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="ntile frag"><div class="nb" style="font-size:26px">replay</div><div class="ns">play a recording of the owner saying "open"</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:26px">crafted sounds</div><div class="ns">noise designed to trigger a model, sometimes barely audible to people</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:26px">physical access</div><div class="ns">read the flash, copy the model, change the firmware</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:26px">the link</div><div class="ns">intercept or fake the messages between board and server</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:76ch">Rule of thumb: a voice command should never be the only lock on anything that matters. Pair it with something else for doors, money or medicine.</p>
  </div>
  <div class="cue">Name the threats; no attack techniques. The ESP32-S3 offers secure boot and flash encryption for products; worth knowing they exist, not part of the lab.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="Wider costs" data-act="safety">
  <div>
    <h2>Two costs that do not show up in accuracy.</h2>
    <div class="split" style="gap:26px">
      <div class="panel frag"><span class="lab" style="color:var(--ok)">environment</span><p>Millions of always-on devices, each with a battery and a short life. Edge AI can save energy (no streaming to a data centre) or waste it (devices nobody needed). Design for long battery life, repair and reuse.</p></div>
      <div class="panel frag"><span class="lab" style="color:var(--fail)">dual use and surveillance</span><p>A person counter for a shop is also a tracker of who came in with whom. A cough detector for a ward is also a monitor of an office. The same model, a different purpose. Ask who else could use it, and for what.</p></div>
    </div>
  </div>
  <div class="cue">Edge AI is often sold as privacy-friendly; it also makes cheap, invisible sensing possible everywhere. Both are true. Keep this short and move to the feasibility walker.</div>
</section>

  function selv(p,g){ var b=p.querySelector('[data-g="'+g+'"] button.sel'); return b?+b.dataset.v:0; }
  /* bias explorer: illustrative */
  var BG=[['students, 18–22',[98,95]],['older adults, 60+',[78,91]],['children',[72,89]],['regional accents',[81,92]],['weak or breathless voices',[61,86]]];
  var BW=[[0.80,0.05,0.03,0.10,0.02],[0.10,0.45,0.02,0.18,0.25]];
  function biasDraw(p){
    var t=selv(p,'t'), u=selv(p,'u'), w=BW[u], avg=0, worst=100, wn='';
    var h=BG.map(function(g,k){ var a=g[1][t]; avg+=a*w[k]; if(a<worst){ worst=a; wn=g[0]; }
      var col=a>=90?'#146b5c':(a>=80?'#b06a12':'#a8231f');
      return '<div class="bb"><span>'+g[0]+' <span style="color:var(--soft);font-size:14px">· '+Math.round(w[k]*100)+'% of test set</span></span><div class="bt"><div class="bf" style="width:'+a+'%;background:'+col+'"></div></div><span class="bv">'+a+'%</span></div>'; }).join('');
    h+='<div class="bb avg"><span>the single number in the report</span><div class="bt"><div class="bf" style="width:'+avg.toFixed(0)+'%;background:#23408f"></div></div><span class="bv">'+avg.toFixed(0)+'%</span></div>';
    p.querySelector('.biasbars').innerHTML=h;
    var v=p.querySelector('.cverdict'); v.style.color= worst<80?'var(--fail)':'var(--ok)';
    v.textContent='Worst group: '+wn+', at '+worst+'%. '+(worst<80? 'The average hides it.' : 'Better data narrowed the gap; keep reporting every group.');
  }
  deck.querySelectorAll('.bias').forEach(biasDraw);
  /* privacy slider */
  var PV=[
    {n:'everything on the board',s:[1,0,0,0],rec:'audio in RAM for a second, then gone',st:'nothing',tx:'nothing',who:'nobody',b:'0 bytes'},
    {n:'features to a phone',s:[1,1,0,0],rec:'audio briefly; features computed',st:'maybe features on the phone',tx:'feature vectors over Bluetooth',who:'the phone app',b:'~50 KB'},
    {n:'words to a language model (the project)',s:[1,1,1,0],rec:'audio briefly; recognised words',st:'words in server logs, if kept',tx:'~100 bytes per command: words + confidences',who:'the server operator',b:'~3 KB'},
    {n:'raw audio to the cloud',s:[1,1,1,1],rec:'every command, as audio',st:'audio clips on a server',tx:'about 2 seconds of audio per command',who:'the cloud provider, and anyone who breaches it',b:'~2 MB'}];
  function pvDraw(p){
    var k=+p.querySelector('.pv').value, a=PV[k]; p.querySelector('.pvv').textContent=(k+1)+' / 4';
    var boxes=[['board',40],['phone',360],['language model',680],['cloud storage',1000]], o='<defs><marker id="pva" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8231f"/></marker></defs>';
    boxes.forEach(function(b,q){ var on=a.s[q]; o+='<rect x="'+b[1]+'" y="40" width="260" height="80" rx="12" fill="'+(on?(q===0?'#e6f1ee':'#fbeceb'):'#ffffff')+'" stroke="'+(on?(q===0?'#146b5c':'#a8231f'):'#e2e0d9')+'" stroke-width="2"/><text x="'+(b[1]+130)+'" y="88" font-size="18" text-anchor="middle" font-weight="700" fill="'+(on?'#15171b':'#c6c3ba')+'">'+b[0]+'</text>';
      if(q>0 && on) o+='<line x1="'+(boxes[q-1][1]+264)+'" y1="80" x2="'+(b[1]-4)+'" y2="80" stroke="#a8231f" stroke-width="3" marker-end="url(#pva)"/>'; });
    o+='<text x="40" y="20" font-size="16" fill="#15171b" font-weight="700">'+a.n+'</text><text x="1260" y="20" font-size="16" fill="#a8231f" text-anchor="end" font-weight="700">leaves the board per day: '+a.b+'</text>';
    p.querySelector('.pvsvg').innerHTML=o;
    p.querySelector('.pvtab').innerHTML='<tr><th style="width:22%">recorded</th><td>'+a.rec+'</td></tr><tr><th>stored</th><td>'+a.st+'</td></tr><tr><th>sent</th><td>'+a.tx+'</td></tr><tr><th>who could see it</th><td>'+a.who+'</td></tr>';
  }
  deck.querySelectorAll('.privp').forEach(function(p){ pvDraw(p); p.querySelector('.pv').addEventListener('input',function(){pvDraw(p);}); });
  /* moral feasibility walker */
  var MQ=['Does it solve a real problem for the people it affects?','Do those people benefit more than anyone else does?','Would the people it watches or listens to agree, if asked?','If it fails, is the harm small and recoverable?','Is it hard to turn into a tool for surveillance or control?'];
  var MX=[['Patients can call for help without reaching a button.','Patients and nurses; the hospital gains too, but not at the patients’ cost.','Patients and families can be asked, and can say no.','No: a missed call can be serious. Needs a backup button and testing on weak voices.','Mostly: it listens for a few words, keeps nothing.'],
          ['"Teachers want to know who is paying attention."','The institution more than the students being watched.','Many students would not agree to being scored.','A wrong score could follow a student unfairly.','No: it is surveillance by design.'],
          ['"Better adverts for shoppers."','The shop and advertisers, not the shopper.','Customers are rarely asked; most would not agree.','Wrongly profiled people get treated differently.','No: profiling is the purpose.']];
  function mfDraw(p){
    var sc=+(p.dataset.s||0), k=+(p.dataset.k||0), ans=(p.dataset.ans||'').split(',').filter(function(x){return x!=='';}).map(Number);
    if(k<MQ.length){
      p.querySelector('.mfcard').innerHTML='<div class="kicker">question '+(k+1)+' of '+MQ.length+'</div><div class="mq">'+MQ[k]+'</div><div class="mx">a starting point for discussion: '+MX[sc][k]+'</div>';
      p.querySelector('.mfans').style.visibility='visible';
    } else {
      p.querySelector('.mfcard').innerHTML='<div class="kicker">all five answered · click an idea to start again</div><div class="mq">'+MQ.map(function(q,j){ var c=['#a8231f','#b06a12','#146b5c'][ans[j]]; return '<span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:'+c+';margin-right:8px"></span>'; }).join('')+'</div>';
      p.querySelector('.mfans').style.visibility='hidden';
    }
    p.querySelector('.mfprog').textContent=ans.length+' / 5 answered';
    var no=ans.filter(function(a){return a===0;}).length, un=ans.filter(function(a){return a===1;}).length, el=p.querySelector('.mfsum');
    if(ans.length<5){ el.textContent=''; }
    else if(no>=2){ el.innerHTML='<strong style="color:var(--fail)">Stop and rethink.</strong> Two or more "no" answers: changing the design may not be enough; the purpose itself may be the problem.'; }
    else if(no===1||un>=2){ el.innerHTML='<strong style="color:var(--amber)">Proceed only with changes.</strong> Find out what is unclear and fix the "no" before building further.'; }
    else { el.innerHTML='<strong style="color:var(--ok)">Morally feasible, so far.</strong> Now check business, dataset and technology (next class), and keep asking as the design changes.'; }
    p.querySelectorAll('.mfsc button').forEach(function(b){ b.classList.toggle('sel',+b.dataset.s===sc); });
  }
  deck.querySelectorAll('.mfw').forEach(mfDraw);
  document.addEventListener('click',function(e){
    var b=e.target.closest('.bias .cb button'); if(b){ b.blur(); b.parentNode.querySelectorAll('button').forEach(function(q){q.classList.remove('sel');}); b.classList.add('sel'); biasDraw(b.closest('.bias')); return; }
    b=e.target.closest('.mfsc button'); if(b){ b.blur(); var p=b.closest('.mfw'); p.dataset.s=b.dataset.s; p.dataset.k=0; p.dataset.ans=''; mfDraw(p); return; }
    b=e.target.closest('.mfans button'); if(b){ b.blur(); var p2=b.closest('.mfw'), k=+(p2.dataset.k||0); if(k>=5) return; p2.dataset.ans=(p2.dataset.ans?p2.dataset.ans+',':'')+b.dataset.a; p2.dataset.k=k+1; mfDraw(p2); return; }
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
