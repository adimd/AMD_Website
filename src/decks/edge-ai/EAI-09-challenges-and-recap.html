<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 9 · Challenges, Opportunities, Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 9 */
.quiz{padding:26px 32px;max-width:1300px}
.qhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.qq{font-family:var(--display);font-size:38px;font-weight:600;color:var(--ink);line-height:1.2;margin:14px 0 22px}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qo button{text-align:left;padding:16px 20px;border:1px solid var(--rule2);background:var(--card);border-radius:10px;font-family:var(--sans);font-size:22px;color:var(--ink);cursor:pointer}
.qo button b{font-family:var(--mono);color:var(--accent);margin-right:12px}
.qo button.right{background:var(--ok-soft);border-color:var(--ok);border-width:2px}
.qo button.wrong{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.qe{min-height:62px;margin-top:16px;font-size:20px;color:var(--body)}
.qnav{display:flex;justify-content:space-between;margin-top:8px}
.qnav button{height:44px;padding:0 20px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:15px;color:var(--ink);cursor:pointer}
.qnav .qnext{background:var(--accent);border-color:var(--accent);color:#fff}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 09</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 9 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 09 · unit I · challenges, opportunities, recap</div>
    <h1>What is still hard,<br>and where it is going</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Eight classes made edge AI sound possible. Today we are honest about what makes it hard, look at where the field is heading, and pull all of Unit I into one picture.</p>
  </div>
  <div class="cue">Plan: 20 min challenges, 12 min opportunities, 13 min recap, 15 min quiz.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall: the bearing" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>A 300 Hz fault, sampled at 400 Hz.</h2>
    <svg viewBox="0 0 1300 250" width="1300" height="250">
      <line x1="40" y1="180" x2="1260" y2="180" stroke="#c6c3ba" stroke-width="1.5"/>
      <text x="40" y="206" font-size="13" fill="#8b9096" text-anchor="middle">0 Hz</text><text x="190" y="206" font-size="13" fill="#8b9096" text-anchor="middle">100 Hz</text><text x="340" y="206" font-size="13" fill="#8b9096" text-anchor="middle">200 Hz</text><text x="490" y="206" font-size="13" fill="#8b9096" text-anchor="middle">300 Hz</text><text x="640" y="206" font-size="13" fill="#8b9096" text-anchor="middle">400 Hz</text><text x="790" y="206" font-size="13" fill="#8b9096" text-anchor="middle">500 Hz</text><text x="940" y="206" font-size="13" fill="#8b9096" text-anchor="middle">600 Hz</text><text x="1090" y="206" font-size="13" fill="#8b9096" text-anchor="middle">700 Hz</text><text x="1240" y="206" font-size="13" fill="#8b9096" text-anchor="middle">800 Hz</text>
      <rect x="40" y="40" width="300" height="140" fill="#e6f1ee" opacity=".7"/><text x="190" y="64" font-size="14" fill="#146b5c" text-anchor="middle">what 400 Hz sampling can see: 0–200 Hz</text>
      <line x1="115" y1="180" x2="115" y2="100" stroke="#23408f" stroke-width="5"/><text x="115" y="92" font-size="13" fill="#23408f" text-anchor="middle">hum</text>
      <g class="frag"><line x1="490" y1="180" x2="490" y2="120" stroke="#a8231f" stroke-width="5"/><text x="490" y="112" font-size="13" fill="#a8231f" text-anchor="middle">real fault</text></g>
      <g class="frag"><line x1="190" y1="180" x2="190" y2="120" stroke="#a8231f" stroke-width="5" stroke-dasharray="6 4"/><text x="190" y="112" font-size="13" fill="#a8231f" text-anchor="middle">where it appears</text>
      <path d="M490 136 C 415 90, 265 90, 196 132" fill="none" stroke="#a8231f" stroke-width="2"/></g>
    </svg>
    <p class="frag" style="max-width:70ch">Sample faster than <strong>600 Hz</strong> to see it honestly. At 400 Hz it masquerades as <strong>100 Hz</strong>. A design decision in Class 8 becomes a safety problem in the field. That is today's theme.</p>
  </div>
  <div class="cue">Use it as the bridge: wrong sampling is a challenge nobody notices until something breaks.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Four families of challenge" data-act="challenges">
  <div>
    <h2 style="margin-bottom:10px">Every challenge falls into one of four families.</h2>
    <svg viewBox="0 0 1432 450" width="1432" height="450"><g class="frag"><rect x="0" y="0" width="700" height="214" rx="14" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.8"/><text x="24" y="44" font-size="26" fill="#146b5c" font-weight="700">Resources</text><text x="24" y="72" font-size="15" fill="#4b5057">memory · compute · energy</text><text x="24" y="120" font-size="17" fill="#15171b">· the model that fits flash but not SRAM · C7</text><text x="24" y="156" font-size="17" fill="#15171b">· a battery that lasts hours, not months · C4</text></g><g class="frag"><rect x="716" y="0" width="700" height="214" rx="14" fill="#eaeef7" stroke="#23408f" stroke-width="1.8"/><text x="740" y="44" font-size="26" fill="#23408f" font-weight="700">Data</text><text x="740" y="72" font-size="15" fill="#4b5057">scarce · unlabelled · shifting</text><text x="740" y="120" font-size="17" fill="#15171b">· lab audio vs street audio · C6</text><text x="740" y="156" font-size="17" fill="#15171b">· drift after shipping · C6</text></g><g class="frag"><rect x="0" y="230" width="700" height="214" rx="14" fill="#fbf0dc" stroke="#b06a12" stroke-width="1.8"/><text x="24" y="274" font-size="26" fill="#b06a12" font-weight="700">Engineering</text><text x="24" y="302" font-size="15" fill="#4b5057">fragmented · scattered · hard to test</text><text x="24" y="350" font-size="17" fill="#15171b">· every chip is different · C4</text><text x="24" y="386" font-size="17" fill="#15171b">· updating ten thousand devices · C2</text></g><g class="frag"><rect x="716" y="230" width="700" height="214" rx="14" fill="#fbeeed" stroke="#a8231f" stroke-width="1.8"/><text x="740" y="274" font-size="26" fill="#a8231f" font-weight="700">Trust</text><text x="740" y="302" font-size="15" fill="#4b5057">security · fairness · responsibility</text><text x="740" y="350" font-size="17" fill="#15171b">· anyone can pick up the device</text><text x="740" y="386" font-size="17" fill="#15171b">· who answers for a wrong decision?</text></g></svg>
  </div>
  <div class="cue">The "C" tags point back to the class where students first met each problem. Ask: which family worries you most for your Class 3 product?</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Resources: the battery" data-act="challenges">
  <div>
    <div class="kicker">resources</div>
    <h2>On a battery, every design choice is a lifetime.</h2>
    <svg viewBox="0 0 1432 330" width="1432" height="330"><line x1="360" y1="30" x2="360" y2="290" stroke="#e2e0d9"/><text x="360" y="314" font-size="13" fill="#8b9096" text-anchor="middle">1 hour</text><line x1="691" y1="30" x2="691" y2="290" stroke="#e2e0d9"/><text x="691" y="314" font-size="13" fill="#8b9096" text-anchor="middle">1 day</text><line x1="894" y1="30" x2="894" y2="290" stroke="#e2e0d9"/><text x="894" y="314" font-size="13" fill="#8b9096" text-anchor="middle">1 week</text><line x1="1046" y1="30" x2="1046" y2="290" stroke="#e2e0d9"/><text x="1046" y="314" font-size="13" fill="#8b9096" text-anchor="middle">1 month</text><line x1="1306" y1="30" x2="1306" y2="290" stroke="#e2e0d9"/><text x="1306" y="314" font-size="13" fill="#8b9096" text-anchor="middle">1 year</text><g class="frag"><text x="340" y="88" font-size="16" fill="#15171b" text-anchor="end">camera + Wi-Fi, always streaming</text><rect x="360" y="60" width="240" height="42" rx="6" fill="#a8231f" opacity=".85"/><text x="612" y="88" font-size="15" fill="#a8231f" font-weight="700">hours to a day</text></g><g class="frag"><text x="340" y="168" font-size="16" fill="#15171b" text-anchor="end">cascade: motion wakes the camera</text><rect x="360" y="140" width="683" height="42" rx="6" fill="#b06a12" opacity=".85"/><text x="1055" y="168" font-size="15" fill="#b06a12" font-weight="700">weeks</text></g><g class="frag"><text x="340" y="248" font-size="16" fill="#15171b" text-anchor="end">TinyML wake word, always listening</text><rect x="360" y="220" width="888" height="42" rx="6" fill="#146b5c" opacity=".85"/><text x="1260" y="248" font-size="15" fill="#146b5c" font-weight="700">months</text></g></svg>
    <p class="small">Same battery, three designs. Illustrative orders of magnitude, not measurements; the log scale hides how big the gaps are.</p>
    <p class="frag" style="max-width:72ch">The cheapest milliwatt is the one you never spend: sleep most of the time, wake on something small (Class 5's cascade), and send results rarely (Class 2's B).</p>
  </div>
  <div class="cue">Ask what a doorbell on batteries would have to give up. Then: why do many real video doorbells need wiring? (Exactly this chart.)</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Data: the hardest part" data-act="challenges">
  <div>
    <div class="kicker">data</div>
    <h2>Most edge AI projects fail on data, not on models.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="ntile frag"><div class="nb">scarce</div><div class="nk">no dataset exists</div><div class="ns">nobody has published "vibration of this pump, failing". You collect it yourself.</div></div>
      <div class="ntile frag"><div class="nb">unlabelled</div><div class="nk">labels cost people</div><div class="ns">hours of audio, and someone must mark every "open"</div></div>
      <div class="ntile frag"><div class="nb">skewed</div><div class="nk">lab ≠ field</div><div class="ns">quiet room in training, traffic noise at the door</div></div>
      <div class="ntile frag"><div class="nb">drifting</div><div class="nk">the world moves</div><div class="ns">worn motors, new accents, a new paint colour on the wall</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:72ch">Unit III's feasibility checks start here: <strong>do we have, or can we get, the data?</strong> If not, stop before building anything.</p>
  </div>
  <div class="cue">Ask each team: for your Class 3 product, where would the training data come from? Most will realise they would have to record it themselves.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Engineering: updating a fleet" data-act="challenges">
  <div>
    <div class="kicker">engineering</div>
    <h2>A bad update can break ten thousand devices at once.</h2>

        <p class="frag"><strong>Staged rollout:</strong> send it to 10% first. One of them misbehaves (red). Stop, fix, try again: 90% of the fleet never noticed.</p>

<!-- 07 -->
<section class="slide" data-t="Trust: security and fairness" data-act="challenges">
  <div>
    <div class="kicker">trust</div>
    <h2>The device is in someone else's hands.</h2>
    <div class="ngrid" style="grid-template-columns:1fr 1fr 1fr;gap:30px;text-align:left;margin-top:10px">
      <div class="cellx frag"><div class="big-n red" style="font-size:40px">Physical access</div><div class="nlab" style="margin-bottom:12px">security</div><p style="font-size:20px">Anyone can buy one, open it and read its flash. Your model, and any secrets in the firmware, must be protected as if the attacker holds the board. Because they can.</p></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:40px">Who is it for?</div><div class="nlab" style="margin-bottom:12px">fairness</div><p style="font-size:20px">A wake word trained mostly on one accent works worse for everyone else. On the edge, nobody sees the failures: they happen silently, in someone's home.</p></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:40px">Who answers?</div><div class="nlab" style="margin-bottom:12px">responsibility</div><p style="font-size:20px">The fall detector missed a fall. The lock opened for a stranger. Who is responsible: the model, the maker, the data?</p></div>
    </div>
    <p class="frag small" style="margin-top:20px">This is the "Responsible AI in the Edge AI workflow" topic in Unit III, and "Evaluation and Responsible AI" in Unit V.</p>
  </div>
  <div class="cue">Keep it as questions, not lectures. One good discussion prompt: should a doorbell's person detector be allowed to recognise faces? Who decides?</div>
</section>

projects</div></div></div>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.quiz'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  deck.querySelectorAll('.quiz').forEach(function(p){
    var Q=JSON.parse(p.dataset.q), st={i:0,ans:Q.map(function(){return -1;})};
    function draw(){
      var q=Q[st.i], got=st.ans[st.i];
      p.querySelector('.qn').textContent='question '+(st.i+1)+' of '+Q.length;
      var sc=st.ans.filter(function(a,k){return a===Q[k].a;}).length, done=st.ans.filter(function(a){return a>=0;}).length;
      p.querySelector('.qs').textContent='score '+sc+' / '+done;
      p.querySelector('.qq').textContent=q.q;
      p.querySelector('.qo').innerHTML=q.o.map(function(o,k){ var c=''; if(got>=0){ if(k===q.a) c='right'; else if(k===got) c='wrong'; } return '<button data-k="'+k+'" class="'+c+'"><b>'+'ABCD'[k]+'</b>'+o+'</button>'; }).join('');
      p.querySelector('.qe').textContent= got>=0 ? (got===q.a?'Correct. ':'Not quite. ')+q.e : '';
      p.querySelector('.qprev').style.visibility=st.i>0?'visible':'hidden';
      p.querySelector('.qnext').textContent= st.i<Q.length-1?'next question →':'final score: '+sc+' / '+Q.length;
    }
    p.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return; b.blur();
      if(b.dataset.k!==undefined){ if(st.ans[st.i]<0) st.ans[st.i]=+b.dataset.k; draw(); return; }
      if(b.classList.contains('qnext') && st.i<Q.length-1){ st.i++; draw(); }
      if(b.classList.contains('qprev') && st.i>0){ st.i--; draw(); }
    });
    draw();
  });

  paint();
})();
</script>
