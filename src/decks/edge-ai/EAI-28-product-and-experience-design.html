<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 28 · Product and Experience Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 28 */
pre{font-size:13.5px;line-height:1.34}
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.ses .cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.sesstats,.confstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.sesstats div,.confstats div{border-top:1px solid var(--rule);padding-top:6px;font-size:15px;color:var(--soft)}
.sesstats b,.confstats b{display:block;font-family:var(--mono);font-size:24px;color:var(--ink)}
.ledp{padding:14px 22px}
.lrow{display:grid;grid-template-columns:200px 58px 150px 150px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.lrow .ln{font-size:19px}
.ldot{width:40px;height:40px;border-radius:50%;border:2px solid var(--rule2)}
.lrow button{height:38px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer}
.ledwarn .lw{padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:17px}
.lw.bad{background:var(--fail-soft);color:var(--fail)}
.lw.ok{background:var(--ok-soft);color:var(--ok)}
@keyframes lblink{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes lflash{0%,12%{opacity:1}13%,100%{opacity:.08}}
@keyframes lslow{0%,49%{opacity:1}50%,100%{opacity:.08}}
.pt-blink{animation:lblink .5s infinite}
.pt-pulse{animation:lpulse 1.4s ease-in-out infinite}
.pt-flash{animation:lflash 2s infinite}
.pt-slow{animation:lslow 2s infinite}
.fwp{padding:14px 22px}
.fwp p{font-size:19px;min-height:84px}
.big-n.red{color:var(--fail)}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 28</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 28 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 28 · unit IV · designing edge AI applications · product and experience design</div>
    <h1>Same model,<br>different product.</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Unit III asked whether we should build it. Unit IV builds it. We start not with the model but with the person in front of it: what they want done, and what they see, hear and feel when the model guesses wrong.</p>
  </div>
  <div class="cue">Theory runs to slide 13; the exercise is one block at the end (slides 14 to 17). First pass only: Unit V returns to design principles and patterns in more depth. Boards are optional today (only for the LED sketch on slide 16).</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket · is your project feasible?</div>
    <h2>Three lines from one team (Bell, smart home).</h2>
    <table class="dt txt" style="width:100%;max-width:1250px">
      <tr><th style="width:24%">lens</th><th>their line</th></tr>
      <tr class="frag"><td>dataset</td><td>8 command words × 3 rooms × 25 speakers: about 6,000 clips. Hard but doable in 3 weeks.</td></tr>
      <tr class="frag"><td>technology</td><td>Wake model and slot models fit in SRAM as int8; 100 bytes per command to the language model.</td></tr>
      <tr class="frag"><td>business / moral</td><td>Cheaper than a smart speaker; audio never leaves the board. Risk: guests don't know it listens.</td></tr>
    </table>
    <p class="frag" style="margin-top:18px;max-width:72ch">Nothing in those three lines says what it is like to <strong>use</strong>. That is today.</p>
  </div>
  <div class="cue">An illustrative answer, not a real team's. Ask two teams to read theirs aloud first; the last row's risk ("guests don't know it listens") is an experience-design problem, which makes a natural bridge.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Two doorbells" data-act="the hook">
  <div>
    <div class="kicker">the hook · the same model in two products</div>
    <h2>One feels broken, one feels clever. The model is identical.</h2>
    <svg viewBox="0 0 1380 330" width="100%" height="330"><defs><marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><text x="0" y="88" font-size="18" font-weight="700" fill="#a8231f">doorbell A</text><line x1="200" y1="80" x2="1360" y2="80" stroke="#c6c3ba" stroke-width="2"/><circle cx="240" cy="80" r="13" fill="#fff" stroke="#8b9096" stroke-width="2.5"/><text x="240" y="120" font-size="14" text-anchor="middle" fill="#15171b">"lights on"</text><circle cx="520" cy="80" r="13" fill="#fff" stroke="#c6c3ba" stroke-width="2.5"/><text x="520" y="56" font-size="14" text-anchor="middle" fill="#15171b">… nothing …</text><circle cx="760" cy="80" r="13" fill="#fff" stroke="#8b9096" stroke-width="2.5"/><text x="760" y="120" font-size="14" text-anchor="middle" fill="#15171b">"LIGHTS ON!" again</text><circle cx="980" cy="80" r="13" fill="#146b5c" stroke="#146b5c" stroke-width="2.5"/><text x="980" y="56" font-size="14" text-anchor="middle" fill="#15171b">lights on</text><circle cx="1090" cy="80" r="13" fill="#a8231f" stroke="#a8231f" stroke-width="2.5"/><text x="1090" y="120" font-size="14" text-anchor="middle" fill="#15171b">lights off?!</text><circle cx="1250" cy="80" r="13" fill="#fff" stroke="#c6c3ba" stroke-width="2.5"/><text x="1250" y="56" font-size="14" text-anchor="middle" fill="#15171b">"kitchen" misheard: silence</text><g class="frag"><text x="0" y="238" font-size="18" font-weight="700" fill="#146b5c">doorbell B</text><line x1="200" y1="230" x2="1360" y2="230" stroke="#c6c3ba" stroke-width="2"/><circle cx="240" cy="230" r="13" fill="#fff" stroke="#8b9096" stroke-width="2.5"/><text x="240" y="270" font-size="14" text-anchor="middle" fill="#15171b">"lights on"</text><circle cx="300" cy="230" r="13" fill="#0e8a99" stroke="#0e8a99" stroke-width="2.5"/><text x="300" y="206" font-size="14" text-anchor="middle" fill="#15171b">cyan blink: heard</text><circle cx="560" cy="230" r="13" fill="#dfe6f5" stroke="#23408f" stroke-width="2.5"/><text x="560" y="270" font-size="14" text-anchor="middle" fill="#15171b">pulsing: thinking</text><circle cx="980" cy="230" r="13" fill="#146b5c" stroke="#146b5c" stroke-width="2.5"/><text x="980" y="206" font-size="14" text-anchor="middle" fill="#15171b">lights on, green</text><circle cx="1260" cy="230" r="13" fill="#f5dfbd" stroke="#b06a12" stroke-width="2.5"/><text x="1260" y="270" font-size="14" text-anchor="middle" fill="#15171b">"kitchen" misheard: amber, "again?"</text></g><text x="200" y="322" font-size="14" fill="#8b9096">same model · same accuracy · same 1.8 s latency</text></svg>
    <p class="frag" style="max-width:76ch">In A, nothing happened for two seconds, so the user said it again, and the second command undid the first. B acknowledged instantly, showed it was working, and asked when unsure. That difference is <strong>experience design</strong>.</p>
  </div>
  <div class="cue">An invented scenario, but a very common failure: with no acknowledgement, users repeat themselves, and a toggle-style command then fires twice. Ask: which of B's changes needed a better model? (None.)</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Every answer is a guess" data-act="experience design">
  <div>
    <h2>A model never knows; it guesses. Design for all four outcomes.</h2>
    <div class="split" style="grid-template-columns:1fr 1fr;gap:20px">
      <div class="panel frag" style="border-left:6px solid var(--ok)"><span class="lab" style="color:var(--ok)">said it · acted</span><p>The happy path. Make it feel instant and confirm it happened.</p></div>
      <div class="panel frag" style="border-left:6px solid var(--soft)"><span class="lab" style="color:var(--soft)">didn't say it · did nothing</span><p>Invisible, and should stay invisible.</p></div>
      <div class="panel frag" style="border-left:6px solid var(--amber)"><span class="lab" style="color:var(--amber)">said it · ignored (false reject)</span><p>Annoying. The user repeats, louder. Fix with feedback: "I heard something, say again".</p></div>
      <div class="panel frag" style="border-left:6px solid var(--fail)"><span class="lab" style="color:var(--fail)">didn't say it · acted (false accept)</span><p>Can be dangerous. A pump starts, a nurse is called for nothing. Fix with confirmation, undo and safe limits.</p></div>
    </div>
  </div>
  <div class="cue">Which error is worse depends on the product (Class 26's "which mistake is worse?"): for Robo's "stop" a false reject is dangerous; for Pump's "on" a false accept is. Design treats the two differently even with the same model.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Live an hour with it" data-act="experience design">

<!-- 07 -->
<section class="slide" data-t="How long feels instant" data-act="experience design">
  <div>
    <h2>People feel time in three bands. Answer inside the right one, or say "working on it".</h2>
    <div class="ngrid" style="grid-template-columns:repeat(3,1fr)">
      <div class="cellx frag"><div class="big-n green" style="font-size:48px">~0.1 s</div><div class="nlab">feels instant</div><p style="font-size:19px;margin-top:10px">The "heard you" light must land here. The cheap voice detector (Class 19) can trigger it before any model runs.</p></div>
      <div class="cellx frag"><div class="big-n" style="font-size:48px">~1 s</div><div class="nlab">keeps the flow</div><p style="font-size:19px;margin-top:10px">The action itself should land here: wake model, grammar and slot models on the board.</p></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:48px">~10 s</div><div class="nlab">attention wanders</div><p style="font-size:19px;margin-top:10px">A language-model round trip on a slow network can drift here: show progress, or answer from the offline table first.</p></div>
    </div>
  </div>
  <div class="cue">These are Jakob Nielsen's widely cited response-time limits (Usability Engineering, 1993), based on older research by Miller and Card: approximate guidelines, not laws. Link to Class 20: the latency sum decides which band you land in.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Confidence decides the behaviour" data-act="experience design">
  <div>

    </div>

</section>

<!-- 09 -->
<section class="slide" data-t="Fail gracefully" data-act="experience design">

<section class="slide" data-t="Optional: the LED language on the board" data-act="exercise">
  <div class="split" style="grid-template-columns:1.5fr .5fr;align-items:center">
    <pre><span class="c">// LED language · type a key in the Serial Monitor to fake each state</span>
<span class="k">enum</span> State { IDLE, LISTENING, HEARD, THINKING, DONE, UNSURE, OFFLINE };
State st = IDLE;  <span class="k">uint32_t</span> since = <span class="s">0</span>;

<span class="k">void</span> <span class="f">setState</span>(State s) { st = s;  since = millis(); }

<span class="k">void</span> <span class="f">show</span>() {
  <span class="k">uint32_t</span> t = millis() - since;
  <span class="k">bool</span> blink = (t / <span class="s">250</span>) % <span class="s">2</span>;                      <span class="c">// 2 Hz</span>
  <span class="k">switch</span> (st) {
    <span class="k">case</span> IDLE:      rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">0</span>, <span class="s">0</span>);  <span class="k">break</span>;
    <span class="k">case</span> LISTENING: rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">0</span>, <span class="s">30</span>); <span class="k">break</span>;                 <span class="c">// steady blue</span>
    <span class="k">case</span> HEARD:     rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">30</span>, <span class="s">30</span>);                         <span class="c">// cyan flash</span>
                     <span class="k">if</span> (t &gt; <span class="s">150</span>) setState(THINKING);  <span class="k">break</span>;
    <span class="k">case</span> THINKING:  rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">0</span>, blink ? <span class="s">30</span> : <span class="s">4</span>); <span class="k">break</span>;     <span class="c">// pulsing blue</span>
    <span class="k">case</span> DONE:      rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">40</span>, <span class="s">0</span>);                          <span class="c">// green</span>
                     <span class="k">if</span> (t &gt; <span class="s">800</span>) setState(IDLE);  <span class="k">break</span>;
    <span class="k">case</span> UNSURE:    rgbLedWrite(RGB_BUILTIN, blink ? <span class="s">40</span> : <span class="s">0</span>, blink ? <span class="s">20</span> : <span class="s">0</span>, <span class="s">0</span>);   <span class="c">// amber blinks</span>
                     <span class="k">if</span> (t &gt; <span class="s">1500</span>) setState(LISTENING);  <span class="k">break</span>;              <span class="c">// then listen again</span>
    <span class="k">case</span> OFFLINE:   rgbLedWrite(RGB_BUILTIN, (t / <span class="s">1000</span>) % <span class="s">2</span> ? <span class="s">20</span> : <span class="s">0</span>, <span class="s">0</span>, <span class="s">20</span>); <span class="k">break</span>; <span class="c">// slow purple</span>
  }
}

  }

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA') return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.timer')||e.target.closest('pre'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  /* session simulator */
  function sesDraw(p){
    var fr=+p.querySelector('.sfr').value/100, fa=+p.querySelector('.sfa').value, lat=+p.querySelector('.slat').value/10, fb=+p.querySelector('.ses .cb button.sel').dataset.v;
    p.querySelector('.sfrv').textContent=Math.round(fr*100)+'%'; p.querySelector('.sfav').textContent=fa; p.querySelector('.slatv').textContent=lat.toFixed(1)+' s';
    var seed=5; function r(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
    var ev=[], ok=0, gave=0, tries=0, undone=0, time=0;
    for(var c=0;c<12;c++){
      var t0=200+c*90, att=0, done=false;
      while(att<3 && !done){ att++; tries++; if(r()>=fr) done=true; else ev.push([t0+att*12,'retry']); }
      time+=att*(1.5+lat);
      if(done){ ok++; var rep=(!fb && lat>1.0 && r()<0.33); if(rep){ undone++; ev.push([t0+att*12+6,'double']); } else ev.push([t0+att*12+6,'ok']); }
      else { gave++; ev.push([t0+40,'gave']); }
    }
    for(var k=0;k<fa;k++) ev.push([150+Math.floor((k+0.5)/fa*1100)+20,'fa']);
    var col={ok:'#146b5c',retry:'#b06a12',gave:'#a8231f',double:'#7a3fa0',fa:'#a8231f'}, o='<line x1="150" y1="60" x2="1290" y2="60" stroke="#c6c3ba" stroke-width="2"/><text x="0" y="66" font-size="15" fill="#4b5057">one hour</text>';
    ev.forEach(function(e){ if(e[1]==='fa') o+='<rect x="'+(e[0]-8)+'" y="20" width="16" height="16" fill="#a8231f" transform="rotate(45 '+e[0]+' 28)"/>'; else o+='<circle cx="'+e[0]+'" cy="60" r="'+(e[1]==='ok'?10:7)+'" fill="'+col[e[1]]+'"/>'; });
    var L=[['#146b5c','done'],['#b06a12','ignored, retried'],['#a8231f','gave up'],['#7a3fa0','repeated: undone'],['#a8231f','◆ acted unasked']];
    L.forEach(function(l,k){ o+='<circle cx="'+(160+k*220)+'" cy="104" r="6" fill="'+l[0]+'"/><text x="'+(172+k*220)+'" y="109" font-size="13" fill="#4b5057">'+l[1]+'</text>'; });
    p.querySelector('.sessvg').innerHTML=o;
    var succ=ok-undone;
    p.querySelector('.sesstats').innerHTML='<div>commands that ended right<b style="color:'+(succ>=11?'var(--ok)':'var(--fail)')+'">'+succ+' / 12</b></div><div>times the user spoke<b>'+(tries+undone)+'</b></div><div>avg seconds per command<b>'+(time/12).toFixed(1)+'</b></div><div>unwanted actions<b style="color:'+((fa+undone)?'var(--fail)':'var(--ok)')+'">'+(fa+undone)+'</b></div>';
  }
  deck.querySelectorAll('.ses').forEach(function(p){ sesDraw(p); p.querySelectorAll('input').forEach(function(x){ x.addEventListener('input',function(){sesDraw(p);}); }); });
  /* confidence */
  var CC=[], CW=[]; (function(){ var seed=9; function r(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
    for(var k=0;k<200;k++){ var v=1-Math.pow(r(),2.2)*0.6; CC.push(Math.min(0.995,v)); }
    for(var k2=0;k2<40;k2++){ CW.push(0.25+r()*0.72); } })();
  function confDraw(p){
    var A=+p.querySelector('.cact').value/100, Q=+p.querySelector('.cask').value/100; if(Q>A){ Q=A; p.querySelector('.cask').value=Math.round(A*100); }
    p.querySelector('.cactv').textContent=Math.round(A*100)+'%'; p.querySelector('.caskv').textContent=Math.round(Q*100)+'%';
    function X(v){ return 60+v*1200; }
    var o='<rect x="'+X(0)+'" y="10" width="'+(X(Q)-X(0))+'" height="150" fill="#8b9096" opacity=".08"/><rect x="'+X(Q)+'" y="10" width="'+(X(A)-X(Q))+'" height="150" fill="#b06a12" opacity=".1"/><rect x="'+X(A)+'" y="10" width="'+(X(1)-X(A))+'" height="150" fill="#146b5c" opacity=".1"/>';
    o+='<text x="'+((X(0)+X(Q))/2)+'" y="28" font-size="14" text-anchor="middle" fill="#4b5057" font-weight="700">ignore · "say again"</text><text x="'+((X(Q)+X(A))/2)+'" y="28" font-size="14" text-anchor="middle" fill="#b06a12" font-weight="700">ask</text><text x="'+((X(A)+X(1))/2)+'" y="28" font-size="14" text-anchor="middle" fill="#146b5c" font-weight="700">act</text>';
    var NB=40, hc=[], hw=[]; for(var q=0;q<NB;q++){ hc.push(0); hw.push(0); }
    CC.forEach(function(v){ hc[Math.min(NB-1,Math.floor(v*NB))]++; }); CW.forEach(function(v){ hw[Math.min(NB-1,Math.floor(v*NB))]++; });
    var mxh=1; for(var q2=0;q2<NB;q2++) mxh=Math.max(mxh,hc[q2]+hw[q2]);
    for(var q3=0;q3<NB;q3++){ var x0=X(q3/NB)+2, w=1200/NB-4, h1=hc[q3]/mxh*115, h2=hw[q3]/mxh*115;
      o+='<rect x="'+x0+'" y="'+(160-h1)+'" width="'+w+'" height="'+h1+'" fill="#23408f" opacity=".85"/><rect x="'+x0+'" y="'+(160-h1-h2)+'" width="'+w+'" height="'+h2+'" fill="#a8231f" opacity=".9"/>'; }
    [0,0.25,0.5,0.75,1].forEach(function(v){ o+='<text x="'+X(v)+'" y="182" font-size="13" text-anchor="middle" fill="#8b9096">'+Math.round(v*100)+'%</text>'; });
    o+='<circle cx="900" cy="200" r="5" fill="#23408f"/><text x="910" y="205" font-size="13" fill="#4b5057">heard right</text><circle cx="1040" cy="200" r="5" fill="#a8231f"/><text x="1050" y="205" font-size="13" fill="#4b5057">heard wrong</text>';
    p.querySelector('.confsvg').innerHTML=o;
    var actR=CC.filter(function(v){return v>=A;}).length, actW=CW.filter(function(v){return v>=A;}).length, ask=CC.concat(CW).filter(function(v){return v>=Q&&v<A;}).length, ign=CC.filter(function(v){return v<Q;}).length;
    p.querySelector('.confstats').innerHTML='<div>acted, correctly<b style="color:var(--ok)">'+actR+'</b></div><div>acted on a wrong guess<b style="color:'+(actW?'var(--fail)':'var(--ok)')+'">'+actW+'</b></div><div>asked "did you mean…?"<b style="color:var(--amber)">'+ask+'</b></div><div>right, but ignored<b>'+ign+'</b></div>';
  }
  deck.querySelectorAll('.conf').forEach(function(p){ confDraw(p); p.querySelectorAll('input').forEach(function(x){ x.addEventListener('input',function(){confDraw(p);}); }); });
  /* LED designer */
  var LC=[['off','#2a2a2a'],['red','#e03a2f'],['amber','#f0a020'],['green','#2fb36a'],['cyan','#1fb5c8'],['blue','#3a6be0'],['purple','#9a4fd0'],['white','#f4f4f4']];
  var LP=[['steady',''],['blink','pt-blink'],['pulse','pt-pulse'],['flash once','pt-flash'],['slow blink','pt-slow']];
  var LS=[['listening',5,0],['heard you',4,3],['thinking',5,2],['done',3,3],["didn't understand",2,1],['offline',6,4],['error',1,0]];
  function ledDraw(p){
    var st=JSON.parse(p.dataset.st||JSON.stringify(LS.map(function(s){return [s[1],s[2]];})));
    p.dataset.st=JSON.stringify(st);
    p.querySelector('.ledrows').innerHTML='<div class="lrow" style="color:var(--soft);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase"><span>state</span><span>LED</span><span>colour</span><span>pattern</span></div>'+LS.map(function(s,k){ var c=LC[st[k][0]], pt=LP[st[k][1]];
      return '<div class="lrow"><span class="ln">'+s[0]+'</span><span class="ldot '+pt[1]+'" style="background:'+c[1]+'"></span><button data-lc="'+k+'">'+c[0]+'</button><button data-lp="'+k+'">'+pt[0]+'</button></div>'; }).join('');
    var w=[];
    for(var a=0;a<st.length;a++) for(var b=a+1;b<st.length;b++){
      if(st[a][0]===st[b][0]&&st[a][1]===st[b][1]) w.push('<div class="lw bad">"'+LS[a][0]+'" and "'+LS[b][0]+'" look identical.</div>');
      else if(st[a][1]===st[b][1]&&st[a][0]!==st[b][0]&&st[a][0]!==0&&st[b][0]!==0&&((st[a][0]===1&&st[b][0]===3)||(st[a][0]===3&&st[b][0]===1)||(st[a][0]===2&&st[b][0]===3)||(st[a][0]===3&&st[b][0]===2))) w.push('<div class="lw bad">"'+LS[a][0]+'" and "'+LS[b][0]+'" differ only by red/green-type colours: hard for colour-blind users.</div>');
    }
    st.forEach(function(x,k){ if(x[0]===1 && k!==6) w.push('<div class="lw bad">Red on "'+LS[k][0]+'": people read red as a fault.</div>'); if(x[0]===0 && k!==6) w.push('<div class="lw bad">"'+LS[k][0]+'" is invisible (LED off).</div>'); });
    p.querySelector('.ledwarn').innerHTML= w.length? w.slice(0,6).join('') : '<div class="lw ok">Every state is distinct, red is kept for errors, and no two states rely on colour alone.</div>';
  }
  deck.querySelectorAll('.ledp').forEach(ledDraw);
  /* failure walk */
  var FW=[['voice detector','the room is noisy','The LED never changes; the user doesn’t know whether to speak louder or wait.','Amber "too noisy" pattern after two failed tries; the physical button still works.'],
          ['wake word','"pump" not heard','Silence. The user shouts the whole command again, louder.','Nothing to show until wake: that is fine, but the wake model must favour false rejects only slightly.'],
          ['grammar','"pump on for ten minutes" → not in grammar','The board silently ignores a valid-sounding request.','Amber blink plus "say: pump on, then the minutes": the grammar teaches its own shape.'],
          ['slot model','"ten" heard as "two"','The pump runs for 2 minutes; the field stays dry; nobody knows why.','Read back "pump on, two minutes?" before acting, because time slots are costly to get wrong.'],
          ['language-model link','no network','A spinner forever, or a crash.','Offline table answers "pump on, 10 minutes" at once; slow purple shows "offline, basic commands only".'],
          ['action','relay fails or motor stalls','The board says "done"; the pump is not running.','Check the current sensor after switching; red error pattern if the motor did not start.']];
  function fwDraw(p,k){
    var o='';
    FW.forEach(function(f,q){ var x=10+q*215, on=q===k; o+='<rect x="'+x+'" y="20" width="195" height="70" rx="10" fill="'+(on?'#a8231f':'#ffffff')+'" stroke="'+(on?'#a8231f':'#23408f')+'" stroke-width="2" style="cursor:pointer" data-fw="'+q+'"/><text x="'+(x+97)+'" y="62" font-size="16" text-anchor="middle" font-weight="700" fill="'+(on?'#ffffff':'#23408f')+'" data-fw="'+q+'" style="cursor:pointer">'+f[0]+'</text>'; if(q<5) o+='<text x="'+(x+205)+'" y="61" font-size="18" fill="#8b9096" text-anchor="middle">›</text>'; });
    o+='<text x="10" y="114" font-size="14" fill="#4b5057">'+(k>=0?'broken: '+FW[k][1]:'click a stage')+'</text>';
    p.querySelector('.fwsvg').innerHTML=o;
    p.querySelector('.fwbad').textContent= k>=0? FW[k][2] : '';
    p.querySelector('.fwgood').textContent= k>=0? FW[k][3] : '';
  }
  deck.querySelectorAll('.fwp').forEach(function(p){ fwDraw(p,-1); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.ses .cb button'); if(b){ b.blur(); b.parentNode.querySelectorAll('button').forEach(function(q){q.classList.remove('sel');}); b.classList.add('sel'); sesDraw(b.closest('.ses')); return; }
    b=e.target.closest('[data-lc],[data-lp]'); if(b){ b.blur(); var p=b.closest('.ledp'), st=JSON.parse(p.dataset.st);
      if(b.dataset.lc!==undefined){ var k=+b.dataset.lc; st[k][0]=(st[k][0]+1)%LC.length; } else { var k2=+b.dataset.lp; st[k2][1]=(st[k2][1]+1)%LP.length; }
      p.dataset.st=JSON.stringify(st); ledDraw(p); return; }
    var f=e.target.closest('[data-fw]'); if(f){ fwDraw(f.closest('.fwp'),+f.getAttribute('data-fw')); return; }
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
