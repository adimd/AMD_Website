<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 12 · Visual and Scene Sensors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}

/* class 12 */
pre{font-size:15px;line-height:1.45}
.shut{padding:18px 26px}
.sverdict{font-size:22px;font-weight:600;color:var(--ink);margin-top:6px}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.exgrid img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px;display:block;margin:6px 0 10px}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.vgrid img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px;display:block;margin:6px 0 10px}
.px{padding:18px}
.px .cb button{font-size:16px;height:38px;padding:0 12px}
.pximg img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px;display:block}
.vcalc .cb button{font-size:16px;padding:0 12px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 12</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 12 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 12 · unit II · visual and scene sensors</div>
    <h1>A camera is a grid<br>of tiny light meters</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Each pixel measures how much light fell on it. Today: how those measurements are made, what they cost in bytes, and what else can "see" a scene without a normal camera.</p>
  </div>
  <div class="cue">Theory runs to slide 12; the lab is one block at the end (slides 13 to 15). The kit has no camera, so the lab uses the laptop webcam in Colab: test it on the classroom machine before class.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>A pump with faults up to 2 kHz.</h2>
    <div class="ngrid" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
      <div class="cellx frag"><div class="big-n" style="font-size:40px">wide-band</div><div class="nlab">vibration sensor or piezo</div></div>
      <div class="cellx frag"><div class="big-n" style="font-size:40px">&gt; 4 kHz</div><div class="nlab">sample rate, twice 2 kHz</div></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:40px">260 Hz</div><div class="nlab">the MPU6050's widest filter</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:70ch">Today the same question for light: what does the sensor actually capture, and how much of it can the board afford?</p>
  </div>
  <div class="cue">Ask a team for the sample rate they measured in last lab's Part B; it is usually far below 4 kHz.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Three cameras, one doorbell" data-act="the hook">
  <div>
    <h2>Which of these does the doorbell's model actually need?</h2>
    <svg viewBox="0 0 1432 430" width="1432" height="430">
      <rect x="0" y="20" width="520" height="390" fill="#eaeef7" stroke="#23408f" stroke-width="2"/>
      <text x="16" y="52" font-size="18" fill="#23408f" font-weight="700">a phone camera · 12 MP</text>
      <text x="16" y="76" font-size="14" fill="#4b5057">4000 × 3000 · 36 MB as raw RGB</text>
      <g class="frag"><rect x="580" y="254" width="208" height="156" fill="#fbf0dc" stroke="#b06a12" stroke-width="2"/>
      <text x="580" y="218" font-size="18" fill="#b06a12" font-weight="700">a cheap module · 2 MP</text>
      <text x="580" y="242" font-size="14" fill="#4b5057">1600 × 1200, OV2640 class</text></g>
      <g class="frag"><rect x="860" y="398" width="12" height="12" fill="#146b5c"/>
      <line x1="880" y1="402" x2="960" y2="300" stroke="#146b5c" stroke-width="1.5"/>
      <text x="966" y="296" font-size="18" fill="#146b5c" font-weight="700">what a TinyML model sees</text>
      <text x="966" y="320" font-size="14" fill="#4b5057">96 × 96 greyscale · 9 KB</text></g>
      <text x="0" y="424" font-size="13" fill="#8b9096">DRAWN TO SCALE BY PIXEL COUNT</text>
    </svg>
  </div>
  <div class="cue">The green square is genuinely that small at this scale. Ask why we would ever pay for the 12 MP sensor if the model sees 96 × 96. (Clips for humans; zoom; quality.) 36 MB = 4000 × 3000 × 3 bytes.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Inside an image sensor" data-act="the sensor">
  <div class="split" style="grid-template-columns:1fr 1fr;align-items:center">
    <svg viewBox="0 0 620 420" width="620" height="420">
      <defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs>
      <text x="60" y="20" font-size="14" fill="#8b9096">A GRID OF PHOTODIODES · ONE PER PIXEL</text>

        <text x="234" y="376" font-size="14" fill="#23408f" text-anchor="middle">read out row by row → amplifier → ADC</text>

    <div class="stack">
      <h2>Each pixel is a photodiode collecting charge.</h2>
      <p class="frag">More light, more charge. After the <strong>exposure time</strong>, each pixel's charge is read out, amplified and digitised: Class 10's chain, repeated millions of times.</p>
      <p class="frag">Resolution is just how many pixels. Each pixel is still a single light meter.</p>
      <p class="frag small">The readout happens row by row on most cheap sensors. Hold that thought for two slides.</p>

  <div class="cue">A 2 MP sensor is 1.92 million of these light meters, each with its own reading per frame.</div>

width="46" height="46" rx="4" fill="#3f9b5a" opacity=".85"/><text x="263" y="320" font-size="15" fill="#faf9f6" text-anchor="middle" font-weight="700">G</text><rect x="290" y="290" width="46" height="46" rx="4" fill="#3a63c9" opacity=".85"/><text x="313" y="320" font-size="15" fill="#faf9f6" text-anchor="middle" font-weight="700">B</text><rect x="340" y="290" width="46" height="46" rx="4" fill="#3f9b5a" opacity=".85"/><text x="363" y="320" font-size="15" fill="#faf9f6" text-anchor="middle" font-weight="700">G</text><rect x="390" y="290" width="46" height="46" rx="4" fill="#3a63c9" opacity=".85"/><text x="413" y="320" font-size="15" fill="#faf9f6" text-anchor="middle" font-weight="700">B</text><text x="40" y="360" font-size="13" fill="#8b9096">BAYER PATTERN · RED, GREEN, GREEN, BLUE</text></svg>
    <div class="stack">
      <h2>A colour filter over each pixel. Each pixel sees only one colour.</h2>
      <p class="frag">A photodiode cannot tell colours apart. So each one gets a red, green or blue filter, in a repeating 2 × 2 pattern.</p>
      <p class="frag">The missing two colours at every pixel are <strong>guessed from the neighbours</strong> (demosaicing). The full-colour image is partly interpolated.</p>
      <p class="frag small">Twice as many green pixels, because our eyes are most sensitive to green. And a greyscale model throws the colour away again: one byte per pixel instead of three.</p>
    </div>
  </div>
  <div class="cue">The point for ML: a colour image has three times the bytes but not three times the information for many tasks. Person detection works well in greyscale.</div>
</section>

<section class="slide" data-t="JPEG or raw?" data-act="the budget">

    <h2>JPEG is small to send, but a model cannot read JPEG.</h2>
    <svg viewBox="0 0 1432 390" width="1432" height="390"><defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><text x="0" y="30" font-size="15" fill="#b06a12" font-weight="700">PATH A · CAPTURE JPEG</text><rect x="0" y="46" width="200" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="14" y="78" font-size="16" fill="#15171b" font-weight="700">camera</text><text x="14" y="100" font-size="13" fill="#4b5057">JPEG out</text><line x1="204" y1="82" x2="246" y2="82" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="250" y="46" width="230" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="264" y="78" font-size="16" fill="#15171b" font-weight="700">JPEG frame</text><text x="264" y="100" font-size="13" fill="#4b5057">cheap to store and send</text><line x1="484" y1="82" x2="526" y2="82" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="530" y="46" width="230" height="72" rx="10" fill="#fbeeed" stroke="#a8231f" stroke-width="1.5"/><text x="544" y="78" font-size="16" fill="#15171b" font-weight="700">decode</text><text x="544" y="100" font-size="13" fill="#4b5057">time + a full frame of RAM</text><line x1="764" y1="82" x2="806" y2="82" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="810" y="46" width="200" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="824" y="78" font-size="16" fill="#15171b" font-weight="700">resize</text><text x="824" y="100" font-size="13" fill="#4b5057">to 96 × 96</text><line x1="1014" y1="82" x2="1056" y2="82" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="1060" y="46" width="200" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="1074" y="78" font-size="16" fill="#15171b" font-weight="700">model</text><text x="1074" y="100" font-size="13" fill="#4b5057"></text><g class="frag"><text x="0" y="200" font-size="15" fill="#146b5c" font-weight="700">PATH B · CAPTURE SMALL RAW FRAMES</text><rect x="0" y="216" width="200" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="14" y="248" font-size="16" fill="#15171b" font-weight="700">camera</text><text x="14" y="270" font-size="13" fill="#4b5057">small greyscale out</text><line x1="204" y1="252" x2="806" y2="252" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="810" y="216" width="200" height="72" rx="10" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.5"/><text x="824" y="248" font-size="16" fill="#15171b" font-weight="700">(maybe crop)</text><text x="824" y="270" font-size="13" fill="#4b5057">already near 96 × 96</text><line x1="1014" y1="252" x2="1056" y2="252" stroke="#8b9096" stroke-width="2.4" marker-end="url(#m2)"/><rect x="1060" y="216" width="200" height="72" rx="10" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="1074" y="248" font-size="16" fill="#15171b" font-weight="700">model</text><text x="1074" y="270" font-size="13" fill="#4b5057"></text></g><g class="frag"><text x="0" y="350" font-size="15" fill="#23408f" font-weight="700">THE DOORBELL DOES BOTH</text><text x="0" y="376" font-size="15" fill="#15171b">small raw frames for the model, a JPEG clip only when someone rings</text></g></svg>

  <div class="cue">The OV2640 class of sensor can output JPEG directly, which is why camera boards are popular for streaming. For inference, the decode step is pure overhead.</div>

      <h2>How few pixels before you cannot tell there is a person?</h2>
      <p class="pxinfo big" style="font-size:26px"></p>
      <p class="frag">Most microcontroller person detectors work at around <strong>96 × 96</strong>. The question is not "how sharp", it is "how small can it be and still be right".</p>
      <p class="frag small">Smaller input means a smaller first layer, fewer activations, less SRAM (Class 7). Resolution is a design choice, not a given.</p>
    </div>
  </div>
  <div class="cue">A simulated doorway scene. Ask the room at each size: person or no person? Most can still tell at 24 × 24; at 12 × 12 opinions split. A model is similar, but it also needs enough pixels to tell a person from a coat on a hook.</div>

<span class="k">from</span> PIL <span class="k">import</span> Image
<span class="k">import</span> numpy <span class="k">as</span> np, io, time

img = Image.open(<span class="s">'photo.jpg'</span>).convert(<span class="s">'RGB'</span>)
w, h = img.size
print(<span class="s">'size        '</span>, w, <span class="s">'x'</span>, h)
print(<span class="s">'raw RGB888  '</span>, np.asarray(img).nbytes, <span class="s">'bytes'</span>)
print(<span class="s">'as RGB565   '</span>, w * h * <span class="s">2</span>, <span class="s">'bytes'</span>)
grey = img.convert(<span class="s">'L'</span>)
print(<span class="s">'greyscale   '</span>, np.asarray(grey).nbytes, <span class="s">'bytes'</span>)

<span class="k">for</span> q <span class="k">in</span> (<span class="s">90</span>, <span class="s">30</span>):
    buf = io.BytesIO(); img.save(buf, <span class="s">'JPEG'</span>, quality=q)
    print(<span class="s">f'JPEG q={q}   '</span>, buf.tell(), <span class="s">'bytes'</span>)

t = time.perf_counter()
<span class="k">for</span> _ <span class="k">in</span> range(<span class="s">100</span>):
    small = grey.resize((<span class="s">96</span>, <span class="s">96</span>))
print(<span class="s">'resize      '</span>, (time.perf_counter() - t) * <span class="s">10</span>, <span class="s">'ms each'</span>)

display(small.resize((<span class="s">384</span>, <span class="s">384</span>), Image.NEAREST))</pre>

    <h2 style="font-size:44px;max-width:32ch;margin:0 auto">A team wants to count cars at 15 frames a second at VGA RGB565 on the ESP32-S3. Calculate the data rate. What would you change, and why?</h2>

  <div class="cue">Answer: 640 × 480 × 2 × 15 = 9,216,000 bytes ≈ 8.8 MB per second, and each 600 KB frame does not fit in SRAM. Better: greyscale, QVGA or smaller, fewer frames per second (cars do not need 15), or count only when motion is detected.</div>

    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.shut')||e.target.closest('.vcalc')||e.target.closest('.px')||e.target.closest('.timer')||e.target.closest('pre'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  function shutDraw(p){
    var mode=p.querySelector('[data-g="s"] .sel').dataset.v, v=+p.querySelector('[data-g="m"] .sel').dataset.v, R=24, h=270/R, o='';
    for(var r=0;r<R;r++){ var shift= mode==='rolling' ? v*r*6 : 0; var x=520+shift+(mode==='global'?v*R*3:0);
      o+='<rect x="0" y="'+(15+r*h).toFixed(1)+'" width="1300" height="'+(h-1).toFixed(1)+'" fill="'+(r%2?'#f2f1ec':'#faf9f6')+'"/>';
      o+='<rect x="'+x.toFixed(1)+'" y="'+(15+r*h).toFixed(1)+'" width="44" height="'+(h-1).toFixed(1)+'" fill="#23408f"/>'; }
    o+='<text x="10" y="12" font-size="12" fill="#8b9096">ROW 1 READ FIRST</text><text x="10" y="298" font-size="12" fill="#8b9096">ROW 24 READ LAST</text>';
    p.querySelector('.srows').innerHTML=o;
    var msg = v===0 ? 'Nothing moves: both shutters give a straight pole.' : (mode==='global' ? '<span style="color:var(--ok)">Global shutter: every row exposed at once. The pole stays straight.</span>' : (v<=1 ? '<span style="color:var(--amber)">A slight lean. Usually harmless.</span>' : '<span style="color:var(--fail)">Strong skew. A model trained on still images may not recognise this.</span>'));
    p.querySelector('.sverdict').innerHTML=msg;
  }
  deck.querySelectorAll('.shut').forEach(shutDraw);
  function fbv(x){ if(x<1024) return Math.round(x)+' B'; if(x<1048576) return (x/1024).toFixed(x<10240?1:0)+' KB'; return (x/1048576).toFixed(2)+' MB'; }
  function vcalc(c){
    var r=c.querySelector('[data-g="r"] .sel').dataset.v.split('x'), w=+r[0], h=+r[1];
    var fb=c.querySelector('[data-g="f"] .sel'), b=+fb.dataset.v, fps=+c.querySelector('[data-g="p"] .sel').dataset.v;
    var frame=w*h*b, rate=frame*fps;
    c.querySelector('.cformula').innerHTML=w+' × '+h+' × '+b+' B ('+fb.dataset.n+') = <b>'+fbv(frame)+' per frame</b> &nbsp;·&nbsp; × '+fps+' fps = <b>'+fbv(rate)+' per second</b>';
    var overS=false, overP=false;
    c.querySelectorAll('.cbar').forEach(function(bar){ var f=bar.querySelector('.cfill'), cap=+f.dataset.cap, pc=frame/cap*100;
      f.style.width=Math.min(pc,100)+'%'; f.classList.toggle('over',pc>100); bar.querySelector('.cpct').textContent=pc>100?'too big':(pc<0.1?'< 0.1%':pc.toFixed(pc<10?1:0)+'%');
      if(pc>100){ if(cap<1e6) overS=true; else overP=true; } });
    c.querySelector('.cverdict').textContent= overP?'One frame does not even fit in PSRAM.':(overS?'One frame is bigger than all of SRAM: PSRAM only.':(frame/524288>0.3?'Fits in SRAM, but takes a big share of it.':'Fits comfortably in SRAM.'));
  }
  deck.querySelectorAll('.vcalc').forEach(vcalc);
  var PXT={384:'Plenty of detail: clearly a person in a doorway.',96:'96 × 96: still clearly a person. Typical TinyML input.',48:'48 × 48: a person-shaped blob. Still usable for "person or not".',24:'24 × 24: a smudge you only read because you know the scene.',12:'12 × 12: is that a person or a coat?'};
  function pxShow(p,n){ p.querySelectorAll('.pximg img').forEach(function(i){ i.style.display= i.dataset.n==n?'':'none'; }); var s=p.closest('.slide').querySelector('.pxinfo'); if(s) s.textContent=PXT[n]; }
  deck.querySelectorAll('.px').forEach(function(p){ pxShow(p,384); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.shut button,.vcalc button,.px button'); if(!b) return; b.blur();
    b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel');
    var p=b.closest('.shut,.vcalc,.px');
    if(p.classList.contains('shut')) shutDraw(p); else if(p.classList.contains('vcalc')) vcalc(p); else pxShow(p,+b.dataset.n);
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
