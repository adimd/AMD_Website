<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 2 · Why Edge AI?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}


/* class 2 visuals */
table.dt.mx td{text-align:center;font-family:var(--sans);font-size:19px;padding:10px 20px}
table.dt.mx td:first-child{text-align:left;color:var(--ink)}
table.dt.mx th{text-align:center;font-size:15px;font-weight:700;color:var(--accent)}
.dot{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid var(--rule2);vertical-align:middle;font-family:var(--mono);font-size:14px;line-height:22px;color:var(--soft)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.q{border-style:dashed;border-color:var(--amber);color:var(--amber)}
.scorer .srow{display:grid;grid-template-columns:56px 1fr 260px;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--rule)}
.scorer .sl{font-family:var(--display);font-size:34px;font-weight:600;color:var(--accent);line-height:1}
.scorer .sq{font-size:20px;color:var(--ink)}
.scorer .sbtns{display:flex;gap:8px;justify-content:flex-end}
.scorer button{width:52px;height:40px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:17px;color:var(--ink);cursor:pointer}
.scorer button.wide{width:76px}
.scorer button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.scorer .meter{height:18px;border-radius:9px;background:var(--rule);margin-top:18px;overflow:hidden}
.scorer .mfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .35s ease}
.scorer .mlab{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.scorer .mverdict{font-family:var(--sans);font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 02</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 2 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 02 · unit I · why edge AI?</div>
    <h1>Why would anyone<br>bother?</h1>
    <p class="big" style="margin-top:26px;max-width:44ch">The cloud has unlimited memory, the biggest models and nobody worrying about batteries. So why squeeze AI onto a chip with 512 KB?</p>
  </div>
  <div class="cue">Start with the recall before this slide if you prefer: read two exit tickets from Class 1 aloud, one good and one almost-right, and fix the almost-right one together.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class</div>
    <h2>Last class was about <em>where</em>. Today is about <em>why</em>.</h2>
    <div class="rem" style="max-width:980px">
      <div class="h">edge AI</div>
      <ul><li>Running AI inference on, or near, the device that collects the data.</li></ul>
    </div>
    <div class="rem frag" style="max-width:980px">
      <div class="h">train vs infer</div>
      <ul><li>Train in the cloud, once. Infer at the edge, all the time.</li></ul>
    </div>
  </div>
  <div class="cue">Two minutes only. If someone still says "edge AI means no internet", correct it here: most products are hybrids.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="The question" data-act="the question">
  <div class="center">
    <h2 style="font-size:46px;max-width:30ch;margin:0 auto 6px">The BrickML could have streamed every vibration to the cloud. Why didn't it?</h2>
    <svg viewBox="0 0 1240 320" width="1240" height="320" style="display:block;margin:6px auto 0">
      <rect x="40" y="140" width="200" height="120" rx="14" fill="#e2e0d9"/>
      <rect x="30" y="260" width="220" height="16" rx="4" fill="#c6c3ba"/>
      <circle cx="262" cy="200" r="22" fill="#c6c3ba"/>
      <text x="140" y="208" font-size="15" fill="#8b9096" text-anchor="middle">MOTOR</text>
      <rect x="100" y="110" width="80" height="30" rx="6" fill="#23408f"/>
      <text x="140" y="98" font-size="13" fill="#23408f" text-anchor="middle" font-weight="700">BRICKML</text>
      <circle cx="1050" cy="150" r="60" fill="#eaeef7"/><circle cx="1130" cy="128" r="74" fill="#eaeef7"/><circle cx="1200" cy="160" r="46" fill="#eaeef7"/>
      <rect x="990" y="150" width="240" height="80" rx="40" fill="#eaeef7"/>
      <text x="1120" y="196" font-size="16" fill="#23408f" text-anchor="middle" font-weight="700">CLOUD</text>
      <g class="frag">
        <polyline fill="none" stroke="#a8231f" stroke-width="5" points="300,102 306,102 312,74 318,74 324,102 330,102 336,74 342,74 348,102 354,102 360,74 366,74 372,102 378,102 384,74 390,74 396,102 402,102 408,74 414,74 420,102 426,102 432,74 438,74 444,102 450,102 456,74 462,74 468,102 474,102 480,74 486,74 492,102 498,102 504,74 510,74 516,102 522,102 528,74 534,74 540,102 546,102 552,74 558,74 564,102 570,102 576,74 582,74 588,102 594,102 600,74 606,74 612,102 618,102 624,74 630,74 636,102 642,102 648,74 654,74 660,102 666,102 672,74 678,74 684,102 690,102 696,74 702,74 708,102 714,102 720,74 726,74 732,102 738,102 744,74 750,74 756,102 762,102 768,74 774,74 780,102 786,102 792,74 798,74 804,102 810,102 816,74 822,74 828,102 834,102 840,74 846,74 852,102 858,102 864,74 870,74 876,102 882,102 888,74 894,74 900,102"/>
        <path d="M900 88 L960 120" stroke="#a8231f" stroke-width="5"/><path d="M948 102 L976 128 L938 128 z" fill="#a8231f"/>
        <text x="600" y="48" font-size="15" fill="#a8231f" text-anchor="middle">OPTION A · STREAM EVERY VIBRATION, ALL DAY, EVERY DAY</text>
      </g>
      <g class="frag">
        <line x1="300" y1="262" x2="980" y2="226" stroke="#146b5c" stroke-width="2"/>
        <rect x="520" y="226" width="260" height="34" rx="17" fill="#e6f1ee" stroke="#146b5c"/>
        <text x="650" y="248" font-size="14" fill="#146b5c" text-anchor="middle">motor 7 · anomaly · 14:02</text>
        <text x="600" y="304" font-size="15" fill="#146b5c" text-anchor="middle">OPTION B · DECIDE ON THE BOX, SEND ONE LINE</text>
      </g>
    </svg>
    <p class="big frag" style="margin-top:6px">Which would you build? Give me reasons. As many as you can.</p>
  </div>
  <div class="cue">Ask, then stop talking. Write every answer on the board in a single column, unsorted. You sort them into five buckets on the next slide; most rooms find four of the five without help.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="BLERP" data-act="BLERP">
  <div>
    <div class="kicker">five reasons, one word</div>
    <div style="display:flex;gap:28px;align-items:flex-end;margin:10px 0 26px">
      <div class="frag" style="text-align:center"><div class="big-n" style="font-size:150px">B</div><div class="nlab">bandwidth</div></div>
      <div class="frag" style="text-align:center"><div class="big-n" style="font-size:150px">L</div><div class="nlab">latency</div></div>
      <div class="frag" style="text-align:center"><div class="big-n" style="font-size:150px">E</div><div class="nlab">economics</div></div>
      <div class="frag" style="text-align:center"><div class="big-n" style="font-size:150px">R</div><div class="nlab">reliability</div></div>
      <div class="frag" style="text-align:center"><div class="big-n" style="font-size:150px">P</div><div class="nlab">privacy</div></div>
    </div>
    <p class="frag" style="max-width:56ch">This framework comes from <em>AI at the Edge</em> by Situnayake and Plunkett, our main textbook. Every edge AI product you will ever see is justified by at least one of these letters.</p>
  </div>
  <div class="cue">Reveal one letter at a time and point at the board: which of their answers goes under this letter? By P, the board should be fully sorted. Anything left over is worth discussing.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="B · Bandwidth" data-act="BLERP">
  <div>
    <div class="kicker">B · bandwidth</div>
    <h2>Sensors produce more data than networks can carry cheaply.</h2>
    <p class="small" style="max-width:80ch">One 1080p camera streams roughly 4 to 8 megabits a second; take 5. The scale is logarithmic: every grid line to the right is <strong>1,000 times</strong> more data.</p>
    <svg viewBox="0 0 1432 440" width="1432" height="440" style="margin-top:8px">
      <line x1="320" y1="28" x2="320" y2="400" stroke="#e2e0d9" stroke-width="1.5"/><text x="320" y="424" font-size="13" fill="#8b9096" text-anchor="middle">10 B</text><line x1="480" y1="28" x2="480" y2="400" stroke="#e2e0d9" stroke-width="1.5"/><text x="480" y="424" font-size="13" fill="#8b9096" text-anchor="middle">1 KB</text><line x1="720" y1="28" x2="720" y2="400" stroke="#e2e0d9" stroke-width="1.5"/><text x="720" y="424" font-size="13" fill="#8b9096" text-anchor="middle">1 MB</text><line x1="960" y1="28" x2="960" y2="400" stroke="#e2e0d9" stroke-width="1.5"/><text x="960" y="424" font-size="13" fill="#8b9096" text-anchor="middle">1 GB</text><line x1="1200" y1="28" x2="1200" y2="400" stroke="#e2e0d9" stroke-width="1.5"/><text x="1200" y="424" font-size="13" fill="#8b9096" text-anchor="middle">1 TB</text>
      <g class="frag"><text x="300" y="66" font-size="16" fill="#15171b" text-anchor="end">one second of video</text>
      <rect x="320" y="40" width="384" height="38" rx="6" fill="#23408f" opacity="0.85"/>
      <text x="716" y="66" font-size="16" fill="#23408f" font-weight="700">625 KB</text></g><g class="frag"><text x="300" y="138" font-size="16" fill="#15171b" text-anchor="end">one hour</text>
      <rect x="320" y="112" width="668" height="38" rx="6" fill="#23408f" opacity="0.85"/>
      <text x="1000" y="138" font-size="16" fill="#23408f" font-weight="700">2.25 GB</text></g><g class="frag"><text x="300" y="210" font-size="16" fill="#15171b" text-anchor="end">one day</text>
      <rect x="320" y="184" width="779" height="38" rx="6" fill="#23408f" opacity="0.85"/>
      <text x="1111" y="210" font-size="16" fill="#23408f" font-weight="700">54 GB</text></g><g class="frag"><text x="300" y="282" font-size="16" fill="#15171b" text-anchor="end">1,000 cameras · one day</text>
      <rect x="320" y="256" width="1019" height="38" rx="6" fill="#a8231f" opacity="0.9"/>
      <text x="1351" y="282" font-size="16" fill="#a8231f" font-weight="700">54 TB</text></g><g class="frag"><text x="300" y="354" font-size="16" fill="#15171b" text-anchor="end">an edge alert instead</text>
      <rect x="320" y="328" width="56" height="38" rx="6" fill="#146b5c" opacity="0.9"/>
      <text x="388" y="354" font-size="16" fill="#146b5c" font-weight="700">~50 bytes</text></g>
    </svg>
  </div>
  <div class="cue">Do each sum on the board before its bar appears: 5 Mb = 625 KB; × 3,600 ≈ 2.25 GB; × 24 ≈ 54 GB; × 1,000 ≈ 54 TB. The green bar is the punchline: a person detected at the gate is one short line of text.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="L · Latency" data-act="BLERP">
  <div>
    <div class="kicker">L · latency</div>
    <h2>Some decisions cannot wait for a round trip.</h2>
    <div class="split" style="align-items:center">
      <div>
        <svg viewBox="0 0 680 300" width="680" height="300">
          <rect x="0" y="120" width="680" height="90" rx="8" fill="#e2e0d9"/>
          <line x1="0" y1="165" x2="680" y2="165" stroke="#faf9f6" stroke-width="4" stroke-dasharray="26 18"/>
          <rect x="20" y="138" width="80" height="54" rx="10" fill="#23408f"/>
          <text x="60" y="232" font-size="13" fill="#8b9096" text-anchor="middle">CAR · 100 KM/H</text>
          <g class="frag">
            <line x1="100" y1="100" x2="119" y2="100" stroke="#146b5c" stroke-width="3"/>
            <line x1="119" y1="90" x2="119" y2="110" stroke="#146b5c" stroke-width="3"/>
            <text x="132" y="105" font-size="14" fill="#146b5c">10 ms · 0.28 m</text>
          </g>
          <g class="frag">
            <line x1="100" y1="262" x2="290" y2="262" stroke="#b06a12" stroke-width="3"/>
            <line x1="290" y1="252" x2="290" y2="272" stroke="#b06a12" stroke-width="3"/>

<section class="slide" data-t="The price of the edge" data-act="edge vs cloud">
  <div>
    <h2>The edge is not free. You pay in three ways.</h2>
    <div class="ngrid" style="grid-template-columns:1fr 1fr 1fr;gap:30px;text-align:left;margin-top:10px">
      <div class="cellx frag"><div class="big-n red" style="font-size:44px">Small</div><div class="nlab" style="margin-bottom:10px">limited compute and memory</div><p style="font-size:20px">The model must be shrunk to fit, and shrinking can cost accuracy. Unit IV is about doing that well.</p></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:44px">Scattered</div><div class="nlab" style="margin-bottom:10px">updates are hard</div><p style="font-size:20px">A better model means updating thousands of devices in the field, some of them offline.</p></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:44px">Varied</div><div class="nlab" style="margin-bottom:10px">every chip is different</div><p style="font-size:20px">A model tuned for one board may need rework for the next. The cloud runs on a few standard machines.</p></div>
    </div>
  </div>
  <div class="cue">This slide keeps the course honest. Students should leave seeing edge AI as a trade-off, not a slogan.</div>
</section>

<section class="slide" data-t="When the cloud wins" data-act="edge vs cloud">
  <div>

    <div class="stack" style="max-width:1150px">
      <div class="rem frag"><div class="h">the model is huge</div><ul><li>A large language model answering open questions will not fit on a microcontroller.</li></ul></div>
      <div class="rem frag"><div class="h">it needs everyone's data at once</div><ul><li>Fraud detection compares one card's transaction with millions of others.</li></ul></div>
      <div class="rem frag"><div class="h">the model changes daily</div><ul><li>Recommendations retrained every night are easy to redeploy on one server.</li></ul></div>
      <div class="rem frag"><div class="h">none of the letters is strong</div><ul><li>Low volume, no rush, nothing private, good network: there is nothing to gain.</li></ul></div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  function score(sc){
    var t=0; sc.querySelectorAll('.srow:not(.fitrow) button.sel').forEach(function(b){ t+=+b.dataset.v; });
    var fitb=sc.querySelector('.fitrow button.sel'), fit=!fitb||fitb.dataset.fit==='1';
    var v;
    if(t<=3) v='Cloud: nothing to gain at the edge';
    else if(!fit) v='Wants the edge, but will not fit: shrink it or split it';
    else if(t<=8) v='Hybrid: split it between device and cloud';
    else v='Edge: put the AI on the device';
    sc.querySelector('.mfill').style.width=(t/15*100)+'%';
    sc.querySelector('.mverdict').textContent=v;
  }
  deck.querySelectorAll('.scorer').forEach(score);
  document.addEventListener('click',function(e){
    var b=e.target.closest('.scorer button'); if(!b) return;
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.remove('sel'); });
    b.classList.add('sel'); b.blur(); score(b.closest('.scorer'));
  });

  paint();
})();
</script>
</body>
