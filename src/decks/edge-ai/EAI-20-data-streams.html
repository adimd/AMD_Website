<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 20 · Working with Data Streams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 20 */
pre{font-size:15px;line-height:1.38}
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.smp .cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.wstats,.smstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.wstats div,.smstats div{border-top:1px solid var(--rule);padding-top:6px;font-size:16px;color:var(--soft)}
.wstats b,.smstats b{display:block;font-family:var(--mono);font-size:24px;color:var(--ink)}
.ringp{padding:16px 22px}
.sbtns{display:flex;gap:10px}
.sbtns button{height:44px;padding:0 22px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:16px;color:var(--ink);cursor:pointer}
.sbtns button[data-g="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ringinfo{font-size:20px;margin-top:14px;min-height:60px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 20</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 20 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 20 · unit III · working with data streams</div>
    <h1>The data never stops.<br>Neither can you.</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">In Colab you get the whole file, as long as you like. On the device, numbers arrive 16,000 a second, forever. Today: windows, buffers, deadlines and smoothing, the plumbing every edge model sits inside.</p>
  </div>
  <div class="cue">Theory runs to slide 13; the lab is one block at the end (slides 14 to 17). Same wiring as Class 19 (INMP441 on 15, 16, 17). Teams can start from their Class 19 sketch.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>Two features that tell a clap from speech.</h2>
    <div class="ucards" style="grid-template-columns:repeat(3,1fr)">
      <div class="ucard frag"><div class="un">peak / crest factor</div><div class="ut">a clap is a spike</div><div class="ud">Very high peak compared with its RMS; speech is smoother.</div></div>
      <div class="ucard frag"><div class="un">duration</div><div class="ut">a clap is short</div><div class="ud">A few frames, against dozens for a word.</div></div>
      <div class="ucard frag"><div class="un">loudness over time</div><div class="ut">speech rises and falls</div><div class="ud">Syllables make a rhythm; a clap is one burst then silence.</div></div>
    </div>
    <p class="frag" style="margin-top:20px;max-width:72ch">The last two need more than one frame: they look across <strong>time</strong>. That is today's subject.</p>
  </div>
  <div class="cue">If anyone answered "zero-crossing rate", ask them to check the scatter slide from Class 19: claps and hiss overlap there.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Falling behind" data-act="the hook">
  <div>
    <div class="kicker">try it live · a new 20 ms frame arrives every 20 ms</div>
    <h2>Your code takes a little longer than 20 ms per frame. What happens?</h2>
    <div class="panel calc blog">
      <div class="crow" style="grid-template-columns:260px 1fr 120px;gap:16px"><span class="cl">processing time per frame</span><input type="range" class="bt" min="5" max="40" step="1" value="15"><span class="num btv"></span></div>
      <svg viewBox="0 0 1300 260" width="100%" class="bsvg"></svg>
      <div class="cverdict"></div>
    </div>
  </div>
  <div class="cue">Simulation over 2 seconds, with a hardware buffer of 6 frames (the size is illustrative; the I2S driver's DMA buffers play this role). Drag from 15 to 21 ms. Nothing breaks for a while, the queue fills silently, then every frame you are late is audio thrown away: words lose syllables and the model sees nonsense. On a stream, average speed is not enough; you must keep up every frame.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="File or stream?" data-act="streams">
  <div>
    <h2>Training on a file and running on a stream are different jobs.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:24%"></th><th style="width:38%">a dataset in Colab</th><th>a live stream on the board</th></tr>
      <tr class="frag"><td>what you can see</td><td>the whole recording, before and after</td><td>only the past, never the future</td></tr>
      <tr class="frag"><td>time</td><td>as long as it takes</td><td>a deadline every frame</td></tr>
      <tr class="frag"><td>memory</td><td>load the whole file</td><td>keep a window, forget the rest</td></tr>
      <tr class="frag"><td>what is in it</td><td>neatly cut clips, balanced classes</td><td>99% "nothing happening", gaps, glitches</td></tr>
      <tr class="frag"><td>a mistake</td><td>one wrong row in a table</td><td>an LED that flickers, a door that opens</td></tr>
    </table>
  </div>
  <div class="cue">The last row matters for evaluation: on a stream we count false alarms per hour, not just accuracy per clip (slide 12).</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Windows and hops" data-act="windows">
  <div>
    <div class="kicker">try it live · an accelerometer with two gestures</div>
    <h2>Cut the stream into windows. Two numbers decide everything: length and hop.</h2>
    <div class="panel calc wexp">
      <div class="crow" style="grid-template-columns:200px 1fr 110px;gap:16px"><span class="cl">window length</span><input type="range" class="wl" min="1" max="20" step="1" value="10"><span class="num wlv"></span></div>
      <div class="crow" style="grid-template-columns:200px 1fr 110px;gap:16px"><span class="cl">hop</span><input type="range" class="wh" min="1" max="20" step="1" value="5"><span class="num whv"></span></div>
      <svg viewBox="0 0 1300 280" width="100%" class="wsvg"></svg>
      <div class="wstats"></div>
    </div>
  </div>
  <div class="cue">Hop (also called stride) is how far the window moves each time. Hop smaller than the window means overlap: each sample is looked at more than once, which costs compute but means an event is less likely to be cut in half. Try window 0.4 s: the first gesture (0.6 s long) never fits in one window.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Choosing the window" data-act="windows">
  <div>
    <h2>How long should the window be?</h2>
    <div class="split" style="gap:24px">
      <div class="rem frag"><div class="h">too short</div><ul><li>The event does not fit: half a gesture, half a word.</li><li>Features are noisy: too few samples to average.</li></ul></div>
      <div class="rem frag"><div class="h">too long</div><ul><li>Slower answers and more memory.</li><li>Two events end up in one window and blur together.</li></ul></div>
    </div>
    <table class="dt txt frag" style="width:100%;margin-top:18px">
      <tr><th style="width:30%">rule of thumb</th><th>window ≥ the longest event you must recognise; hop sets how quickly you react, and how much compute you spend</th></tr>
      <tr><td>keyword spotting</td><td>1 s window (one word), hop 20–100 ms</td></tr>
      <tr><td>gesture, fall</td><td>1–2 s window, hop 0.1–0.5 s</td></tr>
      <tr><td>machine vibration</td><td>0.5–1 s window, hop of a few seconds is fine: bearings fail slowly</td></tr>
    </table>
  </div>
  <div class="cue">Typical values, not rules. Ask: for the beehive monitor from Class 18, how long a window and how long a hop? (Minutes; the colony changes over hours.)</div>
</section>

<!-- 07 -->
<section class="slide" data-t="The ring buffer" data-act="buffers">
  <div>
    <div class="kicker">try it live · 8 slots, new samples forever</div>
    <h2>A ring buffer keeps the last N samples without ever moving one.</h2>
    <div class="panel ringp split" style="grid-template-columns:.9fr 1.1fr;gap:26px;align-items:center">
      <svg viewBox="0 0 440 400" width="100%" class="ringsvg"></svg>
      <div>
        <div class="sbtns"><button data-g="step">new sample</button><button data-g="run">run</button><button data-g="reset">reset</button></div>
        <div class="ringinfo"></div>
        <pre style="margin-top:14px;font-size:16px"><span class="k">buf</span>[head] = sample;
head = (head + <span class="s">1</span>) % N;   <span class="c">// wrap around</span></pre>
      </div>
    </div>
  </div>
  <div class="cue">Class 6 introduced the ring buffer; here it is the heart of every stream. Old samples are overwritten rather than shifted, so adding one costs the same whether N is 8 or 16,000. The window is always "the N slots ending just before head". DSP chips (Class 15) do the wrap-around in hardware.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Double buffering" data-act="buffers">
  <div>
    <h2>While you compute on one buffer, the hardware fills the other.</h2>
    <svg viewBox="0 0 980 240" width="1000" height="245"><defs><marker id="db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><rect x="0" y="80" width="180" height="90" rx="10" fill="#fff" stroke="#c6c3ba"/><text x="90" y="131" font-size="17" text-anchor="middle" font-weight="700">microphone</text><line x1="184" y1="125" x2="296" y2="125" stroke="#8b9096" stroke-width="2" marker-end="url(#db)"/><text x="240" y="112" font-size="13" text-anchor="middle" fill="#4b5057">I2S + DMA</text><rect x="300" y="30" width="300" height="80" rx="10" fill="#e6f1ee" stroke="#146b5c" stroke-width="2"/><text x="450" y="66" font-size="17" text-anchor="middle" font-weight="700" fill="#146b5c">buffer A · filling</text><text x="450" y="90" font-size="13" text-anchor="middle" fill="#4b5057">hardware writes, CPU not involved</text><rect x="300" y="140" width="300" height="80" rx="10" fill="#eaeef7" stroke="#23408f" stroke-width="2"/><text x="450" y="176" font-size="17" text-anchor="middle" font-weight="700" fill="#23408f">buffer B · full</text><text x="450" y="200" font-size="13" text-anchor="middle" fill="#4b5057">CPU computes features + model</text><line x1="604" y1="180" x2="736" y2="180" stroke="#8b9096" stroke-width="2" marker-end="url(#db)"/><rect x="740" y="140" width="220" height="80" rx="10" fill="#fff" stroke="#23408f" stroke-width="2"/><text x="850" y="186" font-size="17" text-anchor="middle" font-weight="700">decision</text><g class="frag"><path d="M 610 70 C 680 70, 680 120, 640 125" fill="none" stroke="#b06a12" stroke-width="2.5" stroke-dasharray="6 5"/><text x="700" y="96" font-size="15" fill="#b06a12" font-weight="700">every 20 ms: swap</text></g></svg>
    <p class="frag" style="max-width:76ch">DMA (direct memory access) moves samples into memory without the CPU. The deal: you get exactly one frame-time to finish with buffer B before it is needed again. That is the deadline from the hook.</p>
  </div>
  <div class="cue">In the Arduino sketch, i2s.readBytes() hides this: it waits until a DMA buffer is full and copies it out. If your loop is slow, the driver's buffers fill and the oldest audio is lost, exactly as the hook showed.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Smoothing decisions" data-act="decisions">
  <div>
    <div class="kicker">try it live · a voice detector's raw output, frame by frame</div>
    <h2>Raw decisions flicker. Smooth them, but every fix adds delay.</h2>
    <div class="panel calc smp">
      <div class="crow" style="grid-template-columns:200px 1fr"><span class="cl">method</span><span class="cb" data-g="m"><button data-v="0" class="sel">none</button><button data-v="1">moving average</button><button data-v="2">majority vote</button><button data-v="3">hold-on (hangover)</button></span></div>
      <div class="crow" style="grid-template-columns:200px 1fr 110px;gap:16px"><span class="cl">frames</span><input type="range" class="smn" min="1" max="15" step="1" value="5"><span class="num smnv"></span></div>
      <svg viewBox="0 0 1300 250" width="100%" class="smsvg"></svg>
      <div class="smstats"></div>
    </div>
  </div>
  <div class="cue">Simulated frame probabilities with two real speech segments. Moving average: average the last N probabilities. Majority vote: speech if most of the last N frames said speech. Hold-on: once speech is seen, keep saying speech for N more frames (bridges the gaps between syllables). The lab builds a vote plus a hold-on and counts the flicker.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Where the delay comes from" data-act="decisions">
  <div>
    <div class="kicker">try it live · from the moment a word ends to the LED</div>
    <h2>Latency on a stream is a sum. Add it up before you promise it.</h2>
    <div class="panel calc lat">
      <div class="crow" style="grid-template-columns:240px 1fr 110px;gap:16px"><span class="cl">hop</span><input type="range" class="lh" min="10" max="500" step="10" value="100"><span class="num lhv"></span></div>
      <div class="crow" style="grid-template-columns:240px 1fr 110px;gap:16px"><span class="cl">features + model, per hop</span><input type="range" class="lm" min="1" max="200" step="1" value="30"><span class="num lmv"></span></div>
      <div class="crow" style="grid-template-columns:240px 1fr 110px;gap:16px"><span class="cl">smoothing, hops</span><input type="range" class="ls" min="0" max="10" step="1" value="2"><span class="num lsv"></span></div>
      <svg viewBox="0 0 1300 110" width="100%" class="lsvg"></svg>
      <div class="cverdict"></div>
    </div>
  </div>
  <div class="cue">Worst case: the word ends just after a window was taken, so you wait up to one hop for the next; then compute; then the smoothing needs extra hops to agree. If compute per hop exceeds the hop, the system falls behind (the hook). Real numbers depend on your model; these are for reasoning.</div>
</section>

<section class="slide" data-t="What streams do to you" data-act="streams">

  </div>

    [['truth',SMT,'#8b9096',30],['raw',raw,'#b06a12',100],['smoothed',out,'#146b5c',170]].forEach(function(r){ o+='<text x="0" y="'+(r[3]+22)+'" font-size="15" fill="'+r[2]+'" font-weight="700">'+r[0]+'</text>'; r[1].forEach(function(b,k){ if(b) o+='<rect x="'+X(k)+'" y="'+r[3]+'" width="7.4" height="34" fill="'+r[2]+'" opacity=".85"/>'; }); o+='<line x1="120" y1="'+(r[3]+34)+'" x2="1272" y2="'+(r[3]+34)+'" stroke="#e2e0d9"/>'; });
    var dp=''; SMP.forEach(function(v,k){ dp+=(k?'L':'M')+(X(k)+3.6).toFixed(1)+' '+(95-v*20).toFixed(1); });
    o+='<text x="120" y="236" font-size="13" fill="#8b9096">160 frames · 3.2 s</text>';
    p.querySelector('.smsvg').innerHTML=o;
    function flips(a){ var f=0; for(var k=1;k<a.length;k++) if(a[k]!==a[k-1]) f++; return f; }
    var wrong=0; out.forEach(function(b,k){ if(b!==SMT[k]) wrong++; });
    function onset(st){ for(var k=st;k<st+40;k++) if(out[k]) return k-st; return 40; }
    function offset(en){ for(var k=en;k<en+40&&k<out.length;k++) if(!out[k]) return k-en; return 40; }
    var on=(onset(30)+onset(105))/2, off=(offset(75)+offset(135))/2;
    p.querySelector('.smstats').innerHTML='<div>decision changes · truth has 4<b style="color:'+(flips(out)>6?'var(--fail)':'var(--ok)')+'">'+flips(out)+'</b></div><div>frames wrong<b>'+wrong+' / 160</b></div><div>late switching on<b>'+(on*20).toFixed(0)+' ms</b></div><div>late switching off<b>'+(off*20).toFixed(0)+' ms</b></div>';
  }
  deck.querySelectorAll('.smp').forEach(function(p){ smDraw(p); p.querySelector('.smn').addEventListener('input',function(){smDraw(p);}); });
  /* latency */
  function latDraw(p){
    var h=+p.querySelector('.lh').value, m=+p.querySelector('.lm').value, sm=+p.querySelector('.ls').value;
    p.querySelector('.lhv').textContent=h+' ms'; p.querySelector('.lmv').textContent=m+' ms'; p.querySelector('.lsv').textContent=sm;
    var parts=[['wait',h,'#8b9096'],['compute',m,'#23408f'],['smoothing',sm*h,'#b06a12']], tot=h+m+sm*h, sc=1050/Math.max(400,tot), x=60, o='';
    parts.forEach(function(q){ var w=q[1]*sc; if(w>0){ o+='<rect x="'+x+'" y="10" width="'+Math.max(w-2,1)+'" height="54" rx="5" fill="'+q[2]+'" opacity=".85"/>'; if(w>90) o+='<text x="'+(x+w/2)+'" y="43" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">'+q[0]+' · '+q[1]+' ms</text>'; } x+=w; });
    o+='<text x="'+(x+10)+'" y="43" font-size="18" font-weight="700" fill="#15171b">'+tot+' ms</text><text x="60" y="96" font-size="13" fill="#8b9096">worst case, from the event ending to the decision · grey: waiting for the next hop · blue: features + model · amber: smoothing</text>';
    p.querySelector('.lsvg').innerHTML=o;
    var v=p.querySelector('.cverdict');
    if(m>h){ v.style.color='var(--fail)'; v.textContent='Compute ('+m+' ms) is longer than the hop ('+h+' ms): the system falls behind, as in the hook. Raise the hop or shrink the model.'; }
    else { v.style.color= tot<=300?'var(--ok)':'var(--amber)'; v.textContent='Core busy '+Math.round(m/h*100)+'% · worst-case answer '+tot+' ms after the event'+(tot<=300?': feels instant.':': noticeable to a person.'); }
  }
  deck.querySelectorAll('.lat').forEach(function(p){ latDraw(p); p.querySelectorAll('input').forEach(function(x){ x.addEventListener('input',function(){latDraw(p);}); }); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.ringp .sbtns button'); if(b){ b.blur(); var p=b.closest('.ringp');
      if(ringT){ clearInterval(ringT); ringT=null; }
      if(b.dataset.g==='reset'){ p.dataset.n=0; ringDraw(p); }
      else if(b.dataset.g==='step'){ p.dataset.n=+(p.dataset.n||0)+1; ringDraw(p); }
      else { ringT=setInterval(function(){ p.dataset.n=+(p.dataset.n||0)+1; ringDraw(p); if(+p.dataset.n>=24){ clearInterval(ringT); ringT=null; } },500); }
      return; }
    b=e.target.closest('.smp .cb button'); if(b){ b.blur(); b.parentNode.querySelectorAll('button').forEach(function(q){q.classList.remove('sel');}); b.classList.add('sel'); smDraw(b.closest('.smp')); return; }
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
