<!--
  Edge AI · Session 1 · Who does the thinking?
  Run sheet: cold open 20 · two programs 35 · trace one request 30 · the cloud and the crack 25 · close 10

  Bring: the two NASA clips, the RMG transcript on a second screen, a Nano 33 BLE in your pocket, paper.
  Reserve one corner of the board under the heading DEBTS.

  Optional in-deck audio: drop trimmed clips next to this file as
    media/clip-1-alarm.mp3     (slide 3, ends the instant Armstrong asks for a reading)
    media/clip-2-go.mp3        (slide 5, the five seconds)
    media/clip-3-delta-h.mp3   (slide 8)
  If a file is there, "p" plays and pauses it. If it is not, the slide stays silent and shows nothing.

  What must be true when they walk out:
    They can say "max versus sum" and draw why.
    They can redo the 23-minute calculation with new numbers.
    They can produce 1.5 Gbps unaided.
    They believe the cloud is a sensible default and that 99.3% is a real problem.
    Two questions and one unexplained word are nagging at them.
-->
<style>
:root{
  --letterbox:#e6e4de;
  --stage:#faf9f6;
  --card:#ffffff;
  --ink:#15171b;
  --body:#4b5057;
  --soft:#8b9096;
  --rule:#e2e0d9;
  --rule2:#c6c3ba;
  --accent:#23408f;
  --accent-soft:#eaeef7;
  --fail:#a8231f;
  --fail-soft:#fbeeed;
  --mark:#ffdf8a;
  --night:#0c0e11;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

/* ---------- the stage: fixed 1600x900, scaled to fit ---------- */
#stage{
  position:absolute;top:50%;left:50%;
  width:1600px;height:900px;
  transform-origin:50% 50%;
  background:var(--stage);
  box-shadow:0 24px 70px rgba(20,22,28,.16);
  overflow:hidden;
}
.slide{position:absolute;inset:0;padding:74px 96px 108px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- chrome (inside stage, so it scales) ---------- */
.eyebrow{position:absolute;top:34px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:34px;right:96px;font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:96px;right:96px;bottom:38px;display:flex;gap:3px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:62px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:62px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

/* ---------- type ---------- */
.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.kicker.grey{color:var(--soft)}
.kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:104px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:66px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:30px}
h3{font-weight:700;font-size:24px;color:var(--ink);margin-bottom:8px;line-height:1.25}
p{font-size:30px;line-height:1.48;max-width:30ch}
p+p{margin-top:18px}
.big{font-size:40px;line-height:1.3;color:var(--ink);font-weight:300;max-width:24ch}
.small{font-size:22px;line-height:1.5;color:var(--soft);max-width:56ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.86em;color:var(--accent);background:var(--accent-soft);padding:.06em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.split.top{align-items:start}
.stack>*+*{margin-top:20px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

/* ---------- in the cockpit: the dark slides ---------- */
.slide.dark{background:var(--night)}
.slide.dark h1,.slide.dark h2,.slide.dark .big{color:#f3f1ea}
.slide.dark .kicker{color:#7f8896}
.slide.dark p{color:#aeb4bc}
.stamp{font-family:var(--mono);font-size:64px;font-weight:400;letter-spacing:.06em;color:#f3f1ea}
.quote{font-family:var(--display);font-weight:500;font-size:96px;line-height:1.08;letter-spacing:-.02em;color:#f3f1ea;max-width:16ch}
.who{font-family:var(--mono);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#7f8896;margin-top:38px}
.clip{position:absolute;left:0;right:0;bottom:100px;text-align:center;font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#5d646d;display:none}
.clip.ready{display:block}
.clip.playing{color:#9fe8b8}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 32px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:18px}
.panel h3{font-family:var(--display);font-weight:600;font-size:44px;letter-spacing:-.015em;margin-bottom:6px}
.panel .tag{font-family:var(--mono);font-size:20px;color:var(--accent);margin-bottom:18px}
.panel p{font-size:25px;line-height:1.45;max-width:none}
.panel p.out{font-size:21px;color:var(--soft);margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:12px 4px;border-bottom:1px solid var(--rule);font-size:23px}
.readout td:first-child{color:var(--soft);font-size:14px;letter-spacing:.12em;text-transform:uppercase;width:10rem}
.readout td:last-child{color:var(--ink);text-align:right;font-weight:700}
.readout tr:last-child td{border-bottom:none}

/* ---------- code ---------- */
pre{background:#14181f;border-radius:12px;padding:34px 40px;font-family:var(--mono);font-size:44px;line-height:1.9;color:#d9dee6;box-shadow:0 14px 34px rgba(20,22,28,.22);overflow:hidden}
pre .f{color:#84d8ea}
pre .dim{color:#7f8896}

/* ---------- flow chips (the default design, the eleven hops) ---------- */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:14px 0}
.flow span{font-family:var(--mono);font-size:25px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:8px;padding:12px 18px;white-space:nowrap}
.flow span.net{background:transparent;border-style:dashed;color:var(--soft)}
.flow span.cloud{background:var(--accent);border-color:var(--accent);color:#fff}
.flow b{display:flex;align-items:center;font-weight:400}
.flow i{font-style:normal;font-family:var(--mono);font-size:25px;color:var(--rule2);padding:0 12px}
.flow.xl span{font-size:34px;padding:18px 26px}
.flow.xl i{font-size:34px;padding:0 18px}
.hops{display:flex;align-items:baseline;gap:18px;margin-top:40px}
.hops .n{font-family:var(--display);font-weight:600;font-size:120px;line-height:1;color:var(--accent);min-width:1.3ch}
.hops .k{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}

/* ---------- worked lines ---------- */
.calc{width:100%;border-collapse:collapse;border-top:1px solid var(--rule)}
.calc td{padding:15px 6px;border-bottom:1px solid var(--rule);font-size:28px;color:var(--body);vertical-align:baseline}
.calc td.r{text-align:right;font-family:var(--mono);font-weight:700;color:var(--ink);white-space:nowrap}
.calc td .num{font-weight:400}

/* ---------- the ledger ---------- */
.ledger{width:100%;border-collapse:collapse}
.ledger th{font-family:var(--mono);font-size:13px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-align:left;padding:0 18px 12px 0;border-bottom:2px solid var(--rule2)}
.ledger td{font-size:20px;line-height:1.35;padding:13px 18px 13px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--body)}
.ledger td:first-child{font-weight:700;color:var(--ink);width:17%}
.ledger tr.total td{border-bottom:none;border-top:2px solid var(--ink);color:var(--ink);font-weight:600}
.ledger tr.total td:first-child{font-family:var(--mono);font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding-top:17px}

/* ---------- five defences ---------- */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--rule2)}
.grid5 div{padding:26px 22px 0 0}
.grid5 b{display:block;font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink)}
.grid5 small{display:block;font-size:20px;line-height:1.4;color:var(--soft);margin-top:12px}

/* ---------- debts: the corner of the board ---------- */
.debts{border-left:4px solid var(--fail);padding:6px 0 6px 34px}
.debts .lab{font-family:var(--mono);font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--fail);display:block;margin-bottom:20px}
.debts p{font-family:var(--display);font-weight:500;font-size:44px;line-height:1.2;letter-spacing:-.015em;color:var(--ink);max-width:30ch}
.debts p+p{margin-top:26px}
.debts p.one{font-size:54px;max-width:22ch}

ol.tasks{list-style:none;counter-reset:t}
ol.tasks li{counter-increment:t;position:relative;padding:17px 0 17px 62px;border-bottom:1px solid var(--rule);font-size:27px;line-height:1.4;color:var(--ink);max-width:none}
ol.tasks li:last-child{border-bottom:none}
ol.tasks li::before{content:counter(t);position:absolute;left:0;top:17px;font-family:var(--mono);font-size:20px;color:var(--accent)}

/* ---------- svg figures ---------- */
figure{width:100%}
figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:14px}
svg text{font-family:'JetBrains Mono',monospace}

/* ---------- fragments / notes ---------- */
.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.fragsvg{opacity:0;transition:opacity .3s ease}
.cue{
  position:absolute;left:96px;right:96px;bottom:92px;display:none;
  padding:14px 18px;border-left:4px solid var(--fail);background:var(--fail-soft);
  color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6;
}
body.cues .cue{display:block}

/* ---------- jump ---------- */
#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:70px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:22px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:80px}
#jump li{padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:19px;color:var(--body);display:flex;gap:20px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.76em;color:var(--soft);width:40px;padding-top:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag,.fragsvg{transition:none}}
</style>
</head>

<section class="slide dark" data-t="The moment" data-act="0 · cold open">

  <div class="cue">Start a minute before the alarm so they hear routine first. Stop the instant Armstrong asks Houston for a reading on the alarm. Do not play the reply.</div>
</section>

<!-- 04 -->
<section class="slide dark" data-t="Go, or abort?" data-act="0 · cold open">
  <div class="center">
    <div class="kicker">write it down · one word</div>
    <h1 style="font-size:150px">Go, or abort?</h1>
  </div>
  <div class="cue">Give only the facts. Neither astronaut knows what the code means. The fuel is finite and the ground is rising. One word on paper, then hands. Ask two from each side why. Most abort voters will say "unknown error, so stop", which is how we all treat an exception in code.</div>
</section>

<!-- 05 -->
<section class="slide dark" data-t="The answer" data-act="0 · cold open">
  <audio data-clip preload="metadata" src="media/clip-2-go.mp3"></audio>
  <div>
    <div class="quote">&ldquo;We&rsquo;re go on that alarm.&rdquo;</div>
    <div class="who">Houston</div>
  </div>
  <div class="clip">p · play clip</div>
  <div class="cue">Play the five seconds, then ask what Houston knew that the cockpit didn't. The computer was designed so mission-critical programmes kept priority even when overloaded. Jack Garman in Mission Control recognised the mission could continue provided the alarms did not come in rapid succession. Four 1202s and one 1201 in total.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Guess · working memory" data-act="0 · cold open">
  <div>
    <div class="kicker">write your guess down</div>
    <h2 style="font-size:84px;max-width:17ch">How much working memory did that computer have?</h2>
    <p class="small" style="margin-top:10px">A number, with units.</p>
  </div>
  <div class="cue">They must commit a number with units. Most will say megabytes.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="The reveal" data-act="0 · cold open">
  <div>
    <div class="kicker red">the reveal</div>
    <div class="split top" style="gap:40px">
      <div class="panel">
        <span class="lab">Apollo Guidance Computer · 1969</span>
        <table class="readout">
          <tr><td>erasable</td><td>about 4 KB</td></tr>
          <tr><td>fixed</td><td>about 72 KB, woven by hand</td></tr>
          <tr><td>power</td><td>55 W</td></tr>
          <tr><td>mass</td><td>32 kg</td></tr>
        </table>
      </div>
      <div class="panel frag">
        <span class="lab">Arduino Nano 33 BLE · in my pocket</span>
        <table class="readout">
          <tr><td>SRAM</td><td>256 KB</td></tr>
          <tr><td>flash</td><td>1 MB</td></tr>
          <tr><td>power</td><td>milliwatts</td></tr>
          <tr><td>mass</td><td>5 g</td></tr>
        </table>
      </div>
    </div>
    <figure class="frag" style="margin-top:34px">
      <svg viewBox="0 0 1408 78" width="100%" role="img" aria-label="Working memory to scale: 4 KB beside 256 KB">
        <rect x="0" y="0" width="22" height="26" fill="#a8231f" rx="2"/>
        <text x="34" y="19" font-size="16" fill="#a8231f">EAGLE · 4 KB</text>
        <rect x="0" y="42" width="1408" height="26" fill="#23408f" rx="2"/>
        <text x="14" y="61" font-size="16" fill="#ffffff">NANO 33 BLE · 256 KB</text>
      </svg>
      <figcaption>working memory, drawn to scale</figcaption>
    </figure>
  </div>
  <div class="cue">Take the board out of your pocket. They will program it in week 4. It has about 60 times the memory of the machine that landed on the Moon. 1202 meant the computer had run out of room. It kept flying by dropping the jobs that mattered least.</div>
</section>

<!-- 08 -->
<section class="slide dark" data-t="Play, second pass" data-act="0 · cold open">
  <audio data-clip preload="metadata" src="media/clip-3-delta-h.mp3"></audio>
  <div>
    <div class="quote" style="font-size:88px;max-width:18ch">&ldquo;We&rsquo;ll monitor your Delta-H.&rdquo;</div>
    <div class="who">Houston &nbsp;·&nbsp; 20:11 GMT</div>
  </div>
  <div class="clip">p · play clip</div>
  <div class="cue">Aldrin notices, mid-descent, that the alarm seems to fire when he requests a particular display. Mission Control watches that number itself and reads it back, rather than load the computer further. An overloaded device handed one job to a bigger machine 384,000 km away and kept the jobs that could not wait. Write PARTITION on the board. Do not explain it yet.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="First debt" data-act="0 · cold open">
  <div class="debts">
    <span class="lab">debts · one</span>
    <p>Houston had five mainframes.<br>Eagle had 4 KB.</p>
    <p class="one frag">Why didn&rsquo;t Houston fly the landing?</p>
  </div>
  <div class="cue">Take answers and confirm none. Write the question in the DEBTS corner.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Second debt" data-act="0 · cold open">
  <div class="debts">
    <span class="lab">debts · two</span>
    <p class="one">How does 4 KB land on the Moon at all?</p>
  </div>
  <div class="cue">Into the corner. That one takes three sessions to pay.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="The anchor" data-act="0 · cold open">
  <div>
    <p class="big" style="font-size:62px;line-height:1.2;max-width:24ch;font-weight:400;font-family:var(--display);letter-spacing:-.015em">A model does not live anywhere.</p>
    <p class="big frag" style="font-size:44px;max-width:32ch;margin-top:40px">Somebody decides where it runs, and that decision is <span class="mark">paid for every second the product is alive.</span></p>
  </div>
  <div class="cue">Read it twice, slowly. This course is about making that decision well.</div>
</section>

<!-- ============ MOVEMENT 1 · A MODEL IS TWO PROGRAMS ============ -->

<!-- 12 -->
<section class="slide" data-t="What you call a model" data-act="1 · a model is two programs">
  <div>
    <div class="kicker grey">what you have been calling &ldquo;a model&rdquo;</div>
<pre>model.<span class="f">fit</span>(X, y)
<span class="frag">model.<span class="f">predict</span>(x)</span></pre>
  </div>
  <div class="cue">You have typed these two lines next to each other for two years on one laptop. In industry they run on different machines, in different cities, maintained by different teams, across different years of a product's life.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="Two programs" data-act="1 · a model is two programs">
  <div>
    <h2>Two programs.</h2>
    <div class="split top" style="gap:40px">
      <div class="panel">
        <h3>Training</h3>
        <div class="tag">a search</div>
        <p>Show examples, measure error, nudge every weight, repeat millions of times.</p>
        <p class="out">Output: a file of numbers.</p>
      </div>
      <div class="panel frag">
        <h3>Inference</h3>
        <div class="tag">arithmetic</div>
        <p>Multiply, add, clamp, layer after layer, once per input.</p>
        <p class="out">Nothing is searched or changed.</p>
      </div>
    </div>
  </div>
  <div class="cue">They share a file, and that is all they share.</div>
</section>

<!-- 14 -->
<section class="slide" data-t="Board · max versus sum" data-act="1 · a model is two programs">
  <div class="center">
    <div class="kicker grey">fifteen minutes · no slide</div>
    <h1 style="font-size:96px">To the board.</h1>
    <p class="big" style="margin-top:40px;color:var(--soft);max-width:34ch">Five layers. One 96 × 96 RGB image. Count every value.</p>
  </div>
  <div class="cue">Values: input 27,648 · L1 147,456 · L2 73,728 · L3 36,864 · L4 18,432 · L5 9,216. Forward only: to compute layer 3 you need layer 2's output and room for layer 3's own. Peak is the largest adjacent pair, 147,456 + 73,728 = 221,184 values, 216 KB at one byte. Does it fit in my pocket? Barely. Now train it: nothing can be discarded until the backward pass returns. Sum the column, 313,344 values × 4 bytes = 1.2 MB per image, × 32 = 40 MB. Write large: 216 KB against 40 MB. Same network. About 180 times.</div>
</section>

<!-- 15 -->
<section class="slide" data-t="Asymmetry one · memory" data-act="1 · a model is two programs">
  <div>
    <div class="kicker">asymmetry one · memory</div>
    <h2 style="margin-bottom:18px"><span class="mark">Max</span> versus <span class="mark">sum</span>.</h2>
    <div class="split top" style="gap:48px">

  var N = slides.length, i = 0, f = 0;

  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li = document.createElement('li');
    li.innerHTML = '<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick = function(){ go(k); document.getElementById('jump').classList.remove('open'); };

  });
  var ticks = rail.children, count = document.getElementById('count'),

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag, .fragsvg')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on', k===i); });
    for (var k=0;k<N;k++) ticks[k].className = k<i ? 'done' : (k===i ? 'here' : '');
    count.textContent = String(i+1).padStart(2,'0') + ' / ' + N;
    actlab.textContent = slides[i].dataset.act || '';
    var fr = frags();
    fr.forEach(function(el,k){
      var on = k < f;
      if (el.classList.contains('fragsvg')) el.style.opacity = on ? 1 : 0;
      else el.classList.toggle('shown', on);
    });
    /* the hop counter follows the chips */
    if (hopn && slides[i].contains(hopn)){
      hopn.textContent = fr.filter(function(el,k){ return k<f && el.classList.contains('hop'); }).length;

  }
  function go(k){ stopClips(); i=k; f=0; paint(); }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){ go(i+1); } }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){ stopClips(); i--; f=slides[i].querySelectorAll('.frag, .fragsvg').length; paint(); } }

  clips.forEach(function(a){
    var tag = a.parentNode.querySelector('.clip');
    if (!tag) return;
    a.addEventListener('loadedmetadata', function(){ tag.classList.add('ready'); });
    a.addEventListener('play',  function(){ tag.classList.add('playing');    tag.textContent='p · pause'; });
    a.addEventListener('pause', function(){ tag.classList.remove('playing'); tag.textContent='p · play clip'; });
  });
  function stopClips(){ clips.forEach(function(a){ if(!a.paused) a.pause(); }); }
  function toggleClip(){
    var a = slides[i].querySelector('audio[data-clip]');
    if (!a || !a.duration) return;
    if (a.paused) a.play(); else a.pause();
  }

  document.addEventListener('keydown', function(e){
    var k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){go(0);}
    else if(k==='End'){go(N-1);}
    else if(k==='p'||k==='P'){ toggleClip(); }
    else if(k==='f'||k==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
    else if(k==='n'||k==='N'){ document.body.classList.toggle('cues'); }
    else if(k==='o'||k==='O'){ document.getElementById('jump').classList.toggle('open'); }
    else if(k==='Escape'){ document.getElementById('jump').classList.remove('open'); }
  });
  document.addEventListener('click', function(e){
    if(e.target.closest('#jump')||e.target.closest('button')) return;
    if(e.clientX < window.innerWidth*0.26) prev(); else next();
  });

  paint();
})();
</script>
</body>
</html>
