<style>

}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}

#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}

strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 33 */
pre{font-size:14px;line-height:1.36}
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.qpc,.cal,.tmp,.par{padding:14px 22px}

svg text{font-family:'JetBrains Mono',monospace}

.frag.shown{opacity:1}

  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}

#jump ol{list-style:none;columns:2;column-gap:60px}

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 33</b></div>

  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>

</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 33 · unit IV · optimisation of AI models at the edge · general methods</div>
    <h1>Smaller, faster, cooler,<br>and still right.</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Class 24 opened the toolbox: quantisation, pruning, distillation. Today we take each tool apart: where the accuracy goes, how to win it back, and how to combine them without losing the plot.</p>
  </div>
  <div class="cue">Theory runs to slide 14; the Colab lab is one block at the end (slides 15 to 17). Students need a Google account and a Colab notebook; no board today. Run the five cells yourself the day before: TensorFlow versions in Colab change.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>Your update makes 1 device in 20 worse. Catch it, then undo it.</h2>
    <div class="split" style="gap:24px;margin-top:8px">
      <div class="rem frag"><div class="h">catch it early</div><ul><li>Roll out in stages: a few devices first (a "canary"), then more.</li><li>Compare their numbers with devices still on the old version.</li><li>Test on recordings from many rooms and voices, not one.</li></ul></div>
      <div class="rem green frag"><div class="h">undo it</div><ul><li>Keep the previous firmware in a second slot; switch back on failure.</li><li>Version every model, so you know exactly what each device runs.</li></ul></div>
    </div>
    <p class="frag" style="margin-top:20px;max-width:72ch">Optimisation is one of the commonest reasons an update gets worse for some users. Today: how to shrink a model without that happening.</p>
  </div>
  <div class="cue">Two minutes. The 1-in-20 device is often one with an unusual room, voice or microphone: exactly the inputs a careless quantisation step handles worst (slide 7).</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Three times too big" data-act="the hook">
  <div>
    <div class="kicker">the hook · one of your project's slot models</div>
    <h2>Three times too big, nearly three times too slow, 92% accurate. Now what?</h2>
    <svg viewBox="0 0 1100 290" width="1100" height="290"><text x="0" y="24" font-size="16" fill="#4b5057" font-weight="700">FLASH FOR THE MODEL</text><rect x="0" y="40" width="1080" height="56" rx="6" fill="#a8231f" opacity=".85"/><text x="16" y="76" font-size="18" fill="#fff" font-weight="700">float32 slot model · 180 KB</text><line x1="384" y1="30" x2="384" y2="106" stroke="#146b5c" stroke-width="4"/><text x="394" y="124" font-size="15" fill="#146b5c" font-weight="700">budget · 64 KB</text><text x="0" y="174" font-size="16" fill="#4b5057" font-weight="700">TIME PER INFERENCE</text><rect x="0" y="190" width="1080" height="56" rx="6" fill="#a8231f" opacity=".85"/><text x="16" y="226" font-size="18" fill="#fff" font-weight="700">40 ms</text><line x1="405" y1="180" x2="405" y2="256" stroke="#146b5c" stroke-width="4"/><text x="415" y="274" font-size="15" fill="#146b5c" font-weight="700">budget · 15 ms</text></svg>
    <p class="frag" style="max-width:76ch">Int8 alone gets you to 45 KB and about 16 ms. Close, but not quite. Every extra step costs a little accuracy, and the steps interact. Today is about choosing and ordering them.</p>
  </div>
  <div class="cue">Illustrative numbers for a slot model (a small CNN that recognises a few command words). Ask for a show of hands: which one method would you try first? Most will say int8; keep their answer for slide 14.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Four goals, one front" data-act="goals">
  <div>
    <h2>Size, speed, energy, accuracy: you trade them, you never get all four free.</h2>
    <div class="split" style="grid-template-columns:1.2fr .8fr;gap:24px;align-items:center">
      <svg viewBox="0 0 960 440" width="100%"><rect x="80" y="40" width="860" height="340" fill="#fff" stroke="#e2e0d9"/><text x="80" y="404" font-size="13" text-anchor="middle" fill="#8b9096">10 KB</text><text x="358" y="404" font-size="13" text-anchor="middle" fill="#8b9096">30 KB</text><text x="662" y="404" font-size="13" text-anchor="middle" fill="#8b9096">100 KB</text><text x="940" y="404" font-size="13" text-anchor="middle" fill="#8b9096">300 KB</text><text x="70" y="323" font-size="13" text-anchor="end" fill="#8b9096">84%</text><text x="70" y="200" font-size="13" text-anchor="end" fill="#8b9096">88%</text><text x="70" y="76" font-size="13" text-anchor="end" fill="#8b9096">92%</text><text x="510" y="428" font-size="14" text-anchor="middle" fill="#4b5057">model size (log scale) · smaller is further left</text><text x="20" y="210" font-size="14" text-anchor="middle" fill="#4b5057" transform="rotate(-90 20 210)">accuracy</text><circle cx="811" cy="71" r="9" fill="#8b9096" opacity=".6"/><circle cx="460" cy="117" r="9" fill="#8b9096" opacity=".6"/><circle cx="662" cy="102" r="9" fill="#8b9096" opacity=".6"/><circle cx="506" cy="117" r="9" fill="#8b9096" opacity=".6"/><circle cx="358" cy="188" r="9" fill="#8b9096" opacity=".6"/><circle cx="572" cy="256" r="9" fill="#8b9096" opacity=".6"/><circle cx="765" cy="164" r="9" fill="#8b9096" opacity=".6"/><circle cx="312" cy="318" r="9" fill="#8b9096" opacity=".6"/><circle cx="460" cy="170" r="9" fill="#8b9096" opacity=".6"/><g class="frag"><polyline points="312,318 358,188 460,117 662,102 811,71" fill="none" stroke="#146b5c" stroke-width="3"/><circle cx="312" cy="318" r="10" fill="#146b5c"/><circle cx="358" cy="188" r="10" fill="#146b5c"/><circle cx="460" cy="117" r="10" fill="#146b5c"/><circle cx="662" cy="102" r="10" fill="#146b5c"/><circle cx="811" cy="71" r="10" fill="#146b5c"/><text x="100" y="66" font-size="15" fill="#146b5c" font-weight="700">the Pareto front: nothing beats these on both axes</text></g></svg>
      <div>
        <div class="ntiles" style="grid-template-columns:1fr 1fr">
          <div class="ntile"><div class="nb" style="font-size:24px">size</div><div class="ns">flash for weights, SRAM for activations</div></div>
          <div class="ntile"><div class="nb" style="font-size:24px">latency</div><div class="ns">ms per inference (Class 20's budget)</div></div>
          <div class="ntile"><div class="nb" style="font-size:24px">energy</div><div class="ns">mJ per inference: battery life</div></div>

<section class="slide" data-t="The methods, side by side" data-act="goals">
  <div>
    <h2>Eight methods. What each one shrinks, and what it costs.</h2>
    <table class="dt txt" style="width:100%;font-size:18px">
      <tr><th style="width:24%">method</th><th style="width:22%">shrinks</th><th style="width:30%">costs</th><th>retrain?</th></tr>
      <tr class="frag"><td>post-training int8</td><td>size 4×, latency 2–4×</td><td>a little accuracy; needs calibration data</td><td>no</td></tr>
      <tr class="frag"><td>quantisation-aware training</td><td>same as int8</td><td>training time; more code</td><td>yes, fine-tune</td></tr>
      <tr class="frag"><td>structured pruning</td><td>size and latency</td><td>accuracy unless fine-tuned</td><td>yes, fine-tune</td></tr>
      <tr class="frag"><td>unstructured pruning</td><td>file size, if compressed</td><td>little speed-up on an MCU</td><td>yes, fine-tune</td></tr>
      <tr class="frag"><td>knowledge distillation</td><td>everything: a smaller student</td><td>a teacher model and a full training run</td><td>yes</td></tr>
      <tr class="frag"><td>low-rank factorisation</td><td>big dense and conv layers</td><td>accuracy if the rank is too low</td><td>usually</td></tr>
      <tr class="frag"><td>weight clustering</td><td>flash (compressed weights)</td><td>needs lookup or decompression</td><td>fine-tune</td></tr>
      <tr class="frag"><td>design small / architecture search</td><td>everything, from the start</td><td>design or search time</td><td>yes, from scratch</td></tr>
    </table>
  </div>
  <div class="cue">Typical ranges, not guarantees. Ask which rows need no retraining at all (only post-training quantisation): that is why it is always tried first.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="One scale or one per channel?" data-act="quantisation, deeper">
  <div>
    <div class="kicker">try it live · 8 output channels of one layer, channel 6 has large weights</div>
    <h2>One outlier channel can waste the int8 grid for every other channel.</h2>
    <div class="panel qpc">
      <div class="crow" style="grid-template-columns:150px 1fr 180px 1fr 70px;gap:14px"><span class="cl">scales</span><span class="cb"><button data-m="t" class="sel">one per tensor</button><button data-m="c">one per channel</button></span><span class="cl" style="text-align:right">bits</span><input type="range" class="qb" min="2" max="8" step="1" value="4"><span class="num qbv"></span></div>
      <svg viewBox="0 0 1300 330" width="100%" class="qsvg"></svg>
      <div class="qinfo"></div>
    </div>
  </div>
  <div class="cue">Synthetic weights. Each column is one output channel; dots are weights, faint lines are the quantisation levels that fall inside that channel's range. With one scale for the whole tensor, the big channel sets the step size and the small channels get only a level or two: large relative error (red bars). Per-channel scales give every channel its own grid. LiteRT's int8 scheme uses per-channel scales for convolution weights for exactly this reason. Start at 4 bits to make the effect obvious, then go to 8.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Calibrating activations" data-act="quantisation, deeper">
  <div>
    <div class="kicker">try it live · one layer's activations over the calibration set</div>
    <h2>Full-integer int8 also squeezes the activations. Where should the range end?</h2>
    <div class="panel calc cal">
      <div class="crow" style="grid-template-columns:200px 1fr 110px;gap:16px"><span class="cl">clip the range at</span><input type="range" class="cl1" min="10" max="120" step="1" value="120"><span class="num clv"></span></div>
      <div class="cb" style="margin:4px 0 8px"><button data-c="max">min–max</button><button data-c="p999">99.9th percentile</button><button data-c="p99">99th percentile</button></div>
      <svg viewBox="0 0 1300 230" width="100%" class="calsvg"></svg>
      <div class="calstats"></div>
    </div>
  </div>
  <div class="cue">Synthetic activation values: most are small, a rare few are huge. The converter picks each activation range from a representative dataset (typically a few hundred real examples). Min–max keeps every outlier but makes the step coarse for the common values; clipping gives the common values finer steps at the cost of distorting the rare outliers. Which matters more depends on whether the outliers carry the answer: calibration methods (percentile, or entropy-based) pick a compromise from data. That is why the calibration set must look like real use: calibrate on quiet-room clips only, and the kitchen's loud clips will saturate.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Mixed precision and QAT" data-act="quantisation, deeper">
  <div>
    <h2>When int8 hurts: keep a few layers wider, or train with the rounding in.</h2>
    <div class="split" style="gap:24px">
      <div class="panel frag"><span class="lab" style="color:var(--accent)">mixed precision</span><p>Most layers int8; the one or two sensitive ones (often the first and last) stay at int16 or float.</p><p class="small">Find them by quantising one layer at a time and watching accuracy. Costs some size and speed, and the runtime must support the mix.</p></div>
      <div class="panel frag"><span class="lab" style="color:var(--ok)">quantisation-aware training</span><p>Insert "fake quantise" steps in training: the forward pass rounds like int8; the backward pass pretends rounding wasn't there (the straight-through estimator).</p><p class="small">The weights learn to sit where rounding hurts least. Usually a few epochs of fine-tuning from the float model.</p></div>
    </div>
    <div class="ntiles frag" style="grid-template-columns:repeat(3,1fr);margin-top:18px">
      <div class="ntile"><div class="nb" style="font-size:26px">int8</div><div class="ns">the MCU default; ESP-NN and CMSIS-NN kernels</div></div>
      <div class="ntile"><div class="nb" style="font-size:26px">int4</div><div class="ns">half again the size; needs QAT and kernel support</div></div>
      <div class="ntile"><div class="nb" style="font-size:26px">binary (1-bit)</div><div class="ns">XNOR and bit-count instead of multiply; big accuracy cost; research-grade</div></div>
    </div>
  </div>
  <div class="cue">Name int4 and binary only. Support for anything below 8 bits varies a lot between runtimes and chips; check before planning on it.</div>
</section>

"#c6c3ba" opacity="0.75"/><rect x="970" y="210" width="30" height="30" rx="3" fill="#23408f" stroke="#c6c3ba" opacity="0.75"/><rect x="1004" y="210" width="30" height="30" rx="3" fill="#23408f" stroke="#c6c3ba" opacity="0.75"/><rect x="1038" y="210" width="30" height="30" rx="3" fill="#23408f" stroke="#c6c3ba" opacity="0.75"/><text x="800" y="330" font-size="14" fill="#146b5c">a smaller layer: 32 multiplies</text></g></svg>
    <p class="frag" style="max-width:76ch">Prune a little, fine-tune, prune again: <strong>iterative</strong> pruning loses far less accuracy than cutting half in one go. Pick channels by their size (the sum of their weights' magnitudes) or by how much accuracy drops without them.</p>
  </div>
  <div class="cue">Unstructured sparsity only saves time on hardware or kernels built for it (some GPUs and NPUs); TFLite Micro and ESP-NN run dense kernels, so the zeros still get multiplied. It can still shrink a compressed file in flash. Structured pruning changes the layer shapes, so later layers shrink too.</div>
</section>

  <div>
    <h2>Two more ways to store fewer numbers.</h2>

      <div class="panel frag"><span class="lab" style="color:var(--accent)">low-rank factorisation</span>
        <svg viewBox="0 0 560 190" width="100%"><rect x="0" y="10" width="150" height="150" fill="#23408f" opacity=".8"/><text x="75" y="92" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">W 256×256</text><text x="180" y="92" font-size="26" fill="#4b5057">≈</text><rect x="220" y="10" width="20" height="150" fill="#146b5c" opacity=".85"/><text x="230" y="180" font-size="13" text-anchor="middle" fill="#4b5057">U 256×16</text><text x="258" y="92" font-size="22" fill="#4b5057">×</text><rect x="280" y="75" width="150" height="20" fill="#146b5c" opacity=".85"/><text x="355" y="68" font-size="13" text-anchor="middle" fill="#4b5057">V 16×256</text></svg>
        <p style="font-family:var(--mono);font-size:20px">65,536 → 8,192 weights</p><p class="small">One big layer becomes two thin ones. Works when the layer's information really lives in a few directions.</p></div>
      <div class="panel frag"><span class="lab" style="color:var(--ok)">weight clustering (sharing)</span>
        <p style="font-family:var(--mono);font-size:20px;margin-top:8px">65,536 weights → 16 shared values<br>4-bit index each + a 16-entry table</p>
        <p style="font-family:var(--mono);font-size:20px">256 KB (float) → 32 KB + 64 B</p>
        <p class="small">Mostly a flash saving: the runtime needs a lookup step, or the weights are expanded back before use.</p></div>
    </div>
  </div>
  <div class="cue">Rank 16 is an illustrative choice; the right rank comes from checking accuracy. Clustering and int8 are cousins: int8 uses 256 evenly spaced levels, clustering uses a few levels placed where the weights actually are.</div>

      <div class="ucard frag"><div class="un">MCUNet</div><div class="ut">search and runtime, designed together</div><div class="ud">A search for networks that fit a given chip's SRAM and flash (TinyNAS) plus a lean inference engine (TinyEngine). Built for microcontrollers.</div></div>
      <div class="ucard frag"><div class="un">hardware-aware search</div><div class="ut">let the device score the design</div><div class="ud">Measure latency and memory on the real board inside the search loop, not FLOPs on paper.</div></div>

<section class="slide" data-t="Cells 1 and 2" data-act="lab">
  <div class="split" style="grid-template-columns:1.5fr .5fr;align-items:center">
    <pre><span class="c"># Cell 1 · data: four "commands" as 16 × 8 patterns plus noise</span>
<span class="k">import</span> numpy <span class="k">as</span> np, tensorflow <span class="k">as</span> tf
rng = np.random.default_rng(<span class="s">0</span>)
templates = rng.normal(<span class="s">0</span>, <span class="s">1</span>, (<span class="s">4</span>, <span class="s">16</span>, <span class="s">8</span>))
<span class="k">def</span> <span class="f">make</span>(n):
    y = rng.integers(<span class="s">0</span>, <span class="s">4</span>, n)
    x = templates[y] + rng.normal(<span class="s">0</span>, <span class="s">1.2</span>, (n, <span class="s">16</span>, <span class="s">8</span>))
    <span class="k">return</span> x[..., <span class="k">None</span>].astype(<span class="s">"float32"</span>), y
x_tr, y_tr = make(<span class="s">3000</span>);  x_te, y_te = make(<span class="s">600</span>)

<span class="c"># Cell 2 · a tiny CNN</span>
model = tf.keras.Sequential([
    tf.keras.Input((<span class="s">16</span>, <span class="s">8</span>, <span class="s">1</span>)),
    tf.keras.layers.Conv2D(<span class="s">8</span>, <span class="s">3</span>, activation=<span class="s">"relu"</span>),
    tf.keras.layers.DepthwiseConv2D(<span class="s">3</span>, activation=<span class="s">"relu"</span>),
    tf.keras.layers.Flatten(),
    tf.keras.layers.Dense(<span class="s">32</span>, activation=<span class="s">"relu"</span>),
    tf.keras.layers.Dense(<span class="s">4</span>)])
model.compile(<span class="s">"adam"</span>,
    tf.keras.losses.SparseCategoricalCrossentropy(from_logits=<span class="k">True</span>), [<span class="s">"accuracy"</span>])
model.fit(x_tr, y_tr, epochs=<span class="s">8</span>, validation_split=<span class="s">0.1</span>, verbose=<span class="s">0</span>)
print(<span class="s">"Keras float accuracy:"</span>, model.evaluate(x_te, y_te, verbose=<span class="s">0</span>)[<span class="s">1</span>])</pre>

<section class="slide" data-t="Cells 3 to 5" data-act="lab">
  <div class="split" style="grid-template-columns:1.55fr .45fr;align-items:center">
    <pre style="font-size:12.5px;line-height:1.32"><span class="c"># Cell 3 · three conversions</span>
<span class="k">def</span> <span class="f">convert</span>(mode):
    c = tf.lite.TFLiteConverter.from_keras_model(model)
    <span class="k">if</span> mode != <span class="s">"float32"</span>:

  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
