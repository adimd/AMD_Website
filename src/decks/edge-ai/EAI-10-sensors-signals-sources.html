<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 10 · Sensors, Signals and Sources of Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}
.mquiz{padding:8px 22px}
.mq{display:grid;grid-template-columns:1fr 330px;align-items:center;gap:6px 20px;padding:12px 0;border-bottom:1px solid var(--rule)}
.mq:last-child{border-bottom:none}
.mq .mi{font-size:21px;color:var(--ink)}
.mq .mb{display:flex;gap:8px;justify-content:flex-end}
.mq button{width:100px;height:40px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:15px;color:var(--ink);cursor:pointer}
.mq button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.mq button.wrong{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.mq .mw{grid-column:1 / -1;font-size:16px;color:var(--soft);display:none}
.mq.answered .mw{display:block}

/* class 10 */
.rangex{padding:18px 26px}
.mini-lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--soft)}
.rverdict{font-size:22px;font-weight:600;color:var(--ink);margin-top:8px}
.mquiz.wide .mq{grid-template-columns:1fr 680px}
.mquiz.wide .mq button{width:104px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 10</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 10 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 10 · unit II · sensors, signals and sources of data</div>
    <h1>Every model starts<br>at a sensor</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Unit I treated the board as a box. Unit II opens it, starting where every pipeline starts: the sensor that turns the physical world into numbers.</p>
  </div>
  <div class="cue">Hand out the kits before you start: ESP32-S3, INMP441, MPU6050, breadboard. Today only the board and the MPU6050 are wired.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Unit II map" data-act="opening">
  <div>
    <h2>Unit II: what feeds the model, and what runs it.</h2>
    <svg viewBox="0 0 1432 370" width="1432" height="370"><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><g class=""><rect x="0" y="60" width="266" height="96" rx="12" fill="#23408f" stroke="#23408f" stroke-width="2.5"/><text x="18" y="100" font-size="26" fill="#faf9f6" font-weight="700">10</text><text x="18" y="130" font-size="14" fill="#faf9f6">sensors, signals, sources</text></g><g class=""><rect x="286" y="60" width="266" height="96" rx="12" fill="#eaeef7" stroke="#23408f" stroke-width="1.4"/><text x="304" y="100" font-size="26" fill="#23408f" font-weight="700">11</text><text x="304" y="130" font-size="14" fill="#15171b">acoustic + vibration</text></g><g class=""><rect x="572" y="60" width="266" height="96" rx="12" fill="#eaeef7" stroke="#23408f" stroke-width="1.4"/><text x="590" y="100" font-size="26" fill="#23408f" font-weight="700">12</text><text x="590" y="130" font-size="14" fill="#15171b">visual + scene</text></g><g class=""><rect x="858" y="60" width="266" height="96" rx="12" fill="#eaeef7" stroke="#23408f" stroke-width="1.4"/><text x="876" y="100" font-size="26" fill="#23408f" font-weight="700">13</text><text x="876" y="130" font-size="14" fill="#15171b">motion, force, touch</text></g><g class=""><rect x="1144" y="60" width="266" height="96" rx="12" fill="#eaeef7" stroke="#23408f" stroke-width="1.4"/><text x="1162" y="100" font-size="26" fill="#23408f" font-weight="700">14</text><text x="1162" y="130" font-size="14" fill="#15171b">optical, EM, env, bio, chem</text></g><g class=""><rect x="143" y="250" width="266" height="96" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.4"/><text x="161" y="290" font-size="26" fill="#146b5c" font-weight="700">15</text><text x="161" y="320" font-size="14" fill="#15171b">architecture, MCUs, DSPs</text></g><g class=""><rect x="429" y="250" width="266" height="96" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.4"/><text x="447" y="290" font-size="26" fill="#146b5c" font-weight="700">16</text><text x="447" y="320" font-size="14" fill="#15171b">SoCs, accelerators</text></g><g class=""><rect x="715" y="250" width="266" height="96" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.4"/><text x="733" y="290" font-size="26" fill="#146b5c" font-weight="700">17</text><text x="733" y="320" font-size="14" fill="#15171b">FPGAs, ASICs, edge servers</text></g><g class=""><rect x="1001" y="250" width="266" height="96" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.4"/><text x="1019" y="290" font-size="26" fill="#146b5c" font-weight="700">18</text><text x="1019" y="320" font-size="14" fill="#15171b">workloads, multi-device</text></g><text x="0" y="36" font-size="15" fill="#23408f" font-weight="700">THE DATA COMES IN · SENSORS</text><text x="143" y="228" font-size="15" fill="#146b5c" font-weight="700">THE MATHS GETS DONE · PROCESSORS</text></svg>
    <p class="small">Today is the first box: the ideas every sensor shares, before we meet the families one by one.</p>
  </div>
  <div class="cue">One line per box. The point is the split: five classes on what comes in, four on what computes.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Your phone's sensors" data-act="the hook">
  <div>
    <h2 style="margin-bottom:4px">Your phone has at least ten sensors. Name them.</h2>
    <svg viewBox="0 0 1432 520" width="1432" height="520"><rect x="606" y="40" width="220" height="440" rx="34" fill="#15171b"/><rect x="620" y="70" width="192" height="380" rx="14" fill="#2a3138"/><circle cx="716" cy="56" r="6" fill="#4b5057"/><g class="frag"><line x1="530" y1="90" x2="616" y2="90" stroke="#c6c3ba" stroke-width="1.5"/><text x="520" y="86" font-size="18" fill="#15171b" text-anchor="end" font-weight="700">touchscreen</text><text x="520" y="108" font-size="13" fill="#8b9096" text-anchor="end">capacitive · Class 13</text></g><g class="frag"><line x1="530" y1="170" x2="616" y2="170" stroke="#c6c3ba" stroke-width="1.5"/><text x="520" y="166" font-size="18" fill="#15171b" text-anchor="end" font-weight="700">cameras, front and back</text><text x="520" y="188" font-size="13" fill="#8b9096" text-anchor="end">Class 12</text></g><g class="frag"><line x1="530" y1="250" x2="616" y2="250" stroke="#c6c3ba" stroke-width="1.5"/><text x="520" y="246" font-size="18" fill="#15171b" text-anchor="end" font-weight="700">microphones, usually 2–3</text><text x="520" y="268" font-size="13" fill="#8b9096" text-anchor="end">Class 11</text></g><g class="frag"><line x1="530" y1="330" x2="616" y2="330" stroke="#c6c3ba" stroke-width="1.5"/><text x="520" y="326" font-size="18" fill="#15171b" text-anchor="end" font-weight="700">ambient light</text><text x="520" y="348" font-size="13" fill="#8b9096" text-anchor="end">Class 14</text></g><g class="frag"><line x1="530" y1="410" x2="616" y2="410" stroke="#c6c3ba" stroke-width="1.5"/><text x="520" y="406" font-size="18" fill="#15171b" text-anchor="end" font-weight="700">proximity</text><text x="520" y="428" font-size="13" fill="#8b9096" text-anchor="end">Class 14</text></g><g class="frag"><line x1="816" y1="90" x2="902" y2="90" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="86" font-size="18" fill="#15171b" font-weight="700">accelerometer</text><text x="912" y="108" font-size="13" fill="#8b9096">Class 13</text></g><g class="frag"><line x1="816" y1="170" x2="902" y2="170" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="166" font-size="18" fill="#15171b" font-weight="700">gyroscope</text><text x="912" y="188" font-size="13" fill="#8b9096">Class 13</text></g><g class="frag"><line x1="816" y1="250" x2="902" y2="250" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="246" font-size="18" fill="#15171b" font-weight="700">magnetometer (compass)</text><text x="912" y="268" font-size="13" fill="#8b9096">Class 13</text></g><g class="frag"><line x1="816" y1="330" x2="902" y2="330" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="326" font-size="18" fill="#15171b" font-weight="700">barometer, on many phones</text><text x="912" y="348" font-size="13" fill="#8b9096">Class 14</text></g><g class="frag"><line x1="816" y1="410" x2="902" y2="410" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="406" font-size="18" fill="#15171b" font-weight="700">GNSS: GPS, NavIC</text><text x="912" y="428" font-size="13" fill="#8b9096">Class 13</text></g><g class="frag"><line x1="816" y1="440" x2="902" y2="490" stroke="#c6c3ba" stroke-width="1.5"/><text x="912" y="486" font-size="18" fill="#15171b" font-weight="700">fingerprint</text><text x="912" y="508" font-size="13" fill="#8b9096">Class 13</text></g></svg>
  </div>
  <div class="cue">Let the room shout answers first; reveal one label per click. The class numbers show where each family comes back in this unit. Exact sensors vary by phone model; not every phone has a barometer.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="The sensing chain" data-act="the chain">
  <div>
    <h2>Every sensor is the same chain of six steps.</h2>

    <p class="frag" style="margin-top:16px;max-width:76ch">Walk a microphone along it: air pressure moves a diaphragm, the gap changes a capacitance, a tiny amplifier boosts it, an ADC samples it 16,000 times a second, and the samples leave on an I2S wire.</p>

  <div class="cue">One box per click. Notice the signal gets small and noisy at step 2 and is restored at step 3: that is what conditioning is for.</div>

<!-- 05 -->
<section class="slide" data-t="Inside a digital sensor" data-act="the chain">
  <div>
    <h2>In a modern digital sensor, four steps live in one chip.</h2>
    <svg viewBox="0 0 1432 330" width="1432" height="330"><defs><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><rect x="0" y="120" width="200" height="110" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.5"/><text x="20" y="165" font-size="18" fill="#15171b" font-weight="700">the world</text><text x="20" y="192" font-size="14" fill="#4b5057">motion, sound</text><line x1="204" y1="175" x2="286" y2="175" stroke="#8b9096" stroke-width="2.5" marker-end="url(#m3)"/><rect x="290" y="40" width="760" height="270" rx="18" fill="#eaeef7" stroke="#23408f" stroke-width="2.5" stroke-dasharray="10 6"/><text x="310" y="74" font-size="15" fill="#23408f" font-weight="700">ONE TINY PACKAGE · e.g. MPU6050, 4 × 4 mm</text><rect x="320" y="120" width="160" height="110" rx="10" fill="#ffffff" stroke="#23408f"/><text x="400" y="168" font-size="15" fill="#15171b" text-anchor="middle" font-weight="700">MEMS element</text><text x="400" y="194" font-size="13" fill="#4b5057" text-anchor="middle">transducer</text><line x1="482" y1="175" x2="498" y2="175" stroke="#8b9096" stroke-width="2" marker-end="url(#m3)"/><rect x="500" y="120" width="160" height="110" rx="10" fill="#ffffff" stroke="#23408f"/><text x="580" y="168" font-size="15" fill="#15171b" text-anchor="middle" font-weight="700">amp + filter</text><text x="580" y="194" font-size="13" fill="#4b5057" text-anchor="middle">conditioning</text><line x1="662" y1="175" x2="678" y2="175" stroke="#8b9096" stroke-width="2" marker-end="url(#m3)"/><rect x="680" y="120" width="160" height="110" rx="10" fill="#ffffff" stroke="#23408f"/><text x="760" y="168" font-size="15" fill="#15171b" text-anchor="middle" font-weight="700">16-bit ADC</text><text x="760" y="194" font-size="13" fill="#4b5057" text-anchor="middle">sampling</text><line x1="842" y1="175" x2="858" y2="175" stroke="#8b9096" stroke-width="2" marker-end="url(#m3)"/><rect x="860" y="120" width="160" height="110" rx="10" fill="#ffffff" stroke="#23408f"/><text x="940" y="168" font-size="15" fill="#15171b" text-anchor="middle" font-weight="700">I2C logic</text><text x="940" y="194" font-size="13" fill="#4b5057" text-anchor="middle">interface</text><g class="frag"><line x1="1054" y1="175" x2="1150" y2="175" stroke="#146b5c" stroke-width="3" marker-end="url(#m3)"/><text x="1102" y="160" font-size="13" fill="#146b5c" text-anchor="middle">2 wires</text><rect x="1160" y="120" width="250" height="110" rx="12" fill="#1d2a30"/><text x="1285" y="168" font-size="17" fill="#faf9f6" text-anchor="middle" font-weight="700">ESP32-S3</text><text x="1285" y="194" font-size="13" fill="#c6c3ba" text-anchor="middle">receives bytes only</text></g></svg>
    <p class="frag" style="max-width:76ch">You never see the analog signal. You configure the sensor (range, rate, filters) by writing to its registers, and read finished numbers back. That is why the datasheet matters so much: it is the only window into what happened inside.</p>
  </div>
  <div class="cue">The MPU6050 and INMP441 in the kit are both like this. A potentiometer or an LDR is the opposite: the board's own ADC does step 4. The 4 × 4 mm package size is the MPU6050's QFN package.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Range vs resolution explorer" data-act="specs">
  <div>
    <div class="kicker">try it live · an accelerometer on a table that gets tapped</div>
    <h2>Pick a range and a bit depth. What do you lose?</h2>
    <div class="panel rangex">
      <div class="crow"><span class="cl">range</span><span class="cb" data-g="r"><button data-v="2" class="sel">±2 g</button><button data-v="4">±4 g</button><button data-v="8">±8 g</button><button data-v="16">±16 g</button></span></div>
      <div class="crow"><span class="cl">bits</span><span class="cb" data-g="b"><button data-v="8">8-bit</button><button data-v="12">12-bit</button><button data-v="16" class="sel">16-bit</button></span></div>
      <div class="split" style="grid-template-columns:1fr 1fr;gap:24px;margin-top:6px">
        <div><span class="mini-lab">WHOLE SIGNAL · 0 TO 4 g</span><svg viewBox="0 0 640 240" width="100%"><line class="rlim" x1="0" x2="640" stroke="#a8231f" stroke-width="1.5" stroke-dasharray="7 5"/><polyline class="rtrue" fill="none" stroke="#c6c3ba" stroke-width="2"/><polyline class="rmeas" fill="none" stroke="#23408f" stroke-width="2.5"/></svg></div>
        <div><span class="mini-lab">ZOOM ON THE QUIET PART · 0.95 TO 1.05 g</span><svg viewBox="0 0 640 240" width="100%"><polyline class="ztrue" fill="none" stroke="#c6c3ba" stroke-width="2"/><polyline class="zmeas" fill="none" stroke="#146b5c" stroke-width="2.5"/></svg></div>
      </div>
      <div class="rverdict"></div>
    </div>
  </div>
  <div class="cue">The signal: gravity (1 g) plus a 20 mg wobble, then a tap that peaks near 3.4 g. ±2 g clips the tap; ±16 g at 8-bit flattens the wobble. Step size = 2 × range ÷ 2^bits. The MPU6050 is always 16-bit; the 8- and 12-bit options show what cheaper sensors and ADCs do.</div>

        <tr><td>noise</td><td>picks up noise on the wire</td><td>immune once digitised</td></tr>
        <tr><td>effort</td><td>you calibrate the ADC</td><td>configure registers</td></tr>
        <tr><td>pins</td><td>one ADC pin each</td><td>many sensors share a bus</td></tr></table>
    </div>
  </div>
  <div class="cue">Ask why long analog wires are a bad idea near a motor (they pick up electrical noise). Digital sensors solved that by converting inside the package.</div>
</section>

<section class="slide" data-t="Reading the S3's ADC" data-act="interfaces">
  <div>
    <h2>The S3's ADC turns a voltage into a number from 0 to 4,095.</h2>
    <div class="split" style="grid-template-columns:1fr 1fr;align-items:center">
      <div class="stack">
        <div class="eq" style="font-size:24px">12 bits → 2<sup>12</sup> = <span class="v">4,096</span> levels</div>
        <table class="dt" style="margin-top:8px"><tr><th style="text-align:left">raw count</th><th>≈ voltage, 3.3 V full scale</th></tr>
          <tr class="frag"><td style="text-align:left">0</td><td>0 V</td></tr>
          <tr class="frag"><td style="text-align:left">2,048</td><td>≈ 1.65 V</td></tr>
          <tr class="frag"><td style="text-align:left">4,095</td><td>≈ 3.3 V</td></tr>
          <tr class="frag"><td style="text-align:left">one step</td><td>≈ 0.8 mV</td></tr></table>
      </div>
      <div class="stack frag">
        <div class="rem red"><div class="h">the honest caveat</div><ul><li>Real microcontroller ADCs are not perfectly linear, and their full-scale voltage depends on an attenuation setting.</li><li>Use the calibrated reading the framework provides (<code>analogReadMilliVolts</code> on the S3) rather than the simple formula.</li></ul></div>
        <p class="small">A recurring lesson: the datasheet number and the measured number are not the same. Measure.</p>
      </div>
    </div>
  </div>
  <div class="cue">The 3.3 V full-scale mapping is a simplification for the arithmetic. 3.3 ÷ 4,096 ≈ 0.8 mV per step. The live demo prints both the raw count and the calibrated millivolts so students see the difference.</div>
</section>

ff" stroke="#146b5c"/><text x="850" y="151" font-size="14" fill="#15171b" text-anchor="middle">a fast IMU</text></g><g class="frag"><text x="0" y="232" font-size="20" fill="#b06a12" font-weight="700">I2S</text><text x="0" y="256" font-size="13" fill="#4b5057">3 wires: BCLK, WS, SD</text><text x="0" y="276" font-size="13" fill="#8b9096">audio sample rates</text><rect x="230" y="210" width="150" height="70" rx="10" fill="#1d2a30"/><text x="305" y="252" font-size="14" fill="#faf9f6" text-anchor="middle">ESP32-S3</text><line x1="384" y1="245" x2="620" y2="245" stroke="#b06a12" stroke-width="3" opacity=".35"/><rect x="520" y="218" width="200" height="54" rx="10" fill="#ffffff" stroke="#b06a12"/><text x="620" y="251" font-size="14" fill="#15171b" text-anchor="middle">INMP441 microphone</text></g><g class="frag"><text x="0" y="332" font-size="20" fill="#8b9096" font-weight="700">UART</text><text x="0" y="356" font-size="13" fill="#4b5057">2 wires: TX, RX</text><text x="0" y="376" font-size="13" fill="#8b9096">9,600 to 921,600 baud</text><rect x="230" y="310" width="150" height="70" rx="10" fill="#1d2a30"/><text x="305" y="352" font-size="14" fill="#faf9f6" text-anchor="middle">ESP32-S3</text><line x1="384" y1="345" x2="620" y2="345" stroke="#8b9096" stroke-width="3" opacity=".35"/><rect x="520" y="318" width="200" height="54" rx="10" fill="#ffffff" stroke="#8b9096"/><text x="620" y="351" font-size="14" fill="#15171b" text-anchor="middle">GPS module</text></g></svg>

<section class="slide" data-t="Live: three readings from the board" data-act="demo">
  <div class="split" style="grid-template-columns:1.15fr .85fr;align-items:center">
    <pre><span class="c">// ESP32-S3 · Arduino core · three sources of data</span>
<span class="k">#include</span> <span class="s">&lt;Wire.h&gt;</span>
<span class="k">const int</span> POT_PIN = <span class="s">4</span>;      <span class="c">// an ADC1 pin; check your board</span>

<span class="k">void</span> <span class="f">setup</span>() {
  Serial.begin(<span class="s">115200</span>);
  Wire.begin();                 <span class="c">// default I2C pins</span>
  <span class="k">for</span> (<span class="k">byte</span> a = <span class="s">1</span>; a &lt; <span class="s">127</span>; a++) {    <span class="c">// 1 · scan the bus</span>
    Wire.beginTransmission(a);
    <span class="k">if</span> (Wire.endTransmission() == <span class="s">0</span>)
      Serial.printf(<span class="s">"I2C device at 0x%02X\n"</span>, a);
  }
}

<span class="k">void</span> <span class="f">loop</span>() {
  <span class="k">int</span> raw = analogRead(POT_PIN);            <span class="c">// 2 · analog</span>
  <span class="k">int</span> mv  = analogReadMilliVolts(POT_PIN);
  <span class="k">float</span> chip = temperatureRead();          <span class="c">// 3 · on-chip</span>
  Serial.printf(<span class="s">"raw %4d  %4d mV  chip %.1f C\n"</span>, raw, mv, chip);
  delay(<span class="s">200</span>);
}</pre>
    <div class="stack">
      <div class="kicker">live demo · 10 minutes</div>
      <h2>Three sources, one sketch.</h2>
      <p class="frag"><strong>1.</strong> The scan should print <code>0x68</code>: the MPU6050 answering on I2C.</p>
      <p class="frag"><strong>2.</strong> Turn the potentiometer: raw counts and calibrated millivolts. Do they agree with 3.3 × raw ÷ 4,095?</p>
      <p class="frag"><strong>3.</strong> The chip's own temperature. Touch the chip and watch it rise. It measures the chip, not the room.</p>
    </div>
  </div>
  <div class="cue">Uses the Arduino-ESP32 core: analogReadMilliVolts and temperatureRead are available on the S3 in recent core versions; check yours. GPIO 4 is on ADC1 on the S3; confirm against your board's pin map. Without a potentiometer, an LDR with a resistor divider works.</div>
</section>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.rangex')||e.target.closest('.mquiz')||e.target.closest('pre'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  function rangeDraw(p){
    var R=+p.querySelector('[data-g="r"] .sel').dataset.v, B=+p.querySelector('[data-g="b"] .sel').dataset.v, step=2*R/Math.pow(2,B);
    var N=500, tr=[], ms=[], zt=[], zm=[], clipped=false;
    for(var k=0;k<N;k++){ var t=k/(N-1); var v=1+0.02*Math.sin(2*Math.PI*14*t)+2.4*Math.exp(-Math.pow((t-0.62)/0.012,2));
      var c=Math.max(-R,Math.min(R,v)); if(v>R) clipped=true; var q=Math.round(c/step)*step;
      var x=(t*640).toFixed(1); tr.push(x+','+(230-v/4*220).toFixed(1)); ms.push(x+','+(230-q/4*220).toFixed(1));
      if(t<0.5){ var xz=(t/0.5*640).toFixed(1); zt.push(xz+','+(120-(v-1)/0.05*100).toFixed(1)); zm.push(xz+','+(120-Math.max(-1.2,Math.min(1.2,(q-1)/0.05))*100).toFixed(1)); } }
    p.querySelector('.rtrue').setAttribute('points',tr.join(' ')); p.querySelector('.rmeas').setAttribute('points',ms.join(' '));
    p.querySelector('.ztrue').setAttribute('points',zt.join(' ')); p.querySelector('.zmeas').setAttribute('points',zm.join(' '));
    var ly=230-R/4*220; var lim=p.querySelector('.rlim'); lim.setAttribute('y1',ly); lim.setAttribute('y2',ly); lim.style.display=R<4?'':'none';
    var levels=Math.round(0.04/step), mg=step*1000;
    var msg='Step '+(mg<1?mg.toFixed(2):mg.toFixed(mg<10?1:0))+' mg. ';
    msg+= clipped ? '<span style="color:var(--fail)">The tap is clipped at '+R+' g.</span> ' : '<span style="color:var(--ok)">The tap fits.</span> ';
    msg+= levels<2 ? '<span style="color:var(--fail)">The 20 mg wobble disappears.</span>' : (levels<10 ? '<span style="color:var(--amber)">The wobble is a staircase of '+levels+' levels.</span>' : '<span style="color:var(--ok)">The wobble is clear ('+levels+' levels).</span>');
    p.querySelector('.rverdict').innerHTML=msg;
  }
  deck.querySelectorAll('.rangex').forEach(rangeDraw);
  document.addEventListener('click',function(e){
    var b=e.target.closest('.rangex button');
    if(b){ b.blur(); b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); rangeDraw(b.closest('.rangex')); return; }
    var m=e.target.closest('.mq button'); if(!m) return; m.blur();
    var row=m.closest('.mq'), ans=row.dataset.ans;
    if(m.textContent===ans){ row.querySelectorAll('button').forEach(function(x){ if(x.textContent===ans) x.classList.add('right'); }); } else m.classList.add('wrong');
    row.classList.add('answered');
  });

  paint();
})();
</script>
