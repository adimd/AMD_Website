<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 14 · Optical, EM, Environmental, Bio and Chemical Sensors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 14 */
.mini-lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--soft)}
.rdp{padding:16px 18px}
.rdp .cb button{font-size:16px;height:38px;padding:0 12px}
.rdwrap{display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto}
.rdy{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:12px;color:var(--soft);text-align:center}
.rdimg img{width:100%;height:auto;image-rendering:pixelated;border-radius:6px;display:block}
.rdx{grid-column:2;font-family:var(--mono);font-size:12px;color:var(--soft);text-align:center;margin-top:6px}
.enose{padding:16px 26px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 14</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 14 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 14 · unit II · optical, electromagnetic, environmental, biological, chemical</div>
    <h1>The rest of the<br>sensor zoo</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Light, radio, heat, gas, heartbeats. Most of these sensors are slow and cheap; a few carry rich signals that need real ML. Every one of them has its own way of fooling you.</p>
  </div>
  <div class="cue">A guided tour rather than a board lab. Theory runs to slide 13; the datasheet exercise is one block at the end (slides 14 to 16). Prepare five datasheet excerpts in advance.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>Walking or cycling, from the wrist?</h2>
    <div class="ngrid" style="grid-template-columns:repeat(3,1fr);margin-top:8px">
      <div class="cellx frag"><div class="big-n" style="font-size:38px">rhythm</div><div class="nlab">steps swing the arm about twice a second</div></div>
      <div class="cellx frag"><div class="big-n" style="font-size:38px">rotation</div><div class="nlab">the gyroscope sees the swing; handlebars hold it still</div></div>
      <div class="cellx frag"><div class="big-n red" style="font-size:38px">rough road</div><div class="nlab">the hard case: vibration that looks like walking</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:70ch">That last box is today's theme. Every sensor has a situation where it confidently reports the wrong thing.</p>
  </div>
  <div class="cue">Two minutes. Ask what extra input would fix the rough-road case (speed from GNSS; a phone in the pocket as a second sensor).</div>
</section>

<!-- 03 -->
<section class="slide" data-t="A sensor that gets fooled" data-act="the hook">
  <div>
    <h2>Four triggers from a ₹100 motion sensor. How many were people?</h2>
    <svg viewBox="0 0 1432 260" width="1432" height="260"><line x1="140" y1="180" x2="1400" y2="180" stroke="#c6c3ba"/><text x="0" y="120" font-size="16" fill="#15171b" font-weight="700">PIR output</text><text x="0" y="142" font-size="13" fill="#8b9096">high = "motion"</text><g class="frag"><rect x="220" y="90" width="80" height="90" fill="#146b5c" opacity=".85"/><text x="260" y="216" font-size="15" fill="#15171b" text-anchor="middle">someone walks past</text><text x="260" y="240" font-size="14" fill="#146b5c" text-anchor="middle" font-weight="700">real</text></g><g class="frag"><rect x="580" y="90" width="80" height="90" fill="#a8231f" opacity=".85"/><text x="620" y="216" font-size="15" fill="#15171b" text-anchor="middle">a heater switches on</text><text x="620" y="240" font-size="14" fill="#a8231f" text-anchor="middle" font-weight="700">false alarm</text></g><g class="frag"><rect x="940" y="90" width="80" height="90" fill="#a8231f" opacity=".85"/><text x="980" y="216" font-size="15" fill="#15171b" text-anchor="middle">sunlight moves across the floor</text><text x="980" y="240" font-size="14" fill="#a8231f" text-anchor="middle" font-weight="700">false alarm</text></g><g class="frag"><rect x="1220" y="90" width="80" height="90" fill="#b06a12" opacity=".85"/><text x="1260" y="216" font-size="15" fill="#15171b" text-anchor="middle">the cat</text><text x="1260" y="240" font-size="14" fill="#b06a12" text-anchor="middle" font-weight="700">depends who asks</text></g></svg>
    <p class="frag" style="max-width:72ch">A passive infrared (PIR) sensor does not see people. It sees <strong>heat moving</strong> across its view. Anything warm that moves, or anything that warms up, can fire it.</p>
  </div>
  <div class="cue">If you have a PIR module, wave at it and then hold a warm mug in front of it. The price is approximate. The cat is deliberate: for a burglar alarm it is a false alarm; for a pet feeder it is the whole point.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Inside a PIR sensor" data-act="optical and EM">
  <div>
    <div class="kicker">optical</div>
    <h2>A PIR sensor splits the room into zones and watches heat move between them.</h2>
    <svg viewBox="0 0 1432 420" width="1432" height="420">
      <path d="M700 380 L 200 60 L 270 60 Z" fill="#e6f1ee" opacity=".9"/><path d="M700 380 L 310 60 L 380 60 Z" fill="#fbeeed" opacity=".9"/><path d="M700 380 L 420 60 L 490 60 Z" fill="#e6f1ee" opacity=".9"/><path d="M700 380 L 530 60 L 600 60 Z" fill="#fbeeed" opacity=".9"/><path d="M700 380 L 640 60 L 710 60 Z" fill="#e6f1ee" opacity=".9"/><path d="M700 380 L 750 60 L 820 60 Z" fill="#fbeeed" opacity=".9"/>

<section class="slide" data-t="Optical and electromagnetic sensors" data-act="optical and EM">
  <div>
    <h2>Optical and electromagnetic: six sensors, six ways to be fooled.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(3,1fr)"><div class="ntile frag"><div class="nb" style="font-size:28px">ambient light</div><div class="nk">light level</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: screen brightness, day/night</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: shadows, reflections</div></div><div class="ntile frag"><div class="nb" style="font-size:28px">PIR</div><div class="nk">heat moving across zones</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: wake a camera</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: heaters, sunlight, pets</div></div><div class="ntile frag"><div class="nb" style="font-size:28px">spectral</div><div class="nk">light at several wavelengths</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: crop health, ripeness</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: needs calibration to lighting</div></div><div class="ntile frag"><div class="nb" style="font-size:28px">Hall effect</div><div class="nk">magnetic field</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: door open/closed, motor speed</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: nearby magnets</div></div><div class="ntile frag"><div class="nb" style="font-size:28px">RF strength</div><div class="nk">how strong Wi-Fi / BLE signals are</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: room-level presence</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: furniture and people change it</div></div><div class="ntile frag"><div class="nb" style="font-size:28px">mmWave radar</div><div class="nk">reflected radio waves: range and motion</div><div class="ns" style="color:var(--body);font-size:16px;margin-top:6px">use: presence, breathing, falls</div><div class="ns" style="color:var(--fail);font-size:15px;margin-top:6px">fooled by: reflections off walls and metal</div></div></div>
  </div>
  <div class="cue">Read the red line on each tile aloud. The habit to build: for every sensor, ask "what else would trigger this?" before trusting it.</div>
</section>

<section class="slide" data-t="How mmWave radar sees" data-act="optical and EM">
  <div>
    <div class="kicker">electromagnetic · five minutes on radar</div>
    <h2>mmWave radar: send a chirp, listen for the echo.</h2>
    <div class="split" style="grid-template-columns:1.15fr .85fr;align-items:center">
      <svg viewBox="0 0 820 280" width="820" height="280"><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><rect x="0" y="120" width="120" height="80" rx="10" fill="#1d2a30"/><text x="60" y="166" font-size="14" fill="#faf9f6" text-anchor="middle">radar</text><path d="M124 150 C 200 100, 260 200, 320 150 S 440 100, 500 150 S 620 200, 680 150" fill="none" stroke="#23408f" stroke-width="2.5" marker-end="url(#m1)"/><text x="400" y="110" font-size="14" fill="#23408f" text-anchor="middle">a chirp: frequency sweeps up</text><circle cx="760" cy="120" r="22" fill="#b06a12"/><rect x="738" y="146" width="44" height="80" rx="12" fill="#b06a12"/><g class="frag"><path d="M730 190 C 650 230, 560 170, 480 210 S 300 230, 130 190" fill="none" stroke="#146b5c" stroke-width="2.5" marker-end="url(#m1)"/><text x="430" y="250" font-size="14" fill="#146b5c" text-anchor="middle">the echo comes back a little later, a little shifted</text></g></svg>
      <div class="stack">
        <div class="panel frag"><span class="lab">delay → distance</span><p>The echo's delay gives the range. Resolution depends on how wide the sweep is:</p><div class="eq" style="font-size:20px">ΔR = c ÷ (2 × <span class="v">bandwidth</span>)</div><p class="small">4 GHz of sweep → about 3.75 cm.</p></div>
        <div class="panel frag"><span class="lab">shift → speed</span><p>Motion shifts the echo's frequency (Doppler): radar sees speed directly, down to a chest rising as you breathe.</p></div>
      </div>
    </div>
  </div>
  <div class="cue">Common bands for these sensors are around 60 GHz and 77 GHz (FMCW chirps). 3 × 10⁸ ÷ (2 × 4 × 10⁹) = 0.0375 m. If mmWave radar is your own research area, a minute of your real data here is the most memorable part of the class.</div>
</section>

      <h2>What the radar's model actually sees: a range–Doppler map.</h2>
      <p class="rdinfo big" style="font-size:24px"></p>
      <p class="frag small">No image of a face, works in the dark and through thin plastic or fabric: a strong option for homes, hospitals and bathrooms. And it is an image, so Class 7's CNNs apply.</p>

  <div class="cue">Simulated maps. The bright vertical line in the middle is everything that is not moving (walls, furniture): zero velocity. Ask which scene a fall detector would care about, and which scene could fool it (the fan).</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Radiation, briefly" data-act="optical and EM">
  <div>
    <h2>Radiation, briefly: the same chain, different particles.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="ntile frag"><div class="nb" style="font-size:28px">Geiger–Müller tube</div><div class="nk">counts ionising radiation</div><div class="ns">each particle is a click; the model sees counts per minute</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">solid-state detectors</div><div class="nk">radiation and X-rays</div><div class="ns">medical devices, security scanning</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">UV sensor</div><div class="nk">sun exposure</div><div class="ns">wearables, weather stations</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:72ch">The point is not the physics. It is that Class 10's chain still holds: transducer, conditioning, ADC, bytes. Once you can read one datasheet, you can read these.</p>
  </div>
  <div class="cue">Two minutes only; it is in the prescribed list but rarely in student projects.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Electronic nose" data-act="environmental and chemical">
  <div>
    <div class="kicker">chemical · try it live</div>
    <h2>One cheap gas sensor reacts to almost everything. Three can tell smells apart.</h2>
    <div class="panel enose">
      <div class="crow"><span class="cl">smell</span><span class="cb"><button data-k="0">clean air</button><button data-k="1" class="sel">alcohol</button><button data-k="2">cooking smoke</button><button data-k="3">cleaning spray</button><button data-k="4">LPG leak</button></span></div>
      <svg viewBox="0 0 1240 270" width="100%" class="nose"></svg>
      <div class="ever" style="font-size:22px;font-weight:600;color:var(--ink);margin-top:8px"></div>
    </div>
  </div>
  <div class="cue">Illustrative responses, not measured. Metal-oxide (MOX) sensors change resistance in the presence of many gases: that cross-sensitivity is a weakness for one sensor and a feature for several, because a classifier can learn the pattern. This is "combining features and sensors" from Unit III.</div>
</section>

    <div class="split frag" style="gap:24px">
      <div class="rem"><div class="h">temperature and humidity</div><ul><li>The board heats its own sensor. Mount it away from the chip, or the S3 measures itself (Class 10's internal sensor).</li></ul></div>
      <div class="rem green"><div class="h">what ML has to cope with</div><ul><li>A model trained in week 1 sees a different baseline in month 6. Recalibrate, or learn relative change rather than raw values.</li></ul></div>
    </div>
  </div>
  <div class="cue">Class 6's data drift, physically. Particulate (PM2.5) sensors also read high in humid air; NDIR CO₂ sensors are more stable but use more power. Exact warm-up times are in each datasheet.</div>
</section>

    <p class="frag" style="margin-top:18px;max-width:74ch">This is Class 3's watch cascade in sensor terms: cheap, always-on PPG screens; careful ECG confirms. And Class 9's fairness point made concrete: a model inherits its sensor's biases.</p>

<section class="slide" data-t="Environmental and chemical" data-act="environmental and chemical">
  <div>
    <h2>The slow sensors, and what each needs from you.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:26%">sensor</th><th style="width:30%">measures</th><th>watch out for</th></tr>
      <tr class="frag"><td>temperature + humidity</td><td>air conditions</td><td>self-heating from the board; slow response</td></tr>
      <tr class="frag"><td>MOX gas</td><td>changes in many gases at once</td><td>warm-up, drift, cross-sensitivity</td></tr>
      <tr class="frag"><td>NDIR CO₂</td><td>carbon dioxide specifically</td><td>more power and size</td></tr>
      <tr class="frag"><td>particulate (PM2.5)</td><td>dust and smoke particles</td><td>humidity inflates readings</td></tr>
      <tr class="frag"><td>pH, conductivity probes</td><td>water chemistry</td><td>regular calibration in known solutions</td></tr>
    </table>
    <p class="frag" style="margin-top:18px;max-width:72ch">Many of these sample once every few seconds or minutes. The ML is often simple; the hard part is <strong>trusting the numbers</strong> over months.</p>
  </div>
  <div class="cue">Link back to BLERP's E and R: a soil or water sensor on a farm runs for months on a battery with no network. Slow sensors suit duty cycling (Class 10).</div>
</section>

<section class="slide" data-t="Five datasheet traps" data-act="datasheet exercise">
  <div>
    <h2>Five traps on almost every datasheet.</h2>
    <div class="stack" style="max-width:1200px">
      <div class="rem red"><div class="h">1 · "typical" is not a promise</div><ul><li>Design for the min and max columns. Typical is what an average part does on a good day.</li></ul></div>
      <div class="rem red"><div class="h">2 · absolute maximum ≠ operating</div><ul><li>Absolute maximum ratings are where the part gets damaged. Use the recommended operating conditions.</li></ul></div>
      <div class="rem red"><div class="h">3 · read the test conditions</div><ul><li>"At 25 °C, 3.3 V, after 48 h burn-in." Your device is not in that lab.</li></ul></div>
      <div class="rem red"><div class="h">4 · units hide meaning</div><ul><li>LSB per g, dBFS, %RH, ppm, kΩ in clean air. Convert before you compare two parts.</li></ul></div>
      <div class="rem red"><div class="h">5 · the graph says more than the table</div><ul><li>Response versus temperature, humidity, time. The drift lives in the curves.</li></ul></div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.rdp')||e.target.closest('.enose')||e.target.closest('.timer'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  var RDT={empty:'Empty room: only the line of things that do not move (walls, furniture) at zero velocity.',walk:'Person walking towards the radar: a bright blob at about 3 m and 1 m/s, smeared sideways by swinging arms and legs.',sit:'Person sitting still: almost at zero velocity, but a faint spread from breathing. A camera would need them to move; radar does not.',fan:'A ceiling fan: blades moving both ways at once. A naive "motion = person" rule fires here.'};
  function rdShow(p,k){ p.querySelectorAll('.rdimg img').forEach(function(i){ i.style.display=i.dataset.k===k?'':'none'; }); var t=p.closest('.slide').querySelector('.rdinfo'); if(t) t.textContent=RDT[k]; }
  deck.querySelectorAll('.rdp').forEach(function(p){ rdShow(p,'walk'); });
  var EN=[{n:'clean air',v:[0.05,0.06,0.05]},{n:'alcohol',v:[0.78,0.22,0.62]},{n:'cooking smoke',v:[0.74,0.70,0.15]},{n:'cleaning spray',v:[0.76,0.42,0.30]},{n:'LPG leak',v:[0.77,0.86,0.80]}];
  var EC=['#23408f','#146b5c','#b06a12'];
  function enDraw(p){
    var k=+p.querySelector('.cb .sel').dataset.k, e=EN[k];
    var o='<text x="20" y="20" font-size="13" fill="#8b9096">ONE SENSOR</text><text x="360" y="20" font-size="13" fill="#8b9096">THREE DIFFERENT SENSORS · A FINGERPRINT</text><line x1="300" y1="30" x2="300" y2="250" stroke="#e2e0d9"/>';
    o+='<line x1="20" y1="230" x2="260" y2="230" stroke="#c6c3ba"/><rect x="90" y="'+(230-e.v[0]*190)+'" width="100" height="'+(e.v[0]*190)+'" rx="4" fill="#23408f"/><text x="140" y="254" font-size="14" fill="#8b9096" text-anchor="middle">sensor 1</text>';
    o+='<line x1="360" y1="230" x2="1220" y2="230" stroke="#c6c3ba"/>';
    for(var j=0;j<3;j++){ var x=420+j*270; o+='<rect x="'+x+'" y="'+(230-e.v[j]*190)+'" width="100" height="'+(e.v[j]*190)+'" rx="4" fill="'+EC[j]+'"/><text x="'+(x+50)+'" y="254" font-size="14" fill="#8b9096" text-anchor="middle">sensor '+(j+1)+'</text>'; }
    p.querySelector('.nose').innerHTML=o;
    p.querySelector('.ever').textContent = k===0 ? 'Clean air: all low. Easy.' : 'Sensor 1 alone reads about '+Math.round(e.v[0]*100)+'% for every smell. The three-sensor pattern is different for '+e.n+': a classifier can learn it.';
  }
  deck.querySelectorAll('.enose').forEach(enDraw);
  document.addEventListener('click',function(e){
    var b=e.target.closest('.rdp button,.enose button'); if(!b) return; b.blur();
    b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel');
    var p=b.closest('.rdp,.enose'); if(p.classList.contains('rdp')) rdShow(p,b.dataset.k); else enDraw(p);
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
