<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 21 · DSP Algorithms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 21 */
pre{font-size:14.5px;line-height:1.36}
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.fil,.lk{padding:14px 22px}
.fil .cb button.sel,.lk .cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.finfo,.lkinfo{font-size:19px;margin-top:4px;min-height:30px}
.big-n.red{color:var(--fail)}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 21</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 21 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 21 · unit III · digital signal processing algorithms</div>
    <h1>The DSP toolbox,<br>opened properly.</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Class 8 showed what a spectrum is. Today: the half-dozen algorithms that clean, sharpen and summarise a stream before any model sees it, and what each one costs on the board.</p>
  </div>
  <div class="cue">Theory runs to slide 13; the lab is one block at the end (slides 14 to 17). INMP441 wiring as before. Students need a phone with any free tone-generator app or website for Part B (or they can whistle).</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>1-second window, 30 ms model, answer within 200 ms.</h2>
    <table class="dt txt" style="width:100%;max-width:1150px">
      <tr><th style="width:26%">choice</th><th>worst case = hop + compute + smoothing</th><th style="width:16%">verdict</th></tr>
      <tr class="frag"><td>hop 50 ms, smooth 2</td><td>50 + 30 + 100 = 180 ms</td><td style="color:var(--ok)">fits</td></tr>
      <tr class="frag"><td>hop 100 ms, smooth 1</td><td>100 + 30 + 100 = 230 ms</td><td style="color:var(--fail)">too slow</td></tr>
      <tr class="frag"><td>hop 20 ms, smooth 3</td><td>20 + 30 + 60 = 110 ms, but 30 ms of compute every 20 ms</td><td style="color:var(--fail)">falls behind</td></tr>
    </table>
    <p class="frag" style="margin-top:18px;max-width:72ch">Every millisecond counts, which is why the front end has to be cheap. Today's algorithms are how.</p>
  </div>
  <div class="cue">The third row is the trap: it looks fastest on paper but cannot keep up (Class 20's hook).</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Count the whistles" data-act="the hook">
  <div>
    <div class="kicker">the hook · the Chef project's twist</div>

<!-- 04 -->
<section class="slide" data-t="The toolbox" data-act="the toolbox">
  <div>
    <h2>Six tools, each answering one question about a stream.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="ntile frag"><div class="nb" style="font-size:28px">IIR filters</div><div class="ns">keep the frequencies I care about; throw away drift, hum, hiss</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">envelope</div><div class="ns">when does something start and stop?</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">window functions</div><div class="ns">make the FFT honest about which frequency it saw</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">Goertzel</div><div class="ns">how strong is one frequency, cheaply?</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">autocorrelation</div><div class="ns">does the signal repeat, and how often?</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">resampling</div><div class="ns">can I use fewer samples without losing the answer?</div></div>
    </div>
  </div>
  <div class="cue">Class 8 covered sampling, aliasing, the moving-average filter, the FFT, spectrograms and mel bands. Everything on this slide is new, and each tool earns its place by being cheap enough to run on every frame.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="FIR and IIR" data-act="filters">
  <div>
    <h2>Two families of filter: one remembers inputs, one remembers its own output.</h2>
    <div class="split" style="gap:26px">
      <div class="panel frag"><span class="lab" style="color:var(--accent)">FIR · finite impulse response</span><p style="font-family:var(--mono);font-size:21px">y[n] = b₀x[n] + b₁x[n−1] + … + b<sub>N</sub>x[n−N]</p><p class="small">Class 8's moving average is one. Always stable, predictable delay. Sharp filters need many taps: many multiply-adds per sample.</p></div>
      <div class="panel frag"><span class="lab" style="color:var(--ok)">IIR · infinite impulse response</span><p style="font-family:var(--mono);font-size:21px">y[n] = y[n−1] + α · (x[n] − y[n−1])</p><p class="small">Feeds its own output back. One line of code, two operations, does the work of a long FIR. Must be designed carefully or it can ring or blow up.</p></div>
    </div>
    <p class="frag" style="margin-top:20px;max-width:76ch">On a microcontroller the workhorse is the <strong>biquad</strong>: an IIR with five numbers, about nine operations per sample. Chain two or three for a sharper filter.</p>
  </div>
  <div class="cue">The one-line IIR is the "exponential moving average". α between 0 and 1 sets the cutoff: small α, slow and smooth. It is the filter in Class 13's complementary filter and in today's lab.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Three filters every pipeline uses" data-act="filters">
  <div>
    <h2>Three filters you will meet in almost every edge pipeline.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:22%">filter</th><th style="width:30%">one line of code</th><th>why</th></tr>
      <tr class="frag"><td>DC removal (high-pass)</td><td style="font-family:var(--mono)">dc += 0.005·(x − dc); y = x − dc</td><td>microphone offset; gravity in an accelerometer when you only want motion</td></tr>
      <tr class="frag"><td>pre-emphasis</td><td style="font-family:var(--mono)">y = x[n] − 0.97·x[n−1]</td><td>speech has weak high frequencies; lift them before the spectrogram</td></tr>
      <tr class="frag"><td>anti-alias low-pass</td><td style="font-family:var(--mono)">a biquad below half the new rate</td><td>always before throwing samples away (slide 12), or high frequencies fold down (Class 8)</td></tr>
    </table>
  </div>
  <div class="cue">0.97 is the classic speech pre-emphasis coefficient. The DC-removal α of 0.005 at 16 kHz gives a cutoff of roughly 13 Hz: well below any voice. Today's lab uses the first one.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Window functions" data-act="the spectrum, honestly">
  <div>
    <div class="kicker">try it live · a pure tone into a 64-point FFT · 125 Hz per bin</div>
    <h2>Chop a wave mid-cycle and the FFT smears it. A window function fixes most of it.</h2>
    <div class="panel lk">
      <div class="crow" style="grid-template-columns:150px 1fr 120px;gap:16px"><span class="cl">tone</span><input type="range" class="lkf" min="1000" max="1250" step="5" value="1060"><span class="num lkfv"></span></div>
      <div class="crow" style="grid-template-columns:150px 1fr"><span class="cl">window</span><span class="cb"><button data-w="rect" class="sel">none (rectangular)</button><button data-w="hann">Hann</button></span></div>
      <svg viewBox="0 0 1300 280" width="100%" class="lksvg"></svg>
      <div class="lkinfo"></div>
    </div>
  </div>
  <div class="cue">Set the tone to exactly 1000 or 1125 Hz: it sits on a bin and both windows look clean. Anything in between spreads energy into every bin ("leakage"), which can hide a quiet tone next to a loud one. The Hann window tapers the frame's ends to zero: the peak gets a little wider but the skirts drop far lower. Every spectrogram you used in Class 8 applied one.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Goertzel: one frequency, cheaply" data-act="the spectrum, honestly">
  <div>
    <div class="kicker">try it live · how many frequencies do you actually need?</div>
    <h2>Goertzel: the FFT's answer for one frequency, for a fraction of the work.</h2>
    <div class="split" style="grid-template-columns:.8fr 1.2fr;gap:24px;align-items:start">
      <pre style="font-size:15px"><span class="k">float</span> c = <span class="s">2</span> * cos(<span class="s">2</span> * PI * f / fs);
<span class="k">float</span> s1 = <span class="s">0</span>, s2 = <span class="s">0</span>;
<span class="k">for</span> (<span class="k">int</span> n = <span class="s">0</span>; n &lt; N; n++) {
  <span class="k">float</span> s0 = x[n] + c * s1 - s2;
  s2 = s1;  s1 = s0;
}
power = s1*s1 + s2*s2 - c*s1*s2;</pre>
      <div class="panel calc gz">
        <div class="crow" style="grid-template-columns:200px 1fr 80px;gap:14px"><span class="cl">frequencies wanted</span><input type="range" class="gk" min="1" max="40" step="1" value="1"><span class="num gkv"></span></div>
        <div class="cbar" style="grid-template-columns:200px 1fr 150px"><span class="cl">512-point real FFT</span><div class="ctrack"><div class="cfill gfft"></div></div><span class="cpct gfftv"></span></div>
        <div class="cbar" style="grid-template-columns:200px 1fr 150px"><span class="cl">Goertzel × k · 320 samples</span><div class="ctrack"><div class="cfill ggz"></div></div><span class="cpct ggzv"></span></div>
        <div class="cverdict"></div>
      </div>
    </div>
  </div>
  <div class="cue">Counts are rough: a 512-point FFT of real audio is about 2.5·N·log₂N ≈ 11,500 operations (the figure Class 19 rounded to 10,000); Goertzel is about 3 operations per sample per frequency, so about 960 for a 320-sample frame. The crossover is around 12 frequencies. Touch-tone (DTMF) phone keypads were decoded with Goertzel for decades: 8 frequencies. One whistle, one hum, one motor speed: Goertzel.</div>
</section>

<section class="slide" data-t="Lab A: clap counter" data-act="lab">
  <div class="split" style="grid-template-columns:1.5fr .5fr;align-items:center">
    <pre><span class="c">// Part A · DC removal + envelope + threshold = a clap counter</span>
<span class="k">#include</span> <span class="s">&lt;ESP_I2S.h&gt;</span>
I2SClass i2s;
<span class="k">const int</span> N = <span class="s">160</span>;                    <span class="c">// 10 ms blocks</span>
<span class="k">static int32_t</span> raw[N];
<span class="k">float</span> dc = <span class="s">0</span>, env = <span class="s">0</span>;
<span class="k">const float</span> CLAP_T = <span class="s">0.05</span>;          <span class="c">// ← tune from the plotter</span>
<span class="k">int</span> claps = <span class="s">0</span>;  <span class="k">uint32_t</span> lastClap = <span class="s">0</span>;

<span class="k">void</span> <span class="f">setup</span>() {
  Serial.begin(<span class="s">115200</span>);
  i2s.setPins(<span class="s">15</span>, <span class="s">16</span>, -<span class="s">1</span>, <span class="s">17</span>);
  i2s.begin(I2S_MODE_STD, <span class="s">16000</span>, I2S_DATA_BIT_WIDTH_32BIT, I2S_SLOT_MODE_MONO);
}

<span class="k">void</span> <span class="f">loop</span>() {
  i2s.readBytes((<span class="k">char</span>*)raw, <span class="k">sizeof</span>(raw));
  <span class="k">float</span> peak = <span class="s">0</span>;
  <span class="k">for</span> (<span class="k">int</span> k = <span class="s">0</span>; k &lt; N; k++) {
    <span class="k">float</span> x = (raw[k] &gt;&gt; <span class="s">8</span>) / <span class="s">8388608.0</span>;
    dc += <span class="s">0.005</span> * (x - dc);                  <span class="c">// IIR low-pass tracks the offset</span>
    peak = fmaxf(peak, fabsf(x - dc));       <span class="c">// x − dc is the high-passed signal</span>
  }
  env = fmaxf(peak, env * <span class="s">0.85</span>);            <span class="c">// fast attack, slow release</span>
  <span class="k">if</span> (env &gt; CLAP_T &amp;&amp; millis() - lastClap &gt; <span class="s">300</span>) {   <span class="c">// 300 ms refractory gap</span>
    claps++;  lastClap = millis();
    rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">0</span>, <span class="s">40</span>);
  } <span class="k">else if</span> (millis() - lastClap &gt; <span class="s">100</span>) rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, <span class="s">0</span>, <span class="s">0</span>);
  Serial.printf(<span class="s">"env:%.3f,thresh:%.3f,claps:%d\n"</span>, env, CLAP_T, claps);
}</pre>
    <div class="stack">
      <div class="kicker">lab · part A</div>
      <h2>Clap five times. Did it count five?</h2>
      <p class="small">Raise CLAP_T until talking never counts. Can claps still get through?</p>
      <p class="small">Clap twice fast. What does the 300 ms gap do?</p>
    </div>
  </div>
  <div class="cue">In the Serial Plotter the claps line climbs in steps; switch to the Serial Monitor to read the count. The envelope here works per 10 ms block (peak of each block) to stay cheap; a per-sample envelope is smoother but costs a little more. 0.85 per block sets the release: lower is faster.</div>
</section>

<!-- 16 -->
<section class="slide" data-t="Lab B and C: one tone" data-act="lab">
  <div class="split" style="grid-template-columns:1.5fr .5fr;align-items:center">
    <pre><span class="c">// Part B · add above setup(); replace loop() with this</span>
<span class="k">const int</span> M = <span class="s">320</span>;  <span class="k">static int32_t</span> buf[M];  <span class="k">float</span> x[M];
<span class="k">const float</span> TARGET = <span class="s">1000</span>;                    <span class="c">// ← Hz to listen for</span>

<span class="k">float</span> <span class="f">goertzel</span>(<span class="k">const float</span>* v, <span class="k">int</span> n, <span class="k">float</span> f) {
  <span class="k">float</span> c = <span class="s">2</span> * cosf(<span class="s">2</span> * PI * f / <span class="s">16000</span>), s1 = <span class="s">0</span>, s2 = <span class="s">0</span>;
  <span class="k">for</span> (<span class="k">int</span> k = <span class="s">0</span>; k &lt; n; k++) { <span class="k">float</span> s0 = v[k] + c * s1 - s2; s2 = s1; s1 = s0; }
  <span class="k">return</span> s1 * s1 + s2 * s2 - c * s1 * s2;
}

<span class="k">void</span> <span class="f">loop</span>() {
  i2s.readBytes((<span class="k">char</span>*)buf, <span class="k">sizeof</span>(buf));
  <span class="k">float</span> m = <span class="s">0</span>, e = <span class="s">0</span>;
  <span class="k">for</span> (<span class="k">int</span> k = <span class="s">0</span>; k &lt; M; k++) { x[k] = (buf[k] &gt;&gt; <span class="s">8</span>) / <span class="s">8388608.0</span>; m += x[k]; }
  m /= M;
  <span class="k">for</span> (<span class="k">int</span> k = <span class="s">0</span>; k &lt; M; k++) { x[k] -= m; e += x[k] * x[k]; }
  <span class="k">uint32_t</span> t = micros();
  <span class="k">float</span> p = goertzel(x, M, TARGET);
  t = micros() - t;                                  <span class="c">// Part C: the cost</span>
  <span class="k">float</span> share = p / (M * e / <span class="s">2</span> + <span class="s">1e-12</span>);           <span class="c">// ≈ 1 for a pure tone at TARGET</span>
  rgbLedWrite(RGB_BUILTIN, <span class="s">0</span>, share &gt; <span class="s">0.4</span> ? <span class="s">40</span> : <span class="s">0</span>, <span class="s">0</span>);
  Serial.printf(<span class="s">"share:%.2f,us:%u\n"</span>, share, t);
}</pre>
    <div class="stack">
      <div class="kicker">lab · parts B and C</div>
      <h2>Play 1,000 Hz. Then 1,050. Then 1,500.</h2>
      <p class="small">320 samples gives 50 Hz resolution. Does 1,050 Hz still light it?</p>
      <p class="small">Part C: note the microseconds. How many frequencies fit in a 20 ms frame?</p>
    </div>
  </div>
  <div class="cue">"share" is the fraction of the frame's energy at the target frequency: near 1 for a clean tone, near 0 for speech or noise. Tones half a bin away (25 Hz) still score fairly high; two bins away they fall sharply. Expect tens of microseconds per call on the S3; check the number your board reports.</div>
</section>

    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if(t==='INPUT'||t==='TEXTAREA') return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.timer')||e.target.closest('pre'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  /* filter explorer */
  var FS=16000, FSIG=[]; (function(){ var seed=3, last=0; function r(){ seed=(seed*16807)%2147483647; return seed/2147483647-0.5; }
    for(var k=0;k<4800;k++){ var t=k/FS, w=r(); FSIG.push(0.45*Math.sin(2*Math.PI*3*t+1)+0.35*Math.sin(2*Math.PI*300*t)+0.5*(w-last)); last=w; } })();
  function coefs(type,fc){
    var w0=2*Math.PI*fc/FS;
    if(type==='lp'){ var a=1-Math.exp(-w0); return {b:[a,0,0],a:[1,-(1-a),0],ops:3}; }
    if(type==='hp'){ var be=Math.exp(-w0); return {b:[be,-be,0],a:[1,-be,0],ops:4}; }
    var Q=2, al=Math.sin(w0)/(2*Q), a0=1+al; return {b:[al/a0,0,-al/a0],a:[1,-2*Math.cos(w0)/a0,(1-al)/a0],ops:9};
  }
  function resp(c,f){ var w=2*Math.PI*f/FS, nr=0, ni=0, dr=0, di=0;
    for(var k=0;k<3;k++){ nr+=c.b[k]*Math.cos(-k*w); ni+=c.b[k]*Math.sin(-k*w); dr+=c.a[k]*Math.cos(-k*w); di+=c.a[k]*Math.sin(-k*w); }
    return Math.sqrt((nr*nr+ni*ni)/(dr*dr+di*di)); }
  function filDraw(p){
    var type=p.querySelector('.cb button.sel').dataset.ft, sv=+p.querySelector('.fc').value, fc=Math.round(10*Math.pow(10,sv/100*Math.log10(400)));
    p.querySelector('.fcv').textContent=fc+' Hz';
    var c=coefs(type,fc);
    function FX(f){ return 50+(Math.log10(f)-1)/(Math.log10(8000)-1)*570; } function FY(g){ var db=20*Math.log10(g+1e-6); return 30+Math.min(1,Math.max(0,-db/40))*190; }
    var o='';
    [10,100,1000,8000].forEach(function(f){ o+='<line x1="'+FX(f)+'" y1="30" x2="'+FX(f)+'" y2="220" stroke="#e2e0d9"/><text x="'+FX(f)+'" y="242" font-size="13" text-anchor="middle" fill="#8b9096">'+(f>=1000?(f/1000)+' kHz':f+' Hz')+'</text>'; });
    [0,-20,-40].forEach(function(db){ var y=30+(-db/40)*190; o+='<text x="44" y="'+(y+5)+'" font-size="12" text-anchor="end" fill="#8b9096">'+db+' dB</text>'; });
    [[3,'drift','#8b9096'],[300,'tone','#146b5c'],[5000,'hiss','#b06a12']].forEach(function(m){ var mf=Math.max(m[0],13); o+='<rect x="'+(FX(mf)-14)+'" y="30" width="28" height="190" fill="'+m[2]+'" opacity=".1"/><text x="'+FX(mf)+'" y="22" font-size="13" text-anchor="middle" fill="'+m[2]+'" font-weight="700">'+(m[0]<10?'drift · 3 Hz':m[1])+'</text>'; });
    var d=''; for(var q=0;q<=160;q++){ var f=Math.pow(10,1+q/160*(Math.log10(8000)-1)); d+=(q?'L':'M')+FX(f).toFixed(1)+' '+FY(resp(c,f)).toFixed(1); }
    o+='<path d="'+d+'" fill="none" stroke="#23408f" stroke-width="3"/>';
    p.querySelector('.frsp').innerHTML=o;
    var y=[], x1=0,x2=0,y1=0,y2=0;
    for(var k=0;k<FSIG.length;k++){ var x0=FSIG[k], y0=c.b[0]*x0+c.b[1]*x1+c.b[2]*x2-c.a[1]*y1-c.a[2]*y2; x2=x1;x1=x0;y2=y1;y1=y0; y.push(y0); }
    var st=FSIG.length-960, o2='<line x1="0" y1="125" x2="640" y2="125" stroke="#e2e0d9"/>', da='', db2='';
    for(var k2=0;k2<960;k2+=2){ var X=k2/960*640; da+=(k2?'L':'M')+X.toFixed(1)+' '+(125-FSIG[st+k2]*95).toFixed(1); db2+=(k2?'L':'M')+X.toFixed(1)+' '+(125-y[st+k2]*95).toFixed(1); }
    o2+='<path d="'+da+'" fill="none" stroke="#c6c3ba" stroke-width="1.5"/><path d="'+db2+'" fill="none" stroke="#23408f" stroke-width="2"/><text x="4" y="242" font-size="13" fill="#8b9096">60 ms · grey in, blue out</text>';
    p.querySelector('.ftim').innerHTML=o2;
    var keep=[[3,'drift'],[300,'tone'],[5000,'hiss']].filter(function(m){ return resp(c,m[0])>0.5; }).map(function(m){return m[1];});
    p.querySelector('.finfo').innerHTML='Passes: <strong>'+(keep.length?keep.join(', '):'almost nothing')+'</strong> · about '+c.ops+' operations per sample, '+(c.ops*16)+' thousand a second at 16 kHz.';
  }
  deck.querySelectorAll('.fil').forEach(function(p){ filDraw(p); p.querySelector('.fc').addEventListener('input',function(){filDraw(p);}); });
  /* leakage */
  function lkDraw(p){
    var f=+p.querySelector('.lkf').value, w=p.querySelector('.cb button.sel').dataset.w, N=64, fs=8000; p.querySelector('.lkfv').textContent=f+' Hz';
    var x=[]; for(var n=0;n<N;n++){ var win= w==='hann'? 0.5-0.5*Math.cos(2*Math.PI*n/(N-1)) : 1; x.push(Math.sin(2*Math.PI*f*n/fs)*win); }
    var mags=[]; for(var b=0;b<=32;b++){ var re=0,im=0; for(var n2=0;n2<N;n2++){ re+=x[n2]*Math.cos(2*Math.PI*b*n2/N); im-=x[n2]*Math.sin(2*Math.PI*b*n2/N); } mags.push(Math.sqrt(re*re+im*im)); }
    var mx=Math.max.apply(null,mags), o='';
    for(var b2=0;b2<=32;b2++){ var db=20*Math.log10(mags[b2]/mx+1e-9), h=Math.max(0,(db+70)/70)*200, X=60+b2*37;
      o+='<rect x="'+X+'" y="'+(220-h)+'" width="28" height="'+h+'" rx="3" fill="'+(db>-6?'#23408f':'#b06a12')+'" opacity=".85"/>'; if(b2%4===0) o+='<text x="'+(X+14)+'" y="242" font-size="12" text-anchor="middle" fill="#8b9096">'+(b2*125)+'</text>'; }
    [0,-35,-70].forEach(function(db){ o+='<text x="50" y="'+(220-(db+70)/70*200+5)+'" font-size="12" text-anchor="end" fill="#8b9096">'+db+' dB</text>'; });
    o+='<text x="680" y="270" font-size="13" text-anchor="middle" fill="#4b5057">frequency (Hz) · each bar is one FFT bin</text>';
    p.querySelector('.lksvg').innerHTML=o;
    var leak=0; mags.forEach(function(m){ if(20*Math.log10(m/mx+1e-9)>-40) leak++; });
    p.querySelector('.lkinfo').innerHTML=(f%125===0?'Exactly on a bin. ':'Between bins. ')+'<strong>'+leak+'</strong> of 33 bins within 40 dB of the peak'+(leak>6?': energy has leaked everywhere.':'.');
  }
  deck.querySelectorAll('.lk').forEach(function(p){ lkDraw(p); p.querySelector('.lkf').addEventListener('input',function(){lkDraw(p);}); });
  /* goertzel cost */
  function gzDraw(p){
    var k=+p.querySelector('.gk').value, fft=Math.round(2.5*512*9), gz=k*3*320; p.querySelector('.gkv').textContent=k;
    var mx=Math.max(fft,gz);
    p.querySelector('.gfft').style.width=(fft/mx*100)+'%'; p.querySelector('.gfftv').textContent=fft.toLocaleString('en-IN')+' ops';
    var g=p.querySelector('.ggz'); g.style.width=(gz/mx*100)+'%'; g.classList.toggle('over',gz>fft); p.querySelector('.ggzv').textContent=gz.toLocaleString('en-IN')+' ops';
    var v=p.querySelector('.cverdict'); v.style.color= gz<fft?'var(--ok)':'var(--fail)';
    v.textContent= gz<fft? 'Goertzel wins: '+(fft/gz).toFixed(1)+'× less work for '+k+' frequenc'+(k===1?'y':'ies')+'.' : 'Now the FFT wins: it gets every frequency for less.';
  }
  deck.querySelectorAll('.gz').forEach(function(p){ gzDraw(p); p.querySelector('.gk').addEventListener('input',function(){gzDraw(p);}); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.fil .cb button, .lk .cb button'); if(!b) return; b.blur();
    b.parentNode.querySelectorAll('button').forEach(function(q){q.classList.remove('sel');}); b.classList.add('sel');
    var p=b.closest('.fil'); if(p) filDraw(p); else lkDraw(b.closest('.lk'));
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
