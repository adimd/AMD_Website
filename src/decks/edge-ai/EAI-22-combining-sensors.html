<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 22 · Combining Features and Sensors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* class 3 */
.rhead,.rrow{display:grid;grid-template-columns:170px 1fr 44px 1fr 44px 300px;align-items:center;gap:0}
.rhead span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:0 0 8px 4px}
.rrow{margin-top:12px}
.rlab{font-family:var(--mono);font-size:14px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.rc{background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:12px 22px;font-size:20px;color:var(--ink);text-align:center}
.rc.rr{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-family:var(--mono);font-weight:700}
.rarr{text-align:center;font-size:26px;color:var(--soft)}
.siggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sigp{padding:14px 18px}
.sigp svg{display:block;width:100%;height:auto}
.sigp .rate{font-family:var(--mono);font-size:13px;color:var(--ink);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px}
.tile .tk{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.tile .tp{font-size:21px;color:var(--ink);font-weight:600;line-height:1.25;margin-top:8px;min-height:52px}
.tile .ts{font-size:15px;color:var(--body);margin-top:6px}
.tile .tl{display:flex;gap:6px;margin-top:12px}
.bl{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule2);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.bl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.ucards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ucard .un{font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.ucard .ut{font-size:20px;font-weight:600;color:var(--ink);margin-top:8px;line-height:1.25}
.ucard .ud{font-size:16px;color:var(--body);margin-top:6px;line-height:1.35}
.timer{display:flex;align-items:center;gap:18px;padding:12px 18px}
.timer .tdisp{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--ink);min-width:150px}
.timer.done .tdisp{color:var(--fail)}
.timer button{height:38px;padding:0 16px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--mono);font-size:14px;color:var(--ink);cursor:pointer;margin-left:6px}
.timer button[data-a="go"]{background:var(--accent);border-color:var(--accent);color:#fff}
.wrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:12px}
.wbox{border:2px dashed var(--rule2);border-radius:12px;padding:18px;min-height:300px;background:var(--stage)}
.wbox .wk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.wbox .wq{font-size:18px;color:var(--soft);margin-top:10px;font-style:italic}
.wbox.filled{border:1px solid var(--ok);border-top:5px solid var(--ok);background:var(--card)}
.wbox.filled .wk{color:var(--ok)}
.wbox.filled.blue{border-color:var(--accent)} .wbox.filled.blue .wk{color:var(--accent)}
.wbox .wa{font-size:21px;color:var(--ink);margin-top:12px;line-height:1.35}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 22 */
pre{font-size:13.2px;line-height:1.32}
.num{font-family:var(--mono);font-size:18px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.comb,.tal{padding:14px 22px}
.cbm button.sel,.cdead.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cdead.on{background:var(--fail);border-color:var(--fail)}
.cbstats,.tastats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.cbstats div,.tastats div{border-top:1px solid var(--rule);padding-top:6px;font-size:15px;color:var(--soft)}
.cbstats b,.tastats b{display:block;font-family:var(--mono);font-size:26px;color:var(--ink)}
.ws td{height:46px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 22</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 22 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 22 · unit III · combining features and sensors</div>
    <h1>Two weak clues,<br>one strong answer.</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Every sensor is fooled by something. Two sensors are rarely fooled by the same thing. Today: when to combine sensors, at which stage, and how to keep them in step.</p>
  </div>
  <div class="cue">Theory runs to slide 13; the lab is one block at the end (slides 14 to 17). The lab needs BOTH sensors wired: INMP441 (SCK 15, WS 16, SD 17, L/R to GND) and MPU6050 (SDA 8, SCL 9). Check the Adafruit MPU6050 library is installed on the lab machines.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>One whistle in a noisy kitchen: full FFT or Goertzel?</h2>
    <div class="split" style="gap:24px;margin-top:8px">
      <div class="rem green frag"><div class="h">Goertzel, because</div><ul><li>One frequency costs about ten times less than a whole FFT, in a few lines of code.</li></ul></div>
      <div class="rem frag"><div class="h">switch to an FFT when</div><ul><li>You need many frequencies, the whistle's pitch varies between cookers, or a spectrogram is already being computed for the speech model.</li></ul></div>
    </div>
    <p class="frag" style="margin-top:20px;max-width:72ch">But a kettle or a phone ringtone at the same pitch would still fool it. One clue is rarely enough. Today: add a second one.</p>
  </div>
  <div class="cue">Two minutes. The last line sets up the whole class: a single feature from a single sensor has blind spots.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="One sensor, fooled" data-act="the hook">
  <div>
    <div class="kicker">the hook · a fall detector with only an accelerometer</div>
    <h2>"Big jolt = fall." A week of an elderly user's life:</h2>
    <svg viewBox="0 0 1380 180" width="100%" height="190"><g class="frag"><rect x="20" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="123" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">real fall</text><text x="123" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: YES</text><text x="123" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: yes</text><rect x="58" y="134" width="130" height="26" rx="13" fill="#146b5c"/><text x="123" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">correct</text></g><g class="frag"><rect x="246" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="349" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">phone on the bed</text><text x="349" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: YES</text><text x="349" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: no</text><rect x="284" y="134" width="130" height="26" rx="13" fill="#a8231f"/><text x="349" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">false alarm</text></g><g class="frag"><rect x="472" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="575" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">sat down hard</text><text x="575" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: YES</text><text x="575" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: no</text><rect x="510" y="134" width="130" height="26" rx="13" fill="#a8231f"/><text x="575" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">false alarm</text></g><g class="frag"><rect x="698" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="801" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">jumped off a step</text><text x="801" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: YES</text><text x="801" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: no</text><rect x="736" y="134" width="130" height="26" rx="13" fill="#a8231f"/><text x="801" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">false alarm</text></g><g class="frag"><rect x="924" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="1027" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">walking</text><text x="1027" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: no</text><text x="1027" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: no</text><rect x="962" y="134" width="130" height="26" rx="13" fill="#146b5c"/><text x="1027" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">correct</text></g><g class="frag"><rect x="1150" y="20" width="206" height="150" rx="12" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.6"/><text x="1253" y="60" font-size="17" text-anchor="middle" font-weight="700" fill="#15171b">slow slump fall</text><text x="1253" y="98" font-size="14" text-anchor="middle" fill="#4b5057">alarm: no</text><text x="1253" y="122" font-size="14" text-anchor="middle" fill="#4b5057">really a fall: yes</text><rect x="1188" y="134" width="130" height="26" rx="13" fill="#a8231f"/><text x="1253" y="152" font-size="14" text-anchor="middle" fill="#fff" font-weight="700">missed</text></g></svg>
    <p class="frag" style="margin-top:14px;max-width:76ch">Three false alarms and one miss from a single feature. What else could the device check: how it lies afterwards, whether there was a thud, whether the person then moves? Each is a second clue.</p>
  </div>
  <div class="cue">Illustrative scenarios, not data. Ask the class to propose a second clue for each red card before you go on. Typical answers: orientation after the jolt (lying flat for 10 s), a microphone thud, no movement afterwards, heart rate. That list is sensor fusion.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Why fuse" data-act="why fuse">
  <div>
    <h2>Three reasons to combine sensors.</h2>
    <div class="ucards" style="grid-template-columns:repeat(3,1fr)">
      <div class="ucard frag"><div class="un">complementary</div><div class="ut">each covers the other's blind spot</div><div class="ud">Earbuds pair a microphone with a small accelerometer that feels your jaw vibrate: it knows you are the one speaking, even in a noisy street.</div></div>
      <div class="ucard frag"><div class="un">redundant</div><div class="ut">two views of the same thing</div><div class="ud">Cars use radar and camera to see the same obstacle: if one is blinded by fog or glare, the other still answers.</div></div>
      <div class="ucard frag"><div class="un">coverage</div><div class="ut">more of the world at once</div><div class="ud">A phone's GPS knows where you are outdoors; its IMU keeps the position going in a tunnel.</div></div>
    </div>
    <p class="frag" style="margin-top:22px;max-width:76ch">Fusion costs power, wiring, synchronisation and calibration. Add the second sensor only when one sensor, however well tuned, cannot get the answer right.</p>
  </div>
  <div class="cue">"Cheapest thing first" from Unit I still applies: tune the single sensor and its features before adding hardware. The earbud example: many earbuds use a voice-pickup accelerometer; exact designs vary by product.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Three places to fuse" data-act="levels of fusion">
  <div>
    <h2>You can combine sensors at three stages of the pipeline.</h2>
    <svg viewBox="0 0 1350 450" width="100%" height="450"><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><g class="frag"><text x="0" y="30" font-size="15" fill="#23408f" font-weight="700">EARLY · raw data</text><rect x="0" y="44" width="140" height="40" rx="9" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.8"/><text x="70.0" y="70.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">microphone</text><rect x="0" y="96" width="140" height="40" rx="9" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.8"/><text x="70.0" y="122.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">IMU</text><line x1="144" y1="64" x2="226" y2="88" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><line x1="144" y1="116" x2="226" y2="94" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="230" y="64" width="220" height="52" rx="9" fill="#eaeef7" stroke="#23408f" stroke-width="1.8"/><text x="340.0" y="96.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">align + stack raw</text><line x1="454" y1="90" x2="546" y2="90" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="550" y="64" width="200" height="52" rx="9" fill="#ffffff" stroke="#23408f" stroke-width="1.8"/><text x="650.0" y="96.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">features</text><line x1="754" y1="90" x2="846" y2="90" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="850" y="64" width="200" height="52" rx="9" fill="#ffffff" stroke="#23408f" stroke-width="1.8"/><text x="950.0" y="96.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">one model</text><line x1="1054" y1="90" x2="1146" y2="90" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="1150" y="64" width="190" height="52" rx="9" fill="#ffffff" stroke="#23408f" stroke-width="1.8"/><text x="12 l</text><line x1="1054" y1="240" x2="1146" y2="240" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="1150" y="214" width="190" height="52" rx="9" fill="#ffffff" stroke="#146b5c" stroke-width="1.8"/><text x="1245.0" y="246.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">decision</text></g><g class="frag"><text x="0" y="330" font-size="15" fill="#b06a12" font-weight="700">LATE · combine decisions</text><rect x="0" y="344" width="140" height="40" rx="9" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.8"/><text x="70.0" y="370.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">microphone</text><rect x="0" y="396" width="140" height="40" rx="9" fill="#ffffff" stroke="#c6c3ba" stroke-width="1.8"/><text x="70.0" y="422.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">IMU</text><line x1="144" y1="364" x2="226" y2="364" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><line x1="144" y1="416" x2="226" y2="416" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="230" y="344" width="200" height="40" rx="9" fill="#ffffff" stroke="#b06a12" stroke-width="1.8"/><text x="330.0" y="370.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">mic features</text><rect x="230" y="396" width="200" height="40" rx="9" fill="#ffffff" stroke="#b06a12" stroke-width="1.8"/><text x="330.0" y="422.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">IMU features</text><line x1="434" y1="364" x2="546" y2="364" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><line x1="434" y1="416" x2="546" y2="416" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="550" y="344" width="200" height="40" rx="9" fill="#ffffff" stroke="#b06a12" stroke-width="1.8"/><text x="650.0" y="370.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">mic model</text><rect x="550" y="396" width="200" height="40" rx="9" fill="#ffffff" stroke="#b06a12" stroke-width="1.8"/><text x="650.0" y="422.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">IMU model</text><line x1="754" y1="364" x2="846" y2="386" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><line x1="754" y1="416" x2="846" y2="394" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="850" y="364" width="200" height="52" rx="9" fill="#fbf0dc" stroke="#b06a12" stroke-width="1.8"/><text x="950.0" y="396.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">vote: AND / OR</text><line x1="1054" y1="390" x2="1146" y2="390" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><rect x="1150" y="364" width="190" height="52" rx="9" fill="#ffffff" stroke="#b06a12" stroke-width="1.8"/><text x="1245.0" y="396.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">decision</text></g></svg>
  </div>
  <div class="cue">Early fusion: the model sees both raw streams (needs careful alignment and the most data). Feature fusion: each stream gets its own front end (Classes 19 to 21), then one feature vector. Late fusion: separate detectors whose yes/no or scores are combined by a rule. The lab today is late fusion; the course project's shared feature extractor is closer to feature fusion.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Which level?" data-act="levels of fusion">
  <div>
    <h2>Each level trades accuracy against effort.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:24%"></th><th style="width:25%">early</th><th style="width:25%">feature</th><th>late</th></tr>
      <tr class="frag"><td>can learn cross-sensor patterns</td><td>most</td><td>some</td><td>least</td></tr>
      <tr class="frag"><td>training data needed</td><td>most: both sensors, recorded together</td><td>moderate</td><td>least: each detector trained alone</td></tr>
      <tr class="frag"><td>timing precision</td><td>strict: sample-accurate</td><td>window-accurate</td><td>loose: within an event window</td></tr>
      <tr class="frag"><td>if one sensor dies</td><td>the model breaks</td><td>the model breaks, unless trained for it</td><td>keep using the other detector</td></tr>
      <tr class="frag"><td>compute on an MCU</td><td>highest</td><td>moderate</td><td>lowest: two small models and a rule</td></tr>
    </table>
  </div>
  <div class="cue">General tendencies, not laws. On microcontrollers late fusion is the common starting point because it is cheap, debuggable and degrades gracefully; move to feature fusion when the rule cannot capture how the two sensors interact.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Combiner explorer" data-act="late fusion">
  <div>
    <div class="kicker">try it live · 60 events, each scored by a mic detector and an IMU detector · we want only knocks</div>
    <h2>AND, OR, or a weighted vote: move the line, count the mistakes.</h2>
    <div class="panel calc comb split" style="grid-template-columns:1fr 1fr;gap:26px;align-items:center">
      <svg viewBox="0 0 560 500" width="100%" class="cbsvg"></svg>
      <div>
        <div class="cb cbm" style="flex-wrap:wrap"><button data-m="mic">mic only</button><button data-m="imu">IMU only</button><button data-m="and" class="sel">AND</button><button data-m="or">OR</button><button data-m="w">weighted</button></div>
        <div class="crow" style="grid-template-columns:160px 1fr 70px;gap:12px;margin-top:10px"><span class="cl">mic threshold</span><input type="range" class="ct1" min="0" max="100" value="45"><span class="num ct1v"></span></div>
        <div class="crow" style="grid-template-columns:160px 1fr 70px;gap:12px"><span class="cl">IMU threshold</span><input type="range" class="ct2" min="0" max="100" value="45"><span class="num ct2v"></span></div>
        <div class="crow" style="grid-template-columns:160px 1fr 70px;gap:12px"><span class="cl">weight on mic</span><input type="range" class="cw" min="0" max="100" value="50"><span class="num cwv"></span></div>
        <div class="cb" style="margin-top:6px"><button class="cdead">unplug the microphone</button></div>
        <div class="cbstats"></div>
      </div>
    </div>
  </div>
  <div class="cue">Synthetic scores, generated for the slide. Knocks are loud AND shake the table; claps and shouts are loud but do not shake it; bumping the board shakes it silently. AND gives a rectangle in the top right, OR an L shape, weighted a diagonal line (weighted score = w·mic + (1−w)·IMU against the mic threshold). Then unplug the microphone: AND stops detecting anything, OR and IMU-only keep working. That is the robustness row from the last slide.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Are they in step?" data-act="late fusion">
  <div>
    <div class="kicker">try it live · 6 real knocks in 10 seconds, plus claps and footsteps</div>
    <h2>"Both at once" needs a clock. How wide should "at once" be?</h2>
    <div class="panel calc tal">
      <div class="crow" style="grid-template-columns:260px 1fr 110px;gap:16px"><span class="cl">IMU lag behind the mic</span><input type="range" class="to" min="0" max="150" step="5" value="40"><span class="num tov"></span></div>
      <div class="crow" style="grid-template-columns:260px 1fr 110px;gap:16px"><span class="cl">coincidence window</span><input type="range" class="tw" min="10" max="400" step="10" value="30"><span class="num twv"></span></div>
      <svg viewBox="0 0 1300 230" width="100%" class="tasvg"></svg>
      <div class="tastats"></div>
    </div>
  </div>
  <div class="cue">Simulated event times. The IMU's events arrive late because of its own filtering and how often the loop reads it (Class 20's buffers); the lag here is illustrative. Too narrow a window and real knocks are missed because the clocks disagree; too wide and unrelated claps and footsteps pair up by chance. Measure the lag, then set the window just wider than lag plus jitter.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Feature fusion: one vector" data-act="feature fusion">
  <div>
    <h2>Feature fusion: line the features up, scale them, hand one vector to one model.</h2>
    <table class="dt txt" style="width:100%">
      <tr><th style="width:20%">feature</th><th style="width:18%">sensor</th><th style="width:20%">raw value</th><th style="width:20%">standardised</th><th>note</th></tr>
      <tr class="frag"><td>loudness</td><td>microphone</td><td>−22 dBFS</td><td>+1.8</td><td>Class 19</td></tr>
      <tr class="frag"><td>zero-crossing rate</td><td>microphone</td><td>9 per 100</td><td>−0.6</td><td>Class 19</td></tr>
      <tr class="frag"><td>acceleration std</td><td>IMU</td><td>0.9 m/s²</td><td>+2.1</td><td>Class 19, motion</td></tr>
      <tr class="frag"><td>peak jerk</td><td>IMU</td><td>14 m/s³</td><td>+2.4</td><td>change in acceleration</td></tr>
    </table>
    <p class="frag" style="margin-top:16px;max-width:76ch">Two rules: compute every feature over the <strong>same time window</strong> (Class 20), and standardise each with the training set's mean and standard deviation (Class 19), or the feature with the biggest units drowns the rest.</p>
  </div>
  <div class="cue">Illustrative numbers. Jerk is the rate of change of acceleration: a knock or a fall is a sudden change, while slow tilting is not. If the sensors run at different rates, compute each feature over the same 0.5 s window; the number of samples inside differs, the time span must not.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="You have fused before" data-act="feature fusion">
  <div>
    <h2>You already fused two sensors in Class 13.</h2>
    <div class="split" style="grid-template-columns:1fr 1fr;gap:30px;align-items:center">
      <svg viewBox="0 0 820 250" width="100%"><defs><marker id="cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><rect x="0" y="20" width="260" height="60" rx="9" fill="#eaeef7" stroke="#23408f" stroke-width="1.8"/><text x="130.0" y="56.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">gyroscope</text><text x="130" y="104" font-size="14" text-anchor="middle" fill="#4b5057">smooth, but drifts over minutes</text><rect x="0" y="150" width="260" height="60" rx="9" fill="#fbf0dc" stroke="#b06a12" stroke-width="1.8"/><text x="130.0" y="186.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">accelerometer</text><text x="130" y="234" font-size="14" text-anchor="middle" fill="#4b5057">no drift, but jumpy when moving</text><line x1="264" y1="50" x2="476" y2="110" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><line x1="264" y1="180" x2="476" y2="130" stroke="#8b9096" stroke-width="2" marker-end="url(#fa)"/><text x="370" y="66" font-size="14" fill="#23408f" text-anchor="middle" font-weight="700">trust 98%</text><text x="370" y="196" font-size="14" fill="#b06a12" text-anchor="middle" font-weight="700">trust 2%</text><rect x="480" y="90" width="330" height="60" rx="9" fill="#e6f1ee" stroke="#146b5c" stroke-width="1.8"/><text x="645.0" y="126.0" font-size="15" text-anchor="middle" font-weight="700" fill="#15171b">angle</text><text x="645" y="174" font-size="14" text-anchor="middle" fill="#4b5057">smooth AND drift-free</text></svg>
      <div>
        <p class="frag" style="font-family:var(--mono);font-size:21px">angle = 0.98 · (angle + gyro · dt)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ 0.02 · accel_angle</p>
        <p class="frag">The complementary filter: early fusion of two raw streams, each trusted for what it does well. The Kalman filter is its grown-up version: it works out the trust weights from how noisy each sensor is.</p>
      </div>
    </div>
  </div>
  <div class="cue">Recall the Class 13 playground. Weights like 0.98 and 0.02 are the simplest form of a weighted vote: the same idea as the weighted combiner two slides back, applied to raw signals rather than decisions. Kalman filters are named only; they are beyond this course.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="When a sensor fails" data-act="robustness">
  <div>
    <h2>Fusion must survive one sensor going quiet.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="ntile frag"><div class="nb" style="font-size:28px">notice</div><div class="ns">no new data, a value stuck for seconds, readings outside the physical range, an I2C error</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">fall back</div><div class="ns">switch to the remaining sensor with a stricter threshold, accepting more misses</div></div>
      <div class="ntile frag"><div class="nb" style="font-size:28px">tell someone</div><div class="ns">blink a fault code, send a message: a silent failure in a fall detector is dangerous</div></div>
    </div>

<section class="slide" data-t="Lab A: the sketch" data-act="lab">

    <pre><span class="c">// Knock detector · mic spike + IMU jerk spike, fused late with AND</span>
<span class="k">#include</span> <span class="s">&lt;ESP_I2S.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;Wire.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;Adafruit_MPU6050.h&gt;</span>
I2SClass i2s;  Adafruit_MPU6050 mpu;
<span class="k">const int</span> N = <span class="s">160</span>;  <span class="k">static int32_t</span> raw[N];           <span class="c">// 10 ms of audio per loop</span>
<span class="k">const float</span> MIC_T = <span class="s">0.10</span>, JERK_T = <span class="s">300</span>;   <span class="c">// ← tune: mic peak (±1), jerk (m/s³)</span>
<span class="k">const uint32_t</span> WINDOW_MS = <span class="s">50</span>;               <span class="c">// ← Part B</span>
<span class="k">float</span> dc = <span class="s">0</span>, ax0, ay0, az0;
<span class="k">uint32_t</span> tMic = <span class="s">0</span>, tImu = <span class="s">0</span>, tFused = <span class="s">0</span>;  <span class="k">int</span> nMic = <span class="s">0</span>, nImu = <span class="s">0</span>, nBoth = <span class="s">0</span>;

<span class="k">void</span> <span class="f">setup</span>() {
  Serial.begin(<span class="s">115200</span>);  Wire.begin(<span class="s">8</span>, <span class="s">9</span>);
  <span class="k">if</span> (!mpu.begin()) Serial.println(<span class="s">"MPU6050 not found"</span>);
  mpu.setAccelerometerRange(MPU6050_RANGE_8_G);
  i2s.setPins(<span class="s">15</span>, <span class="s">16</span>, -<span class="s">1</span>, <span class="s">17</span>);
  i2s.begin(I2S_MODE_STD, <span class="s">16000</span>, I2S_DATA_BIT_WIDTH_32BIT, I2S_SLOT_MODE_MONO);
}

<span class="k">void</span> <span class="f">loop</span>() {
  i2s.readBytes((<span class="k">char</span>*)raw, <span class="k">sizeof</span>(raw));
  <span class="k">float</span> peak = <span class="s">0</span>;
  <span class="k">for</span> (<span class="k">int</span> k = <span class="s">0</span>; k &lt; N; k++) { <span class="k">float</span> x = (raw[k] &gt;&gt; <span class="s">8</span>) / <span class="s">8388608.0</span>;
    dc += <span class="s">0.005</span> * (x - dc);  peak = fmaxf(peak, fabsf(x - dc)); }
  sensors_event_t a, g, t;  mpu.getEvent(&amp;a, &amp;g, &amp;t);
  <span class="k">float</span> dx = a.acceleration.x - ax0, dy = a.acceleration.y - ay0, dz = a.acceleration.z - az0;
  <span class="k">float</span> jerk = sqrtf(dx*dx + dy*dy + dz*dz) / <span class="s">0.010</span>;    <span class="c">// change per second</span>
  ax0 = a.acceleration.x;  ay0 = a.acceleration.y;  az0 = a.acceleration.z;
  <span class="k">uint32_t</span> now = millis();
  <span class="k">if</span> (peak &gt; MIC_T  &amp;&amp; now - tMic &gt; <span class="s">300</span>) { tMic = now; nMic++; }
  <span class="k">if</span> (jerk &gt; JERK_T &amp;&amp; now - tImu &gt; <span class="s">300</span>) { tImu = now; nImu++; }
  <span class="k">bool</span> both = tMic &amp;&amp; tImu &amp;&amp; (max(tMic, tImu) - min(tMic, tImu) &lt;= WINDOW_MS);

}</pre>

  deck.querySelectorAll('.tal').forEach(function(p){ taDraw(p); p.querySelectorAll('input').forEach(function(x){ x.addEventListener('input',function(){taDraw(p);}); }); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.cbm button'); if(b){ b.blur(); b.parentNode.querySelectorAll('button').forEach(function(q){q.classList.remove('sel');}); b.classList.add('sel'); cbDraw(b.closest('.comb')); return; }
    b=e.target.closest('.cdead'); if(b){ b.blur(); b.classList.toggle('on'); b.textContent=b.classList.contains('on')?'plug the microphone back in':'unplug the microphone'; cbDraw(b.closest('.comb')); return; }
  });

  var tmr=null;
  function tset(el,secs){ el.dataset.left=secs; var m=Math.floor(secs/60), q=secs%60;
    el.querySelector('.tdisp').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');
    el.classList.toggle('done',secs<=0); }
  deck.querySelectorAll('.timer').forEach(function(el){ tset(el,+el.dataset.secs); });
  document.addEventListener('click',function(e){
    var b=e.target.closest('.timer button'); if(!b) return;
    var el=b.closest('.timer'), go=el.querySelector('button[data-a="go"]'); b.blur();
    if(b.dataset.a==='reset'){ clearInterval(tmr); tmr=null; go.textContent='start'; tset(el,+el.dataset.secs); return; }
    if(tmr){ clearInterval(tmr); tmr=null; go.textContent='start'; return; }
    go.textContent='pause';
    tmr=setInterval(function(){ var l=+el.dataset.left-1; tset(el,Math.max(l,0)); if(l<=0){ clearInterval(tmr); tmr=null; go.textContent='start'; } },1000);
  });

  paint();
})();
</script>
</body>
</html>
