<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 1 · What is Edge AI?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 01</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 1 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 01 · unit I · introduction and key terms</div>
    <h1>The AI that lives<br>inside the machine</h1>
    <p class="big" style="margin-top:26px;max-width:44ch">For the next hour, forget the data centre. We are going to look at AI that runs on a chip smaller than your thumbnail, right where the data is born.</p>
  </div>
  <div class="cue">Do not explain anything yet. Go straight to the video. The definitions only land after they have seen it working.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Watch with one question" data-act="the hook">
  <div class="center">
    <div class="kicker">before we start</div>
    <h2>Watch a short demo.<br>Keep one question in your head.</h2>
    <p class="big frag" style="margin-top:22px;font-size:40px;font-family:var(--display);font-weight:600;color:var(--accent);max-width:24ch">Where is the AI running?</p>
  </div>
  <div class="cue">Reveal the question before playing. Tell them you will ask it at the end and you want a precise answer, not "in AI".</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Video: predictive maintenance with BrickML" data-act="the hook">
  <div class="vidwrap">
    <iframe class="vid" src="https://www.youtube-nocookie.com/embed/aO0-59H-4s8?rel=0&modestbranding=1" title="Edge Impulse demonstration of predictive maintenance using BrickML" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <div class="vidcap">Edge Impulse · BrickML predictive maintenance demo · Embedded Vision Summit 2023 · <a href="https://www.youtube.com/watch?v=aO0-59H-4s8" target="_blank" rel="noopener">open on YouTube</a></div>
  </div>
  <div class="cue">Click the video to play. Afterwards click the cream margin outside the video once, so the arrow keys work again. If the hall network blocks YouTube, download the clip beforehand.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Where did the AI run?" data-act="the hook">
  <div class="center">
    <h2 style="font-size:56px">So where did the AI run?</h2>
    <p class="big frag" style="margin-top:20px">Not in a data centre. Not on a laptop. Not on a phone.</p>
    <p class="big frag" style="margin-top:10px;color:var(--accent);font-weight:600">In a small box stuck on the machine itself.</p>
  </div>
  <div class="cue">Ask the question and then stop talking. Wait for at least three answers. Someone will say "the cloud" or "the laptop". Do not correct them; reveal the first line and let the room adjust.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Meet the box" data-act="the hook">
  <div>
    <h2>Meet the box.</h2>
    <div class="split" style="align-items:start">
      <div class="stack">
        <p>BrickML is a reference design from Edge Impulse and Reloc. You mount it on a motor or a pump. It listens to the machine and decides, by itself, whether the machine is healthy.</p>
        <p class="frag">It learns what <em>normal</em> looks like. Anything that does not match is an <strong>anomaly</strong>: an early sign of a fault, weeks before a breakdown.</p>
        <p class="frag small">This is called <strong>predictive maintenance</strong>: fix the machine before it fails, not after.</p>
      </div>
      <div class="ngrid frag" style="grid-template-columns:1fr 1fr;gap:26px 30px">
        <div class="cellx"><div class="big-n">40×23×5</div><div class="nlab">size in millimetres</div></div>
        <div class="cellx"><div class="big-n">1 µA</div><div class="nlab">standby current</div></div>
        <div class="cellx"><div class="big-n green">5</div><div class="nlab">kinds of sensing: vibration, temperature,<br>humidity, sound, voltage</div></div>
        <div class="cellx"><div class="big-n">BLE</div><div class="nlab">a low-power radio, for results only</div></div>
      </div>
    </div>
  </div>
  <div class="cue">Hold up an ESP32-S3 next to this slide. "The board in your kit is in the same family." Point at 1 µA: a typical phone draws hundreds of thousands of times more.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Five words from the demo" data-act="the hook">
  <div>
    <h2>Everything in that demo needs words we have not defined yet.</h2>
    <div class="chips" style="margin-top:12px">
      <span class="chip frag">sensor</span>
      <span class="chip frag">embedded system</span>
      <span class="chip frag">model</span>
      <span class="chip frag">training</span>
      <span class="chip frag">inference</span>
      <span class="chip frag">edge device</span>
      <span class="chip frag">TinyML</span>
      <span class="chip frag">signal processing</span>
    </div>
    <p class="frag" style="margin-top:30px;max-width:46ch">By the end of the hour each of these will mean something precise. Then we will watch the box again and describe it in one sentence.</p>
  </div>
  <div class="cue">Ask the class to shout the words before you reveal them. Write any extras they give on the board; most will be covered today.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="AI you used this morning" data-act="your own devices">
  <div>
    <h2>Now think about AI you used before coming here.</h2>
    <p>Phone unlock, keyboard suggestions, Maps, ChatGPT, photo search. Where did each one run?</p>
    <div class="split" style="margin-top:24px;align-items:start">
      <div class="panel frag">
        <span class="lab" style="color:var(--ok)">on your device</span>
        <div class="chips"><span class="chip dev">Face unlock</span><span class="chip dev">Keyboard next word</span><span class="chip dev">Searching "dog" in your gallery</span><span class="chip dev">Camera portrait blur</span></div>
      </div>
      <div class="panel frag">
        <span class="lab" style="color:var(--accent)">in the cloud</span>
        <div class="chips"><span class="chip cld">ChatGPT answers</span><span class="chip cld">Google Maps traffic</span><span class="chip cld">YouTube recommendations</span></div>
      </div>
    </div>
    <div class="panel frag" style="margin-top:16px">
      <span class="lab" style="color:var(--amber)">both</span>
      <div class="chips"><span class="chip mix">"Hey Google" is heard on the phone; your question is answered in the cloud</span></div>
    </div>
  </div>
  <div class="cue">Two minutes, pairs. Then reveal. The "Hey Google" split is the most important one: a tiny always-on model on the phone, a big model in the cloud. That pattern comes back in Class 5.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Section: key terms" data-act="key terms">
  <div class="center">
    <div class="kicker">part two</div>
    <h1 style="font-size:66px">Twelve words,<br>defined properly</h1>
    <p class="big" style="margin-top:22px;max-width:40ch">Every later unit assumes these. If one of them is fuzzy now, everything built on it will be fuzzy too.</p>
  </div>
  <div class="cue">Slow down from here. Each term gets an example from the demo or their phones.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Edge and edge device" data-act="key terms">
  <div class="term-card">
    <div class="word">Edge<small>where data is born</small></div>
    <div class="stack">
      <p class="big" style="max-width:34ch">The place where data is produced and the physical world is sensed, as opposed to a central data centre.</p>
      <p class="frag">A factory floor. A farm. A wrist. A car. A motor with a BrickML on it.</p>
      <div class="rem frag">
        <div class="h">edge device</div>
        <ul>
          <li>Any computing device at the edge: a microcontroller, a phone, a gateway, a local server.</li>
          <li>"Edge" is a position, not a size. A GPU box in a hospital basement is still an edge device.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Ask: is a phone an edge device? Yes. Is a hospital's own server? Yes, if it sits near the data rather than in a remote data centre.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="Embedded system and microcontroller" data-act="key terms">
  <div class="term-card">
    <div class="word">Embedded system<small>a computer you never see</small></div>
    <div class="stack">
      <p class="big" style="max-width:34ch">A computer built into a larger product to do one dedicated job.</p>
      <p class="frag">The washing machine's controller. The car's ABS unit. The BrickML.</p>
      <div class="panel frag" style="margin-top:14px">
        <span class="lab">microcontroller (MCU)</span>
        <p>A single chip holding a processor, memory and input/output pins. Usually no operating system. The ESP32-S3 in your kit is one.</p>
      </div>
      <div class="ngrid frag" style="grid-template-columns:1fr 1fr 1fr;margin-top:16px">
        <div class="cellx"><div class="big-n" style="font-size:44px">512 KB</div><div class="nlab">ESP32-S3 SRAM</div></div>
        <div class="cellx"><div class="big-n" style="font-size:44px">16 GB</div><div class="nlab">your laptop's RAM</div></div>
        <div class="cellx"><div class="big-n red" style="font-size:44px">~30,000×</div><div class="nlab">less working memory</div></div>
      </div>
    </div>
  </div>
  <div class="cue">Pass a board around while you talk. Let the 30,000× sit for a moment: the whole course is about doing useful AI inside that gap.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="IoT" data-act="key terms">
  <div class="term-card">
    <div class="word">IoT<small>internet of things</small></div>
    <div class="stack">
      <p class="big" style="max-width:34ch">Networks of physical devices that sense and exchange data.</p>
      <div class="split frag" style="margin-top:16px;gap:20px">
        <div class="rem">
          <div class="h">classic IoT</div>
          <ul><li>Sensor measures.</li><li>Raw data goes to the cloud.</li><li>The cloud thinks.</li></ul>
        </div>
        <div class="rem green">
          <div class="h">IoT with edge AI</div>
          <ul><li>Sensor measures.</li><li>The device thinks.</li><li>Only the decision travels.</li></ul>
        </div>
      </div>
      <p class="frag small" style="margin-top:14px">IoT is about <strong>connection</strong>. Edge AI is about <strong>where the thinking happens</strong>. A device can be one without the other.</p>
    </div>
  </div>
  <div class="cue">Common confusion. A smart meter that uploads readings every 15 minutes is IoT with no AI on it. A toy that responds to voice offline is edge AI with no internet.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="AI and machine learning" data-act="key terms">
  <div>
    <h2>AI and machine learning: who writes the rule?</h2>
    <div class="split" style="align-items:start;margin-top:8px">
      <div class="panel">
        <span class="lab">a rule written by an engineer</span>
        <div class="eq" style="font-size:20px;margin:6px 0 12px">if vibration &gt; <span class="v">2.5</span> g → alarm</div>
        <p>Simple and cheap. But who picked 2.5? It misses faults that change the <em>pattern</em> of vibration without making it louder.</p>
      </div>
      <div class="panel frag">
        <span class="lab">a rule learned from data</span>
        <div class="eq" style="font-size:20px;margin:6px 0 12px">record <span class="v">normal</span> → learn it → flag what differs</div>
        <p>This is <strong>machine learning</strong>: the rule comes from examples, not from a person. It is what the BrickML did.</p>
      </div>
    </div>
    <p class="frag" style="margin-top:20px;max-width:60ch"><strong>AI</strong> is the goal: machines doing tasks we associate with intelligence. <strong>ML</strong> is today's main way of getting there. The learned rule is called a <strong>model</strong>.</p>
  </div>
  <div class="cue">The 2.5 g threshold is illustrative, not from the video. Say so. The point is the contrast between a hand-picked number and a learned pattern.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="Training vs inference" data-act="key terms">
  <div>
    <h2>The most important distinction of the day.</h2>
    <div class="split" style="align-items:stretch;margin-top:6px">
      <div class="panel">
        <span class="lab">training · learning the rule</span>
        <p>Show the model thousands of examples and adjust it until it is right most of the time.</p>
        <div class="ngrid" style="grid-template-columns:1fr 1fr;margin-top:18px">
          <div class="cellx"><div class="big-n" style="font-size:40px">hours</div><div class="nlab">on a GPU</div></div>
          <div class="cellx"><div class="big-n" style="font-size:40px">rarely</div><div class="nlab">once, or now and then</div></div>
        </div>
      </div>
      <div class="panel frag">
        <span class="lab">inference · using the rule</span>
        <p>Give the finished model one new input and get one answer back.</p>
        <div class="ngrid" style="grid-template-columns:1fr 1fr;margin-top:18px">
          <div class="cellx"><div class="big-n green" style="font-size:40px">ms</div><div class="nlab">on the device</div></div>
          <div class="cellx"><div class="big-n green" style="font-size:40px">always</div><div class="nlab">every second, for years</div></div>
        </div>
      </div>
    </div>
    <p class="big frag" style="margin-top:24px;max-width:48ch">Train in the cloud. <span style="color:var(--ok);font-weight:600">Infer at the edge.</span> That one sentence is why edge AI is possible at all.</p>
  </div>
  <div class="cue">Almost every student mixes these up. Ask: in the demo, which part was training and which was inference? Training happened on a computer through Edge Impulse; inference ran on the box.</div>
</section>

<!-- 14 -->
<section class="slide" data-t="Edge AI, defined" data-act="key terms">
  <div class="center">
    <div class="kicker">definition</div>
    <h1 style="font-size:60px;max-width:22ch;margin:0 auto">Edge AI is running AI inference on, or near, the device that collects the data.</h1>
    <p class="frag" style="margin-top:28px;max-width:48ch">Sometimes training happens there too, but that is rarer and harder. We will see it in Unit III.</p>
  </div>

</section>

    <table class="dt txt" style="width:100%">
      <tr><th style="width:24%">term</th><th>meaning</th></tr>
      <tr><td>edge</td><td>Where data is produced, away from the data centre</td></tr>
      <tr><td>edge device</td><td>Any computer at the edge: MCU, phone, gateway, local server</td></tr>
      <tr><td>embedded system</td><td>A computer inside a product, doing one job</td></tr>
      <tr><td>microcontroller</td><td>CPU, memory and I/O on one chip, usually no OS</td></tr>
      <tr><td>IoT</td><td>Connected devices that sense and share data</td></tr>
      <tr><td>AI</td><td>Machines doing tasks we associate with intelligence</td></tr>
      <tr><td>machine learning</td><td>Getting the rule from examples instead of writing it</td></tr>
      <tr><td>model</td><td>The learned rule: a file of numbers plus a recipe</td></tr>
      <tr><td>training</td><td>Finding the model's numbers from data; heavy, rare</td></tr>
      <tr><td>inference</td><td>Using the model on a new input; light, constant</td></tr>
      <tr><td>edge AI</td><td>Inference on or near the device that collects the data</td></tr>
      <tr><td>TinyML / DSP</td><td>Edge AI on microcontrollers / turning signals into features</td></tr>

<section class="slide" data-t="Three misconceptions" data-act="the spectrum">
  <div>
    <h2>Three things people get wrong.</h2>
    <div class="stack" style="max-width:1100px">
      <div class="rem red frag"><div class="h">"edge AI means no cloud at all"</div><ul><li>Most real products are hybrids. The BrickML still sends results out over its radio.</li></ul></div>
      <div class="rem red frag"><div class="h">"edge AI is weaker AI"</div><ul><li>It is right-sized AI. A tiny model that answers in milliseconds beats a huge one that answers too late.</li></ul></div>
      <div class="rem red frag"><div class="h">"IoT and edge AI are the same thing"</div><ul><li>IoT is about connection. Edge AI is about where the thinking happens.</li></ul></div>
    </div>
  </div>
  <div class="cue">Ask the room to vote true or false on each before revealing the correction.</div>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  paint();
})();
</script>
