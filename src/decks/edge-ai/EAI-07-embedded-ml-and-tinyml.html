<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 7 · Embedded ML and TinyML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:60px 84px 92px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:28px;left:84px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:28px;right:84px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:84px;right:84px;bottom:32px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:84px;bottom:54px;font-family:var(--mono);font-size:13px;color:var(--soft);z-index:5}
#help{position:absolute;left:84px;bottom:54px;font-family:var(--mono);font-size:12px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:78px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:18px}
p{font-size:23px;line-height:1.45;max-width:36ch}
p+p{margin-top:12px}
.big{font-size:29px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:18px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.stack>*+*{margin-top:12px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}
.panel .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:10px}
.panel p{max-width:none}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:14px 18px;margin-top:14px}
.rem .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.rem ul{list-style:none}
.rem li{font-size:18.5px;line-height:1.42;color:var(--ink);padding:4px 0 4px 18px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.rem.red{border-left-color:var(--fail)} .rem.red .h{color:var(--fail)}
.rem.green{border-left-color:var(--ok)} .rem.green .h{color:var(--ok)}

.big-n{font-family:var(--display);font-size:60px;font-weight:600;color:var(--accent);line-height:1}
.big-n.red{color:var(--fail)} .big-n.green{color:var(--ok)}
.nlab{font-family:var(--mono);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-top:6px}
.ngrid{display:grid;gap:20px;text-align:center}
.ngrid .cellx{border-top:2px solid var(--rule2);padding-top:14px}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
table.dt th{font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);padding:12px 22px;border-bottom:1px solid var(--rule);text-align:right}
table.dt td{padding:10px 22px;text-align:right;border-bottom:1px solid var(--rule)}
table.dt tr:last-child td{border-bottom:none}
/* text tables (added for this deck, same palette) */
table.dt.txt th,table.dt.txt td{text-align:left}
table.dt.txt td{font-family:var(--sans);font-size:18px;color:var(--body);padding:8px 20px}
table.dt.txt td:first-child{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700;white-space:nowrap}

.eq{font-family:var(--mono);font-size:26px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 22px;display:inline-block}
.eq .v{color:var(--accent);font-weight:700}

/* video hook (added for this deck) */
.vid{width:1088px;height:612px;border:0;border-radius:11px;background:#14181f;box-shadow:0 18px 40px rgba(20,22,28,.22);display:block}
.vidwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.vidcap{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.vidcap a{color:var(--accent);text-decoration:none}

/* term card (added) */
.term-card{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
.term-card .word{font-family:var(--display);font-size:56px;font-weight:600;color:var(--accent);line-height:1.05;letter-spacing:-.015em}
.term-card .word small{display:block;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-top:12px;font-weight:400}

/* chips for sorting (added) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:19px;color:var(--ink);background:var(--card);border:1px solid var(--rule2);border-radius:999px;padding:7px 16px}
.chip.dev{border-color:var(--ok);background:var(--ok-soft)}
.chip.cld{border-color:var(--accent);background:var(--accent-soft)}
.chip.mix{border-color:var(--amber);background:var(--amber-soft)}

/* class 6 */
pre{background:#14181f;border-radius:10px;padding:20px 24px;font-family:var(--mono);font-size:16px;line-height:1.5;color:#d9dee6;box-shadow:0 10px 24px rgba(20,22,28,.18);overflow:hidden}
pre .c{color:#7f8896} pre .k{color:#ff96a2} pre .s{color:#ffd47e} pre .f{color:#84d8ea}
.river{position:relative;overflow:hidden;height:120px;border-radius:8px;background:#f2f1ec}
.river .rv{position:absolute;left:0;top:0;animation:flow 9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-1680px)}}
.river .now{position:absolute;right:40px;top:0;bottom:0;border-left:3px solid var(--fail);padding-left:8px;font-family:var(--mono);font-size:13px;color:var(--fail)}
.rmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--soft);margin-top:6px}
.calc{padding:20px 26px}
.crow{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:8px 0}
.cl{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb button,.rbtns button{height:42px;padding:0 18px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-family:var(--sans);font-size:18px;color:var(--ink);cursor:pointer}
.cb button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.cformula{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:14px 0}
.cformula b{color:var(--accent)}
.cbar{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:14px;margin-top:10px}
.cbl{font-family:var(--mono);font-size:14px;color:var(--ink)}
.ctrack{height:26px;border-radius:6px;background:var(--rule);overflow:hidden}
.cfill{height:100%;width:0;background:var(--ok);transition:width .35s ease}
.cfill.over{background:var(--fail)}
.cpct{font-family:var(--mono);font-size:16px;color:var(--ink);text-align:right}
.cverdict{font-size:24px;font-weight:600;color:var(--ink);margin-top:16px}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.rbtns button[data-r="1"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ntiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ntile{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px}
.ntile .nb{font-family:var(--display);font-size:40px;font-weight:600;color:var(--accent);line-height:1.05}
.ntile .nk{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-top:8px}
.ntile .ns{font-size:15px;color:var(--soft);margin-top:4px}

/* class 7 */
.neuron{padding:22px 26px}
.knobs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kn{background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;row-gap:8px;text-align:center}
.knl{grid-column:1 / -1;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.kn button{height:42px;border:1px solid var(--rule2);background:var(--card);border-radius:8px;font-size:22px;color:var(--ink);cursor:pointer}
.knv{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink)}
.nline{font-family:var(--mono);font-size:22px;color:var(--ink);background:var(--stage);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin:18px 0 12px}
.nb{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;gap:14px;margin-top:10px;font-family:var(--mono);font-size:15px;color:var(--ink)}
.ntrack{position:relative;height:28px;border-radius:6px;background:var(--rule)}
.nzero{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.nfill{position:absolute;top:0;bottom:0;border-radius:4px;transition:all .25s ease}
.nsum{background:var(--accent)} .nout2{background:var(--ok)}
.nb b{font-size:20px;text-align:right}
.ncalc{padding:18px 26px}
.ntiles2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 4px}
.ntiles2 div{border-top:2px solid var(--rule2);padding-top:10px}
.ntiles2 b{display:block;font-family:var(--display);font-size:38px;font-weight:600;color:var(--accent);line-height:1}
.ntiles2 span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:84px;right:84px;bottom:78px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 84px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Edge AI &nbsp;·&nbsp; <b>Class 07</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 7 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">
<!-- 01 -->
<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 07 · unit I · embedded ML and TinyML</div>
    <h1>What is a model,<br>really?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">We have said "the model" for six classes. Today we open it: a neuron, a layer, a network. Then we count its numbers, and decide whether it fits on the board.</p>
  </div>
  <div class="cue">This class carries the neural-network minimum for a cohort that has not studied them yet. Go slowly in the first half; Units III and IV assume it.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Recall" data-act="opening">
  <div>
    <div class="kicker">last class's exit ticket</div>
    <h2>3 axes × 50 Hz × 2 bytes × 2 s =</h2>
    <p class="big frag" style="font-size:64px;font-family:var(--display);font-weight:600;color:var(--accent)">600 bytes</p>
    <p class="frag" style="max-width:60ch">With 50% overlap a new window starts every second: about <strong>60 windows a minute</strong>, so 60 inferences a minute. Today: what happens inside each one.</p>
  </div>
  <div class="cue">Take two answers before revealing. Common mistake: forgetting the 2 bytes per sample.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="How big is a model?" data-act="the hook">
  <div>
    <h2>How big is a model? Guess first.</h2>
    <svg viewBox="0 0 1432 370" width="1432" height="370"><line x1="80" y1="60" x2="80" y2="330" stroke="#e2e0d9"/><text x="80" y="356" font-size="14" fill="#8b9096" text-anchor="middle">1 KB</text><line x1="513" y1="60" x2="513" y2="330" stroke="#e2e0d9"/><text x="513" y="356" font-size="14" fill="#8b9096" text-anchor="middle">1 MB</text><line x1="947" y1="60" x2="947" y2="330" stroke="#e2e0d9"/><text x="947" y="356" font-size="14" fill="#8b9096" text-anchor="middle">1 GB</text><line x1="1380" y1="60" x2="1380" y2="330" stroke="#e2e0d9"/><text x="1380" y="356" font-size="14" fill="#8b9096" text-anchor="middle">1 TB</text><g class="frag"><line x1="473" y1="50" x2="473" y2="330" stroke="#146b5c" stroke-width="3" stroke-dasharray="8 5"/><text x="481" y="70" font-size="14" fill="#146b5c" font-weight="700">ESP32-S3 SRAM</text></g><g class="frag"><line x1="690" y1="50" x2="690" y2="330" stroke="#b06a12" stroke-width="3" stroke-dasharray="8 5"/><text x="698" y="92" font-size="14" fill="#b06a12" font-weight="700">ESP32-S3 flash</text></g><g class="frag"><line x1="1082" y1="50" x2="1082" y2="330" stroke="#23408f" stroke-width="3" stroke-dasharray="8 5"/><text x="1090" y="114" font-size="14" fill="#23408f" font-weight="700">a phone's RAM</text></g><g class="frag"><circle cx="293" cy="150" r="10" fill="#15171b"/><text x="277" y="155" font-size="15" fill="#15171b" text-anchor="end">keyword spotter · tens of KB</text></g><g class="frag"><circle cx="438" cy="186" r="10" fill="#15171b"/><text x="422" y="191" font-size="15" fill="#15171b" text-anchor="end">person detector · a few hundred KB</text></g><g class="frag"><circle cx="679" cy="222" r="10" fill="#15171b"/><text x="663" y="227" font-size="15" fill="#15171b" text-anchor="end">MobileNetV2 · ≈ 14 MB</text></g><g class="frag"><circle cx="802" cy="258" r="10" fill="#15171b"/><text x="786" y="263" font-size="15" fill="#15171b" text-anchor="end">ResNet-50 · ≈ 100 MB</text></g><g class="frag"><circle cx="1358" cy="294" r="10" fill="#15171b"/><text x="1342" y="299" font-size="15" fill="#15171b" text-anchor="end">GPT-3 · ≈ 700 GB</text></g><line x1="80" y1="330" x2="1380" y2="330" stroke="#c6c3ba" stroke-width="1.5"/></svg>
    <p class="small">Logarithmic scale: each grid line is 1,000 times the one before. Sizes are approximate, for 32-bit weights except where the model is usually shipped smaller.</p>
  </div>
  <div class="cue">Reveal the three device lines first, then the models one by one, asking "which side of the line?" each time. Figures are rough public estimates; the point is the nine orders of magnitude.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="A neuron" data-act="neural networks">
  <div>
    <div class="kicker">part 1 · neural networks in 25 minutes</div>
    <h2>A neuron: multiply, add, squash.</h2>
    <div class="split" style="grid-template-columns:1.05fr .95fr;align-items:center">
      <svg viewBox="0 0 720 360" width="720" height="360">
        <defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs>
        <circle cx="70" cy="110" r="44" fill="#ffffff" stroke="#c6c3ba" stroke-width="2"/><text x="70" y="104" font-size="14" fill="#8b9096" text-anchor="middle">x₁</text><text x="70" y="126" font-size="20" fill="#15171b" text-anchor="middle" font-weight="700">0.5</text>
        <circle cx="70" cy="250" r="44" fill="#ffffff" stroke="#c6c3ba" stroke-width="2"/><text x="70" y="244" font-size="14" fill="#8b9096" text-anchor="middle">x₂</text><text x="70" y="266" font-size="20" fill="#15171b" text-anchor="middle" font-weight="700">0.2</text>
        <line x1="116" y1="114" x2="330" y2="170" stroke="#23408f" stroke-width="3"/><text x="210" y="122" font-size="17" fill="#23408f" font-weight="700">w₁ = 0.8</text>
        <line x1="116" y1="246" x2="330" y2="190" stroke="#a8231f" stroke-width="3"/><text x="200" y="258" font-size="17" fill="#a8231f" font-weight="700">w₂ = −0.4</text>
        <circle cx="380" cy="180" r="56" fill="#eaeef7" stroke="#23408f" stroke-width="2.5"/><text x="380" y="176" font-size="26" fill="#23408f" text-anchor="middle">Σ</text><text x="380" y="204" font-size="14" fill="#4b5057" text-anchor="middle">+ b = 0.1</text>
        <line x1="436" y1="180" x2="500" y2="180" stroke="#8b9096" stroke-width="2.5" marker-end="url(#m1)"/>
        <rect x="506" y="140" width="96" height="80" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="2"/><text x="554" y="186" font-size="17" fill="#146b5c" text-anchor="middle" font-weight="700">ReLU</text>
        <line x1="602" y1="180" x2="650" y2="180" stroke="#8b9096" stroke-width="2.5" marker-end="url(#m1)"/><text x="690" y="188" font-size="22" fill="#15171b" text-anchor="middle" font-weight="700">y</text>
      </svg>
      <div class="stack">
        <div class="eq" style="font-size:22px">y = ReLU(<span class="v">w₁</span>x₁ + <span class="v">w₂</span>x₂ + <span class="v">b</span>)</div>
        <table class="dt" style="margin-top:6px">
          <tr><th style="text-align:left">step</th><th>value</th></tr>
          <tr class="frag"><td style="text-align:left">0.5 × 0.8</td><td>0.40</td></tr>
          <tr class="frag"><td style="text-align:left">0.2 × (−0.4)</td><td>−0.08</td></tr>
          <tr class="frag"><td style="text-align:left">+ bias 0.1</td><td>0.10</td></tr>
          <tr class="frag"><td style="text-align:left">sum</td><td>0.42</td></tr>
          <tr class="frag"><td style="text-align:left">ReLU: max(0, sum)</td><td style="color:var(--ok);font-weight:700">0.42</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="split" style="grid-template-columns:.9fr 1.1fr;align-items:center">

    <div class="stack">
      <h2>The activation is what makes depth worth it.</h2>
      <p class="frag">Without it, a stack of layers is just multiply-and-add again and again, and that collapses into one single multiply-and-add. Depth would buy nothing.</p>
      <p class="frag">ReLU is the simplest bend: <code>max(0, x)</code>. One comparison. Cheap on a microcontroller.</p>
      <p class="frag small">Others exist (sigmoid, tanh, softmax at the output). ReLU and its cousins dominate edge models because they are cheap.</p>

<section class="slide" data-t="Training vs inference, again" data-act="neural networks">
  <div>
    <h2>Training is a loop. Inference is one pass.</h2>
    <svg viewBox="0 0 1432 380" width="1432" height="380"><defs><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b9096"/></marker></defs><rect x="285" y="36" width="190" height="48" rx="24" fill="#eaeef7" stroke="#23408f" stroke-width="1.6"/><text x="380" y="66" font-size="15" fill="#23408f" text-anchor="middle">forward pass</text><rect x="551" y="176" width="190" height="48" rx="24" fill="#eaeef7" stroke="#23408f" stroke-width="1.6"/><text x="646" y="206" font-size="15" fill="#23408f" text-anchor="middle">measure the error</text><rect x="285" y="316" width="190" height="48" rx="24" fill="#eaeef7" stroke="#23408f" stroke-width="1.6"/><text x="380" y="346" font-size="15" fill="#23408f" text-anchor="middle">nudge every weight</text><rect x="19" y="176" width="190" height="48" rx="24" fill="#eaeef7" stroke="#23408f" stroke-width="1.6"/><text x="114" y="206" font-size="15" fill="#23408f" text-anchor="middle">repeat</text><ellipse cx="380" cy="200" rx="266" ry="140" fill="none" stroke="#c6c3ba" stroke-width="2" stroke-dasharray="6 6"/><text x="380" y="194" font-size="15" fill="#15171b" text-anchor="middle" font-weight="700">TRAINING</text><text x="380" y="216" font-size="13" fill="#4b5057" text-anchor="middle">thousands of times · GPU</text><g class="frag"><rect x="800" y="170" width="200" height="60" rx="30" fill="#ffffff" stroke="#c6c3ba"/><text x="900" y="206" font-size="16" fill="#15171b" text-anchor="middle">new input</text><line x1="1004" y1="200" x2="1040" y2="200" stroke="#146b5c" stroke-width="3" marker-end="url(#m4)"/><rect x="1046" y="160" width="190" height="80" rx="12" fill="#e6f1ee" stroke="#146b5c" stroke-width="2"/><text x="1141" y="196" font-size="16" fill="#146b5c" text-anchor="middle" font-weight="700">forward pass</text><text x="1141" y="218" font-size="13" fill="#4b5057" text-anchor="middle">weights fixed</text><line x1="1240" y1="200" x2="1300" y2="200" stroke="#146b5c" stroke-width="3" marker-end="url(#m4)"/><text x="1360" y="206" font-size="16" fill="#15171b" text-anchor="middle">answer</text><text x="1040" y="290" font-size="15" fill="#146b5c" text-anchor="middle" font-weight="700">INFERENCE · once per window · on the device</text></g></svg>
    <p class="frag" style="max-width:70ch">Inference needs no error, no nudging, no loop: just multiply-adds with fixed weights. <strong>That is why a microcontroller can do it.</strong></p>
  </div>
  <div class="cue">This closes the neural-network minimum. Ask one student to explain training versus inference in their own words before moving on.</div>
</section>

<section class="slide" data-t="Counting the gesture network" data-act="counting">
  <div>
    <div class="kicker">part 2 · counting</div>
    <h2>Count the gesture network: 100 → 32 → 4.</h2>
    <table class="dt" style="width:100%;max-width:1150px">
      <tr><th style="text-align:left">quantity</th><th style="text-align:left">calculation</th><th>result</th></tr>
      <tr class="frag"><td style="text-align:left">layer 1 parameters</td><td style="text-align:left">100 × 32 + 32</td><td>3,232</td></tr>
      <tr class="frag"><td style="text-align:left">layer 2 parameters</td><td style="text-align:left">32 × 4 + 4</td><td>132</td></tr>
      <tr class="frag"><td style="text-align:left">total parameters</td><td style="text-align:left">3,232 + 132</td><td style="font-weight:700">3,364</td></tr>
      <tr class="frag"><td style="text-align:left">as 32-bit floats</td><td style="text-align:left">3,364 × 4 bytes</td><td>≈ 13 KB</td></tr>
      <tr class="frag"><td style="text-align:left">as 8-bit integers</td><td style="text-align:left">3,364 × 1 byte</td><td style="color:var(--ok);font-weight:700">≈ 3.3 KB</td></tr>
      <tr class="frag"><td style="text-align:left">multiply-adds per inference</td><td style="text-align:left">100 × 32 + 32 × 4</td><td>3,328</td></tr>
    </table>
    <p class="frag" style="margin-top:16px;max-width:70ch">Storing weights in 8 bits instead of 32 makes the model <strong>four times smaller</strong>. That trick is called quantisation; Unit IV is about doing it without losing accuracy.</p>
  </div>
  <div class="cue">Students compute each row before it appears. Multiply-adds: one per weight; biases are additions and are usually left out of the count.</div>
</section>

<section class="slide" data-t="What makes TinyML hard" data-act="tinyml">
  <div>
    <h2>Why TinyML is harder than it looks.</h2>
    <div class="ntiles" style="grid-template-columns:repeat(4,1fr)">
      <div class="ntile frag"><div class="nb">KB</div><div class="nk">memory</div><div class="ns">every activation and buffer must be planned in advance</div></div>
      <div class="ntile frag"><div class="nb">no OS</div><div class="nk">or a tiny one</div><div class="ns">no files, no processes, no pip install</div></div>
      <div class="ntile frag"><div class="nb">int</div><div class="nk">arithmetic</div><div class="ns">some chips have no floating-point hardware at all; 8-bit integers are fastest</div></div>
      <div class="ntile frag"><div class="nb">blind</div><div class="nk">debugging</div><div class="ns">no notebook, no plots: a serial print and an LED</div></div>
    </div>
    <p class="frag big" style="margin-top:26px;max-width:46ch">And yet a few kilobytes are enough to hear a wake word. That is the whole course in one sentence.</p>
  </div>
  <div class="cue">The ESP32-S3 does have a floating-point unit; many smaller microcontrollers do not. Either way, int8 is usually faster and smaller.</div>

  <div class="center">
    <div class="kicker">exit ticket · on paper, before you leave</div>
    <h2 style="font-size:44px;max-width:32ch;margin:0 auto">A model has 200,000 parameters. How big are its weights in float32, and in int8? Which of the ESP32-S3's three memories could hold each?</h2>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function stopVideos(){
    slides.forEach(function(s,k){ if(k!==i){ s.querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src===undefined) fr.dataset.src=fr.src;
      if(fr.src!=='about:blank') fr.src='about:blank'; }); } });
    slides[i].querySelectorAll('iframe').forEach(function(fr){
      if(fr.dataset.src && fr.src==='about:blank') fr.src=fr.dataset.src; });
  }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    stopVideos();
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg')||e.target.closest('a')||e.target.closest('.vidwrap')||e.target.closest('.neuron')||e.target.closest('.ncalc'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  var NV={x1:0.5,x2:0.2,w1:0.8,w2:-0.4,b:0.1};
  function f1(v){ var t=Math.round(v*100)/100; return (t<0?'−':'')+Math.abs(t).toFixed(t%1===0?1:(Math.abs(t*10)%1===0?1:2)); }
  function neuron(p){
    Object.keys(NV).forEach(function(k){ p.querySelector('[data-v="'+k+'"]').textContent=f1(NV[k]); });
    var s=NV.w1*NV.x1+NV.w2*NV.x2+NV.b, o=Math.max(0,s);
    p.querySelector('.nline').textContent=f1(NV.w1)+' × '+f1(NV.x1)+'  +  '+f1(NV.w2)+' × '+f1(NV.x2)+'  +  '+f1(NV.b)+'  =  '+f1(s);
    function bar(el,v){ var w=Math.min(Math.abs(v)/2,0.5)*100; el.style.width=w+'%'; el.style.left=(v<0?50-w:50)+'%'; }
    bar(p.querySelector('.nsum'),s); bar(p.querySelector('.nout2'),o);
    p.querySelector('.nsv').textContent=f1(s); p.querySelector('.nov').textContent=f1(o);
  }
  deck.querySelectorAll('.neuron').forEach(neuron);
  function fbn(x){ if(x<1024) return Math.round(x)+' B'; if(x<1048576) return (x/1024).toFixed(x<10240?1:0)+' KB'; return (x/1048576).toFixed(1)+' MB'; }
  function fmt(n){ return n.toLocaleString('en-IN'); }
  function ncalc(c){
    var io=c.querySelector('[data-g="in"] .sel').dataset.v.split('|'), inp=+io[0], out=+io[1];
    var w=+c.querySelector('[data-g="w"] .sel').dataset.v, L=+c.querySelector('[data-g="l"] .sel').dataset.v;
    var sizes=[inp]; for(var i=0;i<L;i++) sizes.push(w); sizes.push(out);
    var P=0,M=0,parts=[]; for(var j=0;j<sizes.length-1;j++){ P+=sizes[j]*sizes[j+1]+sizes[j+1]; M+=sizes[j]*sizes[j+1]; parts.push(sizes[j]+'×'+sizes[j+1]+'+'+sizes[j+1]); }
    c.querySelector('.cformula').innerHTML=sizes.join(' → ')+' &nbsp;·&nbsp; '+parts.join(' + ')+' = <b>'+fmt(P)+'</b>';
    c.querySelector('.np').textContent=fmt(P); c.querySelector('.nf').textContent=fbn(P*4); c.querySelector('.ni').textContent=fbn(P); c.querySelector('.nm').textContent=fmt(M);
    c.querySelectorAll('.cbar').forEach(function(bar){ var f=bar.querySelector('.cfill'), v=f.dataset.q==='i'?P:P*4, pc=v/(+f.dataset.cap)*100;
      f.style.width=Math.min(pc,100)+'%'; f.classList.toggle('over',pc>100); bar.querySelector('.cpct').textContent=pc>100?'too big':(pc<0.1?'< 0.1%':pc.toFixed(pc<10?1:0)+'%'); });
  }
  deck.querySelectorAll('.ncalc').forEach(ncalc);
  document.addEventListener('click',function(e){
    var k=e.target.closest('.neuron button');
    if(k){ k.blur(); var n=k.dataset.n; NV[n]=Math.round((NV[n]+(+k.dataset.d))*10)/10; neuron(k.closest('.neuron')); return; }
    var b=e.target.closest('.ncalc button'); if(!b) return; b.blur();
    b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); ncalc(b.closest('.ncalc'));
  });

  paint();
})();
</script>
</body>
</html>
