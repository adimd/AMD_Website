<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 24</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 24 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the three questions">
  <div>
    <div class="kicker">class 24 · hour twenty four of fifty</div>
    <h1>How many additions<br>is a multiply?</h1>
    <p class="big" style="margin-top:22px;max-width:48ch">You were asked to multiply thirteen by eleven in binary and count the additions. Put your number on the board. For thirty two bits the answer is thirty one, and that is where the trouble starts.</p>
  </div>
  <div class="cue">Collect the counts. Two or three, depending on whether they started from zero. Both are right.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the three questions">
  <div>
    <h2>Last session everything was nearly free. That run is over.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>What is a binary multiply, really?</strong> It turns out to be easier than the decimal one you were taught.</li>
        <li><strong>How slow is the obvious way?</strong> Judge it the way you have judged everything since Class 21.</li>
        <li><strong>Can it be rearranged?</strong> The gate count barely moves. The delay moves by a factor of thirteen.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flag the third question. The whole hour is that the arrangement matters more than the parts.</div>
</section>

<!-- ================= ACT 1 ================= -->

<section class="slide" data-t="Binary makes it easier" data-act="1 · what a binary multiply is">
  <div>
    <h2>Long multiplication, except binary throws away the hard part.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figPaper"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">why this is good news</div>
      <ul>
        <li>In decimal every row needs a times table. In binary the multiplier digit is 0 or 1, so every row is either nothing at all or a copy of the multiplicand, shifted.</li>
        <li>No multiplication is done anywhere. Multiplying by one bit is an AND gate.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let the relief land. There is no binary times table to learn, because there is nothing in it.</div>
</section>

<section class="slide" data-t="Your homework, worked" data-act="1 · what a binary multiply is">
  <div>
    <div class="kicker">step through and check it against what you wrote</div>
    <h2 style="font-size:27px;margin-bottom:0">Thirteen times eleven, the way you did it on paper.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figWorked"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="wRun">run &#9654;</button>
      <button class="btn" id="wStep">step</button>
      <button class="btn" id="wReset">reset</button>
    </div>
  </div>
  <div class="cue">Four rows, three of them nonzero, so two additions. Anyone who said three counted the zero start. Fine.</div>
</section>

<section class="slide" data-t="So what is the circuit" data-act="1 · what a binary multiply is">
  <div>
    <h2>Which means a multiplier is two things you already have.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figStructure"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>A grid of AND gates to build the rows. One gate per pair of bits, and they all fire at once, at t = 1.</li>
        <li>Then a pile of additions. Everything difficult about multiplication is in that pile.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The AND grid is free and parallel. Say so clearly, so the rest of the hour is about the additions only.</div>
</section>

<!-- ================= ACT 2 ================= -->

<section class="slide" data-t="Count the additions" data-act="2 · how slow is the obvious way">
  <div>
    <div class="kicker">guess the delay before you press reveal</div>
    <h2 style="font-size:27px;margin-bottom:0">Thirty two rows. Add them up one after another.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figChainCost"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="cReveal">reveal &#9654;</button>
      <button class="btn" id="cHide">hide</button>
    </div>
  </div>
  <div class="cue">They will guess something like 24 or 50. It is 372. That number should shock them.</div>
</section>

<section class="slide" data-t="How bad that is" data-act="2 · how slow is the obvious way">
  <div>
    <h2>Put it on the same budget bar you have used since Class 21.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figBudget"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>7440 picoseconds. A 3 GHz cycle is 333. The multiply needs twenty two of them.</li>
        <li>Its own ceiling is 134 MHz, which is worse than the ripple adder you rejected in Class 21.</li>
        <li>And the gates are not the problem. It is the shape they are wired in.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Twenty two cycles. Say it slowly. This is the worst number in the course so far.</div>
</section>

<section class="slide" data-t="Or do one at a time" data-act="2 · how slow is the obvious way">
  <div>
    <div class="kicker">the cheap way out, and it is a real design</div>
    <h2 style="font-size:27px;margin-bottom:0">You do not need thirty one adders. You could use one, thirty two times.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1090" height="303"><g id="figSequential"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">an honest trade</div>
      <ul>
        <li>One adder, one shift register, about five hundred gates instead of seven thousand. Fourteen times smaller.</li>
        <li>But now a multiply takes thirty two clock cycles instead of one instruction. Every multiply stalls the machine.</li>
        <li>This is what small processors actually do, and it is the right answer when area is the constraint.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not dismiss it. Most microcontrollers ever shipped multiply exactly like this.</div>
</section>

<!-- ================= ACT 3 ================= -->

<section class="slide" data-t="You have seen this shape" data-act="3 · rearrange them">
  <div>
    <div class="tag">CLASS 18, RETURNING</div>
    <h2 style="font-size:27px;margin-bottom:0">Thirty one additions in a line. You have met a line before.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 310" width="1080" height="294"><g id="figAssoc"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">and this time the escape is open</div>
      <ul>
        <li>In Class 21 you wanted to flatten the carry chain into a tree and could not, because carry five did not exist until carry four had happened.</li>
        <li>Here all thirty two rows exist at t = 1. They came out of AND gates that never waited for anything.</li>
        <li>So any two of them may be added first. The tree is allowed.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the payoff for the escape that was closed in Class 21. Make the contrast explicit.</div>
</section>

<section class="slide" data-t="The same adders, in a tree" data-act="3 · rearrange them">
  <div>
    <div class="kicker">watch the depth collapse, not the gate count</div>
    <h2 style="font-size:27px;margin-bottom:0">Same thirty one adders. Wired as a tree instead of a line.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 430" width="1090" height="392"><g id="figTree"></g></svg></div>
    <div class="btnrow">
      <span class="lab">wiring</span>
      <button class="btn hot" id="tChain">a line</button>
      <button class="btn" id="tTree">a tree</button>
    </div>
  </div>
  <div class="cue">Flip between the two. Identical gate count, 372 delays against 60. The wiring did all of it.</div>
</section>

<section class="slide" data-t="Where the time is going" data-act="3 · rearrange them">
  <div>
    <h2>Sixty is much better. It is still five multiplies worth of an add. Why?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figWhere"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">look at what each adder in the tree is doing</div>
      <ul>
        <li>Almost all of an adder's twelve delays is the lookahead network, settling carries across sixty four columns.</li>
        <li>And the moment it finishes, the result goes straight into another adder, which does it all over again.</li>
        <li>You are carefully resolving carries five times over, when only the last answer ever leaves the multiplier.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This question is the hinge. Let them see the waste before you name the fix.</div>
</section>

<!-- ================= ACT 4 ================= -->

<section class="slide" data-t="Stop propagating" data-act="4 · stop resolving carries">
  <div>
    <div class="tag win">THE IDEA OF THE HOUR</div>
    <h2 style="font-size:27px;margin-bottom:0">So do not resolve them. Keep the carries and hand them on.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1090" height="303"><g id="figCarrySave"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">a full adder, read differently</div>
      <ul>
        <li>One full adder takes three bits and produces two: a sum bit and a carry bit. You have had this since Class 19.</li>
        <li>Put sixty four of them side by side with nothing wired between them and you turn three numbers into two, in <strong>two gate delays</strong>, whatever the width.</li>
        <li>No chain, no lookahead, no waiting. The carries are not lost, they are just not added in yet.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The full adder has not changed since Class 19. Only what you do with its two outputs has.</div>
</section>

<section class="slide" data-t="Thirty two down to two" data-act="4 · stop resolving carries">
  <div>
    <div class="kicker">press step and watch the pile shrink</div>
    <h2 style="font-size:27px;margin-bottom:0">Every level turns three numbers into two, and costs two delays.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figReduce"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="rRun">run &#9654;</button>
      <button class="btn" id="rStep">step</button>
      <button class="btn" id="rReset">reset</button>
    </div>
  </div>
  <div class="cue">Eight levels to get from thirty two numbers to two. Then one real addition, and only then.</div>
</section>

<section class="slide" data-t="One real addition, at the end" data-act="4 · stop resolving carries">
  <div>
    <h2>You still have to resolve the carries once. Once is the point.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figFinal"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">the bill for the whole multiply</div>
      <ul>
        <li>Sixteen delays to squash thirty two numbers into two, then twelve for the lookahead adder from Class 22. Twenty eight in total.</li>
        <li>560 picoseconds, so it fits inside two cycles at 3 GHz, against the twenty two it needed at the start of the hour.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The adder from Class 22 appears one final time, doing the one job nothing else can do.</div>
</section>

<!-- ================= CLOSE ================= -->

<section class="slide" data-t="Same gates, three answers" data-act="closing">
  <div>
    <h2>Here is the whole hour in one picture, and notice what did not change.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figBill"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the export from this hour</div>
      <ul>
        <li><strong>The parts were identical in all three. Only the wiring changed, and it changed the answer by more than thirteen times.</strong></li>
        <li>In Class 17 you deleted gates to go faster. Here the gate count never moved at all.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the lesson. Architecture is arrangement, not components. It returns for pipelines and caches.</div>
</section>

<section class="slide" data-t="Which one would you build" data-act="closing">
  <div>
    <h2>So which multiplier is right? The same question as always.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figChoice"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the actual skill, again</div>
      <ul>
        <li>A sensor node that multiplies twice a second should use one adder and thirty two cycles. Seven thousand gates would be a waste of silicon and battery.</li>
        <li>A processor running a matrix multiply does it billions of times a second, and cannot afford to stall for thirty two cycles.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Same shape as Class 22's close. They should be able to predict this slide by now, and that is good.</div>
</section>

<section class="slide" data-t="Where we are now" data-act="closing">
  <div>
    <h2>Six down, two to go.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcEnd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>Multiplication is shifts and additions, and the additions are the whole cost.</li>
        <li>When work can be done in any order, a tree beats a line. When it cannot, no wiring saves you, as Class 21 showed.</li>
        <li>And carries can be deferred. You only have to settle them when somebody finally needs the answer.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The deferral idea is the one that generalises. It is the same instinct as lazy evaluation and write-back caches.</div>
</section>

<section class="slide" data-t="Close" data-act="closing">
  <div class="center">
    <h2 style="font-size:35px;margin-bottom:16px">Thirty one additions,<br>arranged three different ways.</h2>
    <p class="big" style="max-width:56ch;color:var(--soft)">372 gate delays, or 60, or 28. The gates never changed. Multiplication was never about multiplying, it was about how you stack up the adding.</p>
    <p class="big frag" style="margin-top:18px;max-width:54ch">Next session: division. Multiplication let you do everything at once because all the rows existed at the start. Division will not give you that.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: divide 143 by 11 in binary by long division. At each step, note what you had to know before you could take the next one.</div>
</section>

</template>
<script>
(function(){
  'use strict';
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }

    el('rect',{x:34,y:52,width:520,height:180,rx:14,fill:'#fdf0ef',stroke:RED,'stroke-width':2.2},g);
    txt(g,58,80,'CLASS 21 \u00b7 THE CARRY CHAIN',{'font-size':11,fill:RED,'letter-spacing':1.2,'font-weight':700});
    for(var k=0;k<5;k++){
      var cx=90+k*88;
      el('circle',{cx:cx,cy:132,r:15,fill:'#fff',stroke:RED,'stroke-width':2},g);
      txt(g,cx,137,'c'+k,{'font-size':11,fill:RED,'text-anchor':'middle','font-weight':700});
      if(k<4){ pth(g,'M'+(cx+15)+' 132 L'+(cx+65)+' 132',{stroke:'#e0b6b4','stroke-width':2.2});
               pth(g,'M'+(cx+57)+' 126 l8 6 l-8 6',{stroke:'#e0b6b4','stroke-width':2.2}); }
    }
    txt(g,58,180,'c4 did not exist until c3 had happened,',{'font-size':13,fill:RED,'font-weight':700});
    txt(g,58,202,'so no rearrangement was allowed. the tree was refused.',{'font-size':13,fill:RED});
    /* today: open */
    el('rect',{x:606,y:52,width:520,height:180,rx:14,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.2},g);
    txt(g,630,80,'TODAY \u00b7 THE THIRTY TWO ROWS',{'font-size':11,fill:GRN,'letter-spacing':1.2,'font-weight':700});
    for(var m=0;m<5;m++){
      var x2=662+m*88;
      el('circle',{cx:x2,cy:132,r:15,fill:'#fff',stroke:GRN,'stroke-width':2},g);
      txt(g,x2,137,'r'+m,{'font-size':11,fill:GRN,'text-anchor':'middle','font-weight':700});
      pth(g,'M'+x2+' 100 L'+x2+' 114',{stroke:'#a8cfc4','stroke-width':2});
    }
    txt(g,630,96,'all present at t = 1',{'font-size':11.5,fill:GRN});
    txt(g,630,180,'no row waits for any other row,',{'font-size':13,fill:GRN,'font-weight':700});
    txt(g,630,202,'so any two of them may be added first. the tree is allowed.',{'font-size':13,fill:GRN});
    txt(g,34,278,'the escape Class 21 had to refuse is open here, for exactly the reason it was refused there.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  /* ================= the same adders, in a tree ================= */
  (function(){
    var g=document.getElementById('figTree'); if(!g) return;
    var mode='chain';
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var isTree=(mode==='tree');
      txt(g,34,24,isTree?'THIRTY ONE ADDERS, WIRED AS A TREE':'THIRTY ONE ADDERS, WIRED AS A LINE',
        {'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
      var col=isTree?GRN:RED, soft=isTree?'#e9f2ef':'#fdf0ef';
      if(!isTree){
        var X0=60, BW=68, Y=96;
        for(var k=0;k<11;k++){
          var x=X0+k*(BW+26);
          el('rect',{x:x,y:Y,width:BW,height:36,rx:7,fill:soft,stroke:col,'stroke-width':1.8},g);
          if(k<10) pth(g,'M'+(x+BW)+' '+(Y+18)+' L'+(x+BW+26)+' '+(Y+18),{stroke:col,'stroke-width':2.2});
        }
        txt(g,60,Y+64,'\u00b7\u00b7\u00b7 thirty one of them, each waiting for the one before it',{'font-size':13,fill:col,'font-weight':700});
      } else {
        var TX=60, TW=1040, rows=[[16,96],[8,150],[4,204],[2,258],[1,300]];
        rows.forEach(function(r,lvl){
          var n=r[0], y=r[1], cw=TW/n;
          for(var i=0;i<n;i++){
            var w=Math.min(cw-10,88);
            var cx=TX+i*cw+cw/2;
            el('rect',{x:cx-w/2,y:y,width:w,height:30,rx:6,fill:soft,stroke:col,'stroke-width':1.6},g);
            if(lvl>0){
              var pn=rows[lvl-1][0], pcw=TW/pn;
              for(var c=0;c<2;c++){
                var ci=i*2+c; if(ci>=pn) continue;
                pth(g,'M'+(TX+ci*pcw+pcw/2)+' '+(rows[lvl-1][1])+' L'+cx+' '+(y+30),{stroke:'#dedbd3','stroke-width':1});
              }
            }
          }
          txt(g,34,y+20,(lvl+1),{'font-size':12,fill:col,'text-anchor':'end','font-weight':700});
        });
        txt(g,34,74,'level',{'font-size':11,fill:'#8b9096','text-anchor':'end'});
      }
      /* the readout */
      el('rect',{x:isTree?60:60,y:isTree?0:190,width:520,height:0,rx:0,fill:'none'},g);
      var RY=isTree?0:196;
      if(!isTree){
        el('rect',{x:60,y:352,width:500,height:66,rx:13,fill:'#fdf0ef',stroke:RED,'stroke-width':2.6},g);
        txt(g,84,378,'31 LEVELS DEEP  \u00b7  372 GATE DELAYS',{'font-size':10.5,fill:RED,'letter-spacing':1.2});
        txt(g,84,406,'7440 ps, a ceiling of 134 MHz',{'font-size':17,fill:RED,'font-weight':700});
        el('rect',{x:600,y:352,width:500,height:66,rx:13,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':2},g);
        txt(g,624,378,'GATES USED',{'font-size':10.5,fill:'#8b9096','letter-spacing':1.2});
        txt(g,624,406,'about 7200',{'font-size':17,fill:INK,'font-weight':700});
      } else {
        el('rect',{x:60,y:352,width:500,height:66,rx:13,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.6},g);
        txt(g,84,378,'5 LEVELS DEEP  \u00b7  60 GATE DELAYS',{'font-size':10.5,fill:GRN,'letter-spacing':1.2});
        txt(g,84,406,'1200 ps, a ceiling of 833 MHz',{'font-size':17,fill:GRN,'font-weight':700});
        el('rect',{x:600,y:352,width:500,height:66,rx:13,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':2},g);
        txt(g,624,378,'GATES USED',{'font-size':10.5,fill:'#8b9096','letter-spacing':1.2});
        txt(g,624,406,'about 7200. exactly the same.',{'font-size':17,fill:INK,'font-weight':700});
      }
    }
    document.getElementById('tChain').onclick=function(){
      mode='chain'; this.classList.add('hot'); document.getElementById('tTree').classList.remove('hot'); render(); };
    document.getElementById('tTree').onclick=function(){
      mode='tree'; this.classList.add('hot'); document.getElementById('tChain').classList.remove('hot'); render(); };
    render();
  })();

  /* ================= where the time is going ================= */
  (function(){
    var g=document.getElementById('figWhere'); if(!g) return;
    txt(g,34,24,'WHAT EACH ADDER IN THE TREE SPENDS ITS TWELVE DELAYS ON',{'font-size':10.5,fill:BLUE,'letter-spacing':1.4});
    var X0=120, W=880, Y=64;
    for(var k=0;k<3;k++){
      var y=Y+k*68;
      el('rect',{x:X0,y:y,width:W*0.9,height:40,rx:8,fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
      txt(g,X0+16,y+26,'settling carries across 64 columns',{'font-size':13.5,fill:RED,'font-weight':700});
      el('rect',{x:X0+W*0.9,y:y,width:W*0.1,height:40,rx:8,fill:'#e9f2ef',stroke:GRN,'stroke-width':2},g);
      txt(g,X0-16,y+26,'adder '+(k+1),{'font-size':12.5,fill:'#8b9096','text-anchor':'end','font-weight':700});
      if(k===0) txt(g,X0+W*0.9+W*0.05,y-10,'the actual adding',{'font-size':11.5,fill:GRN,'text-anchor':'middle','font-weight':700});
      if(k<2){
        pth(g,'M'+(X0+W/2)+' '+(y+44)+' L'+(X0+W/2)+' '+(y+62),{stroke:'#c6c3ba','stroke-width':2});
        txt(g,X0+W/2+14,y+58,'result goes straight into the next one',{'font-size':11.5,fill:'#8b9096'});
      }
    }
    el('rect',{x:X0,y:272,width:W,height:0,fill:'none'},g);
    txt(g,34,282,'five times over, you carefully resolve every carry, and then immediately add the answer to something else.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  /* ================= stop propagating ================= */
  (function(){
    var g=document.getElementById('figCarrySave'); if(!g) return;
    txt(g,34,24,'ONE FULL ADDER, FROM CLASS 19, READ A DIFFERENT WAY',{'font-size':10.5,fill:BLUE,'letter-spacing':1.4});
    /* the single cell */
    el('rect',{x:120,y:64,width:150,height:110,rx:12,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.6},g);
    txt(g,195,112,'full adder',{'font-size':15,fill:BLUE,'text-anchor':'middle','font-weight':700});
    txt(g,195,136,'unchanged',{'font-size':12,fill:BLUE,'text-anchor':'middle'});
    ['a','b','c'].forEach(function(t,k){
      var y=84+k*30;
      pth(g,'M60 '+y+' L116 '+y,{stroke:'#c6c3ba','stroke-width':2});
      txt(g,50,y+5,t,{'font-size':13,fill:'#8b9096','text-anchor':'end','font-weight':700});
    });
    txt(g,60,52,'three bits in',{'font-size':11.5,fill:'#8b9096'});
    pth(g,'M270 96 L330 96',{stroke:AMB,'stroke-width':2.6});
    pth(g,'M270 142 L330 142',{stroke:AMB,'stroke-width':2.6});
    txt(g,340,101,'sum bit',{'font-size':13,fill:AMB,'font-weight':700});
    txt(g,340,147,'carry bit',{'font-size':13,fill:AMB,'font-weight':700});
    txt(g,340,52,'two bits out',{'font-size':11.5,fill:'#8b9096'});
    /* the row of them */
    el('rect',{x:470,y:64,width:630,height:110,rx:13,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.4},g);
    txt(g,494,92,'SIXTY FOUR OF THEM, SIDE BY SIDE, WITH NOTHING WIRED BETWEEN THEM',
      {'font-size':10.5,fill:GRN,'letter-spacing':1.1});
    for(var k=0;k<16;k++){
      el('rect',{x:496+k*38,y:106,width:30,height:44,rx:5,fill:'#fff',stroke:GRN,'stroke-width':1.4},g);
    }
    txt(g,494,168,'no chain, no lookahead, nothing waiting on anything',{'font-size':12,fill:GRN});
    /* the result */
    el('rect',{x:60,y:206,width:500,height:96,rx:13,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.6},g);
    txt(g,84,236,'THREE NUMBERS IN, TWO NUMBERS OUT',{'font-size':10.5,fill:GRN,'letter-spacing':1.2});
    txt(g,84,276,'2 gate delays',{'font-size':30,fill:GRN,'font-weight':700});
    txt(g,84,298,'and it stays 2 however wide the numbers are',{'font-size':12.5,fill:GRN});
    el('rect',{x:600,y:206,width:500,height:96,rx:13,fill:'#fbf0dc',stroke:AMB,'stroke-width':2.4},g);
    txt(g,624,236,'THE CARRIES ARE NOT LOST',{'font-size':10.5,fill:AMB,'letter-spacing':1.2});
    txt(g,624,268,'they are just not added in yet.',{'font-size':17,fill:AMB,'font-weight':700});
    txt(g,624,292,'you are keeping a promise to settle them later.',{'font-size':12.5,fill:AMB});
  })();

  /* ================= thirty two down to two ================= */
  var redCtl=null;
  (function(){
    var g=document.getElementById('figReduce'); if(!g) return;
    var seq=[32,22,15,10,7,5,4,3,2];
    function render(t){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,34,24,'EVERY LEVEL TURNS THREE NUMBERS INTO TWO',{'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
      var X0=70, Y=62, n=seq[Math.min(t,seq.length-1)];
      var CW=Math.min(30, 940/n);
      for(var i=0;i<n;i++){
        el('rect',{x:X0+i*CW,y:Y,width:Math.max(6,CW-6),height:56,rx:4,
          fill:'#fbf0dc',stroke:AMB,'stroke-width':1.5},g);
      }
      txt(g,X0,Y-12,n+' numbers still to add',{'font-size':13,fill:AMB,'font-weight':700});
      /* the ladder */
      var LY=160;
      seq.forEach(function(v,k){
        var x=60+k*120, done=(k<=t), cur=(k===Math.min(t,seq.length-1));
        el('rect',{x:x,y:LY,width:104,height:44,rx:8,
          fill:cur?'#eaeef7':(done?'#e9f2ef':'#fbfaf7'),
          stroke:cur?BLUE:(done?GRN:'#dedbd3'),'stroke-width':cur?2.6:1.6},g);
        txt(g,x+52,LY+28,v,{'font-size':17,fill:cur?BLUE:(done?GRN:'#c6c3ba'),'text-anchor':'middle','font-weight':700});
        if(k<seq.length-1) txt(g,x+112,LY+28,'\u203a',{'font-size':16,fill:'#c6c3ba','text-anchor':'middle'});
      });
      txt(g,X0,LY-10,'numbers remaining, level by level',{'font-size':11.5,fill:'#8b9096'});
      /* the running cost */
      var lvl=Math.min(t,8);
      el('rect',{x:70,y:232,width:480,height:80,rx:12,
        fill:t>=8?'#e9f2ef':'#fbfaf7',stroke:t>=8?GRN:'#c6c3ba','stroke-width':t>=8?2.6:1.8},g);
      txt(g,94,260,'LEVELS SO FAR',{'font-size':10,fill:t>=8?GRN:'#8b9096','letter-spacing':1.3});
      txt(g,94,296,lvl+'  \u00b7  '+(lvl*2)+' gate delays',{'font-size':24,fill:t>=8?GRN:INK,'font-weight':700});
      if(t>=8){
        el('rect',{x:590,y:232,width:510,height:80,rx:12,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.6},g);
        txt(g,614,260,'AND NOW, FINALLY',{'font-size':10,fill:BLUE,'letter-spacing':1.3});
        txt(g,614,296,'two numbers left. add them properly.',{'font-size':18,fill:BLUE,'font-weight':700});
      } else {
        txt(g,590,284,'each level costs two delays, whatever the width.',{'font-size':14,fill:'#8b9096'});
      }
    }
    redCtl=ticker('rRun','rStep','rReset',8,render);
  })();

  /* ================= one real addition, at the end ================= */
  (function(){
    var g=document.getElementById('figFinal'); if(!g) return;
    txt(g,34,24,'THE WHOLE MULTIPLY, END TO END',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var segs=[[1,'AND gates build the rows',GRN,'#e9f2ef'],
              [16,'eight carry-save levels squash 32 numbers into 2',AMB,'#fbf0dc'],
              [12,'one lookahead adder, from Class 22',BLUE,'#eaeef7']];
    var X0=60, W=1040, total=29;
    var x=X0;
    segs.forEach(function(s){
      var w=W*(s[0]/total);
      el('rect',{x:x,y:70,width:w-4,height:58,rx:8,fill:s[3],stroke:s[2],'stroke-width':2.2},g);
      txt(g,x+14,104,s[0],{'font-size':19,fill:s[2],'font-weight':700});
      x+=w;
    });
    var lx=X0;
    segs.forEach(function(s,k){
      var w=W*(s[0]/total);
      txt(g,lx+14,152+k*24,s[1],{'font-size':13,fill:s[2],'font-weight':700});
      lx+=0;
    });
    el('rect',{x:60,y:230,width:500,height:60,rx:12,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.6},g);
    txt(g,84,256,'THE WHOLE MULTIPLY',{'font-size':10,fill:GRN,'letter-spacing':1.3});
    txt(g,84,282,'28 gate delays  \u00b7  560 ps',{'font-size':22,fill:GRN,'font-weight':700});
    el('rect',{x:600,y:230,width:500,height:60,rx:12,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':2},g);
    txt(g,624,256,'WHERE IT STARTED',{'font-size':10,fill:'#8b9096','letter-spacing':1.3});
    txt(g,624,282,'372 delays  \u00b7  7440 ps  \u00b7  thirteen times worse',{'font-size':15,fill:RED,'font-weight':700});
  })();

  /* ================= same gates, three answers ================= */
  (function(){
    var g=document.getElementById('figBill'); if(!g) return;
    txt(g,34,24,'THREE WAYS TO WIRE THE SAME THIRTY ONE ADDITIONS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.4});
    var rows=[['a line of adders',372,RED,'#fdf0ef'],
              ['a tree of adders',60,AMB,'#fbf0dc'],
              ['a carry-save tree',28,GRN,'#e9f2ef']];
    var X0=250, MAXW=560;
    rows.forEach(function(r,k){
      var y=64+k*72, w=Math.max(30,MAXW*Math.pow(r[1]/372,0.6));
      el('rect',{x:X0,y:y,width:w,height:44,rx:8,fill:r[3],stroke:r[2],'stroke-width':2.2},g);
      txt(g,X0-16,y+28,r[0],{'font-size':14,fill:r[2],'text-anchor':'end','font-weight':700});
      txt(g,X0+w-14,y+28,r[1]+' delays',{'font-size':15,fill:r[2],'text-anchor':'end','font-weight':700});
    });
    el('rect',{x:X0,y:286,width:MAXW,height:40,rx:8,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':2},g);
    txt(g,X0-16,312,'gates used',{'font-size':14,fill:'#8b9096','text-anchor':'end','font-weight':700});
    txt(g,X0+16,312,'about 7200, in all three',{'font-size':16,fill:INK,'font-weight':700});
    el('rect',{x:880,y:64,width:226,height:188,rx:13,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.6},g);
    txt(g,904,94,'WHAT CHANGED',{'font-size':10,fill:BLUE,'letter-spacing':1.3});
    txt(g,904,128,'nothing',{'font-size':26,fill:BLUE,'font-weight':700});
    txt(g,904,156,'about the parts.',{'font-size':14,fill:BLUE});
    txt(g,904,196,'only the order',{'font-size':17,fill:BLUE,'font-weight':700});
    txt(g,904,220,'you put them in.',{'font-size':17,fill:BLUE,'font-weight':700});
  })();

  /* ================= which one would you build ================= */
  (function(){
    var g=document.getElementById('figChoice'); if(!g) return;
    txt(g,34,24,'TWO MACHINES, TWO RIGHT ANSWERS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    function card(x0,title,col,soft,lines){
      el('rect',{x:x0,y:52,width:520,height:180,rx:14,fill:soft,stroke:col,'stroke-width':2.4},g);
      txt(g,x0+26,82,title,{'font-size':12,fill:col,'letter-spacing':1.2,'font-weight':700});
      lines.forEach(function(L,k){
        txt(g,x0+26,116+k*30,L,{'font-size':14.5,fill:k===0?INK:col,'font-weight':k===0?700:400});
      });
    }
    card(34,'A SENSOR NODE',GRN,'#e9f2ef',
      ['one adder, thirty two cycles','multiplies twice a second','500 gates, and the stall costs nothing','seven thousand gates would be wasted silicon']);
    card(606,'A PROCESSOR RUNNING MATRIX WORK',BLUE,'#eaeef7',
      ['a carry-save tree','multiplies billions of times a second','7200 gates, and every one of them earns its place','a thirty two cycle stall would be unthinkable']);
    txt(g,34,270,'the same skill as Class 21 and 22. the design is only right once you have said what it is for.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  onSlide=function(idx){ if(workCtl) workCtl.stop(); if(redCtl) redCtl.stop(); };
  paint();
})();
</script>
</body>
</html>
