<style>

}

  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:46px 68px 78px;display:none;flex-direction:column;justify-content:center}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  border:1px solid var(--rule2);border-radius:7px;padding:6px 11px;cursor:pointer;min-width:34px}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}

@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag,.kc{transition:none}}

  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.32;font-style:italic;z-index:6}

#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}

<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 19</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 19 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ================= OPENING ================= -->

<section class="slide" data-t="Title" data-act="arc three opens">
  <div>
    <div class="kicker">class 19 · hour nineteen of fifty · arc three opens</div>
    <h1>How do you add<br>one column?</h1>
    <p class="big" style="margin-top:20px;max-width:46ch">Twelve hours of representation. Six hours of gates. Today they finally touch, and something you decided in Class 5 gets paid off.</p>
  </div>
  <div class="cue">Collect the send off. The three input, two output table is the whole hour, and some will have it already.</div>
</section>

<section class="slide" data-t="The debt" data-act="arc three opens">
  <div>
    <h2>Eighteen hours ago you chose two's complement, and gave a reason.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>The reason was that a machine which only knows how to <em>count forwards</em> would then get subtraction right for free, by wrapping round the circle.</p>
        <p class="frag">You have never built that machine. Every scheme in Arc 1 was designed around a circuit that did not exist yet.</p>
        <p class="big frag" style="margin-top:4px">You now have gates, and a method that builds any function of the present. Adding is a function of the present.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">three questions this hour</div>
        <ul>
          <li><strong>What does it take to add two bits?</strong> The smallest possible version of the problem.</li>
          <li><strong>Why is that not enough?</strong> Do one addition by hand and the answer is obvious.</li>
          <li><strong>What does it take to add three?</strong> Which turns out to be the real building block, and you have built half of it already without knowing.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">The Class 5 callback matters. That decision has been sitting unjustified for eighteen hours.</div>
</section>

<!-- ================= Q1 · TWO BITS ================= -->

<section class="slide" data-t="Q1 · two bits" data-act="question 1 · two bits">
  <div>
    <div class="tag">QUESTION ONE</div>
    <div class="kicker" style="margin-top:2px">click either bit</div>
    <h2 style="font-size:31px;margin-bottom:4px">What does it take to add two bits?</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 460 300" width="440" height="287"><g id="figOnePlus"></g></svg></div>
      <div style="max-width:34ch">
        <p>Three of the four cases fit in one bit. The fourth does not: <span class="num">1 + 1 = 10</span>, which is two.</p>
        <p class="frag" style="margin-top:8px">So a bit adder has <strong>two outputs</strong>, not one. The low bit of the answer, and the bit that has to go somewhere else.</p>
        <div class="rem frag" style="margin-top:10px">
          <div class="h">the names</div>
          <ul>
            <li>The low bit is called the <strong>sum</strong>.</li>
            <li>The overflowing bit is called the <strong>carry</strong>, and it belongs to the next column left.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Click through all four. Only the last one produces a carry, and that is the entire difficulty of this arc.</div>
</section>

<section class="slide" data-t="Q1 · the table" data-act="question 1 · two bits">
  <div>
    <div class="kicker">four rows, two output columns</div>
    <h2 style="font-size:27px;margin-bottom:2px">Write the table, then hand each column to the Class 15 method.</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 420 260" width="410" height="254"><g id="tabHalf"></g></svg></div>
      <div style="max-width:36ch">
        <div class="expr" id="halfExpr"></div>
        <div class="rem" style="margin-top:10px">
          <div class="h">remember</div>
          <ul>
            <li>Two outputs means two independent functions of the same two inputs. Two tables, sharing a set of wires.</li>
            <li>The sum column is 1 when exactly one input is 1. You have seen that shape three times now, and it is called <strong>XOR</strong>.</li>
            <li>The carry column is 1 only when both are 1, which is plain <strong>AND</strong>.</li>
            <li>Two gates. This is the whole circuit, and it has a name: the <strong>half adder</strong>.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Ask why it is called a half adder before saying. The next question answers it.</div>
</section>

<section class="slide" data-t="Q1 · built" data-act="question 1 · two bits">
  <div>
    <div class="tag win">ANSWER</div>
    <div class="kicker" style="margin-top:2px">click any input</div>
    <h2 style="font-size:31px;margin-bottom:2px">Two gates. One XOR, one AND.</h2>
    <div style="text-align:center"><svg viewBox="0 0 900 300" width="880" height="293"><g id="figHalf"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>Adding produces more bits than it consumes. That is why arithmetic needs a carry at all.</li>
        <li>Two gates, depth one. It is about as cheap as a useful circuit gets.</li>
        <li>And it is only half of what you need, which the next question shows in about thirty seconds.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Step through all four inputs and watch the carry light on the last one only.</div>
</section>

<!-- ================= Q2 · THE CARRY ================= -->

<section class="slide" data-t="Q2 · by hand" data-act="question 2 · the carry">
  <div>
    <div class="tag">QUESTION TWO</div>
    <div class="kicker" style="margin-top:2px">click any bit to change it &nbsp;·&nbsp; then step through the columns</div>
    <h2 style="font-size:31px;margin-bottom:2px">So why is that not enough?</h2>
    <div style="text-align:center"><svg viewBox="0 0 960 420" width="940" height="411"><g id="figHand"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="hStep">next column &#9654;</button>
      <button class="btn" id="hAuto">run all</button>
      <button class="btn" id="hReset">reset</button>
    </div>
  </div>
  <div class="cue">Step it once and stop. The second column already has three things to add, and the half adder only takes two.</div>
</section>

<section class="slide" data-t="Q2 · answered" data-act="question 2 · the carry">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">Because a column has three inputs, not two.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 230" width="1060" height="205"><g id="figThreeIn"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>Only the rightmost column has two inputs. Every other column also receives a carry from its right.</li>
        <li>So the half adder is only usable in one place out of thirty two, which is why it is called half.</li>
        <li>The real building block takes <strong>a, b and a carry in</strong>, and produces a sum and a carry out. Three in, two out.</li>
        <li>Three inputs means eight rows, and you already know exactly how to handle eight rows.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Three in, two out. Write it on the board. Everything in the next two arcs is built out of this one block.</div>
</section>

<!-- ================= Q3 · THREE BITS ================= -->

<section class="slide" data-t="Q3 · the table" data-act="question 3 · three bits">
  <div>
    <div class="tag">QUESTION THREE</div>
    <div class="kicker" style="margin-top:2px">click any row to work it out, or press fill</div>
    <h2 style="font-size:31px;margin-bottom:2px">What does it take to add three bits?</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 660 360" width="640" height="349"><g id="tabFull"></g></svg></div>
      <div style="max-width:31ch">
        <div class="rem" style="margin-top:0">
          <div class="h">how to fill a row</div>
          <ul>
            <li>Add the three input bits as ordinary numbers. The total is 0, 1, 2 or 3.</li>
            <li>Write the total in binary. It needs two bits, and those two bits <em>are</em> your outputs.</li>
            <li>The low bit is the sum. The high bit is the carry out.</li>
            <li>No cleverness anywhere. This is arithmetic you have done since you were six.</li>
          </ul>
        </div>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="fFill">fill it in</button>
          <button class="btn" id="fClear">clear</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Fill three rows by hand with the room before pressing fill. It settles that the table is not the hard part.</div>
</section>

<section class="slide" data-t="Q3 · two maps" data-act="question 3 · three bits">
  <div>
    <div class="kicker">two output columns, so two functions, so two maps &nbsp;·&nbsp; click any cell</div>
    <h2 style="font-size:27px;margin-bottom:2px">Hand each column to Class 17 and see what comes back.</h2>
    <div class="row" style="align-items:flex-start;gap:26px">
      <div style="text-align:center">
        <svg viewBox="0 0 590 300" width="500" height="254"><g id="kmSum"></g></svg>
        <div class="expr" id="kmSumExpr" style="margin-top:6px;font-size:16px"></div>
      </div>
      <div style="text-align:center">
        <svg viewBox="0 0 590 300" width="500" height="254"><g id="kmCout"></g></svg>
        <div class="expr" id="kmCoutExpr" style="margin-top:6px;font-size:16px"></div>
      </div>
    </div>
  </div>
  <div class="cue">Let them look at both before you say anything. Somebody will notice the left map has no groups drawn on it.</div>
</section>

<section class="slide" data-t="Q3 · the checkerboard" data-act="question 3 · three bits">
  <div>
    <h2>The sum map cannot be minimised at all.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>No two of its four cells share an edge. Every pair differs in two variables or three, and never in one.</p>
        <p class="frag">So there is nothing to merge. Class 17's method runs, finds nothing, and hands back exactly what sum of products gave you: four terms of three literals.</p>
        <p class="big frag" style="margin-top:4px">This is what an XOR looks like on a map, and it is why XOR has been expensive every time you have met it.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">the third time you have hit this</div>
        <ul>
          <li><strong>Class 13.</strong> It would not come out of series or parallel switches. It needed a different kind of switch entirely.</li>
          <li><strong>Class 14.</strong> No single pull up and pull down pair produces it, so it took four whole gates.</li>
          <li><strong>Class 19.</strong> Its map is a checkerboard, so minimisation has nothing to work with.</li>
          <li>Three different tools, three refusals, one reason: XOR asks whether things <em>differ</em>, and difference does not factor.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Three encounters across seven sessions. They will not have connected them, so connect them explicitly.</div>
</section>

<section class="slide" data-t="Q3 · you built this" data-act="question 3 · three bits">
  <div>
    <div class="kicker">now the other map</div>
    <h2 style="font-size:27px;margin-bottom:2px">And the carry out is a circuit you already built, three sessions ago.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figSame"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Identical minterms, identical map, identical three circles, identical answer. Only the labels on the wires differ.</li>
        <li>In Class 16 it was a boiler with three sensors, shutting down when at least two agreed. Here it is a carry.</li>
        <li>The circuit does not know which. A carry out happens exactly when at least two of the three input bits are 1, and that is a majority vote.</li>
        <li>You were told in Class 16 that you would build this again and not recognise it. This is that moment.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the payoff of a promise made three sessions ago. Enjoy it, and let them enjoy it.</div>
</section>

<section class="slide" data-t="Q3 · built" data-act="question 3 · three bits">
  <div>
    <div class="tag win">ANSWER</div>
    <div class="kicker" style="margin-top:2px">click any input &nbsp;·&nbsp; check it against the table</div>
    <h2 style="font-size:29px;margin-bottom:0">Six gates. The full adder.</h2>
    <div style="text-align:center"><svg viewBox="0 0 900 470" width="840" height="439"><g id="figFull"></g></svg></div>
  </div>
  <div class="cue">Set all three inputs high. Sum goes to 1 and carry goes to 1, because three is binary 11.</div>
</section>

<section class="slide" data-t="Q3 · the cost" data-act="question 3 · three bits">
  <div>
    <h2>What one column costs, in the two currencies from Class 18.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 250" width="1060" height="223"><g id="figCost"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Six gates for one column, and the carry out is ready two gate delays after the inputs settle.</li>
        <li>Two gate delays is forty picoseconds. For one column of one addition.</li>
        <li>Hold that number. Next session there are thirty two columns, and the carry has to cross all of them.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Forty picoseconds sounds like nothing. Multiply it by thirty two on the board and let them do the arithmetic.</div>
</section>

<!-- ================= CLOSE ================= -->

<section class="slide" data-t="Close" data-act="closing">
  <div class="center">
    <h2 style="font-size:36px;margin-bottom:18px">One column of an addition,<br>and it took six gates.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">Three inputs, two outputs. Sum is an XOR that refuses to shrink, and carry is a majority vote you built for a boiler.</p>
    <p class="big frag" style="margin-top:18px;max-width:52ch">Next session: thirty two of these in a row, and what happens to the carry on its way across.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: add 255 and 1 in eight bits, by hand, column by column. Write down what the last carry does.</div>
</section>

</template>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  /* ================= minimiser, for the two maps ================= */
  function allCubes(n){ var o=[];
    (function r(a){ if(a.length===n){o.push(a.slice());return;}
      [0,1,'-'].forEach(function(v){ r(a.concat([v])); }); })([]); return o; }
  function cubeCells(c){ var n=c.length,o=[];
    for(var m=0;m<(1<<n);m++){ var k2=true;
      for(var k=0;k<n;k++){ var b=(m>>(n-1-k))&1; if(c[k]!=='-'&&c[k]!==b) k2=false; }
      if(k2) o.push(m); } return o; }
  function minimise(n,ones){
    if(!ones.length) return [];
    var on={}; ones.forEach(function(m){on[m]=1;});
    var valid=allCubes(n).filter(function(c){ var s=cubeCells(c);
      return s.every(function(m){return on[m];}) && s.length; });
    var primes=valid.filter(function(c){ var s=cubeCells(c);
      return !valid.some(function(o){ if(o===c) return false; var os=cubeCells(o);
        return os.length>s.length && s.every(function(m){return os.indexOf(m)>=0;}); }); });
    var need={}; ones.forEach(function(m){need[m]=1;});
    var ch=[], g=0;
    while(Object.keys(need).length && g++<30){
      var best=null,bn=-1;
      primes.forEach(function(p){ var gg=cubeCells(p).filter(function(m){return need[m];}).length,
        l=p.filter(function(v){return v!=='-';}).length;
        if(gg>bn||(gg===bn&&best&&l<best.filter(function(v){return v!=='-';}).length)){bn=gg;best=p;} });
      if(!best||bn<=0) break;
      ch.push(best); cubeCells(best).forEach(function(m){delete need[m];});
    }
    return ch;
  }

          txt(g,400,y+6,co+' '+s,{'font-size':16,fill:'#8b9096','text-anchor':'middle','pointer-events':'none'});
          txt(g,510,y+6,s,{'font-size':16,fill:s?AMB:'#c6c3ba','text-anchor':'middle','font-weight':700,'pointer-events':'none'});
          txt(g,600,y+6,co,{'font-size':16,fill:co?RED:'#c6c3ba','text-anchor':'middle','font-weight':700,'pointer-events':'none'});
        } else {
          txt(g,300,y+6,'?',{'font-size':15,fill:'#d5d2ca','text-anchor':'middle','pointer-events':'none'});
        }
      }
      var n=fullShown.filter(Boolean).length;
      txt(g,14,348,n+' of 8 rows worked out',{'font-size':13,fill:n===8?GRN:'#8b9096','font-weight':n===8?700:400});
    }
    document.getElementById('fFill').onclick=function(){ for(var k=0;k<8;k++) fullShown[k]=true; render(); };
    document.getElementById('fClear').onclick=function(){ for(var k=0;k<8;k++) fullShown[k]=false; render(); };
    render();
  })();

  /* ================= the two maps ================= */
  var GRAY=[0,1,3,2];
  function kmap(hostId,exprId,initial,names,note){
    var host=document.getElementById(hostId); if(!host) return;
    var cells=initial.slice(), CW=104, CH=92, X0=140, Y0=96;
    var PAL=[BLUE,RED,GRN,AMB,VIO];
    function draw(){
      host.innerHTML='';
      var ones=[]; cells.forEach(function(v,m){ if(v) ones.push(m); });
      var terms=minimise(3,ones);
      txt(host,X0-30,Y0-46,names[0],{'font-size':14,fill:INK,'font-weight':700,'text-anchor':'end'});
      txt(host,X0+16,Y0-46,names[1]+' '+names[2],{'font-size':14,fill:INK,'font-weight':700});
      pth(host,'M'+(X0-26)+' '+(Y0-62)+' L'+(X0-2)+' '+(Y0-38),{stroke:GREY,'stroke-width':1.5});
      ['00','01','11','10'].forEach(function(c,j){ txt(host,X0+j*CW+CW/2,Y0-14,c,{'font-size':13,'text-anchor':'middle'}); });
      ['0','1'].forEach(function(r,ri){ txt(host,X0-14,Y0+ri*CH+CH/2+5,r,{'font-size':13,'text-anchor':'end'}); });
      for(var r=0;r<2;r++) for(var c=0;c<4;c++){
        var m=(r<<2)|GRAY[c], v=cells[m];
        var rr=el('rect',{x:X0+c*CW,y:Y0+r*CH,width:CW,height:CH,
          fill:v?'#fbf0dc':'#fff',stroke:GREY,'stroke-width':1.5,'class':'kc'},host);
        rr.onclick=(function(mm){ return function(){ cells[mm]=cells[mm]?0:1; draw(); }; })(m);
        txt(host,X0+c*CW+CW/2,Y0+r*CH+CH/2+9,v,{'font-size':24,fill:v?AMB:'#c6c3ba',
          'text-anchor':'middle','font-weight':700,'pointer-events':'none'});
        txt(host,X0+c*CW+7,Y0+r*CH+17,m,{'font-size':10.5,fill:'#d5d2ca','pointer-events':'none'});
      }
      terms.forEach(function(t,gi){
        var ms=cubeCells(t), rs={}, cs={};
        ms.forEach(function(m){ rs[m>>2&1]=1; cs[GRAY.indexOf(m&3)]=1; });
        var rl=Object.keys(rs).map(Number).sort(function(a,b){return a-b;});
        var cl=Object.keys(cs).map(Number).sort(function(a,b){return a-b;});
        function runs(list,total){ if(list.length===total) return [[0,total]];
          var out=[],st=list[0],pv=list[0];
          for(var q=1;q<list.length;q++){ if(list[q]===pv+1) pv=list[q];
            else { out.push([st,pv-st+1]); st=list[q]; pv=list[q]; } }
          out.push([st,pv-st+1]); return out; }
        var ins=5+gi*4;
        runs(rl,2).forEach(function(rr){ runs(cl,4).forEach(function(cc){
          el('rect',{x:X0+cc[0]*CW+ins,y:Y0+rr[0]*CH+ins,width:cc[1]*CW-2*ins,height:rr[1]*CH-2*ins,rx:12,
            fill:PAL[gi%5],'fill-opacity':.07,stroke:PAL[gi%5],'stroke-width':2.6,'pointer-events':'none'},host);
        }); });
      });
      var ex=document.getElementById(exprId);
      if(ex){
        var lits=terms.reduce(function(s,t){return s+t.filter(function(v){return v!=='-';}).length;},0);
        ex.innerHTML = terms.length
          ? terms.map(function(t,gi){ return '<span style="color:'+PAL[gi%5]+'">'+termText(names,t)+'</span>'; })
              .join(' <span class="dim">+</span> ')+
            '<br><span class="dim">'+terms.length+' terms \u00b7 '+lits+' literals \u00b7 '+note+'</span>'
          : '<span class="dim">nothing on the map</span>';
      }
    }
    draw();
  }
  var NM3=['a','b','cin'];
  kmap('kmSum','kmSumExpr',[0,1,1,0,1,0,0,1],NM3,'no circles possible');
  kmap('kmCout','kmCoutExpr',[0,0,0,1,0,1,1,1],NM3,'three circles of two');

  /* ================= Q3 · you built this ================= */
  (function(){
    var g=document.getElementById('figSame'); if(!g) return;
    function map(X,title,labels,col){
      txt(g,X,32,title,{'font-size':10.5,fill:col,'letter-spacing':1.8});
      var CW=76,CH=66,Y0=76;
      txt(g,X-6,Y0-30,labels[0],{'font-size':12,fill:INK,'font-weight':700,'text-anchor':'end'});
      txt(g,X+16,Y0-30,labels[1]+' '+labels[2],{'font-size':12,fill:INK,'font-weight':700});
      ['00','01','11','10'].forEach(function(c,j){ txt(g,X+j*CW+CW/2,Y0-10,c,{'font-size':11,'text-anchor':'middle'}); });
      for(var r=0;r<2;r++){
        txt(g,X-10,Y0+r*CH+CH/2+4,r,{'font-size':11,'text-anchor':'end'});
        for(var c=0;c<4;c++){
          var m=(r<<2)|[0,1,3,2][c], v=[0,0,0,1,0,1,1,1][m];
          el('rect',{x:X+c*CW,y:Y0+r*CH,width:CW,height:CH,fill:v?'#fbf0dc':'#fff',stroke:GREY,'stroke-width':1.4},g);
          txt(g,X+c*CW+CW/2,Y0+r*CH+CH/2+8,v,{'font-size':20,fill:v?AMB:'#c6c3ba','text-anchor':'middle','font-weight':700});
        }
      }
      /* the three circles */
      [[1,1,1,2],[0,2,2,1],[1,2,1,2]].forEach(function(q,gi){
        var PAL=[BLUE,RED,GRN], ins=5+gi*4;
        el('rect',{x:X+q[1]*CW+ins,y:Y0+q[0]*CH+ins,width:q[3]*CW-2*ins,height:q[2]*CH-2*ins,rx:11,
          fill:PAL[gi],'fill-opacity':.07,stroke:PAL[gi],'stroke-width':2.4},g);
      });
      txt(g,X,236,labels[0]+labels[1]+' + '+labels[0]+labels[2]+' + '+labels[1]+labels[2],
        {'font-size':17,fill:col,'font-weight':700});
      txt(g,X,262,'minterms 3, 5, 6, 7',{'font-size':12,fill:'#8b9096'});
    }
    map(60,'CLASS 16 \u00b7 THE BOILER ALARM',['s1','s2','s3'],GRN);
    map(660,'CLASS 19 \u00b7 THE CARRY OUT',['a','b','cin'],RED);
    pth(g,'M400 150 L620 150',{stroke:'#c6c3ba','stroke-width':2.2,'stroke-dasharray':'7 5'});
    txt(g,510,138,'the same',{'font-size':14,fill:INK,'text-anchor':'middle','font-weight':700});
    txt(g,510,172,'circuit',{'font-size':14,fill:INK,'text-anchor':'middle','font-weight':700});
    txt(g,60,292,'a carry happens when at least two of the three bits are 1, which is a majority vote',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= Q3 · the full adder built ================= */
  (function(){
    var g=document.getElementById('figFull'); if(!g) return;
    var a=1,b=1,ci=1;
    /* geometry, all taps verified against the rail spans */
    var RA=140, RB=170, RC=200;
    var AY=63, BY=124, CY=188;
    var X1X=300, X1Y=75, X1H=24;          /* xor 1 */
    var X2X=470, X2Y=125, X2H=24;         /* xor 2 */
    var ANX=400, ANH=22;
    var AND=[{y:240,t:'a b'},{y:316,t:'a cin'},{y:392,t:'b cin'}];
    var ORX=560, ORY=316, ORH=52;
    var OUTX=760;
    /* rail extents: from the pin to the furthest tap */
    var RAILA=[Math.min(AY,63), 304], RAILB=[87, 380], RAILC=[137, 404];

    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var x1=a^b, s=x1^ci;
      var t=[ (a&&b)?1:0, (a&&ci)?1:0, (b&&ci)?1:0 ];
      var co=(t[0]||t[1]||t[2])?1:0;

      /* pins and their rails */
      pin(g,54,AY,a,'a',function(){ a=a?0:1; render(); });
      pin(g,54,BY,b,'b',function(){ b=b?0:1; render(); });
      pin(g,54,CY,ci,'cin',function(){ ci=ci?0:1; render(); });
      wire(g,80,AY,RA,AY,a);   wire(g,RA,RAILA[0],RA,RAILA[1],a);
      wire(g,80,BY,RB,BY,b);   wire(g,RB,RAILB[0],RB,RAILB[1],b);
      wire(g,80,CY,RC,CY,ci);  wire(g,RC,RAILC[0],RC,RAILC[1],ci);

      /* xor 1: a and b */
      wire(g,RA,63,X1X-4,63,a);  jn(g,RA,63);
      wire(g,RB,87,X1X-4,87,b);  jn(g,RB,87);
      gOr(g,X1X,X1Y,X1H,x1,true);
      txt(g,X1X+32,X1Y-X1H-14,'XOR',{'font-size':11.5,fill:x1?AMB:'#a9a69d','text-anchor':'middle'});

      /* xor 2: that, and cin */
      poly(g,[[orTip(X1X,X1H),X1Y],[420,X1Y],[420,113],[X2X-4,113]],x1);
      wire(g,RC,137,X2X-4,137,ci); jn(g,RC,137);
      gOr(g,X2X,X2Y,X2H,s,true);
      txt(g,X2X+32,X2Y-X2H-14,'XOR',{'font-size':11.5,fill:s?AMB:'#a9a69d','text-anchor':'middle'});
      wire(g,orTip(X2X,X2H),X2Y,OUTX,X2Y,s);
      outBox(g,OUTX,X2Y,s,'SUM');

      /* the three AND gates */
      var taps=[[[RA,228,a],[RB,252,b]],[[RA,304,a],[RC,328,ci]],[[RB,380,b],[RC,404,ci]]];
      AND.forEach(function(G,k){
        taps[k].forEach(function(tp){
          wire(g,tp[0],tp[1],ANX,tp[1],tp[2]); jn(g,tp[0],tp[1]);
        });
        gAnd(g,ANX,G.y,ANH,t[k]);
        txt(g,ANX+24,G.y-ANH-12,G.t,{'font-size':11.5,fill:t[k]?AMB:'#a9a69d','text-anchor':'middle'});
      });

      /* routing into the OR, landing on its left edge */
      var TIP=andTip(ANX,ANH), L=ORX-4;
      poly(g,[[TIP,AND[0].y],[500,AND[0].y],[500,292],[L,292]],t[0]);
      wire(g,TIP,AND[1].y,L,ORY,t[1]);
      poly(g,[[TIP,AND[2].y],[520,AND[2].y],[520,340],[L,340]],t[2]);
      gOr(g,ORX,ORY,ORH,co);
      txt(g,ORX+36,ORY-ORH-14,'OR',{'font-size':11.5,fill:co?AMB:'#a9a69d','text-anchor':'middle'});
      wire(g,orTip(ORX,ORH),ORY,OUTX,ORY,co);
      outBox(g,OUTX,ORY,co,'CARRY OUT');

      /* the arithmetic check */
      var tot=a+b+ci;
      txt(g,54,450,a+' + '+b+' + '+ci+' = '+tot+',  which in binary is '+co+' '+s,
        {'font-size':15,fill:INK,'font-weight':700});
      txt(g,620,450,'6 gates \u00b7 depth 2 to the carry',{'font-size':13,fill:BLUE});
    }
    render();
  })();

  /* ================= Q3 · the cost ================= */
  (function(){
    var g=document.getElementById('figCost'); if(!g) return;
    function bay(X,title,body,val,unit,col){
      rct(g,X,34,320,140,{rx:14,fill:'#fbfaf7',stroke:'#e2e0d9'});
      txt(g,X+24,64,title,{'font-size':10.5,fill:col,'letter-spacing':1.8});
      txt(g,X+24,112,val,{'font-size':40,fill:col,'font-weight':700});
      txt(g,X+24+String(val).length*24+10,112,unit,{'font-size':15,fill:'#8b9096'});
      txt(g,X+24,146,body,{'font-size':13,fill:'#8b9096'});
    }
    bay(40,'GATE COUNT','2 XOR, 3 AND, 1 OR','6','gates',BLUE);
    bay(400,'DEPTH TO THE SUM','two XOR gates in a row','2','deep',BLUE);
    bay(760,'DEPTH TO THE CARRY','an AND then an OR','2','deep',RED);
    txt(g,40,214,'two gate delays is about 40 picoseconds, for one column of one addition',
      {'font-size':16,fill:INK,'font-weight':700});
  })();

  onSlide=function(idx){
    if(handCtl && slides[idx].dataset.t!=='Q2 · by hand') handCtl.stop();
  };

  paint();
})();
