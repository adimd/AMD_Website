<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 19 · How do you add one column?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --hi:#e8952b; --lo:#b9bfc6; --violet:#6b3fa0;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:46px 68px 78px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;top:19px;left:68px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:19px;right:68px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:68px;right:68px;bottom:21px;display:flex;gap:1.5px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:68px;bottom:42px;font-family:var(--mono);font-size:12px;color:var(--soft);z-index:5}
#help{position:absolute;left:68px;bottom:42px;font-family:var(--mono);font-size:11px;color:#adb1b6;letter-spacing:.08em;z-index:5}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.12;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20px;line-height:1.46;max-width:37ch}
p+p{margin-top:10px}
.big{font-size:23.5px;line-height:1.34;color:var(--ink);font-weight:300;max-width:31ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.stack>*+*{margin-top:9px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:9px 14px;margin-top:9px}
.rem .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.rem.win{border-left-color:var(--ok)} .rem.win .h{color:var(--ok)}
.rem.bad{border-left-color:var(--fail)} .rem.bad .h{color:var(--fail)}
.rem ul{list-style:none}
.rem li{font-size:15.5px;line-height:1.36;color:var(--ink);padding:3.5px 0 3.5px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}
.btn{font-family:var(--mono);font-size:12.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btnrow .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft);margin-right:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.tag.win{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--fail-soft);color:var(--fail)}
.tag.new{background:#efe9f7;color:var(--violet)}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .32s ease}
.frag.shown{opacity:1}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
.cue{position:absolute;left:68px;right:68px;bottom:64px;display:none;padding:9px 13px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.34;font-style:italic;z-index:6}
body.cues .cue{display:block}
#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:38px 68px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3.5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 19</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 19 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="arc three opens">
  <div>
    <div class="kicker">class 19 · hour nineteen of fifty · arc three opens</div>
    <h1>How do you add<br>one column?</h1>
    <p class="big" style="margin-top:22px;max-width:47ch">You have spent twelve hours on what bits mean and six on what gates do. Those two halves have never once touched. Today they do.</p>
  </div>
  <div class="cue">Take the send off before anything else. Some of them will already have the table you are about to derive.</div>
</section>

<section class="slide" data-t="Two halves" data-act="arc three opens">
  <div>
    <h2>Everything you know, and the gap down the middle of it.</h2>
    <div style="text-align:center;margin-top:4px"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figGap"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the thing nobody has said out loud yet</div>
      <ul>
        <li>Back in Class 5 you picked two's complement, and the reason you gave was that a machine which only counts <em>forwards</em> would get subtraction right for free.</li>
        <li>That was a promise about a circuit. The circuit did not exist. It still does not.</li>
        <li>Adding depends only on the bits in front of it, so Class 15 guarantees it can be built. Today you find out what it costs.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the arc opening. Eighteen hours of groundwork, and the payment starts now.</div>
</section>

<section class="slide" data-t="One plus one" data-act="two bits">
  <div>
    <div class="kicker">start as small as the problem goes</div>
    <h2 style="font-size:29px;margin-bottom:2px">Add one bit to one bit. Three of the four answers are easy.</h2>
    <div class="row" style="align-items:center;gap:30px">
      <div><svg viewBox="0 0 480 320" width="440" height="293"><g id="figOnePlus"></g></svg></div>
      <div style="max-width:33ch">
        <p>Click through the four cases. Nothing interesting happens until the last one.</p>
        <p class="frag" style="margin-top:10px">One and one is two, and two does not fit in a bit. The answer needs a second digit, and there is nowhere on this diagram to put it.</p>
        <div class="rem frag" style="margin-top:11px">
          <div class="h">so give it somewhere to go</div>
          <ul>
            <li>The bit that fits is the <strong>sum</strong>.</li>
            <li>The bit that does not is the <strong>carry</strong>, and it belongs to the next column along.</li>
            <li>Adding produces more digits than it consumes. That single fact is why this arc runs eight hours.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Let them click all four before you name anything. The names land better once the problem is felt.</div>
</section>

<section class="slide" data-t="The half adder" data-act="two bits">
  <div>
    <div class="kicker">four rows, two answers per row · press build</div>
    <h2 style="font-size:29px;margin-bottom:0">Two outputs means two functions, so hand each one to Class 15 separately.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1100" height="332"><g id="figHalf"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="hBuild">build it &#9654;</button>
      <button class="btn" id="hReset">back to the table</button>
    </div>
  </div>
  <div class="cue">The sum column is 1 when exactly one input is. They have met that shape three times and it is still XOR.</div>
</section>

<section class="slide" data-t="Half adder, live" data-act="two bits">
  <div>
    <div class="tag win">SO FAR SO CHEAP</div>
    <div class="kicker" style="margin-top:2px">click either input</div>
    <h2 style="font-size:29px;margin-bottom:2px">Two gates, and the carry lights on one row out of four.</h2>
    <div style="text-align:center"><svg viewBox="0 0 900 310" width="860" height="296"><g id="figHalfLive"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">and it has a name, which should worry you slightly</div>
      <ul>
        <li>This is called a <strong>half adder</strong>. Two gates, depth one, and it is genuinely correct for adding two bits.</li>
        <li>Nobody names a thing <em>half</em> unless something is missing. Finding out what takes about thirty seconds.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Ask why it is only half, then go straight to the next slide rather than answering.</div>
</section>

<section class="slide" data-t="Do one by hand" data-act="why half is not enough">
  <div>
    <div class="kicker">click any bit to change the numbers &nbsp;·&nbsp; then work the columns</div>
    <h2 style="font-size:29px;margin-bottom:0">Do an addition the way you were taught, and watch where it goes wrong.</h2>
    <div style="text-align:center"><svg viewBox="0 0 980 400" width="940" height="384"><g id="figHand"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="dStep">next column &#9654;</button>
      <button class="btn" id="dAuto">run it</button>
      <button class="btn" id="dReset">start over</button>
    </div>
  </div>
  <div class="cue">Stop after one press. The second column already has three numbers in it, and the half adder has two inputs.</div>
</section>

<section class="slide" data-t="Three, not two" data-act="why half is not enough">
  <div>
    <div class="tag bad">THAT IS WHAT WAS MISSING</div>
    <h2 style="font-size:29px;margin-bottom:4px">Only the rightmost column ever gets two inputs.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 230" width="1080" height="218"><g id="figThreeIn"></g></svg></div>
    <div class="rem bad" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every other column also takes a carry from its right. Three inputs, not two, on thirty one columns out of thirty two.</li>
        <li>So the half adder is usable in exactly one position, which is why it only ever got half a name.</li>
        <li>What you actually need takes <strong>a, b and a carry in</strong>, and gives back a sum and a carry out. Three in, two out.</li>
        <li>Three inputs is eight rows. You have known how to handle eight rows since Class 15.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Three in, two out. Put it on the board. Everything for the next two arcs is built from this one block.</div>
</section>

<section class="slide" data-t="Fill the table" data-act="three bits">
  <div>
    <div class="kicker">click a row to work it out &nbsp;·&nbsp; there is no trick to this</div>
    <h2 style="font-size:29px;margin-bottom:2px">Add the three bits like ordinary numbers, then write the total in binary.</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 680 360" width="640" height="339"><g id="tabFull"></g></svg></div>
      <div style="max-width:30ch">
        <p style="font-size:18.5px">Three bits can total 0, 1, 2 or 3. Every one of those needs two binary digits to write down.</p>
        <p class="frag" style="font-size:18.5px;margin-top:10px">Those two digits <em>are</em> your two outputs. The low one is the sum, the high one is the carry.</p>
        <div class="rem frag" style="margin-top:11px">
          <div class="h">worth noticing</div>
          <ul>
            <li>This is arithmetic you have done since you were six. The table is not the difficult part of the hour.</li>
            <li>Four of the eight rows carry, and four do not.</li>
          </ul>
        </div>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="fFill">fill the rest</button>
          <button class="btn" id="fClear">clear</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Do two or three rows with the room out loud, then press fill. It settles quickly.</div>
</section>

<section class="slide" data-t="Two maps" data-act="three bits">
  <div>
    <div class="kicker">two output columns, two functions, two maps &nbsp;·&nbsp; click any cell</div>
    <h2 style="font-size:28px;margin-bottom:2px">Give both columns to Class 17 and see what comes back.</h2>
    <div class="row" style="align-items:flex-start;gap:28px">
      <div style="text-align:center">
        <svg viewBox="0 0 590 300" width="490" height="249"><g id="kmSum"></g></svg>
        <div style="font-family:var(--mono);font-size:15px;font-weight:700;margin-top:4px" id="kmSumExpr"></div>
      </div>
      <div style="text-align:center">
        <svg viewBox="0 0 590 300" width="490" height="249"><g id="kmCout"></g></svg>
        <div style="font-family:var(--mono);font-size:15px;font-weight:700;margin-top:4px" id="kmCoutExpr"></div>
      </div>
    </div>
  </div>
  <div class="cue">Say nothing for ten seconds. Somebody will notice the left map has no circles drawn on it at all.</div>
</section>

<section class="slide" data-t="The checkerboard" data-act="three bits">
  <div>
    <h2>The sum map will not shrink. Not a little, not at all.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Its four cells never touch. Pick any two and they differ in two variables, or in three, but never in one.</p>
        <p class="frag">So there is nothing to merge. Class 17's method runs, finds no pair to work with, and hands you back exactly what you gave it.</p>
        <p class="big frag" style="margin-top:6px">This is what XOR looks like on a map, and it explains why XOR has been awkward every single time you have met it.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">three tools, three refusals</div>
        <ul>
          <li><strong>Class 13.</strong> It would not come out of switches in series or parallel. It needed a different kind of switch entirely.</li>
          <li><strong>Class 14.</strong> No single pull up and pull down pair produces it, so it cost four whole gates.</li>
          <li><strong>Class 19.</strong> Its map is a checkerboard, so there is nothing for minimisation to hold on to.</li>
          <li>One reason underneath all three: XOR asks whether two things <em>differ</em>, and difference does not factor.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Seven sessions apart. They will not have joined these up, so join them explicitly.</div>
</section>

<section class="slide" data-t="You have built this" data-act="three bits">
  <div>
    <div class="tag new">NOW THE OTHER MAP</div>
    <div class="kicker" style="margin-top:2px">press compare</div>
    <h2 style="font-size:28px;margin-bottom:0">You built the carry circuit three sessions ago, for something else entirely.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figSame"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="cCompare">compare them &#9654;</button>
      <button class="btn" id="cBack">back</button>
    </div>
  </div>
  <div class="cue">This is a promise from Class 16 being kept. Let them enjoy it rather than hurrying past.</div>
</section>

<section class="slide" data-t="Build it" data-act="three bits">
  <div>
    <div class="kicker">press add to place one piece at a time &nbsp;·&nbsp; then click any input to test it</div>
    <h2 style="font-size:28px;margin-bottom:0">Put the two halves together.</h2>
    <div style="text-align:center"><svg viewBox="0 0 940 450" width="880" height="421"><g id="figFull"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="bNext">add the next piece &#9654;</button>
      <button class="btn" id="bAll">show it all</button>
      <button class="btn" id="bReset">start empty</button>
    </div>
  </div>
  <div class="cue">Build it piece by piece the first time. Once it is whole, hand over the inputs and check a few rows.</div>
</section>

<section class="slide" data-t="What it cost" data-act="three bits">
  <div>
    <div class="tag win">ONE COLUMN, FINISHED</div>
    <h2 style="font-size:29px;margin-bottom:4px">Six gates, and the carry is out after two of them.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figCost"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Two gate delays is about forty picoseconds. For one column, of one addition.</li>
        <li>Hold on to that number. Next session there are thirty two columns, and the carry has to get across all of them.</li>
        <li>The sum and the carry arrive together, but it is the carry that the next column is waiting for.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Forty picoseconds sounds like nothing at all. Multiply it by thirty two on the board and let them do it.</div>
</section>

<section class="slide" data-t="Where we are" data-act="closing">
  <div>
    <h2>One column of an addition, and it took six gates.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArc"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>A block with three inputs and two outputs, made of an XOR that refuses to shrink and a majority vote you built for a boiler.</li>
        <li>Thirty two of them will make an adder, and the wire between each pair is the carry.</li>
        <li>That wire is going to turn out to be the most expensive thing in the machine, and it will take three more sessions to deal with it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Show the strip. This is the arc's spine and it comes back at the start and end of every hour.</div>
</section>

<section class="slide" data-t="Close" data-act="closing">
  <div class="center">
    <h2 style="font-size:36px;margin-bottom:18px">Three inputs, two outputs,<br>and nothing in it is new.</h2>
    <p class="big" style="max-width:55ch;color:var(--soft)">An XOR you have fought with since Class 13, and a majority vote you built to shut down a boiler. Adding turned out to be two old circuits standing next to each other.</p>
    <p class="big frag" style="margin-top:20px;max-width:52ch">Next session: thirty two of these in a row, and what the carry does on its way across.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: add 255 and 1 in eight bits, by hand, column by column. Write down what the last carry does and where it goes.</div>
</section>

</template>

<script>
(function(){
  'use strict';
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;
  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');
  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  var onSlide=null;
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;

  function allCubes(n){ var o=[];
    (function r(a){ if(a.length===n){o.push(a.slice());return;} [0,1,'-'].forEach(function(v){ r(a.concat([v])); }); })([]);
    return o; }
  function cubeCells(c){ var n=c.length,o=[];
    for(var m=0;m<(1<<n);m++){ var k2=true;
      for(var k=0;k<n;k++){ var b=(m>>(n-1-k))&1; if(c[k]!=='-'&&c[k]!==b) k2=false; }
      if(k2) o.push(m); } return o; }
  function minimise(n,ones){
    if(!ones.length) return [];
    var on={}; ones.forEach(function(m){on[m]=1;});
    var valid=allCubes(n).filter(function(c){ var s=cubeCells(c); return s.length&&s.every(function(m){return on[m];}); });
    var primes=valid.filter(function(c){ var s=cubeCells(c);
      return !valid.some(function(o){ if(o===c) return false; var os=cubeCells(o);
        return os.length>s.length && s.every(function(m){return os.indexOf(m)>=0;}); }); });
    var need={}; ones.forEach(function(m){need[m]=1;});
    var ch=[], guard=0;
    while(Object.keys(need).length && guard++<30){
      var best=null,bn=-1;
      primes.forEach(function(p){ var gg=cubeCells(p).filter(function(m){return need[m];}).length;
        if(gg>bn){bn=gg;best=p;} });
      if(!best||bn<=0) break;
      ch.push(best); cubeCells(best).forEach(function(m){delete need[m];});
    }
    return ch;
  }

  /* ================= the two maps ================= */
  var GRAY=[0,1,3,2];
  function kmap(hostId,exprId,initial,names,note){
    var host=document.getElementById(hostId); if(!host) return;
    var cells=initial.slice(), CW=104, CH=92, X0=140, Y0=96;
    var PAL=[BLUE,RED,GRN,AMB,VIO];
    function draw(){
      host.innerHTML='';
      var ones=[]; cells.forEach(function(v,m){ if(v) ones.push(m); });
      var terms=minimise(3,ones);
      txt(host,X0-30,Y0-46,names[0],{'font-size':14,fill:INK,'font-weight':700,'text-anchor':'end'});
      txt(host,X0+16,Y0-46,names[1]+' '+names[2],{'font-size':14,fill:INK,'font-weight':700});
      pth(host,'M'+(X0-26)+' '+(Y0-62)+' L'+(X0-2)+' '+(Y0-38),{stroke:GREY,'stroke-width':1.5});
      ['00','01','11','10'].forEach(function(c,j){ txt(host,X0+j*CW+CW/2,Y0-14,c,{'font-size':13,'text-anchor':'middle'}); });
      ['0','1'].forEach(function(r,ri){ txt(host,X0-14,Y0+ri*CH+CH/2+5,r,{'font-size':13,'text-anchor':'end'}); });
      for(var r=0;r<2;r++) for(var c=0;c<4;c++){
        var m=(r<<2)|GRAY[c], v=cells[m];
        var rr=el('rect',{x:X0+c*CW,y:Y0+r*CH,width:CW,height:CH,
          fill:v?'#fbf0dc':'#fff',stroke:GREY,'stroke-width':1.5},host);
        rr.style.cursor='pointer';
        rr.onclick=(function(mm){ return function(){ cells[mm]=cells[mm]?0:1; draw(); }; })(m);
        txt(host,X0+c*CW+CW/2,Y0+r*CH+CH/2+9,v,{'font-size':24,fill:v?AMB:'#c6c3ba',
          'text-anchor':'middle','font-weight':700,'pointer-events':'none'});
        txt(host,X0+c*CW+7,Y0+r*CH+17,m,{'font-size':10.5,fill:'#d5d2ca','pointer-events':'none'});
      }
      terms.forEach(function(t,gi){
        var ms=cubeCells(t), rs={}, cs={};
        ms.forEach(function(m){ rs[m>>2&1]=1; cs[GRAY.indexOf(m&3)]=1; });
        var rl=Object.keys(rs).map(Number).sort(function(a,b){return a-b;});
        var cl=Object.keys(cs).map(Number).sort(function(a,b){return a-b;});
        function runs(list,total){ if(list.length===total) return [[0,total]];
          var out=[],st=list[0],pv=list[0];
          for(var q=1;q<list.length;q++){ if(list[q]===pv+1) pv=list[q];
            else { out.push([st,pv-st+1]); st=list[q]; pv=list[q]; } }
          out.push([st,pv-st+1]); return out; }
        var ins=5+gi*4;
        runs(rl,2).forEach(function(rr){ runs(cl,4).forEach(function(cc){
          el('rect',{x:X0+cc[0]*CW+ins,y:Y0+rr[0]*CH+ins,width:cc[1]*CW-2*ins,height:rr[1]*CH-2*ins,rx:12,
            fill:PAL[gi%5],'fill-opacity':.07,stroke:PAL[gi%5],'stroke-width':2.6,'pointer-events':'none'},host);
        }); });
      });
      var ex=document.getElementById(exprId);
      if(ex){
        ex.innerHTML = terms.length
          ? terms.map(function(t,gi){ return '<span style="color:'+PAL[gi%5]+'">'+termText(names,t)+'</span>'; }).join(' + ')+
            '<br><span style="color:#8b9096;font-weight:400;font-size:12.5px">'+note+'</span>'
          : '<span style="color:#8b9096">nothing on the map</span>';
      }
    }
    draw();
  }
  var NM3=['a','b','cin'];
  kmap('kmSum','kmSumExpr',[0,1,1,0,1,0,0,1],NM3,'four terms, and not one circle anywhere');
  kmap('kmCout','kmCoutExpr',[0,0,0,1,0,1,1,1],NM3,'three circles of two, exactly as you would hope');

  /* ================= you have built this ================= */
  (function(){
    var g=document.getElementById('figSame'); if(!g) return;
    var joined=false;
    function map(X,title,labels,col,sub){
      txt(g,X,32,title,{'font-size':10.5,fill:col,'letter-spacing':1.6});

  /* ================= the full adder, assembled ================= */
  (function(){
    var g=document.getElementById('figFull'); if(!g) return;
    var a=1,b=1,ci=1, stg=0;
    var RA=150, RB=182, RC=214, AY=62, BY=124, CY=186;
    var X1X=316, X1Y=74, X1H=24, X2X=486, X2Y=126, X2H=24;
    var ANX=420, ANH=22, AND=[{y:250,t:'a b'},{y:322,t:'a cin'},{y:394,t:'b cin'}];
    var ORX=580, ORY=322, ORH=50, OUTX=782;
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var x1=a^b, s=x1^ci;
      var t=[(a&&b)?1:0,(a&&ci)?1:0,(b&&ci)?1:0];
      var co=(t[0]||t[1]||t[2])?1:0;
      pin(g,58,AY,a,'a',function(){ a=a?0:1; render(); });
      pin(g,58,BY,b,'b',function(){ b=b?0:1; render(); });
      pin(g,58,CY,ci,'cin',function(){ ci=ci?0:1; render(); });
      var aBot = stg>=3?314:AY, bBot = stg>=3?386:BY, cBot = stg>=3?410:(stg>=2?140:CY);
      wire(g,85,AY,RA,AY,a);  wire(g,RA,AY,RA,aBot,a);
      wire(g,85,BY,RB,BY,b);  wire(g,RB,90,RB,bBot,b);
      wire(g,85,CY,RC,CY,ci); wire(g,RC,Math.min(140,CY),RC,cBot,ci);
      if(stg>=1){
        wire(g,RA,AY,X1X-4,AY,a); jn(g,RA,AY);
        wire(g,RB,90,X1X-4,90,b); jn(g,RB,90);
        gOr(g,X1X,X1Y,X1H,x1,true);
        txt(g,X1X+34,X1Y-X1H-13,'a XOR b',{'font-size':12,fill:x1?AMB:'#a9a69d','text-anchor':'middle'});
      }
      if(stg>=2){
        poly(g,[[orTip(X1X,X1H),X1Y],[440,X1Y],[440,114],[X2X-4,114]],x1);
        wire(g,RC,140,X2X-4,140,ci); jn(g,RC,140);
        gOr(g,X2X,X2Y,X2H,s,true);
        txt(g,X2X+36,X2Y-X2H-13,'XOR again',{'font-size':12,fill:s?AMB:'#a9a69d','text-anchor':'middle'});
        wire(g,orTip(X2X,X2H),X2Y,OUTX,X2Y,s);
        outBox(g,OUTX,X2Y,s,'SUM');
      }
      if(stg>=3){
        var taps=[[[RA,238,a],[RB,262,b]],[[RA,314,a],[RC,338,ci]],[[RB,386,b],[RC,410,ci]]];
        AND.forEach(function(G,k){
          taps[k].forEach(function(tp){ wire(g,tp[0],tp[1],ANX,tp[1],tp[2]); jn(g,tp[0],tp[1]); });
          gAnd(g,ANX,G.y,ANH,t[k]);
          txt(g,ANX+26,G.y-ANH-12,G.t,{'font-size':12,fill:t[k]?AMB:'#a9a69d','text-anchor':'middle'});
        });
      }
      if(stg>=4){
        var TIP=andTip(ANX,ANH), L=ORX-4;
        poly(g,[[TIP,AND[0].y],[520,AND[0].y],[520,300],[L,300]],t[0]);
        wire(g,TIP,AND[1].y,L,ORY,t[1]);
        poly(g,[[TIP,AND[2].y],[540,AND[2].y],[540,344],[L,344]],t[2]);
        gOr(g,ORX,ORY,ORH,co);
        txt(g,ORX+38,ORY-ORH-13,'OR',{'font-size':12,fill:co?AMB:'#a9a69d','text-anchor':'middle'});
        wire(g,orTip(ORX,ORH),ORY,OUTX,ORY,co);
        outBox(g,OUTX,ORY,co,'CARRY OUT');
      }
      var caps=[
        'three inputs on their rails, and nothing built yet',
        'the sum starts as a XOR b, exactly like the half adder did',
        'then XOR that with the carry in, and the sum is finished',
        'the carry needs to know whether any two inputs are 1, so: three AND gates',
        'and one OR to ask whether any of the three fired'
      ];
      txt(g,58,440,caps[stg],{'font-size':15.5,fill:stg===4?GRN:'#8b9096','font-weight':stg===4?700:400});
      if(stg===4) txt(g,660,440,a+' + '+b+' + '+ci+' = '+(a+b+ci)+',  written '+co+' '+s,
        {'font-size':14,fill:INK,'font-weight':700});
    }
    document.getElementById('bNext').onclick=function(){ stg=(stg>=4)?0:stg+1; render(); };
    document.getElementById('bAll').onclick=function(){ stg=4; render(); };
    document.getElementById('bReset').onclick=function(){ stg=0; render(); };
    render();
  })();
