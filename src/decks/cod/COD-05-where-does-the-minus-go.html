<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 5 · Where do we put the minus sign?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:70px 92px 104px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:32px;left:92px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:32px;right:92px;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:92px;right:92px;bottom:36px;display:flex;gap:3px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:92px;bottom:60px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:92px;bottom:60px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.kicker.grey{color:var(--soft)} .kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:96px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.07;letter-spacing:-.02em;color:var(--ink);margin-bottom:24px}
p{font-size:27px;line-height:1.48;max-width:31ch}
p+p{margin-top:15px}
.big{font-size:36px;line-height:1.3;color:var(--ink);font-weight:300;max-width:26ch}
.small{font-size:21px;line-height:1.5;color:var(--soft);max-width:58ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
.pos{color:var(--accent)} .neg{color:var(--fail)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
.split.l{grid-template-columns:1.12fr .88fr}
.split.r{grid-template-columns:.84fr 1.16fr}
.stack>*+*{margin-top:16px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:14px}

.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);border:1px solid var(--rule2);border-radius:7px;padding:10px 15px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warm{background:var(--fail);border-color:var(--fail);color:#fff}
.btnrow{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center;justify-content:center}
input[type=number]{font-family:var(--mono);font-size:24px;background:var(--stage);color:var(--ink);border:2px solid var(--rule2);border-radius:7px;padding:5px 8px;width:5.5ch;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* bit rows */
.bits{display:flex;gap:5px;justify-content:center}
.bits .c{width:60px;text-align:center;cursor:pointer;user-select:none}
.bits .w{font-family:var(--mono);font-size:13px;color:var(--soft);margin-bottom:5px;height:16px}
.bits .v{font-family:var(--mono);font-size:28px;font-weight:700;height:54px;line-height:54px;
  border:1px solid var(--rule2);border-radius:6px;background:#f1efe9;color:#a9a69d;transition:.12s}
.bits .c.on .v{background:var(--accent);border-color:var(--accent);color:#fff}
.bits .c.sign .v{border-width:3px;border-color:var(--ink)}
.bits .c.sign.on .v{background:var(--fail);border-color:var(--fail)}
.bits .c.sign .w{color:var(--ink);font-weight:700}

.work{font-family:var(--mono);font-size:25px;line-height:1.45;color:var(--ink);white-space:pre;display:inline-block;text-align:left}
.work .d{color:var(--soft)} .work .c{color:var(--fail)}
.work .bar{border-top:2px solid var(--ink);padding-top:4px;margin-top:3px}
.work .tot{color:var(--accent);font-weight:700}
.work .bad{color:var(--fail);font-weight:700}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:9px 3px;border-bottom:1px solid var(--rule);font-size:23px}
.readout td:first-child{color:var(--soft);font-size:13px;letter-spacing:.13em;text-transform:uppercase;width:12rem}
.readout td:last-child{text-align:right;font-weight:700;color:var(--ink)}
.readout tr:last-child td{border-bottom:none}

/* width dial */
.wd{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.wd button{font-family:var(--mono);font-size:18px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:8px;padding:11px 20px;cursor:pointer}
.wd button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

figcaption{font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:10px}
svg text{font-family:'JetBrains Mono',monospace}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:92px;right:92px;bottom:88px;display:none;padding:13px 17px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:64px 92px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:20px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:70px}
#jump li{padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:21px;color:var(--body);display:flex;gap:18px;break-inside:avoid}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:42px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 05</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 5 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ===== ACT 1 · THE GAP ===== -->

<!-- 01 -->
<section class="slide" data-t="Title" data-act="1 · the gap">
  <div>
    <div class="kicker">class 05 · hour five of fifty</div>
    <h1>Where do we put<br>the minus sign?</h1>
    <p class="big" style="margin-top:36px;max-width:38ch">Last session we could write any number in any base, provided it was not negative. Which is exactly half of the integers.</p>
  </div>
  <div class="cue">Open by asking them to write minus five in binary. Give it thirty seconds. Somebody will invent sign magnitude unprompted.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Both symbols are taken" data-act="1 · the gap">
  <div>
    <div class="kicker grey">how a human does it</div>
    <h2 style="margin-bottom:22px">You reach for<br>a new symbol.</h2>
    <div class="split">
      <div class="stack">
        <p>To write minus five you write a mark that is not a digit, in front of the digits. The minus sign is not part of the number system. It sits outside it.</p>
      </div>
      <div class="stack frag">
        <p class="big">The machine cannot do that.</p>
        <p>It has exactly two symbols and both of them already mean something. There is no third mark to reach for.</p>
        <p class="small frag">So the sign has to be paid for out of the patterns we already have.</p>
      </div>
    </div>
  </div>
  <div class="cue">This framing matters. Every scheme that follows is a decision about how to spend patterns, not a decision about notation.</div>
</section>

<!-- ===== ACT 2 · THE OBVIOUS ANSWER ===== -->

<!-- 03 -->
<section class="slide" data-t="Spend a bit" data-act="2 · the obvious answer">
  <div>
    <div class="kicker">everybody proposes this first</div>
    <h2 style="font-size:52px;margin-bottom:14px">Spend one bit on the sign.</h2>
    <div class="split r" style="gap:44px">
      <div class="stack">
        <p>The leftmost bit means negative. The other seven carry the size, exactly as before.</p>
        <p class="small">It is how humans write numbers, so it feels obviously right. It is also the scheme that fails hardest.</p>
      </div>
      <div class="panel">
        <span class="lab">sign and magnitude · click any bit</span>
        <div class="bits" id="smBits"></div>
        <table class="readout" style="margin-top:18px">
          <tr><td>sign bit says</td><td id="smSign">positive</td></tr>
          <tr><td>magnitude</td><td id="smMag">0</td></tr>
          <tr><td>value</td><td id="smVal" style="font-size:32px">0</td></tr>
        </table>
        <div class="btnrow">
          <button class="btn" data-sm="5">+5</button>
          <button class="btn" data-sm="133">&minus;5</button>
          <button class="btn" data-sm="0">0</button>
          <button class="btn warm" data-sm="128">the other zero</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Do not press the last button yet. Let them play with the first three and feel that it works.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Two zeros" data-act="2 · the obvious answer">
  <div>
    <div class="kicker red">and then somebody writes zero</div>
    <h2 style="font-size:52px;margin-bottom:20px">Two patterns.<br>The same number.</h2>
    <div class="split" style="gap:44px">
      <div class="panel" style="text-align:center">
        <div class="lab">00000000</div>
        <div style="font-family:var(--display);font-size:72px;font-weight:600;color:var(--accent);line-height:1">+0</div>
      </div>
      <div class="panel frag" style="text-align:center;border-color:#eecdcb;background:var(--fail-soft)">
        <div class="lab">10000000</div>
        <div style="font-family:var(--display);font-size:72px;font-weight:600;color:var(--fail);line-height:1">&minus;0</div>
      </div>
    </div>
    <p class="big frag" style="margin-top:26px;max-width:70ch;font-size:31px">There is no such thing as negative zero. One of these 256 patterns now means nothing at all, and worse, <span class="mark">two different patterns have to test as equal.</span></p>
  </div>
  <div class="cue">Ask what `if (x == 0)` has to do now. Two comparisons instead of one, on every zero test in every program forever.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="The adder breaks" data-act="2 · the obvious answer">
  <div>
    <div class="kicker red">but the real damage is here</div>
    <h2 style="font-size:50px;margin-bottom:16px">Now add five and minus five.</h2>
    <div class="split l">
      <div class="panel" style="text-align:center">
        <div class="work">
<span class="d">  5   </span>00000101
<span class="d">  -5  </span>10000101
<span class="bar bad">      10001010</span>
<span class="d" style="font-size:19px">          which reads as -10</span></div>
      </div>
      <div class="stack">
        <p>Line up the columns and add, the way you have added in every base for the last four hours.</p>
        <p class="big frag">The answer should be zero. It is not even close.</p>
        <p class="frag">So a machine using this scheme cannot just add. It has to compare the signs first, decide whether this is really a subtraction, work out which number is bigger, and only then start.</p>
      </div>
    </div>
  </div>
  <div class="cue">The cost is not the wasted pattern. The cost is that a comparator and a subtractor have to exist before addition can begin.</div>
</section>

<!-- ===== ACT 3 · THE CIRCLE ===== -->

<!-- 06 -->
<section class="slide" data-t="Step back" data-act="3 · the circle">
  <div class="center">
    <div class="kicker">so put that down and go back further</div>
    <h2 style="font-size:54px;margin-bottom:26px">Four bits. Count up<br>from zero.</h2>
    <p class="big" style="max-width:44ch;color:var(--soft)">Zero, one, two, and onwards to fifteen.</p>
    <p class="big frag" style="margin-top:28px;max-width:44ch">Now add one more. What happens?</p>
  </div>
  <div class="cue">Take answers. Some say sixteen, some say error, some say it breaks. All three are wrong.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="No number line" data-act="3 · the circle">
  <div>
    <div class="kicker red">nothing happens, and that is the point</div>
    <h2 style="margin-bottom:22px">There is no sixteen.<br>There is no error.</h2>
    <div class="split">
      <div class="stack">
        <p>Fifteen is <span class="num">1111</span>. Add one and every column carries, and the carry off the end has nowhere to go, because there is no fifth wire.</p>
        <p class="frag">You get <span class="num">0000</span>. Zero.</p>
      </div>
      <div class="stack frag">
        <p class="big">Which means the number line was never the right picture.</p>
        <p class="big" style="color:var(--accent)">A fixed number of bits is a circle.</p>
      </div>
    </div>
  </div>
  <div class="cue">Say plainly that this is not a bug and not a design choice. It is what a finite row of wires physically does.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="The circle" data-act="3 · the circle">
  <div>
    <div class="kicker">every four bit pattern there is</div>
    <div class="split r" style="gap:40px">
      <div class="stack">
        <h2 style="font-size:46px;margin-bottom:16px">Sixteen positions.<br>No ends.</h2>
        <p class="small">Step around it. Fifteen is not the top of anything. It is simply the position next to zero, on the other side.</p>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="r1up">+1</button>
          <button class="btn" id="r1dn">&minus;1</button>
          <button class="btn" id="r1run">run</button>
        </div>
      </div>
      <div style="text-align:center">
        <div id="ring1"></div>
      </div>
    </div>
  </div>
  <div class="cue">Run it. Let it lap the circle twice while you say nothing. The wrap from 1111 to 0000 is the whole slide.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="It is a clock" data-act="3 · the circle">
  <div>
    <div class="kicker grey">you already own this idea</div>
    <h2 style="margin-bottom:22px">It is a clock.</h2>
    <div class="split">
      <div class="stack">
        <p>Three hours before two o'clock is eleven o'clock. You did not go below zero to get there. You went round.</p>
        <p class="frag">Nobody finds that confusing, and nobody needs a minus sign to say it.</p>
      </div>
      <div class="stack frag">
        <p class="big">So on a circle, going backwards and going forwards are the same operation.</p>
        <p class="big" style="color:var(--accent)">Which means subtracting is already addition, if we are willing to read the answer differently.</p>
      </div>
    </div>
  </div>
  <div class="cue">This is the hinge of the hour. If they nod at the clock, the rest of the class is a formality.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="One before zero" data-act="3 · the circle">
  <div class="center">
    <div class="kicker">so ask the only question that matters</div>
    <h2 style="font-size:54px;margin-bottom:28px">What sits one step<br>before zero?</h2>
    <p class="big frag" style="max-width:40ch">1111. Fifteen.</p>
    <p class="big frag" style="margin-top:24px;max-width:48ch;color:var(--accent)">And one step before that is 1110. Fourteen. And before that, thirteen.</p>
  </div>
  <div class="cue">Walk backwards from zero on the previous slide's ring while you say this. Do not name two's complement yet.</div>
</section>

<!-- ===== ACT 4 · STEAL IT ===== -->

<!-- 11 -->
<section class="slide" data-t="Just declare it" data-act="4 · steal it">
  <div>
    <div class="kicker">so we do not invent anything</div>
    <h2 style="font-size:52px;margin-bottom:22px">We just say so out loud.</h2>
    <div class="split">
      <div class="stack">
        <p>The pattern one step before zero already behaves exactly like minus one. It always did. Add one to it and you get zero.</p>
        <p class="big frag" style="margin-top:10px">So let it <em>mean</em> minus one.</p>
      </div>
      <div class="stack frag">
        <p>Fourteen means minus two. Thirteen means minus three. Cut the circle in half and read the far side as negative.</p>
        <p class="small">Nothing about the circle changed. We changed only what we agree the marks mean.</p>
      </div>
    </div>
  </div>
  <div class="cue">Emphasise that no circuit was modified. This is a reading decision imposed on hardware that already behaved this way.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="Cut it in half" data-act="4 · steal it">
  <div>
    <div class="kicker">the same sixteen patterns, read two ways</div>
    <div class="split r" style="gap:40px">
      <div class="stack">
        <h2 style="font-size:44px;margin-bottom:14px">Half positive.<br>Half negative.</h2>
        <table class="readout">
          <tr><td>pattern</td><td id="r2pat">0000</td></tr>
          <tr><td>read unsigned</td><td id="r2u" class="pos">0</td></tr>
          <tr><td>read signed</td><td id="r2s" class="neg">0</td></tr>
        </table>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="r2sw">read as signed</button>
          <button class="btn" id="r2up">+1</button>
          <button class="btn" id="r2dn">&minus;1</button>
        </div>
      </div>
      <div style="text-align:center">
        <div id="ring2"></div>
      </div>
    </div>
  </div>
  <div class="cue">Toggle the reading back and forth on the same pattern. The bits do not move. Only the labels do.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="Test it" data-act="4 · steal it">
  <div>
    <div class="kicker">now the only test that counts</div>
    <div class="split r" style="gap:40px">
      <div class="stack">
        <h2 style="font-size:44px;margin-bottom:14px">Five plus<br>minus three.</h2>
        <p class="small">Minus three is the pattern 1101, which an ordinary counter reads as thirteen. So step forward thirteen times from five and see where you land.</p>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="r3go">walk it</button>
          <button class="btn" id="r3rst">reset</button>
        </div>
        <table class="readout" style="margin-top:14px">
          <tr><td>steps taken</td><td id="r3n">0 of 13</td></tr>
          <tr><td>landed on</td><td id="r3land">0101</td></tr>
          <tr><td>which is</td><td id="r3val" class="pos">5</td></tr>
        </table>
      </div>
      <div style="text-align:center">
        <div id="ring3"></div>
      </div>
    </div>
  </div>
  <div class="cue">Walk it slowly. When it passes 1111 and wraps to 0000 the room usually reacts, and it lands on two.</div>
</section>

<!-- 14 -->
<section class="slide" data-t="Nothing changed" data-act="4 · steal it">
  <div>
    <div class="kicker grey">look at what the hardware did</div>
    <h2 style="margin-bottom:22px">It counted forwards.<br>That is all it did.</h2>
    <div class="split">
      <div class="stack">
        <p>It did not know one of those numbers was negative. It did not check a sign bit. It did not decide anything.</p>
        <p class="frag">It added thirteen to five and threw away the carry off the end, which is the only thing it has ever been able to do.</p>
      </div>
      <div class="stack frag">
        <p class="big">Subtraction came out for free, from a circuit that cannot subtract,</p>
        <p class="big" style="color:var(--accent)">because we chose the representation to fit the wrapping the wires already did.</p>
      </div>
    </div>
  </div>
  <div class="cue">Flag it forward: in Class 20 they will build that adder, feed it signed numbers, and watch it work with not one gate changed.</div>
</section>

<!-- ===== ACT 5 · THE NAME ===== -->

<!-- 15 -->
<section class="slide" data-t="It has a name" data-act="5 · the name">
  <div class="center">
    <div class="kicker">what you just built</div>
    <h1 style="font-size:82px">Two's complement.</h1>
    <p class="big frag" style="margin-top:34px;max-width:50ch">Usually introduced as a rule to memorise. You have instead just derived it from the only thing a fixed row of wires can physically do.</p>
  </div>
  <div class="cue">Say that most textbooks give the rule first and the reason never. They now have it the right way round.</div>
</section>

<!-- 16 -->
<section class="slide" data-t="The sign bit, free" data-act="5 · the name">
  <div>
    <div class="kicker">and here is a small gift</div>
    <h2 style="font-size:50px;margin-bottom:20px">The leftmost bit still<br>tells you the sign.</h2>
    <div class="split">
      <div class="stack">
        <p>Every pattern on the negative half of the circle starts with a one. Every pattern on the positive half starts with a zero. Check the ring if you like.</p>
      </div>
      <div class="stack frag">
        <p class="big">Nobody designed that.</p>
        <p>It fell out of cutting the circle exactly in half. You get the convenience of a sign bit without paying for it, and without the two zeros.</p>
      </div>
    </div>
  </div>
  <div class="cue">Worth flicking back to the ring. Half of it starts with 1, and it is the half we called negative.</div>

<!-- 17 -->
<section class="slide" data-t="Flip and add one" data-act="5 · the name">
  <div>
    <div class="kicker">the rule you were going to be taught</div>
    <h2 style="font-size:48px;margin-bottom:16px">Where flip and add one<br>comes from.</h2>
    <div class="split l">
      <div class="panel" style="text-align:center">
        <div class="work" id="flipWork"></div>
      </div>
      <div class="stack">
        <p>Going backwards from zero by five is the same as going all the way round and stopping five short of the top.</p>
        <p class="frag">So minus five is <span class="num">256 &minus; 5</span>. Split that into <span class="num">255 &minus; 5</span> and then one more.</p>
        <p class="big frag">Subtracting from 255 flips every bit, because every column is one minus that bit.</p>
      </div>
    </div>
  </div>
  <div class="cue">Do the middle line on the board. Once they see 255 minus a bit is the flipped bit, the rule stops being magic.</div>
</section>

        <div style="font-family:var(--mono);font-size:38px;font-weight:700;color:var(--accent);word-break:break-all" id="wMax">7</div>
        <div class="small" style="font-size:17px;margin-top:8px" id="wMaxF">2<sup>n&minus;1</sup> &minus; 1</div>
      </div>
      <div class="panel" style="text-align:center">
        <span class="lab">most negative</span>

<!-- 19 -->
<section class="slide" data-t="The asymmetry" data-act="6 · any width">
  <div>
    <div class="kicker red">and now notice something uneven</div>
    <h2 style="font-size:50px;margin-bottom:20px">There is one more negative<br>than there is positive.</h2>
    <div class="split">
      <div class="stack">
        <p>Eight bits go from minus 128 up to plus 127. Not plus 128.</p>
        <p class="frag">The two halves of the circle are exactly the same size. But the positive half has to give one of its slots to zero, and the negative half does not.</p>
      </div>
      <div class="stack frag">
        <p class="big">So there is a negative number you cannot negate.</p>
        <p class="small">Minus 128 has no positive partner in eight bits. Ask a machine for its absolute value and it hands you minus 128 back, without complaint. That is a real bug that ships, and you now know exactly why.</p>
      </div>
    </div>
  </div>
  <div class="cue">If anyone wants to see it, abs(INT_MIN) is undefined behaviour in C and returns INT_MIN on most machines.</div>
</section>

<script>
(function(){
  'use strict';

  /* ---------- chassis ---------- */
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  /* decided in the capture phase, before a widget can redraw and detach the node */
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')|| e.target.closest('input')||e.target.closest('.wd')||e.target.closest('svg'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  function b4(n){ var s=(n>>>0).toString(2); while(s.length<4) s='0'+s; return s.slice(-4); }
  function b8(n){ var s=(n>>>0).toString(2); while(s.length<8) s='0'+s; return s.slice(-8); }

  /* ---------- sign and magnitude ---------- */
  var smB=document.getElementById('smBits');
  if(smB){
    var v=5;
    function drawSM(){
      var h='';
      for(var k=0;k<8;k++){
        var bit=(v>>(7-k))&1;
        var sign=(k===0);
        h+='<div class="c'+(sign?' sign':'')+(bit?' on':'')+'" data-k="'+k+'">'+
           '<div class="w">'+(sign?'SIGN':Math.pow(2,7-k))+'</div><div class="v">'+bit+'</div></div>';
      }
      smB.innerHTML=h;
      Array.prototype.forEach.call(smB.querySelectorAll('.c'),function(c){
        c.onclick=function(){ v ^= (1<<(7-(+c.dataset.k))); drawSM(); };
      });
      var neg=(v>>7)&1, mag=v&127;
      document.getElementById('smSign').textContent = neg?'negative':'positive';
      document.getElementById('smSign').style.color = neg?'var(--fail)':'var(--accent)';
      document.getElementById('smMag').textContent = mag;
      var out=document.getElementById('smVal');
      out.textContent=(neg?'-':'+')+mag;
      out.style.color = neg?'var(--fail)':'var(--accent)';
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-sm]'),function(b){
      b.onclick=function(){ v=+b.dataset.sm; drawSM(); };
    });
    drawSM();
  }

  /* ---------- the ring ---------- */
  function drawRing(host, cur, opts){
    opts=opts||{};
    var R=195, C=260, s='<svg viewBox="0 0 520 520" width="440" height="440">';
    if(opts.signed){
      s+='<path d="M '+C+' '+(C-R-38)+' A '+(R+38)+' '+(R+38)+' 0 0 1 '+C+' '+(C+R+38)+'" fill="none" stroke="#f0dcda" stroke-width="30"/>';
      s+='<path d="M '+C+' '+(C+R+38)+' A '+(R+38)+' '+(R+38)+' 0 0 1 '+C+' '+(C-R-38)+'" fill="none" stroke="#dde4f3" stroke-width="30"/>';
      s+='<text x="'+(C+R+62)+'" y="'+C+'" font-size="15" fill="#a8231f" text-anchor="middle">NEG</text>';
      s+='<text x="'+(C-R-62)+'" y="'+C+'" font-size="15" fill="#23408f" text-anchor="middle">POS</text>';
    }
    s+='<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="#e2e0d9" stroke-width="2"/>';
    if(opts.path && opts.path.length>1){
      for(var j=0;j<opts.path.length-1;j++){
        var a1=(opts.path[j]/16)*2*Math.PI-Math.PI/2, a2=(opts.path[j+1]/16)*2*Math.PI-Math.PI/2;
        s+='<path d="M '+(C+R*Math.cos(a1))+' '+(C+R*Math.sin(a1))+
           ' A '+R+' '+R+' 0 0 1 '+(C+R*Math.cos(a2))+' '+(C+R*Math.sin(a2))+
           '" fill="none" stroke="#ffdf8a" stroke-width="12" stroke-linecap="round"/>';
      }
    }
    for(var k=0;k<16;k++){
      var a=(k/16)*2*Math.PI-Math.PI/2, x=C+R*Math.cos(a), y=C+R*Math.sin(a);
      var isCur=(k===cur), negHalf=opts.signed && k>=8;
      var fill = isCur ? (negHalf?'#a8231f':'#23408f') : (negHalf?'#fbeeed':'#fff');
      var stroke = isCur ? (negHalf?'#a8231f':'#23408f') : (negHalf?'#e0bcb9':'#c6c3ba');
      s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="27" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(isCur?3:1.5)+'"/>';
      var label = opts.signed ? (k>=8 ? k-16 : k) : k;
      s+='<text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" font-size="20" font-weight="700" fill="'+
         (isCur?'#fff':(negHalf?'#a8231f':'#4b5057'))+'" text-anchor="middle">'+label+'</text>';
      var xo=C+(R+52)*Math.cos(a), yo=C+(R+52)*Math.sin(a);
      s+='<text x="'+xo.toFixed(1)+'" y="'+(yo+5).toFixed(1)+'" font-size="13" fill="'+(isCur?'#15171b':'#a9a69d')+'" text-anchor="middle">'+b4(k)+'</text>';
    }
    if(opts.cut){
      s+='<line x1="'+C+'" y1="'+(C-R-58)+'" x2="'+C+'" y2="'+(C+R+58)+'" stroke="#15171b" stroke-width="2" stroke-dasharray="7 6"/>';
    }
    s+='</svg>';
    host.innerHTML=s;
  }

  /* ring 1 : plain counter */
  var ring1=document.getElementById('ring1');
  if(ring1){
    var p1=0, t1=null;
    function d1(){ drawRing(ring1,p1,{}); }
    document.getElementById('r1up').onclick=function(){ p1=(p1+1)&15; d1(); };
    document.getElementById('r1dn').onclick=function(){ p1=(p1+15)&15; d1(); };
    document.getElementById('r1run').onclick=function(){
      if(t1){ clearInterval(t1); t1=null; this.textContent='run'; return; }
      this.textContent='stop';
      t1=setInterval(function(){ p1=(p1+1)&15; d1(); },420);
    };
    d1();
  }

  /* ring 2 : signed toggle */
  var ring2=document.getElementById('ring2');
  if(ring2){
    var p2=0, signed=false;
    function d2(){
      drawRing(ring2,p2,{signed:signed,cut:signed});
      document.getElementById('r2pat').textContent=b4(p2);
      document.getElementById('r2u').textContent=p2;
      document.getElementById('r2s').textContent=(p2>=8?p2-16:p2);
      document.getElementById('r2sw').textContent = signed ? 'read as unsigned' : 'read as signed';
    }
    document.getElementById('r2up').onclick=function(){ p2=(p2+1)&15; d2(); };
    document.getElementById('r2dn').onclick=function(){ p2=(p2+15)&15; d2(); };
    document.getElementById('r2sw').onclick=function(){ signed=!signed; d2(); };
    d2();
  }

  /* ring 3 : walking an addition */
  var ring3=document.getElementById('ring3');
  if(ring3){
    var START=5, STEPS=13, p3=START, done=0, t3=null, path=[START];
    function d3(){
      drawRing(ring3,p3,{signed:true,cut:true,path:path});
      document.getElementById('r3n').textContent=done+' of '+STEPS;
      document.getElementById('r3land').textContent=b4(p3);
      var sv=(p3>=8?p3-16:p3);
      var e=document.getElementById('r3val');
      e.textContent=sv;
      e.className=(sv<0?'neg':'pos');
    }
    document.getElementById('r3go').onclick=function(){
      if(t3) return;
      t3=setInterval(function(){
        if(done>=STEPS){ clearInterval(t3); t3=null; return; }
        p3=(p3+1)&15; done++; path.push(path[path.length-1]+1); d3();
      },420);
    };
    document.getElementById('r3rst').onclick=function(){
      clearInterval(t3); t3=null; p3=START; done=0; path=[START]; d3();
    };
    d3();
  }

  /* ---------- flip and add one ---------- */
  var fw=document.getElementById('flipWork');
  if(fw){
    fw.innerHTML=
      '<span class="d">      256  </span>1 00000000\n'+
      '<span class="d">   -    5  </span>  00000101\n'+
      '<span class="bar d">  gives  </span>\n'+
      '<span class="d">      255  </span>  11111111\n'+
      '<span class="d">   -    5  </span>  00000101\n'+
      '<span class="bar tot">           11111010</span>\n'+
      '<span class="d" style="font-size:19px">           every bit flipped</span>\n\n'+
      '<span class="d">   +    1  </span>  00000001\n'+
      '<span class="bar tot">           11111011</span>\n'+
      '<span class="d" style="font-size:19px">           which is -5</span>';
  }

  /* ---------- width dial ---------- */
  var wd=document.getElementById('wDial');
  if(wd){
    var WIDTHS=[4,8,16,32,64], cw=4;
    function commas(bi){
      var s=bi.toString(), neg=s.charAt(0)==='-';
      if(neg) s=s.slice(1);
      var out='';
      for(var k=0;k<s.length;k++){
        if(k>0 && (s.length-k)%3===0) out+=',';
        out+=s.charAt(k);
      }
      return (neg?'-':'')+out;
    }
    function drawW(){
      var h='';
      WIDTHS.forEach(function(b){ h+='<button data-w="'+b+'" class="'+(b===cw?'on':'')+'">'+b+' bits</button>'; });
      wd.innerHTML=h;
      Array.prototype.forEach.call(wd.querySelectorAll('button'),function(b){
        b.onclick=function(){ cw=+b.dataset.w; drawW(); };
      });
      var half=BigInt(2)**BigInt(cw-1);
      document.getElementById('wMax').textContent=commas(half-BigInt(1));
      document.getElementById('wMin').textContent=commas(-half);
      document.getElementById('wTot').textContent=commas(BigInt(2)**BigInt(cw));
    }
    drawW();
  }

  /* ---------- the 2038 figure ---------- */
  var fg=document.getElementById('fig2038');
  if(fg){
    var C=650, CY=172, R=105, s='';
    /* right half counts up, matching the rings earlier in the deck */
    s+='<path d="M '+C+' '+(CY-R)+' A '+R+' '+R+' 0 0 1 '+C+' '+(CY+R)+'" fill="none" stroke="#23408f" stroke-width="15"/>';
    /* left half is read as negative */
    s+='<path d="M '+C+' '+(CY+R)+' A '+R+' '+R+' 0 0 1 '+C+' '+(CY-R)+'" fill="none" stroke="#a8231f" stroke-width="15"/>';
    /* direction of travel, clockwise, at the rightmost point */
    s+='<path d="M '+(C+R-9)+' '+(CY-3)+' L '+(C+R+9)+' '+(CY-3)+' L '+(C+R)+' '+(CY+16)+' z" fill="#23408f"/>';
    /* the cut */
    s+='<line x1="'+C+'" y1="'+(CY-R-26)+'" x2="'+C+'" y2="'+(CY+R+26)+'" stroke="#15171b" stroke-width="2" stroke-dasharray="7 6"/>';
    /* zero at the top */
    s+='<circle cx="'+C+'" cy="'+(CY-R)+'" r="10" fill="#15171b"/>';
    s+='<text x="'+C+'" y="'+(CY-R-38)+'" font-size="16" fill="#15171b" text-anchor="middle">0  ·  1 JANUARY 1970</text>';
    /* the crossing at the bottom */
    s+='<circle cx="'+C+'" cy="'+(CY+R)+'" r="10" fill="#a8231f"/>';
    s+='<text x="'+C+'" y="'+(CY+R+46)+'" font-size="16" fill="#a8231f" text-anchor="middle">THE CROSSING</text>';
    /* side captions */
    s+='<text x="'+(C+R+34)+'" y="'+(CY-6)+'" font-size="16" fill="#23408f">counting up</text>';
    s+='<text x="'+(C+R+34)+'" y="'+(CY+18)+'" font-size="16" fill="#23408f">since 1970</text>';
    s+='<text x="'+(C-R-34)+'" y="'+(CY-6)+'" font-size="16" fill="#a8231f" text-anchor="end">read as</text>';
    s+='<text x="'+(C-R-34)+'" y="'+(CY+18)+'" font-size="16" fill="#a8231f" text-anchor="end">negative</text>';
    /* the two boundary values, well clear of everything */
    s+='<rect x="40" y="344" width="560" height="76" rx="10" fill="#eaeef7" stroke="#c3cee6"/>';
    s+='<text x="64" y="372" font-size="14" fill="#23408f">LAST SECOND BEFORE THE CROSSING</text>';
    s+='<text x="64" y="404" font-size="23" font-weight="700" fill="#15171b">2,147,483,647  ·  19 Jan 2038</text>';
    s+='<rect x="700" y="344" width="560" height="76" rx="10" fill="#fbeeed" stroke="#e0bcb9"/>';
    s+='<text x="724" y="372" font-size="14" fill="#a8231f">ONE SECOND LATER</text>';
    s+='<text x="724" y="404" font-size="23" font-weight="700" fill="#a8231f">-2,147,483,648  ·  13 Dec 1901</text>';
    fg.innerHTML=s;
  }

  paint();
})();
</script>
