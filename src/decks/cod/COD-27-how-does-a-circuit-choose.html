<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 27</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 27 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the question">
  <div>
    <div class="kicker">class 27 · hour twenty seven of fifty</div>
    <h1>How does<br>a circuit choose?</h1>
    <p class="big" style="margin-top:22px;max-width:49ch">Eight hours of arithmetic produced seven separate circuits. A machine has one pair of operands coming in and one result going out. So how does it use seven circuits?</p>
  </div>
  <div class="cue">Draw the seven units on the board before anything goes up. Let them feel the mismatch physically.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the question">
  <div>
    <h2>A new arc. The arithmetic is finished and nothing is connected to anything.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>Do you route the operands, or send them everywhere?</strong> One of those is much easier to build than it sounds.</li>
        <li><strong>What does a chooser look like, in gates?</strong> You have had the machinery to answer this since Class 15.</li>
        <li><strong>And what exactly are its control inputs?</strong> The answer to that one sets up the whole second half of the course.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flag the third question. It is the one that matters, and they will not see why until Class 37.</div>
</section>

<!-- ================= ACT 1 ================= -->

<section class="slide" data-t="Seven circuits, one machine" data-act="1 · the problem, physically">
  <div>
    <h2>Everything you have built, and the problem with all of it at once.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figSeven"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the mismatch</div>
      <ul>
        <li>Seven circuits, each with two inputs and one output. The machine has one pair of inputs and one output.</li>
        <li>Nothing you have built so far decides anything. Every circuit computes its one function and always has.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Count them out loud. Add, subtract, multiply, divide, AND, OR, XOR. Seven boxes, one wire in, one wire out.</div>
</section>

<section class="slide" data-t="Route it, or send it everywhere" data-act="1 · the problem, physically">
  <div>
    <div class="kicker">argue it out before the next slide</div>
    <h2 style="font-size:27px;margin-bottom:0">Two ways to connect them, and the obvious one is the trap.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figRoute"></g></svg></div>
    <div class="btnrow">
      <span class="lab">show</span>
      <button class="btn hot" id="rRoute">route the operands</button>
      <button class="btn" id="rBroad">send them everywhere</button>
    </div>
  </div>
  <div class="cue">Let the room argue properly. Routing sounds efficient and is circular. Let somebody discover that.</div>
</section>

<section class="slide" data-t="Both are selection" data-act="1 · the problem, physically">
  <div class="center">
    <div class="tag">THE REFRAME</div>
    <h2 style="font-size:34px;margin-bottom:16px">Routing needs a circuit that decides where to send.<br>Broadcasting needs a circuit that decides what to keep.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">Both are the same problem. But deciding where to send things is the problem you started with, one step earlier, which gets you nowhere.</p>
    <p class="big frag" style="margin-top:18px;max-width:54ch">Deciding what to keep is a circuit you can write a truth table for. So compute everything, and throw almost all of it away.</p>
  </div>
  <div class="cue">The waste is deliberate and it is the right call. Say so now, and defend it properly later in the hour.</div>
</section>

<!-- ================= ACT 2 ================= -->

<section class="slide" data-t="Write the table" data-act="2 · the multiplexer, from gates">
  <div>
    <div class="kicker">three inputs, so eight rows. you have done this since Class 15</div>
    <h2 style="font-size:27px;margin-bottom:0">Two data inputs, one select input, one output.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1090" height="330"><g id="figTruth"></g></svg></div>
    <div class="btnrow">
      <span class="lab">highlight</span>
      <button class="btn hot" id="tAll">all eight rows</button>
      <button class="btn" id="tS0">the rows where s = 0</button>
      <button class="btn" id="tS1">the rows where s = 1</button>
    </div>
  </div>
  <div class="cue">When s is zero the output copies a and ignores b entirely. Make them see that in the table before the algebra.</div>
</section>

<section class="slide" data-t="Turn it into gates" data-act="2 · the multiplexer, from gates">
  <div>
    <h2>Four product terms from the table, and the map folds two of them away.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figMux2"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Four gates in total: one inverter, two ANDs and an OR. Two gate delays from any input to the output.</li>
        <li>Checked on all eight rows, which is the entire specification. There is nothing else a multiplexer has to do.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Have them do the minimisation on the board. It is a four cell map and it takes ninety seconds.</div>
</section>

<section class="slide" data-t="Read it aloud" data-act="2 · the multiplexer, from gates">
  <div>
    <div class="tag win">THE READING IS THE INTUITION</div>
    <h2 style="font-size:27px;margin-bottom:0">A multiplexer is a set of gates and a promise.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figRead"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">three parts, and the promise is the third</div>
      <ul>
        <li>Each data input is guarded by a condition. One guard opens when select is zero, the other when select is one.</li>
        <li>Exactly one condition is true, always, because a bit is either zero or one.</li>
        <li>So the OR never has to choose. It collects whichever input survived its guard, and the other one is zero.</li>
      </ul>
    </div>
  </div>
  <div class="cue">That phrasing generalises to every width. Say it once properly and refer back to it all hour.</div>
</section>

<!-- ================= ACT 3 ================= -->

<section class="slide" data-t="Make it wider" data-act="3 · what the select lines are">
  <div>
    <div class="kicker">four to one, then eight to one</div>
    <h2 style="font-size:27px;margin-bottom:0">Same promise, more guards.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figWiden"></g></svg></div>
    <div class="btnrow">
      <span class="lab">width</span>
      <button class="btn" data-w="2">2 to 1</button>
      <button class="btn hot" data-w="4">4 to 1</button>
      <button class="btn" data-w="8">8 to 1</button>
    </div>
  </div>
  <div class="cue">Build each one in Logisim as you go. The pattern is obvious by the third and that is the point.</div>
</section>

<section class="slide" data-t="Now stop and look" data-act="3 · what the select lines are">
  <div class="center">
    <div class="tag new">THE QUESTION OF THE HOUR</div>
    <h2 style="font-size:36px;margin-bottom:18px">What <em>are</em> the select lines?</h2>
    <p class="big" style="max-width:50ch;color:var(--soft)">Two of them chose between four inputs. Three of them chose between eight. Before you are told, say what they are.</p>
    <p class="big frag" style="margin-top:20px;max-width:52ch">They are a <strong>binary number</strong>. Two lines count from zero to three and name one of four. Three count from zero to seven and name one of eight.</p>
  </div>
  <div class="cue">Wait for the room. Somebody will say it. It is much better coming from them than from you.</div>
</section>

<section class="slide" data-t="So how wide is the control" data-act="3 · what the select lines are">
  <div>
    <div class="kicker">change the number of options and watch the field</div>
    <h2 style="font-size:27px;margin-bottom:0">The width of a control field is set by one thing and nothing else.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figField"></g></svg></div>
    <div class="btnrow">
      <span class="lab">circuits to choose between</span>
      <button class="btn" data-n="4">4</button>
      <button class="btn" data-n="8">8</button>
      <button class="btn hot" data-n="16">16</button>
      <button class="btn" data-n="17">17</button>
      <button class="btn" data-n="32">32</button>
    </div>
  </div>
  <div class="cue">The jump from sixteen to seventeen is the send-off. Let them see the fifteen wasted patterns appear.</div>
</section>

<!-- ================= ACT 4 ================= -->

<section class="slide" data-t="Two ways to build the same thing" data-act="4 · two constructions">
  <div>
    <div class="kicker">flip between them</div>
    <h2 style="font-size:27px;margin-bottom:0">An eight to one multiplexer, built two completely different ways.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figTwoBuilds"></g></svg></div>
    <div class="btnrow">
      <span class="lab">build it</span>
      <button class="btn hot" id="bFlat">flat, with a decoder</button>
      <button class="btn" id="bTree">as a tree of 2 to 1s</button>
    </div>
  </div>
  <div class="cue">Same function, same eight rows, completely different silicon. They have the vocabulary for this from Class 22.</div>
</section>

<section class="slide" data-t="Which one wins" data-act="4 · two constructions">
  <div>
    <h2>Count them honestly, with Class 18's limit switched on.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figCompare"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the honest answer, which is not the expected one</div>
      <ul>
        <li>The flat version is <em>shallower and smaller</em> at every width. The tree is not automatically the winner here.</li>
        <li>Class 22's tree won because its chain cost two delays per link. A multiplexer has no chain to flatten, so there is nothing to win back.</li>
        <li>What the tree does buy is that no gate anywhere ever sees more than two inputs, and it is built from one part repeated.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not pretend the tree wins. The useful lesson is that the frontier has to be re-measured for every problem.</div>
</section>

<!-- ================= CLOSE ================= -->

<section class="slide" data-t="Computing things you throw away" data-act="closing">
  <div>
    <h2>Every cycle, six of the seven answers are discarded.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figWaste"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">why that is the right call anyway</div>
      <ul>
        <li>The circuits exist whether you use them or not. They were paid for in silicon the moment they were etched.</li>
        <li>Running them all costs power, and nothing else. Choosing first would cost a decision circuit, which is the problem you were trying to solve.</li>
        <li>Hardware computes everything and selects afterwards. In software you would do the opposite, and that difference is worth sitting with.</li>
      </ul>
    </div>
  </div>
  <div class="cue">They implement both in C for the assignment and find the software answer is the opposite. Do not spoil it.</div>
</section>

<section class="slide" data-t="Nothing marks the control" data-act="closing">
  <div>
    <div class="tag new">LEAVE THIS ON THE BOARD</div>
    <h2 style="font-size:27px;margin-bottom:0">Look at the wires again. Which ones are the control?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figSame"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Nothing in the circuit marks one input as control and the others as data. They are all wires carrying bits.</li>
        <li>Swap them over and the circuit computes something else quite happily, without noticing anything unusual happened.</li>
        <li>You met this in Class 16, relabelling an HDMI switch. It is about to become the foundation of the entire second half of this course.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say explicitly that this returns in Class 37, and then leave it alone. Do not explain the payoff yet.</div>
</section>

<section class="slide" data-t="Where we are now" data-act="closing">
  <div>
    <h2>One down, four to go.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcEnd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>A multiplexer: guarded inputs, exactly one guard open, an OR to collect the survivor.</li>
        <li>The width of any control field is the logarithm of how many options exist. Nothing else goes into that decision.</li>
        <li>And the control lines are indistinguishable from the data lines, which is a fact you should find slightly unsettling.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Three things. The third is the one that matters, and they will not know why for ten more sessions.</div>
</section>

<section class="slide" data-t="Close" data-act="closing">
  <div class="center">
    <h2 style="font-size:35px;margin-bottom:16px">You have seven circuits<br>and now something that can choose.</h2>
    <p class="big" style="max-width:56ch;color:var(--soft)">Still nothing wired together. But the hard part of wiring them is already solved, because selection turned out to be a truth table like any other.</p>
    <p class="big frag" style="margin-top:18px;max-width:55ch">Next session: two units are still missing from the pile, and both turn out to be built entirely from things you already own.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: build a four to one multiplexer using only two to one multiplexers. How many, and how arranged? Then: sixteen circuits to choose between, how wide is the select field? Now seventeen. How wide now, and what happened to the sixteen unused patterns?</div>
</section>

</template>
<script>
(function(){
  'use strict';
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;
  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');

        pth(g,'M'+(X0+120)+' '+(y+(GAP-10)/2)+' L'+gx+' '+(y+(GAP-10)/2),{stroke:'#dedbd3','stroke-width':1.6});
        pth(g,'M'+(gx+104)+' '+(y+(GAP-10)/2)+' L'+(X0+330)+' '+(y+(GAP-10)/2),{stroke:HI,'stroke-width':2});
      }
      var midY=Y+(W*GAP-10)/2;
      gOr(g,X0+340,midY,Math.max(30,(W*GAP)/2-8),1);
      wire(g,orTip(X0+340,Math.max(30,(W*GAP)/2-8)),midY,X0+470,midY,1);
      el('rect',{x:X0+470,y:midY-22,width:90,height:44,rx:9,fill:'#fbf0dc',stroke:AMB,'stroke-width':2.2},g);
      txt(g,X0+515,midY+6,'out',{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
      /* the select lines */
      var sy=Y+W*GAP+12;
      for(var s=0;s<sel;s++){
        el('rect',{x:X0+150+s*58,y:sy,width:52,height:18,rx:4,fill:'#f3eefa',stroke:VIO,'stroke-width':1.6},g);
        txt(g,X0+176+s*58,sy+13,'s'+s,{'font-size':11,fill:VIO,'text-anchor':'middle','font-weight':700});
      }
      txt(g,X0,sy+13,sel+' select line'+(sel===1?'':'s'),{'font-size':12.5,fill:VIO,'font-weight':700});
      el('rect',{x:760,y:60,width:366,height:120,rx:13,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.4},g);
      txt(g,784,88,'THE PROMISE IS UNCHANGED',{'font-size':10,fill:GRN,'letter-spacing':1.2});
      txt(g,784,120,W+' guards,',{'font-size':20,fill:GRN,'font-weight':700});
      txt(g,784,146,'exactly one of them open,',{'font-size':14,fill:GRN,'font-weight':700});
      txt(g,784,168,'and one OR to collect the survivor.',{'font-size':14,fill:GRN,'font-weight':700});
      el('rect',{x:760,y:198,width:366,height:92,rx:13,fill:'#f3eefa',stroke:VIO,'stroke-width':2.4},g);
      txt(g,784,226,'SELECT LINES NEEDED',{'font-size':10,fill:VIO,'letter-spacing':1.2});
      txt(g,784,262,sel,{'font-size':32,fill:VIO,'font-weight':700});
      txt(g,830,262,'for '+W+' inputs',{'font-size':15,fill:VIO,'font-weight':700});
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-w]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-w]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot'); W=+b.getAttribute('data-w'); render();
      };
    });
    render();
  })();

  /* ================= so how wide is the control ================= */
  (function(){
    var g=document.getElementById('figField'); if(!g) return;
    var N=16;
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var w=Math.ceil(Math.log2(N)), patterns=Math.pow(2,w), unused=patterns-N;
      txt(g,34,24,'CHOOSING BETWEEN '+N+' CIRCUITS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
      /* the field, drawn as bits */
      var X0=120, BW=74, Y=64;
      for(var k=0;k<w;k++){
        el('rect',{x:X0+k*BW,y:Y,width:BW-12,height:54,rx:8,fill:'#f3eefa',stroke:VIO,'stroke-width':2.2},g);
        txt(g,X0+k*BW+(BW-12)/2,Y+34,'s'+(w-1-k),{'font-size':15,fill:VIO,'text-anchor':'middle','font-weight':700});
      }
      txt(g,X0,Y-12,w+' select lines',{'font-size':12.5,fill:VIO,'font-weight':700});
      /* the patterns */
      var PX=120, PY=152, PCW=Math.min(30, 940/patterns);
      for(var p=0;p<patterns;p++){
        var used=(p<N);
        el('rect',{x:PX+p*PCW,y:PY,width:Math.max(5,PCW-4),height:42,rx:3,
          fill:used?'#e9f2ef':'#fdf0ef',stroke:used?GRN:RED,'stroke-width':used?1.4:1.4},g);
      }
      txt(g,PX,PY-10,patterns+' patterns those lines can make',{'font-size':12.5,fill:'#8b9096'});
      el('rect',{x:120,y:226,width:480,height:86,rx:12,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.4},g);
      txt(g,144,254,'THE RULE',{'font-size':10,fill:GRN,'letter-spacing':1.3});
      txt(g,144,292,w+' bits for '+N+' options',{'font-size':24,fill:GRN,'font-weight':700});
      el('rect',{x:640,y:226,width:486,height:86,rx:12,
        fill:unused?'#fdf0ef':'#fbfaf7',stroke:unused?RED:'#c6c3ba','stroke-width':unused?2.6:2},g);
      txt(g,664,254,unused?'AND WASTED':'NOTHING WASTED',{'font-size':10,fill:unused?RED:'#8b9096','letter-spacing':1.3});
      txt(g,664,292,unused?(unused+' patterns name nothing at all'):'every pattern names a circuit',
        {'font-size':unused?17:17,fill:unused?RED:INK,'font-weight':700});
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-n]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-n]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot'); N=+b.getAttribute('data-n'); render();
      };
    });
    render();
  })();

  /* ================= two ways to build the same thing ================= */
  (function(){
    var g=document.getElementById('figTwoBuilds'); if(!g) return;
    var mode='flat';
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var tree=(mode==='tree');
      txt(g,34,24,tree?'AS A TREE OF SEVEN TWO-TO-ONE MULTIPLEXERS':'FLAT, WITH A DECODER AND ONE WIDE OR',
        {'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
      if(!tree){
        /* decoder, one-hot ANDs, wide OR */
        el('rect',{x:60,y:96,width:130,height:120,rx:11,fill:'#f3eefa',stroke:VIO,'stroke-width':2.4},g);
        txt(g,125,146,'3 to 8',{'font-size':14,fill:VIO,'text-anchor':'middle','font-weight':700});
        txt(g,125,168,'decoder',{'font-size':14,fill:VIO,'text-anchor':'middle','font-weight':700});
        txt(g,60,86,'3 select lines in',{'font-size':11,fill:VIO});
        for(var k=0;k<8;k++){
          var y=68+k*26;
          pth(g,'M190 '+(96+k*15+4)+' L250 '+(y+9),{stroke:'#e0d6ee','stroke-width':1.3});
          el('rect',{x:250,y:y,width:74,height:18,rx:4,fill:'#eaeef7',stroke:BLUE,'stroke-width':1.4},g);
          txt(g,287,y+13,'AND',{'font-size':9.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
          pth(g,'M190 '+(y+9)+' L246 '+(y+9),{stroke:'#e4e2db','stroke-width':1});
          pth(g,'M324 '+(y+9)+' L420 '+(y+9),{stroke:HI,'stroke-width':1.8});
        }
        txt(g,250,56,'one AND per input, opened by its own line',{'font-size':11,fill:BLUE});
        gOr(g,430,172,108,1);
        wire(g,orTip(430,108),172,610,172,1);
        el('rect',{x:610,y:150,width:90,height:44,rx:9,fill:'#fbf0dc',stroke:AMB,'stroke-width':2.2},g);
        txt(g,655,178,'out',{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
        txt(g,430,300,'one OR with eight inputs, which Class 18 says you may not build as one gate.',
          {'font-size':13.5,fill:RED,'font-weight':700});
      } else {
        /* tree of 2:1 */
        var levels=[[8,70],[4,150],[2,215],[1,275]];
        var X0=90, W=700;
        levels.forEach(function(L,li){
          var n=L[0], y=L[1], cw=W/n;
          for(var i=0;i<n;i++){
            var cx=X0+i*cw+cw/2;
            if(li===0){
              el('rect',{x:cx-30,y:y,width:60,height:26,rx:5,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':1.4},g);
              txt(g,cx,y+18,'in '+i,{'font-size':10,fill:'#8b9096','text-anchor':'middle'});
            } else {
              el('rect',{x:cx-38,y:y,width:76,height:30,rx:6,fill:'#eaeef7',stroke:BLUE,'stroke-width':1.8},g);
              txt(g,cx,y+20,'2 to 1',{'font-size':10.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
              var pn=levels[li-1][0], pcw=W/pn;
              for(var c=0;c<2;c++){
                var pi=i*2+c;
                pth(g,'M'+(X0+pi*pcw+pcw/2)+' '+(levels[li-1][1]+(li===1?26:30))+' L'+cx+' '+y,
                  {stroke:'#dedbd3','stroke-width':1.2});
              }
            }
          }
          if(li>0) txt(g,52,y+20,'level '+li,{'font-size':11,fill:BLUE,'text-anchor':'end','font-weight':700});
        });
        txt(g,X0,56,'eight inputs',{'font-size':11,fill:'#8b9096'});
        txt(g,430,316,'seven identical parts, and no gate anywhere sees more than two inputs.',
          {'font-size':13.5,fill:GRN,'font-weight':700});
      }
      /* the numbers */
      el('rect',{x:830,y:70,width:296,height:200,rx:13,fill:tree?'#e9f2ef':'#f3eefa',stroke:tree?GRN:VIO,'stroke-width':2.6},g);
      txt(g,854,98,tree?'THE TREE':'THE FLAT ONE',{'font-size':10,fill:tree?GRN:VIO,'letter-spacing':1.3});
      var rows=tree?[['depth','6 gate delays'],['gates','28'],['widest gate','2 inputs'],['parts','one, repeated 7 times']]
                   :[['depth','5 gate delays'],['gates','21'],['widest gate','8 inputs'],['parts','decoder, ANDs, one big OR']];
      rows.forEach(function(r,k){
        txt(g,854,134+k*34,r[0],{'font-size':12,fill:'#8b9096'});
        txt(g,1102,134+k*34,r[1],{'font-size':13.5,fill:tree?GRN:VIO,'text-anchor':'end','font-weight':700});
      });
    }
    document.getElementById('bFlat').onclick=function(){
      mode='flat'; this.classList.add('hot'); document.getElementById('bTree').classList.remove('hot'); render(); };
    document.getElementById('bTree').onclick=function(){
      mode='tree'; this.classList.add('hot'); document.getElementById('bFlat').classList.remove('hot'); render(); };
    render();
  })();

  /* ================= which one wins ================= */
  (function(){
    var g=document.getElementById('figCompare'); if(!g) return;
    txt(g,34,24,'BOTH CONSTRUCTIONS, WITH THE FAN-IN LIMIT SWITCHED ON',{'font-size':10.5,fill:BLUE,'letter-spacing':1.4});
    var data=[[2,2,4,4,6],[4,4,12,4,11],[8,6,28,5,21],[16,8,60,5,40],[32,10,124,6,77]];
    var X0=60, CW=204, Y=58;
    ['width','tree depth','tree gates','flat depth','flat gates'].forEach(function(h,k){
      txt(g,X0+k*CW+90,Y,h,{'font-size':10.5,fill:'#8b9096','text-anchor':'end','letter-spacing':1.1});
    });
    data.forEach(function(r,i){
      var y=Y+20+i*33;
      el('rect',{x:X0-10,y:y,width:5*CW-20,height:29,rx:6,fill:i%2?'#fbfaf7':'#fff',stroke:'#e2e0d9','stroke-width':1.2},g);
      r.forEach(function(v,k){
        var col = k===0?INK : (k<3?GRN:VIO);
        txt(g,X0+k*CW+90,y+20,k===0?(v+' to 1'):v,
          {'font-size':14,fill:col,'text-anchor':'end','font-weight':700});
      });
    });
    el('rect',{x:60,y:256,width:520,height:66,rx:12,fill:'#f3eefa',stroke:VIO,'stroke-width':2.4},g);
    txt(g,84,280,'THE FLAT ONE IS SHALLOWER AND SMALLER',{'font-size':10,fill:VIO,'letter-spacing':1.2});
    txt(g,84,308,'at every width. the tree is not automatically right.',{'font-size':15,fill:VIO,'font-weight':700});
    el('rect',{x:606,y:256,width:520,height:66,rx:12,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.4},g);
    txt(g,630,280,'WHAT THE TREE DOES BUY',{'font-size':10,fill:GRN,'letter-spacing':1.2});
    txt(g,630,308,'no gate ever sees more than two inputs.',{'font-size':15,fill:GRN,'font-weight':700});
  })();

  /* ================= computing things you throw away ================= */
  (function(){
    var g=document.getElementById('figWaste'); if(!g) return;
    txt(g,34,24,'WHAT HAPPENS ON EVERY SINGLE CYCLE',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var names=['adder','subtractor','multiplier','divider','AND','OR','XOR'];
    var X0=70, CW=150, Y=70;
    names.forEach(function(n,k){
      var kept=(k===0);
      el('rect',{x:X0+k*CW,y:Y,width:CW-16,height:58,rx:9,
        fill:kept?'#e9f2ef':'#fbfaf7',stroke:kept?GRN:'#dedbd3','stroke-width':kept?2.4:1.4},g);
      txt(g,X0+(CW-16)/2+k*CW,Y+26,n,{'font-size':12,fill:kept?GRN:'#a9a69d','text-anchor':'middle','font-weight':700});
      txt(g,X0+(CW-16)/2+k*CW,Y+46,kept?'kept':'discarded',{'font-size':10.5,fill:kept?GRN:'#c6c3ba','text-anchor':'middle'});
      pth(g,'M'+(X0+(CW-16)/2+k*CW)+' '+(Y+58)+' L'+(X0+(CW-16)/2+k*CW)+' '+(Y+88),
        {stroke:kept?GRN:'#e4e2db','stroke-width':kept?2.6:1.2});
    });
    el('rect',{x:X0,y:158,width:7*CW-16,height:40,rx:9,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.4},g);
    txt(g,X0+(7*CW-16)/2,184,'the multiplexer',{'font-size':15,fill:BLUE,'text-anchor':'middle','font-weight':700});
    el('rect',{x:60,y:220,width:520,height:70,rx:12,fill:'#fbf0dc',stroke:AMB,'stroke-width':2.4},g);
    txt(g,84,246,'WHAT THE WASTE ACTUALLY COSTS',{'font-size':10,fill:AMB,'letter-spacing':1.2});
    txt(g,84,274,'power, and nothing else. the silicon was already there.',{'font-size':15,fill:AMB,'font-weight':700});
    el('rect',{x:606,y:220,width:520,height:70,rx:12,fill:'#e9f2ef',stroke:GRN,'stroke-width':2.4},g);
    txt(g,630,246,'WHAT CHOOSING FIRST WOULD COST',{'font-size':10,fill:GRN,'letter-spacing':1.2});
    txt(g,630,274,'a decision circuit, which is the problem you started with.',{'font-size':15,fill:GRN,'font-weight':700});
  })();

  /* ================= nothing marks the control ================= */
  (function(){
    var g=document.getElementById('figSame'); if(!g) return;
    txt(g,34,24,'THE SAME CIRCUIT, WITH THE LABELS TAKEN OFF',{'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
    var X0=120, Y=70;
    ['wire','wire','wire'].forEach(function(t,k){
      var y=Y+k*54;
      el('rect',{x:X0,y:y,width:150,height:40,rx:8,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':1.8},g);
      txt(g,X0+75,y+26,t,{'font-size':13,fill:'#8b9096','text-anchor':'middle','font-weight':700});
      pth(g,'M'+(X0+150)+' '+(y+20)+' L'+(X0+240)+' '+(y+20),{stroke:'#dedbd3','stroke-width':1.8});
    });
    el('rect',{x:X0+240,y:Y,width:160,height:148,rx:11,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.4},g);
    txt(g,X0+320,Y+80,'a circuit',{'font-size':15,fill:BLUE,'text-anchor':'middle','font-weight':700});
    pth(g,'M'+(X0+400)+' '+(Y+74)+' L'+(X0+480)+' '+(Y+74),{stroke:'#dedbd3','stroke-width':1.8});
    el('rect',{x:X0+480,y:Y+54,width:150,height:40,rx:8,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':1.8},g);
    txt(g,X0+555,Y+80,'wire',{'font-size':13,fill:'#8b9096','text-anchor':'middle','font-weight':700});
    txt(g,X0,Y-12,'three wires carrying bits',{'font-size':12,fill:'#8b9096'});
    el('rect',{x:800,y:70,width:326,height:148,rx:13,fill:'#f3eefa',stroke:VIO,'stroke-width':2.6},g);
    txt(g,824,98,'WHICH ONE IS THE CONTROL?',{'font-size':10,fill:VIO,'letter-spacing':1.2});
    txt(g,824,134,'nothing in the circuit',{'font-size':17,fill:VIO,'font-weight':700});
    txt(g,824,158,'says. they are all just',{'font-size':17,fill:VIO,'font-weight':700});
    txt(g,824,182,'wires carrying bits.',{'font-size':17,fill:VIO,'font-weight':700});
    txt(g,824,206,'swap them and it computes something else.',{'font-size':11.5,fill:'#8b9096'});
    txt(g,34,276,'you met this in Class 16, relabelling an HDMI switch. it is about to become the foundation of everything after Class 37.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  onSlide=function(idx){};
  paint();
})();
</script>
</body>
