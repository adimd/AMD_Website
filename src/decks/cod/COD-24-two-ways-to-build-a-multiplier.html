<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 24</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 24 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the question">
  <div>
    <div class="kicker">class 24 · hour twenty four of fifty</div>
    <h1>Two ways to build<br>a multiplier.</h1>
    <p class="big" style="margin-top:22px;max-width:49ch">Thirty two additions have to happen. You can spread them over thirty two clock cycles, or you can lay them out in silicon and do them all at once. Today you build both.</p>
  </div>
  <div class="cue">Collect the homework counts from last session. Then say the hour is one algorithm, two pieces of hardware.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the question">
  <div>
    <h2>One algorithm. Two completely different machines.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>What is the algorithm?</strong> Written as a loop, it is four lines, and every line is something you already built.</li>
        <li><strong>Design one: run the loop.</strong> One adder, thirty two turns. Small, slow, and what most chips ever made actually do.</li>
        <li><strong>Design two: unroll the loop.</strong> Thirty two rows of adders in silicon. Ten times the gates, and one long cycle.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Neither design is clever yet. Cleverness is next session. Today is honest construction.</div>
</section>

<!-- ============ ACT 1 ============ -->

<section class="slide" data-t="The algorithm as a loop" data-act="1 · the algorithm">
  <div>
    <h2>Everything you did on paper, written as four lines.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figLoop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">notice what is in it</div>
      <ul>
        <li>A test of one bit. An addition. A shift. A counter. You have built every one of those already.</li>
        <li>There is no multiplication anywhere in the algorithm for multiplication.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Read the loop aloud. Four lines, thirty two turns. The whole hour is about how you spend those turns.</div>
</section>

<section class="slide" data-t="Two ways to spend it" data-act="1 · the algorithm">
  <div>
    <h2>A loop can be run, or it can be unrolled.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figTwoWays"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the same thirty two additions, either way</div>
      <ul>
        <li>Run it: build one adder and use it thirty two times. You spend <strong>time</strong>.</li>
        <li>Unroll it: build thirty two adders and use each once. You spend <strong>space</strong>.</li>
        <li>This choice comes back for every loop in every machine you will ever design.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Name the tradeoff here explicitly. It is the most transferable idea in the hour.</div>
</section>

<!-- ============ ACT 2 · SEQUENTIAL ============ -->

<section class="slide" data-t="Design 1, first attempt" data-act="2 · design one, run the loop">
  <div>
    <div class="kicker">the obvious datapath, and what is wrong with it</div>
    <h2 style="font-size:27px;margin-bottom:0">Build it the way you wrote it on paper.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figNaive"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">it works, and it is wasteful</div>
      <ul>
        <li>The multiplicand register has to be 64 bits wide, because by the last turn it has been shifted left thirty one times.</li>
        <li>So the adder has to be 64 bits wide too, and 64-bit adders cost twice what 32-bit ones do.</li>
        <li>And the top half of that register is zeros for most of the run. You are paying for wire that holds nothing.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let them see the waste before the fix. The fix is much prettier if the problem is felt first.</div>
</section>

<section class="slide" data-t="Move the other thing" data-act="2 · design one, run the loop">
  <div>
    <div class="tag win">THE REFINEMENT</div>
    <h2 style="font-size:27px;margin-bottom:0">Nothing says the multiplicand has to move. Shift the product right instead.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figRefine"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">what that bought</div>
      <ul>
        <li>The multiplicand never moves, so it stays thirty two bits wide, and <strong>the adder only ever needs to be thirty two bits</strong>.</li>
        <li>Shifting the running total right by one has exactly the same effect as shifting the multiplicand left by one. The relative positions are what matter.</li>
        <li>Half the adder, half the register. Same answer.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the first properly elegant idea of the hour. Do not rush it.</div>
</section>

<section class="slide" data-t="The register that does both jobs" data-act="2 · design one, run the loop">
  <div>
    <div class="kicker">watch the two halves trade places</div>
    <h2 style="font-size:27px;margin-bottom:0">And now the trick that makes the whole design fit.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figAQ"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="aRun">run &#9654;</button>
      <button class="btn" id="aStep">step</button>
      <button class="btn" id="aReset">reset</button>
    </div>
  </div>
  <div class="cue">The multiplier is consumed one bit per turn. The product is produced one bit per turn. They share one register.</div>
</section>

<section class="slide" data-t="Thirteen times eleven, in registers" data-act="2 · design one, run the loop">
  <div>
    <div class="kicker">four turns, and check every one against your paper working</div>
    <h2 style="font-size:27px;margin-bottom:0">The whole algorithm, one turn at a time.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 360" width="1090" height="336"><g id="figTrace"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="tRun">run &#9654;</button>
      <button class="btn" id="tStep">step</button>
      <button class="btn" id="tReset">reset</button>
    </div>
  </div>
  <div class="cue">Checked against every four bit pair in code. Step it slowly, the shift is where people lose the thread.</div>
</section>

<section class="slide" data-t="What drives it" data-act="2 · design one, run the loop">
  <div>
    <h2>The control is smaller than anything else on the slide.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1090" height="294"><g id="figControl"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>A five bit counter counts the thirty two turns. Five bits, because two to the five is thirty two.</li>
        <li>One AND gate decides whether this turn adds: the bottom bit of Q, gated with the add-enable.</li>
        <li>When the counter rolls over, the product is sitting in A and Q, and the machine says done.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Emphasise how little control there is. Most of the cost is the adder and the registers.</div>
</section>

<section class="slide" data-t="What design one costs" data-act="2 · design one, run the loop">
  <div>
    <h2>Add it all up.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 345" width="1080" height="326"><g id="figSeqCost"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">judged the way you judge everything</div>
      <ul>
        <li>The clock does not have to slow down. One turn is one 32-bit addition, twelve gate delays, comfortably inside a 3 GHz cycle.</li>
        <li>But a multiply now takes thirty two cycles. In a machine that issues an instruction per cycle, that is thirty two lost.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Separate the two numbers carefully. The cycle is fast. There are just a lot of them.</div>
</section>

<!-- ============ ACT 3 · ARRAY ============ -->

<section class="slide" data-t="Design 2, unroll it" data-act="3 · design two, unroll the loop">
  <div>
    <div class="kicker">the same loop, with the turns laid side by side</div>
    <h2 style="font-size:27px;margin-bottom:0">Take the thirty two turns and build them all at once.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1090" height="303"><g id="figUnroll"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what unrolling does</div>
      <ul>
        <li>Every turn becomes a row of hardware. There is no counter, no register to shift, and no state at all.</li>
        <li>The shifts disappear completely. A shift by k is just wiring row k over by k columns.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Shifts costing nothing in space is worth saying out loud. A shift is a wire, not a gate.</div>
</section>

<section class="slide" data-t="The grid of AND gates" data-act="3 · design two, unroll the loop">
  <div>
    <h2>First, every partial product bit at once.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1090" height="303"><g id="figGrid"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>One AND gate for every pair of bits. 1024 of them for a 32 by 32 multiply.</li>
        <li>None of them waits for anything, so all 1024 partial product bits exist at t = 1.</li>
        <li>That is the entire multiplication part of multiplication. Everything after this is addition.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Same point as last session, but now they are about to see how the additions are physically arranged.</div>
</section>

<section class="slide" data-t="Where do the carries go" data-act="3 · design two, unroll the loop">
  <div>
    <div class="kicker">the single most important wire in the design</div>
    <h2 style="font-size:27px;margin-bottom:0">Each cell makes a sum and a carry. The carry has two places it could go.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figCarryWiring"></g></svg></div>
    <div class="btnrow">
      <span class="lab">send the carry</span>
      <button class="btn hot" id="wRow">along the row</button>
      <button class="btn" id="wDiag">down to the next row</button>
    </div>
  </div>
  <div class="cue">Same cells, same count, one wire moved. 185 delays against 63. This is the slide of the act.</div>
</section>

<section class="slide" data-t="The path through the array" data-act="3 · design two, unroll the loop">
  <div>
    <h2>Follow the longest path a signal can take from input to output.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figPath"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Down through thirty one rows, and along toward the top end of the product. Two gate delays per cell.</li>
        <li>Sixty three gate delays to get the array settled, and the bottom row is still two numbers, not one.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Trace it with a finger on the screen. The diagonal is the shape of the whole delay.</div>
</section>

<section class="slide" data-t="One real adder at the bottom" data-act="3 · design two, unroll the loop">
  <div>
    <h2>The array never finishes the job. It hands you two numbers.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figFinalAdd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Saving carries to the next row is quick, but the last row still has a set of sums and a set of carries that were never combined.</li>
        <li>So the bottom of the array is a real carry-propagating adder. The one from Class 22, doing the job nothing else can.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the first appearance of an idea that dominates next session. Flag it.</div>
</section>

<section class="slide" data-t="What design two costs" data-act="3 · design two, unroll the loop">
  <div>
    <h2>Add that up too.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figArrayCost"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">judged the same way</div>
      <ul>
        <li>1500 picoseconds is four and a half cycles at 3 GHz. Better than thirty two, and still not one.</li>
        <li>Ten times the gates of design one, for about five times the speed. That is not a scandal, but it is not a triumph either.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Resist calling this a win. It is a different point on the same curve, and next session beats both.</div>
</section>

<!-- ============ CLOSE ============ -->

<section class="slide" data-t="Time against space" data-act="closing">
  <div>
    <h2>The same algorithm, and the bill depends entirely on where you spent it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figTimeSpace"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the actual skill, again</div>
      <ul>
        <li>A microcontroller multiplying a few times a second should run the loop. Seven thousand gates would be silicon it cannot afford to power.</li>
        <li>A processor doing signal or matrix work cannot stall for thirty two cycles, and buys the array without hesitating.</li>
      </ul>
    </div>
  </div>
  <div class="cue">They should be able to predict this slide by now. That is the point of repeating the shape.</div>
</section>

<section class="slide" data-t="Where we are now" data-act="closing">
  <div>
    <h2>Six down, three to go.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcEnd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>A loop can be run or unrolled, and that is a choice between time and area, not between right and wrong.</li>
        <li>Shifting by a fixed amount costs nothing in hardware. It is wiring.</li>
        <li>And carries can be handed to the next row instead of being resolved. 185 delays became 63 on one wire.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The carry-saving idea is the seed of the entire next session. Plant it, do not spend it.</div>
</section>

<section class="slide" data-t="Close" data-act="closing">
  <div class="center">
    <h2 style="font-size:35px;margin-bottom:16px">Thirty two cycles,<br>or seven thousand gates.</h2>
