<style>

  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}

.slide.on{display:flex;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}

.act{position:absolute;top:19px;right:68px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:68px;right:68px;bottom:21px;display:flex;gap:1.5px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:68px;bottom:42px;font-family:var(--mono);font-size:12px;color:var(--soft);z-index:5}
#help{position:absolute;left:68px;bottom:42px;font-family:var(--mono);font-size:11px;color:#adb1b6;letter-spacing:.08em;z-index:5}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.12;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20px;line-height:1.46;max-width:37ch}
p+p{margin-top:10px}
.big{font-size:23.5px;line-height:1.34;color:var(--ink);font-weight:300;max-width:31ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}

.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);

.rem .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.rem.win{border-left-color:var(--ok)} .rem.win .h{color:var(--ok)}
.rem.bad{border-left-color:var(--fail)} .rem.bad .h{color:var(--fail)}

.rem li{font-size:15.5px;line-height:1.36;color:var(--ink);padding:3.5px 0 3.5px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}
.btn{font-family:var(--mono);font-size:12.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}

:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.tag.win{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--fail-soft);color:var(--fail)}

.spec{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--rule2);border-radius:11px;overflow:hidden;margin-top:8px}

.spec .c:last-child{border-right:none}

.spec .c .v{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:3px}
.spec .c .s{font-size:12.5px;color:var(--soft);margin-top:2px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .32s ease}

@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}

  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.34;font-style:italic;z-index:6}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:38px 68px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3.5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 21</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 21 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the question">
  <div>
    <div class="kicker">class 21 · hour twenty one of fifty</div>
    <h1>How slow<br>is slow?</h1>
    <p class="big" style="margin-top:22px;max-width:47ch">You finished a thirty two bit adder last session and it gives the right answer every time. That is not the same as it being good enough.</p>
  </div>
  <div class="cue">Do not define anything yet. The first job is to make them want a number they do not have.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the question">
  <div>
    <h2>Last session you built it. This session you find out what it costs you.</h2>
    <div style="text-align:center;margin-top:4px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li>How long does one addition actually take? A real number, in picoseconds.</li>
        <li>Is that slow? You will find you cannot answer that until you are told one more thing.</li>
        <li>Can it be fixed without redesigning the adder? Two ways out, and both of them close.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flag the middle question. That is the one that makes the hour worth sitting through.</div>
</section>

<section class="slide" data-t="Would you ship it?" data-act="1 · how long does it take">
  <div>
    <div class="kicker">answer out loud before the next slide</div>
    <h2 style="font-size:28px;margin-bottom:2px">Here is your adder. Would you put it in a product?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figShip"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">why nobody can answer yet</div>
      <ul>
        <li>You know it is correct. You know how many gates it has. Neither of those tells you whether it is fast enough.</li>
        <li>You do not have a number for how long it takes, and you do not have anything to compare that number against.</li>
        <li>The rest of the hour is those two missing things, in that order.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Take real answers. Someone will say yes, someone no. Neither can defend it, and that is the point.</div>
</section>

<section class="slide" data-t="What a gate costs" data-act="1 · how long does it take">
  <div>
    <h2>Start at the bottom. Why does a single gate take any time at all?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figGate"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Nothing is deciding anything. A wire has capacitance, the gate drives it through resistance, and the voltage climbs a curve.</li>
        <li>The next gate cannot read the answer until that climb passes its threshold. That wait is the whole delay.</li>
        <li>About twenty picoseconds, set by the process the chip is made on. You do not get to negotiate it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Kill the idea that gates think. It is a bucket filling. Everything later is just counting buckets.</div>
</section>

<section class="slide" data-t="What a column costs" data-act="1 · how long does it take">
  <div>
    <h2>Now one column. How long before its carry out is trustworthy?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figColumn"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Trace the carry in. It cannot reach the output OR without passing an AND gate first.</li>
        <li>Two gates deep, so two gate delays, so forty picoseconds. Every column, identically.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Make them trace the path with a finger. The number is worthless if they did not see where it came from.</div>
</section>

<section class="slide" data-t="Guess the total" data-act="1 · how long does it take">
  <div>
    <div class="kicker">commit to a number before you press run</div>
    <h2 style="font-size:28px;margin-bottom:2px">Thirty two columns at two delays each. What is the total?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1100" height="303"><g id="figRipple"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="rRun">run &#9654;</button>
      <button class="btn" id="rStep">step</button>
      <button class="btn" id="rReset">reset</button>
    </div>
  </div>
  <div class="cue">Collect guesses first. Thirty two and sixty four both come up. Sixty five surprises them, and that is why it sticks.</div>
</section>

<section class="slide" data-t="Is that slow?" data-act="2 · is that slow">
  <div class="center">
    <div class="tag">THE QUESTION THE HOUR IS NAMED AFTER</div>
    <h2 style="font-size:44px;margin-bottom:16px">1300 picoseconds.<br>Is that slow?</h2>
    <p class="big" style="max-width:46ch;color:var(--soft)">Sit with it. There is genuinely no answer yet, and it is worth noticing exactly what is missing.</p>
    <p class="big frag" style="margin-top:18px;max-width:52ch">A duration on its own is neither fast nor slow. It only becomes one when you put it next to how long you were willing to wait.</p>
  </div>
  <div class="cue">Let the silence run. Do not rescue them. The missing thing is the clock, and they should feel the gap first.</div>
</section>

<section class="slide" data-t="Against a clock" data-act="2 · is that slow">
  <div>
    <div class="kicker">pick a machine and read off the answer</div>
    <h2 style="font-size:28px;margin-bottom:2px">One clock cycle is the entire budget. The adder has to finish inside it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1090" height="325"><g id="figBudget"></g></svg></div>
    <div class="btnrow">
      <span class="lab">clock</span>
      <button class="btn hot" data-mhz="16">16 MHz</button>
      <button class="btn" data-mhz="100">100 MHz</button>
      <button class="btn" data-mhz="500">500 MHz</button>
      <button class="btn" data-mhz="1000">1 GHz</button>
      <button class="btn" data-mhz="3000">3 GHz</button>
    </div>
  </div>
  <div class="cue">Same 1300 ps every time. Only the budget moves. Two per cent and three hundred ninety per cent are the same circuit.</div>
</section>

<section class="slide" data-t="Turn the question around" data-act="2 · is that slow">
  <div>
    <div class="kicker">you can do this division yourselves</div>
    <h2 style="font-size:28px;margin-bottom:2px">So stop asking if it fits. Ask what clock it exactly fits.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figFit"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="fReveal">reveal &#9654;</button>
      <button class="btn" id="fHide">hide</button>
    </div>
  </div>
  <div class="cue">Make them compute one over 1300 ps before revealing. This number should be theirs, not yours.</div>
</section>

<section class="slide" data-t="Where it breaks" data-act="2 · is that slow">
  <div>
    <h2>Below that line there is nothing to fix. Above it, nothing to tune.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figCross"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>At 16 MHz the adder uses two per cent of the cycle. Making it faster would buy you nothing you could spend.</li>
        <li>At 3 GHz it needs almost four cycles. No amount of careful layout closes a gap that size.</li>
        <li>The circuit is identical on both sides of 769 MHz. Only the question changed.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the shape of most engineering answers: not good or bad, but a threshold with different worlds either side.</div>
</section>

<section class="slide" data-t="It is not just addition" data-act="2 · is that slow">
  <div>
    <div class="tag bad">THE PART THAT ACTUALLY HURTS</div>
    <h2 style="font-size:28px;margin-bottom:2px">Addition is underneath almost everything, and a chip has one clock.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figChip"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every array index, every loop counter, every comparison, every instruction fetch goes through an adder.</li>
        <li>The clock is one number for the whole chip, so the deepest path anywhere sets the speed of everything.</li>
        <li>This is not a slow adder. It is a <strong>0.77 GHz ceiling on the entire processor</strong>, however good the rest of it is.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Highest point of the hour. Stop here, let it sit, then take the break or change gear deliberately.</div>
</section>

<section class="slide" data-t="But it is usually quick" data-act="3 · can it be fixed as it is">
  <div>
    <div class="kicker">press randomise a few times</div>
    <h2 style="font-size:28px;margin-bottom:0">First way out: the carry hardly ever travels the whole width.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1100" height="303"><g id="figTravel"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="tRand">randomise</button>
      <button class="btn" id="tWorst">the worst case</button>
      <button class="btn" id="tQuiet">a quiet one</button>
    </div>
  </div>
  <div class="cue">Randomise ten times. The journey is short nearly every time and somebody will start to hope. Let them.</div>
</section>

<section class="slide" data-t="Over many additions" data-act="3 · can it be fixed as it is">
  <div>
    <div class="kicker">thirty two bit additions, random inputs · press run and let it gather</div>
    <h2 style="font-size:28px;margin-bottom:2px">Ninety five in every hundred would already be finished.</h2>
    <div class="row" style="align-items:flex-start">
      <div><svg viewBox="0 0 900 350" width="770" height="300"><g id="figHist"></g></svg></div>
      <div style="max-width:26ch">
        <div class="rem win" style="margin-top:0">
          <div class="h">what the pile says</div>
          <ul>
            <li>The carry travels about three columns on average, not thirty two.</li>
            <li>Almost every addition is done long before the worst case would be.</li>
          </ul>
        </div>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="hRun">run &#9654;</button>
          <button class="btn" id="hReset">reset</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Let the hope build for a full minute here. The next slide is much better if they have committed to it.</div>
</section>

<section class="slide" data-t="Why that does not help" data-act="3 · can it be fixed as it is">
  <div>
    <h2>It does not matter what usually happens. The clock is set by what can happen.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figWorst"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">the principle, and you will meet it all course</div>
      <ul>
        <li>The circuit has no way to announce that it finished early. The clock ticks at a fixed rate whatever the inputs were.</li>
        <li>So you pay the worst case on every single cycle, including the ninety five that were done in a third of the time.</li>
        <li>And the worst input is not exotic. It is a counter rolling over, which every loop in every program does.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Name the principle out loud: you pay worst case, always. It returns for caches, pipelines and memory.</div>
</section>

<section class="slide" data-t="So change the shape" data-act="3 · can it be fixed as it is">
  <div>
    <div class="kicker">hands up before the next slide: will this work?</div>
    <h2 style="font-size:28px;margin-bottom:2px">Second way out: flatten the chain into a tree, the way you did in Class 18.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figTree"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">it worked before</div>
      <ul>
        <li>That hour ended with two circuits of identical gate count. The chain took seven delays and the tree took three, and the tree was free.</li>
        <li>The ripple adder is that same chain, with two gates per link and thirty two links instead of seven. So flatten it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Take the vote. Most will say yes. Being wrong here is what makes the next slide land.</div>
</section>

<section class="slide" data-t="The dependency" data-act="3 · can it be fixed as it is">
  <div>
    <div class="kicker">the difference between the two problems, drawn</div>
    <h2 style="font-size:28px;margin-bottom:2px">Class 18 had eight separate facts. This has one fact, thirty two times over.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figDeps"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>On the left every input exists at the same instant, so any two may be combined first and the tree costs nothing.</li>
        <li>On the right carry five does not exist until carries one to four have happened. There is no pair you are allowed to start with.</li>
        <li><strong>The chain is not in the wiring. It is in the definition of a carry.</strong></li>
      </ul>
    </div>
  </div>
  <div class="cue">Stop on that last sentence. Do not soften it and do not hint at a way out. Next session needs this wall intact.</div>
</section>

<section class="slide" data-t="Use the method once more" data-act="closing">
  <div>
    <div class="kicker">thirty seconds, on your own</div>
    <h2 style="font-size:28px;margin-bottom:2px">Same method, different adder. What clock can a sixteen bit ripple hold?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figTransfer"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="xReveal">reveal &#9654;</button>
      <button class="btn" id="xHide">hide</button>
    </div>
  </div>
  <div class="cue">Count depth, multiply by twenty, divide into one. If they can do it here they own the method, not the story.</div>
</section>

<section class="slide" data-t="Where we are now" data-act="closing">
  <div>
    <h2>Three down, five to go.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcEnd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>A way to judge any circuit: count the depth, multiply by the gate delay, compare against the clock you want.</li>
        <li>An adder that is genuinely right below 770 MHz and genuinely hopeless above it.</li>
        <li>Two ways out, both closed, and a wall: the chain lives in the definition of a carry.</li>

    txt(g,320,170,'combined first',{'font-size':13.5,fill:INK});
    txt(g,320,200,'so a tree costs nothing',{'font-size':13,fill:GRN,'font-weight':700});
    /* right: one fact, thirty two times */
    el('rect',{x:588,y:44,width:518,height:208,rx:14,fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
    txt(g,612,74,'CLASS 20 \u00b7 THIRTY TWO CARRIES',{'font-size':10.5,fill:RED,'letter-spacing':1.3});
    for(var c=0;c<6;c++){
      var cx=628+c*72;
      el('circle',{cx:cx,cy:130,r:15,fill:'#fff',stroke:RED,'stroke-width':2},g);
      txt(g,cx,135,'c'+c,{'font-size':11,fill:RED,'text-anchor':'middle','font-weight':700});
      if(c<5){
        pth(g,'M'+(cx+15)+' 130 L'+(cx+50)+' 130',{stroke:'#e0b6b4','stroke-width':2.2});
        pth(g,'M'+(cx+42)+' 124 l8 6 l-8 6',{stroke:'#e0b6b4','stroke-width':2.2});
      }
    }
    txt(g,1076,135,'...',{'font-size':14,fill:'#e0b6b4','text-anchor':'end'});
    txt(g,612,186,'c5 is defined using c4, which is defined using c3',{'font-size':13,fill:INK});
    txt(g,612,208,'there is no pair you are allowed to start with',{'font-size':13,fill:INK});
    txt(g,612,238,'so no rearrangement of gates helps',{'font-size':13,fill:RED,'font-weight':700});
    txt(g,34,294,'the chain is not in the wiring. it is in the definition of a carry.',
      {'font-size':16.5,fill:INK,'font-weight':700});
  })();

  /* ================= use the method once more ================= */
  (function(){
    var g=document.getElementById('figTransfer'); if(!g) return;
    var shown=false;
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,34,26,'THE SAME THREE STEPS, ON A NARROWER ADDER',{'font-size':10.5,fill:BLUE,'letter-spacing':1.7});
      var steps=[['count the depth', shown?'1 + 2 x 16 = 33 delays':'?'],
                 ['multiply by 20 ps', shown?'660 ps':'?'],
                 ['divide into one second', shown?'1.52 GHz':'?']];
      steps.forEach(function(s,k){
        var x=40+k*360;
        el('rect',{x:x,y:70,width:330,height:104,rx:13,
          fill:shown?'#eaeef7':'#fbfaf7',stroke:shown?BLUE:'#dedbd3','stroke-width':shown?2.4:2,
          'stroke-dasharray':shown?'none':'8 6'},g);
        txt(g,x+165,102,'STEP '+(k+1),{'font-size':10,fill:shown?BLUE:'#c6c3ba','text-anchor':'middle','letter-spacing':1.4});
        txt(g,x+165,126,s[0],{'font-size':13,fill:'#8b9096','text-anchor':'middle'});
        txt(g,x+165,158,s[1],{'font-size':shown?19:22,fill:shown?BLUE:'#c6c3ba','text-anchor':'middle','font-weight':700});
        if(k<2){ pth(g,'M'+(x+336)+' 122 L'+(x+354)+' 122',{stroke:'#c6c3ba','stroke-width':2.2}); }
      });
      txt(g,34,232,shown?'halving the width roughly doubles the clock it can hold. the method did all of that, not the story.'
                        :'you have every piece you need. thirty seconds.',
        {'font-size':15.5,fill:shown?INK:'#8b9096','font-weight':shown?700:400});
    }
    document.getElementById('xReveal').onclick=function(){ shown=true; render(); };
    document.getElementById('xHide').onclick=function(){ shown=false; render(); };
    render();
  })();

  onSlide=function(idx){ if(ripCtl) ripCtl.stop(); if(histCtl) histCtl.stop(); };
  paint();
})();
</script>
