<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 21</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 21 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="picking up where we stopped">
  <div>
    <div class="kicker">class 21 · hour twenty one of fifty</div>
    <h1>How slow<br>is slow?</h1>
    <p class="big" style="margin-top:22px;max-width:47ch">Your adder takes 1300 picoseconds. That is either completely fine or a total disaster, and today you learn how to tell which.</p>
  </div>
  <div class="cue">Take the send off first. Longest path in gates. Collect a few answers before showing anything.</div>
</section>

<section class="slide" data-t="Where we are" data-act="picking up where we stopped">
  <div>
    <h2>Nothing gets built today. You are learning to judge a circuit instead.</h2>
    <div style="text-align:center;margin-top:4px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three moves</div>
      <ul>
        <li>First, work out what your adder actually costs, in gates and then in picoseconds.</li>
        <li>Then find out whether that is a lot, which turns out to be a question you cannot answer on its own.</li>
        <li>Then find the one situation where it really does hurt, and see why the obvious fixes will not save you.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the no-new-circuit thing up front, or they spend the hour waiting for a build that is not coming.</div>
</section>

<!-- ================= ACT 1 · WHAT IT COSTS ================= -->

<section class="slide" data-t="What a gate costs" data-act="1 · what it costs">
  <div>
    <div class="kicker">start with the smallest unit there is</div>
    <h2 style="font-size:29px;margin-bottom:2px">A gate takes about twenty picoseconds, and that is not up to you.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figGate"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Class 18 showed you where it goes: charge has to move through resistance into capacitance, and the voltage rises on a curve.</li>
        <li>Twenty picoseconds is a property of the process the chip is made on. No design choice of yours changes it.</li>
        <li>What you <em>do</em> control is how many of them end up one behind another. That number is called the <strong>depth</strong>.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Physics gives you the gate. You choose the depth. That split is the spine of the whole hour.</div>
</section>

<section class="slide" data-t="What a column costs" data-act="1 · what it costs">
  <div>
    <div class="kicker">now one column of your adder</div>
    <h2 style="font-size:29px;margin-bottom:2px">The carry has to cross an AND and then an OR. Two gates, every column.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figOne"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The carry in cannot reach the OR without going through an AND first. There is no path round either of them.</li>
        <li>The sum is one XOR after the carry lands, so it is never the thing that decides the timing.</li>
        <li>Two gates is forty picoseconds. For one column, of one addition.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Two per column is the number for the hour. Everything after this is that number times the width.</div>
</section>

<section class="slide" data-t="What the adder costs" data-act="1 · what it costs">
  <div>
    <div class="kicker">press run &nbsp;·&nbsp; eight columns, and the carry has to get across all of them</div>
    <h2 style="font-size:28px;margin-bottom:0">So chain them up and let the clock run.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1180 340" width="1120" height="323"><g id="figPath"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="pRun">run &#9654;</button>
      <button class="btn" id="pStep">step</button>
      <button class="btn" id="pReset">reset</button>
    </div>
  </div>
  <div class="cue">Eight columns take sixteen. Ask what thirty two would take before advancing.</div>
</section>

<section class="slide" data-t="The measurement" data-act="1 · what it costs">
  <div>
    <div class="tag">MEASUREMENT DONE</div>
    <h2 style="font-size:29px;margin-bottom:4px">Sixty five gate delays. One thousand three hundred picoseconds.</h2>
    <div class="spec">
      <div class="c"><div class="l">PER GATE</div><div class="v">20 ps</div><div class="s">physics, not a choice</div></div>
      <div class="c"><div class="l">PER COLUMN</div><div class="v">2</div><div class="s">an AND, then the OR</div></div>
      <div class="c"><div class="l">32 COLUMNS, PLUS THE FLAGS</div><div class="v">65</div><div class="s">gate delays deep</div></div>
      <div class="c"><div class="l">WHICH IS</div><div class="v">1300 ps</div><div class="s">1.3 nanoseconds</div></div>
    </div>
    <div class="rem" style="max-width:none">
      <div class="h">and now the question that actually matters</div>
      <ul>
        <li>Is 1300 picoseconds a lot? Nothing you have seen so far can answer that.</li>
        <li>A number of seconds is not fast or slow by itself. It is only fast or slow <em>compared to something</em>.</li>
        <li>The something is the clock, and that is the next act.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Resist giving a verdict here. The whole point is that the measurement alone does not license one.</div>
</section>

<!-- ================= ACT 2 · IS THAT A LOT ================= -->

<section class="slide" data-t="Compared to what" data-act="2 · is that a lot">
  <div>
    <h2>A clock period is a budget, and it is the only thing that makes a delay mean anything.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>The clock is a decision. A designer picks one period and the whole chip lives by it. Nothing has forced a particular value on you yet.</p>
        <p class="frag">The only rule is that the period must be long enough for the deepest path in the machine to settle.</p>
        <p class="big frag" style="margin-top:6px">So the gate delay is the exchange rate. Depth times twenty picoseconds has to fit inside one cycle.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">the two numbers, kept apart</div>
        <ul>
          <li><strong>Gate delay.</strong> Physics hands it to you. About 20 ps, and you cannot argue with it.</li>
          <li><strong>Clock period.</strong> You choose it, once, for everything on the chip.</li>
          <li>Between them sits depth, which is the only one you actually design.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Given, chosen, designed. Three words. Put them on the board and leave them there.</div>
</section>

<section class="slide" data-t="Pick a clock" data-act="2 · is that a lot">
  <div>
    <div class="kicker">the same adder, the same 1300 ps &nbsp;·&nbsp; only the budget changes</div>
    <h2 style="font-size:28px;margin-bottom:0">So put your 1300 picoseconds against a real clock and see.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 360" width="1090" height="344"><g id="figBudget"></g></svg></div>
    <div class="btnrow">
      <span class="lab">CLOCK</span>
      <button class="btn hot" data-f="16">16 MHz</button>
      <button class="btn" data-f="100">100 MHz</button>
      <button class="btn" data-f="500">500 MHz</button>
      <button class="btn" data-f="1000">1 GHz</button>
      <button class="btn" data-f="3000">3 GHz</button>
    </div>
  </div>
  <div class="cue">Start at 16 MHz. The bar is a sliver. Nobody expects that, and it is the honest picture.</div>
</section>

<section class="slide" data-t="It is not a bad circuit" data-act="2 · is that a lot">
  <div>
    <div class="tag win">SO SAY THE HONEST THING</div>
    <h2 style="font-size:29px;margin-bottom:4px">A ripple carry adder is a perfectly good circuit. Most chips ever made use one.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figFine"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>It has the fewest gates of any adder, and the simplest layout. Six gates a column and one wire between neighbours.</li>
        <li>At sixteen megahertz it uses two per cent of the cycle. At a hundred, thirteen per cent. The delay is real and it costs you nothing.</li>
        <li>If you are designing a microcontroller, a sensor, a washing machine, or anything clocked in the tens or hundreds of megahertz, this is the adder you want.</li>
        <li>Choosing something more complicated there would be spending gates to buy time you were never going to use.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the slide that stops them leaving with a caricature. Ripple carry is a good engineering answer, in its regime.</div>
</section>

<section class="slide" data-t="Where it breaks" data-act="2 · is that a lot">
  <div>
    <div class="kicker">so find the exact point where the answer changes</div>
    <h2 style="font-size:28px;margin-bottom:2px">It stops fitting at about 770 megahertz.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1080" height="323"><g id="figCross"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Below that line, the ripple adder finishes inside the cycle and there is nothing to fix.</li>
        <li>Above it, the adder cannot finish in time, and no amount of tuning gets it there. It is four times over at 3 GHz.</li>
        <li>So the question was never <em>is this adder slow</em>. It was <strong>slow compared to what</strong>, and the answer depends entirely on the machine you are building.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The crossover is the hinge of the hour. Everything before it is reassurance; everything after is the problem.</div>
</section>

<!-- ================= ACT 3 · WHEN IT DOES HURT ================= -->

<section class="slide" data-t="And then it hurts" data-act="3 · when it does hurt">
  <div>
    <div class="tag bad">ABOVE THE LINE</div>
    <h2 style="font-size:29px;margin-bottom:4px">And when it does not fit, it does not just slow the addition down.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figEverywhere"></g></svg></div>
    <div class="rem bad" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The clock is one number for the entire chip, so the deepest path anywhere sets the speed of everything.</li>
        <li>A machine built on this adder could not be clocked above <span class="num">0.77 GHz</span>, however good the rest of it was.</li>
        <li>And almost nothing a processor does avoids the adder: addresses, loop counters, array indices, comparisons, the program counter.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is why it matters. Not the add instruction; the ceiling it puts on the whole design.</div>
</section>

<section class="slide" data-t="But it is usually quick" data-act="3 · when it does hurt">
  <div>
    <div class="kicker">press randomise a few times &nbsp;·&nbsp; there may be a way out of this</div>
    <h2 style="font-size:28px;margin-bottom:0">Except that the carry hardly ever actually travels that far.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1100" height="313"><g id="figChain"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="cRand">randomise</button>
      <button class="btn" id="cWorst">the worst case</button>
      <button class="btn" id="cBest">a quiet one</button>
    </div>
  </div>
  <div class="cue">Randomise ten times. The chain is short nearly every time, and somebody will start to hope.</div>
</section>

<section class="slide" data-t="Over many additions" data-act="3 · when it does hurt">
  <div>
    <div class="kicker">thirty two bit additions, random inputs &nbsp;·&nbsp; press run and let it gather</div>
    <h2 style="font-size:28px;margin-bottom:2px">Ninety five in every hundred would already be finished.</h2>
    <div class="row" style="align-items:flex-start">
      <div><svg viewBox="0 0 900 350" width="790" height="307"><g id="figHist"></g></svg></div>
      <div style="max-width:28ch">
        <div class="rem" style="margin-top:0">
          <div class="h">what to look for</div>
          <ul>
            <li>The typical longest chain is about three positions out of thirty one.</li>
            <li>Long chains are not merely rare, they are exponentially rare. Each extra position roughly halves the odds.</li>
            <li>Watch the record climb, then stall. Half a million additions never reached past twenty.</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="spec">
      <div class="c"><div class="l">ADDITIONS</div><div class="v" id="hTotal">0</div><div class="s">random inputs</div></div>
      <div class="c"><div class="l">AVERAGE CHAIN</div><div class="v" id="hMean">0.0</div><div class="s">out of a possible 31</div></div>
      <div class="c"><div class="l">LONGEST SEEN</div><div class="v" id="hRec" style="color:var(--amber)">0</div><div class="s">the record so far</div></div>
      <div class="c"><div class="l">WOULD FIT ONE CYCLE</div><div class="v" id="hFit" style="color:var(--ok)">0%</div><div class="s">and must wait anyway</div></div>
    </div>
    <div class="btnrow">
      <button class="btn hot" id="hRun">run &#9654;</button>
      <button class="btn" id="hOne">add one</button>
      <button class="btn" id="hClear">clear</button>
    </div>
  </div>
  <div class="cue">Let it run to fifty thousand. The shape appears at once, then the record creeps and stops.</div>
</section>

<section class="slide" data-t="Why that does not help" data-act="3 · when it does hurt">
  <div>
    <div class="tag bad">CLASS 18, WALL TWO, ARRIVING WITH A BILL</div>
    <h2 style="font-size:29px;margin-bottom:4px">And the circuit has no way to tell you it finished early.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 230" width="1080" height="218"><g id="figWorst"></g></svg></div>
    <div class="rem bad" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>A combinational circuit settles, and nothing announces the moment. That was the second wall in Class 18, and this is what it costs.</li>
        <li>So the clock has to cover the longest path that <em>could</em> happen, on the one input in millions that causes it.</li>
        <li>Designing for the worst case is not pessimism. It is the only correct thing to do when you cannot detect the good case.</li>
      </ul>
    </div>
  </div>
  <div class="cue">First escape closed. Note that it fails for a reason they already met, not a new one.</div>
</section>

<section class="slide" data-t="So change the shape" data-act="3 · when it does hurt">
  <div>
    <h2>Then change the shape, the way you did in Class 18.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>That hour ended with two circuits of identical gate count. The chain took seven delays and the tree took three, and the tree was free.</p>

  (function(){

    for(var k=0;k<NB;k++){ target[k]=0; shown[k]=0; }
    function trial(){
      var best=0, run=0, armed=false;
      for(var k=0;k<32;k++){
        var a=Math.random()<0.5?1:0, b=Math.random()<0.5?1:0;

        else { armed=false; run=0; }

      txt(g,X0+NB*BW/2,BASE+44,'COLUMNS THE CARRY TRAVELLED',

  /* ================= what every column knows ================= */
