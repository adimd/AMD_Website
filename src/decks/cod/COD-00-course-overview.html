<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Organisation and Design · Course overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:74px 96px 104px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:32px;left:96px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
#rail{position:absolute;left:96px;right:96px;bottom:36px;display:flex;gap:4px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)}
#rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:96px;bottom:60px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:96px;bottom:60px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
.kicker.grey{color:var(--soft)}
h1{font-family:var(--display);font-weight:600;font-size:92px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.08;letter-spacing:-.02em;color:var(--ink);margin-bottom:24px}
p{font-size:28px;line-height:1.48;max-width:32ch}
p+p{margin-top:16px}
.big{font-size:37px;line-height:1.3;color:var(--ink);font-weight:300;max-width:26ch}
.small{font-size:21px;line-height:1.5;color:var(--soft);max-width:60ch}
strong{color:var(--ink);font-weight:700}
em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}

.split{display:grid;grid-template-columns:1fr 1fr;gap:54px;align-items:center}
.stack>*+*{margin-top:18px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 32px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:14px}

.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.facts .f{border-top:2px solid var(--rule2);padding-top:16px}
.facts .f .v{font-family:var(--display);font-size:48px;font-weight:600;color:var(--accent);line-height:1}
.facts .f .k{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-top:10px;line-height:1.55}

/* arcs */
.arcList{border-top:1px solid var(--rule)}
.arcList .row{display:grid;grid-template-columns:150px 270px 1fr;gap:26px;align-items:baseline;
  padding:17px 0;border-bottom:1px solid var(--rule)}
.arcList .cls{font-family:var(--mono);font-size:16px;letter-spacing:.1em;color:var(--soft)}
.arcList .nm{font-size:28px;font-weight:700;color:var(--ink);line-height:1.15}
.arcList .q{font-family:var(--display);font-size:27px;font-weight:500;color:var(--accent);line-height:1.25}
.arcList .row.last .nm,.arcList .row.last .q{color:var(--soft)}
.arcList .row.last .q{color:var(--fail)}

/* grade */
.gbar{display:flex;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--rule2)}
.gbar .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:27px;font-weight:700}
.gtable{width:100%;border-collapse:collapse;margin-top:24px}
.gtable td{padding:13px 6px;border-bottom:1px solid var(--rule);font-size:24px}
.gtable td.k{color:var(--ink);font-weight:700;width:40%}
.gtable td.w{color:var(--soft);font-family:var(--mono);font-size:19px}
.gtable td.p{text-align:right;font-family:var(--mono);font-weight:700;font-size:27px;color:var(--accent);width:12%}
.gtable tr:last-child td{border-bottom:none}
.swatch{display:inline-block;width:15px;height:15px;border-radius:3px;margin-right:13px;vertical-align:-1px}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:96px;right:96px;bottom:88px;display:none;padding:13px 17px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:70px 96px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:22px;font-weight:400}
#jump ol{list-style:none}
#jump li{padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:24px;color:var(--body);display:flex;gap:20px}
#jump li:hover{color:var(--accent)}
#jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:44px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Course overview</b></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title">
  <div>
    <div class="kicker">third semester core course</div>
    <h1>Computer<br>Organisation<br>and Design</h1>
    <div class="facts">
      <div class="f"><div class="v">50</div><div class="k">sessions<br>of one hour</div></div>
      <div class="f"><div class="v">6</div><div class="k">arcs, each opening on<br>the last one's question</div></div>
      <div class="f"><div class="v">1</div><div class="k">computational core,<br>built by you</div></div>
      <div class="f"><div class="v">0</div><div class="k">circuits taken<br>on faith</div></div>
    </div>
  </div>
  <div class="cue">Adithya MD. Leads into Fundamentals of Computer Architecture.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="What it is about">
  <div class="center">
    <div class="kicker">this course answers one question in fifty hours</div>
    <h2 style="font-size:64px;margin-bottom:28px">What is actually happening<br>underneath a line of code?</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">It starts lower than you expect, with what a number is and why a machine cannot hold most numbers exactly. It ends with a processor you built, running a program you wrote.</p>
  </div>
  <div class="cue">Fifty hours on one question is the whole pitch. Do not soften it.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Two ideas">
  <div>
    <div class="kicker grey">two sentences hold the whole thing together</div>
    <div class="split" style="gap:50px">
      <div class="panel">
        <span class="lab">one</span>
        <p class="big" style="max-width:none;font-size:34px">A computer contains no numbers. Only voltages, and circuits built to read those voltages as numbers.</p>
      </div>
      <div class="panel frag">
        <span class="lab">two</span>
        <p class="big" style="max-width:none;font-size:34px">A processor contains no instructions. Only circuits, and an instruction is a number that selects one of them.</p>
      </div>
    </div>
    <p class="big frag" style="margin-top:30px;max-width:74ch;font-size:31px">If you leave with nothing else, leave with these two. Everything in fifty hours is one of them being earned.</p>
  </div>
  <div class="cue">Read both aloud, slowly.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="The six arcs">
  <div>
    <div class="kicker">six arcs, fifty classes</div>
    <h2 style="font-size:44px;margin-bottom:24px">Each one opens with a question<br>the arc before it left hanging.</h2>
    <div class="arcList" id="arcList"></div>
  </div>
  <div class="cue">Read down the right hand column only. Material arrives because something is missing without it, not because it is next on a list.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Evaluation">
  <div>
    <div class="kicker">how the hundred marks are split</div>
    <h2 style="font-size:50px;margin-bottom:24px">Two thirds of it is<br>things you build.</h2>
    <div class="gbar" id="gbar"></div>
    <table class="gtable" id="gtable"></table>
    <p class="small frag" style="margin-top:18px;font-size:20px">Attendance of 75% is mandatory. Below it you are not eligible to sit the final assessment.</p>
  </div>
  <div class="cue">Worth saying: nothing in this table rewards memorising, the quizzes are open notes, and half the marks on every assignment sit in the write up rather than the code.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Class 1">
  <div class="center">
    <div class="kicker">that is the course</div>
    <h2 style="font-size:56px;margin-bottom:30px">Class 1 starts with four<br>things that went wrong.</h2>
    <p class="big frag" style="max-width:44ch;color:var(--soft)">No explanation for the first fifteen minutes. Bring paper.</p>
  </div>
  <div class="cue">Do not preview the failures. Go straight into Class 1 if there is time left in the session.</div>
</section>

</template>

<script>
(function(){
  'use strict';

  var ARCS=[
    ['Representation','1 to 12','Four failures that turn out to be one failure'],
    ['Logic','13 to 18','You can store 5, so how does a machine add 1 to it?'],
    ['Arithmetic','19 to 26','Put representation and gates together'],
    ['The ALU','27 to 31','Seven separate circuits, one set of inputs and outputs'],
    ['Storage','32 to 36','Where does int x = 5 physically live?'],
    ['The Processor','37 to 49','Somebody has been setting the controls by hand for six classes'],
    ['Closing','50','What actually happens when you press run?']
  ];

  var GRADE=[
    {k:'Assignments', w:'one per arc, best 4 of 6, throughout', p:20, c:'#23408f'},
    {k:'Quiz 1', w:'month 1', p:10, c:'#4a6fbf'},
    {k:'Mid-semester examination', w:'after the Arithmetic arc closes', p:20, c:'#146b5c'},
    {k:'Quiz 2', w:'month 3', p:10, c:'#4a6fbf'},
    {k:'Final demonstration and presentation', w:'end of the course', p:40, c:'#a8231f'}
  ];

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('#jump')||e.target.closest('button')) return;
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  /* arcs */
  var arcList=document.getElementById('arcList');
  if(arcList){
    var h='';
    ARCS.forEach(function(a,k){
      var last = (k===ARCS.length-1);
      h+='<div class="row'+(last?' last':'')+'">'+
         '<div class="cls">CLASS '+a[1]+'</div>'+
         '<div class="nm">'+a[0]+'</div>'+
         '<div class="q">'+a[2]+'</div></div>';
    });
    arcList.innerHTML=h;
  }

  /* grade */
  var gb=document.getElementById('gbar');
  if(gb){
    var h='';
    GRADE.forEach(function(g){ h+='<div class="seg" style="width:'+g.p+'%;background:'+g.c+'">'+g.p+'%</div>'; });
    gb.innerHTML=h;
    var t='';
    GRADE.forEach(function(g){
      t+='<tr><td class="k"><span class="swatch" style="background:'+g.c+'"></span>'+g.k+'</td>'+
         '<td class="w">'+g.w+'</td><td class="p">'+g.p+'%</td></tr>';
    });
    document.getElementById('gtable').innerHTML=t;
  }

  paint();
})();
</script>
</body>
</html>
