  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.34;font-style:italic;z-index:6}

</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 20</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 20 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="picking up where we stopped">
  <div>
    <div class="kicker">class 20 · hour twenty of fifty</div>
    <h1>How do you add<br>thirty two?</h1>
    <p class="big" style="margin-top:22px;max-width:47ch">Chaining the columns takes about a minute. What falls off the end of the chain is what nineteen hours of this course have been walking towards.</p>
  </div>
  <div class="cue">Collect the send off first: 255 plus 1 in eight bits, and what the last carry did.</div>
</section>

<section class="slide" data-t="Where we are" data-act="picking up where we stopped">
  <div>
    <h2>Last session you built one column. Here is the rest of the arc.</h2>
    <div style="text-align:center;margin-top:4px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">today, in one line</div>
      <ul>
        <li>Line thirty two full adders up and join each carry out to the next carry in. That is the whole construction.</li>
        <li>Then feed it two numbers whose answer does not fit, and find out where the missing bit goes.</li>
        <li>Everything is drawn with eight columns so it fits on a slide. Real machines use thirty two or sixty four, and none of the argument changes.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the eight versus thirty two thing once, clearly, so nobody leaves thinking eight bits is the real machine.</div>
</section>

<section class="slide" data-t="Joining them up" data-act="the chain">
  <div>
    <div class="kicker">press add a column, and watch what each one needs</div>
    <h2 style="font-size:29px;margin-bottom:0">Each column makes a carry. Each column also needs one. Join them.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1180 350" width="1120" height="333"><g id="figChain"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="chAdd">add a column &#9654;</button>
      <button class="btn" id="chAll">all eight</button>
      <button class="btn" id="chReset">start with one</button>
    </div>
  </div>
  <div class="cue">The rightmost carry in has nothing to its right, so it is tied to zero. Somebody always asks.</div>
</section>

<section class="slide" data-t="The adder, live" data-act="the chain">
  <div>
    <div class="tag win">THAT IS AN ADDER</div>
    <div class="kicker" style="margin-top:2px">click any a or b bit, or load one of the presets below</div>
    <h2 style="font-size:26px;margin-bottom:0">Eight full adders, forty eight gates, one wire between each pair.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1200 350" width="1150" height="335"><g id="figAdder"></g></svg></div>
    <div class="readers">
      <div class="reader" id="rdU"><div class="h">IF YOU MEANT UNSIGNED</div><div class="eq" id="eqU"></div><div class="vd" id="vdU"></div></div>
      <div class="reader" id="rdS"><div class="h">IF YOU MEANT SIGNED</div><div class="eq" id="eqS"></div><div class="vd" id="vdS"></div></div>
      <div class="lamps">
        <div class="lamp" id="lampC"><div class="dot"></div><div class="t"><b>CARRY OUT</b>the ninth bit</div></div>
        <div class="lamp" id="lampV"><div class="dot"></div><div class="t"><b>OVERFLOW</b>the sign is wrong</div></div>
      </div>
    </div>
    <div class="btnrow">
      <span class="lab">TRY</span>
      <button class="btn hot" data-p="7,3">7 + 3</button>
      <button class="btn" data-p="255,1">255 + 1</button>
      <button class="btn" data-p="255,16">255 + 16</button>
      <button class="btn" data-p="127,1">127 + 1</button>
      <button class="btn" data-p="100,100">100 + 100</button>
      <button class="btn" data-p="128,255">128 + 255</button>
      <span style="width:12px"></span>
      <button class="btn" id="ripple">watch the carry travel</button>
    </div>
  </div>
  <div class="cue">Leave it on 7 + 3. Both readings agree, both lamps dark. That is the boring case, and it will not last.</div>
</section>

<section class="slide" data-t="255 plus 1" data-act="when it does not fit">
  <div>
    <div class="kicker">go back a slide and press 255 + 1 if you want to watch it happen</div>
    <h2 style="font-size:29px;margin-bottom:4px">The largest number it can hold, plus one, comes back as zero.</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>Not an error. Not a warning. A confident, calm, wrong zero, delivered as fast as any other answer.</p>
        <p class="frag">And here is the part worth sitting with: <strong>every single column got its own column right.</strong> Not one full adder made a mistake.</p>
        <p class="big frag" style="margin-top:6px">The ninth bit of the answer was computed correctly and then had nowhere to go.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">so where did it actually end up</div>
        <ul>
          <li>On the carry out wire at the far left, where it has been sitting the whole time.</li>
          <li>There were eight sum wires and the answer needed nine digits. The hardware did its job and the container was too small.</li>
          <li>That distinction matters. Nothing here is broken, and something has still gone badly wrong.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">The hardware is not broken. Say it plainly. Everything after this depends on them accepting it.</div>
</section>

<section class="slide" data-t="The wallpaper" data-act="when it does not fit">
  <div>
    <div class="tag bad">HOUR ONE, FINALLY CLOSED</div>
    <div class="kicker" style="margin-top:2px">press store to write it into eight bits</div>
    <h2 style="font-size:28px;margin-bottom:0">A phone that would not boot, and a colour value of 271.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figWall"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="wStore">store it &#9654;</button>
      <button class="btn" id="wBack">back</button>
    </div>
  </div>
  <div class="cue">Then go back two slides and run 255 + 16 live. Watching 15 come out of a circuit they built is the payoff.</div>
</section>

<section class="slide" data-t="The carry flag" data-act="when it does not fit">
  <div>
    <div class="tag win">SO GIVE IT A NAME</div>
    <h2 style="font-size:29px;margin-bottom:4px">The wire has a name, and reading it is somebody else's job.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 220" width="1060" height="208"><g id="figFlag"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>An adder of fixed width cannot hand you an answer that needs more width. All it can do is tell you it happened.</li>
        <li>That one bit becomes an output of the machine alongside the answer, and it is called the <strong>carry flag</strong>.</li>
        <li>Hardware raising a flag and software never looking at it is the single most common shape of arithmetic bug there is.</li>
        <li>In C, unsigned overflow is defined to wrap quietly. The flag is right there. The language just does not make you check.</li>
      </ul>
    </div>
  </div>
  <div class="cue">A flag is a notification, not a fix. Notifications get ignored, and this one usually is.</div>
</section>

<section class="slide" data-t="127 plus 1" data-act="the second failure">
  <div>
    <div class="kicker">predict the carry lamp before you look &nbsp;·&nbsp; most people get this wrong</div>
    <h2 style="font-size:29px;margin-bottom:4px">Now try 127 plus 1, and watch the flag you just built do nothing.</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>In two's complement, 127 is the biggest positive number eight bits will hold. Add one and you get the pattern <span class="num">10000000</span>, which a signed reader calls <span class="num">-128</span>.</p>
        <p class="frag">Wrong by two hundred and fifty six. And the carry flag stays dark.</p>
        <p class="big frag" style="margin-top:6px">Nothing fell off the end. As unsigned, 127 + 1 is 128, and 128 fits perfectly well.</p>
      </div>
      <div class="rem bad frag" style="margin-top:0">
        <div class="h">the same eight wires, at the same instant</div>
        <ul>
          <li>An unsigned reader looks at that result and is completely satisfied.</li>
          <li>A signed reader looks at the same wires and has been lied to.</li>
          <li>So the disagreement is not in the hardware. It is in what the two of them thought the bits meant.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Take a show of hands on the carry lamp first. Almost everybody says it lights.</div>
</section>

<section class="slide" data-t="One ring, two ends" data-act="the second failure">
  <div>
    <div class="kicker">back to the circle from class five &nbsp;·&nbsp; press show the cuts</div>
    <h2 style="font-size:28px;margin-bottom:2px">Two readers, one ring, and they disagree about where it ends.</h2>
    <div class="row" style="align-items:center;gap:26px">
      <div><svg viewBox="0 0 760 410" width="600" height="324"><g id="figCircle"></g></svg></div>
      <div style="max-width:31ch">
        <p style="font-size:18.5px">Two hundred and fifty six patterns in a ring, and counting up walks you round it. Nothing new since Class 5.</p>
        <p class="frag" style="font-size:18.5px;margin-top:9px">But the two readers put the end of the number line in <em>different places</em> on that ring.</p>
        <div class="rem frag" style="margin-top:10px">
          <div class="h">so there are two ways to fall off</div>
          <ul>
            <li>Step over the unsigned cut and the unsigned answer is wrong.</li>
            <li>Step over the signed cut and the signed answer is wrong.</li>
            <li>They sit on opposite sides, so crossing one tells you nothing about the other.</li>
          </ul>
        </div>
        <div class="btnrow" style="justify-content:flex-start">
          <button class="btn hot" id="ciCuts">show the cuts</button>
          <button class="btn" id="ciBack">just the ring</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Draw the ring on the board and mark both cuts before showing this. Two ends is the idea of the hour.</div>
</section>

<section class="slide" data-t="Different signs are safe" data-act="the second failure">
  <div>
    <div class="kicker">before hunting for a detector, throw away half the cases</div>
    <h2 style="font-size:28px;margin-bottom:2px">Adding a positive to a negative can never overflow. Ever.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 250" width="1080" height="237"><g id="figSafe"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the whole argument, in three lines</div>
      <ul>
        <li>If one input is positive and the other is negative, the true answer lies somewhere <em>between</em> them.</li>
        <li>Both inputs are representable, and the representable numbers run in one unbroken stretch from -128 to 127.</li>
        <li>So anything between two of them is representable too. There is nothing to fall off.</li>
        <li>This is not a fact about two's complement. It is true of adding inside any contiguous range at all.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Half of the eight sign combinations die on this slide, which is what makes the next one short.</div>
</section>

<section class="slide" data-t="The sign rule" data-act="the second failure">
  <div>
    <div class="kicker">so it comes down to three bits &nbsp;·&nbsp; filter the rows and look</div>
    <h2 style="font-size:28px;margin-bottom:2px">Same sign in, other sign out. That, and only that, is overflow.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 430" width="1030" height="388"><g id="figSignTable"></g></svg></div>
    <div class="btnrow">
      <span class="lab">SHOW</span>
      <button class="btn hot" data-fl="all">all eight rows</button>
      <button class="btn" data-fl="same">where the inputs agree</button>
      <button class="btn" data-fl="diff">where they differ</button>
    </div>
  </div>
  <div class="cue">Filter to "differ" first: four rows, none of them overflow. Then "agree", and the two failures stand out.</div>
</section>

<section class="slide" data-t="Precondition, not verdict" data-act="the second failure">
  <div>
    <h2>Matching input signs is the condition to check. It is not the answer.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>If the two top bits differ, stop looking. There is no overflow, and there cannot be, whatever the result turns out to be.</p>
        <p class="frag">If they match, then and only then does the result's top bit decide it. Matching means the sign survived. Differing means it was pushed over the cut.</p>
        <p class="big frag" style="margin-top:6px">All three bits are needed. Any two of them leave the answer undecided.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">written out</div>
        <ul>
          <li><span class="num">V = (sa equals sb) AND (ss differs from sa)</span></li>
          <li>Every one of the eight sign combinations really happens in eight bit arithmetic. None of them is a curiosity.</li>
          <li>So a machine could check those three bits on every addition. It turns out it does not have to.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Precondition, not verdict. That phrasing heads off the usual mistake of thinking matching signs alone means overflow.</div>
</section>

<section class="slide" data-t="Ask the sign column" data-act="the second failure">
  <div>
    <div class="tag new">A CHEAPER PLACE TO LOOK</div>
    <div class="kicker" style="margin-top:2px">press next &nbsp;·&nbsp; three rows, and they all end the same way</div>
    <h2 style="font-size:28px;margin-bottom:0">The sign column is a full adder like any other. Ask what it does to a carry.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 410" width="1050" height="378"><g id="figWhy"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="yNext">next row &#9654;</button>
      <button class="btn" id="yAll">show it all</button>
      <button class="btn" id="yReset">start over</button>
    </div>
  </div>
  <div class="cue">Every wire in this table exists in the machine. Nothing here is hypothetical, which is the point.</div>
</section>

<section class="slide" data-t="Two ways to build it" data-act="the second failure">
  <div>

    <h2 style="font-size:28px;margin-bottom:2px">Six gates and a long walk, or one gate on wires already there.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 400" width="1050" height="368"><g id="figTwoWays"></g></svg></div>
  </div>
  <div class="cue">The sign rule tells you what overflow means. The sign column tells you the same thing without being asked.</div>
</section>

<section class="slide" data-t="All four cases" data-act="the second failure">
  <div>
    <div class="kicker">click any box to load it into the adder</div>
    <h2 style="font-size:28px;margin-bottom:2px">Two things can go wrong, independently, so all four combinations occur.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1080 400" width="1000" height="370"><g id="figQuad"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The bits leaving the adder are the same in all four. Only the question being asked of them is different.</li>
        <li>The circuit has no way to know which you meant, so it does not try to guess.</li>
        <li>It works out <strong>both</strong> verdicts, raises <strong>both</strong> flags, and leaves the choice to whoever wrote the program.</li>
      </ul>
    </div>
  </div>
  <div class="cue">All four quadrants hold real eight bit examples. Worth saying: this is not a theoretical taxonomy.</div>
</section>

<section class="slide" data-t="Two flags" data-act="closing">
  <div>
    <div class="tag win">WHAT THE ADDER ACTUALLY OUTPUTS</div>
    <h2 style="font-size:29px;margin-bottom:4px">Eight sum bits, and two separate pieces of bad news.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 230" width="1060" height="218"><g id="figTwoFlags"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this hour taught</div>
      <ul>
        <li><strong>Carry</strong> says the unsigned answer needed a ninth bit. <strong>Overflow</strong> says the signed answer came out with the wrong sign.</li>
        <li>They are independent, and you have now seen all four combinations of them in ordinary eight bit arithmetic.</li>
        <li>This is Class 5 arriving in copper. The bits never carried a meaning, so the hardware works for both meanings at once and lets the software pick.</li>
        <li>Every processor you will ever meet has both flags. Now you know why there are two of them.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Class 5 said the machine does not know what its bits mean. This is what that costs: two flags instead of one.</div>
</section>

<script>
(function(){
  'use strict';
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;
  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');
  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  var onSlide=null;
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
    if(onSlide) onSlide(i);
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }
  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();} else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallow=false;
  document.addEventListener('click',function(e){
    swallow = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||
                 e.target.closest('svg')||e.target.closest('.readers'));
  },true);
  document.addEventListener('click',function(e){
    if(swallow){ swallow=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  /* ================= helpers ================= */
  var NS='http://www.w3.org/2000/svg';
  var GREY='#c6c3ba', HI='#e8952b', INK='#15171b', DEAD='#dedbd3',
      BLUE='#23408f', RED='#a8231f', GRN='#146b5c', VIO='#6b3fa0', AMB='#b06a12';
  function el(tag,a,p){ var e=document.createElementNS(NS,tag);
    for(var k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
  function txt(p,x,y,s,o){ var t=el('text',Object.assign({x:x,y:y,'font-size':13,fill:'#8b9096'},o||{}),p);
    t.textContent=s; return t; }
  function rct(p,x,y,w,h,o){ return el('rect',Object.assign({x:x,y:y,width:w,height:h,rx:7,
    fill:'#fff',stroke:GREY,'stroke-width':2},o||{}),p); }
  function wire(p,x1,y1,x2,y2,v){ return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,
    stroke:v?HI:DEAD,'stroke-width':v?3.4:2.4,'stroke-linecap':'round'},p); }
  function pth(p,d,o){ return el('path',Object.assign({d:d,fill:'none',stroke:GREY,'stroke-width':2.4},o||{}),p); }
  function sgn(v){ return v>=128 ? v-256 : v; }
  function arcStrip(gid,litIndex,caption){
    var g=document.getElementById(gid); if(!g) return;
    var items=[[19,'one column'],[20,'thirty two'],[21,'and it is slow'],[22,'predict the carry'],
               [23,'subtraction'],[24,'multiply'],[25,'divide'],[26,'the bill']];
    var W=128, X0=34;
    items.forEach(function(it,k){
      var x=X0+k*(W+8), done=k<litIndex, lit=(k===litIndex);
      el('rect',{x:x,y:52,width:W,height:104,rx:12,
        fill:lit?'#eaeef7':(done?'#f2f0ea':'#fbfaf7'),
        stroke:lit?BLUE:(done?'#c6c3ba':'#e2e0d9'),'stroke-width':lit?2.6:1.5},g);
      txt(g,x+W/2,80,'CLASS '+it[0],{'font-size':9.5,fill:lit?BLUE:'#c6c3ba','text-anchor':'middle','letter-spacing':1.3});
      txt(g,x+W/2,112,it[1],{'font-size':13.5,fill:lit?INK:(done?'#8b9096':'#a9a69d'),'text-anchor':'middle','font-weight':700});
      if(done) txt(g,x+W/2,136,'done',{'font-size':11,fill:GRN,'text-anchor':'middle'});
      if(lit) txt(g,x+W/2,136,'today',{'font-size':11,fill:BLUE,'text-anchor':'middle','font-weight':700});
      if(k<items.length-1) pth(g,'M'+(x+W)+' 104 L'+(x+W+8)+' 104',{stroke:'#dedbd3','stroke-width':2});
    });
    txt(g,34,198,caption,{'font-size':15.5,fill:INK,'font-weight':700});
  }
  arcStrip('figArcTop',1,'today you line thirty two of last session\u2019s blocks up in a row, and something falls off the end.');
  arcStrip('figArcEnd',1,'the adder works. next you find out how long it makes you wait, and it is worse than anyone expects.');

  /* ================= the chain, built up ================= */
  (function(){
    var g=document.getElementById('figChain'); if(!g) return;
    var n=1;
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var BW=108, DX=126, X0=1006;
      function cx(k){ return X0-k*DX; }
      txt(g,40,32,'BUILDING THE CHAIN, RIGHT TO LEFT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.8});
      for(var k=0;k<n;k++){
        var x=cx(k), fresh=(k===n-1);
        el('rect',{x:x,y:110,width:BW,height:80,rx:11,
          fill:fresh?'#eaeef7':'#fbfaf7',stroke:fresh?BLUE:'#c3cee6','stroke-width':fresh?2.6:2},g);
        txt(g,x+BW/2,144,'full',{'font-size':12.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
        txt(g,x+BW/2,164,'adder',{'font-size':12.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
        txt(g,x+BW/2,96,'bit '+k,{'font-size':10.5,'text-anchor':'middle','letter-spacing':1.2});
        [x+32,x+76].forEach(function(px,q){
          pth(g,'M'+px+' 62 L'+px+' 110',{stroke:'#c3cee6','stroke-width':2});
          txt(g,px,54,q?'b':'a',{'font-size':11,fill:INK,'text-anchor':'middle','font-weight':700});
        });
        pth(g,'M'+(x+BW/2)+' 190 L'+(x+BW/2)+' 232',{stroke:'#c3cee6','stroke-width':2});
        txt(g,x+BW/2,250,'sum',{'font-size':11,fill:BLUE,'text-anchor':'middle'});
        if(k===0){
          wire(g,x+BW+30,150,x+BW,150,0);
          txt(g,x+BW+44,155,'0',{'font-size':14,fill:'#a9a69d'});
          txt(g,x+BW/2,286,'nothing to its right,',{'font-size':10.5,'text-anchor':'middle'});
          txt(g,x+BW/2,300,'so this one is tied low',{'font-size':10.5,'text-anchor':'middle'});
        } else {
          var from=cx(k-1);
          el('line',{x1:from,y1:150,x2:x+BW,y2:150,stroke:AMB,'stroke-width':3},g);
          pth(g,'M'+(x+BW+10)+' 143 l-10 7 l10 7',{stroke:AMB,'stroke-width':2.6});
          if(k===n-1) txt(g,(from+x+BW)/2,136,'carry',{'font-size':10.5,fill:AMB,'text-anchor':'middle','font-weight':700});
        }
      }
      if(n===8){
        wire(g,cx(7),150,cx(7)-52,150,1);
        el('rect',{x:cx(7)-116,y:126,width:60,height:48,rx:8,fill:'#fbf0dc',stroke:AMB,'stroke-width':2},g);
        txt(g,cx(7)-86,148,'carry',{'font-size':11,fill:AMB,'text-anchor':'middle','font-weight':700});
        txt(g,cx(7)-86,164,'out',{'font-size':11,fill:AMB,'text-anchor':'middle','font-weight':700});
        txt(g,cx(7)-116,200,'and this one',{'font-size':10.5,fill:AMB});
        txt(g,cx(7)-116,214,'goes nowhere',{'font-size':10.5,fill:AMB});
      }
      txt(g,40,326, n<8
        ? n+' of 8 columns. each new one takes the carry from the column on its right.'
        : 'eight full adders, forty eight gates, one wire joining each pair. that is the whole design.',
        {'font-size':15.5,fill:n===8?GRN:'#8b9096','font-weight':n===8?700:400});
    }
    document.getElementById('chAdd').onclick=function(){ n=(n>=8)?1:n+1; render(); };
    document.getElementById('chAll').onclick=function(){ n=8; render(); };
    document.getElementById('chReset').onclick=function(){ n=1; render(); };
    render();
  })();

  /* ================= the live adder ================= */
  var A=7, B=3, rippleTo=8;
  function compute(){
    var s=0, carry=0, cs=[0];
    for(var k=0;k<8;k++){
      var ab=(A>>k)&1, bb=(B>>k)&1, tot=ab+bb+carry;
      s|=(tot&1)<<k; carry=tot>>1; cs.push(carry);
    }
    return {sum:s, cout:carry, cs:cs, V:(cs[7]^carry)};
  }
  var adderCtl=null;
  (function(){
    var g=document.getElementById('figAdder'); if(!g) return;
    var BW=104, DX=124, X0=150;
    function colX(k){ return X0+(7-k)*DX; }
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var r=compute();
      for(var k=7;k>=0;k--){
        var X=colX(k), live=(rippleTo>=k+1), cinShown=(rippleTo>=k);
        var ab=(A>>k)&1, bb=(B>>k)&1, sb=(r.sum>>k)&1;
        txt(g,X+BW/2,32,'bit '+k,{'font-size':10.5,'text-anchor':'middle','letter-spacing':1.2});
        [[ab,58,'A'],[bb,106,'B']].forEach(function(pr){
          var v=pr[0], y=pr[1];
          var rr=rct(g,X+BW/2-24,y,48,38,{fill:v?'#fbf0dc':'#f6f4ef',stroke:v?AMB:'#e2e0d9'});
          rr.style.cursor='pointer';
          rr.onclick=(function(which,kk){ return function(){
            if(which==='A') A^=(1<<kk); else B^=(1<<kk);
            rippleTo=8; render(); readouts();
          }; })(pr[2],k);
          txt(g,X+BW/2,y+26,v,{'font-size':18,fill:v?HI:'#a9a69d','text-anchor':'middle','font-weight':700,'pointer-events':'none'});
        });
        rct(g,X,164,BW,68,{rx:10,fill:live?'#fbfaf7':'#f4f2ed',stroke:live?'#c3cee6':'#e2e0d9','stroke-width':2});
        txt(g,X+BW/2,196,'full',{'font-size':12,fill:live?BLUE:'#c6c3ba','text-anchor':'middle','font-weight':700});
        txt(g,X+BW/2,214,'adder',{'font-size':12,fill:live?BLUE:'#c6c3ba','text-anchor':'middle','font-weight':700});
        wire(g,X+BW/2,96,X+BW/2,164,ab&&live);
        wire(g,X+BW/2,144,X+BW/2,164,bb&&live);
        wire(g,X+BW/2,232,X+BW/2,262,live);
        rct(g,X+BW/2-24,262,48,40,{fill:live?(sb?'#eaeef7':'#f6f4ef'):'#f4f2ed',
          stroke:live?(sb?'#c3cee6':'#e2e0d9'):'#e2e0d9'});
        txt(g,X+BW/2,290,live?sb:'',{'font-size':19,fill:sb?BLUE:'#a9a69d','text-anchor':'middle','font-weight':700});
        if(k===0){
          wire(g,X+BW+26,198,X+BW,198,0);
          txt(g,X+BW+40,203,'0',{'font-size':15,fill:'#a9a69d'});
        } else {
          var from=colX(k-1);
          wire(g,from,198,X+BW,198,r.cs[k]&&cinShown);
          if(r.cs[k]&&cinShown) txt(g,(from+X+BW)/2,190,'1',{'font-size':11.5,fill:AMB,'text-anchor':'middle','font-weight':700});
        }
      }
      var X7=colX(7), coShown=(rippleTo>=8);
      wire(g,X7,198,X7-46,198,r.cout&&coShown);
      rct(g,X7-104,176,58,44,{fill:(r.cout&&coShown)?'#fbf0dc':'#f6f4ef',stroke:(r.cout&&coShown)?AMB:'#e2e0d9'});
      txt(g,X7-75,206,coShown?r.cout:'',{'font-size':19,fill:r.cout?HI:'#a9a69d','text-anchor':'middle','font-weight':700});
      txt(g,X7-75,238,'CARRY',{'font-size':10,'text-anchor':'middle','letter-spacing':1.2});
      txt(g,X7-75,252,'OUT',{'font-size':10,'text-anchor':'middle','letter-spacing':1.2});
      txt(g,X0-58,84,'a',{'font-size':14,fill:INK,'text-anchor':'end','font-weight':700});
      txt(g,X0-58,132,'b',{'font-size':14,fill:INK,'text-anchor':'end','font-weight':700});
      txt(g,X0-58,290,'sum',{'font-size':13,fill:BLUE,'text-anchor':'end','font-weight':700});
      if(rippleTo<8) txt(g,X0,330,'the carry has got as far as column '+Math.max(0,rippleTo-1)+' of 7',
        {'font-size':13.5,fill:AMB,'font-weight':700});
    }
    function readouts(){
      var r=compute();
      var uOK=((A+B)===r.sum), sOK=((sgn(A)+sgn(B))===sgn(r.sum));
      document.getElementById('eqU').textContent=A+' + '+B+' = '+r.sum;
      document.getElementById('vdU').textContent=uOK?'correct':('should be '+(A+B)+'  \u00b7  it wrapped');
      document.getElementById('rdU').className='reader '+(uOK?'good':'bad');
      document.getElementById('eqS').textContent=sgn(A)+' + '+sgn(B)+' = '+sgn(r.sum);
      document.getElementById('vdS').textContent=sOK?'correct':('should be '+(sgn(A)+sgn(B))+'  \u00b7  it overflowed');
      document.getElementById('rdS').className='reader '+(sOK?'good':'bad');
      document.getElementById('lampC').className='lamp'+(r.cout?' on':'');
      document.getElementById('lampV').className='lamp'+(r.V?' on':'');
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot');
        var p=b.getAttribute('data-p').split(',');
        A=+p[0]; B=+p[1]; rippleTo=8; render(); readouts();
      };
    });
    var timer=null;
    function stop(){ if(timer){clearInterval(timer);timer=null;}
      var b=document.getElementById('ripple'); if(b) b.classList.remove('hot');
      rippleTo=8; render(); }
    document.getElementById('ripple').onclick=function(){
      if(timer){ stop(); return; }
      this.classList.add('hot'); rippleTo=0; render();
      timer=setInterval(function(){
        rippleTo++; render();
        if(rippleTo>=8){ clearInterval(timer); timer=null;
          document.getElementById('ripple').classList.remove('hot'); render(); }
      },400);
    };
    render(); readouts();
    adderCtl={stop:stop};
  })();

  /* ================= the wallpaper ================= */
  (function(){
    var g=document.getElementById('figWall'); if(!g) return;
    var stored=false;
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,34,30,'A COLOUR VALUE OF 271',{'font-size':10.5,fill:RED,'letter-spacing':1.8});
      var bits=[1,0,0,0,0,1,1,1,1];
      bits.forEach(function(v,idx){
        var x=40+idx*74, keep=idx>0, lost=stored&&!keep;
        el('rect',{x:x,y:54,width:58,height:58,rx:9,
          fill:lost?'#fbfaf7':(v?(keep?'#fbf0dc':'#fdf0ef'):'#f6f4ef'),
          stroke:lost?'#e2e0d9':(v?(keep?AMB:RED):'#e2e0d9'),
          'stroke-width':2,'stroke-dasharray':lost?'5 4':''},g);
        txt(g,x+29,94,lost?'':v,{'font-size':24,fill:v?(keep?HI:RED):'#a9a69d','text-anchor':'middle','font-weight':700});
        txt(g,x+29,132,keep?('bit '+(8-idx)):'the ninth',{'font-size':10,'text-anchor':'middle',fill:keep?'#8b9096':RED});
      });
      el('rect',{x:108,y:48,width:664,height:70,rx:10,fill:'none',stroke:'#c3cee6','stroke-width':2.4},g);
      txt(g,440,150,'the eight bits the container holds',{'font-size':12,fill:BLUE,'text-anchor':'middle'});
      if(!stored){
        el('rect',{x:34,y:48,width:70,height:70,rx:10,fill:'none',stroke:RED,'stroke-width':3,'stroke-dasharray':'7 5'},g);
        txt(g,69,26,'no wire for this one',{'font-size':11.5,fill:RED,'text-anchor':'middle','font-weight':700});
        txt(g,34,206,'271 needs nine bits. the variable holding it has eight.',{'font-size':17,fill:INK});
        txt(g,34,236,'press store and watch which one does not make it.',{'font-size':15,fill:'#8b9096'});
      } else {
        pth(g,'M69 44 L69 20',{stroke:RED,'stroke-width':2.4});
        txt(g,69,14,'gone',{'font-size':12,fill:RED,'text-anchor':'middle','font-weight':700});
        pth(g,'M796 84 L856 84 M844 77 l12 7 l-12 7',{stroke:'#c6c3ba','stroke-width':2.4});
        el('rect',{x:876,y:52,width:214,height:64,rx:12,fill:'#fdf0ef',stroke:'#e0bcb9','stroke-width':2},g);
        txt(g,983,96,'reads back as 15',{'font-size':19,fill:RED,'text-anchor':'middle','font-weight':700});
        txt(g,34,206,'a colour meant to sit near the top of its range arrives near the bottom.',{'font-size':17,fill:INK});
        txt(g,34,236,'the wrong colour, and then a crash loop that no reboot escapes.',{'font-size':17,fill:INK});
        txt(g,34,278,'your adder does this too. load 255 + 16 and the sum reads 15, with the carry lamp lit.',
          {'font-size':15,fill:RED,'font-weight':700});
      }
    }
    document.getElementById('wStore').onclick=function(){ stored=true; render(); };
    document.getElementById('wBack').onclick=function(){ stored=false; render(); };
    render();
  })();

  /* ================= the flag ================= */
  (function(){
    var g=document.getElementById('figFlag'); if(!g) return;
    rct(g,40,40,400,130,{rx:14,fill:'#fbfaf7',stroke:'#e2e0d9'});
    txt(g,64,70,'WHAT THE ADDER HANDS OVER',{'font-size':10.5,fill:BLUE,'letter-spacing':1.8});
    txt(g,64,110,'8 sum bits',{'font-size':19,fill:INK,'font-weight':700});
    txt(g,64,142,'1 carry bit',{'font-size':19,fill:AMB,'font-weight':700});
    pth(g,'M470 105 L530 105 M518 98 l12 7 l-12 7',{stroke:'#c6c3ba','stroke-width':2.4});
    rct(g,560,40,240,130,{rx:14,fill:'#eaeef7',stroke:'#c3cee6','stroke-width':2});
    txt(g,584,70,'WHAT THE PROGRAM TAKES',{'font-size':10.5,fill:BLUE,'letter-spacing':1.8});
    txt(g,584,110,'8 sum bits',{'font-size':19,fill:INK,'font-weight':700});
    txt(g,584,142,'and looks away',{'font-size':17,fill:RED,'font-weight':700});
    txt(g,830,96,'a flag is a notification,',{'font-size':16,fill:INK});
    txt(g,830,120,'not a fix',{'font-size':16,fill:INK,'font-weight':700});
    txt(g,40,204,'nothing forces a program to check it, and in C unsigned overflow is defined to wrap quietly.',
      {'font-size':15,fill:'#8b9096'});
  })();

  /* ================= the ring ================= */
  (function(){
    var g=document.getElementById('figCircle'); if(!g) return;
    var cuts=false, CX=330, CY=214, R=120;
    function P(v,rad){ var t=(v/256)*Math.PI*2 + Math.PI;
      return [CX+rad*Math.cos(t), CY+rad*Math.sin(t)]; }
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      el('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'#dedbd3','stroke-width':16},g);
      el('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'#c6c3ba','stroke-width':1.5},g);
      el('path',{d:'M'+(CX-30)+' '+(CY-26)+' A 40 40 0 0 1 '+(CX+24)+' '+(CY-32),
        fill:'none',stroke:'#c6c3ba','stroke-width':2},g);
      el('path',{d:'M'+(CX+16)+' '+(CY-40)+' l10 8 l-10 6',fill:'none',stroke:'#c6c3ba','stroke-width':2},g);
      txt(g,CX,CY+2,'counting up',{'font-size':12,'text-anchor':'middle'});
      txt(g,CX,CY+20,'goes this way',{'font-size':12,'text-anchor':'middle'});
      [[32,'32','32'],[64,'64','64'],[96,'96','96'],
       [160,'160','-96'],[192,'192','-64'],[224,'224','-32']].forEach(function(t){
        var p=P(t[0],R-8), q=P(t[0],R+8);
        el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#a9a69d','stroke-width':1.6},g);
        var o=P(t[0],R+30), inr=P(t[0],R-30);
        txt(g,o[0],o[1]+4,t[1],{'font-size':12,fill:AMB,'text-anchor':'middle','font-weight':700});
        txt(g,inr[0],inr[1]+4,t[2],{'font-size':12,fill:cuts?BLUE:'#d5d2ca','text-anchor':'middle','font-weight':700});
      });
      if(cuts){
        function cut(v,col,lab,sub,lx,anchor){
          var p=P(v,R-24), q=P(v,R+24);
          el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col,'stroke-width':7,'stroke-linecap':'round'},g);
          txt(g,lx,CY-8,lab,{'font-size':15,fill:col,'text-anchor':anchor,'font-weight':700});
          txt(g,lx,CY+12,sub,{'font-size':12,fill:col,'text-anchor':anchor});
        }
        cut(255.5,AMB,'255 \u2192 0','where unsigned ends',CX-R-38,'end');
        cut(127.5,RED,'127 \u2192 -128','where signed ends',CX+R+38,'start');
      }
      el('circle',{cx:150,cy:386,r:6,fill:AMB},g);
      txt(g,166,391,'outer: what unsigned sees',{'font-size':12.5,fill:'#8b9096'});
      el('circle',{cx:450,cy:386,r:6,fill:cuts?BLUE:'#d5d2ca'},g);
      txt(g,466,391,'inner: what signed sees',{'font-size':12.5,fill:cuts?'#8b9096':'#d5d2ca'});
      txt(g,CX,28,cuts?'the same patterns, cut in two different places':'two hundred and fifty six patterns, in a ring',
        {'font-size':13.5,fill:INK,'text-anchor':'middle','font-weight':700});
    }
    document.getElementById('ciCuts').onclick=function(){ cuts=true; render(); };
    document.getElementById('ciBack').onclick=function(){ cuts=false; render(); };
    render();
  })();

  /* ================= different signs are safe ================= */
  (function(){
    var g=document.getElementById('figSafe'); if(!g) return;
    var X0=110, W=920, Y=96;
    function xOf(v){ return X0+(v+128)/255*W; }
    el('rect',{x:X0,y:Y-22,width:W,height:44,rx:10,fill:'#e9f2ef',stroke:'#b6d5cc','stroke-width':2},g);
    txt(g,X0,Y+44,'-128',{'font-size':13,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,X0+W,Y+44,'127',{'font-size':13,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,X0+W/2,Y+44,'0',{'font-size':13,fill:'#8b9096','text-anchor':'middle'});
    el('line',{x1:X0+W/2,y1:Y-22,x2:X0+W/2,y2:Y+22,stroke:'#b6d5cc','stroke-width':1.6},g);
    txt(g,X0,26,'EVERY NUMBER YOU CAN WRITE, IN ONE UNBROKEN STRETCH',{'font-size':10.5,fill:GRN,'letter-spacing':1.8});
    function mark(v,lab,col,dy){
      var x=xOf(v);
      el('line',{x1:x,y1:Y-30,x2:x,y2:Y+30,stroke:col,'stroke-width':3},g);
      el('circle',{cx:x,cy:Y,r:8,fill:'#fff',stroke:col,'stroke-width':3},g);
      txt(g,x,Y+dy,lab,{'font-size':14,fill:col,'text-anchor':'middle','font-weight':700});
    }
    mark(-40,'b = -40',RED,-42);
    mark(100,'a = 100',BLUE,-42);
    mark(60,'a + b = 60',INK,72);
    var l=xOf(-40), r=xOf(100);
    pth(g,'M'+l+' 160 L'+l+' 172 L'+r+' 172 L'+r+' 160',{stroke:'#8b9096','stroke-width':2});
    txt(g,(l+r)/2,192,'the answer has to land somewhere in here',{'font-size':15,fill:INK,'text-anchor':'middle','font-weight':700});
    txt(g,(l+r)/2,214,'and every point in here is already a number you can write',{'font-size':13.5,fill:'#8b9096','text-anchor':'middle'});
  })();

  /* ================= the eight sign rows ================= */
  (function(){
    var g=document.getElementById('figSignTable'); if(!g) return;
    var filter='all';
    var rows=[
      {sa:0,sb:0,ss:0,eg:'   0 +    0 =    0'},
      {sa:0,sb:0,ss:1,eg:'   1 +  127 = -128'},
      {sa:0,sb:1,ss:0,eg:'   1 +   -1 =    0'},
      {sa:0,sb:1,ss:1,eg:'   0 + -128 = -128'},
      {sa:1,sb:0,ss:0,eg:'-127 +  127 =    0'},
      {sa:1,sb:0,ss:1,eg:'-128 +    0 = -128'},
      {sa:1,sb:1,ss:0,eg:'-128 + -128 =    0'},
      {sa:1,sb:1,ss:1,eg:'-127 +   -1 = -128'}
    ];
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,60,30,'a\u2019s SIGN',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,150,30,'b\u2019s SIGN',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,250,30,'RESULT\u2019S SIGN',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,380,30,'V',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,450,30,'WHY',{'font-size':10,fill:'#8b9096','letter-spacing':1.4});
      txt(g,880,30,'AN EXAMPLE THAT REACHES IT',{'font-size':10,fill:'#8b9096','letter-spacing':1.4});
      pth(g,'M30 40 L1120 40',{stroke:GREY,'stroke-width':1.5});
      var y=62;
      rows.forEach(function(r){
        var same=(r.sa===r.sb), V=(same && r.ss!==r.sa)?1:0;
        if(filter==='same' && !same) return;
        if(filter==='diff' && same) return;
        var tone = V?'#fdf0ef' : same?'#fbfaf7' : '#e9f2ef';
        var edge = V?'#e0bcb9' : same?'#e2e0d9' : '#b6d5cc';
        el('rect',{x:30,y:y-20,width:1090,height:34,rx:7,fill:tone,stroke:edge,'stroke-width':V?2:1.4},g);
        [[r.sa,60],[r.sb,150],[r.ss,250]].forEach(function(c){
          txt(g,c[1],y+4,c[0]?'\u2212':'+',{'font-size':18,fill:c[0]?RED:GRN,'text-anchor':'middle','font-weight':700});
        });
        txt(g,380,y+4,V,{'font-size':17,fill:V?RED:GRN,'text-anchor':'middle','font-weight':700});
        txt(g,450,y+4, V ? 'same sign in, other sign out'
          : same ? 'same sign in, and the sign survived'
                 : 'signs differ, so it cannot overflow',
          {'font-size':14,fill:V?RED:(same?'#8b9096':GRN),'font-weight':V?700:400});
        txt(g,880,y+4,r.eg,{'font-size':13.5,fill:'#8b9096'});
        y+=42;
      });
      var note = filter==='diff' ? 'four rows, and not one of them can go wrong'
               : filter==='same' ? 'four rows, and exactly half of them do'
               : 'eight rows, two overflows, and every one of the eight really happens in eight bit arithmetic';
      txt(g,30,y+18,note,{'font-size':15,fill:INK,'font-weight':700});
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-fl]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-fl]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot'); filter=b.getAttribute('data-fl'); render();
      };
    });
    render();
  })();

  /* ============ ask the sign column: only wires that exist ============ */
  var whyCtl=null;
  (function(){
    var g=document.getElementById('figWhy'); if(!g) return;
    var step=0;
    var COLS=[60,230,480,650,910];
    var rows=[
      {bits:'0  0', does:'blocks any carry', c8:'always 0',
       when:'a carry arrives',   xr:'c\u2087 \u2295 0  =  c\u2087',      col:GRN,
       why:'two positives, and the magnitude bits spilled into the sign column'},
      {bits:'1  1', does:'makes one itself', c8:'always 1',
       when:'no carry arrives',  xr:'c\u2087 \u2295 1  =  not c\u2087',  col:RED,
       why:'two negatives, and nothing arrived to keep the sign column negative'},
      {bits:'0  1  or  1  0', does:'just passes it on', c8:'the same as c\u2087',
       when:'never',             xr:'c\u2087 \u2295 c\u2087  =  0',      col:BLUE,
       why:'the column only relays, so the two carries cannot possibly differ'}
    ];
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,34,28,'THE SIGN COLUMN IS A FULL ADDER LIKE ANY OTHER',{'font-size':10.5,fill:VIO,'letter-spacing':1.7});
      txt(g,34,50,'so ask what it does to a carry, given only its own two bits',{'font-size':13,fill:'#8b9096'});
      var HD=['ITS OWN TWO BITS','WHAT IT DOES TO A CARRY','SO c\u2088 IS','OVERFLOW WHEN','AND c\u2087 \u2295 c\u2088 IS'];
      HD.forEach(function(h,k){ txt(g,COLS[k],86,h,{'font-size':10,fill:'#8b9096','letter-spacing':1.3}); });
      pth(g,'M34 96 L1106 96',{stroke:GREY,'stroke-width':1.5});
      rows.forEach(function(r,k){
        if(step<k+1) return;
        var y=130+k*60;
        el('rect',{x:34,y:y-24,width:1072,height:48,rx:9,
          fill:'#fbfaf7',stroke:'#e2e0d9','stroke-width':1.4},g);
        txt(g,COLS[0],y+6,r.bits,{'font-size':15,fill:INK,'font-weight':700});
        txt(g,COLS[1],y+6,r.does,{'font-size':13.5,fill:r.col,'font-weight':700});
        txt(g,COLS[2],y+6,r.c8,{'font-size':13.5,fill:'#4b5057'});
        txt(g,COLS[3],y+6,r.when,{'font-size':13.5,fill:'#4b5057'});
        txt(g,COLS[4],y+6,r.xr,{'font-size':14,fill:VIO,'font-weight':700});
      });
      if(step>=1 && step<=3){
        var r=rows[step-1];
        txt(g,34,326,r.why,{'font-size':13.5,fill:r.col});
      }
      if(step>=4){
        el('rect',{x:34,y:312,width:1072,height:76,rx:12,fill:'#efe9f7',stroke:'#c9bde0','stroke-width':2},g);
        txt(g,58,342,'every row ends in c\u2087 \u2295 c\u2088, so that one XOR is the whole test',
          {'font-size':16,fill:VIO,'font-weight':700});
        txt(g,58,368,'and both of those wires already run through the sign column. nothing new is needed.',
          {'font-size':13.5,fill:'#8b9096'});
      }
    }
    document.getElementById('yNext').onclick=function(){ step=(step>=4)?0:step+1; render(); };
    document.getElementById('yAll').onclick=function(){ step=4; render(); };
    document.getElementById('yReset').onclick=function(){ step=0; render(); };
    render(); whyCtl={reset:function(){ step=0; render(); }};
  })();

  /* ================= two ways to build it ================= */
  (function(){
    var g=document.getElementById('figTwoWays'); if(!g) return;
    var CW=64, GAP=8, GX=352, VX=820, VW=52, TRACK=GX+6*CW+5*GAP;
    function row(cy, tag, tagCol, tone, edge, syms, note, gates){
      txt(g,34,cy-48,tag,{'font-size':10.5,fill:tagCol,'letter-spacing':1.7});
      syms.forEach(function(n,k){
        var x=34+k*86;
        el('rect',{x:x,y:cy-20,width:76,height:40,rx:8,fill:'#fff',stroke:edge,'stroke-width':1.8},g);
        txt(g,x+38,cy+7,n,{'font-size':15,fill:INK,'text-anchor':'middle','font-weight':700});
      });
      pth(g,'M300 '+cy+' L'+(GX-14)+' '+cy+' M'+(GX-24)+' '+(cy-6)+' l10 6 l-10 6',
        {stroke:edge,'stroke-width':2.2});
      el('rect',{x:GX-4,y:cy-24,width:TRACK-GX+8,height:48,rx:9,
        fill:'none',stroke:'#dedbd3','stroke-width':1.4,'stroke-dasharray':'5 5'},g);
      gates.forEach(function(n,k){
        var x=GX+k*(CW+GAP);
        el('rect',{x:x,y:cy-20,width:CW,height:40,rx:8,fill:tone,stroke:edge,'stroke-width':2},g);
        txt(g,x+CW/2,cy+6,n,{'font-size':12,fill:tagCol,'text-anchor':'middle','font-weight':700});
      });
      pth(g,'M'+(TRACK+8)+' '+cy+' L'+(VX-14)+' '+cy+' M'+(VX-24)+' '+(cy-6)+' l10 6 l-10 6',
        {stroke:'#c6c3ba','stroke-width':2.2});
      el('rect',{x:VX,y:cy-26,width:VW,height:52,rx:9,fill:'#fbf0dc',stroke:AMB,'stroke-width':2},g);
      txt(g,VX+VW/2,cy+9,'V',{'font-size':24,fill:HI,'text-anchor':'middle','font-weight':700});
      txt(g,34,cy+46,note,{'font-size':12,fill:tagCol});
    }
    txt(g,34,30,'THE SAME FLAG, TWO WAYS TO GET IT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.8});
    row(134,'CHECK THE THREE SIGN BITS',AMB,'#fdf6ea','#e8d3ab',
        ['sa','sb','ss'],
        'the two input signs and the result sign, fetched from three places',
        ['NOT','NOT','NOT','AND','AND','OR']);
    row(268,'ASK THE SIGN COLUMN INSTEAD',GRN,'#e9f2ef','#b6d5cc',
        ['c\u2087','c\u2088'],
        'the two carries either side of bit 7, already crossing that column',
        ['XOR']);
    txt(g,916,126,'6 gates',{'font-size':26,fill:AMB,'font-weight':700});
    txt(g,916,150,'plus the routing',{'font-size':13,fill:'#8b9096'});
    txt(g,916,260,'1 gate',{'font-size':26,fill:GRN,'font-weight':700});
    txt(g,916,284,'no routing at all',{'font-size':13,fill:'#8b9096'});
    el('rect',{x:34,y:330,width:1072,height:56,rx:11,fill:'#efe9f7',stroke:'#c9bde0','stroke-width':2},g);
    txt(g,58,356,'same answer on all 65,536 pairs \u2014 so the machine builds the short row',
      {'font-size':15,fill:VIO,'font-weight':700});
    txt(g,58,376,'the sign rule says what overflow means. the sign column says it for free.',
      {'font-size':12.5,fill:'#8b9096'});
  })();

  /* ================= the four cases ================= */
  (function(){
    var g=document.getElementById('figQuad'); if(!g) return;
    var cases=[{a:7,b:3,C:0,V:0},{a:100,b:100,C:0,V:1},{a:255,b:1,C:1,V:0},{a:128,b:255,C:1,V:1}];
    var CW=380, CH=112, X0=250, Y0=92;
    txt(g,X0+CW/2,58,'THE SIGNED ANSWER IS FINE',{'font-size':11,fill:'#8b9096','text-anchor':'middle','letter-spacing':1.5});
    txt(g,X0+CW+CW/2+24,58,'THE SIGNED ANSWER IS WRONG',{'font-size':11,fill:'#8b9096','text-anchor':'middle','letter-spacing':1.5});
    [[0,'IS FINE'],[1,'WRAPPED']].forEach(function(rr){
      txt(g,X0-24,Y0+rr[0]*(CH+24)+CH/2-4,'THE UNSIGNED',{'font-size':11,'text-anchor':'end','letter-spacing':1.4});
      txt(g,X0-24,Y0+rr[0]*(CH+24)+CH/2+14,'ANSWER '+rr[1],{'font-size':11,'text-anchor':'end','letter-spacing':1.4});
    });
    cases.forEach(function(c,idx){
      var col=idx%2, rw=idx>>1, x=X0+col*(CW+24), y=Y0+rw*(CH+24);
      var s=(c.a+c.b)&255, uOK=!c.C, sOK=!c.V;
      var tone=(uOK&&sOK)?'#e9f2ef':(!uOK&&!sOK)?'#fdf0ef':'#fdf6ea';
      var edge=(uOK&&sOK)?'#b6d5cc':(!uOK&&!sOK)?'#e0bcb9':'#e8d3ab';
      var box=rct(g,x,y,CW,CH,{rx:12,fill:tone,stroke:edge,'stroke-width':2});
      box.style.cursor='pointer';
      box.onclick=(function(cc){ return function(){
        var pb=document.querySelector('[data-p="'+cc.a+','+cc.b+'"]'); if(pb) pb.click();
      }; })(c);
      txt(g,x+20,y+34,c.a+' + '+c.b+'  =  '+s,{'font-size':19,fill:INK,'font-weight':700,'pointer-events':'none'});
      txt(g,x+20,y+62,'as unsigned: '+(uOK?'right':'wrapped'),
        {'font-size':14,fill:uOK?GRN:RED,'font-weight':uOK?400:700,'pointer-events':'none'});
      txt(g,x+20,y+84,'as signed: '+sgn(c.a)+' + '+sgn(c.b)+' = '+sgn(s)+(sOK?'  right':'  overflowed'),
        {'font-size':14,fill:sOK?GRN:RED,'font-weight':sOK?400:700,'pointer-events':'none'});
      txt(g,x+CW-20,y+34,'C='+c.C+'  V='+c.V,{'font-size':14,fill:'#8b9096','text-anchor':'end','pointer-events':'none'});
    });
    txt(g,X0,Y0+2*CH+24+44,'the same adder, the same eight wires. all four of these happen in ordinary arithmetic.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= two flags ================= */
  (function(){
    var g=document.getElementById('figTwoFlags'); if(!g) return;
    function bay(X,tag,title,body,col){
      rct(g,X,34,480,132,{rx:14,fill:'#fbfaf7',stroke:col,'stroke-width':2});
      txt(g,X+26,64,tag,{'font-size':10.5,fill:col,'letter-spacing':1.8});
      txt(g,X+26,98,title,{'font-size':21,fill:INK,'font-weight':700});
      txt(g,X+26,128,body[0],{'font-size':14,fill:'#8b9096'});
      txt(g,X+26,150,body[1],{'font-size':14,fill:'#8b9096'});
    }
    bay(40,'FLAG ONE \u00b7 C','Carry',['the unsigned answer needed','a ninth bit'],AMB);
    bay(600,'FLAG TWO \u00b7 V','Overflow',['the signed answer came out','with the wrong sign'],RED);
    txt(g,40,206,'independent, both worked out every time, and only the program knows which one it cared about.',
      {'font-size':16,fill:INK,'font-weight':700});
  })();

  onSlide=function(idx){
    var t=slides[idx].dataset.t;
    if(adderCtl && t!=='The adder, live') adderCtl.stop();
    if(whyCtl && t!=='Ask the sign column') whyCtl.reset();
  };

  paint();
})();
</script>
