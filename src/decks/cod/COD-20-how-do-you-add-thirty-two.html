<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 20</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 20 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 20 · hour twenty of fifty</div>
    <h1>How do you add<br>thirty two?</h1>
    <p class="big" style="margin-top:20px;max-width:46ch">Chaining the columns is the easy part. What comes off the end of the chain is where nineteen hours of this course have been heading.</p>
  </div>
  <div class="cue">Collect the send off: 255 plus 1 in eight bits, by hand, and what the last carry does.</div>
</section>

<section class="slide" data-t="The plan" data-act="opening">
  <div>
    <h2>One column cost six gates. Now do eight of them.</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:4px">
      <div class="panel" style="padding:18px 20px">
        <div class="tag">QUESTION ONE</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">How do the columns connect?</div>
        <div style="font-size:15px;line-height:1.4">The easiest question in the arc. It takes about a minute.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">QUESTION TWO</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">What if the answer does not fit?</div>
        <div style="font-size:15px;line-height:1.4">A phone that would not boot, first shown to you in hour one, finally explained.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">QUESTION THREE</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">Is 127 + 1 the same failure?</div>
        <div style="font-size:15px;line-height:1.4">It is not, and working out why takes most of the hour.</div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">a note on width</div>
      <ul>
        <li>Everything today is drawn with eight columns so it fits on a slide. Real machines use thirty two or sixty four.</li>
        <li>Nothing about the argument changes with width. Only the numbers at which things break.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the eight versus thirty two thing once, clearly, so nobody thinks eight bits is the real machine.</div>
</section>

<!-- ================= Q1 ================= -->

<section class="slide" data-t="Q1 · the question" data-act="question 1 · chaining">
  <div>
    <div class="tag">QUESTION ONE</div>
    <div class="kicker" style="margin-top:2px">the easy one</div>
    <h2 style="font-size:31px;margin-bottom:4px">How do the columns connect?</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>Each full adder makes a carry out. Each one also needs a carry in. They are the same signal, one column apart.</p>
        <p class="frag">So wire the carry out of each column to the carry in of the column on its left, exactly the way your pencil moves across a page.</p>
        <p class="big frag" style="margin-top:4px">The rightmost column has nothing to its right, so its carry in is tied to zero.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">that is the whole design</div>
        <ul>
          <li>Eight full adders, forty eight gates, one wire between each neighbouring pair.</li>
          <li>It is called a <strong>ripple carry adder</strong>, because the carry ripples along the chain from right to left.</li>
          <li>It is the obvious construction, it is correct, and the next two sessions are about what is wrong with it.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Nobody struggles here. Move briskly; the hour's content is questions two and three.</div>
</section>

<section class="slide" data-t="Q1 · built" data-act="question 1 · chaining">
  <div>
    <div class="tag win">ANSWER</div>
    <div class="kicker" style="margin-top:2px">click any a or b bit &nbsp;·&nbsp; or load a preset</div>
    <h2 style="font-size:26px;margin-bottom:0">Eight full adders in a row.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1200 350" width="1160" height="338"><g id="figAdder"></g></svg></div>
    <div class="readers">
      <div class="reader" id="rdU"><div class="h">READ AS UNSIGNED</div><div class="eq" id="eqU"></div><div class="vd" id="vdU"></div></div>
      <div class="reader" id="rdS"><div class="h">READ AS SIGNED</div><div class="eq" id="eqS"></div><div class="vd" id="vdS"></div></div>
      <div class="lamps">
        <div class="lamp" id="lampC"><div class="dot"></div><div class="t"><b>CARRY OUT</b>the ninth bit</div></div>
        <div class="lamp" id="lampV"><div class="dot"></div><div class="t"><b>OVERFLOW</b>the sign is wrong</div></div>
      </div>
    </div>
    <div class="btnrow">
      <span class="lab">PRESETS</span>
      <button class="btn hot" data-p="7,3">7 + 3</button>
      <button class="btn" data-p="255,1">255 + 1</button>
      <button class="btn" data-p="255,16">255 + 16</button>
      <button class="btn" data-p="127,1">127 + 1</button>
      <button class="btn" data-p="100,100">100 + 100</button>
      <button class="btn" data-p="128,255">128 + 255</button>
      <span style="width:14px"></span>
      <button class="btn" id="ripple">watch the carry travel</button>
    </div>
  </div>
  <div class="cue">Press the ripple button. The carry starts at bit 0 on the right and works left, one column at a time.</div>
</section>

<!-- ================= Q2 ================= -->

<section class="slide" data-t="Q2 · the question" data-act="question 2 · the ninth bit">
  <div>
    <div class="tag">QUESTION TWO</div>
    <div class="kicker" style="margin-top:2px">load the 255 + 1 preset and look at the sum</div>
    <h2 style="font-size:31px;margin-bottom:4px">What happens when the answer does not fit?</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>Two hundred and fifty five is the largest number eight bits can hold. Add one and the correct answer is two hundred and fifty six.</p>
        <p class="frag">The adder returns <span class="num">0</span>. Not an error, not a warning. A confident, wrong, zero.</p>
        <p class="big frag" style="margin-top:4px">And the missing bit is not lost. It is sitting on a wire at the left hand end.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">look at what the circuit actually did</div>
        <ul>
          <li>Every one of the eight columns computed its column correctly. Not a single full adder made a mistake.</li>
          <li>The ninth bit of the answer came out of the last carry out, exactly as it should.</li>
          <li>There were only eight sum wires to put an answer on, so the ninth bit had nowhere to go.</li>
          <li>The hardware did its job perfectly and produced a wrong answer, which is a distinction worth sitting with.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">The hardware is not broken. That is the sentence. Everything after this depends on them believing it.</div>
</section>

<section class="slide" data-t="Q2 · the wallpaper" data-act="question 2 · the ninth bit">
  <div>
    <div class="tag bad">HOUR ONE, FINALLY CLOSED</div>
    <h2 style="font-size:27px;margin-bottom:2px">A phone that would not boot, and a colour value of 271.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figWall"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Two hundred and seventy one needs nine bits. The container held eight, so the top bit went where the carry out goes.</li>
        <li>What came back was <span class="num">15</span>: a colour meant to sit near the top of its range arriving near the bottom.</li>
        <li>Go back one slide, load the <span class="num">255 + 16</span> preset, and watch the adder produce exactly that with the carry lamp lit.</li>
        <li>The wire carrying the truth was right there. Nothing downstream was looking at it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Actually go back and run it. Seeing 15 come out of a circuit they built is the payoff for nineteen hours.</div>
</section>

<section class="slide" data-t="Q2 · answered" data-act="question 2 · the ninth bit">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">It goes onto a wire called the carry flag, and somebody has to read it.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 220" width="1060" height="208"><g id="figFlag"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>A fixed width adder cannot report a result that needs more width. It can only report <em>that</em> it happened.</li>
        <li>The carry out becomes a one bit output of the machine alongside the answer, and it is called the <strong>carry flag</strong>.</li>
        <li>Hardware raising a flag and software ignoring it is the single most common shape of arithmetic bug there is.</li>
        <li>In C, unsigned overflow is defined to wrap quietly. The flag exists; the language simply does not make you look.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The flag is not a fix. It is a notification, and notifications can be ignored.</div>
</section>

<!-- ================= Q3 ================= -->

<section class="slide" data-t="Q3 · the question" data-act="question 3 · two failures">
  <div>
    <div class="tag">QUESTION THREE</div>
    <div class="kicker" style="margin-top:2px">load 127 + 1 and look at the carry lamp</div>
    <h2 style="font-size:31px;margin-bottom:4px">Is 127 + 1 the same failure?</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>In two's complement, 127 is the largest positive number eight bits can hold. Adding one should be an overflow.</p>
        <p class="frag">The adder returns <span class="num">10000000</span>, which a signed reader calls <span class="num">-128</span>. Wrong by two hundred and fifty six.</p>
        <p class="big frag" style="margin-top:4px">And the carry flag is <em>off</em>.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">so the flag you just built does not catch this</div>
        <ul>
          <li>Nothing came off the left hand end. As unsigned this is 127 + 1 = 128, which fits perfectly.</li>
          <li>An unsigned reader is entirely satisfied with that answer. A signed reader has been lied to.</li>
          <li>Same eight wires, same circuit, same instant. The disagreement is not in the hardware.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Have them predict the carry lamp before you show it. Almost everybody guesses it lights.</div>
</section>

<section class="slide" data-t="Q3 · two cuts" data-act="question 3 · two failures">
  <div>
    <div class="kicker">back to the circle you drew in class five</div>
    <h2 style="font-size:27px;margin-bottom:2px">The two readers cut the same circle in different places.</h2>
    <div class="row" style="align-items:center;gap:24px">
      <div><svg viewBox="0 0 760 410" width="620" height="334"><g id="figCircle"></g></svg></div>
      <div style="max-width:32ch">
        <p style="font-size:18px">Two hundred and fifty six patterns in a ring, and counting up walks you round it. That has been true since Class 5.</p>
        <p class="frag" style="font-size:18px;margin-top:8px">An <strong>unsigned</strong> reader calls one point the end: past 255 there is nowhere to go.</p>
        <p class="frag" style="font-size:18px;margin-top:8px">A <strong>signed</strong> reader picks a different point: past 127 the numbers turn negative.</p>
        <div class="rem frag" style="margin-top:10px">
          <div class="h">so there are two ends</div>
          <ul>
            <li>Same ring, same adder, two places where the answer stops making sense.</li>
            <li>They sit on opposite sides, so stepping over one says nothing about the other.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Draw the ring and mark both cuts on the board before showing this. Two ends is the idea of the hour.</div>
</section>

<section class="slide" data-t="Q3 · different signs are safe" data-act="question 3 · two failures">
  <div>
    <div class="kicker">before hunting for a detector, rule out most of the cases</div>
    <h2 style="font-size:27px;margin-bottom:2px">Adding a positive to a negative can never overflow.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 250" width="1080" height="237"><g id="figSafe"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">why, in one line</div>
      <ul>
        <li>If one input is positive and the other negative, the true sum lies strictly <em>between</em> them.</li>
        <li>Both inputs are representable, and the representable numbers form one unbroken run from -128 to 127.</li>
        <li>So anything between two representable numbers is representable too. There is nothing to overflow into.</li>
        <li>This is not special to two's complement. It is true of adding inside any contiguous range.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Half the eight sign combinations are eliminated by this argument alone. Say that; it makes the next slide short.</div>
</section>

<section class="slide" data-t="Q3 · three sign bits" data-act="question 3 · two failures">
  <div>
    <div class="kicker">so overflow is decided by three bits: the two input signs and the result sign</div>
    <h2 style="font-size:27px;margin-bottom:2px">Eight combinations. Only two of them are overflow.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 430" width="1040" height="392"><g id="figSignTable"></g></svg></div>
    <div class="btnrow">
      <span class="lab">SHOW</span>
      <button class="btn hot" data-fl="all">all eight</button>
      <button class="btn" data-fl="same">inputs share a sign</button>
      <button class="btn" data-fl="diff">inputs differ</button>
    </div>
  </div>
  <div class="cue">Filter to "inputs differ" first. Four rows, all safe. Then "share a sign", and the two failures are obvious.</div>
</section>

<section class="slide" data-t="Q3 · the rule" data-act="question 3 · two failures">
  <div>
    <h2>So: matching input signs is the precondition, not the verdict.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>If the two top bits differ, stop. There is no overflow and there cannot be, whatever the result looks like.</p>
        <p class="frag">If they match, then look at the result's top bit. Matching means the sign survived. Differing means it was pushed over the break.</p>
        <p class="big frag" style="margin-top:4px">Overflow is when two numbers of the same sign produce the other sign.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">stated as a formula</div>
        <ul>
          <li><span class="num">V = (sa equals sb) AND (ss differs from sa)</span></li>
          <li>All three bits are needed. Two of them are not enough, because the same pair of input signs gives V = 0 or V = 1 depending on the result.</li>
          <li>Every one of the eight combinations occurs in real eight bit arithmetic. None of them is a theoretical curiosity.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Precondition, not verdict. That phrasing stops the usual mistake of thinking matching signs alone means overflow.</div>
</section>

<section class="slide" data-t="Q3 · four cases" data-act="question 3 · two failures">
  <div>
    <div class="kicker">click any cell to load that case into the adder</div>
    <h2 style="font-size:27px;margin-bottom:2px">Two independent things can go wrong, so there are four cases, and all four happen.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1080 400" width="1000" height="370"><g id="figQuad"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The bits coming out of the adder are identical in all four cases. Only the question being asked of them differs.</li>
        <li>Which means the circuit cannot possibly decide for you. It does not know whether you meant signed or unsigned.</li>
        <li>So it computes <strong>both</strong> verdicts, raises <strong>both</strong> flags, and lets the program decide which one it cares about.</li>
      </ul>
    </div>
  </div>
  <div class="cue">All four quadrants are filled by real eight bit examples. That is worth saying; it is not a theoretical taxonomy.</div>
</section>

<section class="slide" data-t="Q3 · two ways to build it" data-act="question 3 · two failures">
  <div>
    <div class="kicker">the rule needs three sign bits · the hardware uses two wires it already has</div>
    <h2 style="font-size:27px;margin-bottom:2px">Same flag, two ways to compute it, and one is five gates cheaper.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 330" width="1080" height="313"><g id="figTwoWays"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The sign rule needs the two input top bits and the result top bit routed to a block of their own, and it does not minimise: it is another checkerboard.</li>
        <li>The carries either side of the sign column are already inside bit 7. Taking them costs no routing at all.</li>
        <li>If a carry arrives at the sign column but none leaves, the sign was pushed over. If one leaves but none arrived, pushed the other way. Either mismatch is overflow.</li>
        <li>The two agree on every one of the 65,536 input pairs. <strong>They are the same flag, computed differently.</strong></li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the useful engineering lesson: the cheapest circuit is often the one whose signals already exist.</div>
</section>

<section class="slide" data-t="Q3 · answered" data-act="question 3 · two failures">

    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1120 230" width="1060" height="218"><g id="figTwoFlags"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li><strong>Carry</strong> means the unsigned answer needed a ninth bit. <strong>Overflow</strong> means the signed answer came out with the wrong sign.</li>
        <li>They are independent, and you have seen all four combinations of them in eight bit arithmetic.</li>
        <li>This is Class 5 arriving in copper: the bits never carried a meaning, so the hardware computes for both meanings at once.</li>
        <li>Every processor you will ever meet has both flags. Now you know why there are two.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Class 5 said the machine does not know what its bits mean. This is what that costs in silicon: two flags instead of one.</div>
</section>

  /* ================= Q3 · one ring, two cuts ================= */

  })();

  /* ================= Q3 · different signs are safe ================= */
  (function(){
    var g=document.getElementById('figSafe'); if(!g) return;
    var X0=110, W=920, Y=96;
    function xOf(v){ return X0+(v+128)/255*W; }
    /* the representable band */
    el('rect',{x:X0,y:Y-22,width:W,height:44,rx:10,fill:'#e9f2ef',stroke:'#b6d5cc','stroke-width':2},g);
    txt(g,X0,Y+44,'-128',{'font-size':13,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,X0+W,Y+44,'127',{'font-size':13,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,X0+W/2,Y+44,'0',{'font-size':13,fill:'#8b9096','text-anchor':'middle'});
    el('line',{x1:X0+W/2,y1:Y-22,x2:X0+W/2,y2:Y+22,stroke:'#b6d5cc','stroke-width':1.6},g);
    txt(g,X0,26,'EVERY REPRESENTABLE NUMBER, IN ONE UNBROKEN RUN',{'font-size':10.5,fill:GRN,'letter-spacing':1.8});
    /* the two inputs and the sum */
    function mark(v,lab,col,dy){
      var x=xOf(v);
      el('line',{x1:x,y1:Y-30,x2:x,y2:Y+30,stroke:col,'stroke-width':3},g);
      el('circle',{cx:x,cy:Y,r:8,fill:'#fff',stroke:col,'stroke-width':3},g);
      txt(g,x,Y+dy,lab,{'font-size':14,fill:col,'text-anchor':'middle','font-weight':700});
    }
    mark(-40,'b = -40',RED,-42);
    mark(100,'a = 100',BLUE,-42);
    mark(60,'a + b = 60',INK,72);
    /* the bracket */
    var l=xOf(-40), r=xOf(100);
    pth(g,'M'+l+' 160 L'+l+' 172 L'+r+' 172 L'+r+' 160',{stroke:'#8b9096','stroke-width':2});
    txt(g,(l+r)/2,192,'the sum has to land somewhere in here',{'font-size':15,fill:INK,'text-anchor':'middle','font-weight':700});
    txt(g,(l+r)/2,214,'and every point in here is already representable',{'font-size':13.5,fill:'#8b9096','text-anchor':'middle'});
  })();

  /* ================= Q3 · the eight sign combinations ================= */
  (function(){
    var g=document.getElementById('figSignTable'); if(!g) return;
    var filter='all';
    var rows=[
      {sa:0,sb:0,ss:0,eg:'   0 +    0 =    0'},
      {sa:0,sb:0,ss:1,eg:'   1 +  127 = -128'},
      {sa:0,sb:1,ss:0,eg:'   1 +   -1 =    0'},
      {sa:0,sb:1,ss:1,eg:'   0 + -128 = -128'},
      {sa:1,sb:0,ss:0,eg:'-127 +  127 =    0'},
      {sa:1,sb:0,ss:1,eg:'-128 +    0 = -128'},
      {sa:1,sb:1,ss:0,eg:'-128 + -128 =    0'},
      {sa:1,sb:1,ss:1,eg:'-127 +   -1 = -128'}
    ];
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,60,30,'a\u2019s TOP BIT',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,150,30,'b\u2019s TOP BIT',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,250,30,'RESULT\u2019S TOP BIT',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,380,30,'V',{'font-size':10,fill:'#8b9096','letter-spacing':1.4,'text-anchor':'middle'});
      txt(g,450,30,'WHY',{'font-size':10,fill:'#8b9096','letter-spacing':1.4});
      txt(g,880,30,'AN EXAMPLE THAT REACHES IT',{'font-size':10,fill:'#8b9096','letter-spacing':1.4});
      pth(g,'M30 40 L1120 40',{stroke:GREY,'stroke-width':1.5});
      var y=62, shown=0;
      rows.forEach(function(r){
        var same=(r.sa===r.sb), V=(same && r.ss!==r.sa)?1:0;
        if(filter==='same' && !same) return;
        if(filter==='diff' && same) return;
        shown++;
        var tone = V?'#fdf0ef' : same?'#fbfaf7' : '#e9f2ef';
        var edge = V?'#e0bcb9' : same?'#e2e0d9' : '#b6d5cc';
        el('rect',{x:30,y:y-20,width:1090,height:34,rx:7,fill:tone,stroke:edge,'stroke-width':V?2:1.4},g);
        [[r.sa,60],[r.sb,150],[r.ss,250]].forEach(function(c){
          txt(g,c[1],y+4,c[0],{'font-size':17,fill:'#4b5057','text-anchor':'middle','font-weight':700});
        });
        txt(g,380,y+4,V,{'font-size':17,fill:V?RED:GRN,'text-anchor':'middle','font-weight':700});
        txt(g,450,y+4, V ? 'same sign in, other sign out'
          : same ? 'same sign in, sign survived'
                 : 'signs differ, so it cannot overflow',
          {'font-size':14,fill:V?RED:(same?'#8b9096':GRN),'font-weight':V?700:400});
        txt(g,880,y+4,r.eg,{'font-size':13.5,fill:'#8b9096'});
        y+=42;
      });
      var note = filter==='diff' ? 'four rows, and not one of them can overflow'
               : filter==='same' ? 'four rows, and exactly half of them do'
               : 'eight rows, two overflows, and every one of the eight occurs in real eight bit arithmetic';
      txt(g,30,y+18,note,{'font-size':15,fill:INK,'font-weight':700});
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-fl]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-fl]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot'); filter=b.getAttribute('data-fl'); render();
      };
    });
    render();
  })();

  /* ================= Q3 · the four cases ================= */
  (function(){
    var g=document.getElementById('figQuad'); if(!g) return;
    var cases=[{a:7,b:3,C:0,V:0},{a:100,b:100,C:0,V:1},{a:255,b:1,C:1,V:0},{a:128,b:255,C:1,V:1}];
    var CW=380, CH=112, X0=250, Y0=92;
    txt(g,X0+CW/2,58,'OVERFLOW  V = 0',{'font-size':11,fill:'#8b9096','text-anchor':'middle','letter-spacing':1.5});
    txt(g,X0+CW+CW/2+24,58,'OVERFLOW  V = 1',{'font-size':11,fill:'#8b9096','text-anchor':'middle','letter-spacing':1.5});
    [[0,'C = 0'],[1,'C = 1']].forEach(function(rr){
      txt(g,X0-24,Y0+rr[0]*(CH+24)+CH/2,'CARRY',{'font-size':11,'text-anchor':'end','letter-spacing':1.5});
      txt(g,X0-24,Y0+rr[0]*(CH+24)+CH/2+18,rr[1],{'font-size':11,'text-anchor':'end','letter-spacing':1.5});
    });
    cases.forEach(function(c,idx){
      var col=idx%2, rw=idx>>1, x=X0+col*(CW+24), y=Y0+rw*(CH+24);
      var s=(c.a+c.b)&255, uOK=!c.C, sOK=!c.V;
      var tone=(uOK&&sOK)?'#e9f2ef':(!uOK&&!sOK)?'#fdf0ef':'#fdf6ea';
      var edge=(uOK&&sOK)?'#b6d5cc':(!uOK&&!sOK)?'#e0bcb9':'#e8d3ab';
      var box=rct(g,x,y,CW,CH,{rx:12,fill:tone,stroke:edge,'stroke-width':2});
      box.style.cursor='pointer';
      box.onclick=(function(cc){ return function(){
        var pb=document.querySelector('[data-p="'+cc.a+','+cc.b+'"]'); if(pb) pb.click();
      }; })(c);
      txt(g,x+20,y+34,c.a+' + '+c.b+'  =  '+s,{'font-size':19,fill:INK,'font-weight':700,'pointer-events':'none'});
      txt(g,x+20,y+62,'unsigned: '+(uOK?'correct':'wrapped'),
        {'font-size':14,fill:uOK?GRN:RED,'font-weight':uOK?400:700,'pointer-events':'none'});
      txt(g,x+20,y+84,'signed: '+sgn(c.a)+' + '+sgn(c.b)+' = '+sgn(s)+(sOK?'  correct':'  overflowed'),
        {'font-size':14,fill:sOK?GRN:RED,'font-weight':sOK?400:700,'pointer-events':'none'});
      txt(g,x+CW-20,y+34,'C='+c.C+'  V='+c.V,{'font-size':14,fill:'#8b9096','text-anchor':'end','pointer-events':'none'});
    });
    txt(g,X0,Y0+2*CH+24+44,'the same adder, the same wires. all four combinations occur in eight bits.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= Q3 · two ways to build the flag ================= */
  (function(){
    var g=document.getElementById('figTwoWays'); if(!g) return;
    /* the sign-bit way */
    el('rect',{x:34,y:34,width:520,height:250,rx:14,fill:'#fdf6ea',stroke:'#e8d3ab','stroke-width':2},g);
    txt(g,58,64,'FROM THE THREE SIGN BITS',{'font-size':10.5,fill:AMB,'letter-spacing':1.8});
    ['a\u2019s top bit','b\u2019s top bit','result\u2019s top bit'].forEach(function(n,k){
      var y=100+k*46;
      rct(g,58,y-17,150,34,{fill:'#fff',stroke:'#e8d3ab','stroke-width':1.6});
      txt(g,133,y+5,n,{'font-size':12,fill:'#8b9096','text-anchor':'middle'});
      pth(g,'M208 '+y+' L268 '+y,{stroke:'#e8d3ab','stroke-width':2});
    });
    rct(g,268,110,150,110,{rx:11,fill:'#fff',stroke:AMB,'stroke-width':2});
    txt(g,343,150,'2 AND',{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
    txt(g,343,172,'1 OR',{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
    txt(g,343,194,'3 NOT',{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
    pth(g,'M418 165 L466 165',{stroke:'#e8d3ab','stroke-width':2});
    rct(g,466,141,54,48,{fill:'#fbf0dc',stroke:AMB});
    txt(g,493,173,'V',{'font-size':22,fill:HI,'text-anchor':'middle','font-weight':700});
    txt(g,58,252,'6 gates, plus routing three bits out of the adder',{'font-size':14,fill:AMB,'font-weight':700});
    txt(g,58,272,'and it does not minimise: another checkerboard',{'font-size':12.5,fill:'#8b9096'});
    /* the carry way */
    el('rect',{x:586,y:34,width:520,height:250,rx:14,fill:'#e9f2ef',stroke:'#b6d5cc','stroke-width':2},g);
    txt(g,610,64,'FROM THE TWO CARRIES AROUND BIT 7',{'font-size':10.5,fill:GRN,'letter-spacing':1.8});
    ['carry into bit 7','carry out of bit 7'].forEach(function(n,k){
      var y=118+k*46;
      rct(g,610,y-17,170,34,{fill:'#fff',stroke:'#b6d5cc','stroke-width':1.6});
      txt(g,695,y+5,n,{'font-size':12,fill:'#8b9096','text-anchor':'middle'});
      pth(g,'M780 '+y+' L826 '+y,{stroke:'#b6d5cc','stroke-width':2});
    });
    gOr(g,830,141,24,1,true);
    txt(g,862,104,'XOR',{'font-size':11.5,fill:AMB,'text-anchor':'middle'});
    pth(g,'M'+orTip(830,24)+' 141 L940 141',{stroke:'#b6d5cc','stroke-width':2});
    rct(g,940,117,54,48,{fill:'#fbf0dc',stroke:AMB});
    txt(g,967,149,'V',{'font-size':22,fill:HI,'text-anchor':'middle','font-weight':700});
    txt(g,610,206,'both wires already exist inside bit 7',{'font-size':13,fill:GRN});
    txt(g,610,252,'1 gate, and no extra routing at all',{'font-size':14,fill:GRN,'font-weight':700});
    txt(g,610,272,'five gates cheaper, and identical on all 65,536 pairs',{'font-size':12.5,fill:'#8b9096'});
    txt(g,34,314,'the cheapest circuit is usually the one whose signals you already have',
      {'font-size':16,fill:INK,'font-weight':700});
  })();

  /* ================= Q3 · two flags ================= */
  (function(){
    var g=document.getElementById('figTwoFlags'); if(!g) return;
    function bay(X,tag,title,body,col){
      rct(g,X,34,480,132,{rx:14,fill:'#fbfaf7',stroke:col,'stroke-width':2});
      txt(g,X+26,64,tag,{'font-size':10.5,fill:col,'letter-spacing':1.8});
      txt(g,X+26,98,title,{'font-size':21,fill:INK,'font-weight':700});
      txt(g,X+26,128,body[0],{'font-size':14,fill:'#8b9096'});
      txt(g,X+26,150,body[1],{'font-size':14,fill:'#8b9096'});
    }
    bay(40,'FLAG ONE \u00b7 C','Carry',['the unsigned answer needed','a ninth bit'],AMB);
    bay(600,'FLAG TWO \u00b7 V','Overflow',['the signed answer came out','with the wrong sign'],RED);
    txt(g,40,206,'independent, both computed every time, and only the program knows which one it meant',
      {'font-size':16,fill:INK,'font-weight':700});
  })();

  paint();
})();
</script>
