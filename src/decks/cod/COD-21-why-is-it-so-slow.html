<html lang="en">

<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --hi:#e8952b; --lo:#b9bfc6; --violet:#6b3fa0;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:46px 68px 78px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:19px;left:68px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:19px;right:68px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:68px;right:68px;bottom:21px;display:flex;gap:1.5px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:68px;bottom:42px;font-family:var(--mono);font-size:12px;color:var(--soft);z-index:5}
#help{position:absolute;left:68px;bottom:42px;font-family:var(--mono);font-size:11px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:5px}
p{font-size:19.5px;line-height:1.44;max-width:36ch}
p+p{margin-top:8px}
.big{font-size:23px;line-height:1.3;color:var(--ink);font-weight:300;max-width:30ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.stack>*+*{margin-top:8px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:18px;align-items:flex-start;justify-content:center}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:8px 13px;margin-top:8px}
.rem .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.rem.win{border-left-color:var(--ok)} .rem.win .h{color:var(--ok)}
.rem.bad{border-left-color:var(--fail)} .rem.bad .h{color:var(--fail)}
.rem ul{list-style:none}
.rem li{font-size:15px;line-height:1.33;color:var(--ink);padding:3px 0 3px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}

.btn{font-family:var(--mono);font-size:12.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 11px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;justify-content:center}
.btnrow .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft);margin-right:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:7px}
.tag.win{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--fail-soft);color:var(--fail)}

.spec{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--rule2);border-radius:11px;overflow:hidden}
.spec .c{flex:1;padding:13px 16px;border-right:1px solid var(--rule)}
.spec .c:last-child{border-right:none}
.spec .c .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--soft)}
.spec .c .v{font-family:var(--display);font-size:30px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:3px}
.spec .c .s{font-size:13px;color:var(--soft);margin-top:2px}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
.cue{position:absolute;left:68px;right:68px;bottom:64px;display:none;padding:8px 12px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.32;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:38px 68px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 21</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 21 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 21 · hour twenty one of fifty</div>
    <h1>Why is it<br>so slow?</h1>
    <p class="big" style="margin-top:20px;max-width:46ch">Your adder is correct on every input. Today you measure it with your own tools, and find it cannot be clocked.</p>
  </div>
  <div class="cue">Collect the send off. Longest path from any input to any output, in gates. Take three or four answers before starting.</div>
</section>

<section class="slide" data-t="The plan" data-act="opening">
  <div>
    <h2>Class 18 gave you a way to measure a circuit. Point it at your own.</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:4px">
      <div class="panel" style="padding:18px 20px">
        <div class="tag">QUESTION ONE</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">How deep is the adder?</div>
        <div style="font-size:15px;line-height:1.4">Follow one carry the whole way and count. The number is worse than most people guess.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">QUESTION TWO</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">Does every addition take that long?</div>
        <div style="font-size:15px;line-height:1.4">Emphatically not. And it does not help you at all, which is the interesting part.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">QUESTION THREE</div>
        <div style="font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink);margin:2px 0 8px">Have you seen this shape before?</div>
        <div style="font-size:15px;line-height:1.4">You have, three sessions ago, and you were told then why it is the worst shape there is.</div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">this hour builds nothing</div>
      <ul>
        <li>No new circuit today. The whole hour is measurement, and then understanding what the measurement means.</li>
        <li>That is not a gap in the course. Knowing precisely why something is too slow is what tells you which fix will work.</li>
        <li>The fix arrives next session, and it will not look like anything you have done so far.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the no-new-circuit thing up front. Otherwise they spend the hour waiting for a build that is not coming.</div>
</section>

<!-- ================= Q1 ================= -->

<section class="slide" data-t="Q1 · one column" data-act="question 1 · depth">
  <div>
    <div class="tag">QUESTION ONE</div>
    <div class="kicker" style="margin-top:2px">start with a single column, and time only the carry</div>
    <h2 style="font-size:31px;margin-bottom:4px">How deep is the adder?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figOne"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The carry out has to cross an AND gate and then the OR gate. <strong>Two gate delays, every column.</strong></li>
        <li>The sum path is not the problem. It is one XOR after the carry arrives, and it is never on the critical path.</li>
        <li>What matters is that the AND gates feeding the OR cannot start until the carry in has arrived.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Two per column is the number to hold. Everything in this hour is that number times the width.</div>
</section>

<section class="slide" data-t="Q1 · the gates" data-act="question 1 · depth">
  <div>
    <div class="kicker">strip away the sum logic and look at what the carry actually crosses</div>
    <h2 style="font-size:27px;margin-bottom:2px">Four columns, and it is a literal chain of gates.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figGates"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every column contributes an AND and an OR to the same path. There is no shortcut around either of them.</li>
        <li>The AND in column 3 cannot begin until the OR in column 2 has settled, which waited on column 1, and so on down.</li>
        <li>Thirty two columns means sixty four gates in a single unbroken line from bit 0 to the carry flag.</li>
        <li>This is not a diagram of a circuit that <em>happens</em> to be slow. It is a picture of one long dependency.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Trace it with a finger, gate by gate, saying the delay count aloud. It takes twenty seconds and it lands.</div>
</section>

<section class="slide" data-t="Q1 · the path" data-act="question 1 · depth">
  <div>
    <div class="kicker">press run &nbsp;·&nbsp; eight columns, and the carry has to cross all of them</div>
    <h2 style="font-size:27px;margin-bottom:0">Now chain them, and watch the clock.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1180 340" width="1120" height="325"><g id="figPath"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="pRun">run &#9654;</button>
      <button class="btn" id="pStep">step</button>
      <button class="btn" id="pReset">reset</button>
    </div>
  </div>
  <div class="cue">Stop it at t=8 and ask how far along we are. Half the delays are gone and half the columns have not started.</div>
</section>

<section class="slide" data-t="Q1 · how wide can it be" data-act="question 1 · depth">
  <div>
    <div class="kicker">turn the question round: how wide could a ripple adder be and still be clockable?</div>
    <h2 style="font-size:27px;margin-bottom:2px">Seven bits. That is the answer, and it is not a joke.</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 780 350" width="740" height="332"><g id="figWidth"></g></svg></div>
      <div style="max-width:31ch">
        <div class="rem" style="margin-top:0">
          <div class="h">read the chart</div>
          <ul>
            <li>Delay grows in a straight line with width: two gates per column, no exceptions.</li>
            <li>One cycle at 3 GHz buys you sixteen gate delays. That runs out at seven bits.</li>
            <li>A four bit ripple adder is a perfectly reasonable component. Nobody needs a four bit machine.</li>
            <li>At the widths that matter, the line is not close to the deadline. It is four times over it, and then eight.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Seven bits is the number that shocks people. Say it before showing the chart and let them disbelieve it.</div>
</section>

<section class="slide" data-t="Q1 · answered" data-act="question 1 · depth">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">Sixty five gate delays, which is almost four clock cycles.</h2>
    <div class="spec" style="margin-top:4px">
      <div class="c"><div class="l">SUM BITS READY</div><div class="v">63</div><div class="s">gate delays</div></div>
      <div class="c"><div class="l">CARRY FLAG READY</div><div class="v">64</div><div class="s">one more OR</div></div>
      <div class="c"><div class="l">OVERFLOW FLAG READY</div><div class="v" style="color:var(--fail)">65</div><div class="s">one more XOR</div></div>
      <div class="c"><div class="l">AT 20 ps A GATE</div><div class="v" style="color:var(--fail)">1300 ps</div><div class="s">3.9 cycles at 3 GHz</div></div>
    </div>
    <div class="rem bad" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>Two gate delays per column, thirty two columns, and the last column cannot start until the first thirty one have finished.</li>
        <li>A processor that has to spend four cycles on <code>a + b</code> is not a processor anybody would ship.</li>
        <li>At sixty four bits it is worse: <span class="num">129</span> gate delays, <span class="num">2580 ps</span>, nearly eight cycles.</li>
        <li>And notice the flags come out <em>after</em> the sum. The slowest thing in the machine is the news that something went wrong.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Four cycles for an add. Let that sit. Every instruction in every program depends on this being fast.</div>
</section>

<!-- ================= Q2 ================= -->

<section class="slide" data-t="Q2 · the question" data-act="question 2 · typical vs worst">
  <div>
    <div class="tag">QUESTION TWO</div>
    <div class="kicker" style="margin-top:2px">press randomise a few times and watch the chain</div>
    <h2 style="font-size:31px;margin-bottom:2px">Does every addition actually take that long?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1100" height="312"><g id="figChain"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="cRand">randomise</button>
      <button class="btn" id="cWorst">the worst case</button>
      <button class="btn" id="cBest">a quiet one</button>
    </div>
  </div>
  <div class="cue">Randomise ten times. The chain is almost never long, and somebody will start to think that helps.</div>
</section>

<section class="slide" data-t="Q2 · the distribution" data-act="question 2 · typical vs worst">
  <div>
    <div class="kicker">thirty two bit additions with random inputs &nbsp;·&nbsp; press run and let it gather</div>
    <h2 style="font-size:27px;margin-bottom:2px">How far the carry travels, over many additions.</h2>
    <div class="row" style="align-items:flex-start">
      <div><svg viewBox="0 0 900 350" width="800" height="311"><g id="figHist"></g></svg></div>
      <div style="max-width:29ch">
        <div class="rem" style="margin-top:0">
          <div class="h">what to look for</div>
          <ul>
            <li>The typical longest chain is about three positions out of thirty one.</li>
            <li>Long chains are not merely rare, they are exponentially rare. Each extra position roughly halves the odds.</li>
            <li>The green region is every addition that would already be finished inside one clock cycle.</li>
            <li>Watch the record climb, then stall. Half a million additions never reached past twenty.</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="spec" style="margin-top:8px">
      <div class="c"><div class="l">ADDITIONS</div><div class="v" id="hTotal">0</div><div class="s">random inputs</div></div>
      <div class="c"><div class="l">AVERAGE CHAIN</div><div class="v" id="hMean">0.0</div><div class="s">out of a possible 31</div></div>
      <div class="c"><div class="l">LONGEST SEEN</div><div class="v" id="hRec" style="color:var(--amber)">0</div><div class="s">the record so far</div></div>
      <div class="c"><div class="l">WOULD FIT ONE CYCLE</div><div class="v" id="hFit" style="color:var(--ok)">0%</div><div class="s">and must wait anyway</div></div>
    </div>
    <div class="btnrow">
      <button class="btn hot" id="hRun">run &#9654;</button>
      <button class="btn" id="hOne">add one</button>
      <button class="btn" id="hClear">clear</button>
    </div>
  </div>
  <div class="cue">Let it run to fifty thousand or so. The bars settle into shape almost at once, and the record creeps then stops.</div>
</section>

<section class="slide" data-t="Q2 · the waste" data-act="question 2 · typical vs worst">
  <div>
    <div class="kicker">three numbers, one axis &nbsp;·&nbsp; press next to build it up</div>
    <h2 style="font-size:27px;margin-bottom:0">What an addition needs, and what it is given.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 400" width="1090" height="382"><g id="figWaste"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="wNext">next &#9654;</button>
      <button class="btn" id="wAuto">play all</button>
      <button class="btn" id="wReset">reset</button>
    </div>
  </div>
  <div class="cue">Step it. The third bar is the moment: it is four times the cycle, and the first bar never needed any of it.</div>
</section>

<section class="slide" data-t="Q2 · answered" data-act="question 2 · typical vs worst">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">No, and it does not help. The clock is set by the worst case, not the usual one.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 230" width="1080" height="218"><g id="figWorst"></g></svg></div>
    <div class="rem bad" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>A combinational circuit has no way to announce that it finished early. From Class 18: it settles, and nothing tells you when.</li>
        <li>So the clock period has to cover the longest path that <em>could</em> happen, on the one input in millions that causes it.</li>
        <li><span class="num">0xFFFFFFFF + 1</span> is that input, and it is not exotic. It is a counter rolling over, which real programs do constantly.</li>
        <li>Designing for the worst case is not pessimism. It is the only correct thing to do when you cannot detect the good case.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Tie it back to wall two of Class 18. No clock inside means no way to say done early.</div>
</section>

<!-- ================= Q3 ================= -->

<section class="slide" data-t="Q3 · the question" data-act="question 3 · the shape">
  <div>
    <div class="tag">QUESTION THREE</div>
    <h2 style="font-size:31px;margin-bottom:4px">Have you seen this shape before?</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figShape"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>In Class 18 you raced two circuits with identical gate counts. The chain took seven delays and the tree took three.</li>
        <li>The ripple adder is exactly that chain, with two gates per link instead of one and thirty two links instead of seven.</li>
        <li>You were told then that a chain is the slowest shape there is. Here it is, in the most important circuit in the machine.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Go back to Class 18's race if you can. Seeing the same picture with different labels is the moment.</div>
</section>

<section class="slide" data-t="Q3 · so use a tree" data-act="question 3 · the shape">
  <div>
    <h2>So flatten it into a tree, and be done by lunchtime.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Class 18's fix was to pair things up and pair the pairs. Depth drops from n to the logarithm of n, at no extra gate cost.</p>
        <p class="frag">That worked because the eight alarm signals were <em>all available at once</em>. Any two of them could be combined immediately.</p>
        <p class="big frag" style="margin-top:4px">The carries are not like that. Carry into column 5 does not exist until columns 0 to 4 have finished.</p>
      </div>
      <div class="rem bad frag" style="margin-top:0">
        <div class="h">why the obvious fix does not apply</div>
        <ul>
          <li>You cannot pair up two things when one of them is defined in terms of the other.</li>
          <li>The chain is not a design choice here. It is the shape of the dependency, and rearranging gates does not change a dependency.</li>
          <li>To flatten it you would have to compute a carry <em>without waiting for the one before it</em>, and that sounds impossible.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Leave it sounding impossible. Genuinely. The next session is much better if they believe there is no way out.</div>
</section>

    <h2 style="font-size:27px;margin-bottom:2px">Class 18 had eight facts. This has one fact, thirty two times over.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 330" width="1080" height="313"><g id="figDeps"></g></svg></div>

      <ul>
        <li>On the left, every input is available at the same instant, so any two can be combined immediately and the tree costs nothing.</li>
        <li>On the right, each carry is <em>defined in terms of</em> the one before it. There is no pair you are allowed to combine first.</li>
        <li>Rearranging gates cannot change that, because the chain is not in the gates. It is in the definition of a carry.</li>
        <li>To flatten it you would have to break the definition, which is the only thing left to try.</li>

    </div>

  <div>

    <div class="kicker" style="margin-top:2px">three names for what a column does to a carry</div>
    <h2 style="font-size:29px;margin-bottom:2px">Yes. And the way out starts with noticing what each column decides on its own.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figGPK"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li>Whether a column <em>generates</em>, <em>propagates</em> or <em>kills</em> a carry depends only on that column's own two input bits.</li>
        <li>Which means every column knows its own answer to that question <strong>immediately</strong>, without waiting for anybody.</li>
        <li>Thirty two of those facts are available after one gate delay, all at the same instant. That is a tree-shaped situation.</li>
        <li>What is still missing is a way to turn those facts into actual carries. That is next session, and it is the best idea in the arc.</li>
      </ul>
    </div>
  </div>

<section class="slide" data-t="Why it matters" data-act="closing">
  <div>
    <div class="kicker">one last thing, before you decide this is a niche problem</div>
    <h2 style="font-size:27px;margin-bottom:2px">Almost nothing a processor does avoids the adder.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figEverywhere"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Reading a variable needs an address, and an address is a base plus an offset. That is an addition.</li>
        <li>Every loop iteration increments a counter. Every array access scales an index and adds it. Every comparison is a subtraction.</li>
        <li>Even fetching the next instruction is the program counter plus four.</li>
        <li>So the adder is not one component among many. It sits on the critical path of the entire machine, and its delay is a floor under the clock period.</li>
      </ul>
    </div>
  </div>

  var histCtl=null;
  (function(){
    var g=document.getElementById('figHist'); if(!g) return;

    var target=[], shown=[], total=0, sum=0, record=0, fit=0, flash=-1, raf=null;
    for(var k=0;k<NB;k++){ target[k]=0; shown[k]=0; }
    function trial(){
      var best=0, run=0, armed=false;
      for(var k=0;k<32;k++){
        var a=Math.random()<0.5?1:0, b=Math.random()<0.5?1:0;
        if(a&&b){ armed=true; run=0; }
        else if((a^b)&&armed){ run++; if(run>best) best=run; }
        else { armed=false; run=0; }
      }
      target[Math.min(best,LAST)]++; total++; sum+=best;
      if(best>record) record=best;

    }
    function readouts(){
      document.getElementById('hTotal').textContent=total.toLocaleString();
      document.getElementById('hMean').textContent=total?(sum/total).toFixed(1):'0.0';
      document.getElementById('hRec').textContent=record;
      document.getElementById('hFit').textContent=total?((100*fit/total).toFixed(1)+'%'):'0%';
    }
    function draw(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var peak=1; for(var k=0;k<NB;k++) peak=Math.max(peak,shown[k]);
      var cut=X0+(FITS+1)*BW;

      txt(g,(cut+X0+NB*BW)/2,38,'NEEDS LONGER',{'font-size':10,fill:RED,'text-anchor':'middle','letter-spacing':1.4});
      for(var q=0;q<NB;q++){

        if(h>0.4) el('rect',{x:x+6,y:BASE-h,width:BW-12,height:h,rx:4,
          fill:q===flash?'#f5c451':(inFit?'#cfe3dc':'#f2cfcb'),

        txt(g,x+BW/2,BASE+20,q===LAST?'16+':q,{'font-size':11,'text-anchor':'middle',
          fill:q===flash?AMB:'#8b9096','font-weight':q===flash?700:400});
        var pc=total?100*target[q]/total:0;
        if(h>26) txt(g,x+BW/2,BASE-h-7,pc.toFixed(pc<10?1:0)+'%',
          {'font-size':10.5,fill:inFit?GRN:RED,'text-anchor':'middle','font-weight':700});
      }
      el('line',{x1:X0,y1:BASE,x2:X0+NB*BW,y2:BASE,stroke:'#dedbd3','stroke-width':2},g);
      txt(g,X0+NB*BW/2,BASE+44,'COLUMNS THE CARRY TRAVELLED',
        {'font-size':9.5,'text-anchor':'middle','letter-spacing':1.4});
      if(total){
        var mean=sum/total, mx=X0+(Math.min(mean,LAST)+0.5)*BW;
        el('line',{x1:mx,y1:56,x2:mx,y2:BASE,stroke:BLUE,'stroke-width':2.4},g);
        el('circle',{cx:mx,cy:56,r:5,fill:BLUE},g);
        txt(g,mx+9,62,'average '+mean.toFixed(1),{'font-size':11.5,fill:BLUE,'font-weight':700});
      }
      if(record>0){
        var rx=X0+Math.min(record,LAST)*BW+BW/2;
        el('path',{d:'M'+rx+' '+(BASE+30)+' l-6 10 l12 0 z',fill:AMB},g);
        txt(g,rx,BASE+62,'record '+record,{'font-size':11,fill:AMB,'text-anchor':'middle','font-weight':700});
      }
    }
    function frame(){
      var moving=false;
      for(var k=0;k<NB;k++){
        var d=target[k]-shown[k];
        if(Math.abs(d)>0.3){ shown[k]+=d*0.28; moving=true; } else shown[k]=target[k];
      }
      draw();
      raf = moving ? requestAnimationFrame(frame) : null;

      if(stream){ stop(); return; }

    };

  })();

    txt(g,40,146,'CLASS 20 \u00b7 THIRTY TWO COLUMNS INTO ONE SUM',{'font-size':10.5,fill:BLUE,'letter-spacing':1.8});
    for(var k2=0;k2<8;k2++){
      var x2=60+k2*68;

    txt(g,760,195,'depth 64',{'font-size':16,fill:RED,'font-weight':700});
    txt(g,880,195,'two gates per link',{'font-size':14,fill:'#8b9096'});
    txt(g,40,258,'the same shape, with a worse constant and a much greater length',
      {'font-size':17,fill:INK,'font-weight':700});
    txt(g,40,284,'and Class 18 already told you a chain is the slowest structure there is',
      {'font-size':14,fill:'#8b9096'});
  })();

  /* ================= Q3 · generate, propagate, kill ================= */
  (function(){
    var g=document.getElementById('figGPK'); if(!g) return;
    var rows=[
      {a:1,b:1,n:'GENERATE',c:RED,d:'a carry comes out no matter what came in',out:'always 1'},

  onSlide=function(idx){
