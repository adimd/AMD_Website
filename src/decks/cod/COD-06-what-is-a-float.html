<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 6 · What is a float?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --mark:#ffdf8a;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:70px 92px 104px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:32px;left:92px;font-family:var(--mono);font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:32px;right:92px;font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:92px;right:92px;bottom:36px;display:flex;gap:3px;align-items:flex-end;height:12px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:11px}
#count{position:absolute;right:92px;bottom:60px;font-family:var(--mono);font-size:15px;color:var(--soft);z-index:5}
#help{position:absolute;left:92px;bottom:60px;font-family:var(--mono);font-size:13px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.kicker.grey{color:var(--soft)} .kicker.red{color:var(--fail)}
h1{font-family:var(--display);font-weight:600;font-size:94px;line-height:1.0;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:56px;line-height:1.08;letter-spacing:-.02em;color:var(--ink);margin-bottom:22px}
p{font-size:27px;line-height:1.46;max-width:31ch}
p+p{margin-top:14px}
.big{font-size:35px;line-height:1.3;color:var(--ink);font-weight:300;max-width:26ch}
.small{font-size:20px;line-height:1.5;color:var(--soft);max-width:60ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.mark{background:linear-gradient(180deg,transparent 56%,var(--mark) 56%,var(--mark) 95%,transparent 95%);padding:0 .1em}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.split.l{grid-template-columns:1.12fr .88fr}
.split.r{grid-template-columns:.84fr 1.16fr}
.stack>*+*{margin-top:15px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
.panel .lab{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:14px}

pre{background:#14181f;border-radius:12px;padding:24px 28px;font-family:var(--mono);font-size:22px;
  line-height:1.6;color:#d9dee6;box-shadow:0 12px 30px rgba(20,22,28,.2);overflow:hidden}
pre .c{color:#7f8896;font-style:italic} pre .k{color:#ff96a2}
pre .s{color:#ffd47e} pre .f{color:#84d8ea}

.btn{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:9px 14px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;justify-content:center}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
input[type=number]{font-family:var(--mono);font-size:22px;background:var(--stage);color:var(--ink);
  border:2px solid var(--rule2);border-radius:7px;padding:5px 8px;width:9ch;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* float instrument */
.fbits{display:flex;justify-content:center;align-items:flex-end;gap:16px}
.fgroup{display:flex;flex-direction:column;align-items:center}
.glab{font-family:var(--mono);font-size:12.5px;letter-spacing:.18em;margin-bottom:7px}
.glab.sg{color:var(--fail)} .glab.ex{color:var(--amber)} .glab.mn{color:var(--accent)}
.grow{display:flex;gap:2px}
.grow b{height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:var(--mono);font-size:17px;font-weight:700;border-radius:4px;
  background:#f1efe9;color:#b3b0a7;border:1px solid var(--rule2);transition:.1s;user-select:none}
.grow b:hover{border-color:var(--soft)}
.grow.sg b{width:48px} .grow.ex b{width:40px} .grow.mn b{width:36px;font-size:15px}
.grow.sg b.on{background:var(--fail);border-color:var(--fail);color:#fff}
.grow.ex b.on{background:var(--amber);border-color:var(--amber);color:#fff}
.grow.mn b.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gsub{font-family:var(--mono);font-size:12.5px;color:var(--soft);margin-top:7px;letter-spacing:.06em}

.formula{text-align:center;margin:20px 0 4px;font-family:var(--mono);font-size:23px;color:var(--ink);
  background:var(--stage);border:1px solid var(--rule);border-radius:9px;padding:14px 10px;line-height:1.5}
.formula .sg{color:var(--fail);font-weight:700}
.formula .mn{color:var(--accent);font-weight:700}
.formula .ex{color:var(--amber);font-weight:700}
.formula .eq{color:var(--soft)}
.formula .rs{color:var(--ink);font-weight:700}

.readout{width:100%;border-collapse:collapse;font-family:var(--mono)}
.readout td{padding:8px 3px;border-bottom:1px solid var(--rule);font-size:21px}
.readout td:first-child{color:var(--soft);font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;width:13rem}
.readout td:last-child{text-align:right;font-weight:700;color:var(--ink);word-break:break-all}
.readout tr:last-child td{border-bottom:none}

.field{border-radius:10px;padding:16px 20px}
.field.sg{background:var(--fail-soft);border:1px solid #eecdcb}
.field.ex{background:var(--amber-soft);border:1px solid #e8d3ab}
.field.mn{background:var(--accent-soft);border:1px solid #c3cee6}
.field .n{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.field .v{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.1;margin-top:4px}

.work{font-family:var(--mono);font-size:24px;line-height:1.5;color:var(--ink);white-space:pre;display:inline-block;text-align:left}
.work .d{color:var(--soft)} .work .a{color:var(--amber)} .work .b{color:var(--accent)}
.work .bar{border-top:2px solid var(--ink);padding-top:4px;margin-top:3px}

figcaption{font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:8px}
svg text{font-family:'JetBrains Mono',monospace}

.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:92px;right:92px;bottom:88px;display:none;padding:13px 17px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:19px;line-height:1.45;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:60px 92px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:18px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:70px}
#jump li{padding:6px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:20px;color:var(--body);display:flex;gap:18px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:42px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 06</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 6 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ===== ACT 1 · THREE PROGRAMS ===== -->

<!-- 01 -->
<section class="slide" data-t="Title" data-act="1 · three programs">
  <div>
    <div class="kicker">class 06 · hour six of fifty</div>
    <h1>Half of<br>something.</h1>
    <p class="big" style="margin-top:34px;max-width:38ch">Every integer, in both directions, is now yours. So write down one half. Then one third. Then one tenth.</p>
    <p class="big frag" style="margin-top:20px;max-width:38ch;color:var(--accent)">Before that, three programs.</p>
  </div>
  <div class="cue">Do not discuss fractions yet. Get to the code inside two minutes.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="Program one" data-act="1 · three programs">
  <div>
    <div class="kicker">program one</div>
    <div class="split l">
      <div>
<pre><span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">double</span> a = <span class="s">0.1</span>;
    <span class="f">double</span> b = <span class="s">0.2</span>;

    <span class="k">if</span> (a + b == <span class="s">0.3</span>)
        printf(<span class="s">"equal\n"</span>);
    <span class="k">else</span>
        printf(<span class="s">"not equal\n"</span>);

    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div class="stack">
        <h2 style="font-size:48px;margin-bottom:16px">What does<br>it print?</h2>
        <p class="small">Write your answer down before anybody runs it.</p>
      </div>
    </div>
  </div>
  <div class="cue">Collect a show of hands on equal against not equal before running anything.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="Program two" data-act="1 · three programs">
  <div>
    <div class="kicker">program two</div>
    <div class="split l">
      <div>
<pre><span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> x = <span class="s">16777216.0f</span>;

    printf(<span class="s">"%.0f\n"</span>, x);
    printf(<span class="s">"%.0f\n"</span>, x + <span class="s">1.0f</span>);

    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div class="stack">
        <h2 style="font-size:48px;margin-bottom:16px">And this one?</h2>
        <p>That number is <span class="num">2<sup>24</sup></span>. It is nowhere near the limit of what a float can hold.</p>
      </div>
    </div>
  </div>
  <div class="cue">Everyone will say the second line prints 16777217. Let them commit to it.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Program three" data-act="1 · three programs">
  <div>
    <div class="kicker">program three</div>
    <div class="split l">
      <div>
<pre><span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span> y = <span class="s">16777218.0f</span>;

    printf(<span class="s">"%.0f\n"</span>, y);
    printf(<span class="s">"%.0f\n"</span>, y + <span class="s">1.0f</span>);

    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div class="stack">
        <h2 style="font-size:48px;margin-bottom:16px">Same program.<br>Two bigger.</h2>
        <p>This one is <span class="num">2<sup>24</sup> + 2</span>. Adding one to it should be uneventful.</p>
      </div>
    </div>
  </div>
  <div class="cue">Now run all three, in order, and say nothing while they read the output.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="Isn't this strange" data-act="1 · three programs">
  <div class="center">
    <h2 style="font-size:60px;margin-bottom:30px">Is that not strange?</h2>
    <p class="big" style="max-width:52ch;color:var(--soft)">A number system where adding one changes nothing, and then adding one to a slightly bigger number changes it by two.</p>
    <p class="big frag" style="margin-top:30px;max-width:48ch">Talk to the person next to you. What sort of thing behaves like that?</p>
  </div>
  <div class="cue">Take three minutes of real discussion. Somebody usually says "rounding". Push them: rounding to what?</div>
</section>

<!-- ===== ACT 2 · SCIENTIFIC NOTATION ===== -->

<!-- 06 -->
<section class="slide" data-t="An older problem" data-act="2 · scientific notation">
  <div>
    <div class="kicker grey">put the machine down for a minute</div>
    <h2 style="margin-bottom:20px">Write these two numbers<br>on the same page.</h2>
    <div class="split">
      <div class="panel" style="text-align:center">
        <span class="lab">distance to the sun, in metres</span>
        <div style="font-family:var(--mono);font-size:34px;font-weight:700;color:var(--ink)">149600000000</div>
      </div>
      <div class="panel" style="text-align:center">
        <span class="lab">radius of a hydrogen atom, in metres</span>
        <div style="font-family:var(--mono);font-size:34px;font-weight:700;color:var(--ink)">0.000000000053</div>
      </div>
    </div>
    <p class="big frag" style="margin-top:26px;max-width:74ch;font-size:31px">Almost every digit on this slide is a zero, and not one of those zeros is telling you anything.</p>
  </div>
  <div class="cue">The problem is old and it is not a computing problem. Scientists had it first.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="Two things, stored apart" data-act="2 · scientific notation">
  <div>
    <div class="kicker">the fix, three hundred years old</div>
    <h2 style="font-size:50px;margin-bottom:16px">Keep the digits.<br>Throw away the zeros.</h2>
    <div class="split r">
      <div class="stack">
        <p>Write the digits that carry information, then say separately how big the number is.</p>
        <p class="small">Slide the exponent. The digits never change. Only the statement of scale does.</p>
      </div>
      <div class="panel">
        <span class="lab">move the point</span>
        <div style="text-align:center;font-family:var(--mono);font-size:30px;font-weight:700;color:var(--ink);min-height:44px" id="sciFull"></div>
        <div style="text-align:center;margin:14px 0" id="sciNorm"></div>
        <input type="range" id="sciE" min="-4" max="8" value="0">
        <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--soft)"><span>small</span><span>large</span></div>
      </div>
    </div>
  </div>
  <div class="cue">Point at the digits while you slide. They are inert. That separation is the whole invention.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Figures, not gaps" data-act="2 · scientific notation">
  <div>
    <div class="kicker red">and here is the price, stated up front</div>
    <h2 style="margin-bottom:20px">You are promising<br>significant figures.<br>Not accuracy.</h2>
    <div class="split">
      <div class="stack">
        <p>Four significant figures on the distance to the sun means you are certain to about ten million metres.</p>
        <p class="frag">Four significant figures on the atom means you are certain to about a hundred-millionth of a nanometre.</p>
      </div>
      <div class="stack frag">
        <p class="big">The same promise. Wildly different absolute error.</p>
        <p>The gap between numbers you can write down is not fixed. It grows with the number.</p>
      </div>
    </div>
  </div>
  <div class="cue">This sentence is the whole of floating point. Everything from here is that idea written in binary.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="Normalised" data-act="2 · scientific notation">
  <div>
    <div class="kicker grey">one small rule</div>
    <h2 style="margin-bottom:20px">Exactly one digit<br>before the point.</h2>
    <div class="split">
      <div class="stack">
        <p><span class="num">6.371 &times; 10<sup>6</sup></span> and <span class="num">63.71 &times; 10<sup>5</sup></span> are the same number written two ways.</p>
        <p class="frag">Pick one, so that every number has exactly one spelling. That is what normalised means.</p>
      </div>
      <div class="stack frag">
        <p class="big">Remember this rule. In binary it is about to hand us a free bit.</p>
      </div>
    </div>
  </div>
  <div class="cue">Plant it hard. The hidden bit four slides from now is the payoff.</div>
</section>

<!-- ===== ACT 3 · IN BINARY ===== -->

<!-- 10 -->
<section class="slide" data-t="Same trick, base two" data-act="3 · in binary">
  <div>
    <div class="kicker">now do it in the machine's alphabet</div>
    <h2 style="font-size:50px;margin-bottom:16px">Same trick. Base two.</h2>
    <div class="split r">
      <div class="stack">
        <p>Columns to the right of the point are worth a half, a quarter, an eighth, and onwards, exactly as the columns to the left are worth one, two, four.</p>
        <p class="small">Then shift until there is a single one before the point, and count how far you shifted.</p>
      </div>
      <div class="panel">
        <span class="lab">type a number</span>
        <div style="text-align:center"><input type="number" id="binN" value="11.375" step="0.125"></div>
        <div style="text-align:center;margin-top:18px" id="binOut"></div>
        <div class="btnrow">
          <button class="btn" data-bn="11.375">11.375</button>
          <button class="btn" data-bn="0.5">0.5</button>
          <button class="btn" data-bn="1">1</button>
          <button class="btn" data-bn="0.1">0.1</button>
          <button class="btn" data-bn="100">100</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Press 0.1 last. The repeating pattern is worth noticing now, but do not explain it. That is its own hour.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="The hidden bit" data-act="3 · in binary">
  <div>
    <div class="kicker">and now collect the debt</div>
    <h2 style="font-size:50px;margin-bottom:20px">In base ten the leading<br>digit could be anything.</h2>
    <div class="split">
      <div class="stack">
        <p>It could be a 1, or a 4, or a 9. You have to write it down.</p>
        <p class="big frag" style="margin-top:10px">In base two there is only one digit it can possibly be.</p>
      </div>
      <div class="stack frag">
        <p class="big" style="color:var(--accent)">So do not store it.</p>
        <p>Everybody agrees it is there. Twenty three bits of storage give you twenty four bits of number, for nothing.</p>
      </div>
    </div>
  </div>
  <div class="cue">Ask what the leading digit must be before you show it. Somebody will get it, and it lands better from them.</div>
</section>

<!-- ===== ACT 4 · THE LAYOUT ===== -->

<!-- 12 -->
<section class="slide" data-t="Thirty two bits" data-act="4 · the layout">
  <div>
    <div class="kicker">so here is the whole thing</div>
    <h2 style="font-size:48px;margin-bottom:22px">One sign. One scale.<br>One set of digits.</h2>
    <figure>
      <svg viewBox="0 0 1400 190" width="100%" role="img" aria-label="The thirty two bit float layout">
        <g id="layout"></g>
      </svg>
    </figure>
    <p class="big frag" style="margin-top:14px;max-width:78ch;font-size:30px">Thirty two wires, cut into three fields by nothing more than an agreement about which wire means what.</p>
  </div>
  <div class="cue">Say the word agreement. There is no physical divider. The fields exist because a committee said so in 1985.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="The sign bit" data-act="4 · the layout">
  <div>
    <div class="kicker red">field one · one bit</div>
    <h2 style="margin-bottom:20px">The sign.</h2>
    <div class="split">
      <div class="stack">
        <p>Zero means positive, one means negative. That is the entire field.</p>
        <p class="frag">It is sign and magnitude, the scheme we threw out last session for having two zeros.</p>
      </div>
      <div class="stack frag">
        <p class="big">And it still has two zeros. Floats have a positive zero and a negative zero, and they are different patterns.</p>
        <p class="small">Here it is the right choice anyway. Negating a float costs one inverter and never disturbs the digits. We will pay for the two zeros in the next session.</p>
      </div>
    </div>
  </div>

    function nextDown(x){
      if(Number.isNaN(x)||x===-Infinity) return x;
      if(x===0){ dv.setUint32(0,0x80000001); return dv.getFloat32(0); }
      dv.setFloat32(0,x); var u=dv.getUint32(0);
      u = (x>0) ? u-1 : u+1;
      dv.setUint32(0,u>>>0); return dv.getFloat32(0);
    }

    function cell(k,cls){ return '<b data-k="'+k+'" class="'+(bits[k]==='1'?'on':'')+'">'+bits[k]+'</b>'; }

    function drawF(){
      gSign.innerHTML=cell(0);
      var h=''; for(var k=1;k<9;k++) h+=cell(k);  gExp.innerHTML=h;
      h='';     for(var k=9;k<32;k++) h+=cell(k); gMan.innerHTML=h;

      Array.prototype.forEach.call(document.querySelectorAll('.grow b'),function(el){
        el.onclick=function(){ var k=+el.dataset.k; bits[k]=bits[k]==='1'?'0':'1'; drawF(); };
      });

      var b=bits.join(''), sgn=b.charAt(0)==='1', e=parseInt(b.slice(1,9),2),
          mstr=b.slice(9), m=parseInt(mstr,2), v=fromBits(b);

      var fam = (e===255) ? (m===0?'infinity':'not a number')
              : (e===0)   ? (m===0?'zero':'subnormal') : 'normal';
      var famCol = {'normal':'var(--accent)','subnormal':'var(--amber)','zero':'var(--soft)',
                    'infinity':'var(--ok)','not a number':'var(--fail)'}[fam];

      document.getElementById('eSub').innerHTML =
        (e===0||e===255) ? '<span style="color:var(--fail)">stored '+e+', reserved</span>'
                         : 'stored '+e+', so '+e+' &minus; 127 = '+(e-127);

      /* the assembled formula */
      var lead = (e===0) ? '0.' : '1.';
      var fstr;
      if(e===255){
        fstr = '<span class="eq">this pattern is not a number at all</span>';
      } else {
        fstr = '<span class="sg">'+(sgn?'&minus;':'+')+'</span> &nbsp;'+
               '<span class="mn">'+lead+mstr+'</span><sub style="font-size:.6em">two</sub>'+
               ' &nbsp;&times;&nbsp; <span class="ex">2<sup>'+(e===0?-126:e-127)+'</sup></span>'+
               ' &nbsp;<span class="eq">=</span>&nbsp; <span class="rs">'+fmt(v)+'</span>';
      }
      document.getElementById('fFormula').innerHTML=fstr;

      document.getElementById('fHex').textContent='0x'+u32().toString(16).toUpperCase().padStart(8,'0');
      var vv=document.getElementById('fVal');
      vv.textContent=fmt(v); vv.style.color=famCol;
      document.getElementById('fExact').textContent=(e===255)?'not a number':exactOfBits(b);
      var ff=document.getElementById('fFam');
      ff.textContent=fam; ff.style.color=famCol;

      var up=nextUp(v);
      document.getElementById('fNext').textContent=fmt(up);
      var gap=up-v;
      var gp=document.getElementById('fUlp');
      gp.textContent=Number.isFinite(gap)?fmt(gap):'nothing beyond this';
      gp.style.color=(Number.isFinite(gap)&&gap>=1)?'var(--fail)':'var(--ink)';

      var inp=document.getElementById('fIn');
      if(document.activeElement!==inp && Number.isFinite(v)) inp.value=v;
    }

    Array.prototype.forEach.call(document.querySelectorAll('[data-fp]'),function(bt){
      bt.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-fp]'),function(x){ x.classList.remove('hot'); });
        bt.classList.add('hot');
        setFromFloat(parseFloat(bt.dataset.fp));
      };
    });
    document.getElementById('fUp').onclick=function(){ setFromFloat(nextUp(fromBits(bits.join('')))); };
    document.getElementById('fDown').onclick=function(){ setFromFloat(nextDown(fromBits(bits.join('')))); };
    document.getElementById('fDbl').onclick=function(){ setFromFloat(Math.fround(fromBits(bits.join(''))*2)); };
    document.getElementById('fHalf').onclick=function(){ setFromFloat(Math.fround(fromBits(bits.join(''))/2)); };
    document.getElementById('fNeg').onclick=function(){ bits[0]=bits[0]==='1'?'0':'1'; drawF(); };
    document.getElementById('fIn').addEventListener('input',function(){
      var x=parseFloat(this.value); if(!isNaN(x)) setFromFloat(x);
    });

    drawF();
  }

  /* ---------- 18 · around 2^24 ---------- */
  var f24=document.getElementById('fig24');
  if(f24){
    var vals=[16777212,16777214,16777216,16777218,16777220,16777222];
    var X0=90, W=1220, s='';
    s+='<line x1="'+X0+'" y1="96" x2="'+(X0+W)+'" y2="96" stroke="#c6c3ba" stroke-width="2"/>';
    vals.forEach(function(v,k){
      var x=X0+(k/(vals.length-1))*W;
      var hot=(v===16777216||v===16777218||v===16777220);
      s+='<line x1="'+x+'" y1="72" x2="'+x+'" y2="120" stroke="'+(hot?'#23408f':'#c6c3ba')+'" stroke-width="'+(hot?4:2)+'"/>';
      s+='<text x="'+x+'" y="150" font-size="17" fill="'+(hot?'#15171b':'#8b9096')+'" text-anchor="middle">'+v+'</text>';
    });
    var gx=X0+(2/5)*W, gx2=X0+(3/5)*W;
    s+='<text x="'+((gx+gx2)/2)+'" y="52" font-size="16" fill="#a8231f" text-anchor="middle">NOTHING EXISTS IN HERE</text>';
    s+='<path d="M'+(gx+10)+' 62 L'+(gx2-10)+' 62" stroke="#a8231f" stroke-width="1.5" stroke-dasharray="4 4"/>';
    s+='<text x="'+X0+'" y="190" font-size="15" fill="#8b9096">EVERY FLOAT IN THIS REGION, DRAWN TO SCALE. THE GAP IS TWO.</text>';
    f24.innerHTML=s;
  }

  /* ---------- 19 · gap table ---------- */
  var gt=document.getElementById('gapTable');
  if(gt){
    var rows=[[0,'1'],[1,'2'],[10,'1,024'],[20,'about a million'],[23,'about 8 million'],
              [24,'about 17 million'],[30,'about a billion'],[127,'the largest floats there are']];
    var h='';
    rows.forEach(function(r){
      var g=Math.pow(2,r[0]-23);
      var big=g>=1;
      h+='<tr><td style="width:22rem">around '+r[1]+'</td><td style="color:'+(big?'var(--fail)':'var(--ink)')+'">'+
         'the next float is '+fmt(g)+' away</td></tr>';
    });
    gt.innerHTML=h;
  }

  /* ---------- 20 · density ---------- */
  var dens=document.getElementById('density');
  if(dens){
    var MB=3;
    function drawDens(){
      var X0=60, W=1290, TOP=60, BOT=150, MAXV=16, s='';
      /* octave shading */
      for(var e=-1;e<=3;e++){
        var lo=Math.pow(2,e), hi=Math.pow(2,e+1);
        var x1=X0+(lo/MAXV)*W, x2=X0+(Math.min(hi,MAXV)/MAXV)*W;
        s+='<rect x="'+x1+'" y="'+TOP+'" width="'+(x2-x1)+'" height="'+(BOT-TOP)+'" fill="'+((e%2)?'#f2f0ea':'#eaeef7')+'"/>';
        if(x2-x1>60) s+='<text x="'+((x1+x2)/2)+'" y="'+(TOP-12)+'" font-size="14" fill="#8b9096" text-anchor="middle">'+Math.pow(2,MB)+' VALUES</text>';
      }
      /* ticks */
      var count=0;
      for(var e=-4;e<=3;e++){
        for(var m=0;m<Math.pow(2,MB);m++){
          var v=(1+m/Math.pow(2,MB))*Math.pow(2,e);
          if(v>MAXV) break;
          var x=X0+(v/MAXV)*W;
          s+='<line x1="'+x.toFixed(1)+'" y1="'+TOP+'" x2="'+x.toFixed(1)+'" y2="'+BOT+'" stroke="#23408f" stroke-width="1.6"/>';
          count++;
        }
      }
      s+='<line x1="'+X0+'" y1="'+BOT+'" x2="'+(X0+W)+'" y2="'+BOT+'" stroke="#15171b" stroke-width="2"/>';
      [0,2,4,8,16].forEach(function(v){
        var x=X0+(v/MAXV)*W;
        s+='<line x1="'+x+'" y1="'+BOT+'" x2="'+x+'" y2="'+(BOT+10)+'" stroke="#15171b" stroke-width="2"/>';
        s+='<text x="'+x+'" y="'+(BOT+34)+'" font-size="18" fill="#15171b" text-anchor="middle">'+v+'</text>';
      });
      s+='<text x="'+X0+'" y="'+(BOT+72)+'" font-size="16" fill="#a8231f">EACH SHADED BAND HOLDS THE SAME NUMBER OF VALUES, SPREAD OVER TWICE THE WIDTH</text>';
      dens.innerHTML=s;
      document.getElementById('densCap').textContent='drawn with a '+MB+' bit mantissa so the marks are visible · a real float has 23';
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-mb]'),function(b){
      b.onclick=function(){
        MB=+b.dataset.mb;
        Array.prototype.forEach.call(document.querySelectorAll('[data-mb]'),function(x){ x.classList.remove('hot'); });
        b.classList.add('hot'); drawDens();
      };
    });
    drawDens();
  }

  paint();
})();
</script>
</body>
</html>
