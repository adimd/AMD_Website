<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 29</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 29 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the question">
  <div>
    <div class="kicker">class 29 · hour twenty nine of fifty</div>
    <h1>How does a machine<br>add two floats?</h1>
    <p class="big" style="margin-top:22px;max-width:50ch">You spent an hour in Class 11 encoding floating point numbers and you have never once operated on one. Today every unit on the table gets used, and the operation everyone expects to be easy turns out to be the hard one.</p>
  </div>
  <div class="cue">This hour collects more debts than any other in the course. Say that at the top, and mean it.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the question">
  <div>
    <h2>Nothing new gets built today. Everything already on the table gets used.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1050" height="213"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>Which is harder, multiply or add?</strong> Everyone in this room will say multiply. Everyone in this room will be wrong, and the reason is countable.</li>
        <li><strong>What does it cost to round correctly?</strong> Class 12 gave you a rule and no justification. Today the rule becomes three bits of hardware.</li>
        <li><strong>And what happens when the number is strange?</strong> The slow path you measured on your own laptop in Class 11, explained.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flag the inversion now. The whole first act exists to overturn an assumption they do not know they are holding.</div>
</section>

<section class="slide" data-t="The number you encoded" data-act="the question">
  <div>
    <div class="tag">CLASS 11, NEVER OPERATED ON</div>
    <h2 style="margin-bottom:0">Thirty two bits, three fields, and one of them is not stored.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 300" width="1082" height="280"><g id="figField"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the three fields, and why the third one matters today</div>
      <ul>
        <li>The exponent is stored with a bias of one hundred and twenty seven, which Class 8 made you fill in a table about and would not say why.</li>
        <li>The significand carries an implicit leading one that is never written down. Twenty three stored bits, twenty four bits of precision, free.</li>
        <li><strong>Twenty four bits is the whole budget.</strong> Everything that goes wrong today goes wrong because something had to leave that budget.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Put 9.75 on the board in all three fields before moving on. They will need it in four slides.</div>
</section>

<!-- ================= ACT 1 ================= -->

<section class="slide" data-t="Which one is harder" data-act="1 · the inversion">
  <div>
    <h2>Before any hardware. Which of these two needs more of it?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1082" height="308"><g id="figAsk"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">take the vote, then write it on the board</div>
      <ul>
        <li>Every integer instinct in the room says multiply. In integer hardware that instinct is correct, and you proved it in Classes 24 and 25.</li>
        <li>In floating point it is exactly backwards, and the reason is not subtle once you see it. One of these operations never has to line anything up.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do take the vote. The inversion only lands if they have committed to an answer out loud first.</div>
</section>

<section class="slide" data-t="Multiply, the easy one" data-act="1 · the inversion">
  <div>
    <h2>Multiplication, because the fields never have to meet.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 360" width="1070" height="332"><g id="figMul"></g></svg></div>
    <div class="btnrow"><span class="lab">STAGE</span>
      <button class="btn" id="mulRun">run ▶</button>
      <button class="btn" id="mulStep">step</button>
      <button class="btn" id="mulReset">reset</button>
    </div>
  </div>
  <div class="cue">Walk the four stages out loud. Sign, exponent, significand, round. Nothing waits for anything else except the final round.</div>
</section>

<section class="slide" data-t="The bias counted twice" data-act="1 · the inversion">
  <div>
    <h2>Why the bias comes off once, and only once.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 300" width="1070" height="276"><g id="figBias"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">one subtraction, and it is an eight bit one</div>
      <ul>
        <li>Each stored exponent already carries a bias of one hundred and twenty seven. Add two of them and you have added the bias twice, so one copy has to come back off.</li>
        <li>That is the entire exponent path of a floating point multiplier. Two eight bit adds, and the result is ready long before the significands are.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the first place the excess K scheme from Class 8 costs something rather than paying out. One extra subtract, and it is cheap.</div>
</section>

<section class="slide" data-t="Addition, the obstacle" data-act="2 · four stages">
  <div>
    <div class="tag bad">THE HARD ONE</div>
    <h2 style="margin-bottom:0">You cannot touch the significands until the binary points line up.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1058" height="319"><g id="figPoints"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">the obstacle, stated exactly</div>
      <ul>
        <li>Column addition only works when the columns mean the same thing. Here the top bit of one significand is worth eight and the top bit of the other is worth one half.</li>
        <li>And the binary points are in different places <em>by definition</em>. That is what a floating point number is.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Hold on this slide. Everything in the next four slides is machinery for one problem, and this is the picture of that problem.</div>
</section>

<section class="slide" data-t="Stage 1, align" data-act="2 · four stages">
  <div>
    <h2>Stage one. Shift the smaller one right until the points agree.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1070" height="322"><g id="figAlign"></g></svg></div>
    <div class="btnrow"><span class="lab">SHIFT</span>
      <button class="btn" id="alRun">run ▶</button>
      <button class="btn" id="alStep">step</button>
      <button class="btn" id="alReset">reset</button>
    </div>
  </div>
  <div class="cue">Both units here are last session's. The comparator chooses the direction, the barrel shifter does the move, in one pass.</div>
</section>

<section class="slide" data-t="What alignment costs" data-act="2 · four stages">
  <div>
    <div class="tag bad">BEFORE ANY ARITHMETIC HAS HAPPENED</div>
    <h2 style="margin-bottom:0">Nothing fell off the end that time. Now make the exponents differ by twenty four.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1082" height="308"><g id="figLoss"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">verified, in float</div>
      <ul>
        <li>Two to the twenty four plus one is two to the twenty four. The one is shifted twenty four places right during alignment and leaves the register before the adder is reached.</li>
        <li>Two to the twenty four plus two does change the answer, which tells you the precision did not vanish. It ran out.</li>
        <li><strong>The loss happens in stage one.</strong> No addition has taken place yet.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the alignment loss activity. Have them predict the answer before you show it, and then run it in C.</div>
</section>

<section class="slide" data-t="Stage 2, operate" data-act="2 · four stages">
  <div>
    <div class="tag win">YOU BUILT THIS IN CLASS 22</div>
    <h2 style="margin-bottom:0">Stage two is the only stage that does arithmetic, and it is already on the desk.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 300" width="1082" height="280"><g id="figOperate"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">no new hardware</div>
      <ul>
        <li>Once the points agree, the significands are two ordinary binary integers and the lookahead adder from Class 22 adds them in twelve gate delays.</li>
        <li>Subtraction is the same box with the complement trick from Class 23. Signs differ, invert and add one, read the flags.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the ratio out loud: one stage of six does the arithmetic. The other five are moving things into position and out again.</div>
</section>

<section class="slide" data-t="Stage 3, normalise" data-act="2 · four stages">
  <div>
    <h2>Stage three. The result is almost never in the right shape.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1070" height="312"><g id="figNorm"></g></svg></div>
    <div class="btnrow"><span class="lab">CASE</span>
      <button class="btn" id="nmA">carried past the top</button>
      <button class="btn" id="nmB">cancelled to nothing</button>
    </div>
  </div>
  <div class="cue">The second case is catastrophic cancellation from Class 12, and now they can see the zeros being shifted in from the bottom.</div>
</section>

<section class="slide" data-t="Count the units" data-act="2 · four stages">
  <div>
    <h2>Now count what each operation used.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 390" width="1046" height="352"><g id="figLedger"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">reading the ledger</div>
      <ul>
        <li>Addition uses the barrel shifter twice and the multiplier never uses it at all. That one line is the whole answer to the opening question.</li>
        <li>Multiply runs its exponent path in parallel with its significand path. Addition cannot: nothing can start until the comparison finishes.</li>
        <li><strong>Neither fits in a three gigahertz cycle.</strong> Both are pipelined in a real processor, which is a Fundamentals of Computer Architecture problem, not today's.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Gate counts assume the units this course built: twelve delays for a lookahead add, ten for a barrel shift, twenty six for Booth and Wallace.</div>
</section>

<section class="slide" data-t="The inversion, landed" data-act="2 · four stages">
  <div class="center">
    <h2 style="font-size:38px;margin-bottom:18px">Addition is the harder<br>floating point operation.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">Not because adding is hard. Because floating point addition is two shifts, a comparison, a leading zero count and a rounding decision wrapped around one add.</p>
    <p class="big frag" style="margin-top:20px;max-width:54ch">Multiplication never has to make two numbers agree about where the point is. That is the entire difference.</p>
  </div>
  <div class="cue">Give this slide air. They voted the other way eight slides ago and this is where it is cashed.</div>
</section>

<!-- ================= ACT 3 ================= -->

<section class="slide" data-t="Stage 4, round" data-act="3 · what correctness costs">
  <div>
    <div class="tag">CLASS 12 GAVE YOU THE RULE AND NO REASON</div>
    <h2 style="margin-bottom:0">To round correctly you must keep more than you keep.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1082" height="298"><g id="figGRS"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">three bits, and the third one is a lie that works</div>
      <ul>
        <li><strong>Guard</strong> is the first bit past the end. <strong>Round</strong> is the second. <strong>Sticky</strong> is the OR of absolutely everything beyond.</li>
        <li>Sticky is one bit standing in for an unbounded number of them. Once a one appears out there it can never be lost, which is why it is called sticky.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Three bits. Ask the room how many bits it would take to be exactly right, and let them work out that the answer is unbounded.</div>
</section>

<section class="slide" data-t="The sticky bit earns it" data-act="3 · what correctness costs">
  <div>
    <h2>Two numbers identical for forty bits. They round to different answers.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1082" height="298"><g id="figSticky"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">why sticky cannot be dropped</div>
      <ul>
        <li>Guard and round are the same in both rows. Only the OR of everything below differs, and that is the bit that decides.</li>
        <li>Drop sticky and the second case rounds down, which is wrong by half an ulp, forever, in a predictable direction.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Verified in float: one plus two to the minus twenty four is a tie and gives one. Add two to the minus forty and it rounds up.</div>
</section>

<section class="slide" data-t="The four cases" data-act="3 · what correctness costs">
  <div>
    <h2>The whole rounding decision, on one interval.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1082" height="308"><g id="figCases"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">four cases, one small circuit</div>
      <ul>
        <li>Guard zero: below half, round down. Guard one with round or sticky set: above half, round up. Guard one and both others zero: exactly half, and that is the tie.</li>
        <li>The tie goes to whichever neighbour leaves the last kept bit even. One AND, one OR and a conditional increment.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Note the increment is a full twenty four bit add, and it is on the critical path. Correct rounding is not free.</div>
</section>

<section class="slide" data-t="Why ties to even" data-act="3 · what correctness costs">
  <div>
    <h2>Because ties away from zero is a bias, and biases accumulate.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1070" height="312"><g id="figTies"></g></svg></div>
    <div class="btnrow"><span class="lab">ADD TIES</span>
      <button class="btn" id="tiRun">run ▶</button>
      <button class="btn" id="tiStep">step</button>
      <button class="btn" id="tiReset">reset</button>
    </div>
  </div>
  <div class="cue">Ten thousand ties. Away from zero drifts by exactly five thousand ulp because every single one goes the same way. Even ends at twenty eight.</div>
</section>

<section class="slide" data-t="The Patriot, in floating point" data-act="3 · what correctness costs">
  <div class="center">
    <h2 style="font-size:33px;margin-bottom:16px">Class 12 told you a rule.<br>This is what the rule was defending against.</h2>
    <p class="big" style="max-width:58ch;color:var(--soft)">The Patriot battery at Dhahran was a fixed point accumulation with a bias in every tick, running for a hundred hours. The bias was tiny and it never cancelled, because nothing in that scheme made it cancel.</p>
    <p class="big frag" style="margin-top:18px;max-width:58ch">Ties to even is the floating point answer to exactly that failure mode. It is one gate of logic choosing which way a coin lands, so that the coin lands both ways.</p>
  </div>
  <div class="cue">Do not overclaim. Ties to even does not make long summations safe. It removes one systematic source of drift out of several.</div>
</section>

<!-- ================= ACT 4 ================= -->

<section class="slide" data-t="Denormals" data-act="4 · the slow path">
  <div>
    <div class="tag new">YOU MEASURED THIS IN CLASS 11</div>
    <h2 style="margin-bottom:0">One kind of number has no implicit leading one, and the whole path breaks.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1082" height="308"><g id="figDenorm"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the mechanism behind the number you measured</div>
      <ul>
        <li>Normalise assumes it knows where the leading one is. For a subnormal there is no leading one, so the stage cannot do its job and the exponent handling is different too.</li>
        <li>Rather than build a second full data path, most implementations detect the case and trap into microcode, which is the processor executing a sequence of ordinary operations on itself.</li>
        <li><strong>Correctness preserved. Speed abandoned.</strong></li>
      </ul>
    </div>
  </div>
  <div class="cue">Several of them measured the slowdown on their own laptops three arcs ago and did not know what caused it. This is the answer.</div>
</section>

<section class="slide" data-t="Why the flags exist" data-act="4 · the slow path">
  <div>
    <h2>A correctness feature that costs two orders of magnitude in the wrong loop.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 310" width="1082" height="290"><g id="figFlags"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">two control bits, and who turns them on</div>
      <ul>
        <li><strong>Flush to zero</strong> replaces a subnormal result with zero. <strong>Denormals are zero</strong> does the same to the inputs. Both skip the trap entirely.</li>
        <li>Audio and graphics code turns them on deliberately, because a number that small is inaudible and invisible, and the stall is neither.</li>
        <li>This is also what the fast maths compiler flag quietly does to your numerics.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Name the trade honestly. They are buying speed with a documented loss of correctness near zero, and for audio that is the right trade.</div>
</section>

<section class="slide" data-t="Fused multiply add" data-act="4 · the slow path">
  <div>
    <div class="tag win">CLASS 25 ALREADY PAID FOR THIS</div>
    <h2 style="margin-bottom:0">The addend is one more row in the compressor tree.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 334" width="1070" height="308"><g id="figFMA"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">faster and more accurate, from one structural observation</div>
      <ul>
        <li>Faster, because it is one pass through the hardware instead of two, and one rounding instead of two.</li>
        <li>More accurate, because the full width product is kept all the way to the addition instead of being squeezed into twenty four bits first.</li>
        <li>This is why machine learning accelerators are built around multiply accumulate rather than around multiply. The accumulate was already free.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Point back at the Wallace tree from Class 25. The row is already wired to be absorbed, which is why this costs nothing.</div>
</section>

<section class="slide" data-t="A different answer" data-act="4 · the slow path">
  <div>
    <div class="tag bad">NOT A WORSE ANSWER. A DIFFERENT ONE.</div>
    <h2 style="margin-bottom:0">Fusing changes what your program prints.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 320" width="1082" height="298"><g id="figFMAbits"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">verified in float, one bit apart</div>
      <ul>
        <li>Same three inputs, same hardware family, two answers that differ in the last bit of the significand. The fused one is the one closer to the truth.</li>
        <li>So a compiler that fuses a multiply and an add has changed your numerical output without being asked. That is why fusion is controlled by a flag, and why some numerical code has to forbid it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">If the hour has run long, this is the pair of slides to push into the survey at the start of Class 30. Do not cut the rounding material instead.</div>
</section>

    txt(g,(XT+1120)/2,Y+H+48,'OR of all of it, into one bit',
      {'font-size':12,fill:VIO,'font-weight':700,'text-anchor':'middle'});
    txt(g,X0,Y+H+44,'G is the guard bit   ·   R is the round bit   ·   S is the sticky bit',
      {'font-size':12,fill:'#8b9096'});

    var YB=Y+H+66;
    el('rect',{x:30,y:YB,width:1096,height:72,rx:10,fill:'#efe9f7',stroke:VIO,'stroke-width':1.8},g);
    txt(g,52,YB+24,'sticky is one bit standing in for an unbounded number of bits, and it is enough.',
      {'font-size':14,fill:'#4a2b70','font-weight':700});
    txt(g,52,YB+45,'to decide a rounding you never need to know what is down there. you need to know whether anything is.',
      {'font-size':12.5,fill:'#4a2b70'});
    txt(g,52,YB+64,'once a one appears beyond the round bit it can never be cancelled by anything further down, so it sticks.',
      {'font-size':12.5,fill:'#4a2b70'});
  })();

  /* ================= sticky decides ================= */
  (function(){
    var g=document.getElementById('figSticky'); if(!g) return;
    txt(g,30,22,'TWO ADDITIONS TO 1.0, VERIFIED IN FLOAT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=270, Y=52, RH=92;
    function case_(y,blab,bval,G,R,S,res,ok,note){
      el('rect',{x:30,y:y,width:1096,height:78,rx:10,fill:'#fff',stroke:ok?GRN:RED,'stroke-width':1.8},g);
      txt(g,52,y+28,blab,{'font-size':14,fill:INK,'font-weight':700});
      txt(g,52,y+50,bval,{'font-size':12.5,fill:'#8b9096'});
      var bx=430;
      [['G',G],['R',R],['S',S]].forEach(function(p,k){
        var on=p[1]==='1';
        cel(g,bx+k*62,y+18,46,42,p[1],{fill:on?(k===2?'#efe9f7':'#fdf3e3'):'#faf9f6',
          stroke:on?(k===2?VIO:AMB):'#dedbd3',col:on?INK:'#b2b6bb',fs:16});
        txt(g,bx+k*62+23,y+74,p[0],{'font-size':11,fill:on?(k===2?VIO:AMB):'#b2b6bb',
          'text-anchor':'middle','font-weight':700});
      });
      arw(g,bx+190,y+39,bx+226,y+39,ok?GRN:RED,2.4);
      txt(g,bx+238,y+34,res,{'font-size':15,fill:ok?GRN:RED,'font-weight':700});
      txt(g,bx+238,y+56,note,{'font-size':12,fill:'#8b9096'});
    }
    case_(Y,'1.0  +  2⁻²⁴','exactly half an ulp. the tie case.','1','0','0',
      '1.0',true,'tie goes to even, and 1.0 has an even last bit');
    case_(Y+100,'1.0  +  (2⁻²⁴ + 2⁻⁴⁰)','identical for forty bits, then one more one.','1','0','1',
      '1 + 2⁻²³',false,'sticky is set, so the remainder exceeds half, and it rounds up');
    var YB=Y+206;
    el('rect',{x:30,y:YB,width:1096,height:52,rx:10,fill:'#fbeeed',stroke:RED,'stroke-width':1.8},g);
    txt(g,52,YB+22,'guard and round are identical in both rows. the only difference is forty bits below the point.',
      {'font-size':13.5,fill:'#8a2420','font-weight':700});
    txt(g,52,YB+42,'drop the sticky bit and the second row rounds down, wrong by half an ulp, in a direction that never varies.',
      {'font-size':12.5,fill:'#8a2420'});
  })();

  /* ================= the four cases ================= */
  (function(){
    var g=document.getElementById('figCases'); if(!g) return;
    txt(g,30,22,'ONE INTERVAL BETWEEN TWO REPRESENTABLE NUMBERS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=120, W=900, Y=120;
    el('line',{x1:X0,y1:Y,x2:X0+W,y2:Y,stroke:GREY,'stroke-width':2.4},g);
    [[0,'N','last bit 0, even'],[1,'N + 1 ulp','last bit 1, odd']].forEach(function(e){
      var x=X0+e[0]*W;
      el('circle',{cx:x,cy:Y,r:7,fill:INK},g);
      txt(g,x,Y-22,e[1],{'font-size':14,fill:INK,'text-anchor':'middle','font-weight':700});
      txt(g,x,Y-42,e[2],{'font-size':11.5,fill:'#8b9096','text-anchor':'middle'});
    });
    /* the half point */
    var xm=X0+W/2;
    el('line',{x1:xm,y1:Y-14,x2:xm,y2:Y+14,stroke:RED,'stroke-width':2.4,'stroke-dasharray':'4 3'},g);
    txt(g,xm,Y+34,'exactly half',{'font-size':12.5,fill:RED,'text-anchor':'middle','font-weight':700});

    function mark(frac,lab,bits,dir,col,ay){
      var x=X0+frac*W;
      el('circle',{cx:x,cy:Y,r:5,fill:col},g);
      txt(g,x,Y+56,lab,{'font-size':12,fill:col,'text-anchor':'middle','font-weight':700});
      txt(g,x,Y+73,bits,{'font-size':11.5,fill:'#8b9096','text-anchor':'middle'});
      var tx = dir<0 ? X0 : X0+W;
      arw(g,x,ay,tx,ay,col,2);
    }
    mark(0.22,'below half','guard 0',-1,GRN,Y+88);
    mark(0.74,'above half','guard 1, round or sticky 1',1,AMB,Y+88);
    mark(0.5 ,'the tie','guard 1, round 0, sticky 0',-1,RED,Y+104);

    var YB=236;
    el('rect',{x:30,y:YB,width:540,height:70,rx:10,fill:'#fff',stroke:GREY,'stroke-width':1.6},g);
    txt(g,52,YB+24,'guard 0                     round down',{'font-size':13,fill:GRN,'font-weight':700});
    txt(g,52,YB+46,'guard 1, round or sticky 1  round up',{'font-size':13,fill:AMB,'font-weight':700});
    el('rect',{x:590,y:YB,width:536,height:70,rx:10,fill:'#fbeeed',stroke:RED,'stroke-width':1.8},g);
    txt(g,612,YB+24,'guard 1, round 0, sticky 0  the tie',{'font-size':13,fill:'#8a2420','font-weight':700});
    txt(g,612,YB+46,'go to whichever neighbour leaves the last kept bit even',{'font-size':12.5,fill:'#8a2420'});
  })();

  /* ================= ties to even vs ties away ================= */
  (function(){
    var g=document.getElementById('figTies'); if(!g) return;
    /* verified traces: 10,000 exact ties, error in ulps, sampled every 250 */
    var even=[0,4,-4,-1,-2,8,7,16,25,22,29,25,22,28,32,30,38,36,33,45,38,35,32,23,29,34,11,8,11,18,9,9,15,20,31,34,41,30,35,28];
    var MAXN=40;
    function render(t){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,30,22,'TEN THOUSAND ADDITIONS, EVERY ONE OF THEM AN EXACT TIE',
        {'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
      var X0=110, W=900, Y0=48, H=180, YZ=Y0+H*0.78;
      var SC=H*0.72/5200;   /* ulps to pixels */
      /* axes */
      el('line',{x1:X0,y1:Y0,x2:X0,y2:Y0+H,stroke:GREY,'stroke-width':1.8},g);
      el('line',{x1:X0,y1:YZ,x2:X0+W,y2:YZ,stroke:GREY,'stroke-width':1.8},g);
      txt(g,X0-12,YZ+5,'0',{'font-size':12,fill:'#8b9096','text-anchor':'end'});
      [1000,2000,3000,4000,5000].forEach(function(v){
        var y=YZ-v*SC;
        el('line',{x1:X0,y1:y,x2:X0+W,y2:y,stroke:'#f0eee8','stroke-width':1},g);
        txt(g,X0-12,y+5,String(v),{'font-size':11,fill:'#b2b6bb','text-anchor':'end'});
      });
      txt(g,30,Y0-6,'error in ulps',{'font-size':12,fill:'#8b9096'});
      txt(g,X0+W,YZ+40,'10,000 ties',{'font-size':12,fill:'#8b9096','text-anchor':'end'});

      var n=Math.max(1,Math.round(MAXN*t/8));
      /* ties away: exactly N/2, a straight line */
      var dA='', dE='';
      for(var k=0;k<n;k++){
        var x=X0+(k+1)/MAXN*W;
        var ya=YZ-((k+1)*125)*SC;
        var ye=YZ-even[k]*SC;
        dA+=(k?' L':'M')+x+' '+ya;
        dE+=(k?' L':'M')+x+' '+ye;
      }
      pth(g,dA,{stroke:RED,'stroke-width':3.2});
      pth(g,dE,{stroke:GRN,'stroke-width':3.2});
      if(n>0){
        var xa=X0+n/MAXN*W;
        el('circle',{cx:xa,cy:YZ-(n*125)*SC,r:5,fill:RED},g);
        el('circle',{cx:xa,cy:YZ-even[n-1]*SC,r:5,fill:GRN},g);
      }
      txt(g,X0+W-6,YZ-5000*SC-12,'ties away from zero',{'font-size':13,fill:RED,'text-anchor':'end','font-weight':700});
      txt(g,X0+W-18,YZ-16,'ties to even',{'font-size':13,fill:GRN,'text-anchor':'end','font-weight':700});

      var YB=Y0+H+34;
      el('rect',{x:30,y:YB,width:540,height:60,rx:10,fill:'#fbeeed',stroke:RED,'stroke-width':1.8},g);
      txt(g,52,YB+24,'ties away:  +5000 ulp',{'font-size':14,fill:'#8a2420','font-weight':700});
      txt(g,52,YB+45,'exactly half of ten thousand, because every tie goes the same way',{'font-size':12.5,fill:'#8a2420'});
      el('rect',{x:590,y:YB,width:536,height:60,rx:10,fill:'#e6f1ee',stroke:GRN,'stroke-width':1.8},g);
      txt(g,612,YB+24,'ties to even:  +28 ulp',{'font-size':14,fill:'#0f5a4c','font-weight':700});
      txt(g,612,YB+45,'the ties go both ways, so they cancel. 0.56 per cent of the bias',{'font-size':12.5,fill:'#0f5a4c'});
    }
    ticker('tiRun','tiStep','tiReset',8,render);
  })();

  /* ================= denormals ================= */
  (function(){
    var g=document.getElementById('figDenorm'); if(!g) return;
    txt(g,30,22,'THE FAST PATH, AND THE DOOR OUT OF IT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var Y=70, BH=46, BW=186, X0=40, GAP=22;
    var names=['align','operate','normalise','round'];
    names.forEach(function(nm,k){
      var x=X0+k*(BW+GAP);
      el('rect',{x:x,y:Y,width:BW,height:BH,rx:9,fill:'#e6f1ee',stroke:GRN,'stroke-width':2},g);
      txt(g,x+BW/2,Y+28,nm,{'font-size':14,fill:'#0f5a4c','text-anchor':'middle','font-weight':700});
      if(k<3) arw(g,x+BW,Y+BH/2,x+BW+GAP,Y+BH/2,GRN,2.4);
    });
    arw(g,X0+4*(BW+GAP)-GAP,Y+BH/2,X0+4*(BW+GAP)+30,Y+BH/2,GRN,2.4);
    txt(g,X0+4*(BW+GAP)+40,Y+BH/2+5,'result, a few cycles',{'font-size':12.5,fill:GRN,'font-weight':700});

    /* the detector, above the row */
    var DX=X0+2*(BW+GAP)+BW/2;
    el('path',{d:'M'+DX+' '+(Y-52)+' L'+(DX+50)+' '+(Y-30)+' L'+DX+' '+(Y-8)+' L'+(DX-50)+' '+(Y-30)+' z',
      fill:'#fdf3e3',stroke:AMB,'stroke-width':2},g);
    txt(g,DX,Y-26,'subnormal?',{'font-size':11.5,fill:AMB,'text-anchor':'middle','font-weight':700});
    arw(g,DX,Y-8,DX,Y-1,AMB,2);

    var MY=Y+BH+58;
    arw(g,DX,Y+BH,DX,MY-4,RED,2.6);
    txt(g,DX+12,MY-18,'yes',{'font-size':12.5,fill:RED,'font-weight':700});
    el('rect',{x:DX-250,y:MY,width:500,height:52,rx:10,fill:'#fbeeed',stroke:RED,'stroke-width':2},g);
    txt(g,DX,MY+22,'trap into microcode',{'font-size':14.5,fill:'#8a2420','text-anchor':'middle','font-weight':700});
    txt(g,DX,MY+41,'the processor runs a sequence of ordinary operations on itself',
      {'font-size':12,fill:'#8a2420','text-anchor':'middle'});
    pth(g,'M'+(DX+250)+' '+(MY+26)+' L'+(DX+330)+' '+(MY+26)+' L'+(DX+330)+' '+(Y+BH/2),
      {stroke:RED,'stroke-width':2.4,'stroke-dasharray':'6 4'});
    arw(g,DX+330,Y+BH/2+14,DX+330,Y+BH/2,RED,2.4);
    txt(g,DX+340,MY+30,'tens to hundreds of cycles',{'font-size':12.5,fill:RED,'font-weight':700});

    var YB=MY+76;
    el('rect',{x:30,y:YB,width:1096,height:50,rx:10,fill:'#fff',stroke:GREY,'stroke-width':1.6},g);
    txt(g,52,YB+22,'a subnormal has no implicit leading one, so normalise cannot assume where the significand starts.',
      {'font-size':13.5,fill:INK,'font-weight':700});
    txt(g,52,YB+41,'building a second full data path for a rare case is not worth the silicon, so the rare case leaves the hardware.',
      {'font-size':12.5,fill:'#4b5057'});
  })();

  /* ================= why the flags exist ================= */
  (function(){
    var g=document.getElementById('figFlags'); if(!g) return;
    txt(g,30,22,'THE SAME LOOP, TWICE',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=250, Y=56, BH=48, U=8.1;
    function bar(y,lab,n,col,soft,note){
      var w=Math.max(n*U,6);
      txt(g,X0-18,y+30,lab,{'font-size':13.5,fill:col,'text-anchor':'end','font-weight':700});
      el('rect',{x:X0,y:y,width:w,height:BH,rx:8,fill:soft,stroke:col,'stroke-width':2},g);
      txt(g,X0+w+14,y+30,n+'×',{'font-size':16,fill:col,'font-weight':700});
      if(note) txt(g,X0+w+70,y+30,note,{'font-size':12.5,fill:'#8b9096'});
    }
    bar(Y,'normal operands',1,GRN,'#e6f1ee','the fast path, a few cycles each');
    bar(Y+BH+22,'subnormal operands',100,RED,'#fbeeed','');
    txt(g,X0+100*U-14,Y+2*BH+40,'every one of them trapping',
      {'font-size':12.5,fill:'#8a2420','text-anchor':'end','font-weight':700});

    var Y2=Y+2*BH+54;
    el('rect',{x:30,y:Y2,width:540,height:84,rx:10,fill:'#fff',stroke:GREY,'stroke-width':1.6},g);
    txt(g,52,Y2+24,'two control bits in the floating point unit',{'font-size':13.5,fill:INK,'font-weight':700});
    txt(g,52,Y2+46,'flush to zero      a subnormal result becomes zero',{'font-size':12.5,fill:'#4b5057'});
    txt(g,52,Y2+66,'denormals are zero a subnormal input becomes zero',{'font-size':12.5,fill:'#4b5057'});
    el('rect',{x:590,y:Y2,width:536,height:84,rx:10,fill:'#e6f1ee',stroke:GRN,'stroke-width':1.8},g);
    txt(g,612,Y2+24,'who turns them on, and why it is defensible',{'font-size':13.5,fill:'#0f5a4c','font-weight':700});
    txt(g,612,Y2+46,'audio and graphics, where a number that small is inaudible',{'font-size':12.5,fill:'#0f5a4c'});
    txt(g,612,Y2+66,'and invisible, while a hundred fold stall is neither.',{'font-size':12.5,fill:'#0f5a4c'});
  })();

  /* ================= fused multiply add ================= */
  (function(){
    var g=document.getElementById('figFMA'); if(!g) return;
    txt(g,30,22,'THE COMPRESSOR TREE FROM CLASS 25, WITH ONE MORE ROW',
      {'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=46, Y=48, RW=380, RH=17, GAP=5;
    for(var k=0;k<5;k++){
      el('rect',{x:X0+k*12,y:Y+k*(RH+GAP),width:RW,height:RH,rx:4,fill:'#efe9f7',stroke:VIO,'stroke-width':1.5},g);
    }
    var YC=Y+5*(RH+GAP)+4;
    el('rect',{x:X0,y:YC,width:RW+48,height:RH,rx:4,fill:'#fdf3e3',stroke:AMB,'stroke-width':2.2},g);
    pth(g,'M'+X0+' '+(YC+RH+8)+' L'+(X0+RW+48)+' '+(YC+RH+8),{stroke:GREY,'stroke-width':1.6});
    el('rect',{x:X0,y:YC+RH+18,width:13,height:13,rx:3,fill:'#efe9f7',stroke:VIO,'stroke-width':1.5},g);
    txt(g,X0+20,YC+RH+29,'partial products of a × b',{'font-size':12,fill:VIO,'font-weight':700});
    el('rect',{x:X0,y:YC+RH+38,width:13,height:13,rx:3,fill:'#fdf3e3',stroke:AMB,'stroke-width':1.8},g);
    txt(g,X0+20,YC+RH+49,'c, the addend, at full width',{'font-size':12,fill:AMB,'font-weight':700});

    /* unfused vs fused paths */
    var PX=640, PY=52, BW=116, BH=38;
    function path_(y,lab,boxes,rounds,col,soft){
      txt(g,PX,y-10,lab,{'font-size':12.5,fill:col,'font-weight':700,'letter-spacing':1});
      boxes.forEach(function(b,k){
        var x=PX+k*(BW+34);
        el('rect',{x:x,y:y,width:BW,height:BH,rx:8,fill:soft,stroke:col,'stroke-width':1.8},g);
        txt(g,x+BW/2,y+24,b,{'font-size':12.5,fill:INK,'text-anchor':'middle','font-weight':700});
        if(k<boxes.length-1) arw(g,x+BW,y+BH/2,x+BW+34,y+BH/2,col,2.2);
      });
      rounds.forEach(function(r){
        var x=PX+r*(BW+34)+BW+17;
        el('circle',{cx:x,cy:y+BH/2,r:10,fill:'#fff',stroke:RED,'stroke-width':2.2},g);
        txt(g,x,y+BH/2+4,'R',{'font-size':11.5,fill:RED,'text-anchor':'middle','font-weight':700});
      });
    }
    path_(PY,'UNFUSED, TWO ROUNDINGS',['a × b','+ c'],[0,1],RED,'#fbeeed');
    txt(g,PX,PY+60,'two trips, two roundings, two losses',{'font-size':12,fill:RED});
    path_(PY+112,'FUSED, ONE ROUNDING',['a × b + c'],[0],GRN,'#e6f1ee');
    txt(g,PX,PY+172,'one trip, one rounding, one loss',{'font-size':12,fill:GRN,'font-weight':700});

    var YB=248;
    el('rect',{x:30,y:YB,width:1096,height:72,rx:10,fill:'#e6f1ee',stroke:GRN,'stroke-width':1.8},g);
    txt(g,52,YB+24,'the tree was already built to absorb rows. c is just another row, so the add costs essentially nothing.',
      {'font-size':13.5,fill:'#0f5a4c','font-weight':700});
    txt(g,52,YB+45,'faster, because one pass through the hardware instead of two.',{'font-size':12.5,fill:'#0f5a4c'});
    txt(g,52,YB+64,'more accurate, because the full width product survives all the way to the addition instead of being squeezed first.',
      {'font-size':12.5,fill:'#0f5a4c'});
  })();

  /* ================= fused gives a different answer ================= */
  (function(){
    var g=document.getElementById('figFMAbits'); if(!g) return;
    txt(g,30,22,'a = b = 1 + 2⁻¹²,  c = −1,  IN FLOAT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=190, CW=21, Y=56, H=34;
    function strip(y,lab,s,col,soft,hot){
      txt(g,X0-16,y+22,lab,{'font-size':13,fill:col,'text-anchor':'end','font-weight':700});
      for(var k=0;k<32;k++){
        var isHot = hot!==null && hot!==undefined && k===hot;
        cel(g,X0+k*CW,y,CW-2.2,H,s[k],
          {fill:isHot?'#fbeeed':soft,stroke:isHot?RED:col,col:isHot?RED:(s[k]==='1'?INK:'#b2b6bb'),fs:10});
      }
    }
    strip(Y,'a','0'+'01111111'+'00000000000100000000000',BLUE,'#eaeef7',null);
    strip(Y+H+10,'a × a, rounded','0'+'01111111'+'00000000001000000000000',VIO,'#efe9f7',null);
    txt(g,X0+32*CW+14,Y+H+32,'a tie, rounded to the even side',{'font-size':11.5,fill:VIO});

    var Y2=Y+2*H+34;
    strip(Y2,'unfused  (a×a) + c','0'+'01110100'+'00000000000000000000000',RED,'#fbeeed',null);
    strip(Y2+H+10,'fused    a×a + c','0'+'01110100'+'00000000000010000000000',GRN,'#e6f1ee',21);
    el('rect',{x:X0+21*CW-5,y:Y2-6,width:CW+7,height:2*H+22,rx:5,fill:'none',stroke:RED,
      'stroke-width':2.2,'stroke-dasharray':'5 4'},g);
    txt(g,X0+32*CW+14,Y2+H+32,'one bit apart, and fused is correct',
      {'font-size':11.5,fill:GRN,'font-weight':700});

    var YB=Y2+2*H+34;
    el('rect',{x:30,y:YB,width:1096,height:48,rx:10,fill:'#fbeeed',stroke:RED,'stroke-width':1.8},g);
    txt(g,52,YB+21,'0x1.0p−11 against 0x1.0008p−11. same three inputs, same hardware family, two answers.',
      {'font-size':13.5,fill:'#8a2420','font-weight':700});
    txt(g,52,YB+39,'a compiler that fuses without being asked has changed what your program prints.',
      {'font-size':12.5,fill:'#8a2420'});
  })();

  onSlide=function(idx){};
  paint();
})();
</script>
