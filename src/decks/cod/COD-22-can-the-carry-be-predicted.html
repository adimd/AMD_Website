<style>

#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}

.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.12;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20px;line-height:1.46;max-width:37ch}
p+p{margin-top:10px}

.num{font-family:var(--mono);font-weight:700;color:var(--ink)}

  border-radius:9px;padding:9px 14px;margin-top:9px}

  border:1px solid var(--rule2);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:34px}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.tag.win{background:var(--ok-soft);color:var(--ok)}

#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3.5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}

<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 22</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 22 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="the three questions">
  <div>
    <div class="kicker">class 22 · hour twenty two of fifty</div>
    <h1>Can the carry<br>be predicted?</h1>
    <p class="big" style="margin-top:22px;max-width:48ch">You were asked to bring one idea for knowing the carry into column four without first working out columns one, two and three. Let us find out whether that is possible.</p>
  </div>
  <div class="cue">Take three or four of their ideas before anything goes up. Do not judge them yet. Someone will be close.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the three questions">
  <div>
    <h2>Last session left you a wall, a verdict, and a piece of homework.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>Is it even possible?</strong> Can you know c4 without working out c1, c2 and c3 first? That is your homework, and it gets settled today.</li>
        <li><strong>Is it practical?</strong> If it works for four columns, does it still work for thirty two?</li>
        <li><strong>Was it worth it?</strong> Ripple could not clock past 0.77 GHz. You want 3 GHz. Does this get you there, and what does it cost?</li>
      </ul>
    </div>
  </div>
  <div class="cue">Write 3 GHz on the board. That is the target all hour, and it is the number ripple failed to reach.</div>
</section>

<!-- ================= ACT 1 ================= -->

<section class="slide" data-t="What a column knows alone" data-act="1 · is it even possible">
  <div>
    <div class="kicker">factor the equation, then click any bit to change it</div>
    <h2 style="font-size:27px;margin-bottom:0">Start where the chain is not: what a column knows from its own two bits.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 380" width="1090" height="340"><g id="figKnows"></g></svg></div>
    <div class="btnrow">
      <span class="lab">presets</span>
      <button class="btn" id="bAll1">all ones</button>
      <button class="btn" id="bAll0">all zeros</button>
      <button class="btn" id="bMix">a mixture</button>
      <button class="btn hot" id="bRand">randomise</button>
    </div>
  </div>
  <div class="cue">The factoring hands you an OR for p. XOR is what you use, because it is already built for the sum bit and it stops generate and propagate overlapping. The OR version computes the right carry too.</div>
</section>

<section class="slide" data-t="It still mentions a carry" data-act="1 · is it even possible">
  <div>
    <div class="tag bad">NOT FIXED YET</div>
    <h2 style="font-size:28px;margin-bottom:2px">So write the first carry out, and look at what is still sitting in it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 280" width="1080" height="265"><g id="figStuck"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">where that leaves you</div>
      <ul>
        <li>Every g and every p in the adder is ready at t = 1. Thirty two facts, none of them waiting on anything.</li>
        <li>And the definition of a carry <em>still contains a carry</em>. Naming things did not move the dependency at all.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not rescue them. They need to feel that the new names alone bought nothing.</div>
</section>

<section class="slide" data-t="Two lines and nothing else" data-act="1 · is it even possible">
  <div>
    <div class="kicker">answer out loud before you press step</div>
    <h2 style="font-size:28px;margin-bottom:2px">You have these two lines and nothing else. What can you do?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 380" width="1090" height="358"><g id="figSub"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="sRun">run &#9654;</button>
      <button class="btn" id="sStep">step</button>
      <button class="btn" id="sReset">reset</button>
    </div>
  </div>
  <div class="cue">Wait for somebody to say put the first line into the second. It has to be their move. Then step it.</div>
</section>

<section class="slide" data-t="Your homework, answered" data-act="1 · is it even possible">
  <div>
    <div class="tag win">THE QUESTION YOU WALKED IN WITH</div>
    <h2 style="font-size:27px;margin-bottom:0">c4, written without ever mentioning c1, c2 or c3.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1090" height="330"><g id="figRoutes"></g></svg></div>
    <div class="btnrow">
      <span class="lab">show</span>
      <button class="btn" data-c="2">c2</button>
      <button class="btn" data-c="3">c3</button>
      <button class="btn hot" data-c="4">c4</button>
    </div>
  </div>
  <div class="cue">Say it plainly: this is the answer to what you were asked to bring. Yes, it is possible. Read one route aloud as a sentence.</div>
</section>

<section class="slide" data-t="But how is that allowed" data-act="1 · is it even possible">
  <div>
    <div class="kicker">the objection worth taking seriously</div>
    <h2 style="font-size:27px;margin-bottom:0">Surely the carry has to travel across those columns. It does not.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1090" height="322"><g id="figCrux"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">the sentence to take out of this hour</div>
      <ul>
        <li>Everything that decides the carry into column four was on the table at t = 0. The a bits and the b bits. Nothing else was ever involved.</li>
        <li><strong>A carry is not something that travels. It is something you can compute.</strong></li>
        <li>Ripple was never the carry's nature. It was one way of working it out, and a slow one.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the thesis of the hour. If they remember one sentence, make it the bold one.</div>
</section>

<!-- ================= ACT 2 ================= -->

<section class="slide" data-t="So how fast is it" data-act="2 · is it practical">
  <div>
    <div class="kicker">guess before the reveal: how many gate delays to c4?</div>
    <h2 style="font-size:28px;margin-bottom:2px">Judge it the way you judged ripple: count the depth.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 310" width="1080" height="294"><g id="figDepth"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="dReveal">reveal &#9654;</button>
      <button class="btn" id="dHide">hide</button>
    </div>
  </div>
  <div class="cue">They will guess eight, from ripple. Two is the answer, and it is two for every carry at once.</div>
</section>

<section class="slide" data-t="Now scale it to thirty two" data-act="2 · is it practical">
  <div>
    <div class="kicker">guess first: how many wires arrive at the OR gate for c32?</div>
    <h2 style="font-size:28px;margin-bottom:2px">Two delays for four columns. Now ask for thirty two.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1080" height="322"><g id="figFanin"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">what broke, and what did not</div>
      <ul>
        <li>The maths is fine. c32 really is a sum of 33 routes, and all 33 really are ready at t = 1.</li>
        <li>The gate is not. Class 18 put the fan-in limit at about five, and c4 is the last carry that fits under it.</li>
        <li>So four columns is the widest group you are allowed. That number was chosen for you, not by you.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say clearly that the idea did not fail, the hardware did. Otherwise they think lookahead was wrong.</div>
</section>

<section class="slide" data-t="So chain the blocks" data-act="2 · is it practical">
  <div>
    <div class="kicker">hands up before the next slide: will this reach 3 GHz?</div>
    <h2 style="font-size:28px;margin-bottom:2px">So build blocks of four and pass the carry between them. Does that do it?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 320" width="1080" height="303"><g id="figChain"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">be honest about what this is</div>
      <ul>
        <li>It works, and it is a genuine win: <strong>18 delays against 65</strong>, a ceiling of 2.78 GHz against 0.77.</li>
        <li>But look at what you built. This is ripple again at a coarser grain. Eight waits instead of thirty two.</li>
        <li>And it misses the target. 360 ps is 108% of a 3 GHz cycle. Most textbooks stop here and call it a lookahead adder.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Take the vote. Do not sneer at this design. It is widely built and it is nearly right.</div>
</section>

<section class="slide" data-t="The block's two answers" data-act="2 · is it practical">
  <div>
    <div class="kicker">the same two questions, asked of four columns at once</div>
    <h2 style="font-size:27px;margin-bottom:0">Does this block make a carry? Does it pass one through?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 360" width="1090" height="340"><g id="figBlockGP"></g></svg></div>
    <div class="btnrow">
      <span class="lab">show</span>
      <button class="btn hot" id="gpG">block G</button>
      <button class="btn" id="gpP">block P</button>
      <button class="btn" id="gpBoth">both, and the punchline</button>
    </div>
  </div>
  <div class="cue">Both answers are built only from the columns' own g and p. Neither mentions the carry coming in, which is the whole trick again.</div>
</section>

<section class="slide" data-t="The same circuit, one level up" data-act="2 · is it practical">
  <div>
    <h2>Which means you have already built the circuit for the next level up.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1090" height="312"><g id="figLevelUp"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Same box, same two gate layers, same five wires in. Only the labels on them changed.</li>
        <li>So you do not design anything new. You build one lookahead unit and use it at every level.</li>
        <li>Eight of them cover the columns, two cover those, one covers the last two. Three levels, thirty two columns.</li>
      </ul>
    </div>
  </div>
  <div class="cue">If they ask whether this is recursion, yes. The identical picture does the convincing better than the word.</div>
</section>

<section class="slide" data-t="Where the twelve goes" data-act="2 · is it practical">
  <div>
    <h2>So how long does the whole thing take? Add up every step.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 370" width="1090" height="345"><g id="figTiming"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Everything a level knows has to travel <em>up</em> before any carry can travel back <em>down</em>. That round trip is ten of the twelve.</li>
        <li>Things still wait for each other, <strong>seven times, not thirty two</strong>. That is the whole difference.</li>
        <li>Ripple waits once per column, so its waiting grows with the adder. This waits once per level, and there are only three.</li>
      </ul>
    </div>
  </div>
  <div class="cue">If anyone says the blocks must still ripple, this slide is the answer. They are right that things wait, wrong about how often.</div>
</section>

<!-- ================= ACT 3 ================= -->

<section class="slide" data-t="What it costs" data-act="3 · was it worth it">
  <div>
    <div class="tag bad">COST BEFORE PAYOFF</div>
    <h2 style="font-size:28px;margin-bottom:2px">Before any of the good news: what those twelve delays cost you.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 270" width="1080" height="256"><g id="figCost"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>The lookahead network sits <em>alongside</em> the sum logic from Class 20. It does not replace one gate of it.</li>
        <li>Class 17 spent an hour deleting gates. This hour adds eighty on purpose. Both were right, about different constraints.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not rush this. A student who leaves thinking speed is free has learned the wrong thing today.</div>
</section>

<section class="slide" data-t="What twelve buys" data-act="3 · was it worth it">
  <div>
    <h2>What you bought is not only speed. It is the same answer every time.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 345" width="1080" height="326"><g id="figGuarantee"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Ripple ran anywhere from 3 delays to 65 depending on the numbers, and you had to budget for 65 on every cycle.</li>
        <li>Lookahead is twelve whatever the inputs are. There is no worst case left to protect against.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Last session's histogram collapsed to a single bar. Say that out loud, it is the payoff in one picture.</div>
</section>

<section class="slide" data-t="Does it reach 3 GHz" data-act="3 · was it worth it">
  <div>
    <div class="kicker">the method from last session, one more time</div>
    <h2 style="font-size:28px;margin-bottom:2px">Twelve delays, twenty picoseconds each. Now answer the question on the board.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 330" width="1090" height="315"><g id="figCeiling"></g></svg></div>
    <div class="btnrow">
      <span class="lab">clock</span>
      <button class="btn" data-mhz="500">500 MHz</button>
      <button class="btn" data-mhz="1000">1 GHz</button>
      <button class="btn hot" data-mhz="3000">3 GHz</button>
    </div>
  </div>
  <div class="cue">240 ps into a 333 ps cycle. Ripple could not. This can, with room to spare. 0.77 GHz becomes 4.17.</div>
</section>

<section class="slide" data-t="And at sixty four bits" data-act="3 · was it worth it">
  <div>
    <div class="kicker">commit to an answer for 64 before pressing reveal</div>
    <h2 style="font-size:28px;margin-bottom:2px">Last question of the hour. What happens when the machine gets wider?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 380" width="1080" height="352"><g id="figScaling"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="scReveal">reveal &#9654;</button>
      <button class="btn" id="scHide">hide</button>
    </div>
  </div>
  <div class="cue">Everyone expects 64 to cost more. It costs the same, because the number of levels did not change. This is why 64 bit machines exist.</div>
</section>

<section class="slide" data-t="Why 64 was free" data-act="3 · was it worth it">
  <div>
    <div class="kicker">the reason, not just the result</div>
    <h2 style="font-size:27px;margin-bottom:0">Three levels hold sixty four columns. At thirty two you were using half of one.</h2>

          txt(g,x0-14,ROWS[r]+16,t,{'font-size':11.5,fill:'#8b9096','text-anchor':'end'});
        });
      }
      txt(g,x0+W/2,214,counts[3]+' \u2192 '+counts[2]+' \u2192 '+counts[1]+' \u2192 1',
        {'font-size':13,fill:'#8b9096','text-anchor':'middle','font-weight':700});
      txt(g,x0+W/2,236,'three levels',{'font-size':13.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
    }
    tree(150,32,'32 columns',true);
    tree(650,64,'64 columns',false);
    txt(g,590,132,'vs',{'font-size':17,fill:'#c6c3ba','text-anchor':'middle','font-weight':700});
    /* the capacity bands */
    var BX=150, BW=880, BY=286, BH=42, NB=4;
    txt(g,BX,BY-14,'HOW WIDE AN ADDER EACH DEPTH CAN COVER',{'font-size':10,fill:BLUE,'letter-spacing':1.3});
    for(var k=0;k<NB;k++){
      var x=BX+k*(BW/NB), hot=(k===2);
      el('rect',{x:x,y:BY,width:BW/NB-3,height:BH,rx:8,
        fill:hot?'#eaeef7':'#fbfaf7',stroke:hot?BLUE:'#dedbd3','stroke-width':hot?2.4:1.5},g);
      txt(g,x+(BW/NB)/2,BY+18,(k+1)+' level'+(k?'s':''),
        {'font-size':12,fill:hot?BLUE:'#8b9096','text-anchor':'middle','font-weight':700});
      txt(g,x+(BW/NB)/2,BY+35,'up to '+Math.pow(4,k+1),
        {'font-size':11,fill:hot?BLUE:'#a9a69d','text-anchor':'middle'});
    }
    /* where each width lands */
    function markAt(n,label,col){
      var x=BX+(Math.log(n)/Math.log(4))*(BW/NB);
      el('line',{x1:x,y1:BY-6,x2:x,y2:BY,stroke:col,'stroke-width':2},g);
      el('circle',{cx:x,cy:BY-10,r:5,fill:col},g);
      txt(g,x,BY-20,label,{'font-size':11.5,fill:col,'text-anchor':'middle','font-weight':700});
      return x;
    }
    var x32=markAt(32,'32',BLUE), x64=markAt(64,'64',BLUE);
    markAt(16,'16','#a9a69d'); markAt(128,'128','#a9a69d'); markAt(256,'256','#a9a69d');
    pth(g,'M'+x32+' '+(BY+BH+8)+' L'+x32+' '+(BY+BH+16)+' L'+x64+' '+(BY+BH+16)+' L'+x64+' '+(BY+BH+8),
      {stroke:BLUE,'stroke-width':2.2});
    txt(g,(x32+x64)/2,BY+BH+34,'both inside the same band',
      {'font-size':12.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
    txt(g,34,392,'depth only goes up when the width crosses 4, 16, 64 or 256. doubling from 32 to 64 never crosses one.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  /* ================= two adders, two constraints ================= */
  (function(){
    var g=document.getElementById('figCompare'); if(!g) return;
    txt(g,34,26,'WHAT EACH ONE WINS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.7});
    var rows=[['gate delays',65,18,12],['ceiling, in MHz',769,2778,4167]];
    var X0=250, MAXW=300, Y0=62;
    var NAMES=[['ripple',GRN,'#e9f2ef'],['chained blocks',AMB,'#fbf0dc'],['full hierarchy',BLUE,'#eaeef7']];
    rows.forEach(function(r,k){
      var y=Y0+k*112;
      txt(g,X0-18,y-8,r[0],{'font-size':13.5,fill:INK,'text-anchor':'end','font-weight':700});
      var vals=[r[1],r[2],r[3]], mx=Math.max.apply(null,vals);
      vals.forEach(function(v,i){
        var w=Math.max(12,MAXW*Math.pow(v/mx,0.6));
        var yy=y+i*30;
        el('rect',{x:X0,y:yy,width:w,height:24,rx:6,fill:NAMES[i][2],stroke:NAMES[i][1],'stroke-width':1.9},g);
        txt(g,X0+w+10,yy+17,v,{'font-size':12.5,fill:NAMES[i][1],'font-weight':700});
        if(k===0) txt(g,X0-18,yy+17,NAMES[i][0],{'font-size':11.5,fill:NAMES[i][1],'text-anchor':'end'});
      });
    });
    /* what each one is for */
    var CX=700;
    [['ripple',GRN,'#e9f2ef','fewest gates, simplest wiring','right in anything under 770 MHz'],
     ['chained blocks',AMB,'#fbf0dc','most of the speed, little of the cost','right when you are near, not at, the top'],
     ['full hierarchy',BLUE,'#eaeef7','the only one that clocks past 3 GHz','right when the clock is the constraint']
    ].forEach(function(c,k){
      var y=Y0+k*76;
      el('rect',{x:CX,y:y,width:406,height:64,rx:11,fill:c[2],stroke:c[1],'stroke-width':2},g);
      txt(g,CX+20,y+24,c[0].toUpperCase(),{'font-size':10.5,fill:c[1],'letter-spacing':1.3,'font-weight':700});
      txt(g,CX+20,y+44,c[3],{'font-size':13,fill:c[1],'font-weight':700});
      txt(g,CX+20,y+60,c[4],{'font-size':11,fill:'#8b9096'});
    });
    txt(g,34,300,'not two adders and a winner. a spectrum, and you pick the point your constraint sits at.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();
  onSlide=function(idx){ if(subCtl) subCtl.stop(); };
  paint();
})();
</script>
