<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --hi:#e8952b; --lo:#b9bfc6; --violet:#6b3fa0;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:46px 68px 78px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.eyebrow{position:absolute;top:19px;left:68px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:19px;right:68px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:68px;right:68px;bottom:21px;display:flex;gap:1.5px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:68px;bottom:42px;font-family:var(--mono);font-size:12px;color:var(--soft);z-index:5}
#help{position:absolute;left:68px;bottom:42px;font-family:var(--mono);font-size:11px;color:#adb1b6;letter-spacing:.08em;z-index:5}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.12;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20px;line-height:1.46;max-width:37ch}
p+p{margin-top:10px}
.big{font-size:23.5px;line-height:1.34;color:var(--ink);font-weight:300;max-width:31ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.stack>*+*{margin-top:9px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:9px 14px;margin-top:9px}
.rem .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.rem.win{border-left-color:var(--ok)} .rem.win .h{color:var(--ok)}
.rem.bad{border-left-color:var(--fail)} .rem.bad .h{color:var(--fail)}
.rem ul{list-style:none}
.rem li{font-size:15.5px;line-height:1.36;color:var(--ink);padding:3.5px 0 3.5px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}
.btn{font-family:var(--mono);font-size:12.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btnrow .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft);margin-right:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.tag.win{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--fail-soft);color:var(--fail)}
.tag.new{background:#efe9f7;color:var(--violet)}
.spec{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--rule2);border-radius:11px;overflow:hidden;margin-top:8px}
.spec .c{flex:1;padding:12px 15px;border-right:1px solid var(--rule)}
.spec .c:last-child{border-right:none}
.spec .c .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--soft)}
.spec .c .v{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:3px}
.spec .c .s{font-size:12.5px;color:var(--soft);margin-top:2px}
svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .32s ease}
.frag.shown{opacity:1}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
.cue{position:absolute;left:68px;right:68px;bottom:64px;display:none;padding:9px 13px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.34;font-style:italic;z-index:6}
body.cues .cue{display:block}
#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:38px 68px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3.5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 22</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 22 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<section class="slide" data-t="Title" data-act="picking up where we stopped">
  <div>
    <div class="kicker">class 22 · hour twenty two of fifty</div>
    <h1>Can the carry<br>be predicted?</h1>
    <p class="big" style="margin-top:22px;max-width:47ch">Every carry in your adder waited for the one before it. Today you find out each column already knew its own answer, before any carry existed at all.</p>
  </div>
  <div class="cue">Send-off first. Four lines: 00, 01, 10, 11, and what each column does to a carry. Collect a few answers before anything goes up.</div>
</section>

<section class="slide" data-t="Where we are" data-act="picking up where we stopped">
  <div>
    <h2>Those four lines are already today's idea. You just have not named it yet.</h2>
    <div style="text-align:center;margin-top:4px"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in four moves</div>
      <ul>
        <li>First, turn what you wrote about each column into three names, and see why they were always going to be XOR, not OR.</li>
        <li>Then write every carry directly, as a sum of routes, with no chain and no waiting.</li>
        <li>Then hit a wall at column thirty two, and fix it the same way, one level up.</li>
        <li>Then find out what it costs, what it guarantees, and why sixty four bit machines are possible at all.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say "four names, no chain" up front, so they know today undoes the chain from last time.</div>
</section>

<!-- ================= ACT 1 · WHAT EVERY COLUMN ALREADY KNOWS ================= -->

<section class="slide" data-t="Back to the equation" data-act="1 · what every column already knows">
  <div>
    <h2>You already had this equation. Watch what it does when you factor it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figFactor"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Nothing changed about the circuit. This is the same eight row truth table from Class 19, just grouped differently.</li>
        <li>One piece never looks at <code>cin</code> at all. The other is entirely built from it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do the factoring on the board too, slowly. The piece that stops touching cin is the whole idea.</div>
</section>

<section class="slide" data-t="Three cases, derived" data-act="1 · what every column already knows">
  <div>
    <div class="kicker">check both values of cin for each row</div>
    <h2 style="font-size:28px;margin-bottom:2px">Two of the four rows never move, whatever cin does.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 330" width="1080" height="313"><g id="figCases"></g></svg></div>
  </div>
  <div class="cue">Let them find that 11 and 00 do not care about cin, from the two sub-rows, before you say the word generate.</div>
</section>

<section class="slide" data-t="Why XOR, not OR" data-act="1 · what every column already knows">
  <div>
    <h2>The factoring handed you an OR. Look closely at row eleven before you keep it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1080" height="322"><g id="figXorOr"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">honest caveat</div>
      <ul>
        <li>The OR version is not wrong. Row 11 disagrees with XOR, but generate has already forced the carry to 1 there, so nobody ever asks propagate about it.</li>
        <li>XOR wins on cost, not correctness: it is already built for the sum bit, and it makes generate, propagate and kill exact and non-overlapping.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Keep the OR version honest here. It is correct, just wasteful. Do not let "XOR is right" sound like "OR is wrong".</div>
</section>

<section class="slide" data-t="Neither mentions cin" data-act="1 · what every column already knows">
  <div>
    <div class="tag win">THE HINGE OF THE HOUR</div>
    <h2 style="font-size:28px;margin-bottom:2px">Neither g nor p has cin in it, anywhere.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figGPTiming"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every g and every p in the whole adder is decided by t = 1, one gate delay after a and b arrive.</li>
        <li>Not one of them is waiting on a carry, because not one of them mentions a carry.</li>
        <li>Thirty two facts, all present at once. That is exactly the situation Class 21 told you that you did not have.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is the hinge of the whole session. Let it land before moving on.</div>
</section>

<!-- ================= ACT 2 · WRITING THE CARRIES DIRECTLY ================= -->

<section class="slide" data-t="c1, directly" data-act="2 · writing the carries directly">
  <div>
    <h2>So write the first carry directly, using only things that already exist.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figC1"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">read it as a sentence</div>
      <ul>
        <li>Column zero made a carry on its own, or column zero passed on whatever came in. One of those two things is true.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This looks like nothing new yet. That is fine, it is one column. Push on to c2 before they get bored.</div>
</section>

<section class="slide" data-t="c2, every route" data-act="2 · writing the carries directly">
  <div>
    <h2>c2 has to account for every way a carry could reach it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figC2"></g></svg></div>
  </div>
  <div class="cue">Read each term aloud as a sentence before showing the circuit. The routes are the whole idea.</div>
</section>

<section class="slide" data-t="c3 and c4, same idea" data-act="2 · writing the carries directly">
  <div>
    <h2>Keep going. Every carry still costs one AND layer and one OR layer.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figC34"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Each new carry adds exactly one more route, for the one new column now behind it.</li>
        <li>None of c1 through c4 wait for each other. All four come straight from g's, p's, and c0.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This checks against a ripple adder on twenty thousand random cases. Mention that number if asked.</div>
</section>

<section class="slide" data-t="Two gate delays, always" data-act="2 · writing the carries directly">
  <div>
    <h2>Four columns, four carries, and every single one took two gate delays.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figDepth"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">the promise from last session, kept</div>
      <ul>
        <li>Ripple: c1 costs 2 delays, c4 costs 8. One column really is waiting for the last.</li>
        <li>Lookahead: c1 costs 2 delays, c4 costs 2. No column waits for any other.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say explicitly: this is the loose thread from Class 21, now spent.</div>
</section>

<!-- ================= ACT 3 · HITTING THE WALL AGAIN ================= -->

<section class="slide" data-t="The wall, again" data-act="3 · hitting the wall again">
  <div>
    <h2>Then look at what c32 actually needs.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figFanin"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">class 18, again</div>
      <ul>
        <li>Carry k needs k+1 routes converging on one OR gate. c32 needs a thirty three input OR gate. Nobody builds that.</li>
        <li>Notice where the line gets crossed: at c4, five inputs, the same four columns you just built.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let the "five inputs at c4" observation land. It is the reason the block size is four, not an arbitrary choice.</div>
</section>

<section class="slide" data-t="Blocks of four" data-act="3 · hitting the wall again">
  <div>
    <div class="tag new">THE ACTUAL IDEA</div>
    <h2 style="font-size:28px;margin-bottom:2px">So stop at four, and ask the block the same two questions.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figBlock"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the two questions, one level up</div>
      <ul>
        <li>Does this block generate a carry on its own, whatever comes into it? Call that block G.</li>
        <li>Does this block just pass a carry straight through, untouched? Call that block P.</li>
        <li>Answer those, and the block looks, from outside, exactly like one column.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Slow down here. This is the actual idea. Everything after this is repetition.</div>
</section>

<section class="slide" data-t="Same circuit, one level up" data-act="3 · hitting the wall again">
  <div>
    <h2>The circuit that built c1 through c4 is the circuit that builds the block carries.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figRecursive"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Column g's and p's fed the first circuit. Block G's and P's feed an identical one.</li>
        <li>Same two gate layers, same shape, wired to different signals. Nothing new to design.</li>
      </ul>
    </div>
  </div>
  <div class="cue">If they ask "is this recursion," yes, but the word is not required. The identical picture does the convincing.</div>
</section>

<section class="slide" data-t="Three rounds, thirty two columns" data-act="3 · hitting the wall again">
  <div>
    <h2>Three rounds, and no gate anywhere sees more than five inputs.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1080" height="323"><g id="figRounds"></g></svg></div>
  </div>
  <div class="cue">Do not derive the delay formula on the board. Show the picture, state twelve, move on.</div>
</section>

<!-- ================= ACT 4 · WHAT IT COSTS, WHAT YOU GET ================= -->

<section class="slide" data-t="What it costs" data-act="4 · what it costs, what you get">
  <div>
    <div class="tag bad">COST FIRST</div>
    <h2 style="font-size:28px;margin-bottom:2px">Before any payoff: this circuit is not free.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figCostBars"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>This sits alongside the sum logic from Class 20. It does not replace anything.</li>
        <li>Class 17 spent an hour deleting gates. This hour adds them on purpose. Both were right.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say plainly that both hours were correct about different constraints, or this sounds like Class 17 was wrong.</div>
</section>

<section class="slide" data-t="The guarantee" data-act="4 · what it costs, what you get">
  <div>
    <h2>In exchange: every addition costs exactly twelve gate delays.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figGuarantee"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Ripple has no guarantee. Its worst case was 65 delays, and typical runs still spread across most of that range.</li>
        <li>Lookahead has no worst case to speak of. Twelve delays, every time, whatever the bits are.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is Class 21's histogram, collapsed to a single bar. Say that out loud, it is the whole payoff in one image.</div>
</section>

<section class="slide" data-t="Same units as last time" data-act="4 · what it costs, what you get">
  <div>
    <h2>Put it on Class 21's own budget bar.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 340" width="1090" height="325"><g id="figCeiling"></g></svg></div>
    <div class="btnrow">
      <span class="lab">clock</span>
      <button class="btn" data-f="500">500 MHz</button>
      <button class="btn hot" data-f="1000">1 GHz</button>
      <button class="btn" data-f="3000">3 GHz</button>
    </div>
  </div>
  <div class="cue">Flip between the clock speeds. Let them watch the same 1300 ps bar stay red while the 240 ps bar turns green.</div>
</section>

<section class="slide" data-t="Guess before I show you" data-act="4 · what it costs, what you get">
  <div>
    <div class="kicker">press reveal when they have guessed</div>
    <h2 style="font-size:28px;margin-bottom:2px">Before I show you: what happens at sixty four bits?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figScaling"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="scReveal">reveal &#9654;</button>
      <button class="btn" id="scReset">hide again</button>
    </div>
  </div>
  <div class="cue">Make them guess out loud before revealing 64. The surprise is the entire point of this slide.</div>
</section>

<section class="slide" data-t="Two adders, two constraints" data-act="4 · what it costs, what you get">
  <div>
    <h2>So which one is right? Neither, until you say for what.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figCompare"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the actual skill</div>
      <ul>
        <li>A microcontroller designer choosing lookahead has wasted area for nothing.</li>
        <li>A desktop designer choosing ripple has a machine that will not clock. Knowing which constraint you are under is the actual skill.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not let this sound like lookahead won. Ripple is not a worse adder, it is the right adder somewhere else.</div>
</section>

<!-- ================= CLOSE ================= -->

<section class="slide" data-t="Where we are now" data-act="closing">
  <div>
    <h2>Four down, four to go.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 1140 250" width="1080" height="219"><g id="figArcEnd"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what you are carrying into next session</div>
      <ul>
        <li>A second way to build a fast circuit: ask the same two questions about the group, one level up, as many times as the fan-in makes you.</li>
        <li>An adder with a guaranteed twelve delay cost, at about 40% more gates.</li>
        <li>The reason wide machines are possible at all: the delay stopped caring how wide the adder is.</li>
      </ul>

    var g=document.getElementById('figDepth'); if(!g) return;
    var X0=140, BW=200, GAP=54, Y0=60, H=200;
    txt(g,34,26,'GATE DELAYS TO REACH EACH CARRY',{'font-size':10.5,fill:BLUE,'letter-spacing':1.7});
    el('line',{x1:X0-20,y1:Y0,x2:X0-20,y2:Y0+H,stroke:'#dedbd3','stroke-width':2},g);
    [0,2,4,6,8].forEach(function(v){
      var y=Y0+H-(v/8)*H;
      el('line',{x1:X0-26,y1:y,x2:X0-20,y2:y,stroke:'#dedbd3','stroke-width':2},g);
      txt(g,X0-32,y+4,v,{'font-size':11,'text-anchor':'end'});
    });
    for(var k=1;k<=4;k++){
      var cx=X0+(k-1)*(BW+GAP), rip=2*k, look=2;
      var rh=(rip/8)*H;
      el('rect',{x:cx,y:Y0+H-rh,width:80,rx:8,height:rh,fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
      txt(g,cx+40,Y0+H-rh-10,rip,{'font-size':13,fill:RED,'text-anchor':'middle','font-weight':700});
      var lh=(look/8)*H;
      el('rect',{x:cx+92,y:Y0+H-lh,width:80,rx:8,height:lh,fill:'#eaeef7',stroke:BLUE,'stroke-width':2},g);
      txt(g,cx+132,Y0+H-lh-10,look,{'font-size':13,fill:BLUE,'text-anchor':'middle','font-weight':700});
      txt(g,cx+86,Y0+H+22,'c'+k,{'font-size':13,fill:INK,'text-anchor':'middle','font-weight':700});
    }
    txt(g,X0,Y0-14,'ripple',{'font-size':11.5,fill:RED,'font-weight':700});
    txt(g,X0+92,Y0-14,'lookahead',{'font-size':11.5,fill:BLUE,'font-weight':700});
    txt(g,34,300,'ripple climbs with every column. lookahead stays flat at two, no matter which carry you ask for.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= the wall, again ================= */
  (function(){
    var g=document.getElementById('figFanin'); if(!g) return;
    var X0=90, X1=990, Y0=50, H=190, KMAX=32;
    function xOf(k){ return X0+(k/KMAX)*(X1-X0); }
    function yOf(v){ return Y0+H-(v/33)*H; }
    txt(g,34,26,'ROUTES CONVERGING ON ONE OR GATE, BY CARRY INDEX',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    el('line',{x1:X0,y1:Y0,x2:X0,y2:Y0+H,stroke:'#dedbd3','stroke-width':2},g);
    el('line',{x1:X0,y1:Y0+H,x2:X1,y2:Y0+H,stroke:'#dedbd3','stroke-width':2},g);
    [1,4,8,16,24,32].forEach(function(k){
      el('line',{x1:xOf(k),y1:Y0+H,x2:xOf(k),y2:Y0+H+5,stroke:'#dedbd3','stroke-width':2},g);
      txt(g,xOf(k),Y0+H+20,'c'+k,{'font-size':11,'text-anchor':'middle'});
    });
    [5,33].forEach(function(v){
      el('line',{x1:X0-5,y1:yOf(v),x2:X0,y2:yOf(v),stroke:'#dedbd3','stroke-width':2},g);
      txt(g,X0-11,yOf(v)+4,v,{'font-size':11,'text-anchor':'end'});
    });
    /* the fan-in ceiling */
    el('rect',{x:X0,y:Y0,width:X1-X0,height:yOf(5)-Y0,rx:6,fill:'#fdf0ef','fill-opacity':.55},g);
    el('line',{x1:X0,y1:yOf(5),x2:X1,y2:yOf(5),stroke:RED,'stroke-width':2.4,'stroke-dasharray':'8 5'},g);
    txt(g,X1+8,yOf(5)+4,'5',{'font-size':12,fill:RED,'font-weight':700});
    txt(g,X1+8,yOf(5)+20,'class 18\u2019s limit',{'font-size':10,fill:RED});
    /* the line of growth */
    var pts=[]; for(var k=1;k<=KMAX;k++) pts.push([xOf(k),yOf(k+1)]);
    el('path',{d:pts.map(function(p,k2){return (k2?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' '),
      fill:'none',stroke:INK,'stroke-width':3},g);
    var cx4=xOf(4),cy4=yOf(5);
    el('circle',{cx:cx4,cy:cy4,r:7,fill:'#fff',stroke:RED,'stroke-width':3},g);
    txt(g,cx4,cy4-16,'c4 needs 5, already at the wall',{'font-size':12,fill:RED,'text-anchor':'middle','font-weight':700});
    var cx32=xOf(32),cy32=yOf(33);
    el('circle',{cx:cx32,cy:Y0,r:0},g);
    txt(g,cx32-4,Y0+14,'c32 needs 33',{'font-size':12,fill:INK,'text-anchor':'end','font-weight':700});
    txt(g,34,272,'the line does not bend. it just keeps needing more inputs, one more for every column.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= blocks of four ================= */
  (function(){
    var g=document.getElementById('figBlock'); if(!g) return;
    txt(g,34,26,'FOUR COLUMNS, ASKED THE SAME TWO QUESTIONS TOGETHER',{'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
    el('rect',{x:60,y:56,width:400,height:170,rx:14,fill:'none',stroke:'#c6c3ba','stroke-width':2,'stroke-dasharray':'7 6'},g);
    for(var k=0;k<4;k++){
      var x=84+k*92;
      rct(g,x,86,72,60,{fill:'#fbfaf7',stroke:'#e2e0d9'});
      txt(g,x+36,112,'col '+k,{'font-size':12,fill:INK,'text-anchor':'middle','font-weight':700});
      txt(g,x+36,132,'g'+k+', p'+k,{'font-size':11,fill:'#8b9096','text-anchor':'middle'});
    }
    txt(g,80,242,'four separate answers',{'font-size':13,fill:'#8b9096'});
    pth(g,'M480 140 L580 140 M568 130 l12 10 l-12 10',{stroke:'#c6c3ba','stroke-width':2.6});
    txt(g,530,120,'compress',{'font-size':11.5,fill:'#8b9096','text-anchor':'middle'});
    el('rect',{x:620,y:56,width:220,height:170,rx:16,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.4},g);
    txt(g,730,110,'ONE BLOCK',{'font-size':13,fill:BLUE,'text-anchor':'middle','font-weight':700,'letter-spacing':1.2});
    txt(g,730,150,'G',{'font-size':26,fill:RED,'text-anchor':'middle','font-weight':700});
    txt(g,730,196,'P',{'font-size':26,fill:AMB,'text-anchor':'middle','font-weight':700});
    txt(g,875,120,'does this block make',{'font-size':14,fill:INK});
    txt(g,875,142,'a carry on its own?',{'font-size':14,fill:INK});
    txt(g,875,178,'does this block just',{'font-size':14,fill:INK});
    txt(g,875,200,'pass one through?',{'font-size':14,fill:INK});
    txt(g,34,272,'answer those two questions and the block behaves exactly like a single column, from outside.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= same circuit, one level up ================= */
  (function(){
    var g=document.getElementById('figRecursive'); if(!g) return;
    function miniCircuit(x0,label,ins,outLabel,color){
      txt(g,x0+140,32,label,{'font-size':11,fill:color,'text-anchor':'middle','letter-spacing':1.2,'font-weight':700});
      var Y=[76,116,156,196,236];
      ins.forEach(function(t,k){
        rct(g,x0,Y[k]-14,110,28,{fill:'#fbfaf7',stroke:'#e2e0d9'});
        txt(g,x0+55,Y[k]+5,t,{'font-size':11.5,fill:'#8b9096','text-anchor':'middle'});
        pth(g,'M'+(x0+110)+' '+Y[k]+' L'+(x0+180)+' '+Y[k],{stroke:'#c6c3ba','stroke-width':2});
      });
      gAnd(g,x0+180,156,44,1);
      wire(g,andTip(x0+180,44),156,x0+260,156,1);
      gOr(g,x0+280,156,26,1);
      wire(g,orTip(x0+280,26),156,x0+366,156,1);
      rct(g,x0+366,156-20,108,40,{fill:'#fbf0dc',stroke:AMB});
      txt(g,x0+420,156+5,outLabel,{'font-size':12.5,fill:AMB,'text-anchor':'middle','font-weight':700});
    }
    miniCircuit(30,'COLUMN LEVEL',['g0, g1, g2, g3','p0, p1, p2, p3','c0'],'c1..c4',BLUE);
    miniCircuit(600,'BLOCK LEVEL',['G0, G1, ... G7','P0, P1, ... P7','block c-in'],'block C\u2019s',VIO);
    txt(g,516,160,'=',{'font-size':30,fill:'#c6c3ba','text-anchor':'middle','font-weight':700});
    txt(g,34,272,'same two gate layers, same shape. only the labels on the wires changed.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= three rounds, thirty two columns ================= */
  (function(){
    var g=document.getElementById('figRounds'); if(!g) return;
    var X0=60, X1=1080, rowY=[70,170,270];
    txt(g,34,26,'THIRTY TWO COLUMNS, EIGHT BLOCKS OF FOUR, THREE ROUNDS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.5});
    /* round 1: 32 ticks */
    for(var k=0;k<32;k++){
      var x=X0+k*((X1-X0)/31);
      el('rect',{x:x-4,y:rowY[0]-10,width:8,height:20,rx:2,fill:'#fbf0dc',stroke:AMB,'stroke-width':1.4},g);
    }
    txt(g,X0,rowY[0]-26,'ROUND 1 \u00b7 every column\u2019s own g and p',{'font-size':12,fill:AMB,'font-weight':700});
    /* round 2: 8 blocks */
    for(var b=0;b<8;b++){
      var bx=X0+b*((X1-X0)/7);
      el('rect',{x:bx-22,y:rowY[1]-16,width:44,height:32,rx:6,fill:'#eaeef7',stroke:BLUE,'stroke-width':1.8},g);
      txt(g,bx,rowY[1]+5,'B'+b,{'font-size':11.5,fill:BLUE,'text-anchor':'middle','font-weight':700});
    }
    txt(g,X0,rowY[1]-30,'ROUND 2 \u00b7 each block\u2019s own G, P, and the carry at each block boundary',{'font-size':12,fill:BLUE,'font-weight':700});
    /* round 3: 32 ticks again, resolved */
    for(var k2=0;k2<32;k2++){
      var x2=X0+k2*((X1-X0)/31);
      el('rect',{x:x2-4,y:rowY[2]-10,width:8,height:20,rx:2,fill:'#e6f1ee',stroke:GRN,'stroke-width':1.4},g);
    }
    txt(g,X0,rowY[2]-26,'ROUND 3 \u00b7 every column\u2019s final carry, using its block\u2019s boundary carry',{'font-size':12,fill:GRN,'font-weight':700});
    /* connecting arrows */
    for(var c=0;c<8;c++){
      var cx=X0+c*((X1-X0)/7);
      pth(g,'M'+cx+' '+(rowY[0]+16)+' L'+cx+' '+(rowY[1]-18),{stroke:'#dedbd3','stroke-width':1.8});
      pth(g,'M'+cx+' '+(rowY[1]+18)+' L'+cx+' '+(rowY[2]-16),{stroke:'#dedbd3','stroke-width':1.8});
    }
    txt(g,34,306,'three rounds, and every gate anywhere in the network sees five inputs or fewer.',
      {'font-size':15.5,fill:INK,'font-weight':700});
  })();

  /* ================= what it costs ================= */
  (function(){
    var g=document.getElementById('figCostBars'); if(!g) return;
    var X0=280, MAXW=680, Y1=70, Y2=150, BH=48;
    txt(g,34,26,'GATES FOR A 32-BIT ADDER',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var w1=MAXW*(192/272), w2=MAXW;
    el('rect',{x:X0,y:Y1,width:w1,height:BH,rx:8,fill:'#e9f2ef',stroke:GRN,'stroke-width':2},g);
    txt(g,X0-16,Y1+30,'ripple',{'font-size':14,fill:GRN,'text-anchor':'end','font-weight':700});
    txt(g,X0+w1+14,Y1+30,'192 gates',{'font-size':15,fill:GRN,'font-weight':700});
    el('rect',{x:X0,y:Y2,width:w2,height:BH,rx:8,fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
    txt(g,X0-16,Y2+30,'lookahead',{'font-size':14,fill:RED,'text-anchor':'end','font-weight':700});
    txt(g,X0+w2+14,Y2+30,'272 gates',{'font-size':15,fill:RED,'font-weight':700});
    pth(g,'M'+(X0+w1)+' '+(Y1+BH+10)+' L'+(X0+w1)+' '+(Y2-6),{stroke:'#c6c3ba','stroke-width':1.8,'stroke-dasharray':'4 4'});
    txt(g,34,246,'about 40% more gates, plus wiring that did not exist before, for the same 32-bit add.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= the guarantee ================= */
  (function(){
    var g=document.getElementById('figGuarantee'); if(!g) return;
    var X0=90, X1=1080, Y0=60, H=170;
    txt(g,34,26,'GATE DELAYS FOR A 32-BIT ADD, START TO FINISH',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    el('line',{x1:X0,y1:Y0+H,x2:X1,y2:Y0+H,stroke:'#dedbd3','stroke-width':2},g);
    [0,20,40,65].forEach(function(v){
      var x=X0+(v/65)*(X1-X0);
      el('line',{x1:x,y1:Y0+H,x2:x,y2:Y0+H+5,stroke:'#dedbd3','stroke-width':2},g);
      txt(g,x,Y0+H+20,v,{'font-size':11,'text-anchor':'middle'});
    });
    /* ripple spread */
    var r0=X0+(3/65)*(X1-X0), r1=X0+(65/65)*(X1-X0);
    el('rect',{x:r0,y:Y0+30,width:r1-r0,height:34,rx:8,fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
    txt(g,(r0+r1)/2,Y0+52,'ripple: spreads from 3 to 65',{'font-size':13,fill:RED,'text-anchor':'middle','font-weight':700});
    /* lookahead spike */
    var lx=X0+(12/65)*(X1-X0);
    el('rect',{x:lx-14,y:Y0+96,width:28,height:70,rx:6,fill:'#eaeef7',stroke:BLUE,'stroke-width':2.4},g);
    txt(g,lx,Y0+94,'12, always',{'font-size':13,fill:BLUE,'text-anchor':'middle','font-weight':700});
    txt(g,34,272,'a range you have to plan around, next to a single number you can just rely on.',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  /* ================= same units as last time ================= */
  (function(){
    var g=document.getElementById('figCeiling'); if(!g) return;
    var mhz=1000;
    var LABEL={500:'500 MHz',1000:'1 GHz',3000:'3 GHz'};
    function bar(y,label,ps,color){
      var cyc=1e6/mhz, pct=100*ps/cyc, fits=ps<=cyc;
      var X0=112,W=720,BH=52;
      el('rect',{x:X0,y:y,width:W,height:BH,rx:10,fill:'#fbfaf7',stroke:'#c6c3ba','stroke-width':2},g);
      var w=Math.min(W,W*ps/cyc);
      el('rect',{x:X0,y:y,width:Math.max(w,4),height:BH,rx:10,
        fill:fits?'#e9f2ef':'#fdf0ef',stroke:fits?GRN:RED,'stroke-width':2.4},g);
      txt(g,X0-14,y+32,label,{'font-size':13.5,fill:INK,'text-anchor':'end','font-weight':700});
      var pctText=(pct<10?pct.toFixed(1):Math.round(pct))+'% of the cycle';
      if(w>200) txt(g,X0+14,y+32,ps+' ps \u00b7 '+pctText,{'font-size':13,fill:fits?GRN:RED,'font-weight':700});
      else txt(g,X0+w+12,y+32,ps+' ps \u00b7 '+pctText,{'font-size':13,fill:fits?GRN:RED,'font-weight':700});
      txt(g,X0+W+16,y+32,fits?'fits':'does not fit',{'font-size':14,fill:fits?GRN:RED,'font-weight':700});
    }
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,34,26,'ONE CLOCK CYCLE AT '+LABEL[mhz],{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
      bar(66,'ripple',RIPPLE32,RED);
      bar(150,'lookahead',LOOK32,BLUE);
      var cyc=1e6/mhz;
      txt(g,34,240,'same clock, same picoseconds as Class 21. only the adder changed.',
        {'font-size':15,fill:INK,'font-weight':700});
      if(mhz===3000) txt(g,34,264,'240 ps is 72% of a 3 GHz cycle. ceiling for lookahead: about 4.17 GHz.',
        {'font-size':13.5,fill:'#8b9096'});
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(o){o.classList.remove('hot');});
        b.classList.add('hot'); mhz=+b.getAttribute('data-f'); render();
      };
    });
    render();
  })();

  /* ================= guess before I show you ================= */
  (function(){
    var g=document.getElementById('figScaling'); if(!g) return;
    var widths=[16,32,64,128,256], revealed=false;
    function rounds(n){ return Math.ceil(Math.log(n)/Math.log(4)); }
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var X0=90, X1=1080, Y0=60, H=170;
      txt(g,34,26,'GATE DELAYS TO ADD n BITS WITH LOOKAHEAD',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
      el('line',{x1:X0,y1:Y0+H,x2:X1,y2:Y0+H,stroke:'#dedbd3','stroke-width':2},g);
      widths.forEach(function(n,k){
        var x=X0+k*((X1-X0)/(widths.length-1));
        var known = revealed || n<=32;
        var d=4*rounds(n);
        var h=known?(d/16)*H:14;
        el('rect',{x:x-34,y:Y0+H-h,width:68,rx:8,height:h,
          fill:known?(n===32||n===64?'#eaeef7':'#fbfaf7'):'#f2f0ea',
          stroke:known?(n===32||n===64?BLUE:'#c6c3ba'):'#dedbd3','stroke-width':known&&(n===32||n===64)?2.6:1.6},g);
        txt(g,x,Y0+H-h-12,known?(d+' delays'):'?',
          {'font-size':13,fill:known?(n===32||n===64?BLUE:INK):'#a9a69d','text-anchor':'middle','font-weight':700});
        txt(g,x,Y0+H+22,n+'-bit',{'font-size':12.5,'text-anchor':'middle',fill:INK});
      });
      if(revealed) txt(g,34,268,'32 and 64 bits both take three rounds. doubling the width cost nothing at all.',
        {'font-size':15,fill:INK,'font-weight':700});
      else txt(g,34,268,'16 and 32 bits you already know. guess the rest before revealing.',
        {'font-size':14,fill:'#8b9096'});
    }
    document.getElementById('scReveal').onclick=function(){ revealed=true; render(); };
    document.getElementById('scReset').onclick=function(){ revealed=false; render(); };
    render();
  })();

  /* ================= two adders, two constraints ================= */
  (function(){
    var g=document.getElementById('figCompare'); if(!g) return;
    function col(x0,title,color,rows){
      el('rect',{x:x0,y:36,width:500,height:220,rx:14,fill:'#fbfaf7',stroke:color,'stroke-width':2},g);
      txt(g,x0+250,66,title,{'font-size':14,fill:color,'text-anchor':'middle','font-weight':700,'letter-spacing':1.2});
      rows.forEach(function(r,k){
        var y=100+k*38;
        txt(g,x0+30,y,r[0],{'font-size':12.5,fill:'#8b9096'});
        txt(g,x0+470,y,r[1],{'font-size':14.5,fill:INK,'text-anchor':'end','font-weight':700});
      });
    }
    col(30,'RIPPLE WINS',GRN,[
      ['gates','192'],
      ['wiring','simplest of any adder'],
      ['delay','3 to 65, unpredictable'],
      ['ceiling','0.77 GHz']
    ]);
    col(606,'LOOKAHEAD WINS',BLUE,[
      ['gates','272, about 40% more'],
      ['wiring','block boundaries added'],
      ['delay','12, every single time'],
      ['ceiling','4.17 GHz']
    ]);
    txt(g,568,150,'vs',{'font-size':16,fill:'#c6c3ba','text-anchor':'middle','font-weight':700});
  })();

  onSlide=function(idx){};
  paint();
})();
</script>
</body>
