<style>

}

  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:56px 80px 88px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:26px;left:80px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}

#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:10px}
h1{font-family:var(--display);font-weight:600;font-size:74px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:14px}
p{font-size:22px;line-height:1.45;max-width:36ch}
p+p{margin-top:11px}
.big{font-size:28px;line-height:1.32;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:17.5px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.stack>*+*{margin-top:11px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:14px 16px}

.btn{font-family:var(--mono);font-size:14.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:8px 13px;cursor:pointer}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center;justify-content:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.fx{display:flex;gap:34px;align-items:center;justify-content:center}
.ftab{border-collapse:collapse;font-family:var(--mono)}
.ftab th{font-size:11px;letter-spacing:.14em;color:var(--soft);font-weight:400;padding:0 16px 8px;border-bottom:1px solid var(--rule2)}
.ftab td{padding:0;text-align:center;border-bottom:1px solid var(--rule)}
.ftab td.io{font-size:21px;color:var(--body);padding:10px 16px}
.ftab td.out{padding:5px}
.ftab .cell{width:56px;height:40px;line-height:40px;margin:0 auto;border-radius:7px;cursor:pointer;
  font-size:21px;font-weight:700;border:1px solid var(--rule2);background:#f1efe9;color:#a9a69d;transition:.1s}
.ftab .cell.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fname{font-family:var(--display);font-size:42px;font-weight:600;color:var(--ink);line-height:1.1}
.fnum{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--soft);margin-top:6px}

.map{width:100%;border-collapse:collapse}
.map td{padding:13px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.map tr:last-child td{border-bottom:none}
.map .say{font-size:20px;color:var(--body)}
.map .alg{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent)}
.map .nm{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--amber)}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.three .c{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px;text-align:center}
.three .c .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--soft)}
.three .c .n{font-family:var(--display);font-size:28px;font-weight:600;color:var(--ink);margin:6px 0 8px}
.three .c .d{font-size:17px;color:var(--body);line-height:1.4}
.three .c .a{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);margin-top:10px}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:80px;right:80px;bottom:74px;display:none;padding:10px 14px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:16.5px;line-height:1.4;font-style:italic;z-index:6}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:50px 80px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>

<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 13</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 13 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ===== ACT 1 · THE QUESTION ===== -->

<!-- 01 -->
<section class="slide" data-t="Title" data-act="1 · the question">
  <div>
    <div class="kicker">class 13 · hour thirteen of fifty · arc two opens</div>
    <h1>Can a switch<br>do arithmetic?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Twelve hours writing numbers down, and not one of them can be added to another. Today we start again, from a light switch.</p>
  </div>
  <div class="cue">Collect the send off first. Somebody should have found the overflow flag in a status register.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="You can store 5" data-act="1 · the question">
  <div class="center">
    <h2 style="font-size:50px;margin-bottom:24px">You can store 5.<br>What adds 1 to it?</h2>
    <p class="big" style="max-width:52ch;color:var(--soft)">Not what represents 6. You have known that since Class 4.</p>
    <p class="big frag" style="margin-top:24px;max-width:50ch">What <em>physical thing</em> takes the pattern 101 and produces the pattern 110?</p>
  </div>
  <div class="cue">Let the room try. They will reach for software, and there is no software here yet.</div>
</section>

<!-- ===== ACT 2 · TABLES FROM COPPER ===== -->

<!-- 03 -->
<section class="slide" data-t="Two switches in a row" data-act="2 · tables from copper">
  <div>
    <div class="kicker">flip them. the orange line is the current. fill in all four rows.</div>
    <h2 style="font-size:30px;margin-bottom:4px">Start with two switches on one wire.</h2>
    <div class="bench">
      <div class="panel"><div id="bench1"></div></div>
      <div>
        <table class="tt" id="tab1"></table>
        <div class="ttlab" id="lab1"></div>
        <div class="btnrow"><button class="btn" id="clr1">clear</button></div>
      </div>
    </div>
  </div>
  <div class="cue">Name nothing. Ask the room for combinations until all four rows fill in.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Two switches side by side" data-act="2 · tables from copper">
  <div>
    <div class="kicker">now give the current a second route</div>
    <h2 style="font-size:30px;margin-bottom:4px">The same two switches, wired side by side.</h2>
    <div class="bench">
      <div class="panel"><div id="bench2"></div></div>
      <div>
        <table class="tt" id="tab2"></table>
        <div class="ttlab" id="lab2"></div>
        <div class="btnrow"><button class="btn" id="clr2">clear</button></div>
      </div>
    </div>
  </div>
  <div class="cue">Same two switches, same lamp, different table. Only the copper changed.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="A switch beside the lamp" data-act="2 · tables from copper">
  <div>
    <div class="kicker">and a third place to put a switch</div>
    <h2 style="font-size:30px;margin-bottom:2px">Beside the lamp, not in front of it.</h2>
    <figure>
      <svg viewBox="0 0 1300 300" width="100%" role="img" aria-label="A switch wired across the lamp, shown open and closed">
        <g id="figShort"></g>
      </svg>
    </figure>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Both ends of this switch join the same two points as the lamp, so it offers the current a second route.</li>
        <li>Closed, that route has no lamp in it and almost no resistance, so the current all goes that way and the lamp is dark.</li>
        <li>Open, there is no second route, so the current must pass through the lamp and it lights.</li>
        <li>Switch on, lamp off. One switch, and the output is the opposite of the input.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The phrase short circuit comes from exactly this. The current is taking a shorter path than the one you intended.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Three arrangements" data-act="2 · tables from copper">
  <div>
    <h2>Three ways to lay copper. Three tables.</h2>
    <div class="three" style="margin-top:8px">
      <div class="c">
        <div class="t">IN A ROW</div>
        <div class="n">both, or nothing</div>
        <div class="d">One path through both switches. Open either and the lamp goes out.</div>
      </div>
      <div class="c frag">
        <div class="t">SIDE BY SIDE</div>
        <div class="n">either will do</div>
        <div class="d">Two paths. Close either switch and the current gets through.</div>
      </div>
      <div class="c frag">
        <div class="t">ACROSS THE LAMP</div>
        <div class="n">the opposite</div>
        <div class="d">A shorter route past the lamp. Close it and the lamp goes dark.</div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Nothing so far is mathematics. All three are descriptions of where the copper goes.</li>
        <li>Each table was found by trying every combination, and there were only ever four of them.</li>
        <li>Everything in the next thirty seven hours is built from these three arrangements.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the last line plainly and let it sound absurd. It is true.</div>
</section>

<!-- ===== ACT 3 · THE ONE YOU CANNOT BUILD ===== -->

<!-- 07 -->
<section class="slide" data-t="The staircase" data-act="3 · the one you cannot build">
  <div>
    <div class="kicker">now something you already own</div>
    <h2 style="font-size:30px;margin-bottom:2px">A light with a switch at the bottom of the stairs, and another at the top.</h2>
    <figure>
      <svg viewBox="0 0 1300 330" width="100%" role="img" aria-label="A staircase with a switch at each end controlling one lamp">
        <g id="figStair"></g>
      </svg>
    </figure>
  </div>
  <div class="cue">Ask how it is wired before saying anything. Every house has one and nobody has ever wondered.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="Both arrangements fail" data-act="3 · the one you cannot build">
  <div>
    <h2>Try it with the three arrangements you have.</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p><strong>In a row.</strong> The light is on only when both switches are on, so the person at the top can turn it off but never on.</p>
        <p class="frag"><strong>Side by side.</strong> The light is on when either is on, so the person at the top can turn it on but never off.</p>
        <p class="frag"><strong>Any mixture.</strong> Still fails, and you can spend a while proving that to yourself.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">what is actually required</div>
        <ul>
          <li>Either switch, on its own, must change the answer, whatever position the other one is in.</li>
          <li>An ordinary switch either completes a path or breaks it. It has one job.</li>
          <li>So the fix is not a cleverer arrangement. It is a different <em>kind</em> of switch.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Let them attempt it. Two minutes of failing here makes the next slide land properly.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="The changeover switch" data-act="3 · the one you cannot build">
  <div>
    <div class="kicker">one that moves a connection instead of breaking it</div>
    <h2 style="font-size:30px;margin-bottom:4px">Two changeover switches, and two wires between them.</h2>
    <div class="bench">
      <div class="panel"><div id="bench3"></div></div>
      <div>
        <table class="tt" id="tab3"></table>
        <div class="ttlab" id="lab3"></div>
        <div class="btnrow"><button class="btn" id="clr3">clear</button></div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none;margin-top:10px">
      <div class="h">remember</div>
      <ul>
        <li>The lamp lights when both switches point at the same wire. Flip either one and it changes, every time.</li>
        <li>That is called <strong>XNOR</strong>. Relabel one switch's two positions and it becomes <strong>XOR</strong>. Identical copper, different names.</li>
        <li>It needed a better switch and twice the wire. Remember that when the adder arrives in Class 19.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flip a, then b, then a again. The lamp changes on every single press, which is the property they were asked for.</div>
</section>

<!-- ===== ACT 4 · SOMEBODY ALREADY DID THE MATHS ===== -->

<!-- 10 -->
<section class="slide" data-t="Boole" data-act="4 · the maths already existed">
  <div>
    <div class="kicker">lincoln, england, 1847</div>
    <h2 style="font-size:40px;margin-bottom:14px">Ninety years before any<br>of this was wired up.</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>George Boole, largely self taught, running a school. He asks what happens if the letters in an algebra stand for statements rather than quantities.</p>
        <p class="frag">His variables take two values. His operations are and, or and not. He proves the laws you would expect, and several you would not.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>He had no machine in mind. There were no machines to have in mind.</li>
          <li>He was formalising human reasoning and thought of it as philosophy.</li>
          <li>It sat in logic departments for ninety years, admired and unused.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">1847 is eleven years before Babbage died, and they never connected. Both halves of this course existed at once and did not meet.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="Shannon lines them up" data-act="4 · the maths already existed">
  <div>
    <div class="kicker">mit, 1937 · claude shannon, aged twenty one</div>
    <h2 style="font-size:30px;margin-bottom:6px">He put your three arrangements next to Boole's three operations.</h2>
    <table class="map">
      <tr>
        <td style="width:25%"><svg viewBox="0 0 250 60" width="230" height="54"><g id="mSer"></g></svg></td>
        <td class="say" style="width:27%">lit only when<br>both are closed</td>
        <td class="alg" style="width:20%">a &middot; b</td>
        <td class="nm">BOOLE CALLED THIS<br>CONJUNCTION</td>
      </tr>
      <tr class="frag">
        <td><svg viewBox="0 0 250 60" width="230" height="54"><g id="mPar"></g></svg></td>
        <td class="say">lit when<br>either is closed</td>
        <td class="alg">a + b</td>
        <td class="nm">BOOLE CALLED THIS<br>DISJUNCTION</td>
      </tr>
      <tr class="frag">
        <td><svg viewBox="0 0 250 60" width="230" height="54"><g id="mNot"></g></svg></td>
        <td class="say">lit only when<br>the switch is open</td>
        <td class="alg">a&#772;</td>
        <td class="nm">BOOLE CALLED THIS<br>NEGATION</td>
      </tr>
    </table>
    <p class="big frag" style="margin-top:10px;max-width:none;font-size:25px">Every row matched. Not an analogy: the same structure, so <strong>every theorem Boole proved became a fact about copper.</strong></p>
  </div>
  <div class="cue">His master's thesis, 1937, about twenty pages. Often called the most consequential master's thesis ever written.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="A law is a circuit" data-act="4 · the maths already existed">
  <div>
    <div class="kicker">and here is what that is worth</div>
    <h2 style="font-size:30px;margin-bottom:2px">Boole proved <span class="num">a &middot; (b + c) = a&middot;b + a&middot;c</span> on paper in 1847.</h2>
    <figure>
      <svg viewBox="0 0 1300 290" width="100%" role="img" aria-label="Two circuits that behave identically, proved equal by algebra">
        <g id="figLaw"></g>
      </svg>
    </figure>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Two arrangements of copper. Three switches on the left, four on the right, and identical behaviour on all eight combinations.</li>
        <li>You could check that by building both and trying every input, which takes a while.</li>
        <li>Or you can read it off a line of algebra somebody wrote before electricity was practical.</li>
        <li>The left circuit is cheaper. Algebra is how you find the cheaper one without building either.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Doing this properly is Class 17. Today only show that the possibility exists.</div>
</section>

<!-- ===== ACT 5 · HOW FAR DOES THIS GO ===== -->

<!-- 13 -->
<section class="slide" data-t="Sixteen and no more" data-act="5 · how far it goes">
  <div>
    <div class="kicker">click the output cells. find all sixteen.</div>
    <h2 style="font-size:30px;margin-bottom:6px">How many different things can two switches decide?</h2>
    <div class="fx">
      <table class="ftab" id="fxTab"></table>
      <div style="text-align:center;min-width:280px">
        <div class="fname" id="fxName">AND</div>
        <div class="fnum" id="fxNum">FUNCTION 1 OF 16</div>
        <div class="btnrow" style="justify-content:center">
          <button class="btn" id="fxPrev">&#9664;</button>
          <button class="btn hot" id="fxNext">next &#9654;</button>
          <button class="btn" id="fxReset">reset</button>
        </div>
        <div class="ttlab" id="fxFound"></div>
      </div>
      <div style="max-width:30ch">
        <p class="small" style="font-size:19px;color:var(--body)">A function of two switches is just a decision about what the lamp does in each of four situations.</p>
        <p class="small frag" style="font-size:19px;color:var(--body)">Four decisions, two answers each.</p>

    drawFx();
  }

  /* ============ the byte-wide AND ============ */
  var fb=document.getElementById('figByte');
  if(fb){
    var a=[1,0,1,1,0,1,0,0], b=[0,1,1,0,1,1,0,1], s='', X0=210, GAP=132;
    function cx(k){ return X0+k*GAP; }

    s+='<text x="170" y="52" font-size="17" fill="#15171b" text-anchor="end">a</text>';
    s+='<text x="170" y="104" font-size="17" fill="#15171b" text-anchor="end">b</text>';
    s+='<text x="170" y="272" font-size="17" fill="#23408f" text-anchor="end">a &amp; b</text>';
    s+='<text x="170" y="20" font-size="12" fill="#8b9096" text-anchor="end">0xB4</text>';
    s+='<text x="170" y="126" font-size="12" fill="#8b9096" text-anchor="end">0x6D</text>';
    s+='<text x="170" y="294" font-size="12" fill="#8b9096" text-anchor="end">0x24</text>';

    for(var k=0;k<8;k++){
      var x=cx(k), o=a[k]&&b[k]?1:0;
      s+='<text x="'+x+'" y="20" font-size="11.5" fill="'+GREY+'" text-anchor="middle">BIT '+(7-k)+'</text>';
      /* the two input bits */
      s+='<rect x="'+(x-24)+'" y="30" width="48" height="30" rx="5" fill="#fff" stroke="'+GREY+'"/>';
      s+='<text x="'+x+'" y="52" font-size="19" font-weight="700" fill="'+INK+'" text-anchor="middle">'+a[k]+'</text>';
      s+='<rect x="'+(x-24)+'" y="82" width="48" height="30" rx="5" fill="#fff" stroke="'+GREY+'"/>';
      s+='<text x="'+x+'" y="104" font-size="19" font-weight="700" fill="'+INK+'" text-anchor="middle">'+b[k]+'</text>';
      /* its own circuit */
      s+='<rect x="'+(x-46)+'" y="126" width="92" height="102" rx="9" fill="'+(o?'#fbf0dc':'#faf9f6')+
         '" stroke="'+(o?'#b06a12':'#e2e0d9')+'" stroke-width="'+(o?2:1)+'"/>';
      s+=wire(x-30,152,x-16,152,o,3)+blade(x,152,a[k],o&&a[k],14)+wire(x+16,152,x+30,152,o,3);
      s+=wire(x-30,186,x-16,186,o,3)+blade(x,186,b[k],o,14)+wire(x+16,186,x+30,186,o,3);
      /* the result */
      s+='<rect x="'+(x-24)+'" y="248" width="48" height="30" rx="5" fill="'+(o?'#fbf0dc':'#fff')+
         '" stroke="'+(o?'#b06a12':GREY)+'"/>';
      s+='<text x="'+x+'" y="270" font-size="19" font-weight="700" fill="'+(o?'#b06a12':INK)+'" text-anchor="middle">'+o+'</text>';
    }

    /* the wire that does not exist */
    s+='<path d="M'+(cx(4)+46)+' 177 L'+(cx(3)-46)+' 177" stroke="#a8231f" stroke-width="2.5" stroke-dasharray="7 6"/>';
    s+='<path d="M'+(cx(3)-46)+' 177 l14 -7 l0 14 z" fill="#a8231f"/>';
    s+='<text x="'+((cx(3)+cx(4))/2)+'" y="164" font-size="13" fill="#a8231f" text-anchor="middle">no wire here</text>';
    s+='<text x="210" y="322" font-size="15" fill="#8b9096">EIGHT COPIES OF THE SAME CIRCUIT, ALL SETTLING AT THE SAME INSTANT</text>';
    fb.innerHTML=s;
  }

  paint();
})();
</script>
</body>
</html>
