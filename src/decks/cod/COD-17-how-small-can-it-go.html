<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 17 · How small can it go?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --hi:#e8952b; --lo:#b9bfc6; --violet:#6b3fa0;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:48px 70px 80px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:20px;left:70px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:20px;right:70px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:70px;right:70px;bottom:22px;display:flex;gap:1.5px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:70px;bottom:44px;font-family:var(--mono);font-size:12px;color:var(--soft);z-index:5}
#help{position:absolute;left:70px;bottom:44px;font-family:var(--mono);font-size:11px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.kicker b{color:var(--accent);font-weight:400}
h1{font-family:var(--display);font-weight:600;font-size:62px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:29px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20px;line-height:1.44;max-width:36ch}
p+p{margin-top:8px}
.big{font-size:24px;line-height:1.3;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:15.5px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.stack>*+*{margin-top:8px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:20px;align-items:flex-start;justify-content:center}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:9px 13px;margin-top:9px}
.rem .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.rem.win{border-left-color:var(--ok)} .rem.win .h{color:var(--ok)}
.rem ul{list-style:none}
.rem li{font-size:15.5px;line-height:1.34;color:var(--ink);padding:3px 0 3px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}

.btn{font-family:var(--mono);font-size:12.5px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 11px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;justify-content:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.expr{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);
  background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:10px 15px;text-align:center;line-height:1.5}
.expr .dim{color:var(--soft);font-weight:400;font-size:13px}

.tally{display:flex;align-items:stretch;justify-content:center;margin-top:2px}
.tally .c{flex:1;text-align:center;padding:11px 10px;border-right:1px solid var(--rule)}
.tally .c:last-child{border-right:none}
.tally .c .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--soft)}
.tally .c .v{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.05;margin-top:3px}
.tally .c .s{font-size:13px;color:var(--soft);margin-top:2px}

.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.tag.new{background:#efe9f7;color:var(--violet)}
.tag.win{background:var(--ok-soft);color:var(--ok)}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .3s ease}
.frag.shown{opacity:1}
.kc{cursor:pointer;transition:fill .15s ease}
.step{opacity:.15;transition:opacity .35s ease}
.step.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag,.kc,.step{transition:none}}
.cue{position:absolute;left:70px;right:70px;bottom:66px;display:none;padding:8px 12px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:14.5px;line-height:1.34;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:40px 70px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:50px}
#jump li{padding:3px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15px;color:var(--body);display:flex;gap:11px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:30px}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 17</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 17 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ================= OPENING ================= -->

<section class="slide" data-t="Title" data-act="opening">
  <div>
    <div class="kicker">class 17 · hour seventeen of fifty</div>
    <h1>How small<br>can it go?</h1>
    <p class="big" style="margin-top:22px;max-width:46ch">Three problems. Each one gets solved completely before the next one starts, and each one needs exactly one thing you have not seen yet.</p>
  </div>
  <div class="cue">Collect the send off. Somebody will have shrunk bar c by hand, and that is problem three.</div>
</section>

<section class="slide" data-t="Three problems" data-act="opening">
  <div>
    <h2>The hour, in advance.</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:4px">
      <div class="panel" style="padding:18px 20px">
        <div class="tag">PROBLEM ONE</div>
        <div style="font-family:var(--display);font-size:23px;font-weight:600;color:var(--ink);margin:2px 0 8px">A boiler with three sensors</div>
        <div style="font-size:15.5px;line-height:1.4;margin-bottom:10px">Small enough that you can see the waste by staring at it.</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--fail)">4 AND gates</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--ok)">3 AND gates</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">PROBLEM TWO</div>
        <div style="font-family:var(--display);font-size:23px;font-weight:600;color:var(--ink);margin:2px 0 8px">Is the digit prime?</div>
        <div style="font-size:15.5px;line-height:1.4;margin-bottom:10px">Sixteen rows. Staring stops working, so we need a better way to look.</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--fail)">4 AND gates</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--ok)">2 AND gates</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div class="tag">PROBLEM THREE</div>
        <div style="font-family:var(--display);font-size:23px;font-weight:600;color:var(--ink);margin:2px 0 8px">Bar c of the display</div>
        <div style="font-size:15.5px;line-height:1.4;margin-bottom:10px">The debt from last session. The better way of looking is still not enough.</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--fail)">9 AND gates</div>
        <div style="font-family:var(--mono);font-size:14px;color:var(--ok)">none at all</div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the shape of each one</div>
      <ul>
        <li>State the problem. Write the table. Build it the Class 15 way and count the gates.</li>
        <li>Then find what the building method could not see, fix it, and rebuild.</li>
        <li>Nothing is left half done. Each problem finishes before the next one is mentioned.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Promise the nine to none now. It sounds impossible and it makes them watch through two other problems to get there.</div>
</section>

<!-- ================= PROBLEM 1 ================= -->

<section class="slide" data-t="P1 · the problem" data-act="problem 1 · the boiler">
  <div>
    <div class="kicker"><b>problem one</b> &nbsp;·&nbsp; state it, then table it</div>
    <h2 style="font-size:28px;margin-bottom:4px">Three sensors on a boiler. Shut it down if at least two say the temperature is too high.</h2>
    <div class="split" style="margin-top:2px;gap:40px">
      <div style="display:flex;justify-content:flex-end">
        <div class="panel"><svg viewBox="0 0 350 356" width="320" height="326"><g id="tabMaj"></g></svg></div>
      </div>
      <div class="stack">
        <p>Nobody said the word logic. It is a rule about sensors, said the way a plant engineer would say it.</p>
        <p class="frag">Three inputs means eight situations, and you decide what happens in each. That is the whole specification.</p>
        <p class="big frag" style="margin-top:4px">Four of the eight want a shutdown, so the Class 15 method gives four detectors.</p>
      </div>
    </div>
  </div>
  <div class="cue">Fill the eight rows aloud with the room. Forty seconds, and it settles that the table is not the hard part.</div>
</section>

<section class="slide" data-t="P1 · as built" data-act="problem 1 · the boiler">
  <div>
    <div class="kicker"><b>problem one</b> &nbsp;·&nbsp; built the class fifteen way &nbsp;·&nbsp; click any input</div>
    <h2 style="font-size:27px;margin-bottom:0">Four detectors, four AND gates, twelve wires into them.</h2>
    <div style="text-align:center"><div id="bMajBefore"></div></div>
    <div class="rem" style="max-width:none">
      <div class="h">look at it before moving on</div>
      <ul>
        <li>Every gate tests all three sensors. The bottom two gates differ by one wire and nothing else.</li>
        <li>Sum of products walks down the table writing one detector per row. It never compares two rows.</li>
        <li>So it cannot notice a near duplicate, and there are three of them on this board.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Ask them to find the near duplicate pairs on the drawing. They will find at least one unaided.</div>
</section>

<section class="slide" data-t="P1 · the near duplicate" data-act="problem 1 · the boiler">
  <div>
    <div class="kicker"><b>problem one</b> &nbsp;·&nbsp; take two of the four and line them up</div>
    <h2 style="font-size:28px;margin-bottom:2px">These two agree on everything except s1, and between them they cover both values of it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 270" width="1080" height="255"><g id="figShare"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">so ask the obvious question</div>
      <ul>
        <li>Whatever s1 happens to be doing, one of these two detectors fires. Both mean shut down.</li>
        <li>So why is anybody testing s1 at all?</li>
      </ul>
    </div>
  </div>
  <div class="cue">Get a student to say the last line before you do. It is the entire hour in one sentence.</div>
</section>

<section class="slide" data-t="P1 · the merge" data-act="problem 1 · the boiler">
  <div>
    <div class="tag new">NEW TECHNIQUE &nbsp;·&nbsp; THE MERGE</div>
    <h2 style="font-size:28px;margin-bottom:2px">Click the algebra to step through it, then press merge.</h2>
    <div class="row" style="align-items:center;gap:26px">
      <div><svg viewBox="0 0 640 250" width="580" height="227"><g id="figAlg"></g></svg></div>
      <div><svg viewBox="0 0 560 250" width="500" height="223"><g id="figMerge"></g></svg></div>
    </div>
    <div class="btnrow"><button class="btn hot" id="mBtn">merge &#9654;</button></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Factor out what they share, then a variable or its opposite is always true, then anding with true changes nothing.</li>
        <li>Nothing was approximated. All three lines are equalities, proved by Boole in 1847 and made facts about copper by Shannon in 1937.</li>
        <li>You never build a circuit to check a simplification. The algebra already settled it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Click the algebra panel to advance a line at a time, and write each line on the board as it appears.</div>
</section>

<section class="slide" data-t="P1 · all three" data-act="problem 1 · the boiler">
  <div>
    <div class="kicker"><b>problem one</b> &nbsp;·&nbsp; the same move fits in three places</div>
    <h2 style="font-size:28px;margin-bottom:2px">Step through them.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 280" width="1100" height="266"><g id="figThree"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="t1">merge 1</button>
      <button class="btn" id="t2">merge 2</button>
      <button class="btn" id="t3">merge 3</button>
    </div>
  </div>
  <div class="cue">The all ones term gets merged three separate times. A term may be reused, and that surprises people.</div>
</section>

<section class="slide" data-t="P1 · solved" data-act="problem 1 · the boiler">
  <div>
    <div class="tag win">PROBLEM ONE &nbsp;·&nbsp; SOLVED</div>
    <h2 style="font-size:27px;margin-bottom:0">Three gates of two inputs, and it reads like the problem statement.</h2>
    <div style="text-align:center"><div id="bMajAfter"></div></div>
    <div class="split" style="gap:20px;margin-top:2px">
      <div class="tally" style="margin:0">
        <div class="c"><div class="l">AS BUILT</div><div class="v" style="color:var(--fail)">4</div><div class="s">AND gates &middot; 12 wires</div></div>
        <div class="c"><div class="l">SOLVED</div><div class="v" style="color:var(--ok)">3</div><div class="s">AND gates &middot; 6 wires</div></div>
      </div>
      <div class="rem win" style="margin-top:0">
        <div class="h">what this problem taught</div>
        <ul>
          <li><strong>The merge.</strong> Two terms differing in one variable become one term without it.</li>
          <li>Read the answer aloud: shut down if one and two agree, or one and three, or two and three. That is the original sentence.</li>
          <li>This worked because eight rows fit in your head. The next problem has sixteen.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">The minimal form is very often the one a human would have written. Say so, then move on.</div>
</section>

<!-- ================= PROBLEM 2 ================= -->

<section class="slide" data-t="P2 · the problem" data-act="problem 2 · is it prime">
  <div>
    <div class="kicker"><b>problem two</b> &nbsp;·&nbsp; new problem, same method</div>
    <h2 style="font-size:28px;margin-bottom:4px">The pump display drives a small lamp. Light it when the digit showing is prime.</h2>
    <div class="split" style="margin-top:2px;gap:40px">
      <div style="display:flex;justify-content:flex-end">
        <div class="panel"><svg viewBox="0 0 360 400" width="330" height="367"><g id="tabPrime"></g></svg></div>
      </div>
      <div class="stack">
        <p>The four wires already carry the digit in binary. The primes below ten are 2, 3, 5 and 7.</p>
        <p class="frag">Four inputs means sixteen rows, of which ten are digits. Four of those ten want the lamp on.</p>
        <p class="big frag" style="margin-top:4px">So again, four detectors. But each one now tests four wires instead of three.</p>
      </div>
    </div>
  </div>
  <div class="cue">There is no pattern in the primes. That is the point, and it is why nobody can guess this circuit.</div>
</section>

<section class="slide" data-t="P2 · as built" data-act="problem 2 · is it prime">
  <div>
    <div class="kicker"><b>problem two</b> &nbsp;·&nbsp; built the class fifteen way &nbsp;·&nbsp; click any input</div>
    <h2 style="font-size:27px;margin-bottom:0">Four AND gates, sixteen wires into them.</h2>
    <div style="text-align:center"><div id="bPrimeBefore"></div></div>
    <div class="rem" style="max-width:none">
      <div class="h">now try what worked last time</div>
      <ul>
        <li>Look for two terms differing in exactly one variable. There are sixteen rows and each has four possible neighbours.</li>
        <li>That is thirty two pairs to check, on a table written in counting order that scatters them.</li>
        <li>It is doable and it is horrible, and at five variables it stops being doable at all.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Give them ninety seconds to try. Some will find one pair. Nobody will be confident they found all of them.</div>
</section>

<section class="slide" data-t="P2 · a better way to look" data-act="problem 2 · is it prime">
  <div>
    <div class="tag new">NEW TECHNIQUE &nbsp;·&nbsp; THE MAP</div>
    <h2 style="font-size:28px;margin-bottom:2px">Rearrange the table so that mergeable means touching.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 300" width="1090" height="282"><g id="figGray"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Counting order steps 01 to 10 and changes both bits at once, so those two rows can never merge and sit next to each other anyway.</li>
        <li>Gray order changes exactly one bit at every step, so every neighbour is a possible merge.</li>
        <li>It also <strong>wraps</strong>: the last entry is one bit from the first. Half of all mistakes in this topic come from forgetting that.</li>
        <li>Frank Gray and Maurice Karnaugh, both at Bell Labs, both in 1953.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say the wrap twice here and a third time on the next slide.</div>
</section>

<section class="slide" data-t="P2 · the map" data-act="problem 2 · is it prime">
  <div>
    <div class="kicker"><b>problem two</b> &nbsp;·&nbsp; the same sixteen rows, laid out in gray order both ways</div>
    <h2 style="font-size:27px;margin-bottom:2px">Now the merges are visible without looking for them.</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 600 450" width="470" height="353"><g id="kmPrime"></g></svg></div>
      <div style="max-width:33ch">
        <div class="expr" id="kmPrimeExpr"></div>
        <div class="rem" style="margin-top:9px">
          <div class="h">the rules for circling</div>
          <ul>
            <li>Rectangles of 1, 2, 4 or 8 cells. Never 3, never 6, because those do not cover a variable completely.</li>
            <li>As large as they will go. Each doubling of a circle deletes one more literal from its term.</li>
            <li>Circles may overlap and may wrap round the edges. Overlap is free.</li>
            <li>Every 1 must be inside a circle, and no circle may touch a 0.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Click cells to show them a wrap-around circle and a group of four before you settle back on the primes.</div>
</section>

<section class="slide" data-t="P2 · solved" data-act="problem 2 · is it prime">
  <div>
    <div class="tag win">PROBLEM TWO &nbsp;·&nbsp; SOLVED</div>
    <h2 style="font-size:27px;margin-bottom:0">Two gates of three inputs. Sixteen wires became six.</h2>
    <div style="text-align:center"><div id="bPrimeAfter"></div></div>
    <div class="split" style="gap:20px;margin-top:2px">
      <div class="tally" style="margin:0">
        <div class="c"><div class="l">AS BUILT</div><div class="v" style="color:var(--fail)">4</div><div class="s">AND gates &middot; 16 wires</div></div>
        <div class="c"><div class="l">SOLVED</div><div class="v" style="color:var(--ok)">2</div><div class="s">AND gates &middot; 6 wires</div></div>
      </div>

  var GRAY=[0,1,3,2];
  function kmap(hostId,exprId,nvars,initial,names,opts){
    var host=document.getElementById(hostId); if(!host) return;
    opts=opts||{};
    var cells=initial.slice(), rows=nvars===3?2:4, cols=4;
    var CW=nvars===3?96:104, CH=nvars===3?92:76;
    var X0=nvars===3?120:130, Y0=nvars===3?92:96;
    var PAL=[BLUE,RED,GRN,AMB,VIO];
    function idx(r,c){ return nvars===3?((r<<2)|GRAY[c]):((GRAY[r]<<2)|GRAY[c]); }
    function pos(m){ return nvars===3?[m>>2&1,GRAY.indexOf(m&3)]:[GRAY.indexOf(m>>2&3),GRAY.indexOf(m&3)]; }
    function draw(){
      host.innerHTML='';
      var ones=[],dcs=[];
      cells.forEach(function(v,m){ if(v===1) ones.push(m); else if(v===2) dcs.push(m); });
      var terms=ones.length?minimise(nvars,ones,dcs):[];
      var colLab=nvars===3?names.slice(1).join(' '):names.slice(2).join(' ');
      var rowLab=nvars===3?names[0]:names.slice(0,2).join(' ');
      txt(host,X0-30,Y0-46,rowLab,{'font-size':14,fill:INK,'font-weight':700,'text-anchor':'end'});
      txt(host,X0+18,Y0-46,colLab,{'font-size':14,fill:INK,'font-weight':700});
      pth(host,'M'+(X0-26)+' '+(Y0-62)+' L'+(X0-2)+' '+(Y0-38),{stroke:GREY,'stroke-width':1.5});
      ['00','01','11','10'].forEach(function(c,j){ txt(host,X0+j*CW+CW/2,Y0-14,c,{'font-size':13,'text-anchor':'middle'}); });
      (nvars===3?['0','1']:['00','01','11','10']).forEach(function(r,ri){
        txt(host,X0-14,Y0+ri*CH+CH/2+5,r,{'font-size':13,'text-anchor':'end'}); });
      for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
        var m=idx(r,c), v=cells[m];
        var rr=el('rect',{x:X0+c*CW,y:Y0+r*CH,width:CW,height:CH,
          fill:v===1?'#fbf0dc':(v===2?'#f2f0fa':'#fff'),stroke:GREY,'stroke-width':1.5,'class':'kc'},host);
        rr.onclick=(function(mm){ return function(){ cells[mm]=(cells[mm]+1)%(opts.allowX?3:2); draw(); }; })(m);
        txt(host,X0+c*CW+CW/2,Y0+r*CH+CH/2+9,v===2?'X':v,
          {'font-size':24,fill:v===1?AMB:(v===2?VIO:'#c6c3ba'),'text-anchor':'middle','font-weight':700,'pointer-events':'none'});
        var lab = opts.digit && m<10 ? m : (opts.digit? '' : m);
        txt(host,X0+c*CW+7,Y0+r*CH+17,lab,{'font-size':10.5,fill:'#d5d2ca','pointer-events':'none'});
      }
      terms.forEach(function(t,gi){
        var ms=cubeCells(t), rs={}, cs={};
        ms.forEach(function(m){ var p=pos(m); rs[p[0]]=1; cs[p[1]]=1; });
        var rl=Object.keys(rs).map(Number).sort(function(a,b){return a-b;});
        var cl=Object.keys(cs).map(Number).sort(function(a,b){return a-b;});
        function runs(list,total){
          if(list.length===total) return [[0,total]];
          var out=[], st=list[0], pv=list[0];
          for(var q=1;q<list.length;q++){ if(list[q]===pv+1) pv=list[q];
            else { out.push([st,pv-st+1]); st=list[q]; pv=list[q]; } }
          out.push([st,pv-st+1]); return out;
        }
        var inset=5+gi*4;
        runs(rl,rows).forEach(function(rr){ runs(cl,cols).forEach(function(cc){
          el('rect',{x:X0+cc[0]*CW+inset,y:Y0+rr[0]*CH+inset,
            width:cc[1]*CW-2*inset,height:rr[1]*CH-2*inset,rx:12,

        }); });
      });

      if(ex){
        if(!terms.length){ ex.innerHTML='<span class="dim">no ones on the map</span>'; }
        else {
          var lits=terms.reduce(function(s,t){return s+t.filter(function(v){return v!=='-';}).length;},0);
          var ands=terms.filter(function(t){return t.filter(function(v){return v!=='-';}).length>1;}).length;
          ex.innerHTML=terms.map(function(t,gi){
            return '<span style="color:'+PAL[gi%5]+'">'+termText(names,t)+'</span>';
          }).join(' <span class="dim">+</span> ')+
          '<br><span class="dim">'+ands+' AND gate'+(ands===1?'':'s')+' \u00b7 '+lits+' wires in'+
          (opts.was?' \u00b7 was '+opts.was:'')+'</span>';
        }
      }
    }
    draw();
  }

  var pCells=[]; for(var q1=0;q1<16;q1++) pCells.push(PRIMES.indexOf(q1)>=0?1:0);
  kmap('kmPrime','kmPrimeExpr',4,pCells,['w','x','y','z'],{was:'4 AND gates, 16 wires',digit:true});
  var cPlain=[]; for(var q2=0;q2<16;q2++) cPlain.push(C_ONES.indexOf(q2)>=0?1:0);
  kmap('km4','km4Expr',4,cPlain,['w','x','y','z'],{was:'9 AND gates, 36 wires',digit:true});
  var cDont=cPlain.slice(); for(var q3=10;q3<16;q3++) cDont[q3]=2;
  kmap('km4d','km4dExpr',4,cDont,['w','x','y','z'],{allowX:true,was:'9 AND gates, 36 wires',digit:true});

  /* ================= the six built circuits ================= */
  buildTerms('bMajBefore',['s1','s2','s3'],
    [mintermTerm(3,3),mintermTerm(3,5),mintermTerm(3,6),mintermTerm(3,7)],[0,1,1],760);
  buildTerms('bMajAfter',['s1','s2','s3'],
    [[1,1,'-'],[1,'-',1],['-',1,1]],[0,1,1],700);
  buildTerms('bPrimeBefore',['w','x','y','z'],
    PRIMES.map(function(m){return mintermTerm(4,m);}),[0,0,1,1],740);
  buildTerms('bPrimeAfter',['w','x','y','z'],
    [[0,0,1,'-'],[0,1,'-',1]],[0,0,1,1],700);
  buildTerms('bCBefore',['w','x','y','z'],
    C_ONES.map(function(m){return mintermTerm(4,m);}),[0,0,0,1],620);
  buildTerms('bCAfter',['w','x','y','z'],
    [['-',1,'-','-'],['-','-',0,'-'],['-','-','-',1]],[0,0,1,0],660);

  /* ================= closing figures ================= */
  (function(){
    var g=document.getElementById('figBill'); if(!g) return;
    var NM='abcdefg', rows=[], totS=0,totM=0,wS=0,wM=0;
    for(var s=0;s<7;s++){
      var ones=[]; for(var d=0;d<10;d++) if(SEGB[d]>>(6-s)&1) ones.push(d);
      var t=minimise(4,ones,[10,11,12,13,14,15]);
      var ands=t.filter(function(x){return x.filter(function(v){return v!=='-';}).length>1;}).length;
      var lits=t.reduce(function(a,x){return a+x.filter(function(v){return v!=='-';}).length;},0);
      rows.push({nm:NM[s],sop:ones.length,min:ands,expr:t.map(function(x){return termText(['w','x','y','z'],x);}).join(' + ')});
      totS+=ones.length; totM+=ands; wS+=ones.length*4; wM+=lits;
    }
    txt(g,40,26,'BAR',{'font-size':10.5,'letter-spacing':1.5});
    txt(g,100,26,'AS BUILT',{'font-size':10.5,fill:RED,'letter-spacing':1.5});
    txt(g,270,26,'SOLVED',{'font-size':10.5,fill:GRN,'letter-spacing':1.5});
    txt(g,690,26,'AND GATES',{'font-size':10.5,'letter-spacing':1.5});
    ln(g,40,36,830,36,null,1.5);
    rows.forEach(function(r,k){
      var y=62+k*32;
      txt(g,48,y,r.nm,{'font-size':16,fill:INK,'font-weight':700});
      txt(g,100,y,r.sop+' gates, '+(r.sop*4)+' wires',{'font-size':14,fill:RED});
      txt(g,270,y,r.expr,{'font-size':15,fill:GRN,'font-weight':700});
      txt(g,706,y,r.sop,{'font-size':15,fill:RED,'text-anchor':'end'});
      txt(g,720,y,'\u2192',{'font-size':13,fill:'#c6c3ba'});
      txt(g,766,y,r.min,{'font-size':15,fill:GRN,'text-anchor':'end','font-weight':700});
    });
    ln(g,40,294,830,294,null,1.5);
    txt(g,920,92,totS,{'font-size':50,fill:RED,'text-anchor':'middle','font-weight':700});
    txt(g,920,116,'BEFORE',{'font-size':10.5,'text-anchor':'middle','letter-spacing':1.5});
    txt(g,1080,92,totM,{'font-size':50,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,1080,116,'AFTER',{'font-size':10.5,'text-anchor':'middle','letter-spacing':1.5});
    pth(g,'M970 80 L1024 80 M1012 72 l12 8 l-12 8',{stroke:'#c6c3ba','stroke-width':2.5});
    txt(g,1000,176,wS+' wires into gates',{'font-size':15,fill:RED,'text-anchor':'middle'});
    txt(g,1000,200,'became '+wM,{'font-size':15,fill:GRN,'text-anchor':'middle','font-weight':700});
    txt(g,1000,240,'two thirds of the gates gone,',{'font-size':13,'text-anchor':'middle'});
    txt(g,1000,262,'behaviour unchanged everywhere',{'font-size':13,'text-anchor':'middle'});
  })();

  (function(){
    var g=document.getElementById('figLimit'); if(!g) return;
    var data=[[2,4,'2 x 2','yes',GRN],[3,8,'2 x 4','yes',GRN],[4,16,'4 x 4','yes',GRN],
              [5,32,'two 4 x 4 sheets','barely',AMB],[6,64,'four sheets','barely',AMB],
              [8,256,'sixteen sheets','no',RED]];
    txt(g,40,26,'VARIABLES',{'font-size':10.5,'letter-spacing':1.5});
    txt(g,190,26,'CELLS',{'font-size':10.5,'letter-spacing':1.5});
    txt(g,320,26,'SHAPE OF THE MAP',{'font-size':10.5,'letter-spacing':1.5});
    txt(g,620,26,'CAN YOU SEE IT?',{'font-size':10.5,'letter-spacing':1.5});
    ln(g,40,36,780,36,null,1.5);
    data.forEach(function(d,k){
      var y=64+k*32;
      if(d[3]!=='yes') el('rect',{x:34,y:y-18,width:752,height:26,rx:5,
        fill:d[3]==='no'?'#fdf0ef':'#fdf6ea','fill-opacity':.7},g);
      txt(g,48,y,d[0],{'font-size':16,fill:INK,'font-weight':700});
      txt(g,190,y,d[1],{'font-size':15,fill:'#4b5057'});
      txt(g,320,y,d[2],{'font-size':15,fill:'#4b5057'});
      txt(g,620,y,d[3],{'font-size':15,fill:d[4],'font-weight':700});
    });
    txt(g,840,74,'past four variables the eye',{'font-size':16,fill:INK,'font-weight':700});
    txt(g,840,98,'gives up, so the merge',{'font-size':16,fill:INK,'font-weight':700});
    txt(g,840,122,'gets mechanised',{'font-size':16,fill:INK,'font-weight':700});
    txt(g,840,160,'Quine and McCluskey, 1950s',{'font-size':13.5,'fill':'#8b9096'});
    txt(g,840,182,'the same merge, done exhaustively',{'font-size':13.5,fill:'#8b9096'});
    txt(g,840,216,'Espresso, Berkeley 1982',{'font-size':13.5,fill:'#8b9096'});
    txt(g,840,238,'heuristics, because exhaustive is exponential',{'font-size':13.5,fill:'#8b9096'});
  })();

  /* stepped algebra reveal */
  (function(){
    var slide=null;
    slides.forEach(function(s){ if(s.dataset.t==='P1 · the merge') slide=s; });
    if(!slide) return;
    var steps=slide.querySelectorAll('.step'), shown=1;
    function apply(){ steps.forEach(function(s,k){ s.classList.toggle('on',k<shown); }); }
    var alg=document.getElementById('figAlg');
    if(alg && alg.ownerSVGElement) alg.ownerSVGElement.style.cursor='pointer';
    slide.addEventListener('click',function(e){
      if(e.target.closest('button')) return;
      shown = shown>=steps.length?1:shown+1; apply();
    });
    apply();
  })();

  paint();
})();
</script>
</body>
</html>
