<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;
  --rule:#e2e0d9; --rule2:#c6c3ba;
  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --hi:#e8952b; --lo:#b9bfc6;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:50px 72px 82px;display:none;flex-direction:column;justify-content:center}
.slide.on{display:flex;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:22px;left:72px;font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}
.eyebrow b{color:var(--accent);font-weight:400}
.act{position:absolute;top:22px;right:72px;font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:72px;right:72px;bottom:24px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}
#rail i{flex:1;height:3px;background:var(--rule);border-radius:2px;transition:.22s}
#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}
#count{position:absolute;right:72px;bottom:46px;font-family:var(--mono);font-size:12.5px;color:var(--soft);z-index:5}
#help{position:absolute;left:72px;bottom:46px;font-family:var(--mono);font-size:11.5px;color:#adb1b6;letter-spacing:.08em;z-index:5}

.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
h1{font-family:var(--display);font-weight:600;font-size:64px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:6px}
p{font-size:20.5px;line-height:1.44;max-width:36ch}
p+p{margin-top:8px}
.big{font-size:25px;line-height:1.3;color:var(--ink);font-weight:300;max-width:30ch}
.small{font-size:16px;line-height:1.5;color:var(--soft);max-width:62ch}
strong{color:var(--ink);font-weight:700} em{font-style:italic;color:var(--ink)}
.num{font-family:var(--mono);font-weight:700;color:var(--ink)}
code{font-family:var(--mono);font-size:.87em;color:var(--accent);background:var(--accent-soft);padding:.05em .3em;border-radius:4px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.stack>*+*{margin-top:8px}
.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px}
.row{display:flex;gap:22px;align-items:flex-start;justify-content:center}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);
  border-radius:9px;padding:9px 13px;margin-top:9px}
.rem .h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.rem ul{list-style:none}
.rem li{font-size:16px;line-height:1.34;color:var(--ink);padding:3px 0 3px 15px;position:relative}
.rem li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--rule2)}

.btn{font-family:var(--mono);font-size:13px;background:var(--stage);color:var(--body);
  border:1px solid var(--rule2);border-radius:7px;padding:6px 11px;cursor:pointer;min-width:34px}
.btn:hover{background:#f0eee8;color:var(--ink)}
.btn.hot{background:var(--accent);border-color:var(--accent);color:#fff}
.btnrow{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center;justify-content:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.expr{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--accent);
  background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:9px 14px;text-align:center;line-height:1.5}
.expr .dim{color:var(--soft);font-weight:400;font-size:14px}

.scale{width:100%;border-collapse:collapse;font-size:19px}
.scale th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
  font-weight:400;text-align:left;padding:0 12px 7px 0;border-bottom:1px solid var(--rule2)}
.scale td{padding:9px 12px 9px 0;border-bottom:1px solid var(--rule);font-family:var(--mono)}
.scale td:first-child{font-weight:700;color:var(--ink);width:15%}
.scale tr.dead td{color:var(--fail)}
.scale tr:last-child td{border-bottom:none}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.seg{transition:fill .18s ease, stroke .18s ease;cursor:pointer}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}.seg{transition:none}}
.cue{position:absolute;left:72px;right:72px;bottom:68px;display:none;padding:8px 12px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:15px;line-height:1.36;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:44px 72px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:54px}
#jump li{padding:4px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:15.5px;color:var(--body);display:flex;gap:12px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:32px}
</style>
</head>
<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 16</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 16 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ===== ACT 1 ===== -->

<section class="slide" data-t="Title" data-act="1 · what the method is for">
  <div>
    <div class="kicker">class 16 · hour sixteen of fifty</div>
    <h1>What is secretly<br>a truth table?</h1>
    <p class="big" style="margin-top:22px;max-width:46ch">You have a method that builds any function of bits. Today you point it at four real problems, watch each one get built, and find the exact place it stops working.</p>
  </div>
  <div class="cue">Everything in this hour gets built in full. No gate counts without the gates.</div>
</section>

<section class="slide" data-t="The plan" data-act="1 · what the method is for">
  <div>
    <h2>The method has no judgement in it. So what is left to get wrong?</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px">
      <div class="panel" style="padding:18px 20px">
        <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft)">FIRST</div>
        <div style="font-family:var(--display);font-size:25px;font-weight:600;color:var(--ink);margin:6px 0 8px">Noticing</div>
        <div style="font-size:16.5px;line-height:1.4">Most problems do not announce that they are truth tables. A display, a vote, a payment check. We build three of them.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft)">THEN</div>
        <div style="font-family:var(--display);font-size:25px;font-weight:600;color:var(--ink);margin:6px 0 8px">The wall</div>
        <div style="font-size:16.5px;line-height:1.4">One innocent question whose table has eighteen quintillion rows. The method is still correct and completely unusable.</div>
      </div>
      <div class="panel frag" style="padding:18px 20px">
        <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--soft)">SO</div>
        <div style="font-family:var(--display);font-size:25px;font-weight:600;color:var(--ink);margin:6px 0 8px">Structure</div>
        <div style="font-size:16.5px;line-height:1.4">Build the smallest version, then repeat it. The big table never gets written and nothing is lost.</div>
      </div>
    </div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the three questions that decide it</div>
      <ul>
        <li>Is the set of inputs fixed and finite? Is every input a yes or a no? Is every output a yes or a no?</li>
        <li>Three yeses means it has a truth table, and Class 15 already proved it is buildable.</li>
        <li>What the problem is <em>about</em> never matters. Petrol, votes, money. The circuit does not know.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Put the three questions on the board now and leave them there for the hour.</div>
</section>

<!-- ===== ACT 2 · A VOTE ===== -->

<section class="slide" data-t="Three sensors" data-act="2 · build one, a vote">
  <div>
    <div class="kicker">problem one</div>
    <h2 style="font-size:29px;margin-bottom:4px">Three sensors on a boiler. Shut down if at least two say the temperature is too high.</h2>
    <div class="split" style="margin-top:2px;gap:44px">
      <div style="display:flex;justify-content:flex-end">
        <div class="panel"><svg viewBox="0 0 336 348" width="306" height="317"><g id="tabMaj"></g></svg></div>
      </div>
      <div class="stack">
        <p>Nobody said the word logic. It is a rule about sensors, written the way an engineer would say it out loud.</p>
        <p class="frag">Three inputs, so eight rows. Fill in what each row should do and you are finished specifying.</p>
        <p class="big frag" style="margin-top:4px">Four rows want a shutdown, so the circuit needs four detectors.</p>
      </div>
    </div>
  </div>
  <div class="cue">Have them fill the eight rows aloud before the next slide. It takes about forty seconds.</div>
</section>

<section class="slide" data-t="Built: the vote" data-act="2 · build one, a vote">
  <div>
    <div class="kicker">click any input to test it</div>
    <h2 style="font-size:28px;margin-bottom:0">Built. Four AND gates and one OR.</h2>
    <div style="text-align:center"><div id="bMaj"></div></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every gate on that board came from one row of the table. Nobody thought about what a majority means.</li>
        <li>Now read the table again as arithmetic: the output is 1 exactly when the three inputs add up to two or more.</li>
        <li>Which makes this <strong>the carry out of one column of an addition</strong>. You will build it again in Class 19 and not recognise it unless you hear this now.</li>
      </ul>
    </div>
  </div>
  <div class="cue">A voting circuit and a carry are the same object. Say it, do not develop it.</div>
</section>

<!-- ===== ACT 3 · A DISPLAY ===== -->

<section class="slide" data-t="The display" data-act="3 · build two, a display">
  <div>
    <div class="kicker">problem two · click a digit, or click any bar</div>
    <h2 style="font-size:28px;margin-bottom:2px">A digit on a petrol pump. Four wires in, seven bars out.</h2>
    <div class="row">
      <div class="panel" style="padding:8px 12px">
        <svg viewBox="0 0 150 244" width="124" height="202"><g id="figSeg"></g></svg>
        <div style="font-family:var(--mono);font-size:11.5px;color:var(--soft);text-align:center" id="segBits"></div>
      </div>
      <div><svg viewBox="0 0 400 300" width="400" height="300"><g id="segTab"></g></svg></div>
      <div style="max-width:26ch">
        <div class="expr" id="segExpr"></div>
        <div class="rem" style="margin-top:8px">
          <div class="h">remember</div>
          <ul>
            <li>Four inputs are the digit in binary. Seven outputs are the seven bars.</li>
            <li>Each bar has its own column, so this is seven truth tables sharing one set of inputs.</li>
            <li>Nobody was clever. Somebody wrote down which bars light for each digit.</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="btnrow" id="segBtns"></div>
  </div>
  <div class="cue">Click bar e first, then bar c. The difference between them is the whole of the next two slides.</div>
</section>

<section class="slide" data-t="Built: bar e" data-act="3 · build two, a display">
  <div>
    <div class="kicker">the cheapest bar · click any input to test it</div>
    <h2 style="font-size:28px;margin-bottom:0">Bar <span class="num">e</span> lights for four digits. Four detectors.</h2>
    <div style="text-align:center"><div id="bSegE"></div></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Four inputs now, so every detector needs four taps instead of three. The gates got wider, and the method did not change at all.</li>
        <li>This is one bar out of seven, on one digit out of four on the pump display.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Set the inputs to 0110, which is six, and watch the one gate fire. Then 0111, which is seven, and nothing does.</div>
</section>

<section class="slide" data-t="Built: bar c" data-act="3 · build two, a display">
  <div>
    <div class="kicker">the dearest bar · same method, same day, no cleverness available</div>
    <h2 style="font-size:27px;margin-bottom:0">Bar <span class="num">c</span> lights for nine digits. Nine detectors.</h2>
    <div style="text-align:center"><div id="bSegC"></div></div>
  </div>
  <div class="cue">Let this one just sit there for ten seconds. It is the argument for Class 17 and it needs no words.</div>
</section>

<section class="slide" data-t="The whole digit" data-act="3 · build two, a display">
  <div>
    <h2>Seven bars, seven of those circuits, sharing four inputs.</h2>
    <div style="text-align:center;margin:4px 0"><svg viewBox="0 0 980 330" width="940" height="316"><g id="figBill"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Forty nine AND gates and seven ORs for one digit, before anyone tries to make it smaller. A four digit pump is around two hundred.</li>
        <li>Bar c lights for nine digits out of ten. It would obviously be cheaper to detect the one digit it is <em>dark</em> for and invert that. Nine gates become one.</li>
        <li>The procedure cannot see that, because it has no judgement in it. That was the whole point in Class 15, and this is what it costs.</li>
        <li>Six of the sixteen input combinations are 1010 to 1111. Those are not digits and never arrive, and we built for them anyway.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Two seeds here for Class 17: shared terms, and the six rows that never happen. Plant both, explain neither.</div>
</section>

<!-- ===== ACT 4 · THE WALL ===== -->

<section class="slide" data-t="Now scale it" data-act="4 · the wall">
  <div>
    <div class="kicker">problem four · the same question, wider</div>
    <h2 style="font-size:29px;margin-bottom:4px">Are these two <code>int</code> values equal?</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Two bits against two bits is four inputs and sixteen rows. Still fine, and you could do it in the margin.</p>
        <p class="frag">Eight against eight is sixteen inputs and 65,536 rows. You would not, but a program could.</p>
        <p class="frag">Then the doubling does what doubling does.</p>
      </div>
      <div class="frag">
        <table class="scale">
          <tr><th>width</th><th>input bits</th><th>rows to write</th></tr>
          <tr><td>1 bit</td><td>2</td><td>4</td></tr>
          <tr><td>2 bits</td><td>4</td><td>16</td></tr>
          <tr><td>4 bits</td><td>8</td><td>256</td></tr>
          <tr><td>8 bits</td><td>16</td><td>65,536</td></tr>
          <tr><td>16 bits</td><td>32</td><td>4,294,967,296</td></tr>
          <tr class="dead"><td>32 bits</td><td>64</td><td>18,446,744,073,709,551,616</td></tr>
        </table>
      </div>
    </div>
  </div>
  <div class="cue">Read the last row out loud in full. It lands differently spoken than written.</div>
</section>

<section class="slide" data-t="The wall" data-act="4 · the wall">
  <div class="center">
    <h2 style="font-size:35px;margin-bottom:14px">At one row a second,<br>writing that table takes 584 billion years.</h2>
    <p class="big" style="max-width:52ch;color:var(--soft)">The universe has been going for fourteen billion. You would need forty of them, back to back, to finish the specification.</p>
    <p class="big frag" style="margin-top:18px;max-width:52ch">And the method is still <em>correct</em>. Every one of those rows would be right. It is simply of no use whatsoever.</p>
  </div>
  <div class="cue">Do not let them conclude the method was wrong. Correct and useless at the same time is the honest reading.</div>
</section>

<!-- ===== ACT 5 · STRUCTURE ===== -->

<section class="slide" data-t="Ask a smaller question" data-act="5 · build by structure">
  <div>
    <h2>So stop trying to build a thirty two bit thing.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Ask instead what the smallest version of the question is.</p>
        <p class="frag">Is one bit equal to one bit. Two inputs, four rows, and it fits on the back of a receipt.</p>
        <p class="big frag" style="margin-top:4px">Now use thirty two of them, and require that all thirty two agree.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>The four row table got written. The eighteen quintillion row table never did, and never will.</li>
          <li>Nothing was given up. The wide circuit is exactly correct, because each narrow one is and the wiring is.</li>
          <li>It works because equality decomposes cleanly. Each bit pair can be judged without knowing anything about its neighbours.</li>
          <li>Not every problem is that kind. Addition is not, and that is why Class 19 is hard.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">The last bullet is the one that matters. Ask what a carry does to independence.</div>
</section>

<section class="slide" data-t="Built: one bit equal" data-act="5 · build by structure">
  <div>
    <div class="kicker">so build that instead · click any input to test it</div>
    <h2 style="font-size:28px;margin-bottom:0">Is one bit equal to one bit? Two rows want a 1.</h2>
    <div style="text-align:center"><div id="bEq"></div></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Two detectors: both zero, or both one. Four rows, written in about ten seconds.</li>
        <li>The circuit already has a name, which is XNOR, and Class 13 built it out of two staircase switches.</li>
        <li>That is the whole specification. Now the question is what to do with thirty two of them.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Same question, same method, and it will be unrecognisable in two slides.</div>
</section>

<section class="slide" data-t="Built: eight of them" data-act="5 · build by structure">
  <div>
    <div class="kicker">click any bit to change it</div>
    <h2 style="font-size:28px;margin-bottom:2px">One cell, built once, pasted across the width.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1260 320" width="1200" height="305"><g id="figChain"></g></svg></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every cell is the identical two gate circuit from four slides ago. It compares one bit pair and passes the running answer along.</li>
        <li>To make it thirty two wide you paste in twenty four more. Nothing is redesigned and no table is written.</li>
        <li>Change one bit anywhere and that cell goes dark, and the chain carries the failure all the way to the end.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Break a bit in the middle and trace the chain with a finger. The failure travels right and never left.</div>
</section>

<section class="slide" data-t="The rule" data-act="5 · build by structure">
  <div class="center">
    <h2 style="font-size:43px;margin-bottom:20px">Specify by table.<br>Build by structure.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">The table is how you say exactly what you want, with no ambiguity anywhere. Structure is how you get it built without ever writing the table out.</p>
    <p class="big frag" style="margin-top:18px;max-width:52ch">Every circuit for the rest of this course is made this way. The adder, the ALU, the register file, the processor.</p>
  </div>
  <div class="cue">This is the sentence to leave on the board for the rest of the arc.</div>
</section>

<!-- ===== ACT 6 · CLOSE ===== -->

<section class="slide" data-t="Close" data-act="6 · close">
  <div class="center">
    <h2 style="font-size:36px;margin-bottom:16px">Four problems, four circuits,<br>and every one is bigger than it needs to be.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">Nine gates for a bar that is nearly always lit. Correctness is settled. Size is not, and size is what a chip is actually made of.</p>
    <p class="big frag" style="margin-top:18px;max-width:50ch">Next session: making it smaller, and the ninety year old algebra that does it.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: find the cheapest circuit you can for bar c by hand, and bring the gate count. No method, just staring at it.</div>
</section>

</template>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');

    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });

    count.textContent=String(i+1).padStart(2,'0')+' / '+N;

    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }
  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();} else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}

  function sig(v){ return v===1?HI : v===0?LO : GREY; }
  function el(tag,a,p){ var e=document.createElementNS(NS,tag);
    for(var k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
  function txt(p,x,y,s,o){ var t=el('text',Object.assign({x:x,y:y,'font-size':13,fill:'#8b9096'},o||{}),p);
    t.textContent=s; return t; }
  function rct(p,x,y,w,h,o){ return el('rect',Object.assign({x:x,y:y,width:w,height:h,rx:7,

  function ln(p,x1,y1,x2,y2,v,w){ return el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:sig(v),

  /* ================= the general sum of products builder ================= */
  function buildSOP(hostId, names, minterms, initial, opts){
    var host=document.getElementById(hostId); if(!host) return;
    opts=opts||{};
    var n=names.length, m=minterms.length;
    var vals=initial.slice();

    var PINX=52, PINW=58;
    function pinY(k){ return 46+k*46; }
    function invY(k){ return pinY(k)+23; }
    var TAPX=PINX+PINW+26, INVEND=TAPX+34, RAIL0=INVEND+42, RSP=26;
    function railX(i){ return RAIL0+i*RSP; }
    var lastLive=invY(n-1);
    var ANDH = m>6 ? 20 : (n<=3?24:22);
    var P    = m<=4?68 : m<=6?56 : 54;
    var TSP  = n<=3?14:11;
    var gate0= lastLive+44+ANDH;
    function gateY(j){ return gate0+j*P; }
    var ANDX=railX(2*n-1)+86, TIP=ANDX+18+ANDH;
    var ORX=TIP+92;
    var ORY=(gateY(0)+gateY(m-1))/2, ORH=(gateY(m-1)-gateY(0))/2+ANDH;
    var NOSE=Math.round(60+ORH*0.22);
    var outX=ORX+NOSE+54, railBot=gateY(m-1)+ANDH+16;
    var W=outX+76, H=Math.max(railBot+46, gateY(m-1)+ANDH+46);

    function draw(){
      var v={}, any=0;
      names.forEach(function(nm,k){ v[nm]=vals[k]; v[nm+"\u2032"]=vals[k]?0:1; });
      var fires=minterms.map(function(t){
        var on=1;
        for(var k=0;k<n;k++) if(((t>>(n-1-k))&1)!==vals[k]) on=0;
        if(on) any=1;
        return on;
      });

      host.innerHTML='';
      var sw = opts.width || Math.min(1180, W);
      var svg=el('svg',{viewBox:'0 0 '+W+' '+H, width:sw, height:Math.round(H*sw/W)},host);

      /* inputs, inverters, rails */
      names.forEach(function(nm,k){
        var py=pinY(k), iy=invY(k), np=nm+"\u2032";
        ln(svg,PINX+27,py,railX(2*k),py,v[nm]);
        jn(svg,TAPX,py);
        ln(svg,TAPX,py,TAPX,iy,v[nm]);
        gNot(svg,TAPX,iy);
        ln(svg,INVEND,iy,railX(2*k+1),iy,v[np]);
        ln(svg,railX(2*k),py,railX(2*k),railBot,v[nm]);
        ln(svg,railX(2*k+1),iy,railX(2*k+1),railBot,v[np]);
        txt(svg,railX(2*k),railBot+18,nm,{'font-size':12,'text-anchor':'middle'});
        txt(svg,railX(2*k+1),railBot+18,np,{'font-size':12,'text-anchor':'middle'});
        pinBox(svg,PINX,py,v[nm],nm,function(){ vals[k]=vals[k]?0:1; draw(); });
      });

      /* one detector per minterm */
      minterms.forEach(function(t,j){
        var y=gateY(j), lbl=[];
        for(var k=0;k<n;k++){
          var want=(t>>(n-1-k))&1, nm=want?names[k]:names[k]+"\u2032";
          var rx=railX(want?2*k:2*k+1), ty=y-(n-1)*TSP/2+k*TSP;
          ln(svg,rx,ty,ANDX,ty,v[nm]);
          jn(svg,rx,ty);
          lbl.push(nm);
        }
        gAnd(svg,ANDX,y,ANDH,fires[j]);
        txt(svg,ANDX+22,y-ANDH-8,lbl.join(''),{'font-size':12.5,fill:fires[j]?'#b06a12':'#a9a69d','text-anchor':'middle'});
        /* straight into the tall OR, no routing needed */
        var t2=(y-(ORY-ORH))/(2*ORH), ex=(ORX-5)+2*t2*(1-t2)*25;
        ln(svg,TIP,y,ex,y,fires[j]);
      });

      gOr(svg,ORX,ORY,ORH,NOSE,any);
      txt(svg,ORX+26,ORY+6,'OR',{'font-size':16,fill:any?'#b06a12':'#8b9096','text-anchor':'middle','font-weight':700});
      ln(svg,ORX+NOSE,ORY,outX,ORY,any);
      rct(svg,outX,ORY-24,52,48,{fill:any?'#fbf0dc':'#eef0f2',stroke:any?'#b06a12':GREY});
      txt(svg,outX+26,ORY+8,any,{'font-size':21,fill:any?HI:'#6b7178','text-anchor':'middle','font-weight':700});
      txt(svg,outX+26,ORY+44,'OUT',{'font-size':10.5,'text-anchor':'middle'});
      txt(svg,PINX-26,H-14,m+' AND gates \u00b7 '+n+' inverters \u00b7 1 OR gate',{'font-size':13,fill:'#23408f'});
    }
    draw();
  }

    function vs(x,y){ return [[x,y],[x+T/2,y+T/2],[x+T/2,y+L-T/2],[x,y+L],[x-T/2,y+L-T/2],[x-T/2,y+T/2]]; }
