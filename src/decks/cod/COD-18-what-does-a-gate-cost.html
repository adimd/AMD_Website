<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 18</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 18 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ================= THE JOB ================= -->

<section class="slide" data-t="Title" data-act="the job">
  <div>
    <div class="kicker">class 18 · hour eighteen of fifty · the logic arc closes</div>
    <h1>What does<br>a gate cost?</h1>
    <p class="big" style="margin-top:20px;max-width:46ch">One job today, and everything comes out of it: a chemical plant needs an alarm, and the alarm has a deadline.</p>
  </div>
  <div class="cue">Collect the send off. Bar d, solved completely, both gate counts.</div>
</section>

<section class="slide" data-t="The job" data-act="the job">
  <div>
    <div class="kicker">one requirement, and it runs through the whole hour</div>
    <h2 style="font-size:27px;margin-bottom:6px">Thirty two sensors. One bell. It must ring inside a single clock cycle.</h2>
    <div class="spec">
      <div class="c"><div class="l">SENSORS</div><div class="v">32</div><div class="s">any one of them trips the alarm</div></div>
      <div class="c"><div class="l">OUTPUT</div><div class="v">1 bell</div><div class="s">an OR of all thirty two</div></div>
      <div class="c"><div class="l">CONTROLLER</div><div class="v">3 GHz</div><div class="s">one cycle is 333 picoseconds</div></div>
      <div class="c"><div class="l">DEADLINE</div><div class="v" style="color:var(--fail)">333 ps</div><div class="s">or the reading is missed</div></div>
    </div>
    <div class="rem" style="max-width:none">
      <div class="h">five questions, all from this one job</div>
      <ul>
        <li><strong>Does anything take time at all?</strong> Every count in Class 17 quietly assumed gates were instant.</li>
        <li><strong>Which shape?</strong> Two circuits with identical gate counts, and only one meets the deadline.</li>
        <li><strong>Can we cheat with one wide gate?</strong> The obvious shortcut, and why the silicon refuses.</li>
        <li><strong>Keep ringing until an operator acknowledges.</strong> A reasonable request that no arrangement of gates can satisfy.</li>
        <li><strong>Where did "one cycle" come from?</strong> Nothing you have built has any notion of when.</li>
      </ul>
    </div>
  </div>
  <div class="cue">The last two are the walls, and they arrive as ordinary plant requirements rather than as theory.</div>
</section>

<!-- ================= Q1 ================= -->

<section class="slide" data-t="Q1 · does it take time" data-act="question 1 · time">
  <div>
    <div class="tag">QUESTION ONE</div>
    <div class="kicker" style="margin-top:2px">press run, then change the depth and run again</div>
    <h2 style="font-size:31px;margin-bottom:2px">Does a circuit take any time at all?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 250" width="1090" height="239"><g id="figDelay"></g></svg></div>
    <div class="btnrow">
      <span class="lab">GATES IN A ROW</span>
      <button class="btn" data-n="2">2</button><button class="btn hot" data-n="4">4</button>
      <button class="btn" data-n="6">6</button><button class="btn" data-n="8">8</button>
      <span style="width:16px"></span>
      <button class="btn hot" id="dRun">run &#9654;</button>
      <button class="btn" id="dStep">step</button>
      <button class="btn" id="dReset">reset</button>
    </div>
  </div>
  <div class="cue">Run it at 2, then at 8. The arrival time tracks the depth exactly, and nothing else about the circuit changed.</div>
</section>

<section class="slide" data-t="Q1 · where the time goes" data-act="question 1 · time">
  <div>
    <div class="kicker">so where does the twenty picoseconds actually go</div>
    <h2 style="font-size:27px;margin-bottom:2px">A gate does not decide. It charges.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 290" width="1080" height="275"><g id="figCharge"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Class 14 built a gate as two networks of transistors. Whichever one conducts has to move charge onto the wire and into the next gate's input.</li>
        <li>Charge moves through resistance into capacitance, so the voltage does not jump. It rises on a curve.</li>
        <li>The next gate cannot tell what it is looking at until that curve crosses its threshold. That crossing is the gate delay.</li>
        <li>Nothing is deciding anything. It is a bucket filling, and about twenty picoseconds is how long it takes.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is why depth costs time and width does not. Two gates in a row is two buckets, one after the other.</div>
</section>

<section class="slide" data-t="Q1 · answered" data-act="question 1 · time">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">Yes. About twenty picoseconds a gate, and only the gates <em>in a row</em> count.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 230" width="1080" height="218"><g id="figTwoCosts"></g></svg></div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li><strong>Depth.</strong> The longest path from any input to any output, counted in gates. The circuit is not finished until that path is.</li>
        <li>Gates side by side cost silicon. Gates one behind another cost time. Two different bills, and Class 17 only ever read one of them.</li>
        <li>Twenty picoseconds is twenty trillionths of a second. Light travels about six millimetres in that time.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Both circuits here have four gates. Ask which they would rather build before revealing the depths.</div>
</section>

<!-- ================= Q2 ================= -->

<section class="slide" data-t="Q2 · seven gates" data-act="question 2 · shape">
  <div>
    <div class="tag">QUESTION TWO</div>
    <div class="kicker" style="margin-top:2px">start small, with eight sensors instead of thirty two</div>
    <h2 style="font-size:31px;margin-bottom:4px">The gate count is fixed. Does the arrangement matter?</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 220" width="1080" height="209"><g id="figSeven"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">which makes this the perfect test</div>
      <ul>
        <li>Every two input gate swallows two signals and returns one, so each gate reduces the count by exactly one.</li>
        <li>Eight down to one is seven gates, whatever shape you choose. The bill of materials is fixed before you start.</li>
        <li>So Class 17's measure cannot tell any two answers apart. Only the arrangement is left, and it is about to matter enormously.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let them derive the seven. Each gate eats one signal, eight down to one, therefore seven.</div>
</section>

<section class="slide" data-t="Q2 · the race" data-act="question 2 · shape">
  <div>
    <div class="kicker"><b>question two</b> &nbsp;·&nbsp; same seven gates, both wired up, one clock &nbsp;·&nbsp; press run</div>
    <h2 style="font-size:26px;margin-bottom:0">Sensor 0 trips. Watch both bells.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1180 520" width="1120" height="494"><g id="figRace"></g></svg></div>
    <div class="btnrow">
      <button class="btn hot" id="rRun">run &#9654;</button>
      <button class="btn" id="rStep">step</button>
      <button class="btn" id="rReset">reset</button>
    </div>
  </div>
  <div class="cue">The tree finishes while the chain is still on its fourth gate. Say nothing until both have rung.</div>
</section>

<section class="slide" data-t="Q2 · answered" data-act="question 2 · shape">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:2px">Enormously. Six times over, at the size this plant needs.</h2>
    <div class="row" style="align-items:center">
      <div><svg viewBox="0 0 1060 400" width="1040" height="392"><g id="figScale"></g></svg></div>
      <div style="max-width:31ch">
        <div class="btnrow" style="justify-content:flex-start;margin-top:0">
          <span class="lab">SENSORS</span>
          <button class="btn" data-s="2">2</button><button class="btn" data-s="4">4</button>
          <button class="btn" data-s="8">8</button><button class="btn" data-s="16">16</button>
          <button class="btn hot" data-s="32">32</button><button class="btn" data-s="64">64</button>
        </div>
        <div class="rem win" style="margin-top:10px">
          <div class="h">what this question taught</div>
          <ul>
            <li><strong>Shape is a free variable.</strong> The gate count is identical for both bars, at every size.</li>
            <li>The chain grows with the sensor count. The tree grows with its logarithm, so it barely grows at all.</li>
            <li>Step up through the sizes. The chain crosses the deadline somewhere between 16 sensors and 32.</li>
            <li>Exactly at <span class="num">18</span>. A plant that expanded from seventeen sensors to eighteen would have broken its alarm and changed nothing else.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Click up through the sizes slowly. Watching the red bar cross the line is the moment of the hour.</div>
</section>

<!-- ================= Q3 ================= -->

<section class="slide" data-t="Q3 · one wide gate" data-act="question 3 · fan in and out">
  <div>
    <div class="tag">QUESTION THREE</div>
    <div class="kicker" style="margin-top:2px">the obvious objection, and it is a good one</div>
    <h2 style="font-size:31px;margin-bottom:4px">Can we dodge the whole problem with one wide gate?</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Depth one. Twenty picoseconds, beating even the tree by a factor of five. On paper it is obviously right.</p>
        <p class="frag">Nothing in Boolean algebra forbids it. An OR of thirty two things is a perfectly good expression.</p>
        <p class="big frag" style="margin-top:4px">The objection is not mathematical. It is that Class 14 told you what a gate is made of.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">so open the gate up, once</div>
        <ul>
          <li>A CMOS gate is a pull up network and a pull down network of transistors in series and parallel.</li>
          <li>More inputs means more transistors in one of those chains, and a chain of transistors is a chain of resistors.</li>
          <li>This is the one time in the whole course we go back below the abstraction boundary. It is worth it.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">They crossed that boundary in Class 14 and were told not to look back. This is the exception, and say so.</div>
</section>

<section class="slide" data-t="Q3 · fan in" data-act="question 3 · fan in and out">
  <div>
    <div class="tag new">FIRST LIMIT &nbsp;·&nbsp; FAN IN</div>
    <h2 style="font-size:27px;margin-bottom:2px">Every extra input is another transistor in the same series stack.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 300" width="1080" height="284"><g id="figFanIn"></g></svg></div>
    <div class="btnrow">
      <span class="lab">INPUTS</span>
      <button class="btn hot" data-fi="2">2</button><button class="btn" data-fi="3">3</button>
      <button class="btn" data-fi="4">4</button><button class="btn" data-fi="6">6</button>
      <button class="btn" data-fi="8">8</button><button class="btn" data-fi="12">12</button>
    </div>
  </div>
  <div class="cue">Step it up and watch the delay bar. Doubling the inputs roughly quadruples the delay, so wide gates are not one gate delay.</div>
</section>

<section class="slide" data-t="Q3 · fan out" data-act="question 3 · fan in and out">
  <div>
    <div class="tag new">SECOND LIMIT &nbsp;·&nbsp; FAN OUT</div>
    <h2 style="font-size:27px;margin-bottom:2px">And one output cannot drive an unlimited number of inputs.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1140 260" width="1080" height="246"><g id="figFanOut"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Every gate input is a tiny capacitor. Driving eight of them means charging eight capacitors through one transistor.</li>
        <li>Delay grows in proportion to how many inputs a signal feeds. This is the <strong>fan out</strong>.</li>
        <li>The fix is a buffer, two inverters that re-drive the signal at full strength, and it costs one more gate delay.</li>
        <li>So a signal that goes to many places is slow, and fixing it costs depth. Both bills again.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Fan out is why clock distribution is an entire engineering discipline. Mention it and move on.</div>
</section>

<section class="slide" data-t="Q3 · answered" data-act="question 3 · fan in and out">
  <div>
    <div class="tag win">ANSWER</div>
    <h2 style="font-size:31px;margin-bottom:4px">No. Past about four inputs, the gate you wanted does not exist.</h2>
    <div class="spec" style="margin-top:2px">
      <div class="c"><div class="l">ONE 32-INPUT OR</div><div class="v" style="color:var(--fail)">does not exist</div><div class="s">the stack would be 32 deep</div></div>
      <div class="c"><div class="l">CHAIN OF 31</div><div class="v" style="color:var(--fail)">620 ps</div><div class="s">misses the deadline</div></div>
      <div class="c"><div class="l">TREE OF 31</div><div class="v" style="color:var(--ok)">100 ps</div><div class="s">fits three times over</div></div>
    </div>
    <div class="rem win" style="max-width:none">
      <div class="h">what this question taught</div>
      <ul>
        <li><strong>Fan in and fan out.</strong> Gates cannot be arbitrarily wide, and outputs cannot drive arbitrarily many places.</li>
        <li>Together they are why the tree is real engineering and not a puzzle answer. Narrow gates are forced on you, and once they are, shape decides everything.</li>
        <li>You now have three costs: how many gates, how deep they stack, and how wide each one is. Every real design trades between them.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Three costs on the board. This is the vocabulary for the whole rest of the course.</div>
</section>

<!-- ================= Q4 · WALL ONE ================= -->

<section class="slide" data-t="Q4 · the request" data-act="question 4 · the first wall">
  <div>
    <div class="tag">QUESTION FOUR</div>
    <div class="kicker" style="margin-top:2px">the plant comes back with one more requirement</div>
    <h2 style="font-size:31px;margin-bottom:4px">Can gates remember?</h2>
    <div class="split" style="margin-top:4px">
      <div class="stack">
        <p>The request: <strong>once the bell has rung, keep it ringing until an operator acknowledges.</strong></p>
        <p class="frag">Perfectly reasonable. A sensor might trip for a microsecond and clear again, and without this nobody would ever know it happened.</p>
        <p class="frag">Every alarm panel ever built does this. It is not an exotic requirement.</p>
        <p class="big frag" style="margin-top:4px">And Class 15 proved every function of bits is buildable. So this should be routine.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">try it first</div>
        <ul>
          <li>You have thirty one gates already, and you may use as many more as you like, in any arrangement.</li>

    el('rect',{x:X0+CW+30,y:Y0,width:CW-70,height:RH-8,rx:9,fill:'#fbf0dc',stroke:'#e8d3ab','stroke-width':1.6},g);
    txt(g,X0+CW+56,Y0+42,'RINGING',{'font-size':19,fill:AMB,'font-weight':700});
    txt(g,X0+CW+CW-30,Y0+42,'no conflict',{'font-size':13,fill:GRN});

    /* row 2: sensor quiet, two answers wanted */
    var y2=Y0+RH+12;
    el('rect',{x:X0-10,y:y2,width:CW,height:RH+30,rx:9,fill:'#f6f4ef',stroke:'#e2e0d9','stroke-width':1.6},g);
    txt(g,X0+16,y2+58,'sensor quiet',{'font-size':19,fill:'#6b7178','font-weight':700});
    el('rect',{x:X0+CW+30,y:y2,width:CW-70,height:(RH+30)/2-4,rx:9,
      fill:'#eef2fa',stroke:BLUE,'stroke-width':2},g);
    txt(g,X0+CW+56,y2+32,'silent',{'font-size':17,fill:BLUE,'font-weight':700});
    txt(g,X0+CW+CW-30,y2+32,'from history A',{'font-size':12,fill:BLUE});
    el('rect',{x:X0+CW+30,y:y2+(RH+30)/2+4,width:CW-70,height:(RH+30)/2-4,rx:9,
      fill:'#fdf0ef',stroke:RED,'stroke-width':2},g);
    txt(g,X0+CW+56,y2+(RH+30)/2+34,'RINGING',{'font-size':17,fill:RED,'font-weight':700});
    txt(g,X0+CW+CW-30,y2+(RH+30)/2+34,'from history B',{'font-size':12,fill:RED});

    txt(g,X0-10,272,'one row, two required outputs. a truth table has room for exactly one.',
      {'font-size':16,fill:RED,'font-weight':700});
  })();

  /* ================= Q5 · it only settles ================= */
  var settleCtl=null;
  (function(){
    var g=document.getElementById('figSettle'); if(!g) return;
    var LEN=46, DELAY=4, X0=150, XW=930, HI_Y=74, LO_Y=118, OHI=196, OLO=240;
    var hist=[], cur=0, timer=null;
    for(var k=0;k<LEN;k++) hist.push(0);
    function step(){ hist.push(cur); if(hist.length>LEN) hist.shift(); render(); }
    function xOf(k){ return X0+k*(XW/(LEN-1)); }

    function waveform(vals,hiY,loY,col,label,sub){
      txt(g,X0-14,(hiY+loY)/2+5,label,{'font-size':12.5,fill:col,'text-anchor':'end','font-weight':700});
      txt(g,X0-14,(hiY+loY)/2+22,sub,{'font-size':10,'text-anchor':'end'});
      var d='', prev=null;
      vals.forEach(function(v,k){
        var y=v?hiY:loY, x=xOf(k);
        if(prev===null){ d='M'+x+' '+y; }
        else { if(prev!==v) d+=' L'+x+' '+(prev?hiY:loY)+' L'+x+' '+y; d+=' L'+x+' '+y; }
        prev=v;
      });
      el('path',{d:d,fill:'none',stroke:col,'stroke-width':3,'stroke-linejoin':'round'},g);
    }

    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      var out=hist.map(function(v,k){ return k>=DELAY ? hist[k-DELAY] : 0; });
      waveform(hist,HI_Y,LO_Y,AMB,'SENSOR','you flip this');
      waveform(out,OHI,OLO,GRN,'BELL','it just follows');
      /* the delay marker */
      var lastChange=-1;
      for(var k=hist.length-1;k>0;k--) if(hist[k]!==hist[k-1]){ lastChange=k; break; }
      if(lastChange>0 && lastChange+DELAY<LEN){
        var a=xOf(lastChange), b=xOf(lastChange+DELAY);
        el('line',{x1:a,y1:LO_Y+10,x2:a,y2:OHI-10,stroke:'#dedbd3','stroke-width':1.6,'stroke-dasharray':'4 4'},g);
        el('line',{x1:b,y1:LO_Y+10,x2:b,y2:OHI-10,stroke:'#dedbd3','stroke-width':1.6,'stroke-dasharray':'4 4'},g);
        el('line',{x1:a,y1:158,x2:b,y2:158,stroke:BLUE,'stroke-width':2.4},g);
        txt(g,(a+b)/2,150,DELAY+' gate delays',{'font-size':11,fill:BLUE,'text-anchor':'middle','font-weight':700});
      }
      /* the clock that is not there */
      txt(g,X0-14,300,'CLOCK',{'font-size':12.5,fill:'#c6c3ba','text-anchor':'end','font-weight':700});
      el('rect',{x:X0,y:276,width:XW,height:46,rx:9,fill:'#faf9f6',stroke:'#e2e0d9',
        'stroke-width':1.8,'stroke-dasharray':'8 6'},g);
      for(var q=0;q<10;q++){
        var x=X0+30+q*(XW-60)/9;
        el('line',{x1:x,y1:286,x2:x,y2:312,stroke:'#e2e0d9','stroke-width':2},g);
      }
      txt(g,X0+XW/2,305,'nothing on your board produces this row',
        {'font-size':13,fill:'#c6c3ba','text-anchor':'middle','font-style':'italic'});
      txt(g,X0,44,'no grid, no ticks, no moments. the output is a delayed copy of the input, and that is all it ever is.',
        {'font-size':13.5,fill:'#8b9096'});
    }
    function start(){ if(!timer) timer=setInterval(step,140); }
    function stop(){ if(timer){ clearInterval(timer); timer=null; } }
    document.getElementById('sToggle').onclick=function(){ cur=cur?0:1; };
    document.getElementById('sPause').onclick=function(){
      if(timer){ stop(); this.textContent='resume'; this.classList.add('hot'); }
      else { start(); this.textContent='pause'; this.classList.remove('hot'); }
    };
    document.getElementById('sReset').onclick=function(){
      hist=[]; for(var k=0;k<LEN;k++) hist.push(0); cur=0; render();
    };
    render(); start();
    settleCtl={stop:stop,start:start};
  })();

  /* ================= Q5 · the two walls are one ================= */
  (function(){
    var g=document.getElementById('figTwoWalls'); if(!g) return;
    function bay(X,tag,title,body,col){
      el('rect',{x:X,y:34,width:400,height:132,rx:14,fill:'#fbfaf7',stroke:col,'stroke-width':2},g);
      txt(g,X+24,62,tag,{'font-size':10.5,fill:col,'letter-spacing':1.8});
      txt(g,X+24,94,title,{'font-size':20,fill:INK,'font-weight':700});
      txt(g,X+24,124,body[0],{'font-size':13.5,fill:'#8b9096'});
      txt(g,X+24,144,body[1],{'font-size':13.5,fill:'#8b9096'});
    }
    bay(40,'WALL ONE','No memory',['the output cannot depend on','anything that happened before'],RED);
    bay(700,'WALL TWO','No sense of when',['nothing produces a moment,','or notices one passing'],RED);
    /* the link between them */
    el('path',{d:'M470 80 C540 80 600 80 670 80',fill:'none',stroke:BLUE,'stroke-width':2.4},g);
    el('path',{d:'M670 120 C600 120 540 120 470 120',fill:'none',stroke:BLUE,'stroke-width':2.4},g);
    el('path',{d:'M664 74 l12 6 l-12 6',fill:'none',stroke:BLUE,'stroke-width':2.4},g);
    el('path',{d:'M476 114 l-12 6 l12 6',fill:'none',stroke:BLUE,'stroke-width':2.4},g);
    txt(g,570,68,'sequence needs',{'font-size':12,fill:BLUE,'text-anchor':'middle'});
    txt(g,570,142,'memory needs a moment',{'font-size':12,fill:BLUE,'text-anchor':'middle'});
    txt(g,570,158,'at which to update',{'font-size':12,fill:BLUE,'text-anchor':'middle'});
    txt(g,40,200,'one wall, seen from two sides, and one idea in Arc 5 answers both',
      {'font-size':16,fill:INK,'font-weight':700});
  })();

  /* ================= the claim ================= */
  (function(){
    var g=document.getElementById('figClaim'); if(!g) return;
    rct(g,40,28,1040,84,{rx:14,fill:'#fbfaf7',stroke:'#e2e0d9'});
    txt(g,70,58,'FROM CLASS 15',{'font-size':10.5,fill:BLUE,'letter-spacing':2});
    txt(g,70,92,'every function of bits can be built from AND, OR and NOT',
      {'font-size':25,fill:INK,'font-weight':700});
    el('rect',{x:196,y:70,width:186,height:30,rx:6,fill:AMB,'fill-opacity':.16,stroke:AMB,'stroke-width':2},g);
    pth(g,'M289 112 L289 146',{stroke:AMB,'stroke-width':2.5});
    txt(g,289,172,'meaning: determined entirely by the inputs at this instant, and nothing else',
      {'font-size':17,fill:AMB,'text-anchor':'middle','font-weight':700});
  })();

  /* ================= the arc ================= */
  (function(){
    var g=document.getElementById('figArc'); if(!g) return;
    var items=[[13,'two switches','and a lamp'],[14,'a transistor','and six gates'],
               [15,'any function','is buildable'],[16,'recognise it','or decompose it'],
               [17,'and make it','smaller'],[18,'and know what','it costs in time']];
    items.forEach(function(it,k){
      var x=28+k*186;
      rct(g,x,40,168,108,{rx:12,fill:k===5?'#eaeef7':'#fbfaf7',stroke:k===5?'#c3cee6':'#e2e0d9','stroke-width':k===5?2:1.5});
      txt(g,x+84,68,'CLASS '+it[0],{'font-size':10,fill:'#c6c3ba','text-anchor':'middle','letter-spacing':1.5});
      txt(g,x+84,98,it[1],{'font-size':15,fill:INK,'text-anchor':'middle','font-weight':700});
      txt(g,x+84,120,it[2],{'font-size':15,fill:INK,'text-anchor':'middle','font-weight':700});
      if(k<5) pth(g,'M'+(x+168)+' 94 L'+(x+186)+' 94',{stroke:'#c6c3ba','stroke-width':2});
    });
    txt(g,28,196,'and two things it will never do, both of which arrived today as ordinary plant requirements',
      {'font-size':15,fill:INK,'font-weight':700});
  })();

  onSlide=function(idx){
    var t=slides[idx].dataset.t;
    if(delayCtl && t!=='Q1 · does it take time') delayCtl.stop();
    if(raceCtl && t!=='Q2 · the race') raceCtl.stop();
    if(traceCtl && t!=='Q4 · two histories') traceCtl.stop();
    if(settleCtl){ if(t==='Q5 · it only settles') settleCtl.start(); else settleCtl.stop(); }
  };

  paint();
})();
</script>
