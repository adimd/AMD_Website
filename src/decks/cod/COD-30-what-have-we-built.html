<body>
<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 30</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 30 · running order</h4><ol id="jumplist"></ol></div>
</div>


<template id="slides">

<section class="slide" data-t="Title" data-act="the question">
  <div>
    <div class="kicker">class 30 · hour thirty of fifty</div>
    <h1>What have<br>we built?</h1>
    <p class="big" style="margin-top:22px;max-width:50ch">Eleven sessions of circuits are sitting on the table, wired to nothing. Today they get wired to each other, and the thing that comes out has a name you have heard before and never had a reason to believe.</p>
  </div>
  <div class="cue">Nothing gets invented today either. The whole hour is assembly, and one sentence at the end that changes what an instruction is.</div>
</section>

<section class="slide" data-t="Where we are" data-act="the question">
  <div>
    <h2>Every circuit you have built is about to become one circuit.</h2>
    <div style="text-align:center;margin-top:2px"><svg viewBox="0 0 1140 250" width="1050" height="213"><g id="figArcTop"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the hour in three questions</div>
      <ul>
        <li><strong>What do you actually have?</strong> Nobody has added it up. Today you do, and the total is larger than anyone in the room expects.</li>
        <li><strong>How do you wire seven circuits to one pair of input wires?</strong> There are two answers and the wasteful looking one is correct.</li>
        <li><strong>And what is the thing that chooses?</strong> It turns out you already built it, and it turns out to be the opcode.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Flag the third one. Everything today is in service of that sentence.</div>
</section>

<!-- ================= ACT 1 ================= -->

<section class="slide" data-t="The inventory" data-act="1 · the inventory">
  <div>
    <div class="tag">ELEVEN SESSIONS, ON ONE BOARD</div>
    <h2 style="margin-bottom:0">Every unit, as a black box, with the hour that built it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 372" width="1040" height="333"><g id="figInventory"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">reading the table</div>
      <ul>
        <li>Two inputs, one output, every one of them. That shape is not a coincidence, it is what made them wireable together.</li>
        <li>The divider is the one box you have not opened yet. It is coming in Class 26, and it is different from everything here in a way that matters today.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Have them name which class built each one before you reveal it. They will get most of them and the recall is the point.</div>
</section>

<section class="slide" data-t="What it cost" data-act="1 · the inventory">
  <div>
    <h2>Add it up. One unit is three quarters of the machine.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1058" height="319"><g id="figTotal"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">two numbers worth saying out loud</div>
      <ul>
        <li><strong>Six thousand gates.</strong> That is the whole computational core of a processor, and you derived every part of it from truth tables.</li>
        <li><strong>The multiplier is seventy seven per cent of it.</strong> One operation, more silicon than everything else combined, and you will see the consequence of that in fifteen minutes.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let the multiplier bar sit there. It comes back at the end of the hour as the thing that breaks the clock.</div>
</section>

<!-- ================= ACT 2 ================= -->

<section class="slide" data-t="The wiring problem" data-act="2 · route or broadcast">
  <div>
    <h2>Seven circuits. One pair of input wires. One output.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1058" height="319"><g id="figProblem"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">the question, stated exactly</div>
      <ul>
        <li>The operands arrive on one pair of buses. Only one answer is wanted. Where does the choosing happen, before the units or after them?</li>
        <li>Take a vote before you answer. The room will split, and the majority will be wrong.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Both options are legitimate engineering. Do not telegraph the answer, because the argument is the lesson.</div>
</section>

<section class="slide" data-t="Option one, route" data-act="2 · route or broadcast">
  <div>
    <div class="tag">THE ANSWER THE ROOM WILL GIVE</div>
    <h2 style="margin-bottom:0">Send the operands only to the unit that was asked for.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1058" height="301"><g id="figRoute"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what this costs</div>
      <ul>
        <li>A demultiplexer on every bit of both operands. Eight AND gates per bit, sixty four bits, plus a shared decoder. That is <span class="num">523</span> gates of pure routing.</li>
        <li>And it does not remove the output multiplexer, because seven units are still driving the result bus with whatever they computed from the zeros you fed them.</li>
      </ul>
    </div>
  </div>
  <div class="cue">That second point is the one they will miss. Routing the inputs does not solve the output problem.</div>
</section>

<section class="slide" data-t="Option two, broadcast" data-act="2 · route or broadcast">
  <div>
    <div class="tag win">THE ANSWER THE HARDWARE GIVES</div>
    <h2 style="margin-bottom:0">Send both operands to all of them. Choose at the end.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 372" width="1030" height="330"><g id="figBroadcast"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">what this costs</div>
      <ul>
        <li>On the input side, nothing. Wire is free, and a wire that goes to eight places costs the same as a wire that goes to one.</li>
        <li>On the output side, one eight to one multiplexer, thirty two bits wide. <span class="num">363</span> gates, five gate delays, built in Class 27.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Every unit now computes on every operation whether anybody wanted it or not. Say that plainly, because the objection is coming.</div>
</section>

<section class="slide" data-t="Which one is cheaper" data-act="2 · route or broadcast">
  <div>
    <h2>The wasteful looking one is cheaper in gates and faster in time.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1058" height="301"><g id="figCompare"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">both columns, same direction</div>
      <ul>
        <li><strong>Gates.</strong> Routing adds 523 and removes nothing, so it is 886 against 363. Two and a half times the hardware to do less.</li>
        <li><strong>Time.</strong> The demultiplexer sits in front of the units, so its three gate delays are added to the critical path rather than hidden behind it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">This is a rare case where the two costs agree. Note that, because usually they do not and you have to choose.</div>
</section>

<section class="slide" data-t="The objection" data-act="2 · route or broadcast">
  <div class="center">
    <h2 style="font-size:36px;margin-bottom:18px">But it computes seven answers<br>nobody asked for.</h2>
    <p class="big" style="max-width:54ch;color:var(--soft)">On every single operation. A multiply runs when you asked for an AND. The shifter shifts when you asked for a subtract. Seven results are produced and thrown away.</p>
    <p class="big frag" style="margin-top:20px;max-width:54ch">That objection is correct and it deserves a real answer rather than a dismissal.</p>
  </div>
  <div class="cue">Wait for somebody to raise it. If nobody does, raise it yourself, because the answer is the most useful idea in the hour.</div>
</section>

<section class="slide" data-t="The honest answer" data-act="2 · route or broadcast">
  <div>
    <h2>Area is already spent. Power is the real cost, and it has its own fix.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1058" height="301"><g id="figGating"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">three parts to the answer, in order</div>
      <ul>
        <li><strong>The silicon exists either way.</strong> Every unit was fabricated. Leaving one idle does not give you its area back, so computing with it is free in area.</li>
        <li><strong>Power is not free.</strong> Transistors that switch burn energy, and seven units switching for nothing is real waste. That part of the objection stands.</li>
        <li><strong>So gate the clock.</strong> Real processors stop the clock to units they do not need. That is an optimisation applied to this structure, not an alternative to it.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Do not let clock gating sound like a retreat. The structure stays. You are switching off the parts you can prove are unwanted.</div>
</section>

<section class="slide" data-t="In software, backwards" data-act="2 · route or broadcast">
  <div>
    <h2>In software this is exactly backwards, and you are about to measure it.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 378" width="1012" height="330"><g id="figSoftware"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">the prediction, not the result</div>
      <ul>
        <li>In hardware the eight units run at the same time, so computing all eight costs one unit of time. Parallelism is free.</li>
        <li>In C they run one after another, so computing all eight costs eight times the arithmetic. Parallelism is not free, it is the whole bill.</li>
        <li><strong>Assignment 6 asks you to build it both ways and report the ratio.</strong> Eight is the arithmetic prediction. Branch misprediction will move it, and finding out by how much is the assignment.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Mark this as a prediction on the board. They are going to falsify or confirm it themselves, and that is the measurement thread working.</div>
</section>

<!-- ================= ACT 3 ================= -->

<section class="slide" data-t="The select lines" data-act="3 · the opcode">
  <div>
    <h2>How wide does the select field have to be?</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 340" width="1046" height="306"><g id="figSelect"></g></svg></div>
    <div class="btnrow"><span class="lab">OPERATIONS</span>
      <button class="btn" id="selRun">run ▶</button>
      <button class="btn" id="selStep">step</button>
      <button class="btn" id="selReset">reset</button>
    </div>
  </div>
  <div class="cue">The answer is the logarithm, which Class 27 established. Here it stops being a formula and becomes a count of wires.</div>
</section>

<section class="slide" data-t="Build a small one" data-act="3 · the opcode">
  <div>
    <h2>Four units, two select lines. Change the number, change the machine.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 350" width="1058" height="319"><g id="figLive4"></g></svg></div>
    <div class="btnrow"><span class="lab">SELECT</span>
      <button class="btn" id="l4_0">00</button>
      <button class="btn" id="l4_1">01</button>
      <button class="btn" id="l4_2">10</button>
      <button class="btn" id="l4_3">11</button>
    </div>
  </div>
  <div class="cue">Click through all four without touching a wire. Nothing in the circuit changed. Two bits changed.</div>
</section>

<section class="slide" data-t="Extend it to eight" data-act="3 · the opcode">
  <div>
    <h2>Add four more units. The field grows by exactly one wire.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 390" width="1016" height="341"><g id="figLive8"></g></svg></div>
    <div class="btnrow"><span class="lab">SELECT</span>
      <button class="btn" id="l8_0">000</button>
      <button class="btn" id="l8_1">001</button>
      <button class="btn" id="l8_2">010</button>
      <button class="btn" id="l8_3">011</button>
      <button class="btn" id="l8_4">100</button>
      <button class="btn" id="l8_5">101</button>
      <button class="btn" id="l8_6">110</button>
      <button class="btn" id="l8_7">111</button>
    </div>
  </div>
  <div class="cue">Eight operations, three wires. Ask what happens at nine and let them work out that you pay a whole wire for one operation.</div>
</section>

<section class="slide" data-t="The opcode is a wire count" data-act="3 · the opcode">
  <div class="center">
    <h2 style="font-size:38px;margin-bottom:18px">The opcode was never<br>a convention.</h2>
    <p class="big" style="max-width:56ch;color:var(--soft)">Nobody sat in a committee and decided that an instruction should contain a three bit field. The field is three bits because the machine contains eight circuits, and a selector for eight things needs three wires.</p>
    <p class="big frag" style="margin-top:20px;max-width:56ch">It is a wire count. Build a ninth circuit and the opcode is four bits, and no amount of agreeing in a room can make it otherwise.</p>
  </div>
  <div class="cue">This is the sentence of the hour. Say it slowly and let it sit before moving on.</div>
</section>

<!-- ================= ACT 4 ================= -->

<section class="slide" data-t="Name it" data-act="4 · the object">
  <div>
    <div class="tag new">IT HAS A NAME</div>
    <h2 style="margin-bottom:0">Arithmetic Logic Unit. Here it is from outside.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 364" width="1040" height="326"><g id="figALUbox"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">what the rest of the machine sees</div>
      <ul>
        <li>Two operands in, one opcode in, one result out, four flags out. Everything inside is now somebody else's problem.</li>
        <li>You have built the computational core of every processor ever made, out of parts you derived from truth tables, and it took thirty hours.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Draw the box on the board yourself while saying this. The abstraction barrier is the deliverable, not the contents.</div>
</section>

<section class="slide" data-t="The four flags" data-act="4 · the object">
  <div>
    <h2>Four extra wires, and not one of them needs a new gate.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1058" height="301"><g id="figFlags"></g></svg></div>
    <div class="rem win frag" style="max-width:none">
      <div class="h">where each one comes from</div>
      <ul>
        <li><strong>Z</strong> is a NOR of the whole result. <strong>N</strong> is the top bit, taken as a wire. <strong>C</strong> is the carry out the adder was producing anyway. <strong>V</strong> is the overflow expression from Class 23.</li>
        <li>Three of the four are wires that already existed. Only Z costs anything, and it costs one tree of NOR gates.</li>
      </ul>
    </div>
  </div>
  <div class="cue">They have met all four separately. This is the first time they are collected as one output port.</div>
</section>

<section class="slide" data-t="Every comparison" data-act="4 · the object">
  <div>
    <h2>Those four bits implement every comparison a program can make.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1160 352" width="1040" height="316"><g id="figCmpExpr"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">from Class 28, now with somewhere to live</div>
      <ul>
        <li>Six comparisons, signed and unsigned, out of four bits and at most one gate each. There is no comparison instruction anywhere in this machine.</li>
        <li>Every branch any program will ever take is a subtraction you already built, read through four wires you were already producing.</li>
      </ul>
    </div>
  </div>

    <div style="text-align:center"><svg viewBox="0 0 1160 330" width="1058" height="301"><g id="figOnePass"></g></svg></div>
    <div class="rem bad frag" style="max-width:none">
      <div class="h">what the ledger says, using your own numbers</div>
      <ul>
        <li>Put the multiplier in the single cycle ALU and the critical path is 31 gate delays, 620 picoseconds, a ceiling of <span class="num">1.61</span> gigahertz. Take it out and the ceiling is <span class="num">2.78</span>.</li>
        <li>So the multiplier alone costs you forty per cent of your clock, which is why real processors give it its own path and several cycles.</li>

  function liveALU(gid,ops,selBits,btnPrefix){
    var g=document.getElementById(gid); if(!g) return;
    var A=0x6, B=0x5, sel=0;
    function bits(v,n){ var s=''; for(var k=n-1;k>=0;k--) s+=((v>>k)&1); return s; }
    function render(){
      while(g.firstChild) g.removeChild(g.firstChild);
      txt(g,24,20,ops.length+' UNITS, '+selBits+' SELECT '+(selBits===1?'LINE':'LINES')+', FOUR BIT OPERANDS',
        {'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
      /* operands */
      var OX=40, CW=30, OY=52;
      function nib(x,y,v,lab,col,soft){
        txt(g,x-12,y+21,lab,{'font-size':14,fill:col,'text-anchor':'end','font-weight':700});
        bits(v,4).split('').forEach(function(c,k){
          cel(g,x+k*CW,y,CW-3,30,c,{fill:soft,stroke:col,fs:13});
        });
      }
      nib(OX+40,OY,A,'a',GRN,'#e6f1ee');
      nib(OX+40,OY+40,B,'b',GRN,'#e6f1ee');
      txt(g,OX+40,OY+104,'held fixed',{'font-size':11.5,fill:'#8b9096'});

      /* units */
      var BX=250, BW=150, BH=ops.length>4?22:34, GP=ops.length>4?5:12, Y0=46;
      var H=ops.length*(BH+GP)-GP;
      ops.forEach(function(o,k){
        var y=Y0+k*(BH+GP), live=(k===sel);
        el('rect',{x:BX,y:y,width:BW,height:BH,rx:6,fill:live?'#fdf3e3':'#faf9f6',
          stroke:live?AMB:'#dedbd3','stroke-width':live?2.2:1.5},g);
        txt(g,BX+12,y+BH/2+5,o[0],{'font-size':12.5,fill:live?INK:'#b2b6bb','font-weight':700});
        /* its result, always computed */
        var rx=BX+BW+22;
        bits(o[1],4).split('').forEach(function(c,j){
          cel(g,rx+j*22,y+(BH-20)/2,20,20,c,
            {fill:live?'#fdf3e3':'#fff',stroke:live?AMB:'#e2e0d9',col:live?INK:'#c6c3ba',fs:10.5,sw:1.3});
        });
        wire(g,OX+170,Y0+H/2,BX,y+BH/2,live);
        wire(g,rx+92,y+BH/2,660,y+BH/2,live);
      });
      txt(g,BX+BW+22,Y0-10,'every unit computes, every time',{'font-size':11,fill:'#8b9096'});

      /* mux */
      var MX=660, MW=56;
      el('path',{d:'M'+MX+' '+Y0+' L'+(MX+MW)+' '+(Y0+22)+' L'+(MX+MW)+' '+(Y0+H-22)+' L'+MX+' '+(Y0+H)+' z',
        fill:'#eaeef7',stroke:BLUE,'stroke-width':2.2},g);
      txt(g,MX+MW/2,Y0+H/2+5,'mux',{'font-size':12,fill:BLUE,'text-anchor':'middle','font-weight':700});
      arw(g,MX+MW,Y0+H/2,MX+MW+60,Y0+H/2,BLUE,2.6);

      /* result */
      var RX=MX+MW+76;
      txt(g,RX,Y0+H/2-26,'RESULT',{'font-size':10.5,fill:BLUE,'letter-spacing':1.4});
      bits(ops[sel][1],4).split('').forEach(function(c,k){
        cel(g,RX+k*34,Y0+H/2-14,31,34,c,{fill:'#eaeef7',stroke:BLUE,fs:15});
      });
      txt(g,RX+150,Y0+H/2+9,'= '+ops[sel][1],{'font-size':16,fill:BLUE,'font-weight':700});
      txt(g,RX,Y0+H/2+42,ops[sel][0],{'font-size':13,fill:INK,'font-weight':700});

      /* the select wires */
      var SX=MX+MW/2, SY=Y0+H+24;
      var sb=bits(sel,selBits);
      for(var k=0;k<selBits;k++){
        var x=SX-((selBits-1)*30)/2+k*30;
        el('line',{x1:x,y1:SY+18,x2:x,y2:Y0+H+2,stroke:HI,'stroke-width':3.4,'stroke-linecap':'round'},g);
        cel(g,x-11,SY+18,22,24,sb[k],{fill:'#fdf3e3',stroke:AMB,fs:12});
      }
      txt(g,SX,SY+62,'opcode '+sb,{'font-size':14,fill:AMB,'text-anchor':'middle','font-weight':700});
      txt(g,24,SY+62,'nothing in the circuit changed. '+selBits+' bits changed.',
        {'font-size':13.5,fill:INK,'font-weight':700});
    }
    for(var k=0;k<ops.length;k++){
      (function(k){
        var b=document.getElementById(btnPrefix+k);
        if(b) b.onclick=function(){
          sel=k; render();
          for(var j=0;j<ops.length;j++){
            var bb=document.getElementById(btnPrefix+j);
            if(bb) bb.classList.toggle('hot',j===k);
          }
        };
      })(k);
    }
    var first=document.getElementById(btnPrefix+'0');
    if(first) first.classList.add('hot');
    render();
  }

    var X0=40, CW=30, Y=48;
    txt(g,X0,Y-8,'the 32 bit result',{'font-size':11.5,fill:'#8b9096'});
    for(var k=0;k<12;k++)
      cel(g,X0+k*CW,Y,CW-3,30,(k===0?'1':(k%4===0?'0':'1')),{fill:'#eaeef7',stroke:BLUE,fs:12});
    txt(g,X0+12*CW+10,Y+21,'. . .',{'font-size':14,fill:'#b2b6bb'});

    var rows=[
      ['N','negative','the top bit, taken as a wire','no gates at all',GRN,'#e6f1ee'],
      ['Z','zero','a NOR tree over all 32 bits','one tree, 11 gates',AMB,'#fdf3e3'],
      ['C','carry','the carry the adder already produced','no gates at all',GRN,'#e6f1ee'],
      ['V','overflow','carry in to the sign, XOR carry out','one gate, from Class 23',GRN,'#e6f1ee']
    ];
    var RY=108, RH=48;
    rows.forEach(function(r,k){
      var y=RY+k*RH;
      el('rect',{x:24,y:y,width:1112,height:RH-8,rx:8,fill:r[5],stroke:r[4],'stroke-width':1.6},g);
      txt(g,48,y+26,r[0],{'font-size':19,fill:r[4],'font-weight':700});
      txt(g,86,y+26,r[1],{'font-size':14,fill:INK,'font-weight':700});
      txt(g,250,y+26,r[2],{'font-size':13,fill:'#4b5057'});
      txt(g,1112,y+26,r[3],{'font-size':13,fill:r[4],'text-anchor':'end','font-weight':700});
    });
    txt(g,24,312,'three of the four were already there. you have been producing them since Class 23 and throwing them away.',
      {'font-size':14,fill:INK,'font-weight':700});
  })();

  /* ================= every comparison ================= */
  (function(){
    var g=document.getElementById('figCmpExpr'); if(!g) return;
    txt(g,24,20,'SIX COMPARISONS, OUT OF FOUR BITS',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var rows=[
      ['a = b','Z','no gates',GRN],
      ['a ≠ b','not Z','one NOT',GRN],
      ['a < b   unsigned','carry clear','no gates',BLUE],
      ['a ≥ b   unsigned','carry set','no gates',BLUE],
      ['a < b   signed','N xor V','one XOR',VIO],
      ['a ≥ b   signed','not (N xor V)','one XOR, one NOT',VIO]
    ];
    var Y0=48, RH=38;
    rows.forEach(function(r,k){
      var y=Y0+k*RH;
      el('rect',{x:24,y:y,width:1112,height:RH-7,rx:7,fill:'#fff',stroke:'#e2e0d9','stroke-width':1.5},g);
      txt(g,48,y+21,r[0],{'font-size':14,fill:INK,'font-weight':700});
      txt(g,420,y+21,'is',{'font-size':12.5,fill:'#b2b6bb'});
      txt(g,470,y+21,r[1],{'font-size':14.5,fill:r[3],'font-weight':700});
      txt(g,1112,y+21,r[2],{'font-size':12.5,fill:'#8b9096','text-anchor':'end'});
    });
    var YB=Y0+6*RH+10;
    el('rect',{x:24,y:YB,width:1112,height:50,rx:10,fill:'#e6f1ee',stroke:GRN,'stroke-width':1.8},g);
    txt(g,46,YB+22,'there is no comparison circuit anywhere in this machine.',{'font-size':14,fill:'#0f5a4c','font-weight':700});
    txt(g,46,YB+40,'every branch a program will ever take is a subtraction you already built, read through four wires you were already producing.',
      {'font-size':12.5,fill:'#0f5a4c'});
  })();

  /* ================= one unit will not fit ================= */
  (function(){
    var g=document.getElementById('figOnePass'); if(!g) return;
    txt(g,24,20,'EVERY UNIT’S DELAY, AGAINST ONE CLOCK CYCLE',{'font-size':10.5,fill:BLUE,'letter-spacing':1.6});
    var X0=190, U=24.5, Y0=44, RH=27, MUX=5;
    var units=[['AND, OR, XOR',1],['barrel shifter',10],['add and subtract',13],['multiplier',26]];
    units.forEach(function(u,k){
      var y=Y0+k*RH;
      txt(g,X0-14,y+18,u[0],{'font-size':12.5,fill:'#4b5057','text-anchor':'end'});
      el('rect',{x:X0,y:y+4,width:u[1]*U,height:18,rx:4,fill:'#fdf3e3',stroke:AMB,'stroke-width':1.5},g);
      el('rect',{x:X0+u[1]*U,y:y+4,width:MUX*U,height:18,rx:4,fill:'#eaeef7',stroke:BLUE,'stroke-width':1.5},g);
      txt(g,X0+(u[1]+MUX)*U+10,y+18,(u[1]+MUX)+' delays',{'font-size':12,fill:INK,'font-weight':700});
    });
    txt(g,X0,Y0+4*RH+16,'unit',{'font-size':11,fill:AMB,'font-weight':700});
    txt(g,X0+60,Y0+4*RH+16,'output multiplexer',{'font-size':11,fill:BLUE,'font-weight':700});

    /* the 3 GHz cycle line */
    var CY=Y0-10, CB=Y0+4*RH+2;
    var x3=X0+(333/20)*U;
    el('line',{x1:x3,y1:CY,x2:x3,y2:CB,stroke:RED,'stroke-width':2.6,'stroke-dasharray':'6 4'},g);
    txt(g,x3+8,CY+10,'one cycle at 3 GHz',{'font-size':12,fill:RED,'font-weight':700});

    var YB=Y0+4*RH+36;
    function card(x,w,t,v,s,col,soft){
      el('rect',{x:x,y:YB,width:w,height:84,rx:10,fill:soft,stroke:col,'stroke-width':1.8},g);
      txt(g,x+20,YB+24,t,{'font-size':13,fill:'#4b5057'});
      txt(g,x+20,YB+54,v,{'font-size':24,fill:col,'font-weight':700});
      txt(g,x+20,YB+74,s,{'font-size':12,fill:'#8b9096'});
    }
    card(24,358,'with the multiplier inside','1.61 GHz','31 gate delays, 620 ps',RED,'#fbeeed');
    card(400,358,'with the multiplier outside','2.78 GHz','18 gate delays, 360 ps',GRN,'#e6f1ee');
    card(776,360,'the divider, Class 26','many cycles','a selector cannot express it',AMB,'#fdf3e3');
  })();

  onSlide=function(idx){};
  paint();
})();
</script>
