<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 15</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 15 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- ===== ACT 1 ===== -->

<section class="slide" data-t="Title" data-act="1 · an unreasonable request">
  <div>
    <div class="kicker">class 15 · hour fifteen of fifty</div>
    <h1>Can anything be<br>built from gates?</h1>
    <p class="big" style="margin-top:24px;max-width:46ch">You have six kinds of gate and you know what each costs. Today: find out whether that is enough, and for what.</p>
  </div>
  <div class="cue">This is the hour the arc turns on. If they leave with one thing, it is the machine on slide five.</div>
</section>

<section class="slide" data-t="A table I invented" data-act="1 · an unreasonable request">
  <div>
    <div class="kicker">no story, no meaning, no hint</div>
    <h2 style="font-size:29px;margin-bottom:4px">Here is a table. I made it up on the way in.</h2>
    <div class="split" style="gap:50px">
      <div style="display:flex;justify-content:flex-end">
        <div class="panel"><svg viewBox="0 0 300 380" width="270" height="342"><g id="figChal"></g></svg></div>
      </div>
      <div class="stack">
        <p>Three inputs, eight rows, and I chose every output by flipping a coin.</p>
        <p class="frag">It computes nothing. It is not a known function. Nobody has ever needed it, and there is no pattern in it to find.</p>
        <p class="big frag" style="margin-top:4px">Build me the circuit.</p>
      </div>
    </div>
  </div>
  <div class="cue">Three minutes, in pairs. They will hunt for structure and there is none. The failure is the setup for the next slide.</div>
</section>

<!-- ===== ACT 2 ===== -->

<section class="slide" data-t="A row is a detector" data-act="2 · one row at a time">
  <div>
    <div class="kicker">so stop reading the table and read one row</div>
    <h2 style="font-size:29px;margin-bottom:2px">An AND gate is a detector for exactly one row.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1240 384" width="1180" height="365"><g id="figDet"></g></svg></div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Take one row of that table. The row <span class="num">1 0 0</span> wants a 1, so feed an AND gate <span class="num">a</span>, <span class="num">NOT b</span> and <span class="num">NOT c</span>.</li>
        <li>It fires on its own row and stays dark on the other seven. <strong>Including three rows that also want a 1</strong>, and that is not a mistake.</li>
        <li>This gate answers for one row only. Each of the other three needs a detector of its own, which is exactly what the next slide builds.</li>
        <li>One row wanting a 1 becomes one AND gate. It has a name: a <strong>minterm</strong>.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Let the cycle run twice before saying anything. The silence on seven rows out of eight is the whole point.</div>
</section>

<!-- ===== ACT 3 · THE MACHINE ===== -->

<section class="slide" data-t="Watch it get built" data-act="3 · the machine">
  <div>
    <div class="kicker">press build. one step at a time.</div>
    <h2 style="font-size:28px;margin-bottom:2px">Four rows want a 1. So the circuit needs four detectors and one OR.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1060 530" width="1100" height="550"><g id="figBuild"></g></svg></div>
    <div class="stagelab" id="bLab"></div>
    <div class="btnrow">
      <button class="btn hot" id="bStep">build &#9654;</button>
      <button class="btn" id="bAuto">play all</button>
      <button class="btn" id="bTest" disabled>test every row</button>
      <button class="btn" id="bReset">reset</button>
    </div>
  </div>
  <div class="cue">Step through it by hand the first time, narrating each stage. Then press test and let it check itself against the table.</div>
</section>

<section class="slide" data-t="Four steps" data-act="3 · the machine">
  <div>
    <h2>Written out, that was four steps and no judgement anywhere.</h2>
    <ol class="steps" style="margin-top:2px">
      <li>Write the table. Every combination of inputs, and what you want out of each.</li>
      <li class="frag">Cross out every row whose output is 0. They contribute nothing at all.</li>
      <li class="frag">Turn each surviving row into one AND gate, fed by each input directly where the row has a 1, and through an inverter where it has a 0.</li>
      <li class="frag">Feed every AND gate into a single OR gate. Its output is your function.</li>
    </ol>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Nowhere in those four steps did anyone have to be clever, spot anything, or know what the function was for.</li>
        <li>The shape it produces is called <strong>sum of products</strong>. The products are the ANDs and the sum is the OR.</li>
        <li>A procedure with no judgement in it is a procedure a machine can run. That is your assignment.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Say no judgement out loud. It is Shannon's promise from Class 13 being delivered in full.</div>
</section>

<!-- ===== ACT 4 · THEREFORE ===== -->

<section class="slide" data-t="The proof" data-act="4 · therefore">
  <div>
    <div class="kicker">and now the sentence the whole arc was for</div>
    <h2 style="font-size:29px;margin-bottom:6px">That procedure never fails.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Take any function of any <span class="num">n</span> inputs. Whatever it does, however it was described to you.</p>
        <p class="frag">It has a truth table, because it must produce some output for each of the <span class="num">2<sup>n</sup></span> input combinations. There is nowhere else for a definition to live.</p>
        <p class="frag">Every row of that table is either a 0, which you discard, or a 1, which becomes one AND gate.</p>
      </div>
      <div class="rem frag" style="margin-top:0;border-left-color:var(--ok)">
        <div class="h" style="color:var(--ok)">therefore</div>
        <ul>
          <li>Every function of bits, without exception, can be built from AND, OR and NOT.</li>
          <li>Not most functions. Not the useful ones. <strong>All of them.</strong></li>
          <li>And the construction is mechanical, so you never again have to wonder whether a thing is buildable.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Slow right down. Three sentences and it is proved, and most courses assert this without ever showing why.</div>
</section>

<section class="slide" data-t="The question changes" data-act="4 · therefore">
  <div>
    <h2>Which closes one question permanently and opens a better one.</h2>
    <div style="text-align:center;margin:6px 0"><svg viewBox="0 0 1180 210" width="1120" height="199"><g id="figPivot"></g></svg></div>
    <div class="rem frag" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>Adding two numbers is a function of bits. So is comparing them, sorting them, or deciding which circuit an instruction refers to.</li>
        <li>All of them are buildable, and you now know the procedure that builds them.</li>
        <li>Every hour from here to Class 50 is about the second question, not the first.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Put both questions on the board and draw a line under the first. This is the pivot of the whole course.</div>
</section>

<!-- ===== ACT 5 · THE BILL ===== -->

<section class="slide" data-t="The bill" data-act="5 · the bill">
  <div>
    <div class="kicker">because the procedure is correct, not cheap</div>
    <h2 style="font-size:29px;margin-bottom:2px">The table doubles every time you add one input.</h2>
    <div class="prog">
      <div>
<pre><span class="c">/* 04-cost.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    printf(<span class="s">"inputs   rows in the table   "</span>
           <span class="s">"worst case AND gates\n"</span>);

    <span class="k">for</span> (<span class="f">int</span> n = <span class="s">1</span>; n &lt;= <span class="s">16</span>; n++) {
        <span class="f">long</span> rows = <span class="s">1L</span> &lt;&lt; n;
        <span class="k">if</span> (n &lt;= <span class="s">6</span> || n == <span class="s">8</span> || n == <span class="s">12</span> || n == <span class="s">16</span>)
            printf(<span class="s">"%4d   %17ld   %19ld\n"</span>,
                   n, rows, rows / <span class="s">2</span>);
    }
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">inputs   rows in the table   worst case AND gates
   1                   2                     1
   2                   4                     2
   3                   8                     4
   4                  16                     8
   5                  32                    16
   6                  64                    32
   8                 256                   128
  12                4096                  2048
  16               65536                 <span class="hit">32768</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Sixteen inputs is a modest circuit, and its table already has 65,536 rows.</li>
            <li>A 32 bit comparison takes 64 inputs. Its table would have about 18,400,000,000,000,000,000 rows.</li>
            <li>The method is correct at every size and unusable past about six inputs. Both are true at once.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Class 16 is entirely about what to do when the table is too big to write. Do not answer it here.</div>
</section>

<!-- ===== ACT 6 · ONE GATE ===== -->

<section class="slide" data-t="One gate is enough" data-act="6 · one gate">
  <div>
    <div class="kicker">flip a and b. all three are built from NAND alone.</div>
    <h2 style="font-size:29px;margin-bottom:2px">The procedure needs AND, OR and NOT. It could need less.</h2>
    <div style="text-align:center"><svg viewBox="0 0 1200 300" width="1140" height="285"><g id="figNand"></g></svg></div>
    <div class="btnrow">
      <button class="btn" id="nA">flip a</button>
      <button class="btn" id="nB">flip b</button>
    </div>
    <div class="rem" style="max-width:none">
      <div class="h">remember</div>
      <ul>
        <li>NOT is a NAND with both inputs tied together. AND is that inverter on a NAND. OR is a NAND fed by two inverters, which is De Morgan's law drawn as a picture.</li>
        <li>So one gate type is enough for every function of bits there is. NAND is called <strong>functionally complete</strong>, and so is NOR.</li>
        <li>The Apollo Guidance Computer was built from about 5,600 gates and they were all NOR. One part number for the whole machine.</li>
      </ul>
    </div>
  </div>
  <div class="cue">Check each of the three against the tables from Class 14 as you flip.</div>
</section>

<!-- ===== ACT 7 · THE ASSIGNMENT ===== -->

<section class="slide" data-t="The compiler" data-act="7 · the assignment">
  <div>
    <div class="kicker">and since the procedure has no judgement in it</div>
    <h2 style="font-size:29px;margin-bottom:2px">A program can do the whole thing.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 01-compile.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="c">/* the function you want, one entry per row */</span>
    <span class="f">int</span> want[<span class="s">8</span>] = { <span class="s">0</span>, <span class="s">1</span>, <span class="s">0</span>, <span class="s">1</span>, <span class="s">1</span>, <span class="s">0</span>, <span class="s">0</span>, <span class="s">1</span> };
    <span class="f">int</span> terms = <span class="s">0</span>;

    printf(<span class="s">"out = "</span>);

    <span class="k">for</span> (<span class="f">int</span> row = <span class="s">0</span>; row &lt; <span class="s">8</span>; row++) {
        <span class="k">if</span> (!want[row]) <span class="k">continue</span>;

        <span class="f">int</span> a = row &gt;&gt; <span class="s">2</span> &amp; <span class="s">1</span>, b = row &gt;&gt; <span class="s">1</span> &amp; <span class="s">1</span>, c = row &amp; <span class="s">1</span>;

        <span class="k">if</span> (terms) printf(<span class="s">" + "</span>);
        printf(<span class="s">"%s%s%s"</span>, a ? <span class="s">"a"</span> : <span class="s">"a'"</span>,
                              b ? <span class="s">"b"</span> : <span class="s">"b'"</span>,
                              c ? <span class="s">"c"</span> : <span class="s">"c'"</span>);
        terms++;
    }
    <span class="k">if</span> (!terms) printf(<span class="s">"0"</span>);
    printf(<span class="s">"\n\n%d AND gates, then one OR gate with %d inputs\n"</span>,
           terms, terms);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">out = <span class="hit">a'b'c + a'bc + ab'c' + abc</span>

4 AND gates, then one OR gate with 4 inputs</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Twenty lines, and it turns any three input table into a circuit. It is the machine you just watched.</li>
            <li>The loop body is steps two and three, and nothing else.</li>
            <li>Notice what it never does: look for a pattern, simplify anything, or understand the function.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Type the loop body live. Six lines, and it is the entire content of the hour.</div>
</section>

<section class="slide" data-t="The assignment" data-act="7 · the assignment">
  <div>
    <div class="kicker">assignment two of six &#183; this one you keep</div>
    <h2 style="font-size:29px;margin-bottom:4px">Build the truth table compiler properly.</h2>
    <div class="split" style="margin-top:2px">
      <div class="stack">
        <p>Read a table from a file, with any number of inputs. Emit the sum of products expression, the gate count, and a netlist you can load into Logisim.</p>
        <p class="small frag">Then test it the way the machine tested itself: generate a random table, compile it, simulate the result, and check every row against what you asked for.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">why this one matters more than it looks</div>
        <ul>
          <li>It is layer two of the program you extend all term. The adder bench in Class 21 verifies itself against this.</li>

  })();

  /* ================= the hero: build it, then test it ================= */
  (function(){

    var LABELS=['press build',
      'step 2 \u00b7 every row wanting a 0 is struck out, four remain',
      'step 3a \u00b7 the inputs arrive, each with an inverter, so both versions run down the board',
      'step 3b \u00b7 the row 0 0 1 becomes a detector for a\u2032b\u2032c',
      'step 3c \u00b7 the row 0 1 1 becomes a detector for a\u2032bc',
      'step 3d \u00b7 the row 1 0 0 becomes a detector for ab\u2032c\u2032',
      'step 3e \u00b7 the row 1 1 1 becomes a detector for abc',
      'step 4 \u00b7 one OR gate collects them. the circuit is finished.'];

    function setStage(n){
      stage=Math.max(0,Math.min(MAX,n));
      strikes.forEach(function(s){ s.classList.toggle('on', stage>=1); });
      rowOuts.forEach(function(o,r){ o.setAttribute('opacity', (stage>=1 && !TABLE[r])?0.35:1); });
      g2.classList.toggle('on', stage>=2);
      andEls.forEach(function(o,k){ o.g.classList.toggle('on', stage>=3+k); });
      g7.classList.toggle('on', stage>=7);
      document.getElementById('bLab').textContent=LABELS[stage];
      document.getElementById('bTest').disabled = stage<MAX;
      document.getElementById('bStep').textContent = stage>=MAX ? 'built' : 'build \u25B6';
      document.getElementById('bStep').disabled = stage>=MAX;
      repaint();
    }
    function stopAll(){
      if(autoT){ clearInterval(autoT); autoT=null; }
      if(testT){ clearInterval(testT); testT=null; }
      document.getElementById('bAuto').classList.remove('hot');
      document.getElementById('bTest').classList.remove('hot');
    }
    document.getElementById('bStep').onclick=function(){ stopAll(); setStage(stage+1); };
    document.getElementById('bReset').onclick=function(){ stopAll(); A=0;B=0;C=1; setStage(0); };
    document.getElementById('bAuto').onclick=function(){
      if(autoT){ stopAll(); return; }
      stopAll(); this.classList.add('hot');
      if(stage>=MAX) setStage(0);
      autoT=setInterval(function(){ if(stage>=MAX){ stopAll(); return; } setStage(stage+1); },1250);
    };
    document.getElementById('bTest').onclick=function(){
      if(testT){ stopAll(); return; }
      stopAll(); this.classList.add('hot');
      var r=7;
      testT=setInterval(function(){
        r=(r+1)%8; A=r>>2&1; B=r>>1&1; C=r&1; repaint();
        var o=values().out;
        document.getElementById('bLab').textContent =
          'testing '+A+' '+B+' '+C+' \u00b7 circuit says '+o+' \u00b7 table says '+TABLE[r]+
          (o===TABLE[r]?'   \u2713':'   MISMATCH');
      },900);
    };
    setStage(0);
    window.__buildReset=function(){ stopAll(); };
  })();

  /* ================= NAND completeness ================= */
  (function(){
    var g=document.getElementById('figNand'); if(!g) return;
    var A=1,B=0;
    function nand(x,y){ return (x&&y)?0:1; }
    var parts={};
    function nd(p,x,y){
      var gg=el('g',{},p);
      var body=andGate(gg,x,y,24,{});
      var bub=el('circle',{cx:x+47,cy:y,r:5,fill:'#fff',stroke:INK,'stroke-width':2.2},gg);
      return {body:body,bub:bub};
    }
    /* three panels */
    var cols=[{x:30,t:'NOT a',sub:'both inputs tied together'},
              {x:430,t:'a AND b',sub:'a NAND, then invert it'},
              {x:830,t:'a OR b',sub:'invert both, then NAND'}];
    cols.forEach(function(c){
      rect(g,c.x,24,340,232,{fill:'#fbfaf7',stroke:'#e2e0d9',rx:12});
      text(g,c.x+20,52,c.t,{'font-size':17,fill:INK,'font-weight':700});
      text(g,c.x+20,238,c.sub,{'font-size':13,fill:'#8b9096'});
    });
    /* NOT */
    var n1=nd(g,150,140); parts.n1=n1;
    parts.w1a=line(g,80,132,150,132,{}); parts.w1b=line(g,80,148,150,148,{});
    text(g,68,144,'a',{'font-size':16,fill:INK,'text-anchor':'end'});
    parts.w1o=line(g,202,140,258,140,{});
    parts.b1=rect(g,258,118,44,44,{}); parts.t1=text(g,280,148,'0',{'font-size':20,'text-anchor':'middle','font-weight':700});
    /* AND */
    var n2=nd(g,500,140), n3=nd(g,610,140); parts.n2=n2; parts.n3=n3;
    parts.w2a=line(g,458,130,500,130,{}); parts.w2b=line(g,458,150,500,150,{});
    text(g,446,126,'a',{'font-size':15,fill:INK,'text-anchor':'end'});
    text(g,446,158,'b',{'font-size':15,fill:INK,'text-anchor':'end'});
    parts.w2m1=line(g,552,140,610,132,{}); parts.w2m2=line(g,552,140,610,148,{});
    parts.w2o=line(g,662,140,706,140,{});
    parts.b2=rect(g,706,118,44,44,{}); parts.t2=text(g,728,148,'0',{'font-size':20,'text-anchor':'middle','font-weight':700});
    /* OR */
    var n4=nd(g,900,92), n5=nd(g,900,196), n6=nd(g,1010,144); parts.n4=n4; parts.n5=n5; parts.n6=n6;
    parts.w3a1=line(g,858,84,900,84,{}); parts.w3a2=line(g,858,100,900,100,{});
    parts.w3b1=line(g,858,188,900,188,{}); parts.w3b2=line(g,858,204,900,204,{});
    text(g,846,96,'a',{'font-size':15,fill:INK,'text-anchor':'end'});
    text(g,846,200,'b',{'font-size':15,fill:INK,'text-anchor':'end'});
    parts.w3m1=path(g,'M952 92 L980 92 L980 136 L1010 136',{});
    parts.w3m2=path(g,'M952 196 L980 196 L980 152 L1010 152',{});
    parts.w3o=line(g,1062,144,1106,144,{});
    parts.b3=rect(g,1106,122,44,44,{}); parts.t3=text(g,1128,152,'0',{'font-size':20,'text-anchor':'middle','font-weight':700});

    function paintN(){
      var na=nand(A,A), ab=nand(A,B), and_=nand(ab,ab),
          nb=nand(B,B), or_=nand(na,nb);
      function setW(w,v){ if(w) w.setAttribute('stroke', sig(v)); }
      function setG(n,v){ n.body.setAttribute('fill',v?'#fbf0dc':'#fff'); n.body.setAttribute('stroke',v?'#b06a12':INK);
                          n.bub.setAttribute('stroke',v?'#b06a12':INK); }
      function setB(b,t,v){ b.setAttribute('fill',v?'#fbf0dc':'#eef0f2'); b.setAttribute('stroke',v?'#b06a12':GREY);
                            t.textContent=v; t.setAttribute('fill',v?HI:'#6b7178'); }
      setW(parts.w1a,A); setW(parts.w1b,A); setG(parts.n1,na); setW(parts.w1o,na); setB(parts.b1,parts.t1,na);
      setW(parts.w2a,A); setW(parts.w2b,B); setG(parts.n2,ab);
      setW(parts.w2m1,ab); setW(parts.w2m2,ab); setG(parts.n3,and_); setW(parts.w2o,and_); setB(parts.b2,parts.t2,and_);
      setW(parts.w3a1,A); setW(parts.w3a2,A); setW(parts.w3b1,B); setW(parts.w3b2,B);
      setG(parts.n4,na); setG(parts.n5,nb); setW(parts.w3m1,na); setW(parts.w3m2,nb);
      setG(parts.n6,or_); setW(parts.w3o,or_); setB(parts.b3,parts.t3,or_);
      document.getElementById('nA').textContent='a = '+A;
      document.getElementById('nB').textContent='b = '+B;
    }
    document.getElementById('nA').onclick=function(){ A=A?0:1; paintN(); };
    document.getElementById('nB').onclick=function(){ B=B?0:1; paintN(); };
    paintN();
  })();

  /* ================= the pivot figure ================= */
  (function(){
    var g=document.getElementById('figPivot'); if(!g) return;
    rect(g,30,30,520,140,{fill:'#f2f0ea',stroke:'#e2e0d9',rx:14});
    text(g,290,84,'can this be built from gates?',{'font-size':25,fill:'#a9a69d','text-anchor':'middle'});
    line(g,90,100,490,100,{stroke:'#a8231f','stroke-width':3});
    text(g,290,132,'answered. for everything. forever.',{'font-size':15,fill:'#a8231f','text-anchor':'middle'});
    path(g,'M580 100 L640 100 M626 90 l14 10 l-14 10',{stroke:'#8b9096','stroke-width':2.5});
    rect(g,670,30,480,140,{fill:'#eaeef7',stroke:'#c3cee6',rx:14});
    text(g,910,88,'what will it cost?',{'font-size':30,fill:'#23408f','text-anchor':'middle','font-weight':700});
    text(g,910,130,'the remaining thirty five hours',{'font-size':15,fill:'#8b9096','text-anchor':'middle'});
  })();

  /* start and stop the auto animations with the slide */
  onSlide=function(idx){
    var t=slides[idx].dataset.t;
    if(t==='A row is a detector'){ if(window.__detStart) window.__detStart(); }
    else { if(window.__detStop) window.__detStop(); }
    if(t!=='Watch it get built' && window.__buildReset) window.__buildReset();
  };

  paint();
})();
</script>
