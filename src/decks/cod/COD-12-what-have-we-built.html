<style>
:root{
  --letterbox:#e6e4de; --stage:#faf9f6; --card:#ffffff;
  --ink:#15171b; --body:#4b5057; --soft:#8b9096;

  --accent:#23408f; --accent-soft:#eaeef7;
  --fail:#a8231f; --fail-soft:#fbeeed;
  --ok:#146b5c; --ok-soft:#e6f1ee;
  --amber:#b06a12; --amber-soft:#fbf0dc;
  --display:'Fraunces',Georgia,serif;
  --sans:'Source Sans 3',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);font-family:var(--sans);color:var(--body);-webkit-font-smoothing:antialiased}

#stage{position:absolute;top:50%;left:50%;width:1600px;height:900px;transform-origin:50% 50%;
  background:var(--stage);box-shadow:0 24px 70px rgba(20,22,28,.16);overflow:hidden}
.slide{position:absolute;inset:0;padding:58px 82px 90px;display:none;flex-direction:column;justify-content:center}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{position:absolute;top:26px;left:82px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);z-index:5}

.act{position:absolute;top:26px;right:82px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rule2);z-index:5}
#rail{position:absolute;left:82px;right:82px;bottom:30px;display:flex;gap:2px;align-items:flex-end;height:11px;z-index:5}

#rail i.done{background:var(--rule2)} #rail i.here{background:var(--accent);height:10px}

.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-bottom:12px}
h1{font-family:var(--display);font-weight:600;font-size:76px;line-height:1.02;letter-spacing:-.02em;color:var(--ink)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}

.center{text-align:center;align-items:center}
.center p,.center .big{margin-left:auto;margin-right:auto}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:18px 20px}

pre{background:#14181f;border-radius:10px;padding:17px 21px;font-family:var(--mono);font-size:14.5px;

.term.xs{font-size:13px;line-height:1.55}
.term.xxs{font-size:11.5px;line-height:1.55}
.term .dim{color:#7f8896} .term .hit{color:#ffd47e;font-weight:700}
.term .bad{color:#ff96a2;font-weight:700} .term .ok{color:#7fe6ad}

.rem{background:var(--card);border:1px solid var(--rule2);border-left:4px solid var(--accent);

.schemes tr:last-child td{border-bottom:none}

.ledger{width:100%;border-collapse:collapse;font-size:19px}
.ledger th{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--soft);font-weight:400;text-align:left;padding:0 10px 9px 0;border-bottom:1px solid var(--rule2)}
.ledger td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule)}
.ledger td:first-child{font-weight:700;color:var(--ink);width:23%}
.ledger td.done{color:var(--ok);font-family:var(--mono);font-size:15px}
.ledger td.open{color:var(--fail);font-family:var(--mono);font-size:15px}
.ledger tr:last-child td{border-bottom:none}

.can{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.can .box{border-radius:10px;padding:18px 22px}
.can .box.y{background:var(--ok-soft);border:1px solid #b6d5cc}
.can .box.n{background:var(--fail-soft);border:1px solid #e0bcb9}
.can .box .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.can .box.y .h{color:var(--ok)} .can .box.n .h{color:var(--fail)}
.can .box ul{list-style:none}
.can .box li{font-size:19px;line-height:1.4;padding:5px 0 5px 18px;position:relative;color:var(--ink)}
.can .box li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;border-radius:50%}
.can .box.y li::before{background:var(--ok)} .can .box.n li::before{background:var(--fail)}

svg text{font-family:'JetBrains Mono',monospace}
.frag{opacity:0;transition:opacity .28s ease}
.frag.shown{opacity:1}
.cue{position:absolute;left:82px;right:82px;bottom:76px;display:none;padding:11px 15px;border-left:4px solid var(--fail);
  background:var(--fail-soft);color:#8a2420;font-size:17px;line-height:1.4;font-style:italic;z-index:6}
body.cues .cue{display:block}

#jump{position:absolute;inset:0;z-index:20;background:rgba(250,249,246,.985);display:none;padding:52px 82px}
#jump.open{display:block}
#jump h4{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;font-weight:400}
#jump ol{list-style:none;columns:2;column-gap:60px}
#jump li{padding:5px 0;border-bottom:1px solid var(--rule);cursor:pointer;font-size:17px;color:var(--body);display:flex;gap:14px;break-inside:avoid}
#jump li:hover{color:var(--accent)} #jump li span{font-family:var(--mono);font-size:.72em;color:var(--soft);width:36px}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.frag{transition:none}}
</style>

<body>

<div id="stage">
  <div class="eyebrow">Computer Organisation &amp; Design &nbsp;·&nbsp; <b>Class 12</b></div>
  <div class="act" id="actlab"></div>
  <div id="deck"></div>
  <div id="rail"></div>
  <div id="count"></div>
  <div id="help">← → &nbsp;·&nbsp; o index &nbsp;·&nbsp; n notes &nbsp;·&nbsp; f full</div>
  <div id="jump"><h4>Class 12 · running order</h4><ol id="jumplist"></ol></div>
</div>

<template id="slides">

<!-- 01 -->
<section class="slide" data-t="Title" data-act="closing the arc">
  <div>
    <div class="kicker">class 12 · hour twelve of fifty · arc one closes</div>
    <h1>What have<br>we built?</h1>
    <p class="big" style="margin-top:26px;max-width:46ch">Eleven hours on one question, and the answer turns out to be six different agreements about the same thirty two wires.</p>
  </div>
  <div class="cue">No new material today. Everything on these slides has already been on a slide once.</div>
</section>

<!-- 02 -->
<section class="slide" data-t="One question" data-act="closing the arc">
  <div>
    <h2>The whole arc was one question, asked eleven times.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p class="big" style="max-width:none">Which values should these patterns mean?</p>
        <p>Four billion patterns in thirty two wires, and no rule anywhere in the hardware about what any of them denotes.</p>
      </div>
      <div class="rem" style="margin-top:0">
        <div class="h">what each session answered</div>
        <ul>
          <li>Class 4: the non negative integers, in any base you like.</li>
          <li>Class 5: all the integers, by cutting a circle in half.</li>
          <li>Classes 6 and 7: real numbers, approximately, with two edges.</li>
          <li>Class 9: real numbers exactly, over a narrow range.</li>
          <li>Class 11: characters, which are not numbers at all.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Ask them for the list before showing it. Eleven hours is long enough that they have stopped seeing the through line.</div>
</section>

<!-- 03 -->
<section class="slide" data-t="01 · five readings" data-act="synthesis">
  <div>
    <h2>One pattern. Everything you now know how to read.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 01-six.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;string.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">unsigned</span> pattern = <span class="s">0x52732E31</span>;
    <span class="f">int</span> i;  <span class="f">float</span> f;  <span class="f">char</span> c[<span class="s">5</span>] = { <span class="s">0</span> };

    memcpy(&amp;i, &amp;pattern, <span class="s">4</span>);
    memcpy(&amp;f, &amp;pattern, <span class="s">4</span>);
    memcpy(c, &amp;pattern, <span class="s">4</span>);

    printf(<span class="s">"unsigned          %u\n"</span>, pattern);
    printf(<span class="s">"two's complement  %d\n"</span>, i);
    printf(<span class="s">"Q16.16 fixed      %.5f\n"</span>, pattern / <span class="s">65536.0</span>);
    printf(<span class="s">"IEEE 754 float    %g\n"</span>, f);
    printf(<span class="s">"four characters   %c%c%c%c\n"</span>,
           c[<span class="s">3</span>], c[<span class="s">2</span>], c[<span class="s">1</span>], c[<span class="s">0</span>]);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">one pattern: 0x52732E31

unsigned          1383280177
two's complement  1383280177
Q16.16 fixed      21107.18044
IEEE 754 float    2.61113e+11
four characters   <span class="hit">Rs.1</span>

five readings. the bits never moved.</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Five answers, all correct, from one unchanged set of thirty two voltages.</li>
            <li>The unsigned and signed readings agree here only because the top bit is zero. Set it and they part company.</li>
            <li>Nothing in the pattern says which reading is intended. That fact has been on the board since Class 1.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">The characters spell Rs.1. Somebody usually spots it before you say anything.</div>
</section>

<!-- 04 -->
<section class="slide" data-t="Every scheme" data-act="synthesis">
  <div>
    <h2>Every scheme in this arc, side by side.</h2>
    <table class="schemes">
      <tr><th>scheme</th><th>holds</th><th>spacing</th><th>fails when</th></tr>
      <tr><td>unsigned</td><td>0 to 4,294,967,295</td><td class="g">even, always 1</td><td class="b">it wraps, in silence</td></tr>
      <tr><td>two's complement</td><td>&minus;2,147,483,648 to 2,147,483,647</td><td class="g">even, always 1</td><td class="b">it wraps, and one negative has no positive twin</td></tr>
      <tr><td>fixed point</td><td>a range you choose, exactly</td><td class="g">even, you choose it</td><td class="b">it wraps, and the range is small</td></tr>
      <tr><td>IEEE 754</td><td>10<sup>&minus;45</sup> to 10<sup>38</sup>, approximately</td><td class="g">grows with the value</td><td class="b">it rounds, everywhere, always</td></tr>
      <tr><td>ASCII</td><td>128 characters</td><td class="g">not a number</td><td class="b">the world is not English</td></tr>
      <tr><td>UTF-8</td><td>every character there is</td><td class="g">not a number</td><td class="b">length stops having one answer</td></tr>
    </table>
  </div>
  <div class="cue">The fails column is the useful one. Three wrap, one rounds, two are not numbers. That is the whole arc in six rows.</div>
</section>

<!-- 05 -->
<section class="slide" data-t="02 · the laws" data-act="what broke">
  <div>
    <h2>Now test the arithmetic you learned at school.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 02-laws.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">double</span> A = <span class="s">1e16</span>, B = <span class="s">-1e16</span>, C = <span class="s">1.0</span>;
    <span class="f">double</span> x = <span class="s">0.1</span>, y = <span class="s">0.2</span>, z = <span class="s">0.3</span>;
    <span class="f">double</span> nan = <span class="s">0.0</span> / <span class="s">0.0</span>;

    printf(<span class="s">"a + b == b + a                 %s\n"</span>, A + B == B + A ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"a * b == b * a                 %s\n"</span>, x * y == y * x ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"(a + b) + c == a + (b + c)     %s\n"</span>, (A+B)+C == A+(B+C) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"(x * y) * z == x * (y * z)     %s\n"</span>, (x*y)*z == x*(y*z) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"x * (y + z) == x*y + x*z       %s\n"</span>,
           <span class="s">0.1</span>*(<span class="s">0.1</span>+<span class="s">0.7</span>) == <span class="s">0.1</span>*<span class="s">0.1</span> + <span class="s">0.1</span>*<span class="s">0.7</span> ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"(a + c) - c == a               %s\n"</span>, (C + A) - A == C ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"a + 1 &gt; a                      %s\n"</span>, A + <span class="s">1</span> &gt; A ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"a == a                         %s\n"</span>, nan == nan ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"0.1 + 0.2 == 0.3               %s\n"</span>, x + y == z ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xs frag">law                            holds?
a + b == b + a                 <span class="ok">yes</span>
a * b == b * a                 <span class="ok">yes</span>
(a + b) + c == a + (b + c)     <span class="bad">NO</span>
(x * y) * z == x * (y * z)     <span class="bad">NO</span>
x * (y + z) == x*y + x*z       <span class="bad">NO</span>
(a + c) - c == a               <span class="bad">NO</span>
a + 1 &gt; a                      <span class="bad">NO</span>
a == a                         <span class="bad">NO</span>
0.1 + 0.2 == 0.3               <span class="bad">NO</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Nine laws you have assumed since you were seven. Two survive.</li>
            <li>Adding one to a number does not always make it larger. A value can fail to equal itself.</li>
            <li>None of these is a bug. Every line is the correctly rounded result of the operation as written.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Read the failures aloud one at a time. The seventh is the one that unsettles people.</div>
</section>

<!-- 06 -->
<section class="slide" data-t="Why two survived" data-act="what broke">
  <div>
    <h2>The two that survived did not survive by luck.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p>Commutativity holds because the hardware adds two numbers without caring which arrived first. The rounding happens once, to one result.</p>
        <p class="frag">Associativity fails because moving the brackets changes <em>which intermediate value gets rounded</em>, and the size of a rounding depends on the magnitude it lands on.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>Every surviving law is one where rounding happens the same number of times, on the same magnitudes.</li>
          <li>Every failing law is one where regrouping changes what gets rounded and when.</li>
          <li>You do not need to memorise which is which. Ask where the rounding moved.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">This is the useful generalisation from Class 8, restated once the room has seen nine cases rather than one.</div>
</section>

<!-- 07 -->
<section class="slide" data-t="04 · and it depends" data-act="what broke">
  <div>
    <h2>And you cannot even memorise the list.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 04-both.c  ·  the same four laws, both types */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    <span class="f">float</span>  a = <span class="s">1e8f</span>, b = <span class="s">-1e8f</span>, c = <span class="s">1.0f</span>,
           p = <span class="s">0.1f</span>, q = <span class="s">0.2f</span>, r = <span class="s">0.3f</span>;
    <span class="f">double</span> A = <span class="s">1e8</span>,  B = <span class="s">-1e8</span>,  C = <span class="s">1.0</span>,
           P = <span class="s">0.1</span>,  Q = <span class="s">0.2</span>,  R = <span class="s">0.3</span>;

    printf(<span class="s">"(a+b)+c == a+(b+c)     %-7s %s\n"</span>,
      (a+b)+c == a+(b+c) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>,
      (A+B)+C == A+(B+C) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"(p*q)*r == p*(q*r)     %-7s %s\n"</span>,
      (p*q)*r == p*(q*r) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>,
      (P*Q)*R == P*(Q*R) ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"p*(q+r) == p*q + p*r   %-7s %s\n"</span>,
      p*(q+r) == p*q + p*r ? <span class="s">"yes"</span> : <span class="s">"NO"</span>,
      P*(Q+R) == P*Q + P*R ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    printf(<span class="s">"p + q == r             %-7s %s\n"</span>,
      p + q == r ? <span class="s">"yes"</span> : <span class="s">"NO"</span>,
      P + Q == R ? <span class="s">"yes"</span> : <span class="s">"NO"</span>);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term frag">law                    float   double
(a+b)+c == a+(b+c)     <span class="bad">NO</span>      <span class="ok">yes</span>
(p*q)*r == p*(q*r)     <span class="ok">yes</span>     <span class="bad">NO</span>
p*(q+r) == p*q + p*r   <span class="bad">NO</span>      <span class="ok">yes</span>
p + q == r             <span class="ok">yes</span>     <span class="bad">NO</span></div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Same four laws, same six starting values, and all four disagree between the two types.</li>
            <li>Both directions. Some fail in float and hold in double. Some do the reverse.</li>
            <li>So there is no list of laws that fail. There is only the question of where the rounding lands, at these magnitudes, in this type.</li>
            <li>Note especially the last row. In float, 0.1 + 0.2 really does equal 0.3. The famous bug is not about floats, it is about doubles.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">The last row usually causes an argument. Let it. Two roundings cancelled in float, and the extra precision of a double separated them.</div>
</section>

<!-- 08 -->
<section class="slide" data-t="03 · the reference" data-act="synthesis">
  <div>
    <h2>And one program worth keeping.</h2>
    <div class="prog">
      <div>
<pre class="xs"><span class="c">/* 03-types.c */</span>
<span class="k">#include</span> <span class="s">&lt;stdio.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;limits.h&gt;</span>
<span class="k">#include</span> <span class="s">&lt;float.h&gt;</span>

<span class="f">int</span> main(<span class="f">void</span>)
{
    printf(<span class="s">"char            %5zu   %-21d %d\n"</span>,
           <span class="k">sizeof</span>(<span class="f">char</span>),  CHAR_MIN, CHAR_MAX);
    printf(<span class="s">"short           %5zu   %-21d %d\n"</span>,
           <span class="k">sizeof</span>(<span class="f">short</span>), SHRT_MIN, SHRT_MAX);
    printf(<span class="s">"int             %5zu   %-21d %d\n"</span>,
           <span class="k">sizeof</span>(<span class="f">int</span>),   INT_MIN,  INT_MAX);
    printf(<span class="s">"long            %5zu   %-21ld %ld\n"</span>,
           <span class="k">sizeof</span>(<span class="f">long</span>),  LONG_MIN, LONG_MAX);
    printf(<span class="s">"float           %5zu   %-21.4g %.4g\n"</span>,
           <span class="k">sizeof</span>(<span class="f">float</span>),  FLT_MIN, FLT_MAX);
    printf(<span class="s">"double          %5zu   %-21.4g %.4g\n"</span>,
           <span class="k">sizeof</span>(<span class="f">double</span>), DBL_MIN, DBL_MAX);

    printf(<span class="s">"\ngap next to 1.0: float %g, double %g\n"</span>,
           FLT_EPSILON, DBL_EPSILON);
    <span class="k">return</span> <span class="s">0</span>;
}</pre>
      </div>
      <div>
        <div class="term xxs frag">type            bytes   smallest              largest
char                1   -128                  127
short               2   -32768                32767
int                 4   -2147483648           2147483647
long                8   -9223372036854775808  9223372036854775807
float               4   1.175e-38             3.403e+38
double              8   2.225e-308            1.798e+308

significant decimal digits:  float 6, double 15
gap next to 1.0:             float 1.19209e-07, double 2.22045e-16</div>
        <div class="rem frag">
          <div class="h">remember</div>
          <ul>
            <li>Nothing here is memorised. The compiler already knows, and <code>limits.h</code> and <code>float.h</code> will tell you.</li>
            <li>These numbers are not universal. Run it on a microcontroller and int is often two bytes.</li>
            <li>FLT_EPSILON is the gap next to 1.0, which is where every gap calculation in Class 8 started.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="cue">Tell them to keep this program. It answers questions they will otherwise guess at for years.</div>
</section>

<!-- 09 -->
<section class="slide" data-t="The ledger" data-act="the ledger">
  <div>
    <h2>Four failures went on the board in Class 1.</h2>
    <table class="ledger">
      <tr><th>failure</th><th>what was actually happening</th><th>status</th></tr>
      <tr><td>0.1 + 0.2</td><td>one tenth repeats forever in binary, so it is stored as the nearest float and two roundings do not cancel</td><td class="done">closed, Class 6</td></tr>
      <tr><td>Ariane 5</td><td>a 64 bit float written into a 16 bit integer with no range check, because the check was omitted on the strength of Ariane 4 flight data</td><td class="done">closed, Class 10</td></tr>
      <tr><td>the wallpaper crash</td><td>271 into eight bits keeps the low bits and gives 15</td><td class="open">mechanism known</td></tr>
      <tr><td>2038</td><td>a 32 bit signed counter reaching 2,147,483,647 and crossing to the negative half of the circle</td><td class="open">mechanism known</td></tr>
    </table>
    <p class="big frag" style="margin-top:14px;max-width:none;font-size:26px">Two are finished. For the other two you can now explain exactly what happened, and still not why <span style="color:var(--fail)">nothing said a word</span>.</p>
  </div>
  <div class="cue">Be precise about what is still owed. They know the mechanism. They do not know why there was no complaint.</div>
</section>

<!-- 10 -->
<section class="slide" data-t="What is still owed" data-act="the ledger">
  <div>
    <h2>The missing piece is not arithmetic.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p>When 271 goes into eight bits, something knows. A carry came off the end and had nowhere to go.</p>
        <p class="frag">That fact exists. It is a wire. Nobody in this arc could look at it, because we have never built anything that has wires.</p>
      </div>
      <div class="rem frag" style="margin-top:0">
        <div class="h">remember</div>
        <ul>
          <li>Overflow is not invisible to the hardware. It is invisible to the language.</li>
            <li>The processor sets a flag. C does not read it, so nothing reaches your program.</li>
          <li>You will build the adder in Class 20, feed it 271, and find the flag sitting there unread.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Eight sessions from now, and it will be their own circuit. That is why the story stays on the board.</div>
</section>

<!-- 11 -->
<section class="slide" data-t="Where you stand" data-act="handoff">
  <div>
    <h2>So here is exactly where you stand.</h2>
    <div class="can">
      <div class="box y">
        <div class="h">you can now</div>
        <ul>
          <li>Take any number and write it in any base, in either direction.</li>
          <li>Choose between four numeric schemes and defend the choice.</li>
          <li>Read a float's bits and say what value they hold, exactly.</li>
          <li>Predict a rounding error before running the program.</li>
          <li>Say why a conversion is unsafe, and write the check.</li>
          <li>Explain why a Hindi word is eighteen bytes.</li>
        </ul>
      </div>
      <div class="box n frag">
        <div class="h">you cannot yet</div>
        <ul>
          <li>Add two of them.</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="cue">Let the right hand box sit there with one line in it. Do not soften it.</div>
</section>

<!-- 12 -->
<section class="slide" data-t="Nothing computes" data-act="handoff">
  <div>
    <h2>Every scheme in this arc is a way of holding. Not one of them acts.</h2>
    <div class="split" style="margin-top:6px">
      <div class="stack">
        <p>Two's complement was chosen so that a machine which counts forwards would produce correct subtraction. We never built the thing that counts.</p>
        <p class="frag">The float layout puts the exponent above the mantissa so that comparing two floats can be done by comparing them as integers. We never built a comparator.</p>
      </div>
      <div class="stack frag">
        <p class="big">Every one of these representations was designed around a circuit,</p>
        <p class="big" style="color:var(--accent)">and we have not built a single circuit.</p>
      </div>
    </div>
  </div>
  <div class="cue">This is the sentence the arc was arranged to earn. Representation first, so the hardware arrives as a consequence rather than a coincidence.</div>
</section>

<!-- 13 -->
<section class="slide" data-t="Arc 2" data-act="handoff">
  <div class="center">
    <div class="kicker">arc two opens next session</div>
    <h2 style="font-size:52px;margin-bottom:26px">You can store 5.<br>What adds 1 to it?</h2>
    <p class="big" style="max-width:52ch;color:var(--soft)">Not what represents 6. You already know that. What physical thing takes the pattern for 5 and produces the pattern for 6.</p>
    <p class="big frag" style="margin-top:24px;max-width:46ch">Bring nothing. We start with two switches and a lamp.</p>
  </div>
  <div class="cue"><strong>Stop here.</strong> Send off: find the flag. Look up the status register of any processor and find the bit that would have caught 271.</div>
</section>

<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  function fit(){ var s=Math.min(window.innerWidth/1600, window.innerHeight/900);
    stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  window.addEventListener('resize',fit); fit();

  var deck=document.getElementById('deck');
  deck.appendChild(document.getElementById('slides').content.cloneNode(true));
  var slides=Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var N=slides.length,i=0,f=0;

  var rail=document.getElementById('rail'), jl=document.getElementById('jumplist');
  slides.forEach(function(s,k){
    rail.appendChild(document.createElement('i'));
    var li=document.createElement('li');
    li.innerHTML='<span>'+String(k+1).padStart(2,'0')+'</span>'+(s.dataset.t||'');
    li.onclick=function(){ i=k;f=0;paint(); document.getElementById('jump').classList.remove('open'); };
    jl.appendChild(li);
  });
  var ticks=rail.children, count=document.getElementById('count'), actlab=document.getElementById('actlab');

  function frags(){ return Array.prototype.slice.call(slides[i].querySelectorAll('.frag')); }
  function paint(){
    slides.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    for(var k=0;k<N;k++) ticks[k].className = k<i?'done':(k===i?'here':'');
    count.textContent=String(i+1).padStart(2,'0')+' / '+N;
    actlab.textContent=slides[i].dataset.act||'';
    frags().forEach(function(el,k){ el.classList.toggle('shown',k<f); });
  }
  function next(){ var n=frags().length; if(f<n){f++;paint();return;} if(i<N-1){i++;f=0;paint();} }
  function prev(){ if(f>0){f--;paint();return;} if(i>0){i--;f=slides[i].querySelectorAll('.frag').length;paint();} }

  document.addEventListener('keydown',function(e){
    var k=e.key,t=e.target.tagName;
    if((t==='INPUT'||t==='TEXTAREA')&&(k==='ArrowLeft'||k==='ArrowRight')) return;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev();}
    else if(k==='Home'){i=0;f=0;paint();}
    else if(k==='End'){i=N-1;f=0;paint();}
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
    else if(k==='n'||k==='N'){document.body.classList.toggle('cues');}
    else if(k==='o'||k==='O'){document.getElementById('jump').classList.toggle('open');}
    else if(k==='Escape'){document.getElementById('jump').classList.remove('open');}
  });
  var swallowClick=false;
  document.addEventListener('click',function(e){
    swallowClick = !!(e.target.closest('.panel')||e.target.closest('#jump')||e.target.closest('button')||e.target.closest('svg'));
  },true);
  document.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; return; }
    if(e.clientX<window.innerWidth*0.26) prev(); else next();
  });

  paint();
})();
</script>
